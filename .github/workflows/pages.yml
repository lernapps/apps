name: Pages

# Builds the site into _site/, checks it, and on main publishes it to the gh-pages branch, which GitHub Pages
# serves at https://lernapps.net/apps/. The same for every lernapps.net site: the steps are the shared
# actions in lernapps/tooling (npm ci, npm run build, npm run check; deploy to gh-pages without touching
# the previews). Renovate bumps the pinned commits.
#
# The change scope (lernapps/tooling changes.yml) gates the jobs: a change of only the plan (.vibe/**) runs nothing,
# one of only docs (docs/**/*.md) runs only the site's build, check and deployment, anything else runs everything.
# The job `site` always runs and reports the result: the required check, which never stays "Pending".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    uses: lernapps/tooling/.github/workflows/changes.yml@141ca8b78c27b78d8c2cddc06d0bfe25daad811f # main
    with:
      tooling-ref: 141ca8b78c27b78d8c2cddc06d0bfe25daad811f # the commit of @lernapps/tooling in package.json, and TOOLING_REF of the pre-push hook

  build: # builds and checks the site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: lernapps/tooling/actions/site-check@141ca8b78c27b78d8c2cddc06d0bfe25daad811f # main

  # The end-to-end tests (npm test): the listing validation on fixture entries against a fixture app, and the
  # creator's entry point (its links resolve, its command to start an app gives an app that passes lernapps check).
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    # also after a skipped test (a change of only docs), never after a failed or cancelled one
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.changes.outputs.site == 'true' &&
      needs.build.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    needs: [changes, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lernapps/tooling/actions/site-deploy@141ca8b78c27b78d8c2cddc06d0bfe25daad811f # main

  site: # required status check: always runs, fails when a job above failed or was cancelled
    needs: [changes, build, test, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "the jobs ended: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
