name: Pages

# Builds the site into _site/, checks it, and on main publishes it to the gh-pages branch, which GitHub Pages
# serves at https://lernapps.net/apps/. The same for every lernapps.net site: the steps are the shared
# actions in lernapps/tooling (npm ci, npm run build, npm run check; deploy to gh-pages without touching
# the previews). Renovate bumps the pinned commits.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site: # required status check (builds and checks the site)
    runs-on: ubuntu-latest
    steps:
      - uses: lernapps/tooling/actions/site-check@c8ed53fa1c8103765c20ab5d2acfd7604deec4a2 # main

  # The end-to-end tests (npm test): the listing validation on fixture entries against a fixture app, and the
  # creator's entry point (its links resolve, its command to start an app gives an app that passes lernapps check).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [site, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lernapps/tooling/actions/site-deploy@c8ed53fa1c8103765c20ab5d2acfd7604deec4a2 # main
