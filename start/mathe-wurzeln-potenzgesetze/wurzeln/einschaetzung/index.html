<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Schließe √5 ein. Welche Zahl der Form 2,x ist die größte, deren Quadrat noch kleiner als 5 ist?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a6">  </label>

<p class="question-explanation">2,2² = 4,84 ist kleiner als 5, und 2,3² = 5,29 ist größer als 5. Also liegt √5 zwischen 2,2 und 2,3.</p>

<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="question" id="frage-a7" data-id="a7" data-type="single-choice">

<fieldset>

<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>√49</strong></p><p>√49 = 7. Das ist eine natürliche Zahl.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>0,121212… (die Ziffern 12 wiederholen sich)</strong></p><p>Die Ziffern wiederholen sich: Das ist ein Bruch, nämlich <math><mfrac><mn>4</mn><mn>33</mn></mfrac></math>.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>√12</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>12 ist keine Quadratzahl. Also ist √12 irrational.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>1,75</strong></p><p>1,75 = <math><mfrac><mn>7</mn><mn>4</mn></mfrac></math>.</p></li>
</ul>
<p class="question-explanation">Eine Wurzel aus einer natürlichen Zahl ist irrational, wenn die Zahl unter der Wurzel keine Quadratzahl ist.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
