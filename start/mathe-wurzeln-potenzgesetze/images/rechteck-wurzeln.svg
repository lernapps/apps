<svg xmlns="http://www.w3.org/2000/svg" width="300" height="230" viewBox="0 0 300 230">
  <title>Rechteck mit den Seiten Wurzel aus 9 und Wurzel aus 4</title>
  <rect x="0" y="0" width="300" height="230" fill="#ffffff"/>
  <g fill="#bfdbfe" stroke="#1e3a8a" stroke-width="2">
    <rect x="40" y="30" width="60" height="60"/><rect x="100" y="30" width="60" height="60"/><rect x="160" y="30" width="60" height="60"/>
    <rect x="40" y="90" width="60" height="60"/><rect x="100" y="90" width="60" height="60"/><rect x="160" y="90" width="60" height="60"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#111827" text-anchor="middle">
    <text x="130" y="22">Seite √9 = 3</text>
    <text x="22" y="95" transform="rotate(-90 22 95)">Seite √4 = 2</text>
    <text x="130" y="178">Fläche √9 · √4 = 6</text>
    <text x="130" y="202">6 · 6 = 36 = 9 · 4</text>
  </g>
</svg>
