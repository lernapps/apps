<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="0 0 300 250">
  <title>Würfel aus 2 mal 2 mal 2 Einheitswürfeln</title>
  <rect x="0" y="0" width="300" height="250" fill="#ffffff"/>
  <g stroke="#14532d" stroke-width="2" stroke-linejoin="round">
    <polygon points="60,100 120,55 200,55 140,100" fill="#bbf7d0"/>
    <polygon points="140,100 200,55 200,135 140,180" fill="#86efac"/>
    <rect x="60" y="100" width="80" height="80" fill="#dcfce7"/>
  </g>
  <g stroke="#14532d" stroke-width="1.5">
    <line x1="100" y1="100" x2="100" y2="180"/><line x1="60" y1="140" x2="140" y2="140"/>
    <line x1="100" y1="100" x2="160" y2="55"/><line x1="90" y1="77.5" x2="170" y2="77.5"/>
    <line x1="140" y1="140" x2="200" y2="95"/><line x1="170" y1="77.5" x2="170" y2="157.5"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#111827" text-anchor="middle">
    <text x="100" y="204">Kante 2 cm</text>
    <text x="150" y="232">Volumen 2 · 2 · 2 = 8 cm³</text>
  </g>
</svg>
