<svg xmlns="http://www.w3.org/2000/svg" width="280" height="270" viewBox="0 0 280 270">
  <title>Quadrat mit Seite 3 aus 9 Einheitsquadraten</title>
  <rect x="0" y="0" width="280" height="270" fill="#ffffff"/>
  <g fill="#bfdbfe" stroke="#1e3a8a" stroke-width="2">
    <rect x="50" y="30" width="60" height="60"/><rect x="110" y="30" width="60" height="60"/><rect x="170" y="30" width="60" height="60"/>
    <rect x="50" y="90" width="60" height="60"/><rect x="110" y="90" width="60" height="60"/><rect x="170" y="90" width="60" height="60"/>
    <rect x="50" y="150" width="60" height="60"/><rect x="110" y="150" width="60" height="60"/><rect x="170" y="150" width="60" height="60"/>
  </g>
  <g font-family="sans-serif" font-size="18" fill="#111827" text-anchor="middle">
    <text x="140" y="233">Seite 3 m</text>
    <text x="25" y="125" transform="rotate(-90 25 125)">Seite 3 m</text>
    <text x="140" y="256">Fläche 3 · 3 = 9 m²</text>
  </g>
</svg>
