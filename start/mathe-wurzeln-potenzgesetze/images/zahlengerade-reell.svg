<svg xmlns="http://www.w3.org/2000/svg" width="420" height="140" viewBox="0 0 420 140">
  <title>Zahlengerade von −2 bis 3 mit rationalen und irrationalen Zahlen</title>
  <rect x="0" y="0" width="420" height="140" fill="#ffffff"/>
  <line x1="20" y1="70" x2="400" y2="70" stroke="#111827" stroke-width="2"/>
  <polygon points="400,70 391,65 391,75" fill="#111827"/>
  <g stroke="#111827" stroke-width="2">
    <line x1="40" y1="62" x2="40" y2="78"/><line x1="100" y1="62" x2="100" y2="78"/><line x1="160" y1="62" x2="160" y2="78"/>
    <line x1="220" y1="62" x2="220" y2="78"/><line x1="280" y1="62" x2="280" y2="78"/><line x1="340" y1="62" x2="340" y2="78"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#111827" text-anchor="middle">
    <text x="40" y="98">−2</text><text x="100" y="98">−1</text><text x="160" y="98">0</text><text x="220" y="98">1</text><text x="280" y="98">2</text><text x="340" y="98">3</text>
  </g>
  <circle cx="130" cy="70" r="6" fill="#1e3a8a"/>
  <text x="130" y="48" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle">−0,5</text>
  <circle cx="205" cy="70" r="6" fill="#1e3a8a"/>
  <text x="205" y="48" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle">0,75</text>
  <circle cx="245" cy="70" r="6" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
  <text x="250" y="28" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle">√2</text>
  <circle cx="349" cy="70" r="6" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
  <text x="349" y="48" font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle">π</text>
  <g font-family="sans-serif" font-size="12" fill="#111827">
    <circle cx="30" cy="124" r="5" fill="#1e3a8a"/><text x="42" y="128">rational (gefüllt)</text>
    <circle cx="190" cy="124" r="5" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/><text x="202" y="128">irrational (offen)</text>
  </g>
</svg>
