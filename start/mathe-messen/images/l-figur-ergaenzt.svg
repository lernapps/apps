<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img" aria-labelledby="t d">
<title id="t">L-förmige Figur, zu einem Rechteck ergänzt</title>
<desc id="d">Die L-förmige Figur aus dem Bild davor. Das fehlende Rechteck oben rechts, 4 m mal 3 m, ist gestrichelt eingezeichnet. Die Figur und die Ergänzung bilden zusammen ein Rechteck von 8 m mal 6 m.</desc>
<rect width="300" height="220" fill="#fff"/>
<rect x="140" y="20" width="100" height="75" fill="#fff" stroke="#b3541e" stroke-width="2.5" stroke-dasharray="7 5"/><polygon points="40,20 140,20 140,95 240,95 240,170 40,170" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/><text x="90" y="100" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">Figur</text><text x="190" y="55.5" font-size="13" font-family="sans-serif" fill="#111" text-anchor="middle">Ergänzung</text><text x="190" y="71.5" font-size="13" font-family="sans-serif" fill="#111" text-anchor="middle">4 m · 3 m</text><text x="140" y="192" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">8 m</text><text x="20" y="95" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle" transform="rotate(-90 20 95)">6 m</text>
</svg>
