<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 165" role="img" aria-labelledby="t d">
<title id="t">Raute mit Diagonalen</title>
<desc id="d">Eine Raute mit zwei gestrichelten Diagonalen e (waagerecht) und f (senkrecht), die sich in der Mitte im rechten Winkel schneiden und die Raute in vier gleiche Dreiecke teilen.</desc>
<rect width="300" height="165" fill="#fff"/>
<rect x="50" y="10" width="200" height="140" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="3 4"/><polygon points="150,10 250,80 150,150 50,80" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/><line x1="50" y1="80" x2="250" y2="80" stroke="#b3541e" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="150" y1="10" x2="150" y2="150" stroke="#b3541e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="205" y="73" font-size="14" font-family="sans-serif" fill="#111">e</text><text x="157" y="45" font-size="14" font-family="sans-serif" fill="#111">f</text>
</svg>
