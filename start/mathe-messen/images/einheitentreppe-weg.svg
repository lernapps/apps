<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="t d">
<title id="t">Der Weg von Meter nach Zentimeter</title>
<desc id="d">Die Einheitentreppe mit den Stufen mm, cm, dm, m und km. Ein Pfeil führt von m nach dm, ein zweiter von dm nach cm. An jedem Pfeil steht mal 10. In den markierten Stufen stehen die Werte 2,5 m, 25 dm und 250 cm.</desc>
<rect width="360" height="240" fill="#fff"/>
<rect x="10" y="170" width="60" height="40" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2"/><text x="40" y="192" font-size="15" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">mm</text><rect x="80" y="140" width="60" height="70" fill="#f6d9b5" stroke="#1f4e79" stroke-width="4"/><text x="110" y="162" font-size="15" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">cm</text><rect x="150" y="110" width="60" height="100" fill="#f6d9b5" stroke="#1f4e79" stroke-width="4"/><text x="180" y="132" font-size="15" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">dm</text><rect x="220" y="80" width="60" height="130" fill="#f6d9b5" stroke="#1f4e79" stroke-width="4"/><text x="250" y="102" font-size="15" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">m</text><rect x="290" y="50" width="60" height="160" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2"/><text x="320" y="72" font-size="15" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">km</text><text x="250" y="124" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">2,5 m</text><text x="180" y="154" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">25 dm</text><text x="110" y="184" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">250 cm</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#b3541e"/></marker></defs><path d="M230 70 C205 55 190 60 182 98" fill="none" stroke="#b3541e" stroke-width="3" marker-end="url(#a)"/><path d="M160 100 C135 85 120 90 112 128" fill="none" stroke="#b3541e" stroke-width="3" marker-end="url(#a)"/><text x="212" y="50" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">· 10</text><text x="142" y="80" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">· 10</text><text x="180" y="225" font-size="13" font-family="sans-serif" fill="#111" text-anchor="middle">Zwei Stufen nach unten: zweimal · 10</text>
</svg>
