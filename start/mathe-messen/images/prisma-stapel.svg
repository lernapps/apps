<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-labelledby="t d">
<title id="t">Prisma als Stapel von Dreiecken</title>
<desc id="d">Vier gleich große Dreiecksscheiben liegen übereinander. Jede hat die Grundfläche G. Zusammen sind sie ein Prisma mit der Höhe h.</desc>
<rect width="300" height="200" fill="#fff"/>
<polygon points="30,161 150,161 150,183 30,183" fill="#c2d9f0" stroke="#1f4e79" stroke-width="2.5"/><polygon points="150,161 110,121 110,143 150,183" fill="#d3e4f5" stroke="#1f4e79" stroke-width="2.5"/><polygon points="30,161 150,161 110,121" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/><polygon points="30,139 150,139 150,161 30,161" fill="#c2d9f0" stroke="#1f4e79" stroke-width="2.5"/><polygon points="150,139 110,99 110,121 150,161" fill="#d3e4f5" stroke="#1f4e79" stroke-width="2.5"/><polygon points="30,139 150,139 110,99" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/><polygon points="30,117 150,117 150,139 30,139" fill="#c2d9f0" stroke="#1f4e79" stroke-width="2.5"/><polygon points="150,117 110,77 110,99 150,139" fill="#d3e4f5" stroke="#1f4e79" stroke-width="2.5"/><polygon points="30,117 150,117 110,77" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/><polygon points="30,95 150,95 150,117 30,117" fill="#c2d9f0" stroke="#1f4e79" stroke-width="2.5"/><polygon points="150,95 110,55 110,77 150,117" fill="#d3e4f5" stroke="#1f4e79" stroke-width="2.5"/><polygon points="30,95 150,95 110,55" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/><text x="90" y="82" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">G</text><line x1="185" y1="95" x2="185" y2="183" stroke="#b3541e" stroke-width="2.5"/><line x1="110" y1="55" x2="110" y2="95" stroke="#333" stroke-width="2" stroke-dasharray="3 4"/><text x="14" y="48" font-size="12" font-family="sans-serif" fill="#111">Höhe des Dreiecks</text><text x="195" y="124" font-size="14" font-family="sans-serif" fill="#111">Höhe h</text>
