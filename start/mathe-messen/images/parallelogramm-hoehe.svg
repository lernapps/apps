<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" role="img" aria-labelledby="t d">
<title id="t">Parallelogramm mit Höhe</title>
<desc id="d">Ein Parallelogramm mit der Grundseite g unten. Eine gestrichelte senkrechte Linie von der oberen zur unteren Seite ist mit h beschriftet: die Höhe.</desc>
<rect width="300" height="150" fill="#fff"/>
<polygon points="40,110 90,40 220,40 170,110" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/><line x1="90" y1="40" x2="90" y2="110" stroke="#b3541e" stroke-width="2.5" stroke-dasharray="6 4"/><path d="M90 100 h12 v10" fill="none" stroke="#333" stroke-width="2" transform="translate(0,0) scale(1)" /><text x="98" y="85" font-size="14" font-family="sans-serif" fill="#111">h</text><text x="130" y="135" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">Grundseite g</text>
</svg>
