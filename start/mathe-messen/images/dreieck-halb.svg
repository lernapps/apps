<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" role="img" aria-labelledby="t d">
<title id="t">Parallelogramm aus zwei gleichen Dreiecken</title>
<desc id="d">Ein Parallelogramm mit Grundseite g und Höhe h. Eine gestrichelte Diagonale teilt es in zwei gleich große Dreiecke.</desc>
<rect width="300" height="170" fill="#fff"/>
<polygon points="40,130 190,130 260,30 110,30" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/><line x1="40" y1="130" x2="260" y2="30" stroke="#b3541e" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="110" y1="30" x2="110" y2="130" stroke="#333" stroke-width="2" stroke-dasharray="3 4"/><text x="115" y="85" font-size="14" font-family="sans-serif" fill="#111">h</text><text x="115" y="155" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">Grundseite g</text><text x="150" y="52" font-size="13" font-family="sans-serif" fill="#111">Dreieck 1</text><text x="122" y="118" font-size="13" font-family="sans-serif" fill="#111">Dreieck 2</text>
</svg>
