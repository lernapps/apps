<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img" aria-labelledby="t d">
<title id="t">Quader mit Ecke, Kante und Seitenfläche</title>
<desc id="d">Ein Quader. Eine Ecke ist mit E markiert, eine Kante mit K, eine Seitenfläche mit F. Die vorderen Kanten sind durchgezogen, die verdeckten gestrichelt.</desc>
<rect width="360" height="230" fill="#fff"/>
<polygon points="40,90 200,90 200,200 40,200" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/>
<polygon points="40,90 90,45 250,45 200,90" fill="#d3e4f5" stroke="#1f4e79" stroke-width="3"/>
<polygon points="200,90 250,45 250,155 200,200" fill="#c2d9f0" stroke="#1f4e79" stroke-width="3"/>
<g stroke="#1f4e79" stroke-width="2" stroke-dasharray="6 4" fill="none"><line x1="90" y1="45" x2="90" y2="155"/><line x1="90" y1="155" x2="250" y2="155"/><line x1="90" y1="155" x2="40" y2="200"/></g>
<circle cx="40" cy="200" r="6" fill="#b3541e"/>
<g font-family="sans-serif" font-size="15" fill="#111" font-weight="bold">
<text x="14" y="222">E</text><text x="116" y="84">K</text><text x="108" y="150">F</text>
</g>
<g font-family="sans-serif" font-size="13" fill="#111">
<text x="270" y="70">E: Ecke</text><text x="270" y="95">K: Kante</text><text x="270" y="120">F: Seitenfläche</text>
</g>
</svg>
