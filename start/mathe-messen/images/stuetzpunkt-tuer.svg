<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="t d">
<title id="t">Stützpunkt Tür</title>
<desc id="d">Eine Tür mit der Höhe 2 m und daneben eine Wand, die so hoch ist wie anderthalb Türen.</desc>
<rect width="360" height="240" fill="#fff"/>
<line x1="10" y1="210" x2="350" y2="210" stroke="#333" stroke-width="2"/>
<rect x="40" y="90" width="60" height="120" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/>

<g stroke="#1f4e79" stroke-width="2" fill="none"><line x1="25" y1="90" x2="25" y2="210"/><line x1="19" y1="90" x2="31" y2="90"/><line x1="19" y1="210" x2="31" y2="210"/></g>
<text x="12" y="155" font-family="sans-serif" font-size="14" fill="#111" transform="rotate(-90 12 155)" text-anchor="middle">2 m</text>
<text x="70" y="230" font-family="sans-serif" font-size="13" fill="#111" text-anchor="middle">Tür</text>
<rect x="200" y="30" width="120" height="180" fill="#f2f2f2" stroke="#333" stroke-width="3"/>
<g stroke="#b3541e" stroke-width="2" stroke-dasharray="6 4"><line x1="190" y1="90" x2="330" y2="90"/></g>

<text x="260" y="155" font-family="sans-serif" font-size="13" fill="#111" text-anchor="middle">1 Türhöhe</text>
<text x="260" y="62" font-family="sans-serif" font-size="13" fill="#111" text-anchor="middle">halbe Türhöhe</text>
<text x="260" y="228" font-family="sans-serif" font-size="13" fill="#111" text-anchor="middle">Wand</text>
</svg>
