<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" role="img" aria-labelledby="t d">
<title id="t">Prisma mit Grundfläche, Mantel und Höhe</title>
<desc id="d">Ein liegendes Prisma mit dreieckiger Grundfläche G vorne und gleich großer Deckfläche hinten. Die Seitenflächen sind Rechtecke und bilden den Mantel M. Die Höhe h ist der Abstand zwischen Grundfläche und Deckfläche.</desc>
<rect width="360" height="190" fill="#fff"/>
<polygon points="140,150 200,110 150,50 90,90" fill="#c2d9f0" stroke="#1f4e79" stroke-width="3"/><polygon points="40,150 140,150 90,90" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/><g stroke="#1f4e79" stroke-width="2" stroke-dasharray="6 4" fill="none"><line x1="40" y1="150" x2="100" y2="110"/><line x1="100" y1="110" x2="200" y2="110"/><line x1="100" y1="110" x2="150" y2="50"/></g><text x="90" y="135" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">G</text><text x="165" y="100" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">M</text><text x="178" y="140" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111">h</text><text x="230" y="70" font-size="13" font-family="sans-serif" fill="#111">G: Grundfläche</text><text x="230" y="92" font-size="13" font-family="sans-serif" fill="#111">M: Mantel</text><text x="230" y="114" font-size="13" font-family="sans-serif" fill="#111">h: Höhe</text><text x="230" y="136" font-size="13" font-family="sans-serif" fill="#111">hinten: Deckfläche</text>
</svg>
