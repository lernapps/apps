<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" role="img" aria-labelledby="t d">
<title id="t">Trapez in zwei Dreiecke zerlegt</title>
<desc id="d">Ein Trapez mit der Grundseite a unten, der kürzeren Grundseite c oben und der Höhe h. Eine gestrichelte Diagonale teilt es in zwei Dreiecke: eines mit Grundseite a, eines mit Grundseite c.</desc>
<rect width="260" height="160" fill="#fff"/>
<polygon points="30,120 210,120 160,30 80,30" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/><line x1="30" y1="120" x2="160" y2="30" stroke="#b3541e" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="160" y1="30" x2="160" y2="120" stroke="#333" stroke-width="2" stroke-dasharray="3 4"/><text x="120" y="145" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">Grundseite a</text><text x="120" y="22" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">Grundseite c</text><text x="166" y="80" font-size="14" font-family="sans-serif" fill="#111">h</text><text x="100" y="105" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">Dreieck unten</text><text x="105" y="48" font-size="11" font-family="sans-serif" fill="#111" text-anchor="middle">Dreieck oben</text>
</svg>
