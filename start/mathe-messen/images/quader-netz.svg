<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-labelledby="t d">
<title id="t">Netz eines Quaders</title>
<desc id="d">Das Netz eines Quaders mit 4 cm Länge, 3 cm Breite und 2 cm Höhe: sechs Rechtecke in Kreuzform. In der Mitte der Boden 4 mal 3, darüber die hintere Wand 4 mal 2, darunter die vordere Wand 4 mal 2 und der Deckel 4 mal 3, links und rechts je eine Seitenwand 2 mal 3. Seitenlängen in cm.</desc>
<rect width="320" height="280" fill="#fff"/>
<rect x="108" y="10" width="96" height="48" fill="#d3e4f5" stroke="#1f4e79" stroke-width="2.5"/><text x="156.0" y="38.0" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">hinten 4·2</text><rect x="60" y="58" width="48" height="72" fill="#c2d9f0" stroke="#1f4e79" stroke-width="2.5"/><text x="84.0" y="92.0" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">links</text><text x="84.0" y="108.0" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">2·3</text><rect x="108" y="58" width="96" height="72" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/><text x="156.0" y="98.0" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">Boden 4·3</text><rect x="204" y="58" width="48" height="72" fill="#c2d9f0" stroke="#1f4e79" stroke-width="2.5"/><text x="228.0" y="92.0" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">rechts</text><text x="228.0" y="108.0" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">2·3</text><rect x="108" y="130" width="96" height="48" fill="#d3e4f5" stroke="#1f4e79" stroke-width="2.5"/><text x="156.0" y="158.0" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">vorne 4·2</text><rect x="108" y="178" width="96" height="72" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/><text x="156.0" y="218.0" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">Deckel 4·3</text>
<text x="170" y="272" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">Seitenlängen in cm</text>
</svg>
