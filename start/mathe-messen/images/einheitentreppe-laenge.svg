<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="t d">
<title id="t">Einheitentreppe der Länge</title>
<desc id="d">Eine Treppe mit fünf Stufen von links unten nach rechts oben: Millimeter, Zentimeter, Dezimeter, Meter, dann Kilometer. Auf jeder Stufe steht, wie viele Einheiten der Stufe links daneben hineinpassen: 1 cm sind 10 mm, 1 dm sind 10 cm, 1 m sind 10 dm, 1 km sind 1000 m. Nach unten malnehmen, nach oben teilen.</desc>
<rect width="360" height="240" fill="#fff"/>
<g stroke="#333" stroke-width="2" fill="#e8f1fb">
<rect x="10" y="170" width="60" height="40"/><rect x="80" y="140" width="60" height="70"/><rect x="150" y="110" width="60" height="100"/><rect x="220" y="80" width="60" height="130"/><rect x="290" y="50" width="60" height="160"/>
</g>
<g font-family="sans-serif" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">
<text x="40" y="196">1 mm</text><text x="110" y="168">1 cm</text><text x="180" y="138">1 dm</text><text x="250" y="108">1 m</text><text x="320" y="78">1 km</text>
</g>
<g font-family="sans-serif" font-size="12" fill="#111" text-anchor="middle">
<text x="110" y="188">= 10 mm</text><text x="180" y="158">= 10 cm</text><text x="250" y="128">= 10 dm</text><text x="320" y="98">= 1000 m</text>
<text x="180" y="20" font-size="13">Nach unten malnehmen (·), nach oben teilen (:)</text>
</g>
</svg>
