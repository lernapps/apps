<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-labelledby="t d">
<title id="t">Rechteck mit einer Reihe Einheitsquadrate</title>
<desc id="d">Ein Rechteck, 5 cm breit und 3 cm hoch. Die oberste Reihe ist schon mit 5 Quadraten von 1 cm mal 1 cm ausgelegt. Der Rest ist leer.</desc>
<rect width="300" height="200" fill="#fff"/>
<rect x="60" y="30" width="40" height="40" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2"/><rect x="100" y="30" width="40" height="40" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2"/><rect x="140" y="30" width="40" height="40" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2"/><rect x="180" y="30" width="40" height="40" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2"/><rect x="220" y="30" width="40" height="40" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2"/><rect x="60" y="30" width="200" height="120" fill="none" stroke="#1f4e79" stroke-width="3"/><text x="160.0" y="174" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">5 cm</text><text x="30" y="90.0" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle" transform="rotate(-90 30 90.0)">3 cm</text><text x="160.0" y="114" font-size="13" font-family="sans-serif" fill="#111" text-anchor="middle">Hier ist noch Platz.</text>
</svg>
