<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 275" role="img" aria-labelledby="t d">
<title id="t">Besondere Vierecke</title>
<desc id="d">Vier Vierecke mit ihren Namen: Parallelogramm, Raute, Trapez und Drachen.</desc>
<rect width="360" height="275" fill="#fff"/>
<polygon points="30,90 60,35 150,35 120,90" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/><text x="95" y="125" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">Parallelogramm</text><polygon points="265,25 320,60 265,95 210,60" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/><text x="270" y="125" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">Raute</text><polygon points="25,220 55,165 125,165 160,220" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/><text x="95" y="255" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">Trapez</text><polygon points="265,150 315,180 265,235 215,180" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/><text x="270" y="255" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">Drachen</text>
</svg>
