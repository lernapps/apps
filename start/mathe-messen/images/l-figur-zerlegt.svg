<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img" aria-labelledby="t d">
<title id="t">L-förmige Figur, in zwei Rechtecke zerlegt</title>
<desc id="d">Eine L-förmige Figur: unten 8 m breit, links 6 m hoch, oben nur 4 m breit, der rechte Teil ist 3 m hoch. Eine gestrichelte Linie teilt sie in Teil 1 oben links und Teil 2 unten.</desc>
<rect width="300" height="220" fill="#fff"/>
<polygon points="40,20 140,20 140,95 240,95 240,170 40,170" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/><line x1="40" y1="95" x2="140" y2="95" stroke="#b3541e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="90" y="62.5" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">Teil 1</text><text x="140" y="137.5" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">Teil 2</text><text x="140" y="192" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">8 m</text><text x="20" y="95" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle" transform="rotate(-90 20 95)">6 m</text><text x="90" y="15" font-size="14" font-family="sans-serif" fill="#111" text-anchor="middle">4 m</text><text x="148" y="62.5" font-size="14" font-family="sans-serif" fill="#111">3 m</text>
</svg>
