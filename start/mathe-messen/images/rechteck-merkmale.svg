<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" role="img" aria-labelledby="t d">
<title id="t">Rechteck mit rechten Winkeln und parallelen Seiten</title>
<desc id="d">Ein Rechteck mit 5 cm Breite und 3 cm Höhe. An allen vier Ecken ist ein rechter Winkel eingezeichnet. Die oberen und unteren Seiten sind parallel, die linken und rechten Seiten auch.</desc>
<rect width="360" height="190" fill="#fff"/>
<rect x="60" y="30" width="200" height="120" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/>
<g fill="none" stroke="#333" stroke-width="2"><path d="M60 54 h24 v-24"/><path d="M260 54 h-24 v-24"/><path d="M60 126 h24 v24"/><path d="M260 126 h-24 v24"/></g>
<g font-family="sans-serif" font-size="14" fill="#111" text-anchor="middle">
<text x="160" y="172">Seite a: 5 cm</text>
<text x="292" y="95" text-anchor="start">Seite b:</text><text x="292" y="113" text-anchor="start">3 cm</text>
<text x="160" y="95">Rechteck</text>
</g>
</svg>
