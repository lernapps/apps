<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" role="img" aria-labelledby="t d">
<title id="t">Bleistift am Lineal</title>
<desc id="d">Ein Lineal von 0 bis 20 cm. Ein Bleistift liegt darüber. Sein linkes Ende steht bei 2 cm, seine Spitze bei 17 cm.</desc>
<rect width="360" height="120" fill="#fff"/>
<rect x="10" y="60" width="340" height="40" fill="#f6efd0" stroke="#333" stroke-width="2"/>
<g stroke="#333" stroke-width="1.5" font-family="sans-serif" font-size="11" fill="#111" text-anchor="middle">
<line x1="20" y1="60" x2="20" y2="80"/><text x="20" y="94">0</text>
<line x1="35" y1="60" x2="35" y2="72"/><line x1="50" y1="60" x2="50" y2="72"/>
<line x1="50" y1="60" x2="50" y2="80"/><text x="50" y="94">2</text>
<line x1="80" y1="60" x2="80" y2="80"/><text x="80" y="94">4</text>
<line x1="110" y1="60" x2="110" y2="80"/><text x="110" y="94">6</text>
<line x1="140" y1="60" x2="140" y2="80"/><text x="140" y="94">8</text>
<line x1="170" y1="60" x2="170" y2="80"/><text x="170" y="94">10</text>
<line x1="200" y1="60" x2="200" y2="80"/><text x="200" y="94">12</text>
<line x1="230" y1="60" x2="230" y2="80"/><text x="230" y="94">14</text>
<line x1="260" y1="60" x2="260" y2="80"/><text x="260" y="94">16</text>
<line x1="275" y1="60" x2="275" y2="72"/>
<line x1="290" y1="60" x2="290" y2="80"/><text x="290" y="94">18</text>
<line x1="320" y1="60" x2="320" y2="80"/><text x="320" y="94">20</text>
</g>
<polygon points="50,25 260,25 275,37 260,50 50,50" fill="#e8c34a" stroke="#333" stroke-width="2"/>
<polygon points="260,25 275,37 260,50" fill="#f0d9b5" stroke="#333" stroke-width="2"/>
<text x="275" y="94" font-size="11" font-family="sans-serif" fill="#111" text-anchor="middle">17</text><text x="345" y="112" font-family="sans-serif" font-size="11" fill="#111" text-anchor="end">cm</text>
</svg>
