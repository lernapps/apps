<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 165" role="img" aria-labelledby="t d">
<title id="t">Drachen mit Diagonalen</title>
<desc id="d">Ein Drachen mit zwei gestrichelten Diagonalen e (waagerecht) und f (senkrecht), die im rechten Winkel aufeinander stehen. Um den Drachen liegt ein gepunktetes Rechteck mit den Seiten e und f. Der Drachen füllt davon die Hälfte.</desc>
<rect width="300" height="165" fill="#fff"/>
<rect x="80" y="10" width="140" height="140" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="3 4"/><polygon points="150,10 220,60 150,150 80,60" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/><line x1="80" y1="60" x2="220" y2="60" stroke="#b3541e" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="150" y1="10" x2="150" y2="150" stroke="#b3541e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="190" y="53" font-size="14" font-family="sans-serif" fill="#111">e</text><text x="157" y="105" font-size="14" font-family="sans-serif" fill="#111">f</text>
</svg>
