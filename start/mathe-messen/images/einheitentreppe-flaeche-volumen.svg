<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="t d">
<title id="t">Einheitentreppen für Fläche und Volumen</title>
<desc id="d">Oben die Treppe der Flächeneinheiten cm², dm² und m²: 1 dm² sind 100 cm², 1 m² sind 100 dm². Unten die Treppe der Volumeneinheiten cm³, dm³ und m³: 1 dm³ sind 1000 cm³, 1 m³ sind 1000 dm³.</desc>
<rect width="360" height="300" fill="#fff"/>
<text x="10" y="22" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111">Fläche: jede Stufe mal 100</text><rect x="10" y="95" width="105" height="40" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/><text x="62" y="117" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">1 cm²</text><rect x="125" y="60" width="105" height="75" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/><text x="177" y="82" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">1 dm²</text><text x="177" y="100" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">= 100 cm²</text><rect x="240" y="25" width="105" height="110" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/><text x="292" y="47" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">1 m²</text><text x="292" y="65" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">= 100 dm²</text><text x="10" y="167" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111">Volumen: jede Stufe mal 1000</text><rect x="10" y="240" width="105" height="40" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/><text x="62" y="262" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">1 cm³</text><rect x="125" y="205" width="105" height="75" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/><text x="177" y="227" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">1 dm³</text><text x="177" y="245" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">= 1000 cm³</text><rect x="240" y="170" width="105" height="110" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/><text x="292" y="192" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111" text-anchor="middle">1 m³</text><text x="292" y="210" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">= 1000 dm³</text>
</svg>
