  <text x="44" y="74" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="normal" fill="#333">Dear Mum and Dad,</text>
  <text x="44" y="138" text-anchor="start" font-family="sans-serif" font-size="19" font-weight="normal" fill="#333">It is sunny in Millbrook today.</text>
  <text x="44" y="174" text-anchor="start" font-family="sans-serif" font-size="19" font-weight="normal" fill="#333">We play in the garden.</text>
  <text x="44" y="210" text-anchor="start" font-family="sans-serif" font-size="19" font-weight="normal" fill="#333">I am happy here.</text>
  <text x="44" y="292" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="normal" fill="#333">Love, Sophie</text>

