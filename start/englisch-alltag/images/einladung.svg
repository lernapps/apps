  <rect width="640" height="410" fill="#f4efe2"/>
  <rect x="30" y="20" width="580" height="370" rx="14" fill="#fff" stroke="#2c6fd8" stroke-width="5"/>
  <text x="60" y="62" text-anchor="start" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2c6fd8">Party invitation</text>
  <use href="#amir" transform="translate(500,24) scale(0.32)"/>
  <text x="60" y="100" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="normal" fill="#333">Dear Sophie, Ellie and Peter,</text>
  <rect x="50" y="126" width="100" height="34" rx="6" fill="#2c6fd8"/>
  <text x="100" y="150" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff">Who</text>
  <text x="166" y="150" text-anchor="start" font-family="sans-serif" font-size="19" font-weight="normal" fill="#333">I am Amir.</text>
  <line x1="50" y1="166" x2="590" y2="166" stroke="#333" stroke-width="1"/>
  <rect x="50" y="172" width="100" height="34" rx="6" fill="#2c6fd8"/>
  <text x="100" y="196" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff">What</text>
  <text x="166" y="196" text-anchor="start" font-family="sans-serif" font-size="19" font-weight="normal" fill="#333">my birthday party</text>
  <line x1="50" y1="212" x2="590" y2="212" stroke="#333" stroke-width="1"/>
  <rect x="50" y="218" width="100" height="34" rx="6" fill="#2c6fd8"/>
  <text x="100" y="242" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff">When</text>
  <text x="166" y="242" text-anchor="start" font-family="sans-serif" font-size="19" font-weight="normal" fill="#333">on Saturday afternoon, from three to six</text>
  <line x1="50" y1="258" x2="590" y2="258" stroke="#333" stroke-width="1"/>
  <rect x="50" y="264" width="100" height="34" rx="6" fill="#2c6fd8"/>
  <text x="100" y="288" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff">Where</text>
  <text x="166" y="288" text-anchor="start" font-family="sans-serif" font-size="19" font-weight="normal" fill="#333">at my house</text>
  <line x1="50" y1="304" x2="590" y2="304" stroke="#333" stroke-width="1"/>
  <rect x="50" y="310" width="100" height="34" rx="6" fill="#2c6fd8"/>
  <text x="100" y="334" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff">Answer</text>
  <text x="166" y="334" text-anchor="start" font-family="sans-serif" font-size="19" font-weight="normal" fill="#333">yes or no, please</text>
