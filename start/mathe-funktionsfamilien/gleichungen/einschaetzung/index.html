<label class="question-option"><input type="radio" name="frage-a6" value="1"> <span>4</span></label>

<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>64</strong></p><p>Das ist 8². Ergänzt wird aber das Quadrat der Hälfte von 8, also 4².</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>4</strong></p><p>Das ist die Hälfte von 8. Sie steht in der Klammer, ergänzt wird ihr Quadrat.</p></li>

</ul>
<p class="question-explanation">Zur quadratischen Ergänzung brauchst du die Hälfte der Zahl vor dem x und davon das Quadrat.</p>
