<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Terme beschreiben exponentielles Wachstum? Wähle alle richtigen.</legend>
<label class="question-option"><input type="checkbox" name="frage-a6" value="0"> <span>80 · 2ˣ</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="1"> <span>1000 · 0,95ˣ</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="2"> <span>1000 + 50x</span></label>
<label class="question-option"><input type="checkbox" name="frage-a6" value="3"> <span>1000 · 1,05ˣ</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>80 · 2ˣ</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Wert verdoppelt sich bei jedem Schritt, der Faktor 2 ist größer als 1.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>1000 · 0,95ˣ</strong></p><p>Der Faktor 0,95 ist kleiner als 1. Das ist Zerfall, der Wert nimmt ab.</p></li>

<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>1000 · 1,05ˣ</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Faktor 1,05 ist größer als 1, der Wert wächst jedes Mal um 5 %.</p></li>
</ul>
<p class="question-explanation">Exponentielles Wachstum hat die Form a · bˣ mit b größer als 1, Zerfall mit b zwischen 0 und 1.</p>

<li class="explainer-assessment-item" data-key="a9"><p class="explainer-assessment-label">Aufgabe 9</p><div class="question" id="frage-a9" data-id="a9" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was bedeutet log₂(8) = 3?</legend>
<label class="question-option"><input type="radio" name="frage-a9" value="0"> <span>2 · 3 = 8</span></label>
<label class="question-option"><input type="radio" name="frage-a9" value="1"> <span>8 : 2 = 3</span></label>
<label class="question-option"><input type="radio" name="frage-a9" value="2"> <span>2³ = 8</span></label>
<label class="question-option"><input type="radio" name="frage-a9" value="3"> <span>3² = 8</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>2 · 3 = 8</strong></p><p>Es wird potenziert, nicht multipliziert. 2 · 3 ist 6.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>8 : 2 = 3</strong></p><p>Der Logarithmus ist kein Teilen. 8 : 2 ist 4.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>2³ = 8</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Logarithmus ist der Exponent. Zur Basis 2 braucht man den Exponenten 3, um 8 zu erhalten.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>3² = 8</strong></p><p>Dann wären Basis und Exponent vertauscht. 3² ist 9, nicht 8.</p></li>
</ul>
<p class="question-explanation">log₂(8) = 3 ist eine andere Schreibweise für 2³ = 8.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
