<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Der Punkt steht auf dem Einheitskreis bei 90°, also ganz oben. Wie groß ist der Sinus?</legend>
<label class="question-option"><input type="radio" name="frage-a3" value="0"> <span>−1</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="1"> <span>90</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="2"> <span>1</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="3"> <span>0</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>−1</strong></p><p>Die Höhe −1 gehört zu 270°, ganz unten.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>90</strong></p><p>Das ist die Gradzahl des Winkels. Der Sinus ist die Höhe des Punkts, ein Wert zwischen −1 und 1.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>1</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Ganz oben ist die Höhe so groß wie der Radius, also 1.</p></li>

</ul>
<p class="question-explanation">Der Sinus ist die Höhe des Punkts auf dem Einheitskreis. Sie ist bei 90° am größten.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>

</div></li>

<fieldset>

<label class="question-option"><input type="radio" name="frage-a6" value="0"> <span>Die Kurve wird höher.</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="1"> <span>Die Kurve wird breiter, die Periode länger.</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="2"> <span>Die Kurve wird nach rechts verschoben.</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="3"> <span>Die Kurve wird enger, die Periode kürzer.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Die Kurve wird höher.</strong></p><p>Die Höhe bestimmt die Amplitude a, nicht b.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Die Kurve wird breiter, die Periode länger.</strong></p><p>Das wäre bei einem kleineren b so, denn die Periode ist 2π geteilt durch b.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Die Kurve wird nach rechts verschoben.</strong></p><p>Eine Verschiebung käme von einer Zahl in der Klammer (x − d). Hier gibt es sie nicht.</p></li>
<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>Die Kurve wird enger, die Periode kürzer.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Periode ist 2π geteilt durch b. Ein größeres b macht sie kleiner, die Welle wiederholt sich schneller.</p></li>
</ul>
<p class="question-explanation">b stellt ein, wie schnell sich der Vorgang wiederholt. Die Periode ist 2π geteilt durch b.</p>
</div>
