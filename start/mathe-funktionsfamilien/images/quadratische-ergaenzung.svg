<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" role="img" aria-label="Rechteckmodell: ein Quadrat x mal x, rechts und unten je ein Rechteck 3 mal x, in der Ecke ein gestricheltes Quadrat 3 mal 3">
<title>Quadratische Ergänzung im Rechteckmodell</title>
<style>
.q{fill:#cfe0ff;stroke:#1a2f66;stroke-width:1.5}
.r{fill:#ffe9b8;stroke:#5a3b00;stroke-width:1.5}
.e{fill:none;stroke:#1a1a1a;stroke-width:1.5;stroke-dasharray:5 4}
text{font:14px sans-serif;fill:#111}
</style>
<rect class="q" x="40" y="20" width="130" height="130"/>
<rect class="r" x="170" y="20" width="60" height="130"/>
<rect class="r" x="40" y="150" width="130" height="60"/>
<rect class="e" x="170" y="150" width="60" height="60"/>
<text x="105" y="90" text-anchor="middle"><tspan font-style="italic">x</tspan>²</text>
<text x="200" y="90" text-anchor="middle">3<tspan font-style="italic">x</tspan></text>
<text x="105" y="185" text-anchor="middle">3<tspan font-style="italic">x</tspan></text>
<text x="200" y="185" text-anchor="middle">9</text>
<text x="105" y="12" text-anchor="middle"><tspan font-style="italic">x</tspan></text>
<text x="200" y="12" text-anchor="middle">3</text>
<text x="28" y="90" text-anchor="end"><tspan font-style="italic">x</tspan></text>
<text x="28" y="185" text-anchor="end">3</text>
<text x="40" y="236" text-anchor="start" font-size="12">gestrichelt: ergänzt</text>
</svg>
