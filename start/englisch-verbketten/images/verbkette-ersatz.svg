<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 452" role="img">
  <title>Drei Verbketten mit Ersatzformen: had to pack, was able to swim und will be allowed to join. Bei be able to und be allowed to hat die Lok ein Glied mehr vor der Kupplung to</title>
  <rect width="560" height="452" fill="#f4efe2"/>
  <text x="14" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">have to</text>
  <rect x="14" y="36" width="130" height="56" rx="12" fill="#d9ecff" stroke="#333" stroke-width="3"/>
  <text x="79" y="73" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">had</text>
  <rect x="144" y="53" width="46" height="22" rx="11" fill="#ffd2d2" stroke="#333" stroke-width="3"/>
  <text x="167" y="70" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">to</text>
  <rect x="190" y="36" width="120" height="56" rx="6" fill="#fff3c4" stroke="#333" stroke-width="3"/>
  <text x="250" y="73" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">pack</text>
  <circle cx="39" cy="102" r="10" fill="#333"/>
  <circle cx="119" cy="102" r="10" fill="#333"/>
  <circle cx="215" cy="102" r="10" fill="#333"/>
  <circle cx="285" cy="102" r="10" fill="#333"/>
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222">
    <text x="79" y="132">Lok</text>
    <text x="167" y="148">Kupplung</text>
    <text x="250" y="132">Wagen</text>
  </g>
  <text x="14" y="166" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">be able to</text>
  <rect x="14" y="176" width="100" height="56" rx="12" fill="#d9ecff" stroke="#333" stroke-width="3"/>
  <text x="64" y="213" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">was</text>
  <rect x="114" y="176" width="110" height="56" rx="6" fill="#eaf4ff" stroke="#333" stroke-width="3"/>
  <text x="169" y="213" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">able</text>
  <rect x="224" y="193" width="46" height="22" rx="11" fill="#ffd2d2" stroke="#333" stroke-width="3"/>
  <text x="247" y="210" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">to</text>
  <rect x="270" y="176" width="120" height="56" rx="6" fill="#fff3c4" stroke="#333" stroke-width="3"/>
  <text x="330" y="213" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">swim</text>
  <circle cx="39" cy="242" r="10" fill="#333"/>
  <circle cx="89" cy="242" r="10" fill="#333"/>
  <circle cx="139" cy="242" r="10" fill="#333"/>
  <circle cx="199" cy="242" r="10" fill="#333"/>
  <circle cx="295" cy="242" r="10" fill="#333"/>
  <circle cx="365" cy="242" r="10" fill="#333"/>
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222">
    <text x="64" y="272">Lok</text>
    <text x="169" y="272">gehört zur Lok</text>
    <text x="247" y="288">Kupplung</text>
    <text x="330" y="272">Wagen</text>
  </g>
  <text x="14" y="306" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">be allowed to</text>
  <rect x="14" y="316" width="130" height="56" rx="12" fill="#d9ecff" stroke="#333" stroke-width="3"/>
  <text x="79" y="353" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">will be</text>
  <rect x="144" y="316" width="130" height="56" rx="6" fill="#eaf4ff" stroke="#333" stroke-width="3"/>
  <text x="209" y="353" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">allowed</text>
  <rect x="274" y="333" width="46" height="22" rx="11" fill="#ffd2d2" stroke="#333" stroke-width="3"/>
  <text x="297" y="350" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">to</text>
  <rect x="320" y="316" width="120" height="56" rx="6" fill="#fff3c4" stroke="#333" stroke-width="3"/>
  <text x="380" y="353" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">join</text>
  <circle cx="39" cy="382" r="10" fill="#333"/>
  <circle cx="119" cy="382" r="10" fill="#333"/>
  <circle cx="169" cy="382" r="10" fill="#333"/>
  <circle cx="249" cy="382" r="10" fill="#333"/>
  <circle cx="345" cy="382" r="10" fill="#333"/>
  <circle cx="415" cy="382" r="10" fill="#333"/>
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222">
    <text x="79" y="412">Lok</text>
    <text x="209" y="412">gehört zur Lok</text>
    <text x="297" y="428">Kupplung</text>
    <text x="380" y="412">Wagen</text>
  </g>
</svg>
