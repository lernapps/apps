<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 262" role="img">
  <title>Drei Verbketten im Passiv: will be painted, can be painted und has been painted. Die zweite Lok be (been) passt hinter jede erste Lok, der Wagen steht in der 3. Form.</title>
  <rect width="510" height="262" fill="#f4efe2"/>
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#222">
    <text x="70" y="24">erste Lok</text><text x="180" y="24">zweite Lok</text><text x="285" y="24">Kupplung</text><text x="415" y="24">Wagen</text>
  </g>
  <g font-family="sans-serif" font-size="22" text-anchor="middle" fill="#222" stroke="#333" stroke-width="3">
    <rect x="20" y="36" width="100" height="50" rx="10" fill="#d9ecff"/>
    <rect x="130" y="36" width="100" height="50" rx="10" fill="#d9ecff"/>
    <rect x="230" y="50" width="110" height="22" rx="11" fill="#ffd2d2"/>
    <rect x="340" y="36" width="150" height="50" rx="6" fill="#fff3c4"/>
    <rect x="20" y="106" width="100" height="50" rx="10" fill="#d9ecff"/>
    <rect x="130" y="106" width="100" height="50" rx="10" fill="#d9ecff"/>
    <rect x="230" y="120" width="110" height="22" rx="11" fill="#ffd2d2"/>
    <rect x="340" y="106" width="150" height="50" rx="6" fill="#fff3c4"/>
    <rect x="20" y="176" width="100" height="50" rx="10" fill="#d9ecff"/>
    <rect x="130" y="176" width="100" height="50" rx="10" fill="#d9ecff"/>
    <rect x="230" y="190" width="110" height="22" rx="11" fill="#ffd2d2"/>
    <rect x="340" y="176" width="150" height="50" rx="6" fill="#fff3c4"/>
  </g>
  <g font-family="sans-serif" font-size="22" text-anchor="middle" fill="#222">
    <text x="70" y="69">will</text><text x="180" y="69">be</text><text x="415" y="69">painted</text>
    <text x="70" y="139">can</text><text x="180" y="139">be</text><text x="415" y="139">painted</text>
    <text x="70" y="209">has</text><text x="180" y="209">been</text><text x="415" y="209">painted</text>
    <g font-size="16"><text x="285" y="67">3. Form</text><text x="285" y="137">3. Form</text><text x="285" y="207">3. Form</text></g>
  </g>
  <text x="255" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222">Die Lok be verlangt vom Wagen die 3. Form (painted).</text>
</svg>
