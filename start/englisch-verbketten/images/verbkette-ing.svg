<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 175" role="img">
  <title>Eine Verbkette mit der Kupplung -ing: Die Lok enjoy verlangt vom Wagen die -ing-Form swimming</title>
  <rect width="480" height="175" fill="#f4efe2"/>
  <rect x="20" y="30" width="150" height="64" rx="12" fill="#d9ecff" stroke="#333" stroke-width="3"/>
  <text x="95" y="72" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#222">enjoy</text>
  <rect x="170" y="52" width="60" height="22" rx="11" fill="#ffd2d2" stroke="#333" stroke-width="3"/>
  <text x="200" y="69" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">-ing</text>
  <rect x="230" y="30" width="170" height="64" rx="6" fill="#fff3c4" stroke="#333" stroke-width="3"/>
  <text x="315" y="72" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">swimming</text>
  <circle cx="55" cy="104" r="10" fill="#333"/><circle cx="135" cy="104" r="10" fill="#333"/>
  <circle cx="270" cy="104" r="10" fill="#333"/><circle cx="360" cy="104" r="10" fill="#333"/>
  <text x="95" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">Lok</text>
  <text x="200" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">Kupplung</text>
  <text x="200" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222">(verlangt -ing)</text>
  <text x="315" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">Wagen</text>
  <text x="315" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222">(in der -ing-Form)</text>
</svg>
