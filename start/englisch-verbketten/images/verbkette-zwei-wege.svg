<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img">
  <title>Zwei Verbketten mit derselben Lok remember: oben mit der Kupplung to und dem Wagen call (daran denken, anzurufen), unten mit der Kupplung -ing und dem Wagen calling (sich erinnern, angerufen zu haben)</title>
  <rect width="480" height="320" fill="#f4efe2"/>
  <rect x="20" y="30" width="170" height="64" rx="12" fill="#d9ecff" stroke="#333" stroke-width="3"/>
  <text x="105" y="72" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#222">remember</text>
  <rect x="190" y="52" width="50" height="22" rx="11" fill="#ffd2d2" stroke="#333" stroke-width="3"/>
  <text x="215" y="69" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">to</text>
  <rect x="240" y="30" width="130" height="64" rx="6" fill="#fff3c4" stroke="#333" stroke-width="3"/>
  <text x="305" y="72" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">call</text>
  <circle cx="55" cy="104" r="10" fill="#333"/><circle cx="155" cy="104" r="10" fill="#333"/>
  <circle cx="275" cy="104" r="10" fill="#333"/><circle cx="335" cy="104" r="10" fill="#333"/>
  <text x="105" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">Lok</text>
  <text x="215" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">Kupplung</text>
  <text x="305" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">Wagen</text>
  <text x="240" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222">remember to call = daran denken, anzurufen</text>
  <rect x="20" y="170" width="170" height="64" rx="12" fill="#d9ecff" stroke="#333" stroke-width="3"/>
  <text x="105" y="212" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#222">remember</text>
  <rect x="190" y="192" width="60" height="22" rx="11" fill="#ffd2d2" stroke="#333" stroke-width="3"/>
  <text x="220" y="209" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">-ing</text>
  <rect x="250" y="170" width="160" height="64" rx="6" fill="#fff3c4" stroke="#333" stroke-width="3"/>
  <text x="330" y="212" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">calling</text>
  <circle cx="55" cy="244" r="10" fill="#333"/><circle cx="155" cy="244" r="10" fill="#333"/>
  <circle cx="290" cy="244" r="10" fill="#333"/><circle cx="370" cy="244" r="10" fill="#333"/>
  <text x="105" y="272" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">Lok</text>
  <text x="220" y="272" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">Kupplung</text>
  <text x="330" y="272" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">Wagen</text>
  <text x="240" y="298" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222">remember calling = sich erinnern, angerufen zu haben</text>
</svg>
