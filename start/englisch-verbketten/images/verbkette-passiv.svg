<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" role="img">
  <title>Eine Verbkette im Passiv: Die Lok is (eine Form von be) zieht über die Kupplung 3. Form den Wagen made</title>
  <rect width="480" height="180" fill="#f4efe2"/>
  <rect x="30" y="30" width="110" height="64" rx="12" fill="#d9ecff" stroke="#333" stroke-width="3"/>
  <text x="85" y="72" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">is</text>
  <rect x="140" y="52" width="90" height="22" rx="11" fill="#ffd2d2" stroke="#333" stroke-width="3"/>
  <text x="185" y="69" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">3. Form</text>
  <rect x="230" y="30" width="150" height="64" rx="6" fill="#fff3c4" stroke="#333" stroke-width="3"/>
  <text x="305" y="72" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">made</text>
  <circle cx="65" cy="104" r="10" fill="#333"/><circle cx="115" cy="104" r="10" fill="#333"/>
  <circle cx="265" cy="104" r="10" fill="#333"/><circle cx="345" cy="104" r="10" fill="#333"/>
  <g font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222">
    <text x="85" y="132">Lok: be</text>
    <text x="185" y="132">Kupplung</text>
    <text x="305" y="132">Wagen</text>
    <text x="185" y="152">Die Lok be verlangt vom Wagen</text>
    <text x="185" y="168">die 3. Form (made).</text>
  </g>
</svg>
