<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" role="img">
  <title>Eine Skala von fest nach offen mit vier Wörtern: must, should, could, might</title>
  <rect width="420" height="170" fill="#f4efe2"/>
  <line x1="40" y1="70" x2="380" y2="70" stroke="#333" stroke-width="4"/>
  <polygon points="380,60 400,70 380,80" fill="#333"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#222">
    <circle cx="60" cy="70" r="12" fill="#3a6fd8" stroke="#333" stroke-width="2"/>
    <circle cx="150" cy="70" r="12" fill="#6f9de8" stroke="#333" stroke-width="2"/>
    <circle cx="250" cy="70" r="12" fill="#a9c6f2" stroke="#333" stroke-width="2"/>
    <circle cx="340" cy="70" r="12" fill="#d9e6f9" stroke="#333" stroke-width="2"/>
    <text x="60" y="112" font-size="20">must</text>
    <text x="150" y="112" font-size="20">should</text>
    <text x="250" y="112" font-size="20">could</text>
    <text x="340" y="112" font-size="20">might</text>
    <text x="60" y="36" font-size="15">fest</text>
    <text x="340" y="36" font-size="15">offen</text>
    <text x="210" y="150" font-size="14">Je weiter rechts, desto offener ist die Sache.</text>
  </g>
</svg>
