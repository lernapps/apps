<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 165" role="img">
  <title>Eine Verbkette mit Kupplung: Die Lok would like ist über die Kupplung to mit dem Wagen swim verbunden</title>
  <rect width="480" height="165" fill="#f4efe2"/>
  <rect x="20" y="30" width="170" height="64" rx="12" fill="#d9ecff" stroke="#333" stroke-width="3"/>
  <text x="105" y="72" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#222">would like</text>
  <rect x="190" y="52" width="50" height="22" rx="11" fill="#ffd2d2" stroke="#333" stroke-width="3"/>
  <text x="215" y="69" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">to</text>
  <rect x="240" y="30" width="150" height="64" rx="6" fill="#fff3c4" stroke="#333" stroke-width="3"/>
  <text x="315" y="72" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">swim</text>
  <circle cx="55" cy="104" r="10" fill="#333"/><circle cx="155" cy="104" r="10" fill="#333"/>
  <circle cx="275" cy="104" r="10" fill="#333"/><circle cx="360" cy="104" r="10" fill="#333"/>
  <text x="105" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">Lok</text>
  <text x="215" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">Kupplung</text>
  <text x="315" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">Wagen</text>
</svg>
