<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img">
  <title>Einen Satz umdrehen: Aus The bakers make bread wird Bread is made by the bakers</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
  <rect width="520" height="250" fill="#f4efe2"/>
  <g font-family="sans-serif" fill="#222" text-anchor="middle">
    <text x="32" y="52" font-size="14">Aktiv</text>
    <text x="32" y="212" font-size="14">Passiv</text>
    <rect x="70" y="25" width="130" height="50" rx="8" fill="#fff" stroke="#333" stroke-width="3"/>
    <text x="135" y="57" font-size="20">The bakers</text>
    <rect x="210" y="25" width="100" height="50" rx="8" fill="#d9ecff" stroke="#333" stroke-width="3"/>
    <text x="260" y="57" font-size="20">make</text>
    <rect x="320" y="25" width="130" height="50" rx="8" fill="#fff" stroke="#333" stroke-width="3"/>
    <text x="385" y="57" font-size="20">bread</text>
    <rect x="70" y="180" width="110" height="50" rx="8" fill="#fff" stroke="#333" stroke-width="3"/>
    <text x="125" y="212" font-size="20">Bread</text>
    <rect x="190" y="180" width="50" height="50" rx="8" fill="#d9ecff" stroke="#333" stroke-width="3"/>
    <text x="215" y="212" font-size="20">is</text>
    <rect x="240" y="194" width="14" height="22" rx="7" fill="#ffd2d2" stroke="#333" stroke-width="2"/>
    <rect x="254" y="180" width="76" height="50" rx="8" fill="#fff3c4" stroke="#333" stroke-width="3"/>
    <text x="292" y="212" font-size="20">made</text>
    <rect x="340" y="188" width="150" height="34" rx="8" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="415" y="211" font-size="15">by the bakers</text>
  </g>
  <line x1="385" y1="80" x2="135" y2="174" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="135" y1="80" x2="410" y2="182" stroke="#333" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="260" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222" stroke="#f4efe2" stroke-width="5" paint-order="stroke">tauschen</text>
</svg>
