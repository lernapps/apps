<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../das-passiv/">Das Passiv</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>

<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welcher Passivsatz passt zu welchem Aktivsatz?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Amir writes the letter.</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">The cup was broken by Peter.</option><option value="0">The letter is written by Amir.</option><option value="2">The biscuits were bought by Mrs Parker.</option><option value="3">The cup was broke by Peter.</option><option value="4">The biscuits was bought by Mrs Parker.</option></select></label></li>
<li><label><span>Peter broke the cup.</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">The cup was broken by Peter.</option><option value="0">The letter is written by Amir.</option><option value="2">The biscuits were bought by Mrs Parker.</option><option value="3">The cup was broke by Peter.</option><option value="4">The biscuits was bought by Mrs Parker.</option></select></label></li>
<li><label><span>Mrs Parker bought the biscuits.</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">The cup was broken by Peter.</option><option value="0">The letter is written by Amir.</option><option value="2">The biscuits were bought by Mrs Parker.</option><option value="3">The cup was broke by Peter.</option><option value="4">The biscuits was bought by Mrs Parker.</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Amir writes the letter. – The letter is written by Amir.; Peter broke the cup. – The cup was broken by Peter.; Mrs Parker bought the biscuits. – The biscuits were bought by Mrs Parker.</p>
<p class="question-explanation">Die Lok zeigt Zeit und Zahl (is, was, were), und der Wagen fährt in der dritten Form.</p>

</ul>

<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Die Karten sind schon verkauft worden. – The tickets have already been sold.; Der Raum wird morgen geputzt werden. – The room will be cleaned tomorrow.; Das Fenster kann nicht geöffnet werden. – The window can't be opened.</p>
<p class="question-explanation">Hinter has und have steht been, hinter will und can steht be. Der Wagen fährt immer in der dritten Form.</p>
