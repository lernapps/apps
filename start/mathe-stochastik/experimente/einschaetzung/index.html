<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../experimente/">Experimentieren mit dem Zufall</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 8 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Eine Münze fiel fünfmal hintereinander auf Zahl. Was gilt für den sechsten Wurf?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Kopf ist jetzt eher dran, damit es sich ausgleicht.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Kopf und Zahl haben wieder dieselbe Chance.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Zahl kommt eher, weil sie schon oft kam.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Kopf ist jetzt eher dran, damit es sich ausgleicht.</strong></p><p>Ein Ausgleich passiert nicht Wurf für Wurf. Erst bei sehr vielen Würfen fallen die ersten Würfe im Anteil kaum noch ins Gewicht. In der Anzahl gleicht sich nichts aus.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Kopf und Zahl haben wieder dieselbe Chance.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Münze merkt sich nichts. Jeder Wurf ist ein neuer Zufallsversuch unter gleichen Bedingungen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Zahl kommt eher, weil sie schon oft kam.</strong></p><p>Auch das stimmt nicht. Frühere Würfe ändern nichts am nächsten Wurf.</p></li>
</ul>
<p class="question-explanation">Zufallsversuche haben kein Gedächtnis. Jeder Wurf beginnt neu.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-assessment-live"></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Mia hat die Reißzwecke 200-mal geworfen. Die relative Häufigkeit von „Spitze oben“ ist 0,36. Wie oft lag die Spitze oben?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a4">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 72</p>
<p class="question-explanation">Die relative Häufigkeit ist die absolute geteilt durch die Zahl aller Würfe. Umgekehrt ergibt 0,36 von 200 Würfen 72 Würfe.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Zahl kann keine Wahrscheinlichkeit sein?</legend>
<label class="question-option"><input type="radio" name="frage-a6" value="0"> <span>0</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="1"> <span>1,2</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="2"> <span>0,35</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="3"> <span>1</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>0</strong></p><p>0 ist erlaubt. Es ist die Wahrscheinlichkeit eines unmöglichen Ereignisses.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>1,2</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Wahrscheinlichkeiten liegen zwischen 0 und 1. Mehr als sicher geht nicht.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>0,35</strong></p><p>0,35 liegt zwischen 0 und 1 und ist erlaubt.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>1</strong></p><p>1 ist erlaubt. Es ist die Wahrscheinlichkeit eines sicheren Ereignisses.</p></li>
</ul>
<p class="question-explanation">Eine Wahrscheinlichkeit ist nie kleiner als 0 und nie größer als 1.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-back">Zurück</button> <button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="2" aria-labelledby="teil-3" hidden>
<h2 id="teil-3" tabindex="-1">Seite 3 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="question" id="frage-a8" data-id="a8" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Mia hat drei Durchläufe gemacht. Bis zur ersten Sechs brauchte sie 4, 9 und 2 Würfe. Wie viele Würfe sind das im Durchschnitt pro Durchlauf? Der Durchschnitt ist die Summe aller Würfe geteilt durch die Zahl der Durchläufe.</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a8">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 5</p>
<p class="question-explanation">Zusammen sind es 4 + 9 + 2 = 15 Würfe in 3 Durchläufen. Das sind 15 geteilt durch 3, also 5 Würfe pro Durchlauf. Mit nur drei Durchläufen ist das aber erst ein grober Schätzwert.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-back">Zurück</button> <button type="button" class="explainer-assessment-finish">Auswerten</button></p>
