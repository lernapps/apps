<li class="question-info" data-option="2"><p class="question-info-head"><strong>Bei der ersten Seite anfangen.</strong></p><p>Ein Buch beginnt auch vorn. Der Stadtführer hat dafür die Startseite.</p></li>
</ul>
<p class="question-explanation">In einem Hypertext springst du über Links von Seite zu Seite und wählst selbst den Weg.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>

<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="question" id="frage-a8" data-id="a8" data-type="single-choice">

<legend class="question-text">Welche Seite in Jonas Entwurf ist eine Sackgasse?</legend>
<div class="question-material"><figure class="block-figure"><div class="block-image-credit block-image-fill"><img src="../images/entwurf-de.svg" alt="Fünf Kästchen, in der Mitte die Startseite. Pfeile führen von der Startseite zu Schule und Bus, von Schule zu Bücherei, von Bus zu Schwimmbad, vom Schwimmbad zur Startseite und zum Bus." loading="lazy" decoding="async"><span class="block-credit" tabindex="0" role="img" data-info="Quelle: eigene Zeichnung, Oliver Jägle. Lizenz: CC-BY-4.0." aria-label="Quelle: eigene Zeichnung, Oliver Jägle. Lizenz: CC-BY-4.0.">© CC-BY-4.0</span></div><figcaption><p>Jonas Entwurf. Jeder Pfeil ist ein Link.</p></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a8" value="0"> <span>Bücherei</span></label>
<label class="question-option"><input type="radio" name="frage-a8" value="1"> <span>Schwimmbad</span></label>
<label class="question-option"><input type="radio" name="frage-a8" value="2"> <span>Schule</span></label>

<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>

<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Bücherei</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Ein Pfeil führt zur Bücherei, aber keiner weg. Wer dort ist, kommt mit keinem Link weiter.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Schwimmbad</strong></p><p>Vom Schwimmbad führen zwei Pfeile weg, zur Startseite und zum Bus.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Schule</strong></p><p>Von der Schule führt ein Pfeil zur Bücherei. Du kommst also weiter.</p></li>
</ul>
<p class="question-explanation">Als Graph ist eine Sackgasse ein Knoten, von dem kein Pfeil wegführt. Jona braucht einen Link auf der Seite Bücherei, zum Beispiel zur Startseite.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
