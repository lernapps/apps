<!-- Startseite des Stadtführers mit zwei Links. Eigene Zeichnung, Oliver Jägle, CC-BY-4.0. Stil wie der Baum von lernapps/informatik-daten-codieren (images/baum-zimmer.svg). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img">
<title>Startseite des Stadtführers</title>
<rect width="400" height="250" fill="#fff"/>
<rect x="10" y="10" width="380" height="200" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="10" y="10" width="380" height="36" rx="8" fill="#e8f0fb" stroke="#333" stroke-width="2"/>
<text x="26" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222">Startseite: Unser Viertel</text>
<text x="26" y="84" font-family="sans-serif" font-size="18" fill="#222">Hallo, liebe Fünfer!</text>
<text x="26" y="118" font-family="sans-serif" font-size="18" fill="#222">Hier findet ihr den</text>
<text x="26" y="152" font-family="sans-serif" font-size="18" fill="#222"><tspan font-family="sans-serif" font-size="18" fill="#1a4fb3" text-decoration="underline" font-weight="bold">Weg zur Schule</tspan> und den</text>
<text x="26" y="186" font-family="sans-serif" font-size="18" fill="#222"><tspan font-family="sans-serif" font-size="18" fill="#1a4fb3" text-decoration="underline" font-weight="bold">Busplan</tspan>.</text>
</svg>
