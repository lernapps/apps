<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">A guessing program tries all possibilities, character by character. Which password takes it the longest?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>tomatobicyclecloudrain (22 lowercase letters)</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>Dog!7x (6 characters, four kinds)</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>selin2014 (9 characters)</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="3"> <span>Abc12345 (8 characters)</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>tomatobicyclecloudrain (22 lowercase letters)</strong> <span class="question-badge question-badge-right">right answer</span></p><p>On average about 21 trillion years.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Dog!7x (6 characters, four kinds)</strong></p><p>95 to the power of 6: about 37 seconds.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>selin2014 (9 characters)</strong></p><p>36 to the power of 9: about an hour, and it is near the top of attackers' lists.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Abc12345 (8 characters)</strong></p><p>62 to the power of 8: about 3 hours, and patterns like this are near the top of attackers' lists.</p></li>
</ul>
<p class="question-explanation">The longest password wins, even though it only has lowercase letters. That is why the BSI advises very long passwords.</p>

<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>Trojan</span> <select name="frage-a6-0" data-left="0"><option value="">please choose</option><option value="3">copies itself into other files and travels on with them</option><option value="4">checks which connections may get into the device</option><option value="2">shows “Pay, then you get your photos back”</option><option value="1">jumps from device to device without help</option><option value="0">looks like a useful game</option></select></label></li>
<li><label><span>worm</span> <select name="frage-a6-1" data-left="1"><option value="">please choose</option><option value="3">copies itself into other files and travels on with them</option><option value="4">checks which connections may get into the device</option><option value="2">shows “Pay, then you get your photos back”</option><option value="1">jumps from device to device without help</option><option value="0">looks like a useful game</option></select></label></li>

<li><label><span>virus</span> <select name="frage-a6-3" data-left="3"><option value="">please choose</option><option value="3">copies itself into other files and travels on with them</option><option value="4">checks which connections may get into the device</option><option value="2">shows “Pay, then you get your photos back”</option><option value="1">jumps from device to device without help</option><option value="0">looks like a useful game</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> Trojan – looks like a useful game; worm – jumps from device to device without help; ransomware – shows “Pay, then you get your photos back”; virus – copies itself into other files and travels on with them</p>
<p class="question-explanation">The Trojan disguises itself, the worm spreads on its own, the virus copies itself into other programs, and ransomware wants money.</p>

<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Task 7</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Task 8</p><div class="question" id="frage-a8" data-id="a8" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Which settings make Selin's tablet safer? Choose everything that is true.</legend>
<label class="question-option"><input type="checkbox" name="frage-a8" value="0"> <span>turning on automatic updates</span></label>
<label class="question-option"><input type="checkbox" name="frage-a8" value="1"> <span>a screen lock with a PIN</span></label>
<label class="question-option"><input type="checkbox" name="frage-a8" value="2"> <span>getting apps from any website if they are free there</span></label>
<label class="question-option"><input type="checkbox" name="frage-a8" value="3"> <span>giving every app all the permissions it asks for</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>turning on automatic updates</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Yes. Then security holes are closed quickly.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>a screen lock with a PIN</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Yes. Whoever finds the tablet cannot get in. After a few wrong tries they have to wait a long time, so a PIN already helps here.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>getting apps from any website if they are free there</strong></p><p>The BSI advises getting apps only from trusted sources, such as the device's app store.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>giving every app all the permissions it asks for</strong></p><p>Check whether the app really needs them. If in doubt, better not install it.</p></li>
</ul>
<p class="question-explanation">Automatic updates, a lock with a PIN, apps from the store and only the permissions that are needed.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
