<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../schuetzen/">Daten sichern und schützen</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 8 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ein Rateprogramm probiert Zeichen für Zeichen alle Möglichkeiten durch. Bei welchem Passwort braucht es am längsten?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>tomatefahrradwolkeregen (23 kleine Buchstaben)</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>Hund!7 (6 Zeichen, vier Zeichenarten)</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>selin2014 (9 Zeichen)</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="3"> <span>Abc12345 (8 Zeichen)</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>tomatefahrradwolkeregen (23 kleine Buchstaben)</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Im Mittel ungefähr 560 Billionen Jahre.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Hund!7 (6 Zeichen, vier Zeichenarten)</strong></p><p>95 hoch 6: ungefähr 37 Sekunden.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>selin2014 (9 Zeichen)</strong></p><p>36 hoch 9: ungefähr eine Stunde, und auf den Listen der Angreifer steht es weit vorn.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Abc12345 (8 Zeichen)</strong></p><p>62 hoch 8: ungefähr 3 Stunden, und solche Muster stehen auf den Listen der Angreifer weit vorn.</p></li>
</ul>
<p class="question-explanation">Das längste Passwort gewinnt, obwohl es nur kleine Buchstaben hat. Darum rät das BSI zu sehr langen Passwörtern.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>

<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jeder Art von Schadsoftware zu, was sie tut.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Trojaner</span> <select name="frage-a6-0" data-left="0"><option value="">bitte wählen</option><option value="3">kopiert sich in andere Dateien und reist mit ihnen weiter</option><option value="4">prüft, welche Verbindungen ins Gerät dürfen</option><option value="2">zeigt „Zahle, dann bekommst du deine Fotos zurück“</option><option value="1">springt ohne Hilfe von Gerät zu Gerät</option><option value="0">sieht aus wie ein nützliches Spiel</option></select></label></li>
<li><label><span>Wurm</span> <select name="frage-a6-1" data-left="1"><option value="">bitte wählen</option><option value="3">kopiert sich in andere Dateien und reist mit ihnen weiter</option><option value="4">prüft, welche Verbindungen ins Gerät dürfen</option><option value="2">zeigt „Zahle, dann bekommst du deine Fotos zurück“</option><option value="1">springt ohne Hilfe von Gerät zu Gerät</option><option value="0">sieht aus wie ein nützliches Spiel</option></select></label></li>
<li><label><span>Erpressungssoftware</span> <select name="frage-a6-2" data-left="2"><option value="">bitte wählen</option><option value="3">kopiert sich in andere Dateien und reist mit ihnen weiter</option><option value="4">prüft, welche Verbindungen ins Gerät dürfen</option><option value="2">zeigt „Zahle, dann bekommst du deine Fotos zurück“</option><option value="1">springt ohne Hilfe von Gerät zu Gerät</option><option value="0">sieht aus wie ein nützliches Spiel</option></select></label></li>
<li><label><span>Virus</span> <select name="frage-a6-3" data-left="3"><option value="">bitte wählen</option><option value="3">kopiert sich in andere Dateien und reist mit ihnen weiter</option><option value="4">prüft, welche Verbindungen ins Gerät dürfen</option><option value="2">zeigt „Zahle, dann bekommst du deine Fotos zurück“</option><option value="1">springt ohne Hilfe von Gerät zu Gerät</option><option value="0">sieht aus wie ein nützliches Spiel</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Trojaner – sieht aus wie ein nützliches Spiel; Wurm – springt ohne Hilfe von Gerät zu Gerät; Erpressungssoftware – zeigt „Zahle, dann bekommst du deine Fotos zurück“; Virus – kopiert sich in andere Dateien und reist mit ihnen weiter</p>
<p class="question-explanation">Der Trojaner tarnt sich, der Wurm verbreitet sich selbst, der Virus kopiert sich in andere Programme, und Erpressungssoftware will Geld.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="question" id="frage-a8" data-id="a8" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Einstellungen machen Selins Tablet sicherer? Wähle alles, was stimmt.</legend>
<label class="question-option"><input type="checkbox" name="frage-a8" value="0"> <span>automatische Updates einschalten</span></label>
<label class="question-option"><input type="checkbox" name="frage-a8" value="1"> <span>eine Bildschirmsperre mit PIN</span></label>
<label class="question-option"><input type="checkbox" name="frage-a8" value="2"> <span>Apps von irgendeiner Webseite holen, wenn sie dort umsonst sind</span></label>
<label class="question-option"><input type="checkbox" name="frage-a8" value="3"> <span>jeder App alle Rechte geben, die sie verlangt</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>automatische Updates einschalten</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Ja. Dann sind Sicherheitslücken schnell zu.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>eine Bildschirmsperre mit PIN</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Ja. Wer das Tablet findet, kommt nicht hinein. Nach ein paar falschen Versuchen muss er lange warten, darum hilft hier schon eine PIN.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Apps von irgendeiner Webseite holen, wenn sie dort umsonst sind</strong></p><p>Das BSI rät, Apps nur aus vertrauenswürdigen Quellen zu holen, etwa dem App-Store des Geräts.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>jeder App alle Rechte geben, die sie verlangt</strong></p><p>Prüfe, ob die App die Rechte wirklich braucht. Im Zweifel lieber nicht installieren.</p></li>
</ul>
<p class="question-explanation">Updates automatisch, eine Sperre mit PIN, Apps aus dem Store und nur nötige Rechte.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
