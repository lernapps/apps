<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" role="img" aria-labelledby="t d"><title id="t">Zahlenstrahl nach links verlängert</title><desc id="d">Eine Linie mit gleichen Abschnitten. Von 0 bis 6 ist sie durchgezogen, das ist der Zahlenstrahl. Links der Null ist sie gestrichelt und mit den Zahlen minus 1 bis minus 6 verlängert. Ein Pfeil zeigt nach links und trägt die Beschriftung: neu, verlängert nach links.</desc><style>text{font:16px sans-serif;fill:currentColor}.l{stroke:currentColor;stroke-width:2;fill:none}.d{stroke-width:4}.p{stroke-width:3;stroke-dasharray:6 4}</style><line class="l" x1="300" y1="100" x2="570" y2="100"/><path class="l" d="M570 100l-10 -6m10 6l-10 6"/><line class="l p" x1="30" y1="100" x2="300" y2="100"/><path class="l" d="M30 100l10 -6m-10 6l10 6"/><line class="l d" x1="300" y1="86" x2="300" y2="114"/><text x="300" y="134" text-anchor="middle" font-weight="bold">0</text><line class="l" x1="340" y1="92" x2="340" y2="108"/><text x="340" y="134" text-anchor="middle">1</text><line class="l" x1="380" y1="92" x2="380" y2="108"/><text x="380" y="134" text-anchor="middle">2</text><line class="l" x1="420" y1="92" x2="420" y2="108"/><text x="420" y="134" text-anchor="middle">3</text><line class="l" x1="460" y1="92" x2="460" y2="108"/><text x="460" y="134" text-anchor="middle">4</text><line class="l" x1="500" y1="92" x2="500" y2="108"/><text x="500" y="134" text-anchor="middle">5</text><line class="l" x1="540" y1="92" x2="540" y2="108"/><text x="540" y="134" text-anchor="middle">6</text><line class="l" x1="60" y1="92" x2="60" y2="108"/><text x="60" y="134" text-anchor="middle">−6</text><line class="l" x1="100" y1="92" x2="100" y2="108"/><text x="100" y="134" text-anchor="middle">−5</text><line class="l" x1="140" y1="92" x2="140" y2="108"/><text x="140" y="134" text-anchor="middle">−4</text><line class="l" x1="180" y1="92" x2="180" y2="108"/><text x="180" y="134" text-anchor="middle">−3</text><line class="l" x1="220" y1="92" x2="220" y2="108"/><text x="220" y="134" text-anchor="middle">−2</text><line class="l" x1="260" y1="92" x2="260" y2="108"/><text x="260" y="134" text-anchor="middle">−1</text><path class="l" d="M280.0 70h-110m0 0l10 -7m-10 7l10 7"/><text x="172.0" y="58" text-anchor="middle">neu: verlängert nach links</text><text x="420" y="64" text-anchor="middle">vorher: Zahlenstrahl</text></svg>
