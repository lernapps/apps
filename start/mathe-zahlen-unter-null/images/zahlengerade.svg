<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" role="img" aria-labelledby="t d"><title id="t">Zahlengerade</title><desc id="d">Zahlengerade mit gleichen Abschnitten von minus 6 bis 6. Die Null ist fett. Links der Null stehen die negativen Zahlen, rechts die positiven. An beiden Enden steht ein Pfeil.</desc><style>text{font:16px sans-serif;fill:currentColor}.l{stroke:currentColor;stroke-width:2;fill:none}.d{stroke-width:4}</style><line class="l" x1="30" y1="70" x2="570" y2="70"/><path class="l" d="M570 70l-10 -6m10 6l-10 6"/><path class="l" d="M30 70l10 -6m-10 6l10 6"/><line class="l" x1="60.0" y1="62" x2="60.0" y2="78"/><text x="60.0" y="104" text-anchor="middle">−6</text><line class="l" x1="100.0" y1="62" x2="100.0" y2="78"/><text x="100.0" y="104" text-anchor="middle">−5</text><line class="l" x1="140.0" y1="62" x2="140.0" y2="78"/><text x="140.0" y="104" text-anchor="middle">−4</text><line class="l" x1="180.0" y1="62" x2="180.0" y2="78"/><text x="180.0" y="104" text-anchor="middle">−3</text><line class="l" x1="220.0" y1="62" x2="220.0" y2="78"/><text x="220.0" y="104" text-anchor="middle">−2</text><line class="l" x1="260.0" y1="62" x2="260.0" y2="78"/><text x="260.0" y="104" text-anchor="middle">−1</text><line class="l d" x1="300.0" y1="56" x2="300.0" y2="84"/><text x="300.0" y="104" text-anchor="middle" font-weight="bold">0</text><line class="l" x1="340.0" y1="62" x2="340.0" y2="78"/><text x="340.0" y="104" text-anchor="middle">1</text><line class="l" x1="380.0" y1="62" x2="380.0" y2="78"/><text x="380.0" y="104" text-anchor="middle">2</text><line class="l" x1="420.0" y1="62" x2="420.0" y2="78"/><text x="420.0" y="104" text-anchor="middle">3</text><line class="l" x1="460.0" y1="62" x2="460.0" y2="78"/><text x="460.0" y="104" text-anchor="middle">4</text><line class="l" x1="500.0" y1="62" x2="500.0" y2="78"/><text x="500.0" y="104" text-anchor="middle">5</text><line class="l" x1="540.0" y1="62" x2="540.0" y2="78"/><text x="540.0" y="104" text-anchor="middle">6</text><text x="180.0" y="30" text-anchor="middle">negative Zahlen</text><text x="420.0" y="30" text-anchor="middle">positive Zahlen</text></svg>
