<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" role="img" aria-labelledby="t d"><title id="t">4 und −4 an der Null gespiegelt</title><desc id="d">Zahlengerade von minus 6 bis 6. Bei 0 steht eine gestrichelte senkrechte Linie mit der Beschriftung Spiegel. Die Punkte bei 4 und bei minus 4 liegen gleich weit von der Null entfernt. Ein gestrichelter Bogen mit Pfeil führt von 4 nach minus 4.</desc><style>text{font:16px sans-serif;fill:currentColor}.l{stroke:currentColor;stroke-width:2;fill:none}.d{stroke-width:4}.p{stroke-width:3;stroke-dasharray:6 4}</style><line class="l" x1="30" y1="100" x2="570" y2="100"/><path class="l" d="M570 100l-10 -6m10 6l-10 6M30 100l10 -6m-10 6l10 6"/><line class="l" x1="60" y1="92" x2="60" y2="108"/><text x="60" y="134" text-anchor="middle">−6</text><line class="l" x1="100" y1="92" x2="100" y2="108"/><text x="100" y="134" text-anchor="middle">−5</text><line class="l" x1="140" y1="92" x2="140" y2="108"/><text x="140" y="134" text-anchor="middle">−4</text><line class="l" x1="180" y1="92" x2="180" y2="108"/><text x="180" y="134" text-anchor="middle">−3</text><line class="l" x1="220" y1="92" x2="220" y2="108"/><text x="220" y="134" text-anchor="middle">−2</text><line class="l" x1="260" y1="92" x2="260" y2="108"/><text x="260" y="134" text-anchor="middle">−1</text><line class="l d" x1="300" y1="86" x2="300" y2="114"/><text x="300" y="134" text-anchor="middle" font-weight="bold">0</text><line class="l" x1="340" y1="92" x2="340" y2="108"/><text x="340" y="134" text-anchor="middle">1</text><line class="l" x1="380" y1="92" x2="380" y2="108"/><text x="380" y="134" text-anchor="middle">2</text><line class="l" x1="420" y1="92" x2="420" y2="108"/><text x="420" y="134" text-anchor="middle">3</text><line class="l" x1="460" y1="92" x2="460" y2="108"/><text x="460" y="134" text-anchor="middle">4</text><line class="l" x1="500" y1="92" x2="500" y2="108"/><text x="500" y="134" text-anchor="middle">5</text><line class="l" x1="540" y1="92" x2="540" y2="108"/><text x="540" y="134" text-anchor="middle">6</text><line class="l p" x1="300" y1="22" x2="300" y2="80"/><text x="308" y="30">Spiegel</text><circle cx="460" cy="100" r="7" fill="currentColor"/><circle cx="140" cy="100" r="7" fill="currentColor"/><path class="l p" d="M460 86 Q300 30 146 82"/><polygon points="140,88 151,70 142,66" fill="currentColor"/></svg>
