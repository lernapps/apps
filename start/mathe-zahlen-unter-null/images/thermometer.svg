<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" role="img" aria-labelledby="t d"><title id="t">Thermometer</title><desc id="d">Thermometer mit Skala von minus 10 bis 10 Grad Celsius in Zweierschritten. Die Null ist fett. Die Säule endet unterhalb der Null.</desc><style>text{font:16px sans-serif;fill:currentColor}.l{stroke:currentColor;stroke-width:2;fill:none}.d{stroke-width:4}</style><rect x="70" y="10" width="26" height="300" rx="13" fill="none" stroke="currentColor" stroke-width="2"/><rect x="78" y="202.0" width="10" height="86.0" fill="currentColor"/><line class="l" x1="100" y1="280.0" x2="116" y2="280.0"/><text x="132" y="285.0">−10</text><line class="l" x1="100" y1="254.0" x2="116" y2="254.0"/><text x="132" y="259.0">−8</text><line class="l" x1="100" y1="228.0" x2="116" y2="228.0"/><text x="132" y="233.0">−6</text><line class="l" x1="100" y1="202.0" x2="116" y2="202.0"/><text x="132" y="207.0">−4</text><line class="l" x1="100" y1="176.0" x2="116" y2="176.0"/><text x="132" y="181.0">−2</text><line class="l d" x1="100" y1="150.0" x2="124" y2="150.0"/><text x="132" y="155.0" font-weight="bold">0</text><line class="l" x1="100" y1="124.0" x2="116" y2="124.0"/><text x="132" y="129.0">2</text><line class="l" x1="100" y1="98.0" x2="116" y2="98.0"/><text x="132" y="103.0">4</text><line class="l" x1="100" y1="72.0" x2="116" y2="72.0"/><text x="132" y="77.0">6</text><line class="l" x1="100" y1="46.0" x2="116" y2="46.0"/><text x="132" y="51.0">8</text><line class="l" x1="100" y1="20.0" x2="116" y2="20.0"/><text x="132" y="25.0">10</text><text x="175" y="25.0">°C</text></svg>
