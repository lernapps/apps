<svg xmlns="http://www.w3.org/2000/svg" width="340" height="160" viewBox="0 0 340 160" font-family="sans-serif" font-size="18">
  <title>Der Term 1/2 + 2 · (1/2 − 1/4) mit drei Unterstreichungen: 1 unter der Klammer, 2 unter 2 mal Klammer, 3 unter dem ganzen Term</title>
  <rect width="340" height="160" fill="#ffffff"/>
  <g fill="#111827" text-anchor="middle">
    <text x="30" y="52">1</text>
    <line x1="22" y1="59" x2="38" y2="59" stroke="#111827" stroke-width="1.5"/>
    <text x="30" y="80">2</text>
    <text x="56" y="66">+</text>
    <text x="80" y="66">2</text>
    <text x="100" y="66">·</text>
    <text x="118" y="70" font-size="30">(</text>
    <text x="138" y="52">1</text>
    <line x1="130" y1="59" x2="146" y2="59" stroke="#111827" stroke-width="1.5"/>
    <text x="138" y="80">2</text>
    <text x="164" y="66">−</text>
    <text x="190" y="52">1</text>
    <line x1="182" y1="59" x2="198" y2="59" stroke="#111827" stroke-width="1.5"/>
    <text x="190" y="80">4</text>
    <text x="212" y="70" font-size="30">)</text>
  </g>
  <line x1="110" y1="96" x2="220" y2="96" stroke="#ea580c" stroke-width="3"/>
  <line x1="72" y1="114" x2="220" y2="114" stroke="#2563eb" stroke-width="3"/>
  <line x1="18" y1="132" x2="220" y2="132" stroke="#6b7280" stroke-width="3" stroke-dasharray="7 4"/>
  <g font-size="14">
    <text x="232" y="101" fill="#9a3412" font-weight="bold">1 Klammer</text>
    <text x="232" y="119" fill="#1e3a8a" font-weight="bold">2 Punkt: ·</text>
    <text x="232" y="137" fill="#374151" font-weight="bold">3 Strich: +</text>
  </g>
</svg>
