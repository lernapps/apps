<svg xmlns="http://www.w3.org/2000/svg" width="300" height="215" viewBox="0 0 300 215" font-family="sans-serif" font-size="16">
  <title>Eine L-förmige Figur mit sechs Seiten: unten 2x, rechts 3, dann nach links x, nach oben x, oben x und links x + 3</title>
  <rect width="300" height="215" fill="#ffffff"/>
  <polygon points="80,180 240,180 240,130 160,130 160,50 80,50" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <g fill="#1e3a8a" font-weight="bold">
    <text x="160" y="203" text-anchor="middle">2x</text>
    <text x="250" y="161">3</text>
    <text x="200" y="122" text-anchor="middle">x</text>
    <text x="168" y="96">x</text>
    <text x="120" y="42" text-anchor="middle">x</text>
    <text x="70" y="121" text-anchor="end">x + 3</text>
  </g>
</svg>
