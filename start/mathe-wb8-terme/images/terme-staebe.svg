<svg xmlns="http://www.w3.org/2000/svg" width="340" height="110" viewBox="0 0 340 110" font-family="sans-serif" font-size="14">
  <title>Eine Strecke aus 4 blauen Stäben der Länge n, dann 6 blauen Stäben der Länge n und einem grauen Stück der Länge 3</title>
  <rect width="340" height="110" fill="#ffffff"/>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <rect x="10" y="50" width="26" height="30"/><rect x="36" y="50" width="26" height="30"/>
    <rect x="62" y="50" width="26" height="30"/><rect x="88" y="50" width="26" height="30"/>
    <rect x="122" y="50" width="26" height="30"/><rect x="148" y="50" width="26" height="30"/>
    <rect x="174" y="50" width="26" height="30"/><rect x="200" y="50" width="26" height="30"/>
    <rect x="226" y="50" width="26" height="30"/><rect x="252" y="50" width="26" height="30"/>
  </g>
  <rect x="286" y="50" width="40" height="30" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <g text-anchor="middle" fill="#1e3a8a" font-weight="bold">
    <text x="23" y="70">n</text><text x="49" y="70">n</text><text x="75" y="70">n</text><text x="101" y="70">n</text>
    <text x="135" y="70">n</text><text x="161" y="70">n</text><text x="187" y="70">n</text><text x="213" y="70">n</text>
    <text x="239" y="70">n</text><text x="265" y="70">n</text>
  </g>
  <text x="306" y="70" text-anchor="middle" fill="#111827" font-weight="bold">3</text>
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <polyline points="10,40 10,34 114,34 114,40"/>
    <polyline points="122,40 122,34 278,34 278,40"/>
    <polyline points="286,40 286,34 326,34 326,40"/>
  </g>
  <g text-anchor="middle" fill="#111827" font-size="15">
    <text x="62" y="26">4n</text><text x="200" y="26">6n</text><text x="306" y="26">3</text>
  </g>
</svg>
