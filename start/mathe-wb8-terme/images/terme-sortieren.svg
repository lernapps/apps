<svg xmlns="http://www.w3.org/2000/svg" width="330" height="160" viewBox="0 0 330 160" font-family="sans-serif" font-size="16">
  <title>Sortieren: Oben der Term 5a + 2b + 3a + 4 + b, die Glieder mit a blau, mit b orange umrandet, die Zahl grau. Darunter sortiert 5a + 3a + 2b + b + 4, unten zusammengefasst 8a + 3b + 4</title>
  <rect width="330" height="160" fill="#ffffff"/>
  <g stroke-width="2">
    <rect x="20" y="14" width="42" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="82" y="14" width="42" height="30" rx="14" fill="#ffffff" stroke="#ea580c"/>
    <rect x="144" y="14" width="42" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="206" y="14" width="42" height="30" fill="#ffffff" stroke="#6b7280" stroke-dasharray="5 3"/>
    <rect x="268" y="14" width="42" height="30" rx="14" fill="#ffffff" stroke="#ea580c"/>
    <rect x="20" y="64" width="42" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="82" y="64" width="42" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="144" y="64" width="42" height="30" rx="14" fill="#ffffff" stroke="#ea580c"/>
    <rect x="206" y="64" width="42" height="30" rx="14" fill="#ffffff" stroke="#ea580c"/>
    <rect x="268" y="64" width="42" height="30" fill="#ffffff" stroke="#6b7280" stroke-dasharray="5 3"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="41" y="35">5a</text><text x="72" y="35">+</text><text x="103" y="35">2b</text><text x="134" y="35">+</text>
    <text x="165" y="35">3a</text><text x="196" y="35">+</text><text x="227" y="35">4</text><text x="258" y="35">+</text>
    <text x="289" y="35">b</text>
    <text x="41" y="85">5a</text><text x="72" y="85">+</text><text x="103" y="85">3a</text><text x="134" y="85">+</text>
    <text x="165" y="85">2b</text><text x="196" y="85">+</text><text x="227" y="85">b</text><text x="258" y="85">+</text>
    <text x="289" y="85">4</text>
  </g>
  <text x="165" y="135" text-anchor="middle" fill="#111827" font-size="18" font-weight="bold">= 8a + 3b + 4</text>
</svg>
