<svg xmlns="http://www.w3.org/2000/svg" width="340" height="230" viewBox="0 0 340 230" font-family="sans-serif" font-size="16">
  <title>Ein Rechteck, oben x + 5 lang, links x + 2 hoch, durch zwei gestrichelte Linien in vier Teile geteilt. Oben links steht x², in den drei anderen Teilen ein Fragezeichen</title>
  <rect width="340" height="230" fill="#ffffff"/>
  <rect x="50" y="34" width="260" height="170" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <line x1="220" y1="34" x2="220" y2="204" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="50" y1="154" x2="310" y2="154" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g fill="#1e3a8a" font-weight="bold" text-anchor="middle">
    <text x="135" y="24">x</text>
    <text x="265" y="24">5</text>
    <text x="34" y="100">x</text>
    <text x="34" y="185">2</text>
  </g>
  <g text-anchor="middle" font-size="18">
    <text x="135" y="100" fill="#111827">x²</text>
    <text x="265" y="100" fill="#9a3412" font-weight="bold">?</text>
    <text x="135" y="185" fill="#9a3412" font-weight="bold">?</text>
    <text x="265" y="185" fill="#9a3412" font-weight="bold">?</text>
  </g>
</svg>
