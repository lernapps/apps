<svg xmlns="http://www.w3.org/2000/svg" width="340" height="230" viewBox="0 0 340 230" font-family="sans-serif" font-size="20">
  <title>Der Term (x + 3) · (x − 2). Zwei blaue Bögen führen vom x der ersten Klammer zu x und zu −2 der zweiten Klammer, zwei orange Bögen von +3 zu x und zu −2. Die Bögen tragen die Nummern 1 bis 4, unten stehen die vier Produkte</title>
  <rect width="340" height="230" fill="#ffffff"/>
  <g fill="#111827" text-anchor="middle">
    <text x="50" y="117">(</text>
    <text x="72" y="117">x</text>
    <text x="114" y="117">+ 3</text>
    <text x="142" y="117">)</text>
    <text x="162" y="117">·</text>
    <text x="182" y="117">(</text>
    <text x="204" y="117">x</text>
    <text x="246" y="117">− 2</text>
    <text x="274" y="117">)</text>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M72,96 Q138,40 204,96" stroke="#2563eb"/>
    <path d="M72,96 Q160,0 252,96" stroke="#2563eb"/>
    <path d="M118,124 Q161,172 204,124" stroke="#ea580c"/>
    <path d="M118,124 Q185,204 252,124" stroke="#ea580c"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="138" y="62" fill="#1e3a8a">1</text>
    <text x="160" y="38" fill="#1e3a8a">2</text>
    <text x="161" y="141" fill="#9a3412">3</text>
    <text x="185" y="182" fill="#9a3412">4</text>
  </g>
  <g font-size="15" fill="#111827">
    <text x="16" y="214">1: x · x</text>
    <text x="96" y="214">2: x · (−2)</text>
    <text x="190" y="214">3: 3 · x</text>
    <text x="262" y="214">4: 3 · (−2)</text>
  </g>
</svg>
