<svg xmlns="http://www.w3.org/2000/svg" width="320" height="110" viewBox="0 0 320 110" font-family="sans-serif" font-size="16">
  <title>Eine Wertetabelle zum Term 3x + 2: für x = 1 steht 5 darunter, für x = 2 steht 8, für x = 4 ein Fragezeichen</title>
  <rect width="320" height="110" fill="#ffffff"/>
  <rect x="10" y="18" width="90" height="72" fill="#f3f4f6"/>
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <rect x="10" y="18" width="300" height="72"/>
    <line x1="10" y1="54" x2="310" y2="54"/>
    <line x1="100" y1="18" x2="100" y2="90"/>
    <line x1="170" y1="18" x2="170" y2="90"/>
    <line x1="240" y1="18" x2="240" y2="90"/>
  </g>
  <rect x="242" y="56" width="66" height="32" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <g text-anchor="middle" fill="#111827">
    <text x="55" y="42" font-weight="bold">x</text>
    <text x="55" y="78" font-weight="bold">3x + 2</text>
  </g>
  <g text-anchor="middle" fill="#1e3a8a">
    <text x="135" y="42">1</text>
    <text x="205" y="42">2</text>
    <text x="275" y="42">4</text>
    <text x="135" y="78">5</text>
    <text x="205" y="78">8</text>
  </g>
  <text x="275" y="78" text-anchor="middle" fill="#9a3412" font-weight="bold">?</text>
</svg>
