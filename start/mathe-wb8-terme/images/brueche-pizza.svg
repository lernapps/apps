  <line x1="150" y1="110" x2="230.0" y2="110.0" stroke="#6b7280" stroke-width="1"/><line x1="150" y1="110" x2="206.6" y2="53.4" stroke="#6b7280" stroke-width="1"/><line x1="150" y1="110" x2="150.0" y2="30.0" stroke="#6b7280" stroke-width="1"/><line x1="150" y1="110" x2="93.4" y2="53.4" stroke="#6b7280" stroke-width="1"/><line x1="150" y1="110" x2="70.0" y2="110.0" stroke="#6b7280" stroke-width="1"/><line x1="150" y1="110" x2="93.4" y2="166.6" stroke="#6b7280" stroke-width="1"/><line x1="150" y1="110" x2="150.0" y2="190.0" stroke="#6b7280" stroke-width="1"/><line x1="150" y1="110" x2="206.6" y2="166.6" stroke="#6b7280" stroke-width="1"/>
