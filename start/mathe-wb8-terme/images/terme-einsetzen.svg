<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150" font-family="sans-serif" font-size="20">
  <title>Einsetzen in drei Zeilen: 3x + 2, darunter 3 · x + 2 mit dem x im blauen Kasten, darunter mit einem Pfeil für x = 4 der Term 3 · 4 + 2 mit der 4 im orangen Kasten</title>
  <rect width="300" height="150" fill="#ffffff"/>
  <text x="90" y="35" fill="#111827">3x + 2</text>
  <rect x="129" y="60" width="26" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="129" y="105" width="26" height="28" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <g fill="#111827">
    <text x="60" y="81">=</text>
    <text x="90" y="81">3</text>
    <text x="110" y="81">·</text>
    <text x="165" y="81">+</text>
    <text x="190" y="81">2</text>
    <text x="90" y="126">3</text>
    <text x="110" y="126">·</text>
    <text x="165" y="126">+</text>
    <text x="190" y="126">2</text>
  </g>
  <text x="142" y="81" text-anchor="middle" fill="#1e3a8a" font-weight="bold">x</text>
  <text x="142" y="126" text-anchor="middle" fill="#9a3412" font-weight="bold">4</text>
  <text x="56" y="126" fill="#6b7280">→</text>
  <text x="225" y="126" fill="#6b7280" font-size="14">für x = 4</text>
</svg>
