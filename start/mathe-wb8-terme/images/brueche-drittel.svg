<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180" viewBox="0 0 300 180" font-family="sans-serif" font-size="14">
  <title>Ein rechteckiges Kuchenblech in drei gleiche Streifen geteilt. Der linke Streifen ist blau: Dieses Drittel ist noch übrig.</title>
  <rect width="300" height="180" fill="#ffffff"/>
  <rect x="30" y="30" width="80" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="110" y="30" width="160" height="120" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="190" y1="30" x2="190" y2="150" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="70" y="88" text-anchor="middle" fill="#1e3a8a" font-weight="bold">1/3</text>
  <text x="70" y="106" text-anchor="middle" fill="#1e3a8a">übrig</text>
  <text x="150" y="94" text-anchor="middle" fill="#374151">gegessen</text>
  <text x="230" y="94" text-anchor="middle" fill="#374151">gegessen</text>
  <text x="150" y="172" text-anchor="middle" fill="#374151">ein ganzes Blech</text>
</svg>
