<svg xmlns="http://www.w3.org/2000/svg" width="330" height="215" viewBox="0 0 330 215" font-family="sans-serif" font-size="15">
  <title>Zwei Reihen von Malaufgaben. Links 3 mal 2, 1, 0, −1, −2 mit den Ergebnissen 6, 3, 0, −3, −6. Rechts −3 mal 2, 1, 0, −1, −2 mit den Ergebnissen −6, −3, 0, 3, 6</title>
  <rect width="330" height="215" fill="#ffffff"/>
  <line x1="165" y1="12" x2="165" y2="168" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>
  <g fill="#111827">
    <text x="20" y="32">3 · 2 = 6</text>
    <text x="20" y="62">3 · 1 = 3</text>
    <text x="20" y="92">3 · 0 = 0</text>
    <text x="180" y="32">(−3) · 2 = −6</text>
    <text x="180" y="62">(−3) · 1 = −3</text>
    <text x="180" y="92">(−3) · 0 = 0</text>
  </g>
  <g fill="#9a3412" font-weight="bold">
    <text x="20" y="122">3 · (−1) = −3</text>
    <text x="20" y="152">3 · (−2) = −6</text>
    <text x="180" y="122">(−3) · (−1) = 3</text>
    <text x="180" y="152">(−3) · (−2) = 6</text>
  </g>
  <g fill="#374151" font-size="13">
    <text x="20" y="188">nach unten: immer</text>
    <text x="20" y="205">3 weniger</text>
    <text x="180" y="188">nach unten: immer</text>
    <text x="180" y="205">3 mehr</text>
  </g>
</svg>
