<svg xmlns="http://www.w3.org/2000/svg" width="340" height="215" viewBox="0 0 340 215" font-family="sans-serif" font-size="17">
  <title>Oben die Gleichung (5x + 5) · (x − 5) = 0. Zwei Linien führen nach unten zu 5x + 5 = 0 links und x − 5 = 0 rechts, dazwischen steht oder. Darunter links x = −1, rechts x = 5 in Orange</title>
  <rect width="340" height="215" fill="#ffffff"/>
  <rect x="55" y="12" width="230" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <line x1="130" y1="52" x2="85" y2="96" stroke="#6b7280" stroke-width="2"/>
  <line x1="210" y1="52" x2="255" y2="96" stroke="#6b7280" stroke-width="2"/>
  <rect x="20" y="96" width="130" height="38" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="190" y="96" width="130" height="38" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <line x1="85" y1="134" x2="85" y2="160" stroke="#6b7280" stroke-width="2"/>
  <line x1="255" y1="134" x2="255" y2="160" stroke="#6b7280" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="170" y="38" fill="#111827">(5x + 5) · (x − 5) = 0</text>
    <text x="85" y="121" fill="#111827">5x + 5 = 0</text>
    <text x="255" y="121" fill="#111827">x − 5 = 0</text>
    <text x="170" y="121" fill="#4b5563" font-style="italic" font-size="15">oder</text>
    <text x="85" y="185" fill="#9a3412" font-weight="bold">x = −1</text>
    <text x="255" y="185" fill="#9a3412" font-weight="bold">x = 5</text>
  </g>
</svg>
