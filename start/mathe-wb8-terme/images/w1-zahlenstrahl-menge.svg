<svg xmlns="http://www.w3.org/2000/svg" width="340" height="125" viewBox="0 0 340 125" font-family="sans-serif" font-size="15">
  <title>Ein Zahlenstrahl von −4 bis 4. Bei −3 ein leerer Kreis, bei 2,5 ein blauer Strich. Dazwischen sind die ganzen Zahlen −2, −1, 0, 1 und 2 mit orangen Punkten markiert</title>
  <rect width="340" height="125" fill="#ffffff"/>
  <line x1="64" y1="70" x2="251.0" y2="70" stroke="#2563eb" stroke-width="6" stroke-opacity="0.35"/>
  <line x1="16" y1="70" x2="320" y2="70" stroke="#374151" stroke-width="2"/>
  <polygon points="328,70 318,65 318,75" fill="#374151"/>
  <g fill="#111827" text-anchor="middle">
    <line x1="30" y1="64" x2="30" y2="76" stroke="#374151" stroke-width="1.5"/><text x="30" y="96">−4</text>
    <line x1="64" y1="64" x2="64" y2="76" stroke="#374151" stroke-width="1.5"/><text x="64" y="96">−3</text>
    <line x1="98" y1="64" x2="98" y2="76" stroke="#374151" stroke-width="1.5"/><text x="98" y="96">−2</text>
    <line x1="132" y1="64" x2="132" y2="76" stroke="#374151" stroke-width="1.5"/><text x="132" y="96">−1</text>
    <line x1="166" y1="64" x2="166" y2="76" stroke="#374151" stroke-width="1.5"/><text x="166" y="96">0</text>
    <line x1="200" y1="64" x2="200" y2="76" stroke="#374151" stroke-width="1.5"/><text x="200" y="96">1</text>
    <line x1="234" y1="64" x2="234" y2="76" stroke="#374151" stroke-width="1.5"/><text x="234" y="96">2</text>
    <line x1="268" y1="64" x2="268" y2="76" stroke="#374151" stroke-width="1.5"/><text x="268" y="96">3</text>
    <line x1="302" y1="64" x2="302" y2="76" stroke="#374151" stroke-width="1.5"/><text x="302" y="96">4</text>
  </g>
  <circle cx="98" cy="70" r="6" fill="#ea580c"/>
  <circle cx="132" cy="70" r="6" fill="#ea580c"/>
  <circle cx="166" cy="70" r="6" fill="#ea580c"/>
  <circle cx="200" cy="70" r="6" fill="#ea580c"/>
  <circle cx="234" cy="70" r="6" fill="#ea580c"/>
  <circle cx="64" cy="70" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="251.0" y1="56" x2="251.0" y2="84" stroke="#2563eb" stroke-width="3"/>
  <text x="251.0" y="50" fill="#1e3a8a" font-weight="bold" text-anchor="middle">2,5</text>
</svg>
