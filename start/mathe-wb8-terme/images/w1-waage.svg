<svg xmlns="http://www.w3.org/2000/svg" width="340" height="220" viewBox="0 0 340 220" font-family="sans-serif" font-size="13">
  <title>Eine Waage im Gleichgewicht. Links liegen drei orange Säckchen mit x und zwei blaue Gewichte zu je 1 kg. Rechts liegen blaue Gewichte zu 10 kg, 2 kg und 2 kg</title>
  <rect width="340" height="220" fill="#ffffff"/>
  <line x1="40" y1="172" x2="300" y2="172" stroke="#374151" stroke-width="4"/>
  <polygon points="170,172 148,206 192,206" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <line x1="120" y1="206" x2="220" y2="206" stroke="#374151" stroke-width="3"/>
  <line x1="84" y1="152" x2="84" y2="172" stroke="#374151" stroke-width="3"/>
  <line x1="256" y1="152" x2="256" y2="172" stroke="#374151" stroke-width="3"/>
  <line x1="8" y1="151" x2="160" y2="151" stroke="#374151" stroke-width="3"/>
  <line x1="180" y1="151" x2="332" y2="151" stroke="#374151" stroke-width="3"/>
  <g fill="#ffedd5" stroke="#ea580c" stroke-width="2">
    <rect x="12" y="112" width="30" height="37" rx="10"/>
    <rect x="46" y="112" width="30" height="37" rx="10"/>
    <rect x="80" y="112" width="30" height="37" rx="10"/>
  </g>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <rect x="116" y="127" width="40" height="22"/>
    <rect x="116" y="103" width="40" height="22"/>
    <rect x="186" y="111" width="52" height="38"/>
    <rect x="242" y="121" width="42" height="28"/>
    <rect x="288" y="121" width="42" height="28"/>
  </g>
  <g text-anchor="middle">
    <g fill="#9a3412" font-weight="bold" font-size="16">
      <text x="27" y="136">x</text>
      <text x="61" y="136">x</text>
      <text x="95" y="136">x</text>
    </g>
    <g fill="#1e3a8a">
      <text x="136" y="143">1 kg</text>
      <text x="136" y="119">1 kg</text>
      <text x="212" y="135">10 kg</text>
      <text x="263" y="140">2 kg</text>
      <text x="309" y="140">2 kg</text>
    </g>
  </g>
</svg>
