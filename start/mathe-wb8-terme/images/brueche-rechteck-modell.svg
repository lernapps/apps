<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" font-family="sans-serif" font-size="14">
  <title>Das Blech in drei senkrechte Streifen und durch eine waagerechte Linie in zwei Reihen geteilt, also in 6 gleiche Felder. Der linke Streifen ist blau, sein oberes Feld orange.</title>
  <rect width="320" height="200" fill="#ffffff"/>
  <rect x="40" y="30" width="80" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="40" y="30" width="80" height="60" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <rect x="120" y="30" width="160" height="120" fill="none" stroke="#374151" stroke-width="1.5"/>
  <line x1="200" y1="30" x2="200" y2="150" stroke="#374151" stroke-width="1.5"/>
  <line x1="120" y1="90" x2="280" y2="90" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="65" text-anchor="middle" fill="#9a3412" font-weight="bold">?</text>
  <text x="80" y="176" text-anchor="middle" fill="#1e3a8a" font-weight="bold">1/3</text>
  <text x="30" y="65" text-anchor="end" fill="#374151">1/2</text>
  <text x="30" y="125" text-anchor="end" fill="#374151">1/2</text>
  <text x="200" y="176" text-anchor="middle" fill="#374151">3 Spalten · 2 Reihen</text>
</svg>
