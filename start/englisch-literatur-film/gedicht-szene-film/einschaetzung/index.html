<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<h2 id="teil-1" tabindex="-1">Seite 1 von 4</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welcher Satz vergleicht zwei Dinge mit dem Wort like?</legend>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>He runs like the wind</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>He is the wind</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>He runs very fast</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>He runs like the wind</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Satz vergleicht das Laufen mit dem Wind und benutzt dafür like.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>He is the wind</strong></p><p>Hier fehlt das Wort like. Der Satz nennt ihn direkt Wind.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>He runs very fast</strong></p><p>Dieser Satz sagt nur, wie schnell er ist. Er vergleicht nichts.</p></li>
</ul>
<p class="question-explanation">Auf dieser Seite lernst du den Vergleich und drei weitere Stilmittel kennen.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jede Stelle aus der Rede dem Stilmittel zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Today it is the green heart of our town.</span> <select name="frage-a2-0" data-left="0"><option value="">bitte wählen</option><option value="3">rhetorical question</option><option value="0">metaphor</option><option value="1">simile</option><option value="2">repetition</option></select></label></li>
<li><label><span>as quiet as a sleeping cat</span> <select name="frage-a2-1" data-left="1"><option value="">bitte wählen</option><option value="3">rhetorical question</option><option value="0">metaphor</option><option value="1">simile</option><option value="2">repetition</option></select></label></li>
<li><label><span>We dug. We planted. We waited.</span> <select name="frage-a2-2" data-left="2"><option value="">bitte wählen</option><option value="3">rhetorical question</option><option value="0">metaphor</option><option value="1">simile</option><option value="2">repetition</option></select></label></li>
<li><label><span>Did anyone think the neighbours would come with tea and cake?</span> <select name="frage-a2-3" data-left="3"><option value="">bitte wählen</option><option value="3">rhetorical question</option><option value="0">metaphor</option><option value="1">simile</option><option value="2">repetition</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Today it is the green heart of our town. – metaphor; as quiet as a sleeping cat – simile; We dug. We planted. We waited. – repetition; Did anyone think the neighbours would come with tea and cake? – rhetorical question</p>
<p class="question-explanation">Die Metapher hat kein Vergleichswort, der Vergleich hat as … as. Die Wiederholung bringt Wörter oder Satzmuster zurück. Die rhetorische Frage verlangt keine Antwort.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 4</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welches Wortpaar reimt sich?</legend>
<label class="question-option"><input type="radio" name="frage-a3" value="0"> <span>light and night</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="1"> <span>tough and though</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="2"> <span>go and do</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>light and night</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Wörter klingen am Ende gleich. Beide enden auf denselben Laut.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>tough and though</strong></p><p>Die Schreibung ist ähnlich, aber der Klang nicht. Tough klingt wie stuff, though klingt wie go.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>go and do</strong></p><p>Beide enden auf -o, klingen aber verschieden. Go klingt wie so, do klingt wie too.</p></li>
</ul>
<p class="question-explanation">Ein Reim hängt vom Klang ab, nicht von der Schreibung.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welches Reimschema hat jede Strophe? Ordne zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Zeilen 1 bis 4 (slow, street, glow, seat)</span> <select name="frage-a4-0" data-left="0"><option value="">bitte wählen</option><option value="1">AABB</option><option value="2">ABBA</option><option value="0">ABAB</option><option value="3">ABCB</option></select></label></li>
<li><label><span>Zeilen 13 bis 16 (pocket, rocket, blue, you)</span> <select name="frage-a4-1" data-left="1"><option value="">bitte wählen</option><option value="1">AABB</option><option value="2">ABBA</option><option value="0">ABAB</option><option value="3">ABCB</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Zeilen 1 bis 4 (slow, street, glow, seat) – ABAB; Zeilen 13 bis 16 (pocket, rocket, blue, you) – AABB</p>
<p class="question-explanation">In Zeilen 1 bis 4 reimen sich die erste und dritte und die zweite und vierte Zeile. In Zeilen 13 bis 16 reimen sich die ersten zwei und die letzten zwei.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

<h2 id="teil-3" tabindex="-1">Seite 3 von 4</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie zeigt man in einem Dialog-Skript, wer spricht?</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>Der Name der Figur steht vor der Zeile, dann ein Doppelpunkt</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>Hinter der Zeile steht „said Anna“</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>Die Zeilen stehen ohne Namen untereinander</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Der Name der Figur steht vor der Zeile, dann ein Doppelpunkt</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>So steht es im Skript, zum Beispiel „ANNA: Hello.“ Man sieht sofort, wer spricht.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Hinter der Zeile steht „said Anna“</strong></p><p>So schreibt man Erzähltext in einer Geschichte. In einem Skript steht der Name vorn.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Die Zeilen stehen ohne Namen untereinander</strong></p><p>Ohne Namen weiß man nicht, wer spricht. In einem Skript steht immer ein Name.</p></li>
</ul>
<p class="question-explanation">Ein Skript hat vor jeder Zeile den Namen der Figur, so wie du es vom Dialog kennst.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="matching">
<form class="question-form" novalidate>
<fieldset>

<ul class="question-pairs">

<li><label><span>A lamp swings in the wind.</span> <select name="frage-a6-1" data-left="1"><option value="">bitte wählen</option><option value="3">Wann die Szene endet</option><option value="2">Was jemand tut</option><option value="1">Wie die Bühne aussieht</option><option value="0">Wie jemand spricht</option></select></label></li>
<li><label><span>Tom sits down slowly on his bag.</span> <select name="frage-a6-2" data-left="2"><option value="">bitte wählen</option><option value="3">Wann die Szene endet</option><option value="2">Was jemand tut</option><option value="1">Wie die Bühne aussieht</option><option value="0">Wie jemand spricht</option></select></label></li>
<li><label><span>CURTAIN</span> <select name="frage-a6-3" data-left="3"><option value="">bitte wählen</option><option value="3">Wann die Szene endet</option><option value="2">Was jemand tut</option><option value="1">Wie die Bühne aussieht</option><option value="0">Wie jemand spricht</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> (sighing) – Wie jemand spricht; A lamp swings in the wind. – Wie die Bühne aussieht; Tom sits down slowly on his bag. – Was jemand tut; CURTAIN – Wann die Szene endet</p>

<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="question" id="frage-a7" data-id="a7" data-type="single-choice">

<fieldset>

<label class="question-option"><input type="radio" name="frage-a7" value="0"> <span>where</span></label>
<label class="question-option"><input type="radio" name="frage-a7" value="1"> <span>who</span></label>
<label class="question-option"><input type="radio" name="frage-a7" value="2"> <span>what</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>where</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Ein weites Bild zeigt den Ort, an dem die Geschichte beginnt.</p></li>

</form>
</div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="question" id="frage-a8" data-id="a8" data-type="matching">

<ul class="question-pairs">
<li><label><span>[2] A very wide picture of the street</span> <select name="frage-a8-0" data-left="0"><option value="">bitte wählen</option><option value="0">long shot</option><option value="2">close-up</option><option value="1">medium shot</option></select></label></li>
<li><label><span>[3] The camera shows him from the waist up as he rides</span> <select name="frage-a8-1" data-left="1"><option value="">bitte wählen</option><option value="0">long shot</option><option value="2">close-up</option><option value="1">medium shot</option></select></label></li>
<li><label><span>[4] We see only his hand and the parcel</span> <select name="frage-a8-2" data-left="2"><option value="">bitte wählen</option><option value="0">long shot</option><option value="2">close-up</option><option value="1">medium shot</option></select></label></li>

</form>
</div></li>
