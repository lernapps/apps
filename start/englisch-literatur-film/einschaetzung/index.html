<li><label><span>We dug. We planted. We waited.</span> <select name="frage-a13-2" data-left="2"><option value="">bitte wählen</option><option value="2">repetition</option><option value="1">simile</option><option value="3">rhetorical question</option><option value="0">metaphor</option></select></label></li>
<li><label><span>Did anyone think the neighbours would come with tea and cake?</span> <select name="frage-a13-3" data-left="3"><option value="">bitte wählen</option><option value="2">repetition</option><option value="1">simile</option><option value="3">rhetorical question</option><option value="0">metaphor</option></select></label></li>

<p><strong>Richtige Antwort:</strong> Today it is the green heart of our town. – metaphor; as quiet as a sleeping cat – simile; We dug. We planted. We waited. – repetition; Did anyone think the neighbours would come with tea and cake? – rhetorical question</p>
<p class="question-explanation">Die Metapher hat kein Vergleichswort, der Vergleich hat as … as. Die Wiederholung bringt Wörter oder Satzmuster zurück. Die rhetorische Frage verlangt keine Antwort.</p>

<li class="explainer-assessment-item" data-key="a14"><p class="explainer-assessment-label">Aufgabe 14</p><div class="question" id="frage-a14" data-id="a14" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welches Wortpaar reimt sich?</legend>
<label class="question-option"><input type="radio" name="frage-a14" value="0"> <span>light and night</span></label>
<label class="question-option"><input type="radio" name="frage-a14" value="1"> <span>tough and though</span></label>
<label class="question-option"><input type="radio" name="frage-a14" value="2"> <span>go and do</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>light and night</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Wörter klingen am Ende gleich. Beide enden auf denselben Laut.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>tough and though</strong></p><p>Die Schreibung ist ähnlich, aber der Klang nicht. Tough klingt wie stuff, though klingt wie go.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>go and do</strong></p><p>Beide enden auf -o, klingen aber verschieden. Go klingt wie so, do klingt wie too.</p></li>
</ul>
<p class="question-explanation">Ein Reim hängt vom Klang ab, nicht von der Schreibung.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a15"><p class="explainer-assessment-label">Aufgabe 15</p><div class="question" id="frage-a15" data-id="a15" data-type="matching">

</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>

<p class="question-explanation">In Zeilen 1 bis 4 reimen sich die erste und dritte und die zweite und vierte Zeile. In Zeilen 13 bis 16 reimen sich die ersten zwei und die letzten zwei.</p>

<label class="question-option"><input type="radio" name="frage-a16" value="1"> <span>Hinter der Zeile steht „said Anna“</span></label>
<label class="question-option"><input type="radio" name="frage-a16" value="2"> <span>Die Zeilen stehen ohne Namen untereinander</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>

<li class="question-info" data-option="1"><p class="question-info-head"><strong>Hinter der Zeile steht „said Anna“</strong></p><p>So schreibt man Erzähltext in einer Geschichte. In einem Skript steht der Name vorn.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Die Zeilen stehen ohne Namen untereinander</strong></p><p>Ohne Namen weiß man nicht, wer spricht. In einem Skript steht immer ein Name.</p></li>

<p class="question-explanation">Ein Skript hat vor jeder Zeile den Namen der Figur, so wie du es vom Dialog kennst.</p>
