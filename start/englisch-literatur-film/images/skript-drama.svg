<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" font-family="sans-serif">
<rect width="480" height="330" fill="#f4efe2"/>
<rect x="14" y="14" width="452" height="200" rx="10" fill="#fff" stroke="#34495e" stroke-width="3"/>
<text x="30" y="62" font-size="18" font-weight="bold" fill="#2c6fd8">ANNA:</text>
<text x="100" y="62" font-size="18" fill="#d35400">(whispering)</text>
<text x="214" y="62" font-size="18" fill="#34495e">Is anyone there?</text>
<text x="30" y="126" font-size="18" font-style="italic" fill="#138d75">Anna opens the door slowly.</text>
<text x="30" y="190" font-size="18" font-weight="bold" fill="#2c6fd8">BEN:</text>
<text x="86" y="190" font-size="18" fill="#34495e">Only me.</text>
<text x="30" y="242" font-size="16" fill="#2c6fd8">Blau: wer spricht</text><text x="200" y="242" font-size="16" fill="#d35400">Orange: wie gesprochen wird</text>
<text x="30" y="266" font-size="16" fill="#138d75">Grün, kursiv: was auf der Bühne geschieht</text>
</svg>