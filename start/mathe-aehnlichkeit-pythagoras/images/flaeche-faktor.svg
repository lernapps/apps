<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Links ein kleines Quadrat mit Seite 1 cm, rechts ein Quadrat mit Seite 2 cm, das aus vier kleinen Quadraten besteht">
  <rect width="320" height="180" fill="#ffffff"/>
  <rect x="30" y="100" width="40" height="40" fill="#cfe3ff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="30" y="160" font-family="sans-serif" font-size="13" fill="#1a1a1a">Seite 1 cm</text>
  <text x="30" y="176" font-family="sans-serif" font-size="13" fill="#1a1a1a">Fläche 1 cm²</text>
  <rect x="150" y="60" width="80" height="80" fill="#cfe3ff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="190" y1="60" x2="190" y2="140" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="150" y1="100" x2="230" y2="100" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="150" y="160" font-family="sans-serif" font-size="13" fill="#1a1a1a">Seite 2 cm</text>
  <text x="150" y="176" font-family="sans-serif" font-size="13" fill="#1a1a1a">Fläche 4 cm²</text>
  <text x="60" y="36" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">k = 2: Längen mal 2, Flächen mal 4</text>
</svg>
