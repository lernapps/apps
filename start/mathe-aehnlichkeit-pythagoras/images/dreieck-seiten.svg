<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="Rechtwinkliges Dreieck ABC mit dem rechten Winkel bei C. A liegt links unten, C rechts unten, B rechts oben. Der Winkel bei A heißt Alpha, der bei B heißt Beta. Die Seite a liegt gegenüber von A, die Seite b gegenüber von B, die Seite c gegenüber von C.">
  <rect width="300" height="200" fill="#ffffff"/>
  <polygon points="40,160 250,160 250,40" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="3"/>
  <polyline points="235,160 235,145 250,145" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 75,160 A 35,35 0 0 0 70,142" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 250,70 A 30,30 0 0 1 228,56" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <g font-family="sans-serif" font-size="16" fill="#1a1a1a">
    <text x="22" y="170">A</text><text x="254" y="172">C</text><text x="254" y="38">B</text>
    <text x="82" y="155">α</text><text x="214" y="72">β</text>
    <text x="256" y="106">a</text><text x="140" y="180">b</text><text x="128" y="92">c</text>
  </g>
</svg>
