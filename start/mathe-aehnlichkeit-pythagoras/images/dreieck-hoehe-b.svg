<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220" role="img" aria-label="Spitzwinkliges Dreieck ABC. A links unten, C rechts unten, B oben. Von B fällt die gestrichelte Höhe h senkrecht auf die Seite b und trifft sie im Punkt D. Die Strecke AD heißt x, die Strecke DC heißt b minus x. Der Winkel bei A heißt Alpha.">
  <rect width="300" height="220" fill="#ffffff"/>
  <polygon points="30,170 270,170 120,50" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="120" y1="50" x2="120" y2="170" stroke="#1a4fd6" stroke-width="2.5" stroke-dasharray="7 4"/>
  <polyline points="108,170 108,158 120,158" fill="none" stroke="#1a4fd6" stroke-width="1.5"/>
  <path d="M 62,170 A 32,32 0 0 0 58,155" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <g font-family="sans-serif" font-size="16" fill="#1a1a1a">
    <text x="12" y="182">A</text><text x="272" y="182">C</text><text x="116" y="42">B</text><text x="116" y="188">D</text>
    <text x="72" y="164">α</text>
    <text x="126" y="118" fill="#1a4fd6">h</text><text x="56" y="104">c</text><text x="206" y="104">a</text>
    <text x="64" y="188" font-size="13">x</text><text x="186" y="164" font-size="13">b − x</text>
  </g>
  <polyline points="30,198 30,204 270,204 270,198" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="146" y="218" font-family="sans-serif" font-size="16" fill="#1a1a1a">b</text>
</svg>
