<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" width="320" height="190" role="img" aria-label="Ein hoher Turm und ein kurzer Stab stehen senkrecht auf dem Boden. Eine Sonnenlinie läuft von der Turmspitze über die Stabspitze bis zum Schattenende Z.">
  <rect width="320" height="190" fill="#ffffff"/>
  <line x1="10" y1="150" x2="310" y2="150" stroke="#555555" stroke-width="2"/>
  <line x1="50" y1="150" x2="50" y2="30" stroke="#1a1a1a" stroke-width="6"/>
  <line x1="260" y1="150" x2="260" y2="135" stroke="#1a4fd6" stroke-width="4"/>
  <line x1="50" y1="30" x2="290" y2="150" stroke="#e08a00" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="290" cy="150" r="3.5" fill="#1a1a1a"/>
  <g font-family="sans-serif" font-size="13" fill="#1a1a1a">
    <text x="60" y="80">Turm: h = ?</text>
    <text x="215" y="166">Stab 1,5 m,</text>
    <text x="215" y="181">Schatten 3 m</text>
    <text x="286" y="140">Z</text>
    <text x="58" y="170">Schatten des Turms: 24 m</text>
  </g>
</svg>
