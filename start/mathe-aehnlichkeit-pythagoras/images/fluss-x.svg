<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" width="280" height="220" role="img" aria-label="Ein Fluss liegt zwischen einem Baum S am anderen Ufer und dem Punkt P am nahen Ufer. Am nahen Ufer liegen P, M und Q. Eine Gerade führt von S über M zu R.">
  <rect width="280" height="220" fill="#ffffff"/>
  <rect x="0" y="40" width="280" height="110" fill="#d9ecff"/>
  <text x="200" y="85" font-family="sans-serif" font-size="13" fill="#1a1a1a">Fluss</text>
  <line x1="0" y1="150" x2="280" y2="150" stroke="#555555" stroke-width="2"/>
  <line x1="60" y1="42" x2="60" y2="150" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="7 4"/>
  <line x1="180" y1="150" x2="180" y2="186" stroke="#1a4fd6" stroke-width="3"/>
  <line x1="60" y1="42" x2="180" y2="186" stroke="#e08a00" stroke-width="2"/>
  <g fill="#1a1a1a"><circle cx="60" cy="42" r="3.5"/><circle cx="60" cy="150" r="3.5"/><circle cx="150" cy="150" r="3.5"/><circle cx="180" cy="150" r="3.5"/><circle cx="180" cy="186" r="3.5"/></g>
  <g font-family="sans-serif" font-size="14" fill="#1a1a1a">
    <text x="42" y="40">S</text><text x="42" y="168">P</text><text x="145" y="140">M</text><text x="186" y="146">Q</text><text x="186" y="196">R</text><text x="14" y="100">w = ?</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#1a1a1a"><text x="66" y="168">PM = 30 m</text><text x="96" y="188">MQ = 10 m</text><text x="192" y="172">QR = 12 m</text></g>
</svg>
