<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="Spitzwinkliges Dreieck ABC. A links unten, B rechts unten, C oben. Von C fällt die gestrichelte Höhe h senkrecht auf die Seite c und trifft sie im Punkt D. Der Winkel bei A heißt Alpha, bei B Beta.">
  <rect width="300" height="200" fill="#ffffff"/>
  <polygon points="30,170 270,170 190,50" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="190" y1="50" x2="190" y2="170" stroke="#1a4fd6" stroke-width="2.5" stroke-dasharray="7 4"/>
  <polyline points="178,170 178,158 190,158" fill="none" stroke="#1a4fd6" stroke-width="1.5"/>
  <path d="M 62,170 A 32,32 0 0 0 58,156" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 238,170 A 32,32 0 0 1 243,152" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <g font-family="sans-serif" font-size="16" fill="#1a1a1a">
    <text x="12" y="182">A</text><text x="272" y="182">B</text><text x="186" y="42">C</text><text x="186" y="188">D</text>
    <text x="72" y="164">α</text><path d="M 170,65 A 25,25 0 0 0 203.9,70.8" fill="none" stroke="#1a1a1a" stroke-width="2"/><text x="177" y="92">γ</text><text x="222" y="164">β</text>
    <text x="196" y="118" fill="#1a4fd6">h</text><text x="110" y="100">b</text><text x="244" y="104">a</text><text x="120" y="190">c</text>
  </g>
</svg>
