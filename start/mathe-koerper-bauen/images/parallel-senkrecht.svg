<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 105" width="340" role="img" aria-label="Links zwei waagerechte Linien untereinander, parallel, mit einer gestrichelten Linie dazwischen als Abstand. Rechts eine waagerechte und eine senkrechte Linie, die einen rechten Winkel bilden, mit Winkelzeichen."><title>Parallel und senkrecht</title>
<line x1="20" y1="30" x2="150" y2="30" stroke="#1a1a1a" stroke-width="3"/>
<line x1="20" y1="70" x2="150" y2="70" stroke="#1a1a1a" stroke-width="3"/>
<line x1="85" y1="30" x2="85" y2="70" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="100" y="54" font-family="sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Abstand</text>
<text x="85" y="95" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">parallel</text>
<line x1="190" y1="75" x2="320" y2="75" stroke="#1a1a1a" stroke-width="3"/>
<line x1="230" y1="75" x2="230" y2="15" stroke="#1a1a1a" stroke-width="3"/>
<polyline points="240,75 240,65 230,65" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="255" y="95" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">senkrecht</text>
</svg>
