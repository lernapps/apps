<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 112" width="500" role="img" aria-label="Fünf ebene Figuren nebeneinander, beschriftet: ein Quadrat mit vier gleich langen Seiten, ein Rechteck, ein rechtwinkliges Dreieck, ein Kreis mit Mittelpunkt, Radius r und Durchmesser d, und ein Fünfeck. Rechte Winkel sind mit einem kleinen Winkelzeichen markiert."><title>Ebene Grundfiguren</title>
<polygon points="10,20 70,20 70,80 10,80" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
<polyline points="20,20 20,30 10,30" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="40" y="100" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Quadrat</text>
<polygon points="100,30 190,30 190,80 100,80" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
<polyline points="110,30 110,40 100,40" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="145" y="100" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Rechteck</text>
<polygon points="220,80 290,80 220,25" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
<polyline points="230,80 230,70 220,70" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="255" y="100" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Dreieck</text>
<circle cx="350" cy="52" r="32" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
<line x1="318" y1="52" x2="382" y2="52" stroke="#1a1a1a" stroke-width="2"/>
<line x1="350" y1="52" x2="350" y2="20" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4 3"/>
<text x="335" y="46" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">d</text>
<text x="358" y="40" font-family="sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">r</text>
<circle cx="350" cy="52" r="2.5" fill="#1a1a1a"/>
<text x="350" y="100" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Kreis</text>
<polygon points="420,80 470,80 485,40 445,15 405,40" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
<text x="445" y="100" font-family="sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Fünfeck</text>
</svg>
