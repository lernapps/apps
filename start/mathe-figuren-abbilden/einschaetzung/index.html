<label class="question-option"><input type="checkbox" name="frage-a17" value="1"> <span>Quadrat</span></label>

<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Du willst ein Dreieck mit den Seiten 2 cm, 3 cm und 8 cm konstruieren. Was passiert?</legend>
<label class="question-option"><input type="radio" name="frage-a20" value="0"> <span>Die beiden Bögen schneiden sich nicht, das Dreieck gibt es nicht.</span></label>
<label class="question-option"><input type="radio" name="frage-a20" value="1"> <span>Die Bögen schneiden sich genau einmal.</span></label>

<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Die beiden Bögen schneiden sich nicht, das Dreieck gibt es nicht.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig. Die Bögen von 2 cm und 3 cm reichen von den Enden der 8-cm-Strecke nicht bis zueinander.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Die Bögen schneiden sich genau einmal.</strong></p><p>Dann müssten sich die Bögen treffen. Die Bögen von 2 cm und 3 cm reichen zusammen aber nur 5 cm weit, die Strecke ist 8 cm lang.</p></li>

</ul>
<p class="question-explanation">Die Bögen von 2 cm und 3 cm reichen von den Enden der 8-cm-Strecke nicht bis zueinander. Sie treffen sich nicht, also gibt es kein Dreieck.</p>
