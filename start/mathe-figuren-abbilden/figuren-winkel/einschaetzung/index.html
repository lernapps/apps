<li class="question-info" data-option="1"><p class="question-info-head"><strong>Die Bögen schneiden sich genau einmal.</strong></p><p>Dann müssten sich die Bögen treffen. Die Bögen von 2 cm und 3 cm reichen zusammen aber nur 5 cm weit, die Strecke ist 8 cm lang.</p></li>

<p class="question-explanation">Die Bögen von 2 cm und 3 cm reichen von den Enden der 8-cm-Strecke nicht bis zueinander. Sie treffen sich nicht, also gibt es kein Dreieck.</p>
