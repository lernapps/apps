<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 155" role="img"><title>Ein Rechteck mit zwei Faltlinien, ein Quadrat mit vier und ein Dreieck mit einer</title><rect width="100%" height="100%" fill="#fff"/><text x="200" y="20" font-size="15" text-anchor="middle" font-family="sans-serif" fill="#111" font-weight="bold">Symmetrieachsen</text><polygon points="20,50 110,50 110,110 20,110" fill="#cfe0f5" stroke="#111" stroke-width="2"/><line x1="65" y1="40" x2="65" y2="120" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/><line x1="10" y1="80" x2="120" y2="80" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/><text x="65" y="140" font-size="12" text-anchor="middle" font-family="sans-serif" fill="#111">Rechteck</text><polygon points="160,50 220,50 220,110 160,110" fill="#cfe0f5" stroke="#111" stroke-width="2"/><line x1="190" y1="40" x2="190" y2="120" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/><line x1="150" y1="80" x2="230" y2="80" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/><line x1="150" y1="40" x2="230" y2="120" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/><line x1="230" y1="40" x2="150" y2="120" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/><text x="190" y="140" font-size="12" text-anchor="middle" font-family="sans-serif" fill="#111">Quadrat</text><polygon points="280,110 360,110 320,40" fill="#cfe0f5" stroke="#111" stroke-width="2"/><line x1="320" y1="30" x2="320" y2="120" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/><text x="320" y="140" font-size="11" text-anchor="middle" font-family="sans-serif" fill="#111">gleichschenkliges Dreieck</text></svg>