<fieldset>
<legend class="question-text">Welche Figuren sind punktsymmetrisch?</legend>
<label class="question-option"><input type="checkbox" name="frage-a2" value="0"> <span>Rechteck</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="1"> <span>Parallelogramm</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="2"> <span>gleichseitiges Dreieck</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="3"> <span>Quadrat</span></label>

<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Rechteck</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig. Nach einer halben Drehung um die Mitte sieht es wieder gleich aus.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Parallelogramm</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig. Auch das schiefe Parallelogramm sieht nach einer halben Drehung gleich aus.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>gleichseitiges Dreieck</strong></p><p>Nach einer halben Drehung steht es auf dem Kopf. Es ist nur drehsymmetrisch mit 120°.</p></li>
<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>Quadrat</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig. Es sieht schon nach einer Vierteldrehung gleich aus, also auch nach einer halben.</p></li>
</ul>
<p class="question-explanation">Punktsymmetrisch heißt, nach einer halben Drehung sieht die Figur wieder gleich aus.</p>
