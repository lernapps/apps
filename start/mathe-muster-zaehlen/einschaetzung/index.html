<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 12 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<h2 id="teil-1" tabindex="-1">Seite 1 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Setze die Folge fort: 5, 9, 13, 17, ... Welche Zahl kommt als Nächstes?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a2">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 21</p>
<p class="question-explanation">Der Abstand ist 4, denn 9 − 5 = 4 und 13 − 9 = 4. Also 17 + 4 = 21.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welcher Term beschreibt die Folge 5, 9, 13, 17, wenn <math><mi>n</mi></math> die Nummer des Bildes ist?</legend>

<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>4 · n + 1</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>n + 4</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="3"> <span>4 · n</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>5 · n</strong></p><p>Für n = 2 ergibt der Term 10, nicht 9.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>4 · n + 1</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Für n = 1 ergibt der Term 5, für n = 4 ergibt er 17.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>n + 4</strong></p><p>Für n = 2 ergibt der Term 6, nicht 9.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>4 · n</strong></p><p>Für n = 1 ergibt der Term 4, nicht 5.</p></li>
</ul>
<p class="question-explanation">Vor n steht der Abstand 4, danach kommt 1 dazu.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 3</h2>

<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Mira legt einen Würfel mit Kante 4. Er hat 4 Lagen, jede Lage ist ein Quadrat aus 4 mal 4 Plättchen. Wie viele Plättchen braucht sie?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a6">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 64</p>
<p class="question-explanation">Eine Lage hat 4 · 4 = 16 Plättchen, vier Lagen sind 16 · 4 = 64, also <math><msup><mn>4</mn><mn>3</mn></msup></math>.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="question" id="frage-a8" data-id="a8" data-type="number">

</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 12</p>
<p class="question-explanation">Hinter der 1 stehen zwölf Nullen, also sind es zwölf Faktoren 10.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-back">Zurück</button> <button type="button" class="explainer-assessment-next">Weiter</button></p>

<li class="explainer-assessment-item" data-key="a10"><p class="explainer-assessment-label">Aufgabe 10</p><div class="question" id="frage-a10" data-id="a10" data-type="number">
<form class="question-form" novalidate>
<fieldset>

<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a10">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>

</form>
</div></li>
<li class="explainer-assessment-item" data-key="a11"><p class="explainer-assessment-label">Aufgabe 11</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a12"><p class="explainer-assessment-label">Aufgabe 12</p><div class="question" id="frage-a12" data-id="a12" data-type="number">

<fieldset>

<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a12">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 3</p>
<p class="question-explanation">Die erste und die dritte Stufe geben 2 · 4 = 8. Weil 8 · 3 = 24 ist, hat die zweite Stufe 3 Äste.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
