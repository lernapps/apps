<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wer macht was? Ordne zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Sie macht die Gesetze und entscheidet über Krieg.</span> <select name="frage-a13-0" data-left="0"><option value="">bitte wählen</option><option value="1">the President</option><option value="2">the Supreme Court</option><option value="0">Congress</option></select></label></li>
<li><label><span>Er sagt Nein zu einem Gesetz.</span> <select name="frage-a13-1" data-left="1"><option value="">bitte wählen</option><option value="1">the President</option><option value="2">the Supreme Court</option><option value="0">Congress</option></select></label></li>
<li><label><span>Sie prüft, ob ein Gesetz zur Verfassung passt.</span> <select name="frage-a13-2" data-left="2"><option value="">bitte wählen</option><option value="1">the President</option><option value="2">the Supreme Court</option><option value="0">Congress</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
