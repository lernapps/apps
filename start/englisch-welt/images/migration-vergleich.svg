<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img">
  <title>Balkendiagramm: Anteil der im Ausland Geborenen im Vereinigten Königreich und in den USA</title>
  <rect width="480" height="270" fill="#f4efe2"/>
  <line x1="40" y1="30" x2="40" y2="196" stroke="#333" stroke-width="2"/>
  <line x1="40.0" y1="196" x2="40.0" y2="204" stroke="#333" stroke-width="2"/>
  <text x="40.0" y="226" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#333">0 %</text>
  <line x1="140.0" y1="196" x2="140.0" y2="204" stroke="#333" stroke-width="2"/>
  <text x="140.0" y="226" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#333">5 %</text>
  <line x1="240.0" y1="196" x2="240.0" y2="204" stroke="#333" stroke-width="2"/>
  <text x="240.0" y="226" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#333">10 %</text>
  <line x1="340.0" y1="196" x2="340.0" y2="204" stroke="#333" stroke-width="2"/>
  <text x="340.0" y="226" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#333">15 %</text>
  <line x1="440.0" y1="196" x2="440.0" y2="204" stroke="#333" stroke-width="2"/>
  <text x="440.0" y="226" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="normal" fill="#333">20 %</text>
  <text x="48" y="24" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">United Kingdom, 2021 to 2022 censuses</text>
  <rect x="40" y="32" width="320.0" height="36" rx="3" fill="#2c6fd8" stroke="#333" stroke-width="2"/>
  <text x="350.0" y="57" text-anchor="end" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">16 %</text>
  <text x="48" y="88" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="normal" fill="#333">10.7 million people born abroad</text>
  <text x="48" y="118" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">United States, January 2025</text>
  <rect x="40" y="126" width="316.0" height="36" rx="3" fill="#d35400" stroke="#333" stroke-width="2"/>
  <text x="346.0" y="151" text-anchor="end" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">15.8 %</text>
  <text x="48" y="182" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="normal" fill="#333">53.3 million people born abroad</text>

