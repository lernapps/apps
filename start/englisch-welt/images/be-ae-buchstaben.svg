<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
  <title>Vier Wortpaare mit markierten Buchstaben, die sich unterscheiden</title>
  <rect width="480" height="300" fill="#f4efe2"/>
  <text x="36" y="30" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2c6fd8">britisch</text>
  <text x="250" y="30" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#d35400">amerikanisch</text>
  <line x1="228" y1="40" x2="228" y2="250" stroke="#333" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="36" y="80" font-family="sans-serif" font-size="20" fill="#2c6fd8" text-anchor="start">hon<tspan font-weight="bold" text-decoration="underline">ou</tspan>r</text>
  <text x="250" y="80" font-family="sans-serif" font-size="20" fill="#d35400" text-anchor="start">hon<tspan font-weight="bold" text-decoration="underline">o</tspan>r</text>
  <text x="36" y="130" font-family="sans-serif" font-size="20" fill="#2c6fd8" text-anchor="start">lit<tspan font-weight="bold" text-decoration="underline">re</tspan></text>
  <text x="250" y="130" font-family="sans-serif" font-size="20" fill="#d35400" text-anchor="start">lit<tspan font-weight="bold" text-decoration="underline">er</tspan></text>
  <text x="36" y="180" font-family="sans-serif" font-size="20" fill="#2c6fd8" text-anchor="start">rea<tspan font-weight="bold" text-decoration="underline">lis</tspan>e</text>
  <text x="250" y="180" font-family="sans-serif" font-size="20" fill="#d35400" text-anchor="start">rea<tspan font-weight="bold" text-decoration="underline">liz</tspan>e</text>
  <text x="36" y="230" font-family="sans-serif" font-size="20" fill="#2c6fd8" text-anchor="start">can<tspan font-weight="bold" text-decoration="underline">cell</tspan>ed</text>
  <text x="250" y="230" font-family="sans-serif" font-size="20" fill="#d35400" text-anchor="start">can<tspan font-weight="bold" text-decoration="underline">cel</tspan>ed</text>
  <text x="20" y="282" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="normal" fill="#333">Die unterstrichenen Buchstaben sind anders.</text>

</svg>
