<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img">
  <title>Drei Wörter mit Lesehilfe für die britische und die amerikanische Aussprache</title>
  <rect width="480" height="280" fill="#f4efe2"/>
  <rect x="20" y="8" width="20" height="20" rx="3" fill="#2c6fd8" stroke="#333" stroke-width="1"/>
  <text x="48" y="24" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">britisch</text>
  <rect x="160" y="8" width="20" height="20" rx="3" fill="#d35400" stroke="#333" stroke-width="1"/>
  <text x="188" y="24" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">amerikanisch</text>
  <rect x="20" y="40" width="440" height="60" rx="6" fill="#f4efe2" stroke="#333" stroke-width="2"/>
  <text x="36" y="76" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">stork</text>
  <text x="200" y="65" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#2c6fd8">britisch: stohk</text>
  <text x="200" y="89" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#d35400">amerikanisch: stohrk</text>
  <rect x="20" y="110" width="440" height="60" rx="6" fill="#f4efe2" stroke="#333" stroke-width="2"/>
  <text x="36" y="146" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">ladder · latter</text>
  <text x="200" y="135" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#2c6fd8">britisch: verschieden</text>
  <text x="200" y="159" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#d35400">amerikanisch: gleich</text>
  <rect x="20" y="180" width="440" height="60" rx="6" fill="#f4efe2" stroke="#333" stroke-width="2"/>
  <text x="36" y="216" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333">grass</text>
  <text x="200" y="205" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#2c6fd8">britisch: grahss</text>
  <text x="200" y="229" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#d35400">amerikanisch: gräss</text>

</svg>
