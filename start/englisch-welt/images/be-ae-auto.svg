  <text x="48" y="24" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">britisch</text>
  <rect x="160" y="8" width="20" height="20" rx="3" fill="#d35400" stroke="#333" stroke-width="1"/>
  <text x="188" y="24" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">amerikanisch</text>
  <polygon points="70,170 70,130 120,120 170,85 290,85 340,120 410,130 410,170" fill="#e3d9bd" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <rect x="184" y="96" width="46" height="30" rx="3" fill="#f4efe2" stroke="#333" stroke-width="2"/>
  <rect x="238" y="96" width="46" height="30" rx="3" fill="#f4efe2" stroke="#333" stroke-width="2"/>
  <circle cx="130" cy="172" r="22" fill="#555" stroke="#333" stroke-width="2"/>
  <circle cx="130" cy="172" r="9" fill="#ccc" stroke="#333" stroke-width="1"/>
  <circle cx="350" cy="172" r="22" fill="#555" stroke="#333" stroke-width="2"/>
  <circle cx="350" cy="172" r="9" fill="#ccc" stroke="#333" stroke-width="1"/>
  <rect x="68" y="136" width="10" height="14" rx="3" fill="#f7e27a" stroke="#333" stroke-width="1"/>
  <line x1="105" y1="124" x2="105" y2="205" stroke="#333" stroke-width="2"/>
  <line x1="370" y1="126" x2="370" y2="205" stroke="#333" stroke-width="2"/>
  <text x="105" y="232" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2c6fd8">bonnet</text>
  <text x="105" y="256" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#d35400">hood</text>
  <text x="370" y="232" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2c6fd8">boot</text>
  <text x="370" y="256" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#d35400">trunk</text>
  <text x="20" y="290" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="normal" fill="#333">Schemabild, nicht genau nach Maßstab</text>

