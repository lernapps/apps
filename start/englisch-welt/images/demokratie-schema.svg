<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
  <title>Schema der repräsentativen Demokratie</title>
  <rect width="480" height="300" fill="#f4efe2"/>
  <rect x="20" y="24" width="150" height="60" rx="6" fill="#e3edf7" stroke="#333" stroke-width="2"/>
  <text x="95" y="62" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Citizens</text>
  <rect x="310" y="24" width="150" height="60" rx="6" fill="#f7e8d8" stroke="#333" stroke-width="2"/>
  <text x="385" y="48" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Elected</text>
  <text x="385" y="70" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">representatives</text>
  <rect x="310" y="140" width="150" height="60" rx="6" fill="#e1f0e8" stroke="#333" stroke-width="2"/>
  <text x="385" y="178" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Laws</text>
  <line x1="170" y1="54" x2="308" y2="54" stroke="#333" stroke-width="3"/>
  <polygon points="308,54 296,47 296,61" fill="#333" stroke="#333" stroke-width="1" stroke-linejoin="round"/>
  <text x="240" y="44" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">vote for</text>
  <line x1="385" y1="86" x2="385" y2="138" stroke="#333" stroke-width="3"/>
  <polygon points="385,138 378,126 392,126" fill="#333" stroke="#333" stroke-width="1" stroke-linejoin="round"/>
  <text x="430" y="118" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">make</text>
  <line x1="310" y1="170" x2="95" y2="170" stroke="#333" stroke-width="3"/>
  <line x1="95" y1="170" x2="95" y2="86" stroke="#333" stroke-width="3"/>
  <polygon points="95,86 88,98 102,98" fill="#333" stroke="#333" stroke-width="1" stroke-linejoin="round"/>
  <text x="200" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">apply to everyone</text>
  <rect x="20" y="216" width="440" height="38" rx="4" fill="#f4efe2" stroke="#333" stroke-width="2"/>
  <text x="240" y="241" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">In between: meet, protest, write petitions</text>

</svg>
