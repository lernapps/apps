<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
  <title>Vier Abstandszonen als Ringe um eine Person</title>
  <rect width="480" height="300" fill="#f4efe2"/>
  <rect x="0" y="0" width="480" height="300" fill="#f4efe2"/>
  <circle cx="150" cy="150" r="128" fill="#e9f1f7" stroke="#333" stroke-width="2"/>
  <circle cx="150" cy="150" r="96" fill="#dcebf5" stroke="#333" stroke-width="2"/>
  <circle cx="150" cy="150" r="64" fill="#cfe3f1" stroke="#333" stroke-width="2"/>
  <circle cx="150" cy="150" r="32" fill="#b9d6ec" stroke="#333" stroke-width="2"/>
  <circle cx="150" cy="150" r="8" fill="#333"/>
  <line x1="166" y1="122" x2="304" y2="35" stroke="#333" stroke-width="1.5"/>
  <circle cx="166" cy="122" r="3" fill="#333"/>
  <text x="312" y="40" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">intimate</text>
  <text x="312" y="58" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="normal" fill="#333">bis etwa 0,5 m</text>
  <line x1="205" y1="118" x2="304" y2="90" stroke="#333" stroke-width="1.5"/>
  <circle cx="205" cy="118" r="3" fill="#333"/>
  <text x="312" y="95" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">personal</text>
  <text x="312" y="113" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="normal" fill="#333">etwa 0,5 bis 1,2 m</text>
  <line x1="245" y1="167" x2="304" y2="145" stroke="#333" stroke-width="1.5"/>
  <circle cx="245" cy="167" r="3" fill="#333"/>
  <text x="312" y="150" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">social</text>
  <text x="312" y="168" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="normal" fill="#333">etwa 1,2 bis 3,7 m</text>
  <line x1="248" y1="232" x2="304" y2="200" stroke="#333" stroke-width="1.5"/>
  <circle cx="248" cy="232" r="3" fill="#333"/>
  <text x="312" y="205" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">public</text>
  <text x="312" y="223" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="normal" fill="#333">mehr als 3,7 m</text>

</svg>
