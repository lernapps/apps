<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
  <title>Stundenplan eines Tages mit Homeroom, vier Unterrichtsstunden, Mittagessen und Sporttraining</title>
  <rect width="480" height="300" fill="#f4efe2"/>
  <text x="240" y="24" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Jaydens Schultag (Beispiel)</text>
  <rect x="30" y="36" width="420" height="28" rx="6" fill="#fff4d6" stroke="#333" stroke-width="2"/>
  <text x="46" y="56" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">Homeroom</text>
  <rect x="30" y="69" width="420" height="28" rx="6" fill="#e3d9bd" stroke="#333" stroke-width="2"/>
  <text x="46" y="89" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">First period</text>
  <rect x="30" y="102" width="420" height="28" rx="6" fill="#e3d9bd" stroke="#333" stroke-width="2"/>
  <text x="46" y="122" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">Second period</text>
  <rect x="30" y="135" width="420" height="28" rx="6" fill="#d7ecd9" stroke="#333" stroke-width="2"/>
  <text x="46" y="155" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">Lunch</text>
  <rect x="30" y="168" width="420" height="28" rx="6" fill="#cfe3f1" stroke="#333" stroke-width="2"/>
  <text x="46" y="188" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">Third period · music (elective)</text>
  <rect x="30" y="201" width="420" height="28" rx="6" fill="#e3d9bd" stroke="#333" stroke-width="2"/>
  <text x="46" y="221" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">Fourth period</text>
  <rect x="30" y="234" width="420" height="28" rx="6" fill="#f7d9c4" stroke="#333" stroke-width="2"/>
  <text x="46" y="254" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">After school: sports practice</text>

</svg>
