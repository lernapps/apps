<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 12 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<li><label><span>Ellie always walks to school.</span> <select name="frage-a7-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>

</ul>

<p><strong>Richtige Antwort:</strong> 1. Ellie always walks to school., 2. Amir usually walks to school., 3. Peter often walks to school., 4. Sophie sometimes walks to school., 5. Mr Hill never walks to school.</p>
<p class="question-explanation">Die Reihenfolge ist always, usually, often, sometimes, never. Das Wort steht jedes Mal vor walks.</p>
