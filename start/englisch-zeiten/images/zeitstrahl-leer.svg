<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Leerer Zeitstrahl mit früher, now und später</title>
  <rect width="480" height="200" fill="#f4efe2"/>
  <line x1="20" y1="110" x2="458" y2="110" stroke="#333" stroke-width="3"/>
  <polygon points="462,110 450,103 450,117" fill="#333"/>
  <text x="24" y="170" font-family="sans-serif" font-size="16" fill="#333">früher</text>
  <text x="456" y="170" text-anchor="end" font-family="sans-serif" font-size="16" fill="#333">später</text>
  <line x1="240" y1="76" x2="240" y2="156" stroke="#c0392b" stroke-width="4"/>
  <text x="240" y="176" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c0392b">now</text>
</svg>
