<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Zeitstrahl mit einer Reihe von Punkten und dem Fähnchen every Saturday</title>
  <rect width="480" height="200" fill="#f4efe2"/>
  <line x1="20" y1="120" x2="458" y2="120" stroke="#333" stroke-width="3"/>
  <polygon points="462,120 450,113 450,127" fill="#333"/>
  <text x="24" y="190" font-family="sans-serif" font-size="16" fill="#333">früher</text>
  <text x="456" y="190" text-anchor="end" font-family="sans-serif" font-size="16" fill="#333">später</text>
  <line x1="240" y1="86" x2="240" y2="166" stroke="#c0392b" stroke-width="4"/>
  <text x="240" y="186" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c0392b">now</text>
  <g fill="#2c6fd8">
    <circle cx="60" cy="120" r="8"/><circle cx="110" cy="120" r="8"/><circle cx="160" cy="120" r="8"/>
    <circle cx="210" cy="120" r="8"/><circle cx="270" cy="120" r="8"/><circle cx="320" cy="120" r="8"/>
    <circle cx="370" cy="120" r="8"/><circle cx="420" cy="120" r="8"/>
  </g>
  <line x1="160" y1="112" x2="160" y2="40" stroke="#333" stroke-width="2"/>
  <rect x="160" y="30" width="170" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="245" y="51" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">every Saturday</text>
</svg>
