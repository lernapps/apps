<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Zeitstrahl mit zwei Punktpaaren: links die Vergangenheit, rechts die Zukunft</title>
  <rect width="480" height="200" fill="#f4efe2"/>
  <line x1="20" y1="120" x2="458" y2="120" stroke="#333" stroke-width="3"/>
  <polygon points="462,120 450,113 450,127" fill="#333"/>
  <text x="24" y="190" font-family="sans-serif" font-size="16" fill="#333">früher</text>
  <text x="456" y="190" text-anchor="end" font-family="sans-serif" font-size="16" fill="#333">später</text>
  <line x1="240" y1="86" x2="240" y2="166" stroke="#c0392b" stroke-width="4"/>
  <text x="240" y="186" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c0392b">now</text>
  <circle cx="60" cy="120" r="9" fill="#2c6fd8"/>
  <circle cx="160" cy="120" r="9" fill="#2c6fd8"/>
  <line x1="60" y1="111" x2="60" y2="70" stroke="#333" stroke-width="2"/>
  <rect x="10" y="40" width="100" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="60" y="61" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">had done</text>
  <line x1="160" y1="111" x2="160" y2="70" stroke="#333" stroke-width="2"/>
  <rect x="130" y="40" width="60" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="160" y="61" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">did</text>
  <circle cx="320" cy="120" r="9" fill="#d35400"/>
  <circle cx="420" cy="120" r="9" fill="#d35400"/>
  <line x1="320" y1="111" x2="320" y2="70" stroke="#333" stroke-width="2"/>
  <rect x="260" y="40" width="118" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="320" y="61" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">when it stops</text>
  <line x1="420" y1="111" x2="420" y2="70" stroke="#333" stroke-width="2"/>
  <rect x="387" y="40" width="68" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="420" y="61" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">will do</text>
</svg>
