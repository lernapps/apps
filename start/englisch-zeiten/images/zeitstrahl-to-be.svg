<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Zeitstrahl mit einer Karte bei now</title>
  <rect width="480" height="200" fill="#f4efe2"/>
  <line x1="20" y1="120" x2="458" y2="120" stroke="#333" stroke-width="3"/>
  <polygon points="462,120 450,113 450,127" fill="#333"/>
  <text x="24" y="190" font-family="sans-serif" font-size="16" fill="#333">früher</text>
  <text x="456" y="190" text-anchor="end" font-family="sans-serif" font-size="16" fill="#333">später</text>
  <line x1="240" y1="40" x2="240" y2="166" stroke="#c0392b" stroke-width="4"/>
  <text x="240" y="186" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c0392b">now</text>
  <rect x="150" y="30" width="180" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="240" y="53" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#222">I am Sophie.</text>
</svg>
