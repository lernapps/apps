<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Zeitstrahl mit zwei einzelnen Punkten links von now und den Fähnchen yesterday und last week</title>
  <rect width="480" height="200" fill="#f4efe2"/>
  <line x1="20" y1="120" x2="458" y2="120" stroke="#333" stroke-width="3"/>
  <polygon points="462,120 450,113 450,127" fill="#333"/>
  <text x="24" y="190" font-family="sans-serif" font-size="16" fill="#333">früher</text>
  <text x="456" y="190" text-anchor="end" font-family="sans-serif" font-size="16" fill="#333">später</text>
  <line x1="320" y1="86" x2="320" y2="166" stroke="#c0392b" stroke-width="4"/>
  <text x="320" y="186" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c0392b">now</text>
  <circle cx="250" cy="120" r="9" fill="#2c6fd8"/>
  <line x1="250" y1="112" x2="250" y2="86" stroke="#333" stroke-width="2"/>
  <rect x="250" y="56" width="110" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="305.0" y="77" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">yesterday</text>
  <circle cx="110" cy="120" r="9" fill="#2c6fd8"/>
  <line x1="110" y1="112" x2="110" y2="86" stroke="#333" stroke-width="2"/>
  <rect x="110" y="56" width="115" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="167.5" y="77" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">last week</text>
</svg>
