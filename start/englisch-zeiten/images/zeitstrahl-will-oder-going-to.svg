<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Zeitstrahl mit zwei Zeichen rechts von now: ein Pfeil von now zu einem Punkt mit dem Fähnchen going to und ein einzelner Punkt ohne Pfeil mit dem Fähnchen will</title>
  <rect width="480" height="200" fill="#f4efe2"/>
  <line x1="20" y1="120" x2="458" y2="120" stroke="#333" stroke-width="3"/>
  <polygon points="462,120 450,113 450,127" fill="#333"/>
  <text x="24" y="190" font-family="sans-serif" font-size="16" fill="#333">früher</text>
  <text x="456" y="190" text-anchor="end" font-family="sans-serif" font-size="16" fill="#333">später</text>
  <line x1="240" y1="86" x2="240" y2="156" stroke="#c0392b" stroke-width="4"/>
  <text x="240" y="178" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c0392b">now</text>
  <line x1="240" y1="98" x2="312" y2="98" stroke="#d35400" stroke-width="4"/>
  <polygon points="328,98 312,90 312,106" fill="#d35400"/>
  <circle cx="340" cy="120" r="9" fill="#d35400"/>
  <circle cx="430" cy="120" r="9" fill="#d35400"/>
  <line x1="340" y1="111" x2="340" y2="58" stroke="#333" stroke-width="2"/>
  <rect x="256" y="28" width="116" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="314" y="49" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">going to</text>
  <line x1="430" y1="111" x2="430" y2="58" stroke="#333" stroke-width="2"/>
  <rect x="400" y="28" width="60" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="430" y="49" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">will</text>
</svg>
