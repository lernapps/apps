<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Zeitstrahl mit einem Bogen von einem Startpunkt bis now, mit den Fähnchen since und for</title>
  <rect width="480" height="200" fill="#f4efe2"/>
  <line x1="20" y1="120" x2="458" y2="120" stroke="#333" stroke-width="3"/>
  <polygon points="462,120 450,113 450,127" fill="#333"/>
  <text x="24" y="190" font-family="sans-serif" font-size="16" fill="#333">früher</text>
  <text x="456" y="190" text-anchor="end" font-family="sans-serif" font-size="16" fill="#333">später</text>
  <line x1="380" y1="86" x2="380" y2="166" stroke="#c0392b" stroke-width="4"/>
  <text x="380" y="186" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c0392b">now</text>
  <path d="M 110 120 Q 245 30 380 120" fill="none" stroke="#138d75" stroke-width="4"/>
  <circle cx="110" cy="120" r="9" fill="#2c6fd8"/>
  <line x1="110" y1="111" x2="110" y2="62" stroke="#333" stroke-width="2"/>
  <rect x="48" y="32" width="136" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="116" y="53" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">since Tuesday</text>
  <path d="M 112 138 L 112 146 L 378 146 L 378 138" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="188" y="150" width="114" height="26" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="245" y="169" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">for 3 days</text>
</svg>
