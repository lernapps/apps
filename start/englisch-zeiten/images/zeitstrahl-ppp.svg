<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Zeitstrahl mit einer Welle, die bis zu einem Punkt in der Vergangenheit reicht, und einem Bogen darüber</title>
  <rect width="480" height="200" fill="#f4efe2"/>
  <line x1="20" y1="130" x2="458" y2="130" stroke="#333" stroke-width="3"/>
  <polygon points="462,130 450,123 450,137" fill="#333"/>
  <text x="24" y="190" font-family="sans-serif" font-size="16" fill="#333">früher</text>
  <text x="456" y="116" text-anchor="end" font-family="sans-serif" font-size="16" fill="#333">später</text>
  <line x1="400" y1="96" x2="400" y2="176" stroke="#c0392b" stroke-width="4"/>
  <text x="400" y="88" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c0392b">now</text>
  <path d="M 50 130 q 10 -18 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0" fill="none" stroke="#8e44ad" stroke-width="4"/>
  <path d="M 50 118 Q 150 40 250 118" fill="none" stroke="#138d75" stroke-width="3"/>
  <circle cx="250" cy="130" r="9" fill="#2c6fd8"/>
  <line x1="50" y1="140" x2="50" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="250" y1="140" x2="250" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="50" y1="150" x2="250" y2="150" stroke="#333" stroke-width="2"/>
  <text x="150" y="172" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">for more than two years</text>
  <rect x="190" y="40" width="130" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="250" y1="70" x2="250" y2="121" stroke="#333" stroke-width="2"/>
  <text x="255" y="61" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">tower finished</text>
</svg>
