<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
  <title>Zwei Zeitstrahlen: eine Welle um einen Zeitpunkt der Zukunft und ein Bogen bis zu diesem Zeitpunkt</title>
  <rect width="480" height="300" fill="#f4efe2"/>
  <g font-family="sans-serif" font-size="16" fill="#333">
    <text x="24" y="28">Welle um den Zeitpunkt</text>
    <line x1="20" y1="90" x2="458" y2="90" stroke="#333" stroke-width="3"/>
    <polygon points="462,90 450,83 450,97" fill="#333"/>
    <line x1="90" y1="62" x2="90" y2="118" stroke="#c0392b" stroke-width="4"/>
    <text x="90" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="#c0392b">now</text>
    <path d="M 300 90 q 12 -22 24 0 t 24 0 t 24 0 t 24 0" fill="none" stroke="#8e44ad" stroke-width="4"/>
    <line x1="372" y1="56" x2="372" y2="82" stroke="#333" stroke-width="2"/>
    <rect x="332" y="42" width="80" height="26" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="372" y="61" text-anchor="middle" fill="#222">at eight</text>
    <text x="24" y="168">Bogen bis zum Zeitpunkt</text>
    <line x1="20" y1="240" x2="458" y2="240" stroke="#333" stroke-width="3"/>
    <polygon points="462,240 450,233 450,247" fill="#333"/>
    <line x1="90" y1="212" x2="90" y2="268" stroke="#c0392b" stroke-width="4"/>
    <text x="90" y="288" text-anchor="middle" font-size="18" font-weight="bold" fill="#c0392b">now</text>
    <path d="M 90 240 Q 230 150 372 240" fill="none" stroke="#138d75" stroke-width="4"/>
    <circle cx="372" cy="240" r="9" fill="#2c6fd8"/>
    <rect x="332" y="192" width="80" height="26" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="372" y="211" text-anchor="middle" fill="#222">by eight</text>
    <line x1="372" y1="218" x2="372" y2="230" stroke="#333" stroke-width="2"/>
  </g>
</svg>
