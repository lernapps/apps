<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Zeitstrahl mit einem Punkt mit Zeitangabe und einem Bogen bis now</title>
  <rect width="480" height="200" fill="#f4efe2"/>
  <line x1="20" y1="120" x2="458" y2="120" stroke="#333" stroke-width="3"/>
  <polygon points="462,120 450,113 450,127" fill="#333"/>
  <text x="24" y="190" font-family="sans-serif" font-size="16" fill="#333">früher</text>
  <text x="456" y="190" text-anchor="end" font-family="sans-serif" font-size="16" fill="#333">später</text>
  <line x1="390" y1="86" x2="390" y2="166" stroke="#c0392b" stroke-width="4"/>
  <text x="390" y="186" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c0392b">now</text>
  <circle cx="90" cy="120" r="9" fill="#2c6fd8"/>
  <line x1="90" y1="111" x2="90" y2="70" stroke="#333" stroke-width="2"/>
  <rect x="40" y="40" width="100" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="90" y="61" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">yesterday</text>
  <path d="M 190 120 Q 290 40 390 120" fill="none" stroke="#138d75" stroke-width="4"/>
  <circle cx="190" cy="120" r="5" fill="#138d75"/>
  <rect x="250" y="38" width="80" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="290" y="59" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">already</text>
</svg>
