<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Zeitstrahl mit einer grauen Punktreihe in der Vergangenheit, die vor now endet</title>
  <rect width="480" height="200" fill="#f4efe2"/>
  <line x1="20" y1="130" x2="458" y2="130" stroke="#333" stroke-width="3"/>
  <polygon points="462,130 450,123 450,137" fill="#333"/>
  <text x="24" y="190" font-family="sans-serif" font-size="16" fill="#333">früher</text>
  <text x="456" y="116" text-anchor="end" font-family="sans-serif" font-size="16" fill="#333">später</text>
  <line x1="400" y1="96" x2="400" y2="176" stroke="#c0392b" stroke-width="4"/>
  <text x="400" y="88" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c0392b">now</text>
  <circle cx="60" cy="130" r="8" fill="#8a8a8a"/>
  <circle cx="100" cy="130" r="8" fill="#8a8a8a"/>
  <circle cx="140" cy="130" r="8" fill="#8a8a8a"/>
  <circle cx="180" cy="130" r="8" fill="#8a8a8a"/>
  <circle cx="220" cy="130" r="8" fill="#8a8a8a"/>
  <circle cx="260" cy="130" r="8" fill="#8a8a8a"/>
  <circle cx="300" cy="130" r="8" fill="#8a8a8a"/>
  <rect x="120" y="50" width="120" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="80" x2="180" y2="120" stroke="#333" stroke-width="2"/>
  <text x="180" y="71" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">used to fly</text>
  <text x="215" y="172" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">heute nicht mehr</text>
</svg>
