<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../funktionen/">Was eine Funktion ist</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 9 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Eine Zuordnung hat die Paare (1|5), (2|6), (2|7), (3|8). Wie viele <math><mi>y</mi></math>-Werte gehören zu <math><mi>x</mi></math> = 2?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a1">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 2</p>
<p class="question-explanation">Zu <math><mi>x</mi></math> = 2 gehören 6 und 7. Das sind zwei <math><mi>y</mi></math>-Werte, also ist die Zuordnung keine Funktion.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Zuordnungen sind Funktionen? Wähle alle richtigen.</legend>
<label class="question-option"><input type="checkbox" name="frage-a2" value="0"> <span>Schüler → Geburtsmonat</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="1"> <span>Geburtsmonat → Schüler der Klasse</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="2"> <span>Strecke → Fahrpreis beim Taxi</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="3"> <span>Mensch → Geschwister</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Schüler → Geburtsmonat</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Jeder Schüler hat genau einen Geburtsmonat.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Geburtsmonat → Schüler der Klasse</strong></p><p>Zu Mai gehören mehrere Schüler. Ein <math><mi>x</mi></math> hat mehrere <math><mi>y</mi></math>.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>Strecke → Fahrpreis beim Taxi</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Zu jeder Strecke gehört genau ein Preis.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Mensch → Geschwister</strong></p><p>Ein Mensch kann mehrere Geschwister haben, oder keines. Das ist kein einzelner Wert.</p></li>
</ul>
<p class="question-explanation">Prüfe, ob zu jedem Wert links genau ein Wert rechts gehört.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-assessment-live"></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jedem Punkt seinen Quadranten zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>(3|2)</span> <select name="frage-a4-0" data-left="0"><option value="">bitte wählen</option><option value="1">Quadrant II</option><option value="2">Quadrant III</option><option value="0">Quadrant I</option><option value="3">Quadrant IV</option></select></label></li>
<li><label><span>(−2|4)</span> <select name="frage-a4-1" data-left="1"><option value="">bitte wählen</option><option value="1">Quadrant II</option><option value="2">Quadrant III</option><option value="0">Quadrant I</option><option value="3">Quadrant IV</option></select></label></li>
<li><label><span>(−5|−1)</span> <select name="frage-a4-2" data-left="2"><option value="">bitte wählen</option><option value="1">Quadrant II</option><option value="2">Quadrant III</option><option value="0">Quadrant I</option><option value="3">Quadrant IV</option></select></label></li>
<li><label><span>(1|−6)</span> <select name="frage-a4-3" data-left="3"><option value="">bitte wählen</option><option value="1">Quadrant II</option><option value="2">Quadrant III</option><option value="0">Quadrant I</option><option value="3">Quadrant IV</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> (3|2) – Quadrant I; (−2|4) – Quadrant II; (−5|−1) – Quadrant III; (1|−6) – Quadrant IV</p>
<p class="question-explanation">Achte auf die Vorzeichen. Erster Wert <math><mi>x</mi></math>: negativ heißt links. Zweiter Wert <math><mi>y</mi></math>: negativ heißt unten.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie viele Einheiten liegt der Punkt (−3|2) von der <math><mi>y</mi></math>-Achse entfernt?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a5">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 3</p>
<p class="question-explanation">Der Abstand zur <math><mi>y</mi></math>-Achse ist der Betrag des <math><mi>x</mi></math>-Werts: 3 Einheiten, nach links.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie weit ist Ben nach 6 Minuten gekommen? Lies im Graphen von Bens Weg ab.</legend>
<div class="question-material"><figure class="block-figure"><div class="block-image-credit"><img src="../../images/weg-zeit.svg" alt="Weg-Zeit-Graph mit Zeit in Minuten auf der x-Achse und Weg in Metern auf der y-Achse." loading="lazy" decoding="async"><span class="block-credit" tabindex="0" role="img" data-info="Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0." aria-label="Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.">© CC-BY-4.0</span></div><figcaption><p>Der Weg von Ben über der Zeit.</p></figcaption></figure></div>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a6" aria-describedby="frage-a6-unit"> <span id="frage-a6-unit">m</span> </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 200 m</p>
<p class="question-explanation">Bei 6 min ist Ben schon seit 4 min bei 200 m angekommen und wartet dort.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-back">Zurück</button> <button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="2" aria-labelledby="teil-3" hidden>
<h2 id="teil-3" tabindex="-1">Seite 3 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="question" id="frage-a7" data-id="a7" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jedem Gefäß den Graphen seiner Füllhöhe zu. Das Wasser läuft gleichmäßig ein.</legend>
<div class="question-material"><figure class="block-figure"><div class="block-image-credit"><img src="../../images/gefaesse.svg" alt="Drei Gefäße: Gefäß 1 mit senkrechten Wänden, Gefäß 2 unten schmal und oben breit, Gefäß 3 unten breit und oben schmal." loading="lazy" decoding="async"><span class="block-credit" tabindex="0" role="img" data-info="Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0." aria-label="Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.">© CC-BY-4.0</span></div><figcaption><p>Die drei Gefäße.</p></figcaption></figure><figure class="block-figure"><div class="block-image-credit"><img src="../../images/fuellgraphen.svg" alt="Drei Graphen der Füllhöhe über der Zeit. Graph A ist eine Gerade, Graph B steigt erst schnell und dann langsamer, Graph C steigt erst langsam und dann schneller." loading="lazy" decoding="async"><span class="block-credit" tabindex="0" role="img" data-info="Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0." aria-label="Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.">© CC-BY-4.0</span></div><figcaption><p>Die drei Graphen A, B und C.</p></figcaption></figure></div>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Gefäß 1 (senkrechte Wände)</span> <select name="frage-a7-0" data-left="0"><option value="">bitte wählen</option><option value="2">Graph C (erst langsam, dann schnell)</option><option value="1">Graph B (erst schnell, dann langsam)</option><option value="0">Graph A (gerade)</option></select></label></li>
<li><label><span>Gefäß 2 (oben breit)</span> <select name="frage-a7-1" data-left="1"><option value="">bitte wählen</option><option value="2">Graph C (erst langsam, dann schnell)</option><option value="1">Graph B (erst schnell, dann langsam)</option><option value="0">Graph A (gerade)</option></select></label></li>
<li><label><span>Gefäß 3 (oben schmal)</span> <select name="frage-a7-2" data-left="2"><option value="">bitte wählen</option><option value="2">Graph C (erst langsam, dann schnell)</option><option value="1">Graph B (erst schnell, dann langsam)</option><option value="0">Graph A (gerade)</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Gefäß 1 (senkrechte Wände) – Graph A (gerade); Gefäß 2 (oben breit) – Graph B (erst schnell, dann langsam); Gefäß 3 (oben schmal) – Graph C (erst langsam, dann schnell)</p>
<p class="question-explanation">Je breiter das Gefäß an der Wasserlinie, desto langsamer steigt der Spiegel. Oben breit heißt: erst schnell, dann langsamer. Oben schmal heißt: erst langsam, dann schneller.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a9"><p class="explainer-assessment-label">Aufgabe 9</p><div class="question" id="frage-a9" data-id="a9" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Die Wertetabelle: <math><mi>x</mi></math> = −1, 0, 1, 2 und <math><mi>y</mi></math> = −3, −1, 1, 3. Welche Gleichung gehört dazu?</legend>
<label class="question-option"><input type="radio" name="frage-a9" value="0"> <span>y = x − 2</span></label>
<label class="question-option"><input type="radio" name="frage-a9" value="1"> <span>y = 2 · x − 1</span></label>
<label class="question-option"><input type="radio" name="frage-a9" value="2"> <span>y = 2 · x + 1</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>y = x − 2</strong></p><p>Für <math><mi>x</mi></math> = 0 ergibt das −2. In der Tabelle steht aber −1.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>y = 2 · x − 1</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Für <math><mi>x</mi></math> = 0 gilt −1, und bei jedem Schritt von <math><mi>x</mi></math> um 1 wächst <math><mi>y</mi></math> um 2: −1, 1, 3.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>y = 2 · x + 1</strong></p><p>Für <math><mi>x</mi></math> = 0 ergibt das 1, in der Tabelle steht −1.</p></li>
</ul>
<p class="question-explanation">Setze <math><mi>x</mi></math> = 0 ein und prüfe, wie sich <math><mi>y</mi></math> bei einem Schritt in <math><mi>x</mi></math> ändert.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
