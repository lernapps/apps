<li><label><span>Anzahl Arbeiter und Tage für dieselbe Arbeit</span> <select name="frage-a8-1" data-left="1"><option value="">bitte wählen</option><option value="0">y : x ist immer gleich (proportional)</option><option value="2">weder y : x noch x · y bleibt gleich</option><option value="1">x · y ist immer gleich (antiproportional)</option></select></label></li>
