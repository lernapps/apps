<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" role="img">
  <style>
    :root { color: #1f2328; }
    @media (prefers-color-scheme: dark) { :root { color: #e6edf3; } }
    text { fill: currentColor; font: 14px sans-serif; }
    .r { fill: none; stroke: currentColor; stroke-width: 2; }
    .g { stroke: currentColor; stroke-width: 0.6; opacity: 0.55; }
  </style>
  <!-- Kästchen 20 px; vier Rechtecke mit 12 Kästchen Fläche: 2·6, 3·4, 4·3, 6·2 -->
  <rect class="r" x="20" y="30" width="40" height="120"/>
  <g class="g"><line x1="40" y1="30" x2="40" y2="150"/><line x1="20" y1="50" x2="60" y2="50"/><line x1="20" y1="70" x2="60" y2="70"/><line x1="20" y1="90" x2="60" y2="90"/><line x1="20" y1="110" x2="60" y2="110"/><line x1="20" y1="130" x2="60" y2="130"/></g>
  <text x="40" y="20" text-anchor="middle">2</text><text x="70" y="94">6</text>
  <rect class="r" x="130" y="30" width="60" height="80"/>
  <g class="g"><line x1="150" y1="30" x2="150" y2="110"/><line x1="170" y1="30" x2="170" y2="110"/><line x1="130" y1="50" x2="190" y2="50"/><line x1="130" y1="70" x2="190" y2="70"/><line x1="130" y1="90" x2="190" y2="90"/></g>
  <text x="160" y="20" text-anchor="middle">3</text><text x="200" y="74">4</text>
  <rect class="r" x="20" y="190" width="80" height="60"/>
  <g class="g"><line x1="40" y1="190" x2="40" y2="250"/><line x1="60" y1="190" x2="60" y2="250"/><line x1="80" y1="190" x2="80" y2="250"/><line x1="20" y1="210" x2="100" y2="210"/><line x1="20" y1="230" x2="100" y2="230"/></g>
  <text x="60" y="180" text-anchor="middle">4</text><text x="110" y="224">3</text>
  <rect class="r" x="150" y="190" width="120" height="40"/>
  <g class="g"><line x1="170" y1="190" x2="170" y2="230"/><line x1="190" y1="190" x2="190" y2="230"/><line x1="210" y1="190" x2="210" y2="230"/><line x1="230" y1="190" x2="230" y2="230"/><line x1="250" y1="190" x2="250" y2="230"/><line x1="150" y1="210" x2="270" y2="210"/></g>
  <text x="210" y="180" text-anchor="middle">6</text><text x="280" y="214">2</text>
</svg>
