<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Stadt ist die Hauptstadt? Ordne zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>England</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">Edinburgh</option><option value="0">London</option><option value="2">Cardiff</option><option value="3">Belfast</option><option value="4">Dublin</option></select></label></li>
<li><label><span>Scotland</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">Edinburgh</option><option value="0">London</option><option value="2">Cardiff</option><option value="3">Belfast</option><option value="4">Dublin</option></select></label></li>
<li><label><span>Wales</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">Edinburgh</option><option value="0">London</option><option value="2">Cardiff</option><option value="3">Belfast</option><option value="4">Dublin</option></select></label></li>
<li><label><span>Northern Ireland</span> <select name="frage-a1-3" data-left="3"><option value="">bitte wählen</option><option value="1">Edinburgh</option><option value="0">London</option><option value="2">Cardiff</option><option value="3">Belfast</option><option value="4">Dublin</option></select></label></li>

<p><strong>Richtige Antwort:</strong> England – London; Scotland – Edinburgh; Wales – Cardiff; Northern Ireland – Belfast</p>
<p class="question-explanation">London ist die Hauptstadt von England, Edinburgh von Scotland, Cardiff von Wales und Belfast von Northern Ireland. Dublin ist die Hauptstadt des Staates Ireland (Republic of Ireland) und liegt nicht im UK.</p>
