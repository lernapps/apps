<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../wege-laeden-schilder/">Wege, Läden und Schilder</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>

<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-language-text"><p>Du stehst vor der school und willst zur station. Du gehst selbst, Norden ist oben auf dem Plan. Schau auf den Plan und wähle das richtige Wort.</p></div><div class="question-material"><figure class="block-figure"><img src="../../images/stadtplan-millbrook.svg" alt="Plan von Millbrook mit High Street, Church Road und Mill Lane. Der grüne Punkt vor der school ist der Start. Schemaplan, nicht genau nach Maßstab." loading="lazy" decoding="async"><figcaption><p>Der Plan von Millbrook. Norden ist oben, Osten rechts. Du gehst selbst und schaust in Gehrichtung.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Bringe die Wörter in die richtige Reihenfolge, so dass ein Satz entsteht.</legend>
<p class="question-hint">Gib jedem Eintrag seinen Platz: 1 für den ersten.</p>
<ul class="question-pairs">
<li><label><span>left</span> <select name="frage-a2-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Road</span> <select name="frage-a2-4" data-item="4"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Turn</span> <select name="frage-a2-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>into</span> <select name="frage-a2-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Church</span> <select name="frage-a2-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 1. Turn, 2. left, 3. into, 4. Church, 5. Road</p>
<p class="question-explanation">Der Befehl beginnt mit dem Verb. Danach kommt die Richtung und zuletzt into mit dem Namen der Straße.</p>

<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">

<fieldset>
<legend class="question-text">Peter hat Hunger. Schau auf die Speisekarte. Wie viel kostet die Suppe (soup)?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/alltagstexte-material.svg" alt="Vier Kärtchen mit englischen Texten, darunter ein Schild, ein Fahrplan, eine Speisekarte und ein Flyer." loading="lazy" decoding="async"><figcaption><p>Vier Texte von der High Street. Du brauchst nur einen davon.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>£4.50</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>£3.50</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>4:50</span></label>
</fieldset>

<li class="question-info" data-option="1"><p class="question-info-head"><strong>£3.50</strong></p><p>£3.50 ist der Preis vom Sandwich, nicht von der Suppe.</p></li>

</ul>
<p class="question-explanation">Auf der Speisekarte steht die Suppe mit £4.50. Du musst die anderen Zeilen nicht lesen.</p>
