<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<ul class="question-pairs">

<li><label><span>The Normans founded the Tower of London.</span> <select name="frage-a2-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>William built the White Tower.</span> <select name="frage-a2-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
</ul>

<p><strong>Richtige Antwort:</strong> 1. William's army fought at Hastings., 2. The Normans founded the Tower of London., 3. William built the White Tower., 4. The time of Middle English ended.</p>
<p class="question-explanation">Zuerst kam die Schlacht im Oktober 1066, dann gegen Ende von 1066 die Gründung des Tower, um 1078 der White Tower. Middle English wurde bis zum späten fünfzehnten Jahrhundert gesprochen, das Ende kam also zuletzt.</p>
