<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welcher Fehler steckt in welchem Entwurf?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Schranke: Bei „Schranke offen“ fehlt der Pfeil für „Ticket“.</span> <select name="frage-a11-0" data-left="0"><option value="">bitte wählen</option><option value="0">nicht vollständig</option><option value="2">ein Pfeil führt falsch</option><option value="1">nicht eindeutig</option></select></label></li>
<li><label><span>Zahlenschloss: Aus „zu“ gehen zwei Pfeile mit „2“.</span> <select name="frage-a11-1" data-left="1"><option value="">bitte wählen</option><option value="0">nicht vollständig</option><option value="2">ein Pfeil führt falsch</option><option value="1">nicht eindeutig</option></select></label></li>
<li><label><span>Handysperre: Jeder Zustand hat für jede Eingabe genau einen Pfeil, aber „Code falsch, Code falsch“ endet bei „gesperrt“ statt bei „blockiert“.</span> <select name="frage-a11-2" data-left="2"><option value="">bitte wählen</option><option value="0">nicht vollständig</option><option value="2">ein Pfeil führt falsch</option><option value="1">nicht eindeutig</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Schranke: Bei „Schranke offen“ fehlt der Pfeil für „Ticket“. – nicht vollständig; Zahlenschloss: Aus „zu“ gehen zwei Pfeile mit „2“. – nicht eindeutig; Handysperre: Jeder Zustand hat für jede Eingabe genau einen Pfeil, aber „Code falsch, Code falsch“ endet bei „gesperrt“ statt bei „blockiert“. – ein Pfeil führt falsch</p>
<p class="question-explanation">Fehlt ein Pfeil, ist der Automat nicht vollständig. Zwei Pfeile mit derselben Eingabe aus einem Zustand: nicht eindeutig. Endet eine Testfolge falsch, obwohl alles vollständig und eindeutig ist, führt ein Pfeil falsch.</p>
</div>
