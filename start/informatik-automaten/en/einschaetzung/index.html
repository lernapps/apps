<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Task 3</p><div class="question" id="frage-a3" data-id="a3" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Selin writes cards for the game: “put in a coin”, “€1 paid”, “press the button”, “juice drops out”. Which card names a state?</legend>
<label class="question-option"><input type="radio" name="frage-a3" value="0"> <span>“€1 paid”</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="1"> <span>“put in a coin”</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="2"> <span>“press the button”</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="3"> <span>“juice drops out”</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>“€1 paid”</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Jona remembers this on his note. It stays like this until the next input comes.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>“put in a coin”</strong></p><p>That is an input. It happens in a moment and can change the state.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>“press the button”</strong></p><p>That is an input, like the coin. What happens then depends on the state.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>“juice drops out”</strong></p><p>That is an output. It comes out when the machine reacts. The machine does not remember it.</p></li>
</ul>
<p class="question-explanation">A state is what the machine remembers. Inputs and outputs happen in a moment.</p>

<fieldset>
<legend class="question-text">What does each part of a state diagram mean?</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>a circle</span> <select name="frage-a6-0" data-left="0"><option value="">please choose</option><option value="3">the output</option><option value="4">the start state</option><option value="2">the input</option><option value="1">a transition</option><option value="0">a state</option></select></label></li>
<li><label><span>an arrow</span> <select name="frage-a6-1" data-left="1"><option value="">please choose</option><option value="3">the output</option><option value="4">the start state</option><option value="2">the input</option><option value="1">a transition</option><option value="0">a state</option></select></label></li>
<li><label><span>the blue word next to an arrow</span> <select name="frage-a6-2" data-left="2"><option value="">please choose</option><option value="3">the output</option><option value="4">the start state</option><option value="2">the input</option><option value="1">a transition</option><option value="0">a state</option></select></label></li>
<li><label><span>the orange text after the slash</span> <select name="frage-a6-3" data-left="3"><option value="">please choose</option><option value="3">the output</option><option value="4">the start state</option><option value="2">the input</option><option value="1">a transition</option><option value="0">a state</option></select></label></li>
<li><label><span>the circle that “Start” points to</span> <select name="frage-a6-4" data-left="4"><option value="">please choose</option><option value="3">the output</option><option value="4">the start state</option><option value="2">the input</option><option value="1">a transition</option><option value="0">a state</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> a circle – a state; an arrow – a transition; the blue word next to an arrow – the input; the orange text after the slash – the output; the circle that “Start” points to – the start state</p>
<p class="question-explanation">Circles are what the machine can remember. Arrows are the jumps. Next to an arrow comes first what goes in, then what comes out.</p>
