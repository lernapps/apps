<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Task 5</p><div class="question" id="frage-a5" data-id="a5" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Which mistake is in which design?</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>Barrier: at “barrier open” the arrow for “ticket” is missing.</span> <select name="frage-a5-0" data-left="0"><option value="">please choose</option><option value="2">an arrow is wrong</option><option value="0">not complete</option><option value="1">ambiguous</option></select></label></li>
<li><label><span>Combination lock: two arrows with “2” leave “locked”.</span> <select name="frage-a5-1" data-left="1"><option value="">please choose</option><option value="2">an arrow is wrong</option><option value="0">not complete</option><option value="1">ambiguous</option></select></label></li>
<li><label><span>Phone lock: every state has exactly one arrow for every input, but “wrong code, wrong code” ends at “locked” instead of “blocked”.</span> <select name="frage-a5-2" data-left="2"><option value="">please choose</option><option value="2">an arrow is wrong</option><option value="0">not complete</option><option value="1">ambiguous</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> Barrier: at “barrier open” the arrow for “ticket” is missing. – not complete; Combination lock: two arrows with “2” leave “locked”. – ambiguous; Phone lock: every state has exactly one arrow for every input, but “wrong code, wrong code” ends at “locked” instead of “blocked”. – an arrow is wrong</p>
<p class="question-explanation">If an arrow is missing, the automaton is not complete. Two arrows with the same input from one state: ambiguous. If a test sequence ends wrong although everything is complete and unambiguous, an arrow is wrong.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
