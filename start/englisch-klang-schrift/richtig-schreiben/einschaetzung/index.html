<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../richtig-schreiben/">Richtig schreiben</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 5 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>

<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Lautschrift gehört zu welchem Wort?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>sleep</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">/flaɪt/</option><option value="2">/tiːm/</option><option value="0">/sliːp/</option><option value="3">/haɪ/</option></select></label></li>
<li><label><span>flight</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">/flaɪt/</option><option value="2">/tiːm/</option><option value="0">/sliːp/</option><option value="3">/haɪ/</option></select></label></li>
<li><label><span>team</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">/flaɪt/</option><option value="2">/tiːm/</option><option value="0">/sliːp/</option><option value="3">/haɪ/</option></select></label></li>
<li><label><span>high</span> <select name="frage-a1-3" data-left="3"><option value="">bitte wählen</option><option value="1">/flaɪt/</option><option value="2">/tiːm/</option><option value="0">/sliːp/</option><option value="3">/haɪ/</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> sleep – /sliːp/; flight – /flaɪt/; team – /tiːm/; high – /haɪ/</p>
<p class="question-explanation">ee und ea ergeben /iː/, igh ergibt /aɪ/. Im Wort high steht das gh am Ende.</p>

</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welches Wort passt? I read a book every ___.</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>week</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>weak</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>wake</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>week</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Week heißt „Woche“. Jede Woche liest man ein Buch.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>weak</strong></p><p>Weak klingt gleich, heißt aber „schwach“.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>wake</strong></p><p>Wake heißt „aufwachen“ und klingt anders.</p></li>
</ul>
<p class="question-explanation">Week und weak klingen gleich. Der Satz sagt, dass „Woche“ gemeint ist.</p>
<p class="question-more"><a class="question-more-link" href="https://lernapps.net/apps/map/englisch/c/laut-buchstabe/" rel="noopener" title="Lernlandkarte Englisch · Laut und Buchstabe"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Lernlandkarte Englisch · Laut und Buchstabe</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-language-text"><p>Schreibe das Wort. Die Lautschrift und die Bedeutung sagen dir, welches gemeint ist.</p></div><div class="explainer-language-live" hidden></div></li>

<div class="explainer-feedback-head">
<h2 id="feedback-titel">Feedback</h2>
<button type="button" class="explainer-feedback-help-open" aria-expanded="false" aria-controls="feedback-hilfe">Hilfe</button>
<button type="button" class="explainer-feedback-collapse" aria-expanded="true" aria-controls="feedback-inhalt" aria-label="Leiste einklappen" title="Leiste einklappen"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
</div>
<button type="button" class="explainer-feedback-expand" hidden><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Feedback-Leiste ausklappen</span></button>
<div class="explainer-feedback-body" id="feedback-inhalt">
<section class="explainer-feedback-help" id="feedback-hilfe" aria-labelledby="feedback-hilfe-titel" hidden>
<h3 id="feedback-hilfe-titel">So gibst du Feedback</h3>
<ol><li>Geh die Seiten durch. Bei jedem Absatz, jeder Abbildung und jeder Aufgabe erscheint „Notiz“.</li><li>Markierst du vorher Text im Block, steht er als Zitat in der Notiz.</li><li>Bist du fertig, wähl „Issue auf GitHub öffnen“. Die App kopiert dabei deine Notizen, und du fügst sie im Issue ein. Dafür brauchst du ein GitHub-Konto.</li></ol>
<p class="explainer-feedback-privacy">Deine Notizen bleiben nur in diesem Browser, auf diesem Gerät. Die App sendet nichts. Wenn du die Browserdaten löschst, sind die Notizen weg.</p>
<p><button type="button" class="explainer-feedback-help-done">Verstanden</button></p>
</section>
<form class="explainer-feedback-form" hidden>
<p class="explainer-feedback-new">Neue Notiz zu</p>
<p class="explainer-feedback-where"></p>
<blockquote class="explainer-feedback-quote" hidden></blockquote>
<label for="feedback-text">Deine Notiz</label>
<textarea id="feedback-text" class="explainer-feedback-text" rows="5" required></textarea>
<p class="explainer-feedback-buttons"><button type="submit" class="explainer-feedback-save">Speichern</button> <button type="button" class="explainer-feedback-cancel">Abbrechen</button></p>
</form>
<p class="explainer-feedback-status" role="status" aria-live="polite"></p>
<section class="explainer-feedback-notes" aria-labelledby="feedback-notizen">
<h3 id="feedback-notizen" class="explainer-feedback-count"></h3>
<p class="explainer-feedback-actions"><button type="button" class="explainer-feedback-copy">Kopieren</button> <a class="explainer-feedback-issue" href="#" target="_blank" rel="noopener">Issue auf GitHub öffnen</a></p>
<textarea class="explainer-feedback-export" readonly rows="6" aria-label="Text zum Kopieren" hidden></textarea>
<div class="explainer-feedback-list"></div>
</section>
</div>
<div class="explainer-feedback-foot">
<button type="button" class="explainer-feedback-delete-all">Alle löschen …</button>
<span class="explainer-feedback-local">Nur in diesem Browser gespeichert</span>
<button type="button" class="explainer-feedback-off">Beenden</button>
</div>
<script type="application/json" class="explainer-feedback-data">{"storage":"englisch-klang-schrift","app":"Klang und Schrift","root":"../../","repository":"lernapps/englisch-klang-schrift","revision":"398cabc"}</script>
</aside>
</template>
