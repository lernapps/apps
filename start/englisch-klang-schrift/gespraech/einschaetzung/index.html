<main class="explainer" id="inhalt-der-seite">
<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../gespraech/">Sprechen wie im Gespräch</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 5 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Kurzform gehört zu welchen zwei Wörtern?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>we are</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">doesn't</option><option value="2">he's</option><option value="0">we're</option><option value="3">aren't</option></select></label></li>
<li><label><span>does not</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">doesn't</option><option value="2">he's</option><option value="0">we're</option><option value="3">aren't</option></select></label></li>
<li><label><span>he is</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">doesn't</option><option value="2">he's</option><option value="0">we're</option><option value="3">aren't</option></select></label></li>
<li><label><span>are not</span> <select name="frage-a1-3" data-left="3"><option value="">bitte wählen</option><option value="1">doesn't</option><option value="2">he's</option><option value="0">we're</option><option value="3">aren't</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> we are – we're; does not – doesn't; he is – he's; are not – aren't</p>
<p class="question-explanation">Der Apostroph steht jeweils dort, wo ein Buchstabe fehlt.</p>
<p class="question-more"><a class="question-more-link" href="https://lernapps.net/apps/map/englisch/c/kurzformen/" rel="noopener" title="Lernlandkarte Englisch · Kurzformen"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Lernlandkarte Englisch · Kurzformen</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-language-text"><p>Schreibe die Kurzform. Wenn es zwei richtige gibt, genügt eine.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Satzart ist das?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Open the window, Peter.</span> <select name="frage-a3-0" data-left="0"><option value="">bitte wählen</option><option value="3">Frage mit Ja oder Nein</option><option value="0">Aufforderung</option><option value="2">Frage mit Fragewort</option><option value="1">Aussage</option></select></label></li>
<li><label><span>Amir is happy.</span> <select name="frage-a3-1" data-left="1"><option value="">bitte wählen</option><option value="3">Frage mit Ja oder Nein</option><option value="0">Aufforderung</option><option value="2">Frage mit Fragewort</option><option value="1">Aussage</option></select></label></li>
<li><label><span>What do you like?</span> <select name="frage-a3-2" data-left="2"><option value="">bitte wählen</option><option value="3">Frage mit Ja oder Nein</option><option value="0">Aufforderung</option><option value="2">Frage mit Fragewort</option><option value="1">Aussage</option></select></label></li>
<li><label><span>Does Ellie like tea?</span> <select name="frage-a3-3" data-left="3"><option value="">bitte wählen</option><option value="3">Frage mit Ja oder Nein</option><option value="0">Aufforderung</option><option value="2">Frage mit Fragewort</option><option value="1">Aussage</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Open the window, Peter. – Aufforderung; Amir is happy. – Aussage; What do you like? – Frage mit Fragewort; Does Ellie like tea? – Frage mit Ja oder Nein</p>
<p class="question-explanation">Die Satzart entscheidet über die Melodie.</p>
<p class="question-more"><a class="question-more-link" href="https://lernapps.net/apps/map/englisch/c/intonation-fragen/" rel="noopener" title="Lernlandkarte Englisch · Satzmelodie"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Lernlandkarte Englisch · Satzmelodie</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was macht die Stimme am Ende von „Do you live in Millbrook?“</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>Sie steigt.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>Sie fällt.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>Sie bleibt gleich.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sie steigt.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Man antwortet mit Ja oder Nein. Darum steigt die Stimme.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Sie fällt.</strong></p><p>Das gilt für eine Aussage.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Sie bleibt gleich.</strong></p><p>Die Stimme bewegt sich. Hier steigt sie.</p></li>
</ul>
<p class="question-explanation">Ja-Nein-Fragen steigen am Ende.</p>
<p class="question-more"><a class="question-more-link" href="https://lernapps.net/apps/map/englisch/c/intonation-fragen/" rel="noopener" title="Lernlandkarte Englisch · Satzmelodie"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Lernlandkarte Englisch · Satzmelodie</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was macht die Stimme am Ende von „Where do you live?“</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>Sie fällt.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>Sie steigt.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>Sie bleibt gleich.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sie fällt.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Frage hat ein Fragewort. Die Stimme fällt.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Sie steigt.</strong></p><p>Das gilt für Ja-Nein-Fragen, nicht für where.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Sie bleibt gleich.</strong></p><p>Die Stimme bewegt sich. Hier fällt sie.</p></li>
</ul>
<p class="question-explanation">Bei what, where und who fällt die Stimme meist.</p>

</div></li>
