<main class="explainer" id="inhalt-der-seite">
<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../endungen/">Endungen hören und schreiben</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 4 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie klingt -s in pens? Der letzte Laut von pen ist n.</legend>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>Wie /z/.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>Wie /s/.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>Wie /ɪz/.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Wie /z/.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das n summt. Darum summt auch die Endung, und man spricht /z/.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Wie /s/.</strong></p><p>/s/ klingt nach stimmlosen Lauten wie p, t oder k. Das n summt aber.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Wie /ɪz/.</strong></p><p>/ɪz/ kommt nur nach Zischlauten. Nach n kommt keine eigene Silbe.</p></li>
</ul>
<p class="question-explanation">Das n summt, darum klingt -s wie /z/.</p>
<p class="question-more"><a class="question-more-link" href="https://lernapps.net/apps/map/englisch/c/endungen-s-ed/" rel="noopener" title="Lernlandkarte Englisch · Aussprache von -s und -ed"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Lernlandkarte Englisch · Aussprache von -s und -ed</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Bei welchen Wörtern kommt mit -ed eine eigene Silbe dazu?</legend>
<label class="question-option"><input type="checkbox" name="frage-a2" value="0"> <span>waited</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="1"> <span>needed</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="2"> <span>jumped</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="3"> <span>opened</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>waited</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Nach t kommt eine eigene Silbe, man spricht /ɪd/.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>needed</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Nach d kommt eine eigene Silbe, man spricht /ɪd/.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>jumped</strong></p><p>Nach p klingt -ed wie /t/. Es gibt keine eigene Silbe.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>opened</strong></p><p>Nach n klingt -ed wie /d/. Es gibt keine eigene Silbe.</p></li>
</ul>
<p class="question-explanation">Nur nach t und d wird -ed als eigene Silbe /ɪd/ gesprochen.</p>
<p class="question-more"><a class="question-more-link" href="https://lernapps.net/apps/map/englisch/c/endungen-s-ed/" rel="noopener" title="Lernlandkarte Englisch · Aussprache von -s und -ed"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Lernlandkarte Englisch · Aussprache von -s und -ed</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-language-text"><p>Hänge -ing an das Wort. Schreibe die ganze Form.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="explainer-language-text"><p>Schreibe die richtige Form. Die Angabe in Klammern sagt, welche Form gemeint ist.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
