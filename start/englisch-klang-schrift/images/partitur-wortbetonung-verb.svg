<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" role="img">
  <title>Klangpartitur: das Verb present mit zwei Karten, prɪ und ˈzent; über der ersten Karte ein kleiner Punkt, über der zweiten ein großer roter</title>
  
  <rect width="480" height="230" fill="#f4efe2"/>
  <text x="6" y="42" font-family="sans-serif" font-size="22" fill="#8a8577">Melodie</text>
  <text x="6" y="104" font-family="sans-serif" font-size="22" fill="#8a8577">Betonung</text>
  <text x="6" y="164" font-family="sans-serif" font-size="22" fill="#222">Laute</text>
  <rect x="228" y="132" width="58" height="48" rx="8" fill="#2c6fd8"/><text x="257" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">prɪ</text>
  <text x="257" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">pre</text>
  <rect x="292" y="132" width="82" height="48" rx="8" fill="#2c6fd8"/><text x="333" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">ˈzent</text>
  <text x="333" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">sent</text>
  <circle cx="257" cy="95" r="6" fill="#222"/>
  <circle cx="333" cy="95" r="14" fill="#c0392b"/>
</svg>
