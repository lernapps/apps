<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 328" role="img">
  <title>Drei Sätze als Karten. Erste Reihe: Last summer, rotes Komma, we went to Wales. Zweite Reihe: My brother, rotes Komma, who lives in London, rotes Komma, is a pilot. Dritte Reihe ohne Komma: The boy who lives next door is my friend</title>
  
  <rect width="480" height="328" fill="#f4efe2"/>
  <text x="8" y="30" font-family="sans-serif" font-size="18" fill="#8a8577">Einleitung, dann Komma</text>
  <rect x="8" y="42" width="111.5" height="46" rx="8" fill="#138d75"/><text x="64" y="72" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">Last summer</text>
  <text x="127.5" y="78" font-family="sans-serif" font-size="40" font-weight="bold" fill="#c0392b">,</text>
  <rect x="147.5" y="42" width="154.0" height="46" rx="8" fill="#138d75"/><text x="224" y="72" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">we went to Wales</text>
  <text x="8" y="126" font-family="sans-serif" font-size="18" fill="#8a8577">Nicht notwendiger Relativsatz: zwei Kommas</text>
  <rect x="8" y="138" width="103.0" height="46" rx="8" fill="#138d75"/><text x="60" y="168" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">My brother</text>
  <text x="119.0" y="174" font-family="sans-serif" font-size="40" font-weight="bold" fill="#c0392b">,</text>
  <rect x="139.0" y="138" width="179.5" height="46" rx="8" fill="#138d75"/><text x="229" y="168" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">who lives in London</text>
  <text x="326.5" y="174" font-family="sans-serif" font-size="40" font-weight="bold" fill="#c0392b">,</text>
  <rect x="346.5" y="138" width="103.0" height="46" rx="8" fill="#138d75"/><text x="398" y="168" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">is a pilot</text>
  <text x="8" y="222" font-family="sans-serif" font-size="18" fill="#8a8577">Notwendiger Relativsatz: kein Komma</text>
  <rect x="8" y="234" width="247.5" height="46" rx="8" fill="#138d75"/><text x="132" y="264" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">The boy who lives next door</text>
  <rect x="261.5" y="234" width="120.0" height="46" rx="8" fill="#138d75"/><text x="322" y="264" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">is my friend</text>
</svg>
