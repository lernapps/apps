<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img">
  <title>Klangpartitur: far away mit vier Karten fɑː, r, ə und weɪ; ein roter Bogen verbindet das r mit dem folgenden Laut</title>
  
  <rect width="480" height="250" fill="#f4efe2"/>
  <text x="6" y="42" font-family="sans-serif" font-size="22" fill="#8a8577">Melodie</text>
  <text x="6" y="104" font-family="sans-serif" font-size="22" fill="#8a8577">Betonung</text>
  <text x="6" y="164" font-family="sans-serif" font-size="22" fill="#222">Laute</text>
  <rect x="178" y="132" width="58" height="48" rx="8" fill="#2c6fd8"/><text x="207" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">fɑː</text>
  <text x="207" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">far</text>
  <rect x="242" y="132" width="50" height="48" rx="8" fill="#2c6fd8"/><text x="267" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">r</text>
  <text x="267" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">(r)</text>
  <rect x="298" y="132" width="50" height="48" rx="8" fill="#2c6fd8"/><text x="323" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">ə</text>
  <text x="323" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">a</text>
  <rect x="354" y="132" width="70" height="48" rx="8" fill="#2c6fd8"/><text x="389" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">ˈweɪ</text>
  <text x="389" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">way</text>
  <circle cx="207" cy="95" r="6" fill="#222"/>
  <circle cx="323" cy="95" r="6" fill="#222"/>
  <circle cx="389" cy="95" r="14" fill="#c0392b"/>
  <path d="M273 218 Q295 246 317 218" stroke="#c0392b" stroke-width="4" fill="none" stroke-linecap="round"/>
