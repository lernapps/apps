<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" role="img">
  <title>Klangpartitur mit einer Zeile Laute: die Karte ʃiː für she und die Karte ɪz für is werden zu einer Karte ʃiːz für she&#x27;s</title>
  
  <rect width="480" height="230" fill="#f4efe2"/>
  <text x="6" y="42" font-family="sans-serif" font-size="22" fill="#8a8577">Melodie</text>
  <text x="6" y="104" font-family="sans-serif" font-size="22" fill="#8a8577">Betonung</text>
  <text x="6" y="164" font-family="sans-serif" font-size="22" fill="#222">Laute</text>
  <rect x="130" y="14" width="342" height="44" rx="8" fill="none" stroke="#8a8577" stroke-dasharray="6 4"/><text x="301" y="42" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#8a8577">kommt später</text>
  <rect x="130" y="78" width="342" height="34" rx="8" fill="none" stroke="#8a8577" stroke-dasharray="6 4"/><text x="301" y="101" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#8a8577">kommt später</text>
  <rect x="124" y="132" width="82" height="48" rx="8" fill="#2c6fd8"/><text x="165.0" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">ʃiː</text><text x="165.0" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">she</text>
  <text x="222" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">+</text>
  <rect x="238" y="132" width="82" height="48" rx="8" fill="#2c6fd8"/><text x="279.0" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">ɪz</text><text x="279.0" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">is</text>
  <text x="340" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">=</text>
  <rect x="360" y="132" width="106" height="48" rx="8" fill="#2c6fd8"/><text x="413.0" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">ʃiːz</text><text x="413.0" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">she&#x27;s</text>
</svg>
