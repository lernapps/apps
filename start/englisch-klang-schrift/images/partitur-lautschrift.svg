  <text x="248" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">big</text>
  <rect x="306" y="132" width="95" height="48" rx="8" fill="#2c6fd8"/><text x="354" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">bʊk</text>
