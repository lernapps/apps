<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 216" role="img">
  <title>Die Werkstatt zeigt drei Handgriffe vor einer Endung: stop plus ed wird stopped durch Verdoppeln, cry plus s wird cries durch y zu ie, make plus ing wird making, weil das e wegfällt</title>
  
  <rect width="480" height="216" fill="#f4efe2"/>
  <text x="240" y="30" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">Werkstatt: Was passiert vor der Endung?</text>
  <rect x="6" y="48" width="92" height="46" rx="8" fill="#138d75"/><text x="52" y="79" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">stop</text>
  <rect x="100" y="48" width="190" height="46" rx="8" fill="#e6b800"/><text x="195" y="79" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222">Konsonant doppeln</text>
  <rect x="300" y="48" width="58" height="46" rx="8" fill="#2c6fd8"/><text x="329" y="79" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">ed</text>
  <text x="368" y="79" font-family="sans-serif" font-size="22" fill="#222">= stopped</text>
  <rect x="6" y="104" width="92" height="46" rx="8" fill="#138d75"/><text x="52" y="135" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">cry</text>
  <rect x="100" y="104" width="190" height="46" rx="8" fill="#e6b800"/><text x="195" y="135" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222">y wird ie</text>
  <rect x="300" y="104" width="58" height="46" rx="8" fill="#2c6fd8"/><text x="329" y="135" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">s</text>
  <text x="368" y="135" font-family="sans-serif" font-size="22" fill="#222">= cries</text>
  <rect x="6" y="160" width="92" height="46" rx="8" fill="#138d75"/><text x="52" y="191" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">make</text>
  <rect x="100" y="160" width="190" height="46" rx="8" fill="#e6b800"/><text x="195" y="191" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#222">e fällt weg</text>
  <rect x="300" y="160" width="58" height="46" rx="8" fill="#2c6fd8"/><text x="329" y="191" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">ing</text>
  <text x="368" y="191" font-family="sans-serif" font-size="22" fill="#222">= making</text>
</svg>
