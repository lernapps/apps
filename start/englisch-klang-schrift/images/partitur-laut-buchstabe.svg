<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 262" role="img">
  <title>Ein Laut, mehrere Schreibungen: Die blaue Karte iː hat drei grüne Karten ee (see), ea (sea) und e-e (these). Die blaue Karte aɪ hat drei grüne Karten igh (night), i-e (time) und y (my)</title>
  
  <rect width="480" height="262" fill="#f4efe2"/>
  <text x="6" y="42" font-family="sans-serif" font-size="22" fill="#222">Laute</text>
  <text x="6" y="130" font-family="sans-serif" font-size="22" fill="#222">Schrift</text>
  <path d="M195 62 L195 212" stroke="#8a8577" stroke-width="2" fill="none"/>
  <path d="M385 62 L385 212" stroke="#8a8577" stroke-width="2" fill="none"/>
  <rect x="145" y="14" width="100" height="48" rx="8" fill="#2c6fd8"/><text x="195" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">iː</text>
  <rect x="115" y="82" width="160" height="44" rx="8" fill="#138d75"/><text x="195" y="111" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">ee · see</text>
  <rect x="115" y="136" width="160" height="44" rx="8" fill="#138d75"/><text x="195" y="165" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">ea · sea</text>
  <rect x="115" y="190" width="160" height="44" rx="8" fill="#138d75"/><text x="195" y="219" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">e-e · these</text>
  <rect x="335" y="14" width="100" height="48" rx="8" fill="#2c6fd8"/><text x="385" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">aɪ</text>
  <rect x="305" y="82" width="160" height="44" rx="8" fill="#138d75"/><text x="385" y="111" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">igh · night</text>
  <rect x="305" y="136" width="160" height="44" rx="8" fill="#138d75"/><text x="385" y="165" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">i-e · time</text>
  <rect x="305" y="190" width="160" height="44" rx="8" fill="#138d75"/><text x="385" y="219" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff">y · my</text>
</svg>
