<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img">
  <title>Zwei Zeichnungen der Zunge: links liegt die Zungenspitze zwischen den oberen und unteren Zähnen (th), rechts hinter den oberen Zähnen (s)</title>
  
  <rect width="640" height="310" fill="#f4efe2"/>
  <path d="M10 230 C30 170 80 170 165 135 L165 145 C80 195 50 215 10 240 Z" fill="#e58a8a" stroke="#333" stroke-width="2"/>
  <rect x="120" y="50" width="50" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="120" y="150" width="50" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="155" y="262" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">th /θ/</text>
  <text x="155" y="290" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#8a8577">Zunge zwischen den Zähnen</text>
  <path d="M330 230 C350 170 400 170 430 135 L430 145 C400 195 370 215 330 240 Z" fill="#e58a8a" stroke="#333" stroke-width="2"/>
  <rect x="440" y="50" width="50" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="440" y="150" width="50" height="70" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="475" y="262" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">s /s/</text>
  <text x="475" y="290" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#8a8577">Zunge hinter den Zähnen</text>
</svg>
