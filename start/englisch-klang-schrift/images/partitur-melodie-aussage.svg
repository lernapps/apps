<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" role="img">
  <title>Klangpartitur mit Melodie und Lauten: über dem Satz It is big fällt ein grüner Pfeil am Ende nach unten; unten drei blaue Karten</title>
  
  <rect width="480" height="230" fill="#f4efe2"/>
  <text x="6" y="42" font-family="sans-serif" font-size="22" fill="#8a8577">Melodie</text>
  <text x="6" y="104" font-family="sans-serif" font-size="22" fill="#8a8577">Betonung</text>
  <text x="6" y="164" font-family="sans-serif" font-size="22" fill="#222">Laute</text>
  <rect x="130" y="78" width="342" height="34" rx="8" fill="none" stroke="#8a8577" stroke-dasharray="6 4"/><text x="301" y="101" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#8a8577">kommt später</text>
  <rect x="166" y="132" width="78" height="48" rx="8" fill="#2c6fd8"/><text x="204" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">ɪt</text>
  <text x="204" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">It</text>
  <rect x="254" y="132" width="78" height="48" rx="8" fill="#2c6fd8"/><text x="292" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">ɪz</text>
  <text x="292" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">is</text>
  <rect x="342" y="132" width="95" height="48" rx="8" fill="#2c6fd8"/><text x="389" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">bɪɡ</text>
  <text x="389" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">big.</text>
  <path d="M359 22 L415 50" stroke="#138d75" stroke-width="5" fill="none" stroke-linecap="round"/><polygon points="423,54 405,52 413,38" fill="#138d75"/>
</svg>
