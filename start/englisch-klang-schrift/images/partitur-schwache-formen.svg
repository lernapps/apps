  <text x="6" y="164" font-family="sans-serif" font-size="22" fill="#222">Laute</text>
  <rect x="244" y="132" width="58" height="48" rx="8" fill="#2c6fd8"/><text x="273" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">ænd</text>
  <text x="273" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">and</text>
  <rect x="308" y="132" width="50" height="48" rx="8" fill="#2c6fd8"/><text x="333" y="164" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#fff">ən</text>
  <text x="333" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#222">and</text>
  <circle cx="273" cy="95" r="14" fill="#c0392b"/>
  <circle cx="333" cy="95" r="6" fill="#222"/>
