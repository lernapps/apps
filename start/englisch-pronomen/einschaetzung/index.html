<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 8 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>

<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Peter kann rennen. Welches Wort fehlt? „___ can run.“</legend>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>She</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>He</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>It</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>She</strong></p><p>she ist für ein Mädchen oder eine Frau. Peter ist ein Junge, also he.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>He</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>he ist für einen Jungen oder Mann. Peter ist ein Junge.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>It</strong></p><p>it ist nur für Dinge und Tiere, nicht für Menschen.</p></li>
</ul>
<p class="question-explanation">Für Peter, einen Jungen, sagst du he.</p>

<fieldset>

<label class="question-option"><input type="radio" name="frage-a3" value="0"> <span>he</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="1"> <span>her</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="2"> <span>him</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>he</strong></p><p>he sagt, wer es tut. Wen es trifft, sagst du mit him.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>her</strong></p><p>her ist für ein Mädchen. Peter ist ein Junge, also him.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>him</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>him ist für einen Jungen oder Mann und steht nach dem Verb.</p></li>
</ul>
<p class="question-explanation">Für Peter, einen Jungen, sagst du him.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Personalpronomen" rel="noopener" title="Personalpronomen (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Personalpronomen (Wikipedia)</span></a></p>

<div class="question-reveal" hidden>
<ul class="question-infos">

<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>my</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>my steht vor dem Nomen und gehört zur sprechenden Person.</p></li>
