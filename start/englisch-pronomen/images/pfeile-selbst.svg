<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img">
  <title>Zwei Bilder: Links zeigt ein Pfeil von Sophie im Bogen zu Sophie zurück, dazu der Satz Sophie hurt herself. Rechts zeigt ein Pfeil von Sophie zu Ellie, dazu der Satz Sophie helped her.</title>
  <defs>
    <g id="sophie" stroke="#333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M14 168 C8 120 22 88 50 84 C78 88 92 120 86 168 C70 178 30 178 14 168 Z" fill="#3a9a5b"/>
      <ellipse cx="50" cy="52" rx="30" ry="32" fill="#f3d2b3"/>
      <path d="M18 54 Q14 14 50 12 Q86 14 82 54 Q80 34 62 28 Q40 36 22 40 Z" fill="#d9b45a"/>
      <path d="M20 50 C10 70 12 96 22 108" fill="none" stroke="#d9b45a" stroke-width="8"/>
      <path d="M80 50 C90 70 88 96 78 108" fill="none" stroke="#d9b45a" stroke-width="8"/>
      <circle cx="40" cy="56" r="3" fill="#222"/><circle cx="60" cy="56" r="3" fill="#222"/>
      <path d="M42 68 Q50 75 58 68" fill="none"/>
    </g>
    <g id="ellie" stroke="#333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M14 168 C8 120 22 88 50 84 C78 88 92 120 86 168 C70 178 30 178 14 168 Z" fill="#d33"/>
      <ellipse cx="50" cy="52" rx="30" ry="32" fill="#f3d2b3"/>
      <path d="M18 54 Q14 14 50 12 Q86 14 82 54 Q80 34 62 28 Q40 36 22 40 Z" fill="#b5501e"/>
      <path d="M82 30 C104 34 108 70 92 90" fill="none" stroke="#b5501e" stroke-width="10"/>
      <circle cx="40" cy="56" r="3" fill="#222"/><circle cx="60" cy="56" r="3" fill="#222"/>
      <path d="M42 68 Q50 75 58 68" fill="none"/>
    </g>
    <g id="peter" stroke="#333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M14 168 C8 120 22 88 50 84 C78 88 92 120 86 168 C70 178 30 178 14 168 Z" fill="#e0b020"/>
      <ellipse cx="50" cy="52" rx="30" ry="32" fill="#f3d2b3"/>
      <path d="M18 54 Q14 14 50 12 Q86 14 82 54 Q80 34 62 28 Q40 36 22 40 Z" fill="#6b3f1e"/>
      <circle cx="40" cy="56" r="3" fill="#222"/><circle cx="60" cy="56" r="3" fill="#222"/>
      <path d="M40 66 Q50 78 60 66" fill="none"/>
    </g>
    <g id="amir" stroke="#333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M14 168 C8 120 22 88 50 84 C78 88 92 120 86 168 C70 178 30 178 14 168 Z" fill="#3a6fd8"/>
      <ellipse cx="50" cy="54" rx="30" ry="32" fill="#c68f62"/>
      <path d="M18 54 Q10 22 30 14 Q40 6 52 12 Q72 6 82 22 Q92 40 82 54 Q80 34 62 28 Q40 34 22 42 Z" fill="#222"/>
      <circle cx="39" cy="57" r="8" fill="none"/><circle cx="61" cy="57" r="8" fill="none"/><path d="M47 57 L53 57" fill="none"/>
      <circle cx="39" cy="57" r="2.5" fill="#222"/><circle cx="61" cy="57" r="2.5" fill="#222"/>
      <path d="M42 70 Q50 77 58 70" fill="none"/>
    </g>
  
    <g id="hill" stroke="#333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M10 168 C4 120 20 88 50 84 C80 88 96 120 90 168 C72 178 28 178 10 168 Z" fill="#8a5a2b"/>
      <ellipse cx="50" cy="52" rx="30" ry="32" fill="#f3d2b3"/>
      <path d="M18 50 Q14 14 50 12 Q86 14 82 50 Q80 30 62 26 Q40 32 22 38 Z" fill="#9a9a9a"/>
      <circle cx="40" cy="56" r="3" fill="#222"/><circle cx="60" cy="56" r="3" fill="#222"/>
      <path d="M42 68 Q50 75 58 68" fill="none"/>
    </g><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker></defs>
  <rect width="640" height="340" fill="#f4efe2"/>
  <line x1="320" y1="20" x2="320" y2="320" stroke="#bbb" stroke-width="2"/>
  <use href="#sophie" transform="translate(110,70) scale(.9)"/>
  <path d="M100 100 C20 40 20 220 100 190" fill="none" stroke="#333" stroke-width="3" marker-end="url(#pf)"/>
  <text x="160" y="290" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222">Sophie hurt herself.</text>
  <text x="160" y="315" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">derselbe Mensch</text>
  <use href="#sophie" transform="translate(350,70) scale(.9)"/>
  <use href="#ellie" transform="translate(530,70) scale(.9)"/>
  <path d="M450 115 H520" stroke="#333" stroke-width="3" marker-end="url(#pf)"/>
  <text x="480" y="290" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222">Sophie helped her.</text>
  <text x="480" y="315" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">ein anderer Mensch</text>
</svg>
