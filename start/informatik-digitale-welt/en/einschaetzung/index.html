<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Task 1</p><div class="question" id="frage-a1" data-id="a1" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Which of these are works? Choose all that fit.</legend>
<label class="question-option"><input type="checkbox" name="frage-a1" value="0"> <span>Tom's song “Seeberg Blues”</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="1"> <span>a computer program for a game app</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="2"> <span>the fact that the class trip starts on Monday</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="3"> <span>the Seeberg itself</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Tom's song “Seeberg Blues”</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Tom made the song with Tom's own ideas. It is a work of music.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>a computer program for a game app</strong> <span class="question-badge question-badge-right">right answer</span></p><p>A program is a work too. The people who wrote it are its creators.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>the fact that the class trip starts on Monday</strong></p><p>Nobody made a fact with their own ideas. It is not a work.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>the Seeberg itself</strong></p><p>The mountain is nature. But a photo of the mountain is protected.</p></li>
</ul>
<p class="question-explanation">A person made a work with their own ideas, for example a song or a program. Facts and nature are not works.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Task 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ben loves Mia's train. Ben copies it and puts up the copy with Ben's name on it in the classroom. What is wrong with that?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Mia has not allowed it and is not named.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Nothing, because Ben does not sell it.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Nothing, because children are not creators.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Mia has not allowed it and is not named.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Mia is the creator. She decides about her picture, and it is her work, not Ben's.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Nothing, because Ben does not sell it.</strong></p><p>Even without a sale, Mia decides who copies and shows her picture.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Nothing, because children are not creators.</strong></p><p>Children are creators too. Age does not matter.</p></li>
</ul>
<p class="question-explanation">Whoever copies someone else's work and shows it as their own goes against the creator's right. Ben would have to ask Mia and name Mia.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>

<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Task 3</p><div class="question" id="frage-a3" data-id="a3" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">What does the note under the photo say, and what must you do then? Match them up.</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>all rights reserved</span> <select name="frage-a3-0" data-left="0"><option value="">please choose</option><option value="3">nothing, because it is on the internet</option><option value="0">ask the creator for permission</option><option value="2">use it freely, without asking</option><option value="1">name the creator and the licence</option></select></label></li>
<li><label><span>CC BY 4.0</span> <select name="frage-a3-1" data-left="1"><option value="">please choose</option><option value="3">nothing, because it is on the internet</option><option value="0">ask the creator for permission</option><option value="2">use it freely, without asking</option><option value="1">name the creator and the licence</option></select></label></li>
<li><label><span>CC0</span> <select name="frage-a3-2" data-left="2"><option value="">please choose</option><option value="3">nothing, because it is on the internet</option><option value="0">ask the creator for permission</option><option value="2">use it freely, without asking</option><option value="1">name the creator and the licence</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> all rights reserved – ask the creator for permission; CC BY 4.0 – name the creator and the licence; CC0 – use it freely, without asking</p>
<p class="question-explanation">Without a free licence you ask. Being on the internet does not allow anything yet.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Task 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Selin takes photo 2 for the poster in the classroom. Which credit is complete?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>“Jetty on the lake”, Karim Haddad, photo site “Seebilder”, CC BY 4.0</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>“Jetty on the lake”, found with the picture search, CC BY 4.0</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>Photo from the internet</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>“Jetty on the lake”, Karim Haddad, photo site “Seebilder”, CC BY 4.0</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Title, creator, source and licence are all there.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>“Jetty on the lake”, found with the picture search, CC BY 4.0</strong></p><p>The creator is missing. The picture search only found the photo. The source is the website it is on.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Photo from the internet</strong></p><p>Title, creator and licence are missing. “Internet” does not say which website the photo is on.</p></li>
</ul>
<p class="question-explanation">A complete credit has four parts: title, creator, source and licence.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>

<form class="question-form" novalidate>

<li><label><span>Ms Nguyen programs apps.</span> <select name="frage-a5-1" data-left="1"><option value="">please choose</option><option value="0">faster or easier</option><option value="2">a task disappears</option><option value="3">learning new things</option><option value="1">a new job</option></select></label></li>
<li><label><span>Ms Schulte no longer milks the cows herself.</span> <select name="frage-a5-2" data-left="2"><option value="">please choose</option><option value="0">faster or easier</option><option value="2">a task disappears</option><option value="3">learning new things</option><option value="1">a new job</option></select></label></li>
<li><label><span>Ms Schulte took a course about the milking robot.</span> <select name="frage-a5-3" data-left="3"><option value="">please choose</option><option value="0">faster or easier</option><option value="2">a task disappears</option><option value="3">learning new things</option><option value="1">a new job</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>

</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Task 6</p><div class="question" id="frage-a6" data-id="a6" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">A customer orders bread rolls by app. Put the steps in the right order.</legend>
<p class="question-hint">Give each entry its place: 1 for the first.</p>
<ul class="question-pairs">
<li><label><span>Mr Kaya packs the bread rolls.</span> <select name="frage-a6-3" data-item="3"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
<li><label><span>The customer collects the bread rolls.</span> <select name="frage-a6-4" data-item="4"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
<li><label><span>Mr Kaya sees the order on the screen.</span> <select name="frage-a6-2" data-item="2"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
<li><label><span>The app sends the order to the bakery.</span> <select name="frage-a6-1" data-item="1"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
<li><label><span>The customer types her order into the app.</span> <select name="frage-a6-0" data-item="0"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>

<ul class="question-pairs">

<li><label><span>Jona does not know if AI is allowed for this task.</span> <select name="frage-a7-3" data-left="3"><option value="">please choose</option><option value="0">check it in the book</option><option value="1">ask for the word to be explained</option><option value="4">just believe it, because an AI says so</option><option value="2">type in nothing personal</option><option value="3">first ask what the school allows</option></select></label></li>

</div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Task 8</p><div class="question" id="frage-a8" data-id="a8" data-type="true-false">

<label class="question-option"><input type="radio" name="frage-a8" value="false"> <span>False</span></label>

info":"Children are creators too. Age does not matter."}]},"rendered":{}}},{"key":"a3","ref":"/ich/bild-fuers-plakat/#was-du-tun-musst","page":"ich/bild-fuers-plakat/","exercise":"was-du-tun-musst","step":1,"data":{"kind":"question","lang":"en","question":{"id":"a3","text":"What does the note under the photo say, and what must you do then? Match them up.","explanation":"Without a free licence you ask. Being on the internet does not allow anything yet.","links":[],"hint":"Read the section “When you may use someone else's picture” again, with the table of the two free licences.","type":"matching","pairs":[{"left":"all rights reserved","right":"ask the creator for permission"},{"left":"CC BY 4.0","right":"name the creator and the licence"},{"left":"CC0","right":"use it freely, without asking"}],"distractors":["nothing, because it is on the internet"]},"rendered":{}}},{"key":"a4","ref":"/ich/bild-fuers-plakat/#quellenangabe","page":"ich/bild-fuers-plakat/","exercise":"quellenangabe","step":1,"data":{"kind":"question","lang":"en","question":{"id":"a4","text":"Selin takes photo 2 for the poster in the classroom. Which credit is complete?","explanation":"A complete credit has four parts: title, creator, source and licence.","links":[],"type":"single-choice","options":[{"text":"“Jetty on the lake”, Karim Haddad, photo site “Seebilder”, CC BY 4.0","correct":true,"info":"Title, creator, source and licence are all there."},{"text":"“Jetty on the lake”, found with the picture search, CC BY 4.0","correct":false,"info":"The creator is missing. The picture search only found the photo. The source is the website it is on."},{"text":"Photo from the internet","correct":false,"info":"Title, creator and licence are missing. “Internet” does not say which website the photo is on."}]},"rendered":{}}},{"key":"a5","ref":"/ich/berufsbesuch/#was-sich-veraendert","page":"ich/berufsbesuch/","exercise":"was-sich-veraendert","step":2,"data":{"kind":"question","lang":"en","question":{"id":"a5","text":"What has changed? Match each example to the kind of change.","explanation":"Computer systems make some things faster, bring new jobs, make tasks disappear and ask people to learn new things.","links":[],"hint":"Look at the list in the section “What changes at work”.","type":"matching","pairs":[{"left":"The till works out the price.","right":"faster or easier"},{"left":"Ms Nguyen programs apps.","right":"a new job"},{"left":"Ms Schulte no longer milks the cows herself.","right":"a task disappears"},{"left":"Ms Schulte took a course about the milking robot.","right":"learning new things"}]},"rendered":{}}},{"key":"a6","ref":"/ich/berufsbesuch/#bestellung-per-app","page":"ich/berufsbesuch/","exercise":"bestellung-per-app","step":2,"data":{"kind":"question","lang":"en","question":{"id":"a6","text":"A customer orders bread rolls by app. Put the steps in the right order.","explanation":"First the customer enters the order, then the app sends it on and the bakery shows it. Only then does a person pack the rolls.","links":[],"hint":"What has to happen first so that Mr Kaya sees something on the screen?","type":"ordering","items":["The customer types her order into the app.","The app sends the order to the bakery.","Mr Kaya sees the order on the screen.","Mr Kaya packs the bread rolls.","The customer collects the bread rolls."]},"rendered":{}}},{"key":"a7","ref":"/ich/ki-hausaufgaben/#was-jona-tun-soll","page":"ich/ki-hausaufgaben/","exercise":"was-jona-tun-soll","step":3,"data":{"kind":"question","lang":"en","question":{"id":"a7","text":"What should Jona do in these situations? Match them up.","explanation":"An AI can be wrong, so Jona checks numbers. Personal things stay out, and the school decides what is allowed.","links":[],"hint":"Read the two questions in the box and the risks in the table again.","type":"matching","pairs":[{"left":"The AI gives a number about hedgehogs.","right":"check it in the book"},{"left":"Jona does not understand a word.","right":"ask for the word to be explained"},{"left":"Jona wants to tell the AI where Jona lives.","right":"type in nothing personal"},{"left":"Jona does not know if AI is allowed for this task.","right":"first ask what the school allows"}],"distractors":["just believe it, because an AI says so"]},"rendered":{}}},{"key":"a8","ref":"/ich/ki-hausaufgaben/#ki-immer-richtig","page":"ich/ki-hausaufgaben/","exercise":"ki-immer-richtig","step":3,"data":{"kind":"question","lang":"en","question":{"id":"a8","text":"Ben says: “What a chat AI writes is always true. It has read so many texts.”","explanation":"A chat AI finds patterns; it does not know what is true. So it can write wrong things that sound sure. One-sided examples can also lead to one-sided answers.","links":[],"hint":"Does an AI know what is true, or does it find patterns?","type":"true-false","answer":false},"rendered":{}}}],"pages":[{"page":"ich/wem-gehoert-das-bild/","title":"Who does the picture belong to?","href":"../../en/ich/wem-gehoert-das-bild/"},{"page":"ich/bild-fuers-plakat/","title":"A picture for the poster","href":"../../en/ich/bild-fuers-plakat/"},{"page":"ich/berufsbesuch/","title":"Visitors from the world of work","href":"../../en/ich/berufsbesuch/"},{"page":"ich/ki-hausaufgaben/","title":"AI for homework","href":"../../en/ich/ki-hausaufgaben/"}],"chapters":[{"title":"Me in the digital world","assessment":"einschaetzung/","pages":[{"title":"What you need here","local":"ich/das-brauchst-du/"},{"title":"Who does the picture belong to?","local":"ich/wem-gehoert-das-bild/"},{"title":"A picture for the poster","local":"ich/bild-fuers-plakat/"},{"title":"Visitors from the world of work","local":"ich/berufsbesuch/"},{"title":"AI for homework","local":"ich/ki-hausaufgaben/"}]}],"whole":"einschaetzung/","root":"../../en/","tutor":"einschaetzung/tutor/","markdown":"einschaetzung/tutor/index.md","ways":[{"name":"Claude","url":"https://claude.ai/new?q={prompt}"},{"name":"ChatGPT","url":"https://chatgpt.com/?q={prompt}"},{"nam
