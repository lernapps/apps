<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Mr Hill sammelt Zeilen für die Szene „At the market“. Welche Zeilen sind falsch aufgeschrieben? Wähle alle. Satzzeichen am Ende zählen hier nicht.</legend>
<label class="question-option"><input type="checkbox" name="frage-a23" value="0"> <span>Ellie: Two apples, please</span></label>
<label class="question-option"><input type="checkbox" name="frage-a23" value="1"> <span>Can I help you?</span></label>
<label class="question-option"><input type="checkbox" name="frage-a23" value="2"> <span>Amir: Here you are, he said</span></label>

<label class="question-option"><input type="checkbox" name="frage-a23" value="4"> <span>Amir: They are one pound each</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">

<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Can I help you?</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Sprecher fehlt. Man weiß nicht, wer das sagt.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>Amir: Here you are, he said</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das he said ist Erzähltext. Er gehört nicht in die Zeile.</p></li>
<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>‘Two apples, please,’ said Ellie</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das ist Erzähltext. Im Skript steht erst der Sprecher.</p></li>
<li class="question-info" data-option="4"><p class="question-info-head"><strong>Amir: They are one pound each</strong></p><p>Das ist richtig. Der Sprecher steht vor dem Doppelpunkt.</p></li>

<li><label><span>light</span> <select name="frage-a24-1" data-left="1"><option value="">bitte wählen</option><option value="1">night</option><option value="2">play</option><option value="0">hat</option><option value="3">coat</option></select></label></li>

<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Lies den Vers: „I see a bird up in the tree, and it is singing just for ...“ Welches Wort reimt sich auf tree und passt ans Ende?</legend>

<label class="question-option"><input type="radio" name="frage-a25" value="1"> <span>you</span></label>
