<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../spielen-und-reimen/">Spielen und reimen</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 5 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>

<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Sophie frühstückt bei den Parkers. Bringe die Zeilen des Dialogs in die richtige Reihenfolge.</legend>
<p class="question-hint">Gib jedem Eintrag seinen Platz: 1 für den ersten.</p>
<ul class="question-pairs">
<li><label><span>Sophie: Good morning, Mrs Parker.</span> <select name="frage-a1-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>Mrs Parker: Would you like some toast?</span> <select name="frage-a1-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>(Sophie comes into the kitchen.)</span> <select name="frage-a1-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>Sophie: Yes, please.</span> <select name="frage-a1-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 1. (Sophie comes into the kitchen.), 2. Sophie: Good morning, Mrs Parker., 3. Mrs Parker: Would you like some toast?, 4. Sophie: Yes, please.</p>
<p class="question-explanation">Sophie kommt herein, grüßt, dann folgen Frage und Antwort.</p>
<p class="question-more"><a class="question-more-link" href="https://lernapps.net/apps/map/englisch/c/dialog-schreiben/" rel="noopener" title="Lernlandkarte Englisch · Dialog schreiben"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Lernlandkarte Englisch · Dialog schreiben</span></a></p>

</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Mr Hill sammelt Zeilen für die Szene „At the market“. Welche Zeilen sind falsch aufgeschrieben? Wähle alle. Satzzeichen am Ende zählen hier nicht.</legend>
<label class="question-option"><input type="checkbox" name="frage-a2" value="0"> <span>Ellie: Two apples, please</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="1"> <span>Can I help you?</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="2"> <span>Amir: Here you are, he said</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="3"> <span>‘Two apples, please,’ said Ellie</span></label>
<label class="question-option"><input type="checkbox" name="frage-a2" value="4"> <span>Amir: They are one pound each</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Ellie: Two apples, please</strong></p><p>Das ist richtig. Sprecher, Doppelpunkt, kurzer Satz.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Can I help you?</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Der Sprecher fehlt. Man weiß nicht, wer das sagt.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>Amir: Here you are, he said</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das he said ist Erzähltext. Er gehört nicht in die Zeile.</p></li>
<li class="question-info question-info-right" data-option="3"><p class="question-info-head"><strong>‘Two apples, please,’ said Ellie</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das ist Erzähltext. Im Skript steht erst der Sprecher.</p></li>
<li class="question-info" data-option="4"><p class="question-info-head"><strong>Amir: They are one pound each</strong></p><p>Das ist richtig. Der Sprecher steht vor dem Doppelpunkt.</p></li>
</ul>
<p class="question-explanation">Vorne steht der Sprecher mit Doppelpunkt, dann nur der Satz.</p>

</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Wörter reimen sich? Ordne die Paare zu und achte auf das Ende.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>cat</span> <select name="frage-a3-0" data-left="0"><option value="">bitte wählen</option><option value="3">coat</option><option value="0">hat</option><option value="2">play</option><option value="1">night</option></select></label></li>
<li><label><span>light</span> <select name="frage-a3-1" data-left="1"><option value="">bitte wählen</option><option value="3">coat</option><option value="0">hat</option><option value="2">play</option><option value="1">night</option></select></label></li>
<li><label><span>day</span> <select name="frage-a3-2" data-left="2"><option value="">bitte wählen</option><option value="3">coat</option><option value="0">hat</option><option value="2">play</option><option value="1">night</option></select></label></li>
<li><label><span>boat</span> <select name="frage-a3-3" data-left="3"><option value="">bitte wählen</option><option value="3">coat</option><option value="0">hat</option><option value="2">play</option><option value="1">night</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> cat – hat; light – night; day – play; boat – coat</p>
<p class="question-explanation">Die Wörter haben die gleiche Endung und klingen am Ende gleich.</p>

</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Lies den Vers: „I see a bird up in the tree, and it is singing just for ...“ Welches Wort reimt sich auf tree und passt ans Ende?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>me</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>you</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>all</span></label>

<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>me</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Tree und me klingen am Ende gleich.</p></li>

<li class="question-info" data-option="2"><p class="question-info-head"><strong>all</strong></p><p>Der Sinn passt, aber all reimt sich nicht auf tree.</p></li>
</ul>
<p class="question-explanation">Ein Reimwort passt zum Sinn und klingt am Ende wie das Wort der ersten Zeile.</p>

</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welches Paar reimt sich im Klang?</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>food – good</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>bed – head</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>now – know</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>food – good</strong></p><p>Die Schreibung ist am Ende gleich, aber man spricht die Wörter verschieden.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>bed – head</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Schreibung ist anders, aber der Klang am Ende ist gleich.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>now – know</strong></p><p>Sie sehen fast gleich aus, klingen am Ende aber verschieden.</p></li>
</ul>
<p class="question-explanation">Reime richten sich nach dem Klang. Die Buchstaben sagen es nicht immer.</p>

</div></li>
