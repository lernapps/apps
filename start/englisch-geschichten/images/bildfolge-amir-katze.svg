<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 435" role="img">
  <title>Vier Bilder zu einer Geschichte. 1 Ein Junge mit Rucksack geht im Regen nach Hause. 2 Er bleibt unter einem Baum stehen und lauscht, hinter dem Baum schaut eine kleine Katze hervor. 3 Die Katze springt ihm in die Arme. 4 Im Haus sitzt der Junge auf dem Boden, die Katze trinkt aus einer Schale.</title>
