<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img">
  <title>Der Geschichtenberg mit vier Fähnchen und fünf Wegweisern: first am Anfang, then und after that im Aufbau, suddenly vor dem Gipfel und finally am Ende</title>
  <rect width="480" height="290" fill="#f4efe2"/>
  <polygon points="10,235 130,155 235,80 330,150 470,235" fill="#cfe0bd" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <line x1="22" y1="235" x2="22" y2="201" stroke="#333" stroke-width="2"/><rect x="22" y="179" width="126" height="24" rx="3" fill="#34495e"/><text x="85.0" y="196" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">1 beginning</text>
  <line x1="122" y1="158" x2="122" y2="124" stroke="#333" stroke-width="2"/><rect x="122" y="102" width="116" height="24" rx="3" fill="#34495e"/><text x="180.0" y="119" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">2 build-up</text>
  <line x1="235" y1="80" x2="235" y2="46" stroke="#333" stroke-width="2"/><rect x="235" y="24" width="96" height="24" rx="3" fill="#34495e"/><text x="283.0" y="41" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">3 climax</text>
  <line x1="350" y1="176" x2="350" y2="142" stroke="#333" stroke-width="2"/><rect x="350" y="120" width="96" height="24" rx="3" fill="#34495e"/><text x="398.0" y="137" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">4 ending</text>
  <rect x="40" y="212" width="64" height="22" rx="11" fill="#5d6d7e"/><text x="72.0" y="228" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">first</text>
  <rect x="140" y="168" width="54" height="22" rx="11" fill="#5d6d7e"/><text x="167.0" y="184" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">then</text>
  <rect x="180" y="134" width="94" height="22" rx="11" fill="#5d6d7e"/><text x="227.0" y="150" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">suddenly</text>
  <rect x="198" y="168" width="114" height="22" rx="11" fill="#5d6d7e"/><text x="255.0" y="184" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">after that</text>
  <rect x="366" y="200" width="84" height="22" rx="11" fill="#5d6d7e"/><text x="408.0" y="216" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">finally</text>
</svg>
