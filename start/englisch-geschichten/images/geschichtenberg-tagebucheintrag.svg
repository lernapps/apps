<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 392" role="img">
  <title>Ein kleiner Berg über einen Tag mit vier Fähnchen: morning, lunch, best moment und evening</title>
  <rect width="480" height="392" fill="#f4efe2"/>
  <polygon points="10,235 130,155 235,80 330,150 470,235" fill="#cfe0bd" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <line x1="22" y1="235" x2="22" y2="201" stroke="#333" stroke-width="2"/><rect x="22" y="179" width="106" height="24" rx="3" fill="#34495e"/><text x="75.0" y="196" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">1 morning</text>
  <line x1="122" y1="158" x2="122" y2="124" stroke="#333" stroke-width="2"/><rect x="122" y="102" width="86" height="24" rx="3" fill="#34495e"/><text x="165.0" y="119" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">2 lunch</text>
  <line x1="235" y1="80" x2="235" y2="46" stroke="#333" stroke-width="2"/><rect x="235" y="24" width="146" height="24" rx="3" fill="#34495e"/><text x="308.0" y="41" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">3 best moment</text>
  <line x1="350" y1="176" x2="350" y2="142" stroke="#333" stroke-width="2"/><rect x="350" y="120" width="106" height="24" rx="3" fill="#34495e"/><text x="403.0" y="137" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">4 evening</text>
  <text x="20" y="272" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">morning: walk to school</text>
  <text x="20" y="302" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">lunch: sit in the library</text>
  <text x="20" y="332" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">best moment: read my story to Amir</text>
  <text x="20" y="362" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">evening: talk to Mrs Parker</text>
</svg>
