<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 435" role="img">
  <title>Vier Bilder zu einer Geschichte. 1 Zwei Jungen spielen im Garten mit einem Ball vor einem Haus. 2 Der Junge mit der Brille tritt den Ball fest in Richtung Haus. 3 Der Ball steckt im zerbrochenen Fenster, die Jungen schlagen die Hände hoch. 4 Eine Frau mit rotem Dutt und türkiser Strickjacke steht vor der Tür, die Jungen sehen traurig aus.</title>
