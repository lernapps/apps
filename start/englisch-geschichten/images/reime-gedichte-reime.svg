  <text x="240" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">Reime richten sich nach dem Klang</text><rect x="10" y="54" width="460" height="68" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="26" y="98" font-family="sans-serif" font-size="26" fill="#222" xml:space="preserve"><tspan font-weight="normal">p</tspan><tspan font-weight="bold">en</tspan><tspan> – </tspan><tspan>t</tspan><tspan font-weight="bold">en</tspan></text><text x="236" y="84" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">reimt sich</text><text x="236" y="109" font-family="sans-serif" font-size="18" fill="#444">gleiche Endung</text><rect x="10" y="132" width="460" height="68" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="26" y="176" font-family="sans-serif" font-size="26" fill="#222" xml:space="preserve"><tspan>h</tspan><tspan font-weight="bold">and</tspan><tspan> – </tspan><tspan>s</tspan><tspan font-weight="bold">and</tspan></text><text x="236" y="162" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">reimt sich</text><text x="236" y="187" font-family="sans-serif" font-size="18" fill="#444">gleiche Endung</text><rect x="10" y="210" width="460" height="68" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="26" y="254" font-family="sans-serif" font-size="26" fill="#222" xml:space="preserve"><tspan font-weight="bold">one</tspan><tspan> – </tspan><tspan font-weight="bold">run</tspan></text><text x="236" y="240" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">reimt sich</text><text x="236" y="265" font-family="sans-serif" font-size="18" fill="#444">andere Schreibung</text><rect x="10" y="288" width="460" height="68" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="26" y="332" font-family="sans-serif" font-size="26" fill="#222" xml:space="preserve"><tspan>m</tspan><tspan font-weight="bold">ove</tspan><tspan> – </tspan><tspan>l</tspan><tspan font-weight="bold">ove</tspan></text><text x="236" y="318" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">reimt sich nicht</text><text x="236" y="343" font-family="sans-serif" font-size="18" fill="#444">gleiche Schreibung</text>
