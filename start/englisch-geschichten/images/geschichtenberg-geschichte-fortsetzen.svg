<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 262" role="img">
  <title>Ein Berg mit zwei Gipfeln und vier Fähnchen: 1 beginning, 2 climax, 3 second peak, 4 ending, dazu das Schild suddenly</title>
  <rect width="480" height="262" fill="#f4efe2"/>
  <polygon points="10,235 110,165 180,120 240,160 330,70 400,145 470,235" fill="#cfe0bd" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <line x1="22" y1="235" x2="22" y2="201" stroke="#333" stroke-width="2"/><rect x="22" y="179" width="126" height="24" rx="3" fill="#34495e"/><text x="85.0" y="196" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">1 beginning</text>
  <line x1="180" y1="120" x2="180" y2="86" stroke="#333" stroke-width="2"/><rect x="180" y="64" width="96" height="24" rx="3" fill="#34495e"/><text x="228.0" y="81" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">2 climax</text>
  <line x1="330" y1="70" x2="330" y2="36" stroke="#333" stroke-width="2"/><rect x="330" y="14" width="146" height="24" rx="3" fill="#34495e"/><text x="403.0" y="31" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">3 second peak</text>
