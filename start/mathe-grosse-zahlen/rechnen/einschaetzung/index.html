<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Jemand rechnet 612 − 389 und bekommt 1001. Kann das stimmen?</legend>
<label class="question-option"><input type="radio" name="frage-a10" value="0"> <span>Nein: Der Überschlag 600 − 400 ergibt etwa 200.</span></label>
<label class="question-option"><input type="radio" name="frage-a10" value="1"> <span>Ja: Der Überschlag 600 + 400 ergibt etwa 1000.</span></label>
<label class="question-option"><input type="radio" name="frage-a10" value="2"> <span>Ja: Bei großen Zahlen ist das Ergebnis immer groß.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Nein: Der Überschlag 600 − 400 ergibt etwa 200.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig: Das Ergebnis müsste etwa 200 sein, nicht 1001.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Ja: Der Überschlag 600 + 400 ergibt etwa 1000.</strong></p><p>Falsch: Hier steht minus, nicht plus. Du hast addiert.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Ja: Bei großen Zahlen ist das Ergebnis immer groß.</strong></p><p>Beim Subtrahieren wird das Ergebnis kleiner als die erste Zahl.</p></li>
</ul>
<p class="question-explanation">Ein Überschlag zeigt die Größenordnung. 1001 ist größer als 612, das geht bei einer Minusaufgabe nicht.</p>
</div>
