<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 185" role="img" aria-label="Ein Rechteck mit den Seiten 23 und 14, zerlegt in vier Teile: 20 mal 10 gleich 200, 3 mal 10 gleich 30, 20 mal 4 gleich 80 und 3 mal 4 gleich 12. Zusammen 322.">
<rect width="320" height="185" fill="#ffffff"/>
<g font-family="sans-serif" fill="#111111" text-anchor="middle">
<g stroke="#111111" stroke-width="2"><rect x="40" y="30" width="200" height="100" fill="#e8eefc"/><rect x="240" y="30" width="50" height="100" fill="#fde8d0"/><rect x="40" y="130" width="200" height="40" fill="#fde8d0"/><rect x="240" y="130" width="50" height="40" fill="#e3f3e3"/></g><text x="140" y="86" font-size="14">20 · 10 = 200</text><text x="265" y="86" font-size="11">3 · 10</text><text x="265" y="102" font-size="11">= 30</text><text x="140" y="154" font-size="14">20 · 4 = 80</text><text x="265" y="154" font-size="11">3 · 4</text><text x="265" y="167" font-size="11">= 12</text><text x="140" y="20" font-size="13">20</text><text x="265" y="20" font-size="13">3</text><text x="22" y="85" font-size="13">10</text><text x="22" y="155" font-size="13">4</text></g>
</svg>
