    <title>Selbsteinschätzung – Mathe-Wettbewerb 8: Zuordnungen und Prozent</title>
    <meta name="description" content="Für die 1. Runde des Mathematik-Wettbewerbs des Landes Hessen, Klasse 8, Gymnasium. Im Wettbewerb gibt es 8 Pflichtaufgaben und 4 Wahlaufgaben, von denen du 2 bearbeitest. Taschenrechner und Formelsammlung sind nicht erlaubt: Formeln musst du auswendig können, und alle Zahlen hier gehen im Kopf oder schriftlich auf. Diese App übt Zuordnungen, Prozentrechnung und das Wahlthema W3 (Prozent in mehreren Schritten). Die anderen Themen des Wettbewerbs übst du in den Apps [Brüche, Terme und Gleichungen](https://rdmueller.github.io/mathe-wb8-terme/), [Geometrie](https://rdmueller.github.io/mathe-wb8-geometrie/) und [Wahrscheinlichkeit](https://rdmueller.github.io/mathe-wb8-zufall/). Prüfe zuerst mit der Selbsteinschätzung (unten auf dieser Seite), was du schon kannst – dann weißt du, welche Seiten du genau lesen solltest. **So gehst du an jede Aufgabe heran:** 1. Lies die Aufgabe ganz und bestimme das Thema. 2. Schreib auf, was gegeben und was gesucht ist. 3. Überlege die Formel und deinen Plan – erst dann rechnest du. 4. Schreib einen Antwortsatz und prüfe, ob das Ergebnis passen kann." />
