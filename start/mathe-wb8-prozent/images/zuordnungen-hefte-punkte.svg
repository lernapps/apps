<svg xmlns="http://www.w3.org/2000/svg" width="320" height="260" viewBox="0 0 320 260" font-family="sans-serif" font-size="13">
  <title>Koordinatensystem mit der x-Achse Anzahl Hefte und der y-Achse Preis in Euro. Drei blaue Punkte und ein oranger Punkt Q bei 3 Heften und 6 Euro, mit gestrichelten Hilfslinien zu den Achsen</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="100" y1="70" x2="100" y2="220"/><line x1="140" y1="70" x2="140" y2="220"/><line x1="180" y1="70" x2="180" y2="220"/>
    <line x1="220" y1="70" x2="220" y2="220"/><line x1="260" y1="70" x2="260" y2="220"/><line x1="300" y1="70" x2="300" y2="220"/>
    <line x1="60" y1="195" x2="300" y2="195"/><line x1="60" y1="170" x2="300" y2="170"/><line x1="60" y1="145" x2="300" y2="145"/>
    <line x1="60" y1="120" x2="300" y2="120"/><line x1="60" y1="95" x2="300" y2="95"/><line x1="60" y1="70" x2="300" y2="70"/>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <line x1="60" y1="220" x2="310" y2="220"/><polyline points="303,215 310,220 303,225"/>
    <line x1="60" y1="220" x2="60" y2="55"/><polyline points="55,62 60,55 65,62"/>
  </g>
  <g fill="#374151" text-anchor="middle">
    <text x="60" y="238">0</text><text x="100" y="238">1</text><text x="140" y="238">2</text><text x="180" y="238">3</text>
    <text x="220" y="238">4</text><text x="260" y="238">5</text><text x="300" y="238">6</text>
  </g>
  <g fill="#374151" text-anchor="end">
    <text x="52" y="200">2</text><text x="52" y="175">4</text><text x="52" y="150">6</text>
    <text x="52" y="125">8</text><text x="52" y="100">10</text><text x="52" y="75">12</text>
  </g>
  <text x="310" y="256" fill="#111827" text-anchor="end" font-weight="bold">Anzahl Hefte</text>
  <text x="70" y="45" fill="#111827" font-weight="bold">Preis in €</text>
  <line x1="180" y1="220" x2="180" y2="145" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="60" y1="145" x2="180" y2="145" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="100" cy="195" r="5" fill="#2563eb"/>
  <circle cx="140" cy="170" r="5" fill="#2563eb"/>
  <circle cx="220" cy="120" r="5" fill="#2563eb"/>
  <circle cx="180" cy="145" r="6" fill="#ea580c"/>
  <text x="188" y="138" fill="#9a3412" font-weight="bold">Q</text>
</svg>
