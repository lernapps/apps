<svg xmlns="http://www.w3.org/2000/svg" width="320" height="276" viewBox="0 0 320 276" font-family="sans-serif" font-size="14">
  <title>Vier Kästen untereinander, mit Pfeilen verbunden: 1 Gegeben und gesucht, 2 Formel, 3 Rechnung, 4 Antwortsatz. Der erste Kasten ist orange umrandet</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="320" height="276" fill="#ffffff"/>
  <rect x="15" y="10" width="290" height="52" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <rect x="15" y="78" width="290" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="15" y="146" width="290" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="15" y="214" width="290" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <g stroke="#6b7280" stroke-width="2" marker-end="url(#pfeil)">
    <line x1="160" y1="62" x2="160" y2="76"/>
    <line x1="160" y1="130" x2="160" y2="144"/>
    <line x1="160" y1="198" x2="160" y2="212"/>
  </g>
  <g fill="#111827">
    <text x="27" y="31" font-weight="bold">1  Gegeben und gesucht</text>
    <text x="27" y="51" font-size="13">Was ist das Ganze? Welche Größe fehlt?</text>
    <text x="27" y="99" font-weight="bold">2  Formel</text>
    <text x="27" y="119" font-size="13">G · p % = P, nach dem Gesuchten umgestellt</text>
    <text x="27" y="167" font-weight="bold">3  Rechnung</text>
    <text x="27" y="187" font-size="13">p % als Dezimalzahl oder als Bruch</text>
    <text x="27" y="235" font-weight="bold">4  Antwortsatz</text>
    <text x="27" y="255" font-size="13">Passt das Ergebnis zur Frage?</text>
  </g>
</svg>
