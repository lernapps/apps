<svg xmlns="http://www.w3.org/2000/svg" width="320" height="175" viewBox="0 0 320 175" font-family="sans-serif" font-size="14">
  <title>Tabelle Kugeln Eis und Preis in Euro: 4 Kugeln kosten 6 Euro, 12 Kugeln kosten 18 Euro. Links ein Pfeil mal 3 von 4 zu 12, rechts ein Pfeil mal 3 von 6 zu 18</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="320" height="175" fill="#ffffff"/>
  <rect x="90" y="25" width="160" height="130" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <rect x="90" y="25" width="160" height="30" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <line x1="170" y1="25" x2="170" y2="155" stroke="#374151" stroke-width="1.5"/>
  <line x1="90" y1="105" x2="250" y2="105" stroke="#374151" stroke-width="1"/>
  <g fill="#111827" text-anchor="middle">
    <text x="130" y="45" font-weight="bold">Kugeln</text>
    <text x="210" y="45" font-weight="bold">Preis in €</text>
    <text x="130" y="85">4</text><text x="210" y="85">6</text>
    <text x="130" y="135">12</text><text x="210" y="135">18</text>
  </g>
  <path d="M85,80 C55,85 55,125 82,130" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#pfeil)"/>
  <path d="M255,80 C285,85 285,125 258,130" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="34" y="110" fill="#9a3412" font-weight="bold">· 3</text>
  <text x="282" y="110" fill="#9a3412" font-weight="bold">· 3</text>
</svg>
