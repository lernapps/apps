<svg xmlns="http://www.w3.org/2000/svg" width="340" height="170" viewBox="0 0 340 170" font-family="sans-serif" font-size="14">
  <title>Drei Kästen nebeneinander: 100 Euro, Pfeil mit mal 1,2, 120 Euro, Pfeil mit mal 0,8, 96 Euro. Ein langer Pfeil unten führt von 100 Euro direkt zu 96 Euro und trägt mal 0,96</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="pfeilo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="340" height="170" fill="#ffffff"/>
  <rect x="8" y="50" width="70" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="135" y="50" width="70" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <rect x="262" y="50" width="70" height="36" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <g text-anchor="middle" font-weight="bold" font-size="16" fill="#111827">
    <text x="43" y="74">100 €</text>
    <text x="170" y="74">120 €</text>
    <text x="297" y="74">96 €</text>
  </g>
  <line x1="82" y1="68" x2="129" y2="68" stroke="#6b7280" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="209" y1="68" x2="256" y2="68" stroke="#6b7280" stroke-width="2" marker-end="url(#pfeil)"/>
  <g text-anchor="middle" font-weight="bold" fill="#111827">
    <text x="106" y="40">· 1,2</text>
    <text x="233" y="40">· 0,8</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#374151">
    <text x="106" y="24">+20 %</text>
    <text x="233" y="24">−20 %</text>
  </g>
  <path d="M 43 92 C 60 150, 280 150, 296 96" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#pfeilo)"/>
  <text x="170" y="162" text-anchor="middle" font-weight="bold" fill="#c2410c">· 0,96</text>
</svg>
