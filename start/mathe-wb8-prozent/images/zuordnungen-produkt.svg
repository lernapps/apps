<svg xmlns="http://www.w3.org/2000/svg" width="320" height="190" viewBox="0 0 320 190" font-family="sans-serif" font-size="14">
  <title>Tabelle Personen und Stücke je Person: 2 Personen bekommen je 6 Stücke, 4 Personen je 3 Stücke. Links ein Pfeil mal 2 von 2 zu 4, rechts ein Pfeil geteilt durch 2 von 6 zu 3</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="320" height="190" fill="#ffffff"/>
  <rect x="90" y="20" width="160" height="150" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <rect x="90" y="20" width="160" height="50" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <line x1="170" y1="20" x2="170" y2="170" stroke="#374151" stroke-width="1.5"/>
  <line x1="90" y1="120" x2="250" y2="120" stroke="#374151" stroke-width="1"/>
  <g fill="#111827" text-anchor="middle">
    <text x="130" y="50" font-weight="bold">Personen</text>
    <text x="210" y="41" font-weight="bold">Stücke</text>
    <text x="210" y="60" font-weight="bold">je Person</text>
    <text x="130" y="100">2</text><text x="210" y="100">6</text>
    <text x="130" y="150">4</text><text x="210" y="150">3</text>
  </g>
  <path d="M85,95 C55,100 55,140 82,145" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#pfeil)"/>
  <path d="M255,95 C285,100 285,140 258,145" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#pfeil)"/>
  <text x="34" y="125" fill="#9a3412" font-weight="bold">· 2</text>
  <text x="282" y="125" fill="#9a3412" font-weight="bold">: 2</text>
</svg>
