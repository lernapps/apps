<svg xmlns="http://www.w3.org/2000/svg" width="320" height="210" viewBox="0 0 320 210" font-family="sans-serif" font-size="14">
  <title>Tabelle Prozent und Kinder: 20 Prozent sind 6 Kinder, 10 Prozent sind 3 Kinder, 100 Prozent sind 30 Kinder. Links und rechts je ein Pfeil geteilt durch 2 und ein Pfeil mal 10</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="320" height="210" fill="#ffffff"/>
  <rect x="90" y="15" width="160" height="180" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <rect x="90" y="15" width="160" height="30" fill="#dbeafe" stroke="#374151" stroke-width="1.5"/>
  <line x1="170" y1="15" x2="170" y2="195" stroke="#374151" stroke-width="1.5"/>
  <line x1="90" y1="95" x2="250" y2="95" stroke="#374151" stroke-width="1"/>
  <line x1="90" y1="145" x2="250" y2="145" stroke="#374151" stroke-width="1"/>
  <g fill="#111827" text-anchor="middle">
    <text x="130" y="35" font-weight="bold">Prozent</text>
    <text x="210" y="35" font-weight="bold">Kinder</text>
    <text x="130" y="75" fill="#1d4ed8">20 %</text><text x="210" y="75" fill="#1d4ed8">6</text>
    <text x="130" y="125">10 %</text><text x="210" y="125">3</text>
    <text x="130" y="175" fill="#c2410c" font-weight="bold">100 %</text><text x="210" y="175" fill="#c2410c" font-weight="bold">30</text>
  </g>
  <path d="M85,72 C62,78 62,116 82,121" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#pfeil)"/>
  <path d="M85,124 C62,130 62,166 82,171" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#pfeil)"/>
  <path d="M255,72 C278,78 278,116 258,121" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#pfeil)"/>
  <path d="M255,124 C278,130 278,166 258,171" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#pfeil)"/>
  <g fill="#111827" font-weight="bold" text-anchor="middle">
    <text x="36" y="102">: 2</text>
    <text x="36" y="152">· 10</text>
    <text x="296" y="102">: 2</text>
    <text x="296" y="152">· 10</text>
  </g>
</svg>
