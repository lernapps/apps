<svg xmlns="http://www.w3.org/2000/svg" width="340" height="230" viewBox="0 0 340 230" font-family="sans-serif" font-size="14">
  <title>Drei Streifen. Oben der alte Wert als ganzer blauer Streifen, 100 Prozent. In der Mitte eine Zunahme um 20 Prozent: der blaue Streifen und ein oranges Stück dazu, zusammen 120 Prozent, Faktor 1,2. Unten eine Abnahme um 15 Prozent: ein gestricheltes Stück fehlt, es bleiben 85 Prozent, Faktor 0,85</title>
  <rect width="340" height="230" fill="#ffffff"/>
  <g fill="#111827">
    <text x="20" y="24" font-weight="bold">alter Wert: 100 %</text>
    <text x="20" y="98" font-weight="bold">Zunahme um 20 %: 120 %</text>
    <text x="20" y="172" font-weight="bold">Abnahme um 15 %: 85 %</text>
  </g>
  <rect x="20" y="34" width="200" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="20" y="108" width="200" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="220" y="108" width="40" height="30" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="240" y="128" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="bold">20</text>
  <rect x="20" y="182" width="170" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="190" y="182" width="30" height="30" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="205" y="202" text-anchor="middle" font-size="13" fill="#4b5563" font-weight="bold">15</text>
  <g fill="#111827" font-weight="bold" font-size="16">
    <text x="275" y="129">· 1,2</text>
    <text x="275" y="203">· 0,85</text>
  </g>
</svg>
