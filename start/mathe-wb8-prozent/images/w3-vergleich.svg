<svg xmlns="http://www.w3.org/2000/svg" width="340" height="170" viewBox="0 0 340 170" font-family="sans-serif" font-size="14">
  <title>Zwei Streifen. Lea hat 40 Sticker, ein blauer Streifen. Tom hat 50 Sticker, ein gleich langer blauer Streifen und ein oranges Stück für den Unterschied von 10 Stickern. Eine gestrichelte Linie zeigt, wo Leas Streifen endet</title>
  <rect width="340" height="170" fill="#ffffff"/>
  <g fill="#111827" font-weight="bold">
    <text x="20" y="24">Lea: 40 Sticker</text>
    <text x="20" y="98">Tom: 50 Sticker</text>
  </g>
  <rect x="20" y="34" width="200" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="20" y="108" width="200" height="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="220" y="108" width="50" height="30" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="245" y="128" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="bold">10</text>
  <line x1="220" y1="30" x2="220" y2="146" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="245" y="160" text-anchor="middle" font-size="13" fill="#c2410c">Unterschied</text>
</svg>
