<svg xmlns="http://www.w3.org/2000/svg" width="320" height="270" viewBox="0 0 320 270" font-family="sans-serif" font-size="13">
  <title>Koordinatensystem mit x-Achse von 0 bis 8 und y-Achse von 0 bis 7, ein Kästchen ist eine Einheit. Darin vier Punkte A, B, C und D</title>
  <rect width="320" height="270" fill="#ffffff"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="75" y1="30" x2="75" y2="240"/><line x1="105" y1="30" x2="105" y2="240"/><line x1="135" y1="30" x2="135" y2="240"/>
    <line x1="165" y1="30" x2="165" y2="240"/><line x1="195" y1="30" x2="195" y2="240"/><line x1="225" y1="30" x2="225" y2="240"/>
    <line x1="255" y1="30" x2="255" y2="240"/><line x1="285" y1="30" x2="285" y2="240"/>
    <line x1="45" y1="210" x2="285" y2="210"/><line x1="45" y1="180" x2="285" y2="180"/><line x1="45" y1="150" x2="285" y2="150"/>
    <line x1="45" y1="120" x2="285" y2="120"/><line x1="45" y1="90" x2="285" y2="90"/><line x1="45" y1="60" x2="285" y2="60"/>
    <line x1="45" y1="30" x2="285" y2="30"/>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <line x1="45" y1="240" x2="300" y2="240"/><polyline points="293,235 300,240 293,245"/>
    <line x1="45" y1="240" x2="45" y2="18"/><polyline points="40,25 45,18 50,25"/>
  </g>
  <g fill="#374151" text-anchor="middle">
    <text x="45" y="258">0</text><text x="75" y="258">1</text><text x="105" y="258">2</text><text x="135" y="258">3</text>
    <text x="165" y="258">4</text><text x="195" y="258">5</text><text x="225" y="258">6</text><text x="255" y="258">7</text>
    <text x="285" y="258">8</text>
  </g>
  <g fill="#374151" text-anchor="end">
    <text x="37" y="215">1</text><text x="37" y="185">2</text><text x="37" y="155">3</text><text x="37" y="125">4</text>
    <text x="37" y="95">5</text><text x="37" y="65">6</text><text x="37" y="35">7</text>
  </g>
  <text x="308" y="245" fill="#111827" font-weight="bold">x</text>
  <text x="54" y="16" fill="#111827" font-weight="bold">y</text>
  <g fill="#2563eb">
    <circle cx="195" cy="180" r="5"/><circle cx="105" cy="90" r="5"/><circle cx="135" cy="60" r="5"/><circle cx="225" cy="210" r="5"/>
  </g>
  <g fill="#1e3a8a" font-weight="bold" font-size="14">
    <text x="201" y="174">A</text><text x="111" y="84">B</text><text x="141" y="54">C</text><text x="231" y="204">D</text>
  </g>
</svg>
