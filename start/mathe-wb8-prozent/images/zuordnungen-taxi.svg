<svg xmlns="http://www.w3.org/2000/svg" width="320" height="260" viewBox="0 0 320 260" font-family="sans-serif" font-size="13">
  <title>Koordinatensystem Strecke in Kilometern und Preis in Euro. Eine blaue Gerade beginnt auf der y-Achse beim orange markierten Punkt bei 4 Euro und steigt nach rechts</title>
  <rect width="320" height="260" fill="#ffffff"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="85" y1="70" x2="85" y2="220"/><line x1="115" y1="70" x2="115" y2="220"/><line x1="145" y1="70" x2="145" y2="220"/>
    <line x1="175" y1="70" x2="175" y2="220"/><line x1="205" y1="70" x2="205" y2="220"/><line x1="235" y1="70" x2="235" y2="220"/>
    <line x1="265" y1="70" x2="265" y2="220"/><line x1="295" y1="70" x2="295" y2="220"/>
    <line x1="55" y1="190" x2="295" y2="190"/><line x1="55" y1="160" x2="295" y2="160"/><line x1="55" y1="130" x2="295" y2="130"/>
    <line x1="55" y1="100" x2="295" y2="100"/><line x1="55" y1="70" x2="295" y2="70"/>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <line x1="55" y1="220" x2="308" y2="220"/><polyline points="301,215 308,220 301,225"/>
    <line x1="55" y1="220" x2="55" y2="55"/><polyline points="50,62 55,55 60,62"/>
  </g>
  <g fill="#374151" text-anchor="middle">
    <text x="55" y="238">0</text><text x="85" y="238">1</text><text x="115" y="238">2</text><text x="145" y="238">3</text>
    <text x="175" y="238">4</text><text x="205" y="238">5</text><text x="235" y="238">6</text><text x="265" y="238">7</text>
    <text x="295" y="238">8</text>
  </g>
  <g fill="#374151" text-anchor="end">
    <text x="47" y="195">4</text><text x="47" y="165">8</text><text x="47" y="135">12</text>
    <text x="47" y="105">16</text><text x="47" y="75">20</text>
  </g>
  <text x="308" y="256" fill="#111827" text-anchor="end" font-weight="bold">Strecke in km</text>
  <text x="65" y="45" fill="#111827" font-weight="bold">Preis in €</text>
  <line x1="55" y1="190" x2="295" y2="70" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="85" cy="175" r="5" fill="#2563eb"/>
  <circle cx="115" cy="160" r="5" fill="#2563eb"/>
  <circle cx="55" cy="190" r="6" fill="#ea580c"/>
</svg>
