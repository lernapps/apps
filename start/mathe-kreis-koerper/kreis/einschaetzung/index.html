<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ein Winkel schneidet aus einem Kreis mit r = 4 cm einen Bogen der Länge b = 6 cm aus. Wie groß ist sein Bogenmaß?</legend>
<label class="question-option"><input type="radio" name="frage-a8" value="0"> <span>1,5</span></label>
<label class="question-option"><input type="radio" name="frage-a8" value="1"> <span>1,5 cm</span></label>
<label class="question-option"><input type="radio" name="frage-a8" value="2"> <span>24</span></label>
<label class="question-option"><input type="radio" name="frage-a8" value="3"> <span>0,67</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>1,5</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>x = b : r = 6 : 4 = 1,5. Es gibt keine Einheit, weil cm durch cm geteilt wird.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>1,5 cm</strong></p><p>Die Zahl stimmt, aber das Bogenmaß hat keine Einheit: Länge durch Länge ergibt eine reine Zahl.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>24</strong></p><p>Du hast b mit r multipliziert. Das Bogenmaß ist der Quotient b : r.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>0,67</strong></p><p>Du hast r : b gerechnet. Das Bogenmaß ist b : r: erst der Bogen, dann der Radius.</p></li>
</ul>
<p class="question-explanation">Das Bogenmaß ist die Bogenlänge geteilt durch den Radius. Es hängt nicht von der Größe des Kreises ab.</p>
</div>
