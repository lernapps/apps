<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 195" role="img" aria-labelledby="t d">
  <title id="t">Die Höhe eines Baums mit einem Winkel messen</title>
  <desc id="d">Eine Person steht in einem Abstand d vor einem Baum. Ihre Augen sind auf der Augenhöhe. Sie peilt die Baumspitze an, die Blicklinie steigt unter dem Winkel alpha an. Waagerecht von den Augen zum Baum und senkrecht vom Augenpunkt zur Spitze entsteht ein rechtwinkliges Dreieck. Die Baumhöhe ist die Höhe dieses Dreiecks plus die Augenhöhe.</desc>
  <line x1="10" y1="150" x2="280" y2="150" stroke="#222" stroke-width="2"/>
  <rect x="226" y="75" width="10" height="75" fill="#8a6a3a" stroke="#222" stroke-width="1.5"/>
  <ellipse cx="231" cy="48" rx="34" ry="36" fill="#7ab87a" fill-opacity="0.6" stroke="#222" stroke-width="1.5"/>
  <line x1="40" y1="150" x2="40" y2="128" stroke="#222" stroke-width="3"/>
  <circle cx="40" cy="123" r="5" fill="none" stroke="#222" stroke-width="2"/>
  <polygon points="40,125 231,125 231,14" fill="#1a56c4" fill-opacity="0.15"/>
  <line x1="40" y1="125" x2="231" y2="125" stroke="#1a56c4" stroke-width="2.5" stroke-dasharray="6 3"/>
  <line x1="40" y1="125" x2="231" y2="14" stroke="#1a56c4" stroke-width="2.5"/>
  <line x1="231" y1="125" x2="231" y2="14" stroke="#1a56c4" stroke-width="2.5"/>
  <path d="M219,125 V113 H231" fill="none" stroke="#222" stroke-width="1.2"/>
  <path d="M70,125 A30,30 0 0 0 65,110" fill="none" stroke="#222" stroke-width="1.2"/>
  <text x="76" y="119" font-size="13" fill="#222" font-family="sans-serif">α</text>
  <text x="120" y="141" font-size="13" fill="#222" font-family="sans-serif">Abstand d</text>
  <line x1="24" y1="125" x2="24" y2="150" stroke="#222" stroke-width="1.2"/>
  <text x="2" y="170" font-size="12" fill="#222" font-family="sans-serif">Augenhöhe 1,6 m</text>
  <text x="240" y="100" font-size="13" fill="#222" font-family="sans-serif">h</text>
</svg>
