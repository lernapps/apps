<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" role="img" aria-labelledby="t d">
  <title id="t">Kegel mit verstecktem rechtwinkligem Dreieck</title>
  <desc id="d">Ein Kegel mit der Spitze oben. Die Höhe h geht von der Spitze senkrecht zum Mittelpunkt des Grundkreises. Der Radius r liegt in der Grundfläche. Die Mantellinie s geht von der Spitze zum Rand. Höhe, Radius und Mantellinie bilden ein rechtwinkliges Dreieck.</desc>
  <g fill="none" stroke="#222" stroke-width="2">
    <ellipse cx="120" cy="135" rx="70" ry="16" />
    <line x1="50" y1="135" x2="120" y2="20" />
    <line x1="190" y1="135" x2="120" y2="20" />
  </g>
  <polygon points="120,20 120,135 190,135" fill="#1a56c4" fill-opacity="0.15" />
  <line x1="120" y1="20" x2="120" y2="135" stroke="#1a56c4" stroke-width="2.5" stroke-dasharray="6 3" />
  <line x1="120" y1="135" x2="190" y2="135" stroke="#1a56c4" stroke-width="2.5" />
  <line x1="120" y1="20" x2="190" y2="135" stroke="#1a56c4" stroke-width="2.5" />
  <path d="M120,123 H132 V135" fill="none" stroke="#222" stroke-width="1.2" />
  <text x="104" y="82" font-size="14" fill="#222" font-family="sans-serif">h</text>
  <text x="160" y="128" font-size="14" fill="#222" font-family="sans-serif">r</text>
  <text x="164" y="76" font-size="14" fill="#222" font-family="sans-serif">s</text>
</svg>
