<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" role="img" aria-labelledby="t d">
  <title id="t">Sechseck im Kreis, zerlegt in sechs Dreiecke</title>
  <desc id="d">Ein Kreis mit dem Mittelpunkt M. Ein Sechseck liegt innen, seine sechs Ecken liegen auf dem Kreis. Sechs Strecken vom Mittelpunkt zu den Ecken zerlegen es in sechs Dreiecke. Eine Strecke ist mit r beschriftet, der Winkel in der Mitte mit 60 Grad.</desc>
  <circle cx="100" cy="95" r="80" fill="none" stroke="#222" stroke-width="2"/>
  <polygon points="180,95 140,164.3 60,164.3 20,95 60,25.7 140,25.7" fill="none" stroke="#1a56c4" stroke-width="2.5"/>
  <g stroke="#1a56c4" stroke-width="1.5" stroke-dasharray="6 3">
    <line x1="100" y1="95" x2="180" y2="95"/><line x1="100" y1="95" x2="140" y2="164.3"/>
    <line x1="100" y1="95" x2="60" y2="164.3"/><line x1="100" y1="95" x2="20" y2="95"/>
    <line x1="100" y1="95" x2="60" y2="25.7"/><line x1="100" y1="95" x2="140" y2="25.7"/>
  </g>
  <circle cx="100" cy="95" r="3" fill="#222"/>
  <text x="96" y="112" font-size="12" fill="#222" font-family="sans-serif">M</text>
  <text x="150" y="112" font-size="13" fill="#222" font-family="sans-serif">r</text>
  <text x="124" y="90" font-size="11" fill="#222" font-family="sans-serif">60°</text>
  <path d="M 116 95 A 16 16 0 0 0 108 81.1" fill="none" stroke="#222" stroke-width="1.2"/>
</svg>
