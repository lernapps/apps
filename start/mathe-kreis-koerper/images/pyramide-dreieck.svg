<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" role="img" aria-labelledby="t d">
  <title id="t">Quadratische Pyramide mit verstecktem rechtwinkligem Dreieck</title>
  <desc id="d">Eine Pyramide mit quadratischer Grundfläche und der Spitze oben. Die Höhe h geht von der Spitze senkrecht zum Mittelpunkt der Grundfläche. Von dort geht eine Strecke der Länge halbe Grundkante zur Mitte einer Grundkante. Die Seitenhöhe geht von der Spitze zur Mitte dieser Kante. Diese drei Strecken bilden ein rechtwinkliges Dreieck.</desc>
  <g fill="none" stroke="#222" stroke-width="2">
    <polygon points="50,140 150,140 195,110 95,110" />
    <line x1="50" y1="140" x2="122" y2="20" />
    <line x1="150" y1="140" x2="122" y2="20" />
    <line x1="195" y1="110" x2="122" y2="20" />
    <line x1="95" y1="110" x2="122" y2="20" stroke-dasharray="5 4" />
  </g>
  <polygon points="122,20 122,125 100,140" fill="#1a56c4" fill-opacity="0.15" />
  <line x1="122" y1="20" x2="122" y2="125" stroke="#1a56c4" stroke-width="2.5" stroke-dasharray="6 3" />
  <line x1="122" y1="125" x2="100" y2="140" stroke="#1a56c4" stroke-width="2.5" />
  <line x1="122" y1="20" x2="100" y2="140" stroke="#1a56c4" stroke-width="2.5" />
  <path d="M122,115 H112 V125" fill="none" stroke="#222" stroke-width="1.2" />
  <text x="143" y="80" font-size="14" fill="#222" font-family="sans-serif">h</text>
  <text x="82" y="156" font-size="13" fill="#222" font-family="sans-serif">a : 2</text>
  <text x="2" y="100" font-size="13" fill="#222" font-family="sans-serif">Seitenhöhe</text>
  <line x1="66" y1="96" x2="106" y2="96" stroke="#222" stroke-width="1"/>
</svg>
