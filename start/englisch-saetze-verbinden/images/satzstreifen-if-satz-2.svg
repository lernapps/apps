<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 326" role="img">
  <title>Die Weiche für Unwirkliches jetzt: Der Streifen mit if hat eine Zeitform, der andere Streifen would plus Verb. Darunter ein Zeitstrahl mit einem Pfeil einen Schritt nach links</title>
  
  <rect width="480" height="326" fill="#f4efe2"/>
  <text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Die Weiche: Gedachtes: jetzt</text><path d="M10 93.0 H24 C42 93.0 44 61 62 61" fill="none" stroke="#555" stroke-width="4"/><path d="M24 93.0 C42 93.0 44 125 62 125" fill="none" stroke="#555" stroke-width="4"/><rect x="68" y="46" width="44" height="30" rx="15.0" fill="#3f4a9c"/><text x="90.0" y="67.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">if</text><rect x="118" y="44" width="170" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="203.0" y="67.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">we lived by the sea</text><text x="203" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">simple past</text><rect x="68" y="108" width="44" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="90.0" y="131.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">we</text><rect x="118" y="110" width="72" height="30" rx="15.0" fill="#8d6e63"/><text x="154.0" y="131.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">would</text><rect x="198" y="108" width="150" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="273.0" y="131.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">swim every day.</text><text x="233" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">would + Verb</text><path d="M10 236 H462" stroke="#333" stroke-width="3"/><polygon points="462,229 475,236 462,243" fill="#333"/><path d="M90 228 V244" stroke="#333" stroke-width="3"/><path d="M240 228 V244" stroke="#333" stroke-width="3"/><path d="M390 228 V244" stroke="#333" stroke-width="3"/><text x="90" y="262" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">früher</text><text 