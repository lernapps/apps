<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392" role="img">
  <title>Satzstreifen: aus einer direkten Frage wird ein Streifen ohne do</title>
  
  <rect width="520" height="392" fill="#f4efe2"/>
  <text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#444">direkte Frage</text><rect x="10" y="32" width="76" height="34" rx="4" fill="#b8860b" stroke="#333" stroke-width="2"/><text x="48.0" y="55.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">When</text><rect x="94" y="32" width="70" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="129.0" y="55.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">does</text><rect x="172" y="32" width="130" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="237.0" y="55.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">the shop</text><rect x="310" y="32" width="80" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="350.0" y="55.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">close?</text><path d="M129 72 V110" stroke="#333" stroke-width="3" fill="none"/><polygon points="129,118 122,106 136,106" fill="#333"/><text x="140" y="100" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7a1f1f">does fällt weg</text><text x="10" y="134" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#444">indirekte Frage</text><rect x="10" y="144" width="190" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="105.0" y="167.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Could you tell me</text><rect x="208" y="148" width="70" height="30" rx="15.0" fill="#b8860b"/><text x="243.0" y="169.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">when</text><rect x="286" y="144" width="130" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="351.0" y="167.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">the shop</text><rect x="424" y="144" width="80" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="464.0" y="167.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">closes?</text><text x="10" y="206" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="normal" fill="#333">Das Subjekt steht vor dem Verb, das Verb bekommt wieder das -s.</text><text x="10" y="244" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#444">Ja/Nein-Frage: if oder whether</text><rect x="10" y="254" width="150" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="85.0" y="277.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Do you know</text><rect x="168" y="258" width="50" height="30" rx="15.0" fill="#3f4a9c"/><text x="193.0" y="279.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">if</text><rect x="226" y="254" width="150" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="301.0" y="277.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">the shop opens</text><text x="10" y="312" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="normal" fill="#333">Das Fragewort bleibt: what, where, when, how …</text><rect x="10" y="336" width="70" height="30" rx="15.0" fill="#b8860b"/><text x="45.0" y="357.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">when</text><text x="90" y="357" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="normal" fill="#333">Fragewort</text><rect x="190" y="336" width="50" height="30" rx="15.0" fill="#3f4a9c"/><text x="215.0" y="357.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">if</text><text x="250" y="357" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="normal" fill="#333">if oder whether bei Ja/Nein-Fragen</text>
</svg>
