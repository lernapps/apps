<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" role="img">
  <title>Zwei Satzstreifen, durch eine Verbindungskarte verbunden, und die sechs Verbindungskarten</title>
  
  <rect width="480" height="210" fill="#f4efe2"/>
  <rect x="10" y="20" width="150" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="85.0" y="43.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Ellie is tired.</text><rect x="172" y="22" width="56" height="30" rx="15.0" fill="#d35400"/><text x="200.0" y="43.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">so</text><rect x="240" y="20" width="230" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="355.0" y="43.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">she goes to bed early.</text><text x="240" y="86" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Streifen · Karte · Streifen</text><text x="10" y="126" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Die Verbindungskarten:</text><rect x="8" y="140" width="68" height="30" rx="15.0" fill="#138d75"/><text x="42.0" y="161.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">and</text><text x="42.0" y="192" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">und</text><rect x="82" y="140" width="68" height="30" rx="15.0" fill="#c0392b"/><text x="116.0" y="161.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">but</text><text x="116.0" y="192" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">aber</text><rect x="156" y="140" width="68" height="30" rx="15.0" fill="#8e44ad"/><text x="190.0" y="161.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">or</text><text x="190.0" y="192" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">oder</text><rect x="230" y="140" width="84" height="30" rx="15.0" fill="#2c6fd8"/><text x="272.0" y="161.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">because</text><text x="272.0" y="192" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">weil</text><rect x="322" y="140" width="68" height="30" rx="15.0" fill="#d35400"/><text x="356.0" y="161.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">so</text><text x="356.0" y="192" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">deshalb</text><rect x="396" y="140" width="68" height="30" rx="15.0" fill="#7f8c8d"/><text x="430.0" y="161.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">when</text><text x="430.0" y="192" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">wenn</text>
</svg>
