<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 226" role="img">
  <title>Zwei Streifen: Ellie is the girl und who has a red jacket. Daraus wird ein langer Streifen</title>
  
  <rect width="480" height="226" fill="#f4efe2"/>
  <rect x="10" y="16" width="200" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="110.0" y="39.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Ellie is the girl.</text><rect x="10" y="64" width="56" height="30" rx="15.0" fill="#0b6e8a"/><text x="38.0" y="85.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">who</text><rect x="76" y="62" width="200" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="176.0" y="85.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">has a red jacket.</text><text x="290" y="86" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">She → who</text><path d="M240 108 l0 24 m-8 -8 l8 8 l8 -8" fill="none" stroke="#333" stroke-width="3"/><rect x="10" y="142" width="460" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="240.0" y="165.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Ellie is the girl who has a red jacket.</text><text x="10" y="206" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Die Karte ersetzt das Pronomen und der Streifen rückt dahinter.</text>
</svg>
