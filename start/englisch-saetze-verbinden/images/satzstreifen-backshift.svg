<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img">
  <title>Eine Zeitleiste mit drei Stufen. Zwei Pfeile gehen von jetzt eine Stufe nach links und noch eine Stufe nach links</title>
  <rect width="480" height="244" fill="#f4efe2"/>
  <text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Die Zeit rückt eine Stufe nach links</text><rect x="10" y="38" width="130" height="58" rx="6" fill="#fff" stroke="#333" stroke-width="2"/><text x="75" y="62" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">had</text><text x="75" y="84" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">+ 3. Form</text><rect x="175" y="38" width="130" height="58" rx="6" fill="#fff" stroke="#333" stroke-width="2"/><text x="240" y="62" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">was, would,</text><text x="240" y="84" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">could</text><rect x="340" y="38" width="130" height="58" rx="6" fill="#fff" stroke="#333" stroke-width="2"/><text x="405" y="62" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">am, is,</text><text x="405" y="84" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">will, can</text><text x="75" y="118" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">noch früher</text><text x="240" y="118" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">früher</text><text x="405" y="118" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">jetzt</text><path d="M10 136 L462 136" stroke="#333" stroke-width="3" fill="none"/><path d="M452 128 L464 136 L452 144" stroke="#333" stroke-width="3" fill="none"/><circle cx="75" cy="136" r="6" fill="#fff" stroke="#333" stroke-width="2"/><circle cx="240" cy="136" r="6" fill="#fff" stroke="#333" stroke-width="2"/><circle cx="405" cy="136" r="8" fill="#00838f"/><path d="M399 144 Q322 204 246 144" stroke="#00838f" stroke-width="3" fill="none"/><path d="M247 154 L245 143 L256 146" stroke="#00838f" stroke-width="3" fill="none"/><path d="M234 144 Q157 204 81 144" stroke="#00838f" stroke-width="3" fill="none"/><path d="M82 154 L80 143 L91 146" stroke="#00838f" stroke-width="3" fill="none"/><rect x="274" y="166" width="96" height="30" rx="15.0" fill="#00838f"/><text x="322.0" y="187.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">said that</text><text x="10" y="228" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Jeder Pfeil geht eine Stufe zurück.</text>
</svg>
