  <text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">although: dahinter steht ein ganzer Streifen</text><rect x="10" y="36" width="96" height="30" rx="15.0" fill="#546e7a"/><text x="58.0" y="57.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">although</text><rect x="112" y="34" width="124" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="174.0" y="57.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">it was cold</text><text x="244" y="60" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222">,</text><rect x="256" y="34" width="214" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="363.0" y="57.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">we went out.</text><text x="10" y="92" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">although vorn: ein Komma zwischen den Streifen</text><rect x="10" y="106" width="120" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="70.0" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">We went out</text><rect x="138" y="108" width="96" height="30" rx="15.0" fill="#546e7a"/><text x="186.0" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">although</text><rect x="242" y="106" width="140" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="312.0" y="129.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">it was cold.</text><text x="10" y="162" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">although in der Mitte: meist kein Komma</text><rect x="10" y="180" width="150" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="85.0" y="203.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Peter drinks tea</text><text x="168" y="206" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222">,</text><rect x="180" y="182" width="66" height="30" rx="15.0" fill="#546e7a"/><text x="213.0" y="203.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">while</text><rect x="254" y="180" width="216" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="362.0" y="203.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Amir drinks milk.</text><text x="10" y="236" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">while oder whereas: Vergleich, Komma davor</text><rect x="10" y="254" width="130" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="75.0" y="277.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">I wear a scarf</text><rect x="148" y="256" width="84" height="30" rx="15.0" fill="#7cb342"/><text x="190.0" y="277.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">so that</text><rect x="240" y="254" width="160" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="320.0" y="277.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">I will be warm.</text><text x="10" y="310" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">so that: Absicht, meist mit can, will, could</text>
