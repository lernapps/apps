<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 590" role="img">
  <title>Satzstreifen: Die Karte when und das erste Subjekt fallen weg, das Partizip steht vorn und gehört zum Subjekt des zweiten Streifens</title>
  <rect width="520" height="590" fill="#f4efe2"/>
  <text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#444">Konjunktion und Subjekt</text><rect x="10" y="34" width="60" height="30" rx="15.0" fill="#7f8c8d"/><text x="40.0" y="55.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">when</text><rect x="78" y="32" width="170" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="163.0" y="55.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">he read the note,</text><rect x="256" y="32" width="120" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="316.0" y="55.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">he laughed.</text><text x="10" y="98" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7a1f1f">when und das erste he fallen weg</text><path d="M40 108 L40.0 124.0" stroke="#333" stroke-width="3" fill="none"/><polygon points="40,136 33.0,124.0 47.0,124.0" fill="#333"/><text x="10" y="168" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#444">mit Partizip</text><rect x="10" y="212" width="96" height="30" rx="15.0" fill="#4e342e"/><text x="58.0" y="233.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">Reading</text><rect x="114" y="210" width="120" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="174.0" y="233.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">the note,</text><rect x="242" y="210" width="120" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="302.0" y="233.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">he laughed.</text><path d="M58 208 C58 176, 302 176, 302 204" stroke="#333" stroke-width="3" fill="none"/><polygon points="302,208 295,196 309,196" fill="#333"/><text x="130" y="172" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">Wer liest? he</text><text x="10" y="276" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#444">Vorher fertig</text><rect x="10" y="290" width="70" height="30" rx="15.0" fill="#555"/><text x="45.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">after</text><rect x="88" y="288" width="250" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="213.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">she had washed the car,</text><rect x="346" y="288" width="140" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="416.0" y="311.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">she went in.</text><text x="10" y="346" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7a1f1f">after und she fallen weg, had wird Having</text><path d="M40 354 L40.0 360.0" stroke="#333" stroke-width="3" fill="none"/><polygon points="40,372 33.0,360.0 47.0,360.0" fill="#333"/><rect x="10" y="384" width="160" height="30" rx="15.0" fill="#4e342e"/><text x="90.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">Having washed</text><rect x="178" y="382" width="100" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="228.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">the car,</text><rect x="286" y="382" width="140" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="356.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">she went in.</text><text x="10" y="442" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">Having plus 3. Form: erst das eine, dann das andere</text><text x="10" y="474" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#444">Legende</text><rect x="10" y="486" width="60" height="30" rx="15.0" fill="#7f8c8d"/><text x="40.0" y="507.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">when</text><text x="78" y="507" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">Konjunktion (when, after)</text><rect x="10" y="522" width="90" height="30" rx="15.0" fill="#4e342e"/><text x="55.0" y="543.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">Partizip</text><text x="108" y="543" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">ersetzt Konjunktion und Subjekt</text>
