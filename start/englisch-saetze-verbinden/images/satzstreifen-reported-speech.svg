<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 236" role="img">
  <title>Aus einer Sprechblase wird ein Streifen mit der Karte says that</title>
  <rect width="480" height="236" fill="#f4efe2"/>
  <text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Ellie sagt etwas:</text><rect x="10" y="32" width="230" height="36" rx="14" fill="#fff" stroke="#333" stroke-width="2"/><path d="M40 68 l12 18 l12 -18" fill="#fff" stroke="#333" stroke-width="2"/><rect x="41" y="65" width="22" height="6" fill="#fff"/><text x="125.0" y="56.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#222">I love my red bag.</text><path d="M250 62 L250 112" stroke="#333" stroke-width="3" fill="none"/><path d="M242 103 L250 112 L258 103" stroke="#333" stroke-width="3" fill="none"/><rect x="10" y="128" width="70" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="45.0" y="151.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Ellie</text><rect x="88" y="130" width="106" height="30" rx="15.0" fill="#00838f"/><text x="141.0" y="151.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">says that</text><rect x="202" y="128" width="268" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="336.0" y="151.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">she loves her red bag.</text><text x="10" y="196" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">I → she, my → her</text><text x="10" y="222" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Das Verb bekommt bei she das -s.</text>
</svg>
