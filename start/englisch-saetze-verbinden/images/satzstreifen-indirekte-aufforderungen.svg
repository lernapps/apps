<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 336" role="img">
  <title>Zwei Sprechblasen mit einem Befehl und einem Verbot, darunter je ein Streifen mit der Karte told</title>
  <rect width="480" height="336" fill="#f4efe2"/>
  <text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Ein Befehl wird weitergegeben:</text><rect x="10" y="32" width="190" height="36" rx="14" fill="#fff" stroke="#333" stroke-width="2"/><path d="M40 68 l12 18 l12 -18" fill="#fff" stroke="#333" stroke-width="2"/><rect x="41" y="65" width="22" height="6" fill="#fff"/><text x="105.0" y="56.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#222">Sit down, Amir.</text><path d="M250 62 L250 106" stroke="#333" stroke-width="3" fill="none"/><path d="M242 97 L250 106 L258 97" stroke="#333" stroke-width="3" fill="none"/><rect x="10" y="118" width="76" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="48.0" y="141.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Mr Hill</text><rect x="94" y="120" width="52" height="30" rx="15.0" fill="#827717"/><text x="120.0" y="141.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">told</text><rect x="154" y="118" width="66" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="187.0" y="141.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Amir</text><rect x="228" y="120" width="40" height="30" rx="15.0" fill="#827717"/><text x="248.0" y="141.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">to</text><rect x="276" y="118" width="112" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="332.0" y="141.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">sit down.</text><text x="10" y="188" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Ein Verbot:</text><rect x="10" y="198" width="190" height="36" rx="14" fill="#fff" stroke="#333" stroke-width="2"/><path d="M40 234 l12 18 l12 -18" fill="#fff" stroke="#333" stroke-width="2"/><rect x="41" y="231" width="22" height="6" fill="#fff"/><text x="105.0" y="222.0" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#222">Don't run, Peter.</text><path d="M250 228 L250 272" stroke="#333" stroke-width="3" fill="none"/><path d="M242 263 L250 272 L258 263" stroke="#333" stroke-width="3" fill="none"/><rect x="10" y="284" width="66" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="43.0" y="307.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Ellie</text><rect x="84" y="286" width="52" height="30" rx="15.0" fill="#827717"/><text x="110.0" y="307.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">told</text><rect x="144" y="284" width="76" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="182.0" y="307.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Peter</text><rect x="228" y="286" width="74" height="30" rx="15.0" fill="#827717"/><text x="265.0" y="307.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">not to</text><rect x="310" y="284" width="70" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="345.0" y="307.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">run.</text>
</svg>
