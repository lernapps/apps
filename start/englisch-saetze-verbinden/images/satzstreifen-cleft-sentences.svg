<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 490" role="img">
  <title>Satzstreifen: ein Streifen wird mit It is und that geteilt und der betonte Teil steht dazwischen</title>
  <rect width="480" height="490" fill="#f4efe2"/>
  <text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#444">Ein Streifen wird geteilt</text><rect x="10" y="34" width="240" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="130.0" y="57.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">The dog broke the window.</text><path d="M130 74 V104" stroke="#333" stroke-width="3" fill="none"/><polygon points="130,112 123,100 137,100" fill="#333"/><rect x="10" y="122" width="60" height="30" rx="15.0" fill="#1b5e20"/><text x="40.0" y="143.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">It is</text><rect x="78" y="120" width="100" height="34" rx="4" fill="#e8f5e9" stroke="#1b5e20" stroke-width="4"/><text x="128.0" y="143.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">the dog</text><rect x="186" y="122" width="60" height="30" rx="15.0" fill="#1b5e20"/><text x="216.0" y="143.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">that</text><rect x="254" y="120" width="216" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="362.0" y="143.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">broke the window.</text><text x="10" y="176" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">Der betonte Teil steht zwischen It is und that.</text><text x="10" y="214" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#444">Die zweite Form: What … is …</text><rect x="10" y="226" width="190" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="105.0" y="249.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">We need a new map.</text><path d="M105 266 V292" stroke="#333" stroke-width="3" fill="none"/><polygon points="105,300 98,288 112,288" fill="#333"/><rect x="10" y="308" width="150" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="85.0" y="331.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">What we need</text><rect x="168" y="310" width="44" height="30" rx="15.0" fill="#1b5e20"/><text x="190.0" y="331.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">is</text><rect x="220" y="308" width="130" height="34" rx="4" fill="#e8f5e9" stroke="#1b5e20" stroke-width="4"/><text x="285.0" y="331.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">a new map</text><text x="10" y="362" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">Hier steht der betonte Teil am Ende.</text><rect x="10" y="384" width="60" height="30" rx="15.0" fill="#1b5e20"/><text x="40.0" y="405.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">It is</text><text x="80" y="405" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">dunkelgrüne Karte = Gerüst (It is, that, is)</text><rect x="10" y="422" width="50" height="30" rx="4" fill="#e8f5e9" stroke="#1b5e20" stroke-width="4"/><text x="70" y="445" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">hellgrüner Rand = betont</text>
</svg>
