<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" role="img">
  <title>Satzstreifen: drei Rollen eines -ing-Wortes und ein Infinitiv zum Vergleich</title>
  <rect width="520" height="450" fill="#f4efe2"/>
  <text x="10" y="24" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">Frage an jedes -ing-Wort:</text><text x="10" y="46" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">Welche Rolle hat es in seinem Streifen?</text><rect x="10" y="66" width="64" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="42.0" y="89.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">We are</text><rect x="80" y="66" width="92" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="4"/><text x="126.0" y="89.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">singing</text><rect x="178" y="66" width="60" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="208.0" y="89.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">now.</text><rect x="300" y="68" width="140" height="30" rx="15.0" fill="#e3e3e3" stroke="#333" stroke-width="2"/><text x="370.0" y="89.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">Verlaufsform</text><rect x="10" y="114" width="92" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="4"/><text x="56.0" y="137.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Singing</text><rect x="108" y="114" width="80" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="148.0" y="137.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">is fun.</text><rect x="300" y="116" width="120" height="30" rx="0" fill="#e3e3e3" stroke="#333" stroke-width="2"/><text x="360.0" y="137.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">Gerundium</text><rect x="10" y="162" width="76" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="48.0" y="185.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">The man</text><rect x="92" y="162" width="92" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="4"/><text x="138.0" y="185.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">singing</text><rect x="190" y="162" width="90" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="235.0" y="185.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">smiles.</text><polygon points="300,164 406,164 420,179.0 406,194 300,194" fill="#4e342e" stroke="#333" stroke-width="2"/><text x="355.0" y="185.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff">Partizip</text><rect x="10" y="210" width="86" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="53.0" y="233.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">We want</text><rect x="102" y="210" width="92" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="148.0" y="233.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">to sing</text><rect x="300" y="212" width="190" height="30" rx="4" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="5 3"/><text x="395.0" y="233.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">Infinitiv: kein -ing</text><text x="10" y="276" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333">Legende:</text><rect x="10" y="288" width="50" height="30" rx="15.0" fill="#e3e3e3" stroke="#333" stroke-width="2"/><text x="35.0" y="309.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222"></text><text x="70" y="309" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">be + -ing: ein Verb im Streifen</text><rect x="10" y="324" width="50" height="30" rx="0" fill="#e3e3e3" stroke="#333" stroke-width="2"/><text x="35.0" y="345.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222"></text><text x="70" y="345" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">steht an der Stelle eines Nomens</text><polygon points="10,360 46,360 60,375.0 46,390 10,390" fill="#4e342e" stroke="#333" stroke-width="2"/><text x="30.0" y="381.0" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#fff"></text><text x="70" y="381" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">beschreibt wie ein Adjektiv, verkürzt einen Satz</text><text x="10" y="410" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">Dicker Rand: das -ing-Wort.</text>
</svg>
