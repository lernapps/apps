<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 226" role="img">
  <title>Die Weiche: der Streifen mit if steht im simple present, der andere Streifen hat will plus Verb. Die Streifen dürfen die Plätze tauschen</title>
  
  <rect width="480" height="226" fill="#f4efe2"/>
  <text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Die Weiche: zwei Streifen, zwei Zeitformen</text><rect x="10" y="40" width="50" height="30" rx="15.0" fill="#3f4a9c"/><text x="35.0" y="61.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">if</text><rect x="70" y="38" width="130" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="135.0" y="61.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">you come</text><rect x="210" y="38" width="260" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="340.0" y="61.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">I will be happy.</text><text x="135" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">simple present</text><text x="340" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">will + Verb</text><rect x="10" y="120" width="260" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="140.0" y="143.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">I will be happy</text><rect x="280" y="122" width="50" height="30" rx="15.0" fill="#3f4a9c"/><text x="305.0" y="143.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">if</text><rect x="340" y="120" width="130" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="405.0" y="143.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">you come.</text><text x="140" y="174" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">will + Verb</text><text x="405" y="174" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">simple present</text><text x="10" y="206" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Im if-Streifen steht kein will.</text>
</svg>
