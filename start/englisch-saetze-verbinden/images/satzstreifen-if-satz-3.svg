<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 326" role="img">
  <title>Die Weiche für Gedachtes früher: Der Streifen mit if hat eine Zeitform, der andere Streifen would have plus 3. Form. Darunter ein Zeitstrahl mit den Marken damals, früher, jetzt und später und zwei Pfeilen nach links</title>
  
  <rect width="480" height="326" fill="#f4efe2"/>
  <text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Die Weiche: Gedachtes früher</text><path d="M10 93.0 H24 C42 93.0 44 61 62 61" fill="none" stroke="#555" stroke-width="4"/><path d="M24 93.0 C42 93.0 44 125 62 125" fill="none" stroke="#555" stroke-width="4"/><rect x="68" y="46" width="44" height="30" rx="15.0" fill="#3f4a9c"/><text x="90.0" y="67.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">if</text><rect x="118" y="44" width="190" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="213.0" y="67.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">we had taken the train</text><text x="213" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">had + 3. Form</text><rect x="68" y="108" width="44" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="90.0" y="131.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">we</text><rect x="118" y="110" width="112" height="30" rx="15.0" fill="#8d6e63"/><text x="174.0" y="131.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">would have</text><rect x="238" y="108" width="160" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="318.0" y="131.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">arrived on time.</text><text x="258" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">would have + 3. Form</text><path d="M10 236 H462" stroke="#333" stroke-width="3"/><polygon points="462,229 475,236 462,243" fill="#333"/><path d="M60 228 V244" stroke="#333" stroke-width="3"/><path d="M180 228 V244" stroke="#333" stroke-width="3"/><path d="M300 228 V244" stroke="#333" stroke-width="3"/><path d="M420 228 V244" stroke="#333" stroke-width="3"/><text x="60" y="262" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">damals</text><text x="180" y="262" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">früher</text><text x="300" y="262" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">jetzt</text><text x="420" y="262" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">später</text><text x="60" y="284" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">past perfect</text><text x="180" y="284" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">simple past</text><text x="300" y="284" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">simple present</text><text x="420" y="284" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">will</text><path d="M300 220 Q240.0 196 193.3 215.6" fill="none" stroke="#333" stroke-width="3"/><polygon points="180,220 193.0,208.3 197.4,221.6" fill="#333"/><path d="M180 220 Q120.0 196 73.3 215.6" fill="none" stroke="#333" stroke-width="3"/><polygon points="60,220 73.0,208.3 77.4,221.6" fill="#333"/><text x="180" y="190" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">zwei Schritte nach links</text><text x="10" y="314" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Gemeint ist damals, nicht jetzt.</text>
</svg>
