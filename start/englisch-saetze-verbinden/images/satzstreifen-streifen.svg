<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 216" role="img">
  <title>Drei weiße Satzstreifen untereinander mit je einem englischen Satz</title>
  
  <rect width="480" height="216" fill="#f4efe2"/>
  <text x="10" y="24" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Ein Satz ist ein Streifen:</text><rect x="10" y="40" width="300" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="160.0" y="63.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">I play football every day.</text><text x="320" y="64" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Pronomen I</text><rect x="10" y="86" width="300" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="160.0" y="109.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Ellie plays football on Saturday.</text><text x="320" y="110" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">-s bei Ellie</text><rect x="10" y="132" width="300" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="160.0" y="155.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">We will win tomorrow.</text><text x="320" y="156" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">will + Verb</text><text x="10" y="196" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Jeder Streifen hat ein Subjekt und ein Verb.</text>
</svg>
