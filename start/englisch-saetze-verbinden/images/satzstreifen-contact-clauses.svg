<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img">
  <title>Zwei Beispiele: oben mit gestrichelter Karte (that) darf die Karte fehlen, unten steht die Karte who und muss bleiben</title>
  
  <rect width="480" height="240" fill="#f4efe2"/>
  <text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Das Pronomen ist Objekt: die Karte darf fehlen</text><rect x="10" y="36" width="190" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="105.0" y="59.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">This is the song</text><rect x="208" y="38" width="66" height="30" rx="15.0" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="5 3"/><text x="241.0" y="59.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">(that)</text><rect x="282" y="36" width="188" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="376.0" y="59.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">I like.</text><text x="10" y="104" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">it → die Karte ersetzt das Objekt it</text><text x="10" y="142" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Das Pronomen ist Subjekt: die Karte muss bleiben</text><rect x="10" y="156" width="190" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="105.0" y="179.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">This is the girl</text><rect x="208" y="158" width="56" height="30" rx="15.0" fill="#0b6e8a"/><text x="236.0" y="179.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">who</text><rect x="272" y="156" width="198" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="371.0" y="179.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">sits there.</text><text x="10" y="224" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">she → die Karte ersetzt das Subjekt she</text>
</svg>
