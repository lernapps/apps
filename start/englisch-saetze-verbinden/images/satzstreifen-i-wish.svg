<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 392" role="img">
  <title>Vier Streifen mit der gelben Karte wish oder If only und einem Streifen mit einer Zeitform, jeweils mit einem kurzen Hinweis rechts daneben, darunter ein Zeitstrahl mit einem Pfeil einen Schritt nach links</title>
  
  <rect width="480" height="392" fill="#f4efe2"/>
