="#222">wish</text><rect x="118" y="144" width="150" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="193.0" y="167.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">she would stop.</text><text x="278" y="167" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">would · Veränderung</text><rect x="10" y="198" width="84" height="30" rx="15.0" fill="#f9a825"/><text x="52.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">If only</text><rect x="102" y="196" width="150" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="177.0" y="219.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">it were summer.</text><text x="262" y="219" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">stärker als wish</text><path d="M10 300 H462" stroke="#333" stroke-width="3"/><polygon points="462,293 475,300 462,307" fill="#333"/><path d="M90 292 V308" stroke="#333" stroke-width="3"/><path d="M240 292 V308" stroke="#333" stroke-width="3"/><path d="M390 292 V308" stroke="#333" stroke-width="3"/><text x="90" y="326" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">früher</text><text x="240" y="326" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">jetzt</text><text x="390" y="326" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">später</text><text x="90" y="348" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">simple past</text><text x="240" y="348" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">simple present</text><text x="390" y="348" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">will</text><path d="M240 284 Q165.0 260 103.0 278.8" fill="none" stroke="#333" stroke-width="3"/><polygon points="90,284 102.3,271.6 107.5,284.6" fill="#333"/><text x="165" y="254" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#222">ein Schritt nach links</text><text x="10" y="378" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Ein Wunsch oder ein Bedauern: Die Wirklichkeit ist anders.</text>
