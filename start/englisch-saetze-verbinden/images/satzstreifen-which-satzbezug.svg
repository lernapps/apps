<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 372" role="img">
  <title>Satzstreifen: which greift den ganzen Streifen davor auf</title>
  <rect width="480" height="372" fill="#f4efe2"/>
  <text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#444">which greift den ganzen Streifen auf</text><rect x="10" y="36" width="250" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="135.0" y="59.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">The shop was closed</text><path d="M10 82 H260 M10 76 V88 M260 76 V88" stroke="#9a5b1e" stroke-width="4" fill="none"/><text x="266" y="64" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222">,</text><rect x="280" y="38" width="76" height="30" rx="15.0" fill="#9a5b1e"/><text x="318.0" y="59.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">which</text><rect x="364" y="36" width="106" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="417.0" y="59.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">was no fun</text><path d="M318 70 V104 H135 V94" stroke="#9a5b1e" stroke-width="3" fill="none"/><polygon points="135,88 128,100 142,100" fill="#9a5b1e"/><text x="10" y="128" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">Die Karte steht nach dem Komma und ersetzt it.</text><text x="10" y="176" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#444">Kapitel 1: which hängt nur an einem Nomen</text><rect x="10" y="190" width="150" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="85.0" y="213.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">We have a boat</text><rect x="170" y="192" width="80" height="30" rx="15.0" fill="#9a5b1e"/><text x="210.0" y="213.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">which</text><rect x="258" y="190" width="150" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="333.0" y="213.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">is very old.</text><path d="M210 224 V246 H100 V232" stroke="#9a5b1e" stroke-width="3" fill="none" stroke-dasharray="5 3"/><polygon points="100,226 93,238 107,238" fill="#9a5b1e"/><text x="10" y="274" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">Der gestrichelte Pfeil zeigt nur auf das Nomen boat.</text><rect x="10" y="296" width="80" height="30" rx="15.0" fill="#9a5b1e"/><text x="50.0" y="317.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">which</text><text x="100" y="317" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#333">Relativkarte which</text>
</svg>
