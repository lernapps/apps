<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 352" role="img">
  <title>Zwei Beispiele: oben ein Relativsatz zwischen zwei Kommas, der wegfallen kann, unten ein Relativsatz ohne Kommas, der nicht wegfallen kann</title>
  <rect width="480" height="352" fill="#f4efe2"/>
  <text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Nicht notwendig: Kommas wie eine Klammer</text><rect x="10" y="34" width="96" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="58.0" y="57.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">The school</text><text x="114" y="60" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222">,</text><rect x="124" y="36" width="66" height="30" rx="15.0" fill="#9a5b1e"/><text x="157.0" y="57.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">which</text><rect x="196" y="34" width="70" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="231.0" y="57.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">is old</text><text x="274" y="60" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222">,</text><rect x="286" y="34" width="184" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="378.0" y="57.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">is in Millbrook.</text><path d="M120 76 v10 h158 v-10" fill="none" stroke="#333" stroke-width="3"/><text x="199" y="114" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Klammer aus Kommas</text><path d="M30 126 V146 m-7 -9 l7 9 l7 -9" fill="none" stroke="#333" stroke-width="3"/><text x="48" y="142" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">herausnehmen</text><rect x="10" y="152" width="250" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="135.0" y="175.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">The school is in Millbrook.</text><text x="272" y="175" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Der Satz bleibt klar.</text><text x="10" y="230" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Notwendig: keine Kommas</text><rect x="10" y="242" width="80" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="50.0" y="265.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">The girl</text><rect x="98" y="244" width="56" height="30" rx="15.0" fill="#0b6e8a"/><text x="126.0" y="265.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">who</text><rect x="162" y="242" width="70" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="197.0" y="265.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">is tall</text><rect x="240" y="242" width="70" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="275.0" y="265.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">wins.</text><path d="M30 284 V304 m-7 -9 l7 9 l7 -9" fill="none" stroke="#333" stroke-width="3"/><text x="48" y="300" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">herausnehmen</text><rect x="10" y="310" width="140" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><text x="80.0" y="333.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">The girl wins.</text><text x="162" y="333" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#555">Welches Mädchen? Unklar.</text>
</svg>
