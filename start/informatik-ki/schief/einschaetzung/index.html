<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../schief/">Wenn die Daten schief sind</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 3 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 1</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Diese Fälle sind erfunden. Welche Beispiele fehlen in den Trainingsdaten?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Eine Foto-App erkennt Hunde im Schnee schlecht.</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">Aufnahmen von Sprechern unter zwölf Jahren</option><option value="0">Bilder aus der kalten Jahreszeit</option><option value="2">Bilder außerhalb der Blütezeit</option><option value="3">Hunde in Katzengröße</option><option value="4">ein schnellerer Computer</option></select></label></li>
<li><label><span>Ein Sprachassistent versteht Kinder schlecht.</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">Aufnahmen von Sprechern unter zwölf Jahren</option><option value="0">Bilder aus der kalten Jahreszeit</option><option value="2">Bilder außerhalb der Blütezeit</option><option value="3">Hunde in Katzengröße</option><option value="4">ein schnellerer Computer</option></select></label></li>
<li><label><span>Ein Pflanzen-Erkenner erkennt Pflanzen ohne Blüten nicht.</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">Aufnahmen von Sprechern unter zwölf Jahren</option><option value="0">Bilder aus der kalten Jahreszeit</option><option value="2">Bilder außerhalb der Blütezeit</option><option value="3">Hunde in Katzengröße</option><option value="4">ein schnellerer Computer</option></select></label></li>
<li><label><span>Die Maschine des Tierheims hält kleine Hunde mit kurzer Schnauze für Katzen.</span> <select name="frage-a1-3" data-left="3"><option value="">bitte wählen</option><option value="1">Aufnahmen von Sprechern unter zwölf Jahren</option><option value="0">Bilder aus der kalten Jahreszeit</option><option value="2">Bilder außerhalb der Blütezeit</option><option value="3">Hunde in Katzengröße</option><option value="4">ein schnellerer Computer</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Eine Foto-App erkennt Hunde im Schnee schlecht. – Bilder aus der kalten Jahreszeit; Ein Sprachassistent versteht Kinder schlecht. – Aufnahmen von Sprechern unter zwölf Jahren; Ein Pflanzen-Erkenner erkennt Pflanzen ohne Blüten nicht. – Bilder außerhalb der Blütezeit; Die Maschine des Tierheims hält kleine Hunde mit kurzer Schnauze für Katzen. – Hunde in Katzengröße</p>
<p class="question-explanation">In jedem Fall fehlt eine Art von Beispielen.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>

<p class="question-hint">Gib jedem Eintrag seinen Platz: 1 für den ersten.</p>
<ul class="question-pairs">
<li><label><span>Beispiele ergänzen und neu testen</span> <select name="frage-a2-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>Falsch erkannte Tiere sammeln</span> <select name="frage-a2-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>Gemeinsamkeiten der Fehler suchen</span> <select name="frage-a2-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>In den Trainingsdaten nach Lücken suchen</span> <select name="frage-a2-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 1. Falsch erkannte Tiere sammeln, 2. Gemeinsamkeiten der Fehler suchen, 3. In den Trainingsdaten nach Lücken suchen, 4. Beispiele ergänzen und neu testen</p>
<p class="question-explanation">Erst das Muster der Fehler zeigt, welche Beispiele fehlen.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Karten würden das Muster „klein ist Katze, groß ist Hund“ brechen, wenn sie in den Beutel kämen?</legend>
<label class="question-option"><input type="checkbox" name="frage-a3" value="0"> <span>Waldi, ein kleiner Hund</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="1"> <span>Tiger, eine große Katze</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="2"> <span>Bella, ein großer Hund</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="3"> <span>Sammy, ein großer Hund</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Waldi, ein kleiner Hund</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Ein kleiner Hund.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Tiger, eine große Katze</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Eine große Katze.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Bella, ein großer Hund</strong></p><p>Nein: Bella ist groß und ein Hund, sie passt ins Muster.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Sammy, ein großer Hund</strong></p><p>Nein: Auch Sammy ist groß und ein Hund.</p></li>
</ul>
<p class="question-explanation">Mit solchen Karten entscheidet die Größe nicht mehr allein.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
