<fieldset>
<legend class="question-text">Was sagt Jonas Regel „spitze Ohren bedeutet Katze“ zu diesen neuen Karten? Und stimmt das?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Rex (Hund): spitze Ohren</span> <select name="frage-a3-0" data-left="0"><option value="">bitte wählen</option><option value="3">sagt Katze, richtig</option><option value="0">sagt Katze, falsch</option><option value="2">sagt Hund, richtig</option><option value="1">sagt Hund, falsch</option></select></label></li>
<li><label><span>Flocke (Katze): hängende Ohren</span> <select name="frage-a3-1" data-left="1"><option value="">bitte wählen</option><option value="3">sagt Katze, richtig</option><option value="0">sagt Katze, falsch</option><option value="2">sagt Hund, richtig</option><option value="1">sagt Hund, falsch</option></select></label></li>
<li><label><span>Bella (Hund): hängende Ohren</span> <select name="frage-a3-2" data-left="2"><option value="">bitte wählen</option><option value="3">sagt Katze, richtig</option><option value="0">sagt Katze, falsch</option><option value="2">sagt Hund, richtig</option><option value="1">sagt Hund, falsch</option></select></label></li>

</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Rex (Hund): spitze Ohren – sagt Katze, falsch; Flocke (Katze): hängende Ohren – sagt Hund, falsch; Bella (Hund): hängende Ohren – sagt Hund, richtig; Minka (Katze): spitze Ohren – sagt Katze, richtig</p>
<p class="question-explanation">Die Regel schaut nur auf die Ohren. Rex ist ein Hund mit spitzen Ohren, Flocke eine Katze mit hängenden Ohren. Darum irrt die Regel bei beiden.</p>

<li><label><span>Die Regel an neuen Karten testen</span> <select name="frage-a4-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
