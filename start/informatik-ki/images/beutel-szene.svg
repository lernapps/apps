<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img">
  <title>Jona, Selin und Mia mit dem Trainingsbeutel</title>
  <defs>
    <!-- Jona: kurze rotblonde Haare, helle Haut, grüner Kapuzenpulli -->
