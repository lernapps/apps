    <g id="trainingsbeutel" stroke="#333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <rect x="44" y="6" width="40" height="52" rx="5" fill="#fbf8f1" transform="rotate(-12 64 32)"/>
