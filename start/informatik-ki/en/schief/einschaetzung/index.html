<h1>Self-assessment</h1>
<p class="explainer-assessment-nojs">The self-assessment needs JavaScript. <a href="../../../en/schief/">When the data is skewed (bias)</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>With this self-assessment, 3 tasks give you an overview of what you know already. It asks about every page.</p>
<p>The app does not tell you for each task whether it is right. Only at the end do you see for each page asked whether you know it already. What you leave empty counts as not known.</p>
<p class="explainer-assessment-privacy">Your result stays on this device only. A new start replaces it.</p>
<p><button type="button" class="explainer-assessment-begin">Let's go</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Page 1 of 1</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Task 1</p><div class="question" id="frage-a1" data-id="a1" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">These cases are made up. Which examples are missing from the training data?</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>A photo app is bad at recognising dogs in snow.</span> <select name="frage-a1-0" data-left="0"><option value="">please choose</option><option value="1">recordings of speakers under twelve</option><option value="0">pictures from the cold season</option><option value="2">pictures outside the flowering season</option><option value="3">dogs the size of cats</option><option value="4">a faster computer</option></select></label></li>
<li><label><span>A voice assistant is bad at understanding children.</span> <select name="frage-a1-1" data-left="1"><option value="">please choose</option><option value="1">recordings of speakers under twelve</option><option value="0">pictures from the cold season</option><option value="2">pictures outside the flowering season</option><option value="3">dogs the size of cats</option><option value="4">a faster computer</option></select></label></li>
<li><label><span>A plant app does not recognise plants without flowers.</span> <select name="frage-a1-2" data-left="2"><option value="">please choose</option><option value="1">recordings of speakers under twelve</option><option value="0">pictures from the cold season</option><option value="2">pictures outside the flowering season</option><option value="3">dogs the size of cats</option><option value="4">a faster computer</option></select></label></li>
<li><label><span>The shelter's machine thinks small dogs with a short snout are cats.</span> <select name="frage-a1-3" data-left="3"><option value="">please choose</option><option value="1">recordings of speakers under twelve</option><option value="0">pictures from the cold season</option><option value="2">pictures outside the flowering season</option><option value="3">dogs the size of cats</option><option value="4">a faster computer</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> A photo app is bad at recognising dogs in snow. – pictures from the cold season; A voice assistant is bad at understanding children. – recordings of speakers under twelve; A plant app does not recognise plants without flowers. – pictures outside the flowering season; The shelter's machine thinks small dogs with a short snout are cats. – dogs the size of cats</p>
<p class="question-explanation">In each case one kind of example is missing.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Task 2</p><div class="question" id="frage-a2" data-id="a2" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In which order do you find and fix a fault in the training data?</legend>
<p class="question-hint">Give each entry its place: 1 for the first.</p>
<ul class="question-pairs">
<li><label><span>Add examples and test again</span> <select name="frage-a2-3" data-item="3"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option></select></label></li>
<li><label><span>Collect the animals that were wrongly identified</span> <select name="frage-a2-0" data-item="0"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option></select></label></li>
<li><label><span>Look for what the mistakes have in common</span> <select name="frage-a2-1" data-item="1"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option></select></label></li>
<li><label><span>Search the training data for gaps</span> <select name="frage-a2-2" data-item="2"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> 1. Collect the animals that were wrongly identified, 2. Look for what the mistakes have in common, 3. Search the training data for gaps, 4. Add examples and test again</p>
<p class="question-explanation">Only the pattern of the mistakes shows which examples are missing.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Task 3</p><div class="question" id="frage-a3" data-id="a3" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Which cards would break the pattern “small means cat, big means dog” if they went into the bag?</legend>
<label class="question-option"><input type="checkbox" name="frage-a3" value="0"> <span>Waldi, a small dog</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="1"> <span>Tiger, a big cat</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="2"> <span>Bella, a big dog</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="3"> <span>Sammy, a big dog</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Waldi, a small dog</strong> <span class="question-badge question-badge-right">right answer</span></p><p>A small dog.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Tiger, a big cat</strong> <span class="question-badge question-badge-right">right answer</span></p><p>A big cat.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Bella, a big dog</strong></p><p>No: Bella is big and a dog, so she fits the pattern.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Sammy, a big dog</strong></p><p>No: Sammy is big and a dog too.</p></li>
</ul>
<p class="question-explanation">Cards like these stop size from deciding.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>
