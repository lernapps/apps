<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Beobachtungen können auf eine chemische Reaktion hinweisen?</legend>
<label class="question-option"><input type="checkbox" name="frage-a1" value="0"> <span>Ein Feststoff färbt sich beim Erhitzen schwarz.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="1"> <span>Beim Zusammengeben zweier Flüssigkeiten steigen Gasblasen auf.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="2"> <span>Ein Metallstück glüht hell auf und gibt Wärme ab.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="3"> <span>Ein Stück Eis liegt auf dem Tisch und wird kleiner.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Ein Feststoff färbt sich beim Erhitzen schwarz.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Eine neue Farbe kann ein neuer Stoff sein. Es ist ein Hinweis, aber noch kein Beweis.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Beim Zusammengeben zweier Flüssigkeiten steigen Gasblasen auf.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Ein neues Gas kann bei einer Reaktion entstehen. Ein Hinweis auf einen neuen Stoff.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>Ein Metallstück glüht hell auf und gibt Wärme ab.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Licht und Wärme zeigen oft eine Reaktion an, zum Beispiel beim Verbrennen.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Ein Stück Eis liegt auf dem Tisch und wird kleiner.</strong></p><p>Das Eis schmilzt. Es bleibt Wasser, es entsteht kein neuer Stoff.</p></li>
</ul>
<p class="question-explanation">Farbe, Gas, Licht und Wärme sind Hinweise. Beim Schmelzen von Eis bleibt es derselbe Stoff.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Chemische_Reaktion" rel="noopener">Chemische Reaktion (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Woran erkennst du sicher eine chemische Reaktion?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Es entsteht ein neuer Stoff.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Der Stoff wird wärmer.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Der Stoff wechselt den Aggregatzustand.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Es entsteht ein neuer Stoff.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das ist das sichere Merkmal: Die Stoffe haben sich in andere Stoffe verwandelt.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Der Stoff wird wärmer.</strong></p><p>Ein Stoff kann auch wärmer werden, ohne dass er reagiert, zum Beispiel auf einer Heizung.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Der Stoff wechselt den Aggregatzustand.</strong></p><p>Das ist eine Zustandsänderung. Der Stoff bleibt dabei derselbe.</p></li>
</ul>
<p class="question-explanation">Nur ein neuer Stoff zeigt sicher eine Reaktion an. Wärme oder ein Zustandswechsel reichen nicht.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Chemische_Reaktion" rel="noopener">Chemische Reaktion (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche dieser Vorgänge sind chemische Reaktionen?</legend>
<label class="question-option"><input type="checkbox" name="frage-a3" value="0"> <span>Holz verbrennt.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="1"> <span>Wasserstoff verbrennt zu Wasser.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="2"> <span>Eis schmilzt.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="3"> <span>Wasser verdampft.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Holz verbrennt.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Beim Verbrennen entstehen neue Stoffe, zum Beispiel Kohlenstoffdioxid und Asche. Es ist eine chemische Reaktion.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Wasserstoff verbrennt zu Wasser.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Aus Wasserstoff und Sauerstoff wird Wasser, ein neuer Stoff. Es ist eine chemische Reaktion.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Eis schmilzt.</strong></p><p>Geschmolzenes Eis ist weiter Wasser. Es ändert sich nur der Zustand.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Wasser verdampft.</strong></p><p>Wasserdampf ist weiter Wasser. Es ist nur eine Zustandsänderung.</p></li>
</ul>
<p class="question-explanation">Beim Schmelzen und Verdampfen bleibt es derselbe Stoff, nur der Zustand ändert sich. Beim Verbrennen entstehen neue Stoffe.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Chemische_Reaktion" rel="noopener">Chemische Reaktion (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Kerzenwachs wird in einem Topf erwärmt und flüssig. Welche Aussage stimmt?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>Es ist eine Zustandsänderung, das Wachs bleibt Wachs.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>Es ist eine chemische Reaktion, weil das Wachs sich verändert.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>Es ist eine chemische Reaktion, weil Wärme zugeführt wird.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Es ist eine Zustandsänderung, das Wachs bleibt Wachs.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Beim Abkühlen wird es wieder fest. Der Stoff ist derselbe geblieben.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Es ist eine chemische Reaktion, weil das Wachs sich verändert.</strong></p><p>Verändert hat sich nur der Zustand. Es ist kein neuer Stoff entstanden.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Es ist eine chemische Reaktion, weil Wärme zugeführt wird.</strong></p><p>Wärme allein zeigt keine Reaktion an. Entscheidend ist, ob ein neuer Stoff entsteht.</p></li>
</ul>
<p class="question-explanation">Beim Schmelzen bleibt das Wachs dasselbe, nur der Zustand wechselt.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Chemische_Reaktion" rel="noopener">Chemische Reaktion (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>

<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In einem fest verschlossenen Gefäß läuft eine Reaktion ab, bei der ein Gas entsteht. Was zeigt die Waage vorher und nachher?</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>Dieselbe Masse.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>Nachher weniger Masse, weil Gas leichter ist als ein Feststoff.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>Nachher mehr Masse, weil ein neuer Stoff entstanden ist.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Dieselbe Masse.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das Gas kann nicht entweichen. Alle Stoffe bleiben auf der Waage.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Nachher weniger Masse, weil Gas leichter ist als ein Feststoff.</strong></p><p>Auch ein Gas hat Masse. Solange es im Gefäß bleibt, wird es mitgewogen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Nachher mehr Masse, weil ein neuer Stoff entstanden ist.</strong></p><p>Ein neuer Stoff bedeutet nicht mehr Masse. Aus den alten Stoffen wird nur Neues zusammengesetzt.</p></li>
</ul>
<p class="question-explanation">Im geschlossenen Gefäß bleibt die Gesamtmasse gleich.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Massenerhaltungssatz" rel="noopener">Massenerhaltungssatz (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">3 g Magnesium verbrennen mit 2 g Sauerstoff vollständig zu Magnesiumoxid. Wie viel Gramm Magnesiumoxid entstehen?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a6" aria-describedby="frage-a6-unit"> <span id="frage-a6-unit">g</span> </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 5 g</p>
<p class="question-explanation">Die Gesamtmasse bleibt gleich. Vorher 3 g + 2 g = 5 g, also entstehen 5 g Magnesiumoxid.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Massenerhaltungssatz" rel="noopener">Massenerhaltungssatz (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="question" id="frage-a7" data-id="a7" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Zahl gehört an die Stelle von x? x H₂ + O₂ → 2H₂O</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a7">  </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 2</p>
<p class="question-explanation">Rechts stehen 2 · 2 = 4 Wasserstoffatome. Links braucht man deshalb 2 Teilchen H₂.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Reaktionsgleichung" rel="noopener">Reaktionsgleichung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="question" id="frage-a8" data-id="a8" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Zahl gehört an die Stelle von x? CH₄ + x O₂ → CO₂ + 2H₂O</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a8">  </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 2</p>
<p class="question-explanation">Rechts stehen 2 + 2 = 4 Sauerstoffatome. Mit 2 Teilchen O₂ sind es links ebenfalls 4.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Reaktionsgleichung" rel="noopener">Reaktionsgleichung (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

"},{"text":"Der Stoff wird wärmer.","correct":false,"info":"Ein Stoff kann auch wärmer werden, ohne dass er reagiert, zum Beispiel auf einer Heizung."},{"text":"Der Stoff wechselt den Aggregatzustand.","correct":false,"info":"Das ist eine Zustandsänderung. Der Stoff bleibt dabei derselbe."}]},"rendered":{}}},{"key":"a3","ref":"/reaktionen/zustandsaenderung/#vorgang-art","page":"reaktionen/zustandsaenderung/","exercise":"vorgang-art","step":0,"data":{"kind":"question","lang":"de","question":{"id":"a3","text":"Welche dieser Vorgänge sind chemische Reaktionen?","explanation":"Beim Schmelzen und Verdampfen bleibt es derselbe Stoff, nur der Zustand ändert sich. Beim Verbrennen entstehen neue Stoffe.","links":[{"title":"Chemische Reaktion (Wikipedia)","url":"https://de.wikipedia.org/wiki/Chemische_Reaktion"}],"type":"multiple-choice","options":[{"text":"Holz verbrennt.","correct":true,"info":"Beim Verbrennen entstehen neue Stoffe, zum Beispiel Kohlenstoffdioxid und Asche. Es ist eine chemische Reaktion."},{"text":"Wasserstoff verbrennt zu Wasser.","correct":true,"info":"Aus Wasserstoff und Sauerstoff wird Wasser, ein neuer Stoff. Es ist eine chemische Reaktion."},{"text":"Eis schmilzt.","correct":false,"info":"Geschmolzenes Eis ist weiter Wasser. Es ändert sich nur der Zustand."},{"text":"Wasser verdampft.","correct":false,"info":"Wasserdampf ist weiter Wasser. Es ist nur eine Zustandsänderung."}]},"rendered":{}}},{"key":"a4","ref":"/reaktionen/zustandsaenderung/#kerzenwachs","page":"reaktionen/zustandsaenderung/","exercise":"kerzenwachs","step":0,"data":{"kind":"question","lang":"de","question":{"id":"a4","text":"Kerzenwachs wird in einem Topf erwärmt und flüssig. Welche Aussage stimmt?","explanation":"Beim Schmelzen bleibt das Wachs dasselbe, nur der Zustand wechselt.","links":[{"title":"Chemische Reaktion (Wikipedia)","url":"https://de.wikipedia.org/wiki/Chemische_Reaktion"}],"type":"single-choice","options":[{"text":"Es ist eine Zustandsänderung, das Wachs bleibt Wachs.","correct":true,"info":"Beim Abkühlen wird es wieder fest. Der Stoff ist derselbe geblieben."},{"text":"Es ist eine chemische Reaktion, weil das Wachs sich verändert.","correct":false,"info":"Verändert hat sich nur der Zustand. Es ist kein neuer Stoff entstanden."},{"text":"Es ist eine chemische Reaktion, weil Wärme zugeführt wird.","correct":false,"info":"Wärme allein zeigt keine Reaktion an. Entscheidend ist, ob ein neuer Stoff entsteht."}]},"rendered":{}}},{"key":"a5","ref":"/reaktionen/massenerhaltung/#waage-geschlossen","page":"reaktionen/massenerhaltung/","exercise":"waage-geschlossen","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a5","text":"In einem fest verschlossenen Gefäß läuft eine Reaktion ab, bei der ein Gas entsteht. Was zeigt die Waage vorher und nachher?","explanation":"Im geschlossenen Gefäß bleibt die Gesamtmasse gleich.","links":[{"title":"Massenerhaltungssatz (Wikipedia)","url":"https://de.wikipedia.org/wiki/Massenerhaltungssatz"}],"type":"single-choice","options":[{"text":"Dieselbe Masse.","correct":true,"info":"Das Gas kann nicht entweichen. Alle Stoffe bleiben auf der Waage."},{"text":"Nachher weniger Masse, weil Gas leichter ist als ein Feststoff.","correct":false,"info":"Auch ein Gas hat Masse. Solange es im Gefäß bleibt, wird es mitgewogen."},{"text":"Nachher mehr Masse, weil ein neuer Stoff entstanden ist.","correct":false,"info":"Ein neuer Stoff bedeutet nicht mehr Masse. Aus den alten Stoffen wird nur Neues zusammengesetzt."}]},"rendered":{}}},{"key":"a6","ref":"/reaktionen/massenerhaltung/#masse-magnesium","page":"reaktionen/massenerhaltung/","exercise":"masse-magnesium","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a6","text":"3 g Magnesium verbrennen mit 2 g Sauerstoff vollständig zu Magnesiumoxid. Wie viel Gramm Magnesiumoxid entstehen?","explanation":"Die Gesamtmasse bleibt gleich. Vorher 3 g + 2 g = 5 g, also entstehen 5 g Magnesiumoxid.","links":[{"title":"Massenerhaltungssatz (Wikipedia)","url":"https://de.wikipedia.org/wiki/Massenerhaltungssatz"}],"type":"number","answer":5,"tolerance":0,"unit":"g","mistakes":[{"answer":3,"message":"Das ist nur die Masse des Magnesiums. Der Sauerstoff steckt im Magnesiumoxid mit drin."}]},"rendered":{}}},{"key":"a7","ref":"/reaktionen/reaktionsgleichungen/#koeffizient-wasser","page":"reaktionen/reaktionsgleichungen/","exercise":"koeffizient-wasser","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a7","text":"Welche Zahl gehört an die Stelle von x? x H₂ + O₂ → 2H₂O","explanation":"Rechts stehen 2 · 2 = 4 Wasserstoffatome. Links braucht man deshalb 2 Teilchen H₂.","links":[{"title":"Reaktionsgleichung (Wikipedia)","url":"https://de.wikipedia.org/wiki/Reaktionsgleichung"}],"type":"number","answer":2,"tolerance":0,"mistakes":[{"answer":1,"message":"Dann stünden links nur 2 Wasserstoffatome, rechts aber 4 (2 · 2)."}]},"rendered":{}}},{"key":"a8","ref":"/reaktionen/reaktionsgleichungen/#koeffizient-methan","page":"reaktionen/reaktionsgleichungen/","exercise":"koeffizient-methan","step":1,"data":{"kind":"question","lang":"de","question":{"id":"a8","text":"Welche Zahl gehört an die Stelle von x? CH₄ + x O₂ → CO₂ + 2H₂O","explanation":"Rechts stehen 2 + 2 = 4 Sauerstoffatome. Mit 2 Teilchen O₂ sind es links ebenfalls 4.","links":[{"title":"Reaktionsgleichung (Wikipedia)","url":"https://de.wikipedia.org/wiki/Reaktionsgleichung"}],"type":"number","answer":2,"tolerance":0,"mistakes":[{"answer":1,"message":"Dann wären links nur 2 Sauerstoffatome, rechts aber 4 (2 in CO₂ und 2 im Wasser)."}]},"rendered":{}}}],"pages":[{"page":"reaktionen/reaktionen/","title":"Woran du eine Reaktion erkennst","href":"../reaktionen/reaktionen/"},{"page":"reaktionen/zustandsaenderung/","title":"Reaktion oder Zustandsänderung?","href":"../reaktionen/zustandsaenderung/"},{"page":"reaktionen/massenerhaltung/","title":"Die Masse bleibt gleich","href":"../reaktionen/massenerhaltung/"},{"page":"reaktionen/reaktionsgleichungen/","title":"R
