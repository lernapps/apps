<h2 id="teil-1" tabindex="-1">Page 1 of 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Task 1</p><div class="question" id="frage-a1" data-id="a1" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Which observations can hint at a chemical reaction?</legend>
<label class="question-option"><input type="checkbox" name="frage-a1" value="0"> <span>A solid turns black when heated.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="1"> <span>Gas bubbles rise when two liquids are mixed.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="2"> <span>A piece of metal glows brightly and gives off heat.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a1" value="3"> <span>A piece of ice lies on the table and gets smaller.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>A solid turns black when heated.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>A new colour can mean a new substance. It is a hint, but not proof yet.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Gas bubbles rise when two liquids are mixed.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>A new gas can be formed in a reaction. A hint at a new substance.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>A piece of metal glows brightly and gives off heat.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Light and heat often show a reaction, for example when burning.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>A piece of ice lies on the table and gets smaller.</strong></p><p>The ice melts. It stays water; no new substance is formed.</p></li>
</ul>
<p class="question-explanation">Colour, gas, light and heat are hints. When ice melts, it stays the same substance.</p>
<p class="question-more">More on it:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Chemische_Reaktion" rel="noopener">Chemical reaction (Wikipedia, German)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Task 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">How can you be sure that a chemical reaction has taken place?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>A new substance is formed.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>The substance gets warmer.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>The substance changes its state of matter.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>A new substance is formed.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>That is the certain sign: the substances have turned into other substances.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>The substance gets warmer.</strong></p><p>A substance can also get warmer without reacting, for example on a radiator.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>The substance changes its state of matter.</strong></p><p>That is a change of state. The substance stays the same.</p></li>
</ul>
<p class="question-explanation">Only a new substance shows a reaction for sure. Heat or a change of state is not enough.</p>
<p class="question-more">More on it:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Chemische_Reaktion" rel="noopener">Chemical reaction (Wikipedia, German)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Task 3</p><div class="question" id="frage-a3" data-id="a3" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Which of these processes are chemical reactions?</legend>
<label class="question-option"><input type="checkbox" name="frage-a3" value="0"> <span>Wood burns.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="1"> <span>Hydrogen burns to water.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="2"> <span>Ice melts.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="3"> <span>Water evaporates.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Wood burns.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Burning forms new substances, for example carbon dioxide and ash. It is a chemical reaction.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Hydrogen burns to water.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Hydrogen and oxygen become water, a new substance. It is a chemical reaction.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Ice melts.</strong></p><p>Melted ice is still water. Only the state changes.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>Water evaporates.</strong></p><p>Water vapour is still water. It is only a change of state.</p></li>
</ul>
<p class="question-explanation">When melting and evaporating the substance stays the same, only the state changes. When burning, new substances are formed.</p>
<p class="question-more">More on it:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Chemische_Reaktion" rel="noopener">Chemical reaction (Wikipedia, German)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Task 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Candle wax is warmed in a pot and becomes liquid. Which statement is right?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>It is a change of state; the wax stays wax.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>It is a chemical reaction because the wax changes.</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>It is a chemical reaction because heat is supplied.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>It is a change of state; the wax stays wax.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>When it cools it becomes solid again. The substance has stayed the same.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>It is a chemical reaction because the wax changes.</strong></p><p>Only the state has changed. No new substance was formed.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>It is a chemical reaction because heat is supplied.</strong></p><p>Heat alone does not show a reaction. What counts is whether a new substance is formed.</p></li>
</ul>
<p class="question-explanation">When melting, the wax stays the same; only the state changes.</p>
<p class="question-more">More on it:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Chemische_Reaktion" rel="noopener">Chemical reaction (Wikipedia, German)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>

<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Page 2 of 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Task 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">A reaction that forms a gas takes place in a tightly closed vessel. What does the balance show before and after?</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>The same mass.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>Less mass afterwards, because gas is lighter than a solid.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>More mass afterwards, because a new substance was formed.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>The same mass.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>The gas cannot escape. All substances stay on the balance.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Less mass afterwards, because gas is lighter than a solid.</strong></p><p>A gas has mass too. As long as it stays in the vessel, it is weighed.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>More mass afterwards, because a new substance was formed.</strong></p><p>A new substance does not mean more mass. The old substances are only put together anew.</p></li>
</ul>
<p class="question-explanation">In a closed vessel the total mass stays the same.</p>
<p class="question-more">More on it:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Massenerhaltungssatz" rel="noopener">Law of conservation of mass (Wikipedia, German)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Task 6</p><div class="question" id="frage-a6" data-id="a6" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">3 g of magnesium burn completely with 2 g of oxygen to magnesium oxide. How many grams of magnesium oxide are formed?</legend>
<label class="question-number">Your answer <input type="text" inputmode="decimal" autocomplete="off" name="frage-a6" aria-describedby="frage-a6-unit"> <span id="frage-a6-unit">g</span> </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> 5 g</p>
<p class="question-explanation">The total mass stays the same. Before, 3 g + 2 g = 5 g, so 5 g of magnesium oxide are formed.</p>
<p class="question-more">More on it:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Massenerhaltungssatz" rel="noopener">Law of conservation of mass (Wikipedia, German)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Task 7</p><div class="question" id="frage-a7" data-id="a7" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Which number belongs in place of x? x H₂ + O₂ → 2H₂O</legend>
<label class="question-number">Your answer <input type="text" inputmode="decimal" autocomplete="off" name="frage-a7">  </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> 2</p>
<p class="question-explanation">On the right there are 2 · 2 = 4 hydrogen atoms. So you need 2 particles of H₂ on the left.</p>
<p class="question-more">More on it:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Reaktionsgleichung" rel="noopener">Reaction equation (Wikipedia, German)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Task 8</p><div class="question" id="frage-a8" data-id="a8" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Which number belongs in place of x? CH₄ + x O₂ → CO₂ + 2H₂O</legend>
<label class="question-number">Your answer <input type="text" inputmode="decimal" autocomplete="off" name="frage-a8">  </label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> 2</p>
<p class="question-explanation">On the right there are 2 + 2 = 4 oxygen atoms. With 2 particles of O₂ there are also 4 on the left.</p>
<p class="question-more">More on it:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Reaktionsgleichung" rel="noopener">Reaction equation (Wikipedia, German)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>
