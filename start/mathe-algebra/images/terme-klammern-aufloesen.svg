<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-label="3(x + 4) = 3x + 12. Zwei Teilflächen: jedes Mal Höhe mal Breite. 3(x − 2) = 3x − 6. Von 3 · x wird der gestrichelte Streifen abgezogen."><style>
