<!-- Hardware und Software (lernapps/informatik-computer, #490), eigene Zeichnung, CC-BY-4.0. Links ein Tablet mit
     Teilen zum Anfassen, rechts eine Wolke mit App-Symbolen (Software). Kein Text im Bild. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img">
  <title>Links ein Tablet zum Anfassen, rechts eine Wolke mit drei App-Symbolen, dazwischen zwei Pfeile</title>
  <rect width="480" height="280" fill="#ffffff"/>
  <!-- Tablet -->
  <rect x="30" y="40" width="160" height="210" rx="16" fill="#e6e6e6" stroke="#2b5d8a" stroke-width="6"/>
  <rect x="46" y="64" width="128" height="162" rx="4" fill="#cfe6f7" stroke="#2b5d8a" stroke-width="2"/>
  <circle cx="110" cy="52" r="5" fill="#333"/>
  <!-- Hand, die das Tablet hält -->
  <path d="M18 180 q-6 30 14 46 l14 -8 q-12 -18 -6 -42 z" fill="#f3d2b3" stroke="#333" stroke-width="2"/>
  <!-- Pfeile in beide Richtungen -->
  <g stroke="#333" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M205 125h60"/><path d="M255 115l10 10l-10 10"/>
    <path d="M265 165h-60"/><path d="M215 155l-10 10l10 10"/>
  </g>
  <!-- Wolke -->
  <path d="M300 200 q-36 0 -36 -32 q0 -30 34 -32 q6 -40 50 -38 q36 0 46 30 q38 2 38 36 q0 36 -40 36 z" fill="#f4efe2" stroke="#7b4fb8" stroke-width="3" stroke-dasharray="8 5"/>
  <!-- App-Symbole: Pinsel, Note, Kamera -->
  <rect x="296" y="140" width="40" height="40" rx="9" fill="#e07b24" stroke="#333" stroke-width="2"/>
  <path d="M306 172 l16 -22 l6 4 l-16 22 z" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="348" y="110" width="40" height="40" rx="9" fill="#2f5fb3" stroke="#333" stroke-width="2"/>
  <path d="M362 140 v-20 l14 -4 v20" fill="none" stroke="#ffffff" stroke-width="3"/><circle cx="359" cy="140" r="4" fill="#ffffff"/><circle cx="373" cy="136" r="4" fill="#ffffff"/>
  <rect x="396" y="148" width="40" height="40" rx="9" fill="#2e8b57" stroke="#333" stroke-width="2"/>
  <rect x="404" y="160" width="24" height="18" rx="3" fill="#ffffff" stroke="#333" stroke-width="1.5"/><circle cx="416" cy="169" r="5" fill="#2e8b57"/>
</svg>
