<fieldset>
<legend class="question-text">Selin wants to bring the sun from an old picture into the poster. Both pictures are already open. In which order does she do it?</legend>
<p class="question-hint">Give each entry its place: 1 for the first.</p>
<ul class="question-pairs">
<li><label><span>Select the sun in the old picture</span> <select name="frage-a7-0" data-item="0"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
<li><label><span>Choose copy</span> <select name="frage-a7-1" data-item="1"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
<li><label><span>Save the poster</span> <select name="frage-a7-4" data-item="4"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
<li><label><span>Switch to the poster</span> <select name="frage-a7-2" data-item="2"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
<li><label><span>Choose paste</span> <select name="frage-a7-3" data-item="3"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>

<p class="question-explanation">First select, then copy. You can only paste once you are in the poster. Saving comes last so nothing gets lost.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>

<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
