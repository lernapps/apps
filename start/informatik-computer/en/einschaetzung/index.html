<li class="explainer-assessment-item" data-key="a15"><p class="explainer-assessment-label">Task 15</p><div class="question" id="frage-a15" data-id="a15" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">On the tablet you tap a picture and it gets bigger. Which boxes does the touchscreen belong to?</legend>
<label class="question-option"><input type="radio" name="frage-a15" value="0"> <span>Only input</span></label>
<label class="question-option"><input type="radio" name="frage-a15" value="1"> <span>Only output</span></label>
<label class="question-option"><input type="radio" name="frage-a15" value="2"> <span>Both input and output</span></label>
<label class="question-option"><input type="radio" name="frage-a15" value="3"> <span>The process box</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Only input</strong></p><p>Your tap does go in. But afterwards the touchscreen also shows you the big picture.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Only output</strong></p><p>The touchscreen shows pictures. But it also notices where your finger taps.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>Both input and output</strong> <span class="question-badge question-badge-right">right answer</span></p><p>The touchscreen takes in your tap and shows the result. It is two devices in one.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>The process box</strong></p><p>The calculating happens in the processor inside the tablet, not in the screen.</p></li>
</ul>
<p class="question-explanation">A touchscreen is an input device and an output device at the same time.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
