<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../alltag/">Überall Informatiksysteme</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 9 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Selin schreibt Schilder für die Tische. Was macht der Computer in jedem Gerät?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Kasse</span> <select name="frage-a3-0" data-left="0"><option value="">bitte wählen</option><option value="2">steuert Wasser und Zeit</option><option value="4">macht Licht, solange der Schalter an ist</option><option value="0">zählt die Preise zusammen</option><option value="3">bewegt die Figuren im Spiel</option><option value="1">zählt deine Schritte</option></select></label></li>
<li><label><span>Smartwatch</span> <select name="frage-a3-1" data-left="1"><option value="">bitte wählen</option><option value="2">steuert Wasser und Zeit</option><option value="4">macht Licht, solange der Schalter an ist</option><option value="0">zählt die Preise zusammen</option><option value="3">bewegt die Figuren im Spiel</option><option value="1">zählt deine Schritte</option></select></label></li>
<li><label><span>Waschmaschine</span> <select name="frage-a3-2" data-left="2"><option value="">bitte wählen</option><option value="2">steuert Wasser und Zeit</option><option value="4">macht Licht, solange der Schalter an ist</option><option value="0">zählt die Preise zusammen</option><option value="3">bewegt die Figuren im Spiel</option><option value="1">zählt deine Schritte</option></select></label></li>
<li><label><span>Spielkonsole</span> <select name="frage-a3-3" data-left="3"><option value="">bitte wählen</option><option value="2">steuert Wasser und Zeit</option><option value="4">macht Licht, solange der Schalter an ist</option><option value="0">zählt die Preise zusammen</option><option value="3">bewegt die Figuren im Spiel</option><option value="1">zählt deine Schritte</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Kasse – zählt die Preise zusammen; Smartwatch – zählt deine Schritte; Waschmaschine – steuert Wasser und Zeit; Spielkonsole – bewegt die Figuren im Spiel</p>
<p class="question-explanation">Jedes dieser Geräte hat einen Computer mit einer eigenen Aufgabe. Licht machen kann auch eine einfache Taschenlampe ohne Computer.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>

<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Zu welcher Hardware passt welche App?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Kamera</span> <select name="frage-a6-0" data-left="0"><option value="">bitte wählen</option><option value="3">Wetter-App</option><option value="2">Sprachaufnahme-App</option><option value="1">Musik-App</option><option value="0">Kamera-App</option></select></label></li>
<li><label><span>Lautsprecher</span> <select name="frage-a6-1" data-left="1"><option value="">bitte wählen</option><option value="3">Wetter-App</option><option value="2">Sprachaufnahme-App</option><option value="1">Musik-App</option><option value="0">Kamera-App</option></select></label></li>
<li><label><span>Mikrofon</span> <select name="frage-a6-2" data-left="2"><option value="">bitte wählen</option><option value="3">Wetter-App</option><option value="2">Sprachaufnahme-App</option><option value="1">Musik-App</option><option value="0">Kamera-App</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Kamera – Kamera-App; Lautsprecher – Musik-App; Mikrofon – Sprachaufnahme-App</p>
<p class="question-explanation">Jede App braucht ein Stück Hardware, mit dem sie arbeitet: die Kamera-App die Kamera, Musik den Lautsprecher, Aufnahmen das Mikrofon. Die Wetter-App braucht vor allem den Bildschirm.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

</section>
<section class="explainer-assessment-step" data-step="2" aria-labelledby="teil-3" hidden>
<h2 id="teil-3" tabindex="-1">Seite 3 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="question" id="frage-a7" data-id="a7" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Selin will die Sonne aus einem alten Bild ins Plakat holen. Beide Bilder sind schon offen. In welcher Reihenfolge geht sie vor?</legend>
<p class="question-hint">Gib jedem Eintrag seinen Platz: 1 für den ersten.</p>
<ul class="question-pairs">
<li><label><span>Im alten Bild die Sonne markieren</span> <select name="frage-a7-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Kopieren wählen</span> <select name="frage-a7-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Das Plakat speichern</span> <select name="frage-a7-4" data-item="4"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Zum Plakat wechseln</span> <select name="frage-a7-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Einfügen wählen</span> <select name="frage-a7-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 1. Im alten Bild die Sonne markieren, 2. Kopieren wählen, 3. Zum Plakat wechseln, 4. Einfügen wählen, 5. Das Plakat speichern</p>
<p class="question-explanation">Erst markieren, dann kopieren. Einfügen geht erst im Plakat. Speichern kommt zum Schluss, damit nichts verloren geht.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>

<fieldset>

<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">

<li><label><span>Speichern</span> <select name="frage-a8-5" data-left="5"><option value="">bitte wählen</option><option value="6">Das Bild wird auf Papier gedruckt.</option><option value="2">Das Markierte verschwindet und kommt in die Zwischenablage.</option><option value="1">Was in der Zwischenablage liegt, kommt ins Bild.</option><option value="0">Eine Kopie kommt in die Zwischenablage.</option><option value="4">Der letzte Schritt wird zurückgenommen.</option><option value="5">Das Bild bleibt auch nach dem Schließen erhalten.</option><option value="3">Ein gespeichertes Bild kommt zurück auf den Bildschirm.</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Kopieren – Eine Kopie kommt in die Zwischenablage.; Einfügen – Was in der Zwischenablage liegt, kommt ins Bild.; Ausschneiden – Das Markierte verschwindet und kommt in die Zwischenablage.; Öffnen – Ein gespeichertes Bild kommt zurück auf den Bildschirm.; Rückgängig – Der letzte Schritt wird zurückgenommen.; Speichern – Das Bild bleibt auch nach dem Schließen erhalten.</p>

</div></li>
