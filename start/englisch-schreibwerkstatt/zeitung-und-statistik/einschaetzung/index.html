ight":"Zahl (Information)"},{"left":"“We want more visitors,” said the manager.","right":"Zitat (Information)"},{"left":"The museum is boring.","right":"Wertung (Meinung)"},{"left":"The museum must open on Mondays.","right":"Forderung (Meinung)"}]},"rendered":{}}},{"key":"a5","ref":"/zeitung-und-statistik/diagramm-beschreiben/#diagramm-lesen","page":"zeitung-und-statistik/diagramm-beschreiben/","exercise":"diagramm-lesen","step":2,"data":{"kind":"question","lang":"de","question":{"id":"a5","text":"Welcher Satz beschreibt das Balkendiagramm richtig?","explanation":"Gaming steht an vierter Stelle, hinter drei längeren Balken.","links":[],"material":[{"type":"figure","image":"images/diagramm-freizeit.svg","alt":"Balkendiagramm mit fünf waagerechten Balken. Die Skala unten geht von null bis achtzig Prozent. Neben jedem Balken steht ein Wert.","caption":"Vergleiche die Länge der Balken.","source":"eigene Zeichnung","licence":"CC-BY-4.0"}],"type":"single-choice","options":[{"text":"Gaming is the fourth most popular activity","correct":true,"info":"Drei Balken sind länger als der von Gaming, ein Balken ist kürzer."},{"text":"Gaming is the most popular activity","correct":false,"info":"Der längste Balken gehört zu einer anderen Tätigkeit. Gaming liegt im unteren Bereich, an vierter Stelle von fünf."},{"text":"Gaming is as popular as sport","correct":false,"info":"Der Balken von Sport ist länger als der von Gaming, die Werte sind nicht gleich."},{"text":"Gaming is less popular than reading","correct":false,"info":"Der Balken von Reading ist der kürzeste. Gaming ist beliebter als Reading."}]},"rendered":{}}},{"key":"a6","ref":"/zeitung-und-statistik/diagramm-beschreiben/#diagramm-luecke","page":"zeitung-und-statistik/diagramm-beschreiben/","exercise":"diagramm-luecke","step":2,"data":{"kind":"language","lang":"de","id":"a6","mode":"gap","answerLang":"en","form":{"case":"ok","punctuation":"ok"},"units":[{"answer":"Visits rose [by] 30,000 in 2023.","prompt":{"kind":"text","text
