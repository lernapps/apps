"ref":"/bewerben/bewerbung/#bewerbung-ordnen","page":"bewerben/bewerbung/","exercise":"bewerbung-ordnen","step":4,"data":{"kind":"question","lang":"de","question":{"id":"a9","text":"Eine Bewerbung um einen Job im Café ist durcheinander. Bringe die Teile in die Reihenfolge des Bauplans.","explanation":"Anrede, Anlass, Eignung, Bezug zur Stelle, Schluss und Gruß, in dieser Reihenfolge.","links":[],"hint":"Die Anrede kommt zuerst und der Gruß zuletzt. Dazwischen: erst der Grund des Briefs, dann Eignung und Bezug zur Stelle, zuletzt der Schluss.","type":"ordering","items":["Dear Ms Clarke,","I am writing to apply for the job of café helper.","I am friendly, and I have helped at a school cake sale.","Your advertisement asks for someone who can work on Saturdays, and I can do that.","I would be happy to come for an interview.","Yours sincerely,"]},"rendered":{}}},{"key":"a10","ref":"/bewerben/bewerbung/#bewerbung-zuordnen","page":"bewerben/bewerbung/","exercise":"bewerbung-zuordnen","step":4,"data":{"kind":"question","lang":"de","question":{"id":"a10","text":"Zu welchem Teil der Bewerbung gehört der Satz?","explanation":"Der Anlass nennt die Stelle, die Eignung eine Eigenschaft mit Beispiel, der Bezug greift die Anzeige auf, der Schluss schließt höflich ab. Den Lebenslauf wiederholst du nicht.","links":[],"type":"matching","pairs":[{"left":"I am applying for the holiday job at your shop.","right":"Anlass"},{"left":"I am good at talking to people, and I helped at a book sale last year.","right":"Eignung"},{"left":"You want someone who knows about stories, and I read every week.","right":"Bezug zur Stelle"},{"left":"I look forward to hearing from you.","right":"Schluss"}],"distractors":["Wiederholung des Lebenslaufs"]},"rendered":{}}},{"key":"a11","ref":"/bewerben/vorstellungsgespraech/#vorstellungsgespraech-zuordnen","page":"bewerben/vorstellungsgespraech/","exercise":"vorstellungsgespraech-zuordnen","step":5,"data":{"kind":"question","lang":"de","question":{"id":"a11","text":"Welche Antwort passt zu welcher Frage?","explanation":"Jede Antwort sagt mehr als ein Wort und passt zur Frage. Das einzelne „Yes“ passt zu keiner dieser Fragen, weil es nichts über dich sagt.","links":[],"type":"matching","pairs":[{"left":"Why do you want this job?","right":"Because I enjoy sport and I like helping visitors"},{"left":"Tell me about a time when you worked in a team.","right":"Last year my class made a poster together"},{"left":"What are your strengths?","right":"I am patient, and I stay calm when it is busy"},{"left":"Do you have any questions for us?","right":"Yes, will I have a break during the day"}],"distractors":["Yes"]},"rendered":{}}},{"key":"a12","ref":"/bewerben/vorstellungsgespraech/#vorstellungsgespraech-antwort","page":"bewerben/vorstellungsgespraech/","exercise":"vorstellungsgespraech-antwort","step":5,"data":{"kind":"question","lang":"de","question":{"id":"a12","text":"Mr Anderson fragt: „Do you work well in a team?“ Welche Antwort ist am besten?","explanation":"Eine gute Antwort hat drei Schritte und klingt freundlich, ohne Slang.","links":[],"type":"single-choice","options":[{"text":"Yes, I am the best team player you will ever meet, and I never have problems with other people","correct":false,"info":"Das ist nur eine Aussage. Es fehlt ein Beispiel, das sie zeigt."},{"text":"Yes, I do. Last year I helped to plan a sports day, and teamwork is important in a busy library","correct":true,"info":"Aussage, Beispiel und Bezug zur Stelle: alle drei Schritte sind da."},{"text":"Yeah, sure, I get on with everybody in my class, no problem at all","correct":false,"info":"Yeah und no problem klingen zu locker, und ein Beispiel fehlt."},{"text":"Yes","correct":false,"info":"Eine Ein-Wort-Antwort sagt nichts über dich. Der Arbeitgeber möchte ein Beispiel hören."}]},"rendered":{}}}],"pages":[{"page":"bewerben/berufswelt/","title":"Berufe und Ferienjobs","href":"../../bewerben/berufswelt/"},{"page":"bewerben/bildungssystem/","title":"Schulsyste
