<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 368" role="img" aria-labelledby="t d">
<title id="t">Bauplan für ein Interview</title>
<desc id="d">Vier Kästen untereinander: Vorbereitung, Einstieg, Fragen und Antworten, Dank.</desc>
<rect width="480" height="368" fill="#f4efe2"/>
<rect x="30" y="12" width="420" height="44" rx="10" fill="#e8dfc8" stroke="#8a7f6a" stroke-width="2"/>
<text x="46" y="40" font-family="sans-serif" font-size="16" fill="#3d382d">Vorher: Thema wählen, Fragen sammeln</text>
<rect x="30" y="68" width="420" height="62" rx="10" fill="#6a4c93"/>
<text x="46" y="96" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Einstieg (introduction)</text>
<text x="46" y="120" font-family="sans-serif" font-size="16" fill="#fff">Thema und Gast vorstellen</text>
<rect x="30" y="142" width="420" height="104" rx="10" fill="#1b7f8a"/>
<text x="46" y="170" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Fragen und Antworten (main part)</text>
<rect x="46" y="182" width="388" height="28" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="58" y="202" font-family="sans-serif" font-size="16" fill="#12545c">Q: eine offene Frage</text>
<rect x="46" y="214" width="388" height="28" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="58" y="234" font-family="sans-serif" font-size="16" fill="#12545c">A: die Antwort des Gastes</text>
<rect x="30" y="258" width="420" height="62" rx="10" fill="#b5651d"/>
<text x="46" y="286" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Dank (conclusion)</text>
<text x="46" y="310" font-family="sans-serif" font-size="16" fill="#fff">sich beim Gast bedanken</text>
</svg>
