<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 430" role="img" aria-labelledby="t d">
<title id="t">Schulsysteme im Vergleich</title>
<desc id="d">Drei Kästen untereinander: England, USA und Deutschland, jeweils mit drei Stufen.</desc>
<rect width="480" height="430" fill="#f4efe2"/>
<rect x="20" y="10" width="440" height="116" rx="10" fill="#9b2d3a"/>
<text x="36" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">England</text>
<rect x="36" y="42" width="408" height="24" rx="6" fill="#fff" fill-opacity="0.92"/>
<text x="48" y="60" font-family="sans-serif" font-size="16" fill="#5a1a22">Primary school: Key Stage 1 and 2</text>
<rect x="36" y="70" width="408" height="24" rx="6" fill="#fff" fill-opacity="0.92"/>
<text x="48" y="88" font-family="sans-serif" font-size="16" fill="#5a1a22">Secondary school: Key Stage 3 and 4</text>
<rect x="36" y="98" width="408" height="24" rx="6" fill="#fff" fill-opacity="0.92"/>
<text x="48" y="116" font-family="sans-serif" font-size="16" fill="#5a1a22">Sixth form: A-levels</text>
<rect x="20" y="138" width="440" height="116" rx="10" fill="#2e6a3a"/>
<text x="36" y="162" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">USA</text>
<rect x="36" y="170" width="408" height="24" rx="6" fill="#fff" fill-opacity="0.92"/>
<text x="48" y="188" font-family="sans-serif" font-size="16" fill="#173a1e">Middle school</text>
<rect x="36" y="198" width="408" height="24" rx="6" fill="#fff" fill-opacity="0.92"/>
<text x="48" y="216" font-family="sans-serif" font-size="16" fill="#173a1e">High school</text>
<rect x="36" y="226" width="408" height="24" rx="6" fill="#fff" fill-opacity="0.92"/>
<text x="48" y="244" font-family="sans-serif" font-size="16" fill="#173a1e">Grades 9, 10, 11, 12</text>
<rect x="20" y="266" width="440" height="116" rx="10" fill="#4a4a4a"/>
<text x="36" y="290" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Deutschland</text>
<rect x="36" y="298" width="408" height="24" rx="6" fill="#fff" fill-opacity="0.92"/>
<text x="48" y="316" font-family="sans-serif" font-size="16" fill="#222">Grundschule</text>
<rect x="36" y="326" width="408" height="24" rx="6" fill="#fff" fill-opacity="0.92"/>
<text x="48" y="344" font-family="sans-serif" font-size="16" fill="#222">Weiterführende Schule</text>
<rect x="36" y="354" width="408" height="24" rx="6" fill="#fff" fill-opacity="0.92"/>
<text x="48" y="372" font-family="sans-serif" font-size="16" fill="#222">Abitur oder anderer Abschluss</text>
</svg>
