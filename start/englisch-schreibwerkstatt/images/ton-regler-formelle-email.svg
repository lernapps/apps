<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" role="img" aria-labelledby="t d">
<title id="t">Ton-Regler</title>
<desc id="d">Ein Balken von informal über neutral bis formal. Der Knopf steht ganz rechts bei formal.</desc>
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#d9822b"/><stop offset="0.5" stop-color="#7f8c8d"/><stop offset="1" stop-color="#2c3e75"/></linearGradient></defs>
<rect width="480" height="190" fill="#f4efe2"/>
<text x="30" y="40" font-family="sans-serif" font-size="18" font-weight="bold" fill="#a85e12">informal</text>
<text x="240" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#5d6a6b">neutral</text>
<text x="450" y="40" text-anchor="end" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2c3e75">formal</text>
<rect x="30" y="58" width="420" height="24" rx="12" fill="url(#g)"/>
<circle cx="426" cy="70" r="20" fill="#fff" stroke="#2c3e75" stroke-width="4"/>
<text x="30" y="124" font-family="sans-serif" font-size="16" fill="#2b2b2b">Chat unter Freunden</text>
<text x="450" y="124" text-anchor="end" font-family="sans-serif" font-size="16" fill="#2b2b2b">Anfrage an eine Stelle</text>
</svg>
