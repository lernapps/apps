<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 356" role="img" aria-labelledby="t d">
<title id="t">Bauplan für einen Sachtext</title>
<desc id="d">Drei Kästen untereinander: Einleitung, Hauptteil mit drei Absätzen, Schluss.</desc>
<rect width="480" height="356" fill="#f4efe2"/>
<rect x="30" y="16" width="420" height="64" rx="10" fill="#6a4c93"/>
<text x="46" y="44" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Einleitung (introduction)</text>
<text x="46" y="68" font-family="sans-serif" font-size="16" fill="#fff">Thema und Absicht, 1 bis 2 Sätze</text>
<rect x="30" y="94" width="420" height="140" rx="10" fill="#1b7f8a"/>
<text x="46" y="122" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Hauptteil (main part)</text>
<rect x="46" y="134" width="388" height="28" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="58" y="154" font-family="sans-serif" font-size="16" fill="#12545c">Absatz 1: eine Idee</text>
<rect x="46" y="168" width="388" height="28" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="58" y="188" font-family="sans-serif" font-size="16" fill="#12545c">Absatz 2: eine Idee</text>
<rect x="46" y="202" width="388" height="28" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="58" y="222" font-family="sans-serif" font-size="16" fill="#12545c">Absatz 3: eine Idee</text>
<rect x="30" y="248" width="420" height="64" rx="10" fill="#b5651d"/>
<text x="46" y="276" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Schluss (conclusion)</text>
<text x="46" y="300" font-family="sans-serif" font-size="16" fill="#fff">kurz zusammenfassen, nichts Neues</text>
</svg>
