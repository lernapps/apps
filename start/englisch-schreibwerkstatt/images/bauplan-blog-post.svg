<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 342" role="img" aria-labelledby="t d">
<title id="t">Bauplan für einen Blogbeitrag</title>
<desc id="d">Vier Kästen untereinander: Titel, Einstieg, Hauptteil und Aufruf. In jedem Kasten steht ein Beispielsatz.</desc>
<rect width="480" height="342" fill="#f4efe2"/>
<rect x="30" y="16" width="420" height="60" rx="10" fill="#6a4c93"/>
<text x="46" y="40" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Titel (title)</text>
<text x="46" y="64" font-family="sans-serif" font-size="16" font-style="italic" fill="#fff">Big news from the sports hall!</text>
<rect x="30" y="86" width="420" height="60" rx="10" fill="#6a4c93"/>
<text x="46" y="110" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Einstieg (opening)</text>
<text x="46" y="134" font-family="sans-serif" font-size="16" font-style="italic" fill="#fff">Hi again, everybody! Guess what?</text>
<rect x="30" y="156" width="420" height="60" rx="10" fill="#1b7f8a"/>
<text x="46" y="180" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Hauptteil (main part)</text>
<text x="46" y="204" font-family="sans-serif" font-size="16" font-style="italic" fill="#fff">Here is what happened …</text>
<rect x="30" y="226" width="420" height="60" rx="10" fill="#b5651d"/>
<text x="46" y="250" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Aufruf (call to comment)</text>
<text x="46" y="274" font-family="sans-serif" font-size="16" font-style="italic" fill="#fff">What do you think? Tell us below!</text>
</svg>
