<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 306" role="img" aria-labelledby="t d">
<title id="t">Von der Geschichte zum Bericht</title>
<desc id="d">Links vier Merkmale einer Geschichte, ein Pfeil nach rechts, rechts die Schablone eines Berichts mit headline, Einleitung, Hauptteil und Schluss.</desc>
<rect width="480" height="306" fill="#f4efe2"/>
<rect x="16" y="16" width="168" height="36" rx="10" fill="#6b6355"/>
<text x="100" y="41" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Geschichte</text>
<rect x="16" y="64" width="168" height="34" rx="6" fill="#e8dfc8"/>
<text x="28" y="87" font-family="sans-serif" font-size="16" fill="#3d382d">Erzählstil</text>
<rect x="16" y="106" width="168" height="34" rx="6" fill="#e8dfc8"/>
<text x="28" y="129" font-family="sans-serif" font-size="16" fill="#3d382d">wörtliche Rede</text>
<rect x="16" y="148" width="168" height="34" rx="6" fill="#e8dfc8"/>
<text x="28" y="171" font-family="sans-serif" font-size="16" fill="#3d382d">Gefühle</text>
<rect x="16" y="190" width="168" height="34" rx="6" fill="#e8dfc8"/>
<text x="28" y="213" font-family="sans-serif" font-size="16" fill="#3d382d">Handlung</text>
<path d="M192 140 H214 M206 130 L218 140 L206 150" fill="none" stroke="#6b6355" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="232" y="16" width="232" height="84" rx="10" fill="#6a4c93"/>
<text x="248" y="44" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">headline, Einleitung</text>
<text x="248" y="70" font-family="sans-serif" font-size="16" fill="#fff">Wer? Wo? Wann? Was?</text>
<rect x="232" y="112" width="232" height="70" rx="10" fill="#1b7f8a"/>
<text x="248" y="140" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Hauptteil</text>
<text x="248" y="166" font-family="sans-serif" font-size="16" fill="#fff">der Ablauf der Reihe nach</text>
<rect x="232" y="194" width="232" height="58" rx="10" fill="#b5651d"/>
<text x="248" y="220" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Schluss</text>
<text x="248" y="243" font-family="sans-serif" font-size="16" fill="#fff">wie es endete</text>
</svg>
