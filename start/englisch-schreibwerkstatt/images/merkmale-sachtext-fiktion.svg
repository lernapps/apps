<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 274" role="img" aria-labelledby="t d">
<title id="t">Merkmale von Sachtext und erfundenem Text</title>
<desc id="d">Zwei Spalten nebeneinander. Links die Merkmale eines Sachtextes, rechts die eines erfundenen Textes.</desc>
<rect width="480" height="274" fill="#f4efe2"/>
<rect x="20" y="16" width="210" height="44" rx="10" fill="#2f6b4f"/>
<text x="125" y="45" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Sachtext</text>
<rect x="250" y="16" width="210" height="44" rx="10" fill="#8a3a5c"/>
<text x="355" y="45" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Erfundener Text</text>
<rect x="20" y="72" width="210" height="34" rx="6" fill="#dfeee6"/>
<text x="34" y="95" font-family="sans-serif" font-size="16" fill="#1f4d37">Fakten</text>
<rect x="20" y="112" width="210" height="34" rx="6" fill="#dfeee6"/>
<text x="34" y="135" font-family="sans-serif" font-size="16" fill="#1f4d37">Quelle genannt</text>
<rect x="20" y="152" width="210" height="34" rx="6" fill="#dfeee6"/>
<text x="34" y="175" font-family="sans-serif" font-size="16" fill="#1f4d37">echte Dinge</text>
<rect x="20" y="192" width="210" height="34" rx="6" fill="#dfeee6"/>
<text x="34" y="215" font-family="sans-serif" font-size="16" fill="#1f4d37">will informieren</text>
<rect x="250" y="72" width="210" height="34" rx="6" fill="#f1dde6"/>
<text x="264" y="95" font-family="sans-serif" font-size="16" fill="#6a2745">Erzählstimme</text>
<rect x="250" y="112" width="210" height="34" rx="6" fill="#f1dde6"/>
<text x="264" y="135" font-family="sans-serif" font-size="16" fill="#6a2745">wörtliche Rede</text>
<rect x="250" y="152" width="210" height="34" rx="6" fill="#f1dde6"/>
<text x="264" y="175" font-family="sans-serif" font-size="16" fill="#6a2745">erfundene Figuren</text>
<rect x="250" y="192" width="210" height="34" rx="6" fill="#f1dde6"/>
<text x="264" y="215" font-family="sans-serif" font-size="16" fill="#6a2745">will unterhalten</text>
</svg>
