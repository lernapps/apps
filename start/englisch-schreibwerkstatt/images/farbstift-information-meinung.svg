<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 356" role="img" aria-labelledby="t d">
<title id="t">Der Farbstift</title>
<desc id="d">Zwei Stifte untereinander: ein blauer für Information mit Hinweisen zum Nachprüfen, ein roter für Meinung mit Hinweisen auf Wertung.</desc>
<rect width="480" height="356" fill="#f4efe2"/>
<rect x="30" y="20" width="330" height="34" fill="#2a6f97"/>
<polygon points="360,20 360,54 410,37" fill="#e8c9a0"/>
<polygon points="392,28 392,46 410,37" fill="#2a6f97"/>
<rect x="30" y="20" width="26" height="34" fill="#1d4f6e"/>
<text x="72" y="43" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Information</text>
<text x="30" y="84" font-family="sans-serif" font-size="16" fill="#1d4f6e">Man kann es nachprüfen:</text>
<text x="30" y="108" font-family="sans-serif" font-size="16" fill="#222">Zahl, Name, Ort, Zeit, Zitat mit Namen</text>
<text x="30" y="132" font-family="sans-serif" font-size="16" fill="#222">sachliche Wörter</text>
<rect x="30" y="178" width="330" height="34" fill="#b23a48"/>
<polygon points="360,178 360,212 410,195" fill="#e8c9a0"/>
<polygon points="392,186 392,204 410,195" fill="#b23a48"/>
<rect x="30" y="178" width="26" height="34" fill="#80222e"/>
<text x="72" y="201" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Meinung</text>
<text x="30" y="242" font-family="sans-serif" font-size="16" fill="#80222e">Man kann zustimmen oder nicht:</text>
<text x="30" y="266" font-family="sans-serif" font-size="16" fill="#222">I think, in my opinion, should</text>
<text x="30" y="290" font-family="sans-serif" font-size="16" fill="#222">Wörter, die etwas bewerten</text>
</svg>
