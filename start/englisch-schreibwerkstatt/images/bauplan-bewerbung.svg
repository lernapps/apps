<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 392" role="img" aria-labelledby="t d">
<title id="t">Bauplan für eine Bewerbung</title>
<desc id="d">Sechs Kästen untereinander: Anrede, Anlass, Eignung, Bezug zur Stelle, Schluss, Gruß.</desc>
<rect width="480" height="392" fill="#f4efe2"/>
<rect x="30" y="16" width="420" height="48" rx="10" fill="#6a4c93"/>
<text x="46" y="38" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Anrede</text>
<text x="46" y="57" font-family="sans-serif" font-size="16" fill="#fff">Betreff darüber, dann höflich mit Namen</text>
<rect x="30" y="72" width="420" height="48" rx="10" fill="#6a4c93"/>
<text x="46" y="94" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Anlass</text>
<text x="46" y="113" font-family="sans-serif" font-size="16" fill="#fff">Stelle nennen und sagen, warum du schreibst</text>
<rect x="30" y="128" width="420" height="48" rx="10" fill="#1b7f8a"/>
<text x="46" y="150" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Eignung</text>
<text x="46" y="169" font-family="sans-serif" font-size="16" fill="#fff">Eigenschaft plus ein Beispiel</text>
<rect x="30" y="184" width="420" height="48" rx="10" fill="#1b7f8a"/>
<text x="46" y="206" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Bezug zur Stelle</text>
<text x="46" y="225" font-family="sans-serif" font-size="16" fill="#fff">an die Anzeige anknüpfen</text>
<rect x="30" y="240" width="420" height="48" rx="10" fill="#b5651d"/>
<text x="46" y="262" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Schluss</text>
<text x="46" y="281" font-family="sans-serif" font-size="16" fill="#fff">Dank und Bitte um ein Gespräch</text>
<rect x="30" y="296" width="420" height="48" rx="10" fill="#b5651d"/>
<text x="46" y="318" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Gruß</text>
<text x="46" y="337" font-family="sans-serif" font-size="16" fill="#fff">höflicher Gruß, dann dein Name</text>
</svg>
