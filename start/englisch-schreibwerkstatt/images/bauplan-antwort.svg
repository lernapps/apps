<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 296" role="img" aria-labelledby="t d">
<title id="t">Bauplan für eine Antwort</title>
<desc id="d">Drei Kästen mit Pfeilen nach unten: Behauptung, Beispiel, Bezug zur Stelle.</desc>
<rect width="480" height="296" fill="#f4efe2"/>
<rect x="30" y="14" width="420" height="62" rx="10" fill="#6a4c93"/>
<text x="46" y="42" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">1 Behauptung (claim)</text>
<text x="46" y="64" font-family="sans-serif" font-size="16" fill="#fff">Ein Satz: was du kannst oder willst</text>
<path d="M228 80 h24 l-12 12 z" fill="#555"/>
<rect x="30" y="96" width="420" height="62" rx="10" fill="#1b7f8a"/>
<text x="46" y="124" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">2 Beispiel (example)</text>
<text x="46" y="146" font-family="sans-serif" font-size="16" fill="#fff">Kurz erzählen, wann du es getan hast</text>
<path d="M228 162 h24 l-12 12 z" fill="#555"/>
<rect x="30" y="178" width="420" height="62" rx="10" fill="#b5651d"/>
<text x="46" y="206" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">3 Bezug zur Stelle</text>
<text x="46" y="228" font-family="sans-serif" font-size="16" fill="#fff">Warum das für diese Arbeit wichtig ist</text>
</svg>
