<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 356" role="img" aria-labelledby="t d">
<title id="t">Bauplan für einen Zeitungsartikel</title>
<desc id="d">Drei Kästen untereinander: headline, lead mit fünf W-Fragen, body mit Einzelheiten, Zitat und Nebensachen.</desc>
<rect width="480" height="356" fill="#f4efe2"/>
<rect x="30" y="16" width="420" height="52" rx="10" fill="#6a4c93"/>
<text x="46" y="38" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">headline (Schlagzeile)</text>
<text x="46" y="58" font-family="sans-serif" font-size="16" fill="#fff">kurz und klar, eine Zeile</text>
<rect x="30" y="78" width="420" height="92" rx="10" fill="#6a4c93"/>
<text x="46" y="102" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">lead (erster Absatz)</text>
<rect x="46" y="116" width="72" height="30" rx="6" fill="#fff" fill-opacity="0.92"/>
<text x="82" y="137" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3d2a5c">Wer?</text>
<rect x="126" y="116" width="72" height="30" rx="6" fill="#fff" fill-opacity="0.92"/>
<text x="162" y="137" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3d2a5c">Was?</text>
<rect x="206" y="116" width="72" height="30" rx="6" fill="#fff" fill-opacity="0.92"/>
<text x="242" y="137" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3d2a5c">Wann?</text>
<rect x="286" y="116" width="72" height="30" rx="6" fill="#fff" fill-opacity="0.92"/>
<text x="322" y="137" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3d2a5c">Wo?</text>
<rect x="366" y="116" width="72" height="30" rx="6" fill="#fff" fill-opacity="0.92"/>
<text x="402" y="137" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3d2a5c">Warum?</text>
<text x="46" y="162" font-family="sans-serif" font-size="16" fill="#fff">das Wichtigste in ein bis zwei Sätzen</text>
<rect x="30" y="180" width="420" height="132" rx="10" fill="#1b7f8a"/>
<text x="46" y="204" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">body (Einzelheiten)</text>
<rect x="46" y="214" width="388" height="28" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="58" y="234" font-family="sans-serif" font-size="16" fill="#12545c">Zahlen und Gründe</text>
<rect x="46" y="248" width="388" height="28" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="58" y="268" font-family="sans-serif" font-size="16" fill="#12545c">Zitat mit Namen der Person</text>
<rect x="46" y="282" width="388" height="28" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="58" y="302" font-family="sans-serif" font-size="16" fill="#12545c">Weniger Wichtiges zuletzt</text>
</svg>
