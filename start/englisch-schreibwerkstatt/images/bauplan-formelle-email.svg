<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 382" role="img" aria-labelledby="t d">
<title id="t">Bauplan für eine formelle E-Mail</title>
<desc id="d">Vier Kästen untereinander: Betreff, Anrede, Anliegen, Gruß mit Name.</desc>
<rect width="480" height="382" fill="#f4efe2"/>
<rect x="30" y="10" width="420" height="58" rx="10" fill="#6a4c93"/>
<text x="46" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Betreff (subject)</text>
<text x="46" y="58" font-family="sans-serif" font-size="16" fill="#fff">kurz: worum geht es?</text>
<rect x="30" y="76" width="420" height="58" rx="10" fill="#6a4c93"/>
<text x="46" y="101" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Anrede (greeting)</text>
<text x="46" y="124" font-family="sans-serif" font-size="16" fill="#fff">Dear Ms/Mr + Nachname</text>
<rect x="30" y="142" width="420" height="92" rx="10" fill="#1b7f8a"/>
<text x="46" y="167" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Anliegen (main part)</text>
<text x="46" y="192" font-family="sans-serif" font-size="16" fill="#fff">Warum du schreibst, dann deine</text>
<text x="46" y="214" font-family="sans-serif" font-size="16" fill="#fff">Fragen, höflich und klar</text>
<rect x="30" y="242" width="420" height="92" rx="10" fill="#b5651d"/>
<text x="46" y="267" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Gruß (closing)</text>
<text x="46" y="290" font-family="sans-serif" font-size="16" fill="#fff">Yours sincerely / Yours faithfully</text>
<rect x="46" y="300" width="388" height="28" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="58" y="320" font-family="sans-serif" font-size="16" fill="#6b3a0c">Dein Name</text>
</svg>
