<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 328" role="img" aria-labelledby="t d">
<title id="t">Bauplan für einen Bericht</title>
<desc id="d">Drei Kästen untereinander: headline und Einleitung mit fünf Fragewörtern, Hauptteil, Schluss.</desc>
<rect width="480" height="328" fill="#f4efe2"/>
<rect x="30" y="16" width="420" height="92" rx="10" fill="#6a4c93"/>
<text x="46" y="44" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">headline und Einleitung</text>
<rect x="46" y="58" width="70" height="36" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="81" y="82" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3f2a63">Who?</text>
<rect x="125" y="58" width="70" height="36" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="160" y="82" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3f2a63">What?</text>
<rect x="204" y="58" width="70" height="36" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="239" y="82" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3f2a63">Where?</text>
<rect x="283" y="58" width="70" height="36" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="318" y="82" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3f2a63">When?</text>
<rect x="362" y="58" width="72" height="36" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="398" y="82" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3f2a63">Why?</text>
<rect x="30" y="120" width="420" height="84" rx="10" fill="#1b7f8a"/>
<text x="46" y="148" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Hauptteil (body)</text>
<rect x="46" y="160" width="388" height="30" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="58" y="181" font-family="sans-serif" font-size="16" fill="#12545c">Einzelheiten der Reihe nach</text>
<rect x="30" y="216" width="420" height="64" rx="10" fill="#b5651d"/>
<text x="46" y="244" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Schluss (conclusion)</text>
<text x="46" y="268" font-family="sans-serif" font-size="16" fill="#fff">wie es endete oder was kommt</text>
</svg>
