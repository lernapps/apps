<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 376" role="img" aria-labelledby="t d">
<title id="t">Berufe und ihre Tätigkeiten</title>
<desc id="d">Sechs Zeilen: links ein englischer Beruf mit a oder an, rechts auf Deutsch, was die Person tut.</desc>
<rect width="480" height="376" fill="#f4efe2"/>
<rect x="20" y="12" width="200" height="44" rx="8" fill="#3f6b4f"/>
<text x="34" y="40" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">a nurse</text>
<text x="232" y="40" font-family="sans-serif" font-size="16" fill="#2b2b2b">hilft kranken Menschen</text>
<rect x="20" y="66" width="200" height="44" rx="8" fill="#3f6b4f"/>
<text x="34" y="94" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">a mechanic</text>
<text x="232" y="94" font-family="sans-serif" font-size="16" fill="#2b2b2b">repariert Autos</text>
<rect x="20" y="120" width="200" height="44" rx="8" fill="#3f6b4f"/>
<text x="34" y="148" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">a chef</text>
<text x="232" y="148" font-family="sans-serif" font-size="16" fill="#2b2b2b">kocht im Restaurant</text>
<rect x="20" y="174" width="200" height="44" rx="8" fill="#3f6b4f"/>
<text x="34" y="202" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">a vet</text>
<text x="232" y="202" font-family="sans-serif" font-size="16" fill="#2b2b2b">behandelt kranke Tiere</text>
<rect x="20" y="228" width="200" height="44" rx="8" fill="#3f6b4f"/>
<text x="34" y="256" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">an engineer</text>
<text x="232" y="256" font-family="sans-serif" font-size="16" fill="#2b2b2b">plant Brücken, Maschinen</text>
<rect x="20" y="282" width="200" height="44" rx="8" fill="#3f6b4f"/>
<text x="34" y="310" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">a shop assistant</text>
<text x="232" y="310" font-family="sans-serif" font-size="16" fill="#2b2b2b">berät Kunden im Laden</text>
</svg>
