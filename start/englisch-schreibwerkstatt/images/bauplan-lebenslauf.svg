<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t d">
<title id="t">Bauplan für einen Lebenslauf</title>
<desc id="d">Drei Gruppen untereinander: persönliche Angaben, dann Ausbildung, Erfahrung und Fähigkeiten, zuletzt Interessen.</desc>
<rect width="480" height="360" fill="#f4efe2"/>
<rect x="30" y="16" width="420" height="60" rx="10" fill="#6a4c93"/>
<text x="46" y="44" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Personal details (Kopf)</text>
<text x="46" y="66" font-family="sans-serif" font-size="16" fill="#fff">Name, Wohnort, E-Mail</text>
<rect x="30" y="90" width="420" height="150" rx="10" fill="#1b7f8a"/>
<text x="46" y="116" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Hauptteil in Stichpunkten</text>
<rect x="46" y="128" width="388" height="30" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="58" y="149" font-family="sans-serif" font-size="16" fill="#12545c">Education: Schulen, neueste zuerst</text>
<rect x="46" y="164" width="388" height="30" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="58" y="185" font-family="sans-serif" font-size="16" fill="#12545c">Experience: Aufgaben, neueste zuerst</text>
<rect x="46" y="200" width="388" height="30" rx="6" fill="#fff" fill-opacity="0.9"/>
<text x="58" y="221" font-family="sans-serif" font-size="16" fill="#12545c">Skills: Sprachen und Können</text>
<rect x="30" y="254" width="420" height="60" rx="10" fill="#b5651d"/>
<text x="46" y="282" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Interests (Schluss)</text>
<text x="46" y="304" font-family="sans-serif" font-size="16" fill="#fff">Hobbys in einer kurzen Zeile</text>
</svg>
