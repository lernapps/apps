<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 344" role="img" aria-labelledby="t d">
<title id="t">Bauplan für einen Vortrag</title>
<desc id="d">Drei Kästen untereinander: Einleitung, Hauptteil, Schluss. In jedem Kasten steht, was der Teil leistet, und ein Beispiel für ein Redemittel.</desc>
<rect width="480" height="344" fill="#f4efe2"/>
<rect x="30" y="16" width="420" height="88" rx="10" fill="#6a4c93"/>
<text x="46" y="44" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Einleitung (introduction)</text>
<text x="46" y="68" font-family="sans-serif" font-size="16" fill="#fff">begrüßen, Thema nennen</text>
<text x="46" y="92" font-family="sans-serif" font-size="16" font-style="italic" fill="#fff">Hello, everyone. My topic is …</text>
<rect x="30" y="116" width="420" height="88" rx="10" fill="#1b7f8a"/>
<text x="46" y="144" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Hauptteil (main part)</text>
<text x="46" y="168" font-family="sans-serif" font-size="16" fill="#fff">ein Punkt nach dem anderen</text>
<text x="46" y="192" font-family="sans-serif" font-size="16" font-style="italic" fill="#fff">My second point is …</text>
<rect x="30" y="216" width="420" height="88" rx="10" fill="#b5651d"/>
<text x="46" y="244" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Schluss (conclusion)</text>
<text x="46" y="268" font-family="sans-serif" font-size="16" fill="#fff">zusammenfassen, danken</text>
<text x="46" y="292" font-family="sans-serif" font-size="16" font-style="italic" fill="#fff">That is all from me. Thank you.</text>
</svg>
