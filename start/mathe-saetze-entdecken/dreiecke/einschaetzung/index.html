<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../dreiecke/">Dreiecke konstruieren und vergleichen</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 9 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>

<h2 id="teil-1" tabindex="-1">Seite 1 von 3</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Angaben legen genau ein Dreieck fest?</legend>
<label class="question-option"><input type="checkbox" name="frage-a3" value="0"> <span>a = 4 cm, b = 6 cm, c = 5 cm</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="1"> <span>a = 4 cm, b = 6 cm, c = 11 cm</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="2"> <span>b = 5 cm, α = 40°, a = 4 cm (a liegt α gegenüber)</span></label>
<label class="question-option"><input type="checkbox" name="frage-a3" value="3"> <span>c = 6 cm, α = 50°, β = 60°</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>a = 4 cm, b = 6 cm, c = 5 cm</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>SSS, jede Seite ist kürzer als die anderen zusammen.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>a = 4 cm, b = 6 cm, c = 11 cm</strong></p><p>4 cm + 6 cm reicht nicht bis 11 cm.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>b = 5 cm, α = 40°, a = 4 cm (a liegt α gegenüber)</strong></p><p>Hier passen zwei Dreiecke.</p></li>

</ul>
<p class="question-explanation">SSS und WSW legen hier ein Dreieck fest.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>

<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne den Angaben den passenden Kongruenzsatz zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>a = 5 cm, b = 6 cm, c = 7 cm</span> <select name="frage-a5-0" data-left="0"><option value="">bitte wählen</option><option value="3">SsW</option><option value="0">SSS</option><option value="4">kein Kongruenzsatz</option><option value="1">SWS</option><option value="2">WSW</option></select></label></li>
<li><label><span>b = 5 cm, c = 6 cm, α = 40° (α liegt zwischen b und c)</span> <select name="frage-a5-1" data-left="1"><option value="">bitte wählen</option><option value="3">SsW</option><option value="0">SSS</option><option value="4">kein Kongruenzsatz</option><option value="1">SWS</option><option value="2">WSW</option></select></label></li>
<li><label><span>c = 6 cm, α = 50°, β = 60°</span> <select name="frage-a5-2" data-left="2"><option value="">bitte wählen</option><option value="3">SsW</option><option value="0">SSS</option><option value="4">kein Kongruenzsatz</option><option value="1">SWS</option><option value="2">WSW</option></select></label></li>
<li><label><span>a = 7 cm, b = 5 cm, α = 60° (α liegt der längeren Seite a gegenüber)</span> <select name="frage-a5-3" data-left="3"><option value="">bitte wählen</option><option value="3">SsW</option><option value="0">SSS</option><option value="4">kein Kongruenzsatz</option><option value="1">SWS</option><option value="2">WSW</option></select></label></li>
<li><label><span>α = 50°, β = 60°, γ = 70°</span> <select name="frage-a5-4" data-left="4"><option value="">bitte wählen</option><option value="3">SsW</option><option value="0">SSS</option><option value="4">kein Kongruenzsatz</option><option value="1">SWS</option><option value="2">WSW</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> a = 5 cm, b = 6 cm, c = 7 cm – SSS; b = 5 cm, c = 6 cm, α = 40° (α liegt zwischen b und c) – SWS; c = 6 cm, α = 50°, β = 60° – WSW; a = 7 cm, b = 5 cm, α = 60° (α liegt der längeren Seite a gegenüber) – SsW; α = 50°, β = 60°, γ = 70° – kein Kongruenzsatz</p>

</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Zwei Dreiecke stimmen in zwei Seiten und in einem Winkel überein. Der Winkel liegt der kürzeren der beiden Seiten gegenüber. Sind sie kongruent?</legend>
<label class="question-option"><input type="radio" name="frage-a6" value="0"> <span>Ja, immer.</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="1"> <span>Nicht unbedingt.</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="2"> <span>Nein, nie.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Ja, immer.</strong></p><p>Hier passen manchmal zwei Dreiecke zu den Stücken, die Dreiecke können verschieden sein.</p></li>

<li class="question-info" data-option="2"><p class="question-info-head"><strong>Nein, nie.</strong></p><p>Es kann sein, dass die Dreiecke kongruent sind, es ist aber nicht sicher.</p></li>
</ul>
<p class="question-explanation">Liegt der Winkel der kürzeren Seite gegenüber, ist das kein Kongruenzsatz.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

</form>
</div></li>
