<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" role="img">
  <title>Waage mit zwei leeren Schalen, links Pro (für ein Verbot), rechts Contra (gegen ein Verbot), im Gleichgewicht</title>
  <rect width="680" height="510" fill="#f4efe2"/>
  <text x="20" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222">Question: Should schools ban phones?</text>
  <rect x="332" y="100" width="16" height="250" fill="#6b5b45" stroke="#333" stroke-width="2"/>
  <rect x="270" y="346" width="140" height="18" rx="6" fill="#6b5b45" stroke="#333" stroke-width="2"/>
  <line x1="130.0" y1="100.0" x2="30.0" y2="250.0" stroke="#555" stroke-width="2"/>
  <line x1="130.0" y1="100.0" x2="230.0" y2="250.0" stroke="#555" stroke-width="2"/>
  <line x1="550.0" y1="100.0" x2="450.0" y2="250.0" stroke="#555" stroke-width="2"/>
  <line x1="550.0" y1="100.0" x2="650.0" y2="250.0" stroke="#555" stroke-width="2"/>
  <line x1="130.0" y1="100.0" x2="550.0" y2="100.0" stroke="#333" stroke-width="10" stroke-linecap="round"/>
  <circle cx="340" cy="100" r="14" fill="#f2c14e" stroke="#333" stroke-width="3"/>
  <path d="M30.0 250.0 H230.0 L208.0 270.0 H52.0 Z" fill="#e9e1cc" stroke="#333" stroke-width="2.5"/>
  <text x="130.0" y="296.0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c0392b">Pro</text>
  <text x="130.0" y="320.0" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">for a ban</text>
  <path d="M450.0 250.0 H650.0 L628.0 270.0 H472.0 Z" fill="#e9e1cc" stroke="#333" stroke-width="2.5"/>
  <text x="550.0" y="296.0" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2c6fd8">Contra</text>
  <text x="550.0" y="320.0" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">against a ban</text>
  <rect x="20" y="384" width="640" height="48" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="36" y="415" font-family="sans-serif" font-size="17" fill="#222"><tspan font-weight="bold">conclusion:</tspan> ?</text>
</svg>
