<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img">
  <title>Satzbau im Passiv</title>
  <rect width="640" height="290" fill="#f4efe2"/>
  <rect x="20" y="30" width="130" height="56" rx="10" fill="#fff" stroke="#333" stroke-width="3"/>
  <text x="85.0" y="65" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">The cake</text>
  <line x1="85.0" y1="88" x2="85.0" y2="118" stroke="#333" stroke-width="2"/>
  <text x="85.0" y="142" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Sache</text>
  <rect x="160" y="30" width="150" height="56" rx="10" fill="#e8743b" stroke="#333" stroke-width="3"/>
  <text x="235.0" y="65" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">was made</text>
  <line x1="235.0" y1="88" x2="235.0" y2="118" stroke="#333" stroke-width="2"/>
  <text x="235.0" y="142" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">was oder were + Partizip</text>
  <rect x="320" y="30" width="160" height="56" rx="10" fill="#2c6fd8" stroke="#333" stroke-width="3"/>
  <text x="400.0" y="65" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff">by the pupils</text>
  <line x1="400.0" y1="88" x2="400.0" y2="118" stroke="#333" stroke-width="2"/>
  <text x="400.0" y="142" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">by + Person</text>
  <rect x="490" y="30" width="130" height="56" rx="10" fill="#138d75" stroke="#333" stroke-width="3"/>
  <text x="555.0" y="65" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff">in a day</text>
  <line x1="555.0" y1="88" x2="555.0" y2="118" stroke="#333" stroke-width="2"/>
  <text x="555.0" y="142" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#222">Zeit</text>
  <text x="320" y="200" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#222">Die Sache steht vorn. Die Person kommt hinter by.</text>
</svg>
