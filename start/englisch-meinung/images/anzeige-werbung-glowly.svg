<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img">
  <title>Erfundene Anzeige für die Marke Glowly</title>
  <rect width="640" height="460" fill="#f4efe2"/>
  <rect x="20" y="20" width="600" height="360" rx="14" fill="#3b2f63" stroke="#333" stroke-width="3"/>
  <text x="44" y="80" text-anchor="start" font-family="sans-serif" font-size="42" font-weight="bold" fill="#ffd23f" >Glowly Lamps</text>
  <text x="44" y="130" text-anchor="start" font-family="sans-serif" font-size="30" font-weight="bold" fill="#fff" >Why live in the dark?</text>
  <text x="44" y="178" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="normal" fill="#fff" >Light up your room.</text>
  <text x="44" y="208" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="normal" fill="#fff" >Light up your mood!</text>
  <text x="44" y="262" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffd23f" >Buy two, get one free.</text>
  <text x="44" y="294" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffd23f" >This week only!</text>
  <polygon points="470,150 570,150 590,230 450,230" fill="#ffd23f" stroke="#fff" stroke-width="3"/>
  <rect x="512" y="230" width="16" height="60" fill="#ddd"/><rect x="480" y="290" width="80" height="14" rx="6" fill="#ddd"/>
  <text x="44" y="340" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff" >Glowly. Home is where the light is.</text>
  <text x="44" y="366" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#c9c2e8" >Glowly: made-up brand for this lesson</text>
</svg>
