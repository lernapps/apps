<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img">
<title>Zeitleiste von den 1950ern bis heute mit drei Beispielen für Zeitformen</title>
<rect width="720" height="390" fill="#f4efe2"/>
<rect x="40" y="62" width="560" height="64" rx="8" fill="#d9e4f7" stroke="#2c6fd8" stroke-width="2"/>
<rect x="600" y="62" width="90" height="64" rx="8" fill="#fbe0d8" stroke="#c0392b" stroke-width="2"/>
<text x="320" y="90" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">then: simple past</text>
<text x="320" y="114" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#333">(the 1950s to the 2010s)</text>
<text x="645" y="90" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">today</text>
<text x="645" y="114" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#333">present</text>
<line x1="40" y1="150" x2="690" y2="150" stroke="#333" stroke-width="3"/>
<line x1="40" y1="142" x2="40" y2="158" stroke="#333" stroke-width="2"/>
<text x="40" y="182" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222">1950s</text>
<line x1="120" y1="142" x2="120" y2="158" stroke="#333" stroke-width="2"/>
<text x="120" y="182" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222">1960s</text>
<line x1="200" y1="142" x2="200" y2="158" stroke="#333" stroke-width="2"/>
<text x="200" y="182" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222">1970s</text>
<line x1="280" y1="142" x2="280" y2="158" stroke="#333" stroke-width="2"/>
<text x="280" y="182" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222">1980s</text>
<line x1="360" y1="142" x2="360" y2="158" stroke="#333" stroke-width="2"/>
<text x="360" y="182" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222">1990s</text>
<line x1="440" y1="142" x2="440" y2="158" stroke="#333" stroke-width="2"/>
<text x="440" y="182" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222">2000s</text>
<line x1="520" y1="142" x2="520" y2="158" stroke="#333" stroke-width="2"/>
<text x="520" y="182" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222">2010s</text>
<line x1="600" y1="142" x2="600" y2="158" stroke="#333" stroke-width="2"/>
<text x="600" y="182" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222">2020s</text>
<line x1="690" y1="142" x2="690" y2="158" stroke="#333" stroke-width="2"/>
<rect x="20" y="204" width="200" height="114" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="32" y="230" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">simple past</text>
<text x="32" y="256" font-family="sans-serif" font-size="16" fill="#222">In the 1970s, teenagers</text>
<text x="32" y="278" font-family="sans-serif" font-size="16" fill="#222">danced at youth clubs.</text>
<rect x="260" y="204" width="200" height="114" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="272" y="230" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">present</text>
<text x="272" y="256" font-family="sans-serif" font-size="16" fill="#222">Today, teenagers share</text>
<text x="272" y="278" font-family="sans-serif" font-size="16" fill="#222">songs online.</text>
<rect x="500" y="204" width="200" height="114" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="512" y="230" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">used to</text>
<text x="512" y="256" font-family="sans-serif" font-size="16" fill="#222">Teenagers used to write</text>
<text x="512" y="278" font-family="sans-serif" font-size="16" fill="#222">letters. Now they send</text>
<text x="512" y="300" font-family="sans-serif" font-size="16" fill="#222">messages.</text>
</svg>
