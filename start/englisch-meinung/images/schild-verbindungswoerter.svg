<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 454" role="img">
  <title>Zwei gestapelte Burger mit einem leeren Schild dazwischen</title>
  <rect width="620" height="454" fill="#f4efe2"/>
  <rect x="10" y="10" width="600" height="34" rx="17" fill="#e8743b" stroke="#333" stroke-width="2"/>
  <text x="24" y="33" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Opinion</text>
  <text x="108" y="33" font-family="sans-serif" font-size="16" fill="#222">The new library is great.</text>
  <rect x="10" y="48" width="600" height="34" rx="6" fill="#2c6fd8" stroke="#333" stroke-width="2"/>
  <text x="24" y="71" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">Reason</text>
  <text x="108" y="71" font-family="sans-serif" font-size="16" fill="#fff">It has a lot of comics.</text>
  <rect x="10" y="86" width="600" height="34" rx="6" fill="#138d75" stroke="#333" stroke-width="2"/>
  <text x="24" y="109" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">Example</text>
  <text x="108" y="109" font-family="sans-serif" font-size="16" fill="#fff">I found three in one hour.</text>
  <rect x="10" y="124" width="600" height="34" rx="17" fill="#e8743b" stroke="#333" stroke-width="2"/>
  <text x="24" y="147" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Opinion</text>
  <text x="108" y="147" font-family="sans-serif" font-size="16" fill="#222">So I love it.</text>
  <line x1="310.0" y1="160" x2="310.0" y2="172" stroke="#333" stroke-width="3"/>
  <rect x="190.0" y="170" width="240" height="42" rx="10" fill="#fff" stroke="#333" stroke-width="3"/>
  <text x="310.0" y="199" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">?</text>
  <line x1="310.0" y1="212" x2="310.0" y2="222" stroke="#333" stroke-width="3"/>
  <rect x="10" y="222" width="600" height="34" rx="17" fill="#e8743b" stroke="#333" stroke-width="2"/>
  <text x="24" y="245" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Opinion</text>
  <text x="108" y="245" font-family="sans-serif" font-size="16" fill="#222">The opening hours are bad.</text>
  <rect x="10" y="260" width="600" height="34" rx="6" fill="#2c6fd8" stroke="#333" stroke-width="2"/>
  <text x="24" y="283" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">Reason</text>
  <text x="108" y="283" font-family="sans-serif" font-size="16" fill="#fff">It closes at four o'clock.</text>
  <rect x="10" y="298" width="600" height="34" rx="6" fill="#138d75" stroke="#333" stroke-width="2"/>
  <text x="24" y="321" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">Example</text>
  <text x="108" y="321" font-family="sans-serif" font-size="16" fill="#fff">On Friday I could not borrow a book.</text>
  <rect x="10" y="336" width="600" height="34" rx="17" fill="#e8743b" stroke="#333" stroke-width="2"/>
  <text x="24" y="359" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Opinion</text>
  <text x="108" y="359" font-family="sans-serif" font-size="16" fill="#222">So I am not happy.</text>
</svg>
