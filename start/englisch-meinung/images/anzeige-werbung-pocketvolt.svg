<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img">
  <title>Erfundene Anzeige für die Marke Pocketvolt</title>
  <rect width="640" height="440" fill="#f4efe2"/>
  <rect x="20" y="20" width="600" height="340" rx="14" fill="#1f3a5f" stroke="#333" stroke-width="3"/>
  <text x="44" y="80" text-anchor="start" font-family="sans-serif" font-size="44" font-weight="bold" fill="#ffd23f" >Pocketvolt</text>
  <text x="44" y="130" text-anchor="start" font-family="sans-serif" font-size="28" font-weight="bold" fill="#fff" >Power for a perfect day!</text>
  <text x="44" y="176" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="normal" fill="#dbe7f5" >Be the one who never runs out of power.</text>
  <rect x="430" y="196" width="150" height="86" rx="16" fill="#ffd23f" stroke="#fff" stroke-width="3" transform="rotate(-8 505 239)"/>
  <polygon points="515,208 485,246 506,246 494,276 532,232 511,232" fill="#1f3a5f" transform="rotate(-8 505 239)"/>
  <text x="44" y="250" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fff" >120 g  ·  5,000 mAh</text>
  <text x="44" y="284" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="normal" fill="#dbe7f5" >Charges one phone once.</text>
  <text x="44" y="334" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#9fb6d1" >Pocketvolt: made-up brand for this lesson</text>
</svg>
