<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 390" role="img">
<title>Ein Kassenbon aus einem Geschäft</title>
<rect width="480" height="390" fill="#f4efe2"/>
<path d="M20 14 H270 V292 L257.5 304 L245.0 292 L232.5 304 L220.0 292 L207.5 304 L195.0 292 L182.5 304 L170.0 292 L157.5 304 L145.0 292 L132.5 304 L120.0 292 L107.5 304 L95.0 292 L82.5 304 L70.0 292 L57.5 304 L45.0 292 L32.5 304 L20.0 292 Z" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="145" y="44" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">EXAMPLE SHOP</text>
<text x="145" y="68" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#555">Receipt</text>
<line x1="36" y1="80" x2="254" y2="80" stroke="#999" stroke-dasharray="4 4"/>
<text x="36" y="108" font-family="sans-serif" font-size="16" fill="#222">T-shirt</text>
<text x="254" y="108" font-family="sans-serif" font-size="16" text-anchor="end" fill="#222">£7.00</text>
<text x="36" y="138" font-family="sans-serif" font-size="16" fill="#222">Socks</text>
<text x="254" y="138" font-family="sans-serif" font-size="16" text-anchor="end" fill="#222">£3.50</text>
<line x1="36" y1="152" x2="254" y2="152" stroke="#999" stroke-dasharray="4 4"/>
<text x="36" y="182" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Total</text>
<text x="254" y="182" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="#222">£10.50</text>
<text x="36" y="226" font-family="sans-serif" font-size="16" fill="#222">Paid by card</text>
<text x="145" y="270" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#555">Thank you!</text>
<path d="M280 39 L300 39" stroke="#c0392b" stroke-width="2" fill="none"/>
<circle cx="276" cy="39" r="4" fill="#c0392b"/>
<text x="308" y="44" font-family="sans-serif" font-size="16" fill="#222">the shop</text>
<path d="M280 103 L300 103" stroke="#c0392b" stroke-width="2" fill="none"/>
<circle cx="276" cy="103" r="4" fill="#c0392b"/>
<text x="308" y="108" font-family="sans-serif" font-size="16" fill="#222">items and prices</text>
<path d="M280 177 L300 177" stroke="#c0392b" stroke-width="2" fill="none"/>
<circle cx="276" cy="177" r="4" fill="#c0392b"/>
<text x="308" y="182" font-family="sans-serif" font-size="16" fill="#222">the total</text>
