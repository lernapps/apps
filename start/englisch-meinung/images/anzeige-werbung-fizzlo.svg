<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" role="img">
  <title>Erfundene Anzeige für die Marke Fizzlo, mit vier nummerierten Stellen</title>
  <rect width="640" height="530" fill="#f4efe2"/>
  <rect x="20" y="16" width="600" height="360" rx="14" fill="#ffe3b3" stroke="#333" stroke-width="3"/>
  <text x="44" y="74" text-anchor="start" font-family="sans-serif" font-size="46" font-weight="bold" fill="#c0392b" >Fizzlo</text>
  <circle cx="52" cy="112" r="14" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="52" y="118" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222" >1</text>
  <text x="78" y="118" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="bold" fill="#7a2c1d" >Pop into summer.</text>
  <rect x="490" y="120" width="70" height="170" rx="22" fill="#f08a24" stroke="#333" stroke-width="3"/>
  <rect x="508" y="102" width="34" height="26" rx="6" fill="#333"/>
  <circle cx="520" cy="160" r="8" fill="#ffe3b3"/><circle cx="540" cy="200" r="6" fill="#ffe3b3"/><circle cx="516" cy="240" r="7" fill="#ffe3b3"/>
  <circle cx="52" cy="166" r="14" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="52" y="172" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222" >2</text>
  <text x="78" y="172" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222" >Who says juice has to be boring?</text>
  <circle cx="52" cy="220" r="14" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="52" y="226" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222" >3</text>
  <text x="78" y="226" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222" >Fresh, fresh, fresh: new every day!</text>
  <circle cx="52" cy="274" r="14" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="52" y="280" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222" >4</text>
  <text x="78" y="280" text-anchor="start" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222" >More fruit than any other juice.</text>
  <text x="44" y="350" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#7a5a3a" >Fizzlo: made-up brand for this lesson</text>
  <rect x="20" y="388" width="600" height="68" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="36" y="414" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222" >1  slogan</text>
  <text x="330" y="414" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222" >2  rhetorical question</text>
  <text x="36" y="442" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222" >3  repetition</text>
  <text x="330" y="442" text-anchor="start" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222" >4  comparison</text>
</svg>
