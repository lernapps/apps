<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Erfundene Anzeige für die Marke Rovix, mit vier nummerierten Blöcken</title>
  <rect width="640" height="480" fill="#f4efe2"/>
  <rect x="20" y="20" width="600" height="380" rx="14" fill="#2a9d8f" stroke="#333" stroke-width="3"/>
  <text x="44" y="76" text-anchor="start" font-family="sans-serif" font-size="46" font-weight="bold" fill="#fff" >Rovix</text>
  <circle cx="52" cy="124" r="14" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="52" y="130" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222" >1</text>
  <text x="78" y="133" text-anchor="start" font-family="sans-serif" font-size="28" font-weight="bold" fill="#fff" >Why walk when you can fly?</text>
  <circle cx="52" cy="190" r="14" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="52" y="196" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222" >2</text>
  <text x="78" y="184" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fff" >Faster than the rest.</text>
  <text x="78" y="214" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fff" >Lighter than ever.</text>
  <circle cx="52" cy="254" r="14" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="52" y="260" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222" >3</text>
  <text x="78" y="262" text-anchor="start" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffe66d" >Lace up. Jump in. Go!</text>
  <path d="M410 300 Q420 250 460 246 L510 246 Q530 280 590 284 Q610 290 606 312 L414 312 Z" fill="#fff" stroke="#222" stroke-width="3"/>
  <rect x="410" y="312" width="196" height="14" rx="6" fill="#ffe66d" stroke="#222" stroke-width="3"/>
  <text x="44" y="322" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fff" >Rovix. Your feet fly.</text>
  <circle cx="52" cy="352" r="14" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="52" y="358" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222" >4</text>
  <text x="78" y="358" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="normal" fill="#e6fffb" >Sizes 3 to 12. 40% recycled material.</text>
  <text x="44" y="386" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="normal" fill="#d4f4ef" >Rovix: made-up brand for this lesson</text>
</svg>
