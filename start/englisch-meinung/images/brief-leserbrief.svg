<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 460" role="img">
  <title>Aufbau eines Leserbriefs</title>
  <rect width="690" height="460" fill="#f4efe2"/>
  <rect x="10" y="10" width="440" height="380" fill="#fff" stroke="#333" stroke-width="3"/>
  <text x="26" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Dear Editor,</text>
  <text x="26" y="78" font-family="sans-serif" font-size="16" fill="#222">In your article about the library,</text>
  <text x="26" y="98" font-family="sans-serif" font-size="16" fill="#222">you say that it is too small.</text>
  <rect x="22" y="112" width="416" height="34" rx="14" fill="#e8743b" stroke="#333" stroke-width="2"/>
  <text x="32" y="135" font-family="sans-serif" font-size="16" fill="#222">I think it needs more tables.</text>
  <rect x="22" y="152" width="416" height="34" rx="5" fill="#2c6fd8" stroke="#333" stroke-width="2"/>
  <text x="32" y="175" font-family="sans-serif" font-size="16" fill="#fff">Pupils have no place to read.</text>
  <rect x="22" y="192" width="416" height="34" rx="5" fill="#138d75" stroke="#333" stroke-width="2"/>
  <text x="32" y="215" font-family="sans-serif" font-size="16" fill="#fff">On Monday I had to stand.</text>
  <rect x="22" y="232" width="416" height="34" rx="14" fill="#e8743b" stroke="#333" stroke-width="2"/>
  <text x="32" y="255" font-family="sans-serif" font-size="16" fill="#222">So the library needs a change.</text>
  <text x="26" y="300" font-family="sans-serif" font-size="16" fill="#222">Thank you for reading.</text>
  <text x="26" y="340" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Yours faithfully,</text>
  <text x="26" y="372" font-family="sans-serif" font-size="16" fill="#222">Your name</text>
  <path d="M458 22 h12 V50 h-12" fill="none" stroke="#333" stroke-width="3"/>
  <text x="482" y="42.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Anrede</text>
  <path d="M458 62 h12 V106 h-12" fill="none" stroke="#333" stroke-width="3"/>
  <text x="482" y="90.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Bezug zum Artikel</text>
  <path d="M458 112 h12 V268 h-12" fill="none" stroke="#333" stroke-width="3"/>
  <text x="482" y="196.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Meinung mit Burger</text>
  <path d="M458 286 h12 V384 h-12" fill="none" stroke="#333" stroke-width="3"/>
  <text x="482" y="341.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Schluss</text>
</svg>
