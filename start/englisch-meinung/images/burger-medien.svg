<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 378" role="img">
  <title>Argument-Burger mit vier Schichten</title>
  <rect width="480" height="378" fill="#f4efe2"/>
  <rect x="10" y="20" width="460" height="54" rx="26" fill="#e8743b" stroke="#333" stroke-width="2"/>
  <text x="24" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Opinion</text>
  <text x="24" y="64" font-family="sans-serif" font-size="16" fill="#222">I think a video app is fun.</text>
  <rect x="10" y="82" width="460" height="54" rx="8" fill="#2c6fd8" stroke="#333" stroke-width="2"/>
  <text x="24" y="104" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">Reason</text>
  <text x="24" y="126" font-family="sans-serif" font-size="16" fill="#fff">because I can learn new things.</text>
  <rect x="10" y="144" width="460" height="54" rx="8" fill="#138d75" stroke="#333" stroke-width="2"/>
  <text x="24" y="166" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">Example</text>
  <text x="24" y="188" font-family="sans-serif" font-size="16" fill="#fff">For example, I learned to draw from a video.</text>
  <rect x="10" y="206" width="460" height="54" rx="26" fill="#e8743b" stroke="#333" stroke-width="2"/>
  <text x="24" y="228" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Opinion</text>
  <text x="24" y="250" font-family="sans-serif" font-size="16" fill="#222">So a video app is good for me.</text>
  <text x="240.0" y="284" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Opinion – Reason – Example – Opinion</text>
</svg>
