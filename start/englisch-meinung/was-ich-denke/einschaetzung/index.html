<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../was-ich-denke/">Was ich mag und was ich denke</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 8 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>

<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In welches Fach gehört der Ausdruck?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>I believe that the library is too quiet.</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">Zustimmen</option><option value="0">Meinung sagen</option><option value="2">Widersprechen</option></select></label></li>
<li><label><span>That is true.</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">Zustimmen</option><option value="0">Meinung sagen</option><option value="2">Widersprechen</option></select></label></li>
<li><label><span>I do not agree with you.</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">Zustimmen</option><option value="0">Meinung sagen</option><option value="2">Widersprechen</option></select></label></li>

</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>

<p><strong>Richtige Antwort:</strong> I believe that the library is too quiet. – Meinung sagen; That is true. – Zustimmen; I do not agree with you. – Widersprechen</p>

<li><label><span>For example, I solved ten tasks in one hour.</span> <select name="frage-a3-2" data-left="2"><option value="">bitte wählen</option><option value="3">Opinion unten</option><option value="0">Opinion oben</option><option value="2">Example</option><option value="1">Reason</option></select></label></li>
