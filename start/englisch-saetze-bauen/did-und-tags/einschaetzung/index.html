<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../did-und-tags/">did und question tags</a></p>

<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 4 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>

<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-language-text"><p>Wähle den Helfer und die Form des Verbs.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-language-text"><p>Schreibe die ganze Frage. Denke an den Helfer.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>

<ol class="explainer-assessment-items">

<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="explainer-language-text"><p>Schreibe nur den question tag.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
