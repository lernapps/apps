<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 4 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>

<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-language-text"><p>Wähle den Helfer und die Form des Verbs für die betonte Aussage.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-language-text"><p>Ein Kritiker zweifelt. Widersprich mit einer betonten Aussage.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>

<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-language-text"><p>Wähle den richtigen Helfer für die umgekehrte Wortstellung.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="explainer-language-text"><p>Schreibe den Satz mit Umkehr nach dem verneinenden Wort.</p></div><div class="explainer-language-live" hidden></div></li>
