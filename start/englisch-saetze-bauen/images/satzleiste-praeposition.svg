<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 106" role="img">
  <title>Eine Reihe: Who, do, you, talk, to; die Präposition bleibt am Ende</title>
  <rect width="480" height="106" fill="#f4efe2"/>
  <text x="12" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Die Präposition bleibt am Ende</text>
  <rect x="12" y="36" width="85" height="38" rx="8" fill="#17a2b8"/>
  <text x="54.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">Who</text>
  <text x="54.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Fragewort</text>
  <rect x="103" y="36" width="59" height="38" rx="8" fill="#e6b800"/>
  <text x="132.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222">do</text>
  <text x="132.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Helfer</text>
  <rect x="168" y="36" width="68" height="38" rx="8" fill="#2c6fd8"/>
  <text x="202.0" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">you</text>
  <text x="202.0" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Subjekt</text>
  <rect x="242" y="36" width="59" height="38" rx="8" fill="#c0392b"/>
  <text x="271.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">talk</text>
  <text x="271.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Verb</text>
  <rect x="307" y="36" width="102" height="38" rx="8" fill="#6d4c41"/>
  <text x="358.0" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">to</text>
  <text x="358.0" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Präposition</text>
</svg>
