  <text x="180.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">live</text>
  <text x="180.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Verb</text>
  <rect x="216" y="36" width="59" height="38" rx="8" fill="#d35400"/>
  <text x="245.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">here</text>
