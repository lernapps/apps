  <rect x="103" y="130" width="59" height="38" rx="8" fill="#e6b800"/>
  <text x="132.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222">does</text>
  <text x="132.5" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Helfer</text>
  <rect x="168" y="130" width="68" height="38" rx="8" fill="#2c6fd8"/>
  <text x="202.0" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">Amir</text>
  <text x="202.0" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Subjekt</text>
  <rect x="242" y="130" width="59" height="38" rx="8" fill="#c0392b"/>
  <text x="271.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">live</text>
