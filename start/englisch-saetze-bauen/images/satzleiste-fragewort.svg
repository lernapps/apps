<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Zwei Reihen: Frage mit Helfer und Frage mit Fragewort vor dem Helfer</title>
  <rect width="480" height="200" fill="#f4efe2"/>
  <text x="12" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Frage mit Helfer</text>
  <rect x="12" y="36" width="59" height="38" rx="8" fill="#e6b800"/>
  <text x="41.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222">Does</text>
  <text x="41.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Helfer</text>
  <rect x="77" y="36" width="68" height="38" rx="8" fill="#2c6fd8"/>
  <text x="111.0" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">Amir</text>
  <text x="111.0" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Subjekt</text>
