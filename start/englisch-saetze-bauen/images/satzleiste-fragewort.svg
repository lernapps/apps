  <text x="12" y="120" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Das Fragewort stellt sich davor</text>
  <rect x="12" y="130" width="85" height="38" rx="8" fill="#17a2b8"/>
  <text x="54.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">Where</text>
