  <rect x="77" y="130" width="69" height="38" rx="8" fill="#2c6fd8"/>
  <text x="111.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">Peter</text>
  <text x="111.5" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Subjekt</text>
