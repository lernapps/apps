  <text x="203.0" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">like</text>
  <text x="203.0" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Verb ohne s</text>
