  <text x="294.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">pizza</text>
  <text x="294.5" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Objekt</text>
  <text x="12" y="214" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Verneinung: not hinter den Helfer</text>
