<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 106" role="img">
  <title>Satzleiste mit fünf Karten in einer Reihe: I, play, football, at home, on Monday</title>
  <rect width="480" height="106" fill="#f4efe2"/>
  <text x="12" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Aussage</text>
  <rect x="12" y="36" width="68" height="38" rx="8" fill="#2c6fd8"/>
  <text x="46.0" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">I</text>
  <text x="46.0" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Subjekt</text>
  <rect x="86" y="36" width="59" height="38" rx="8" fill="#c0392b"/>
  <text x="115.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">play</text>
  <text x="115.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Verb</text>
  <rect x="151" y="36" width="98" height="38" rx="8" fill="#138d75"/>
  <text x="200.0" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">football</text>
  <text x="200.0" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Objekt</text>
  <rect x="255" y="36" width="88" height="38" rx="8" fill="#d35400"/>
  <text x="299.0" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">at home</text>
  <text x="299.0" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Ort</text>
  <rect x="349" y="36" width="108" height="38" rx="8" fill="#8e44ad"/>
  <text x="403.0" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">on Monday</text>
  <text x="403.0" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Zeit</text>
</svg>
