<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Zwei Reihen: Frage nach dem Objekt mit Helfer und Frage nach dem Subjekt ohne Helfer</title>
  <rect width="480" height="200" fill="#f4efe2"/>
  <text x="12" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Frage nach dem Objekt: mit Helfer</text>
  <rect x="12" y="36" width="85" height="38" rx="8" fill="#17a2b8"/>
  <text x="54.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">Who</text>
  <text x="54.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Fragewort</text>
  <rect x="103" y="36" width="59" height="38" rx="8" fill="#e6b800"/>
  <text x="132.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222">does</text>
  <text x="132.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Helfer</text>
  <rect x="168" y="36" width="69" height="38" rx="8" fill="#2c6fd8"/>
  <text x="202.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">Ellie</text>
  <text x="202.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Subjekt</text>
  <rect x="243" y="36" width="59" height="38" rx="8" fill="#c0392b"/>
  <text x="272.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">like</text>
  <text x="272.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Verb</text>
  <text x="12" y="120" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Frage nach dem Subjekt: ohne Helfer</text>
  <rect x="12" y="130" width="205" height="38" rx="8" fill="#17a2b8"/>
  <text x="114.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">Who</text>
  <text x="114.5" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Fragewort statt Subjekt</text>
  <rect x="223" y="130" width="69" height="38" rx="8" fill="#c0392b"/>
  <text x="257.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">likes</text>
  <text x="257.5" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Verb</text>
  <rect x="298" y="130" width="59" height="38" rx="8" fill="#138d75"/>
  <text x="327.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">tea</text>
  <text x="327.5" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Objekt</text>
</svg>
