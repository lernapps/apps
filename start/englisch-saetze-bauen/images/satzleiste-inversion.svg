<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 252" role="img">
  <title>Zwei Reihen: normaler Satz I have never seen it und umgekehrter Satz Never have I seen it, der Helfer have springt hinter das verneinende Wort never</title>
  <rect width="480" height="252" fill="#f4efe2"/>
  <text x="12" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Normal</text>
  <rect x="12" y="36" width="68" height="38" rx="8" fill="#2c6fd8"/>
  <text x="46.0" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">I</text>
  <text x="46.0" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Subjekt</text>
  <rect x="86" y="36" width="59" height="38" rx="8" fill="#e6b800"/>
  <text x="115.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222">have</text>
  <text x="115.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Helfer</text>
  <rect x="151" y="36" width="94" height="38" rx="8" fill="#7f8c8d"/>
  <text x="198.0" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">never</text>
  <text x="198.0" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">verneinend</text>
  <rect x="251" y="36" width="59" height="38" rx="8" fill="#c0392b"/>
  <text x="280.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">seen</text>
  <text x="280.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Verb</text>
  <rect x="316" y="36" width="59" height="38" rx="8" fill="#138d75"/>
  <text x="345.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">it</text>
  <text x="345.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Objekt</text>
  <text x="12" y="120" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Umgekehrt: never zuerst, der Helfer springt vor das Subjekt</text>
  <rect x="12" y="130" width="94" height="38" rx="8" fill="#7f8c8d"/>
  <text x="59.0" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">Never</text>
  <text x="59.0" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">verneinend</text>
  <rect x="112" y="130" width="59" height="38" rx="8" fill="#e6b800"/>
  <text x="141.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222">have</text>
  <text x="141.5" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Helfer</text>
  <rect x="177" y="130" width="68" height="38" rx="8" fill="#2c6fd8"/>
  <text x="211.0" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">I</text>
  <text x="211.0" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Subjekt</text>
  <rect x="251" y="130" width="59" height="38" rx="8" fill="#c0392b"/>
  <text x="280.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">seen</text>
  <text x="280.5" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Verb</text>
  <rect x="316" y="130" width="59" height="38" rx="8" fill="#138d75"/>
  <text x="345.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">it</text>
  <text x="345.5" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Objekt</text>
</svg>
