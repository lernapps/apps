<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Zwei Reihen: eine Frage mit Does und die Kurzantwort mit dem Helfer does</title>
  <rect width="480" height="200" fill="#f4efe2"/>
  <text x="12" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Frage</text>
  <rect x="12" y="36" width="59" height="38" rx="8" fill="#e6b800"/>
  <text x="41.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222">Does</text>
  <text x="41.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Helfer</text>
  <rect x="77" y="36" width="69" height="38" rx="8" fill="#2c6fd8"/>
  <text x="111.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">Ellie</text>
  <text x="111.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Subjekt</text>
  <rect x="152" y="36" width="59" height="38" rx="8" fill="#c0392b"/>
  <text x="181.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">like</text>
  <text x="181.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Verb</text>
  <rect x="217" y="36" width="59" height="38" rx="8" fill="#138d75"/>
  <text x="246.5" y="61" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">tea</text>
  <text x="246.5" y="92" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Objekt</text>
  <text x="12" y="120" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Kurzantwort: nur der Helfer</text>
  <rect x="12" y="130" width="49" height="38" rx="8" fill="#5d6d7e"/>
  <text x="36.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">Yes</text>
  <text x="36.5" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Ja</text>
  <rect x="67" y="130" width="68" height="38" rx="8" fill="#2c6fd8"/>
  <text x="101.0" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff">she</text>
  <text x="101.0" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Subjekt</text>
  <rect x="141" y="130" width="59" height="38" rx="8" fill="#e6b800"/>
  <text x="170.5" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222">does</text>
  <text x="170.5" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333">Helfer</text>
</svg>
