<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>In Island ist es im Sommer meistens kühl.</span></label>

<li class="question-info" data-option="1"><p class="question-info-head"><strong>In Island ist es im Sommer meistens kühl.</strong></p><p>Das sagt, wie es normalerweise ist. Das ist Klima.</p></li>

</ul>
<p class="question-explanation">Wetter ist der kurze Zustand der Luft, hier ein Nachmittag. Die anderen Sätze beschreiben das Klima.</p>

<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Im Durchschnitt fällt in Bergen über das Jahr sehr viel Regen.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das ist ein Durchschnitt über viele Jahre. Das ist Klima.</p></li>

<li class="explainer-assessment-item" data-key="a12"><p class="explainer-assessment-label">Aufgabe 12</p><div class="question" id="frage-a12" data-id="a12" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Warum ist die Temperaturspanne in Moskau viel größer als in Brest?</legend>
<label class="question-option"><input type="radio" name="frage-a12" value="0"> <span>Moskau liegt weit vom Meer entfernt, und dem Land fehlt der Ausgleich durch das Wasser.</span></label>
<label class="question-option"><input type="radio" name="frage-a12" value="1"> <span>Moskau liegt viel höher auf einem Berg.</span></label>
<label class="question-option"><input type="radio" name="frage-a12" value="2"> <span>Der Golfstrom wärmt Moskau im Sommer besonders stark.</span></label>
<label class="question-option"><input type="radio" name="frage-a12" value="3"> <span>In Brest scheint die Sonne länger als in Moskau.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Moskau liegt weit vom Meer entfernt, und dem Land fehlt der Ausgleich durch das Wasser.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Land heizt sich im Sommer stark auf und kühlt im Winter stark aus. Das Meer gleicht beides aus, aber in Moskau ist es zu weit weg.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Moskau liegt viel höher auf einem Berg.</strong></p><p>Die Station in Moskau liegt auf etwa 156 m, Brest auf etwa 94 m. Das erklärt den Unterschied nicht.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Der Golfstrom wärmt Moskau im Sommer besonders stark.</strong></p><p>Die Strömung wärmt vor allem den Nordwesten Europas. Moskau ist zu weit entfernt.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>In Brest scheint die Sonne länger als in Moskau.</strong></p><p>Die Sonnenscheindauer erklärt den Unterschied der Spanne nicht. Entscheidend ist die Entfernung zum Meer.</p></li>
</ul>
<p class="question-explanation">Das Meer speichert Wärme und gleicht Sommer und Winter aus. Weit davon entfernt gibt es dieses Polster nicht.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Seeklima" rel="noopener">Seeklima (Wikipedia)</a></li>
</ul>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a13"><p class="explainer-assessment-label">Aufgabe 13</p><div class="question" id="frage-a13" data-id="a13" data-type="true-false">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Der Golfstrom bringt warmes Wasser aus den Tropen nach Norden und macht so das Klima in Nordwesteuropa milder.</legend>
<label class="question-option"><input type="radio" name="frage-a13" value="true"> <span>Stimmt</span></label>
<label class="question-option"><input type="radio" name="frage-a13" value="false"> <span>Stimmt nicht</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Die Aussage stimmt.</p>
<p class="question-explanation">Das warme Wasser gibt Wärme an die Luft ab. Darum sind Großbritannien und Norwegen milder, als es ihre Lage im Norden erwarten lässt.</p>
<p class="question-more">Mehr dazu:</p>

</form>
</div></li>

<fieldset>
<legend class="question-text">In welcher Zone ist es im Sommer trocken und sehr warm und im Winter mild mit Regen?</legend>
<label class="question-option"><input type="radio" name="frage-a14" value="0"> <span>im Mittelmeerklima</span></label>
<label class="question-option"><input type="radio" name="frage-a14" value="1"> <span>im ozeanischen Klima</span></label>
<label class="question-option"><input type="radio" name="frage-a14" value="2"> <span>im Kontinentalklima</span></label>
<label class="question-option"><input type="radio" name="frage-a14" value="3"> <span>im kalten Norden</span></label>
</fieldset>

<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>im Mittelmeerklima</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Dort wachsen Hartlaubwälder und Olivenbäume, die mit der Sommertrockenheit zurechtkommen.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>im ozeanischen Klima</strong></p><p>Im ozeanischen Klima regnet es fast das ganze Jahr, auch im Sommer.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>im Kontinentalklima</strong></p><p>Im Kontinentalklima sind die Winter kalt, nicht mild.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>im kalten Norden</strong></p><p>Im kalten Norden sind auch die Sommer kurz und kühl.</p></li>
</ul>
<p class="question-explanation">Trockener, sehr warmer Sommer und milder Winter mit Regen sind die Merkmale des Mittelmeerklimas.</p>

<div class="explainer-island" hidden><div class="klima-detektiv" data-v-bc07ee47><p data-v-bc07ee47>Wie sieht das Klimadiagramm für einen Ort in Europa aus? Du bekommst nur Hinweise zur Lage. Zeichne deine Vermutung für Temperatur und Niederschlag in allen zwölf Monaten.</p><div class="zd-hinweise" data-v-bc07ee47><p class="zd-hinweiskopf" data-v-bc07ee47>Hinweise zum Ort</p><ul data-v-bc07ee47><li data-v-bc07ee47>Breite: 64,1 °N</li><li data-v-bc07ee47>Höhe der Messstation: 52 m</li><li data-v-bc07ee47>Lage: Hauptstadt auf einer Insel im Nordatlantik, direkt am Meer</li></ul></div><p data-v-bc07ee47>Wähle erst, ob du gerade die Temperatur oder den Niederschlag zeichnest. Tippe dann im Achsenkreuz in einem Monat auf die Höhe, die du für richtig hältst. Oder wähle den Monat und schreibe die Zahl in das Feld. Mit der Tastatur: Tab bringt dich zu den Monaten, Pfeil hoch und runter ändern den Wert, Pfeil links und rechts wechseln den Monat. Wenn du alle zwölf Temperaturen gezeichnet hast, wechselt die Auswahl von selbst zum Niederschlag. Zeichne alle zwölf Monate.</p><fieldset class="zd-reihe" data-v-bc07ee47><legend data-v-bc07ee47>Du zeichnest gerade</legend><label data-v-bc07ee47><input checked type="radio" value="t" data-v-bc07ee47> Temperatur (rote Linie)</label><label data-v-bc07ee47><input type="radio" value="n" data-v-bc07ee47> Niederschlag (blaue Säulen)</label></fieldset><svg viewBox="0 0 480 420" role="group" aria-label="Achsenkreuz für das Klimadiagramm, in das du deine Vermutung einträgst. Links die Temperatur in °C, rechts der Niederschlag in mm, unten die zwölf Monate." data-v-bc07ee47><g class="zd-gitter" data-v-bc07ee47><!--[--><line x1="46" x2="424" y1="392" y2="392" data-v-bc07ee47></line><line x1="46" x2="424" y1="350.66666666666663" y2="350.66666666666663" data-v-bc07ee47></line><line x1="46" x2="424" y1="309.3333333333333" y2="309.3333333333333" data-v-bc07ee47></line><line x1="46" x2="424" y1="268" y2="268" data-v-bc07ee47></line><line x1="46" x2=
