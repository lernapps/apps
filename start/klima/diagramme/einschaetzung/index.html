<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="true-false">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ein Monat ist humid, wenn die Niederschlagssäule über der roten Linie endet.</legend>
<label class="question-option"><input type="radio" name="frage-a1" value="true"> <span>Stimmt</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="false"> <span>Stimmt nicht</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Die Aussage stimmt.</p>
<p class="question-explanation">Über der Linie heißt: Es fällt mehr Niederschlag, als bei dieser Temperatur verdunstet. Der Monat ist humid.</p>

<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="true-false">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In einem Klimadiagramm zeichnest du die Temperatur als Linie und den Niederschlag als Säulen.</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="true"> <span>Stimmt</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="false"> <span>Stimmt nicht</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Die Aussage stimmt.</p>
<p class="question-explanation">Die Temperatur ändert sich von Monat zu Monat fließend, dafür passt die Linie. Der Niederschlag ist eine Menge pro Monat, dafür passen Säulen.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Klimadiagramm" rel="noopener" title="Klimadiagramm (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Klimadiagramm (Wikipedia)</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In Reykjavik fallen im Juli 50 mm Niederschlag. Auf welcher Zahl der linken Achse endet die Säule, wenn 10 °C auf gleicher Höhe liegen wie 20 mm? Bis 1 daneben zählt noch als richtig.</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a5">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 25 (erlaubte Abweichung: 1)</p>
<p class="question-explanation">50 mm sind auf der rechten Achse bei 50. Die linke Achse hat halb so große Zahlen, also endet die Säule dort bei 25.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Klimadiagramm" rel="noopener" title="Klimadiagramm (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Klimadiagramm (Wikipedia)</span></a></p>
</div>
