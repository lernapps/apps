<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 5 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welcher Satz beschreibt das Wetter?</legend>
<label class="question-option"><input type="radio" name="frage-a1" value="0"> <span>Heute Nachmittag zieht ein Gewitter über Köln.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="1"> <span>In Island ist es im Sommer meistens kühl.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="2"> <span>In der Sahara regnet es sehr selten.</span></label>
<label class="question-option"><input type="radio" name="frage-a1" value="3"> <span>In Norwegen gibt es lange, kalte Winter.</span></label>
</fieldset>
<div class="question-feedback" role="status"></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Heute Nachmittag zieht ein Gewitter über Köln.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das gilt für einen Nachmittag. Ein kurzer Zustand der Luft ist Wetter.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>In Island ist es im Sommer meistens kühl.</strong></p><p>Das sagt, wie es normalerweise ist. Das ist Klima.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>In der Sahara regnet es sehr selten.</strong></p><p>Das gilt über viele Jahre. Das ist Klima.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>In Norwegen gibt es lange, kalte Winter.</strong></p><p>Das beschreibt das Übliche an einem Ort. Das ist Klima.</p></li>
</ul>
<p class="question-explanation">Wetter ist der kurze Zustand der Luft, hier ein Nachmittag. Die anderen Sätze beschreiben das Klima.</p>
<p class="question-more">Mehr dazu:</p>
<ul class="question-links">
<li><a href="https://de.wikipedia.org/wiki/Wetter" rel="noopener">Wetter (Wikipedia)</a></li>

</form>
</div></li>

<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Im Durchschnitt fällt in Bergen über das Jahr sehr viel Regen.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das ist ein Durchschnitt über viele Jahre. Das ist Klima.</p></li>

</ul>
<p class="question-explanation">Klima beschreibt das Übliche über viele Jahre. Einzelne Tage sind Wetter.</p>
