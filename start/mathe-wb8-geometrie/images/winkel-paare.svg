<svg xmlns="http://www.w3.org/2000/svg" width="340" height="220" viewBox="0 0 340 220" font-family="sans-serif" font-size="13">
  <title>Zwei parallele Geraden g und h, geschnitten von der Geraden s. An g liegen die Winkel alpha rechts oben, beta links oben und gamma links unten. An h liegt delta rechts oben</title>
  <rect width="340" height="220" fill="#ffffff"/>
  <line x1="15" y1="65" x2="325" y2="65" stroke="#374151" stroke-width="2.2"/>
  <line x1="15" y1="165" x2="325" y2="165" stroke="#374151" stroke-width="2.2"/>
  <polyline points="295,60 302,65 295,70" fill="none" stroke="#374151" stroke-width="2"/>
  <polyline points="295,160 302,165 295,170" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="126.7" y1="15" x2="219.9" y2="215" stroke="#374151" stroke-width="2.2"/>
  <path d="M150,65 L176,65 A26,26 0 0 0 139,41.4 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="171.5" y="36.3" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">α</text>
  <path d="M150,65 L139,41.4 A26,26 0 0 0 124,65 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="116.3" y="48.5" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">β</text>
  <path d="M150,65 L124,65 A26,26 0 0 0 161,88.6 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="128.5" y="103.7" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">γ</text>
  <path d="M196.6,165 L222.6,165 A26,26 0 0 0 185.6,141.4 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="218.1" y="136.3" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">δ</text>
  <text x="22" y="57" fill="#111827" font-weight="bold" font-size="14">g</text>
  <text x="22" y="157" fill="#111827" font-weight="bold" font-size="14">h</text>
  <text x="227.9" y="215" fill="#111827" font-weight="bold" font-size="14">s</text>
</svg>
