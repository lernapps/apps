<svg xmlns="http://www.w3.org/2000/svg" width="340" height="270" viewBox="0 0 340 270" font-family="sans-serif" font-size="14">
  <title>Vier Dreiecke, die gegebenen Stücke blau: SSS drei Seiten; SWS die Seiten b und c mit dem Winkel α dazwischen; WSW die Seite c mit α und β; SsW die Seiten a und b mit β, der längeren Seite b gegenüber</title>
  <rect width="340" height="270" fill="#ffffff"/>
  <line x1="170" y1="8" x2="170" y2="262" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="8" y1="135" x2="332" y2="135" stroke="#e5e7eb" stroke-width="1"/>
  <g>
    <text x="10" y="20" fill="#1f2937" font-weight="bold">SSS</text>
    <line x1="20" y1="110" x2="150" y2="110" stroke="#2563eb" stroke-width="3.5"/>
    <line x1="150" y1="110" x2="95" y2="40" stroke="#2563eb" stroke-width="3.5"/>
    <line x1="95" y1="40" x2="20" y2="110" stroke="#2563eb" stroke-width="3.5"/>
    <text x="130" y="70" fill="#1e3a8a" font-weight="bold">a</text>
    <text x="44" y="70" fill="#1e3a8a" font-weight="bold">b</text>
    <text x="81" y="128" fill="#1e3a8a" font-weight="bold">c</text>
  </g>
  <g transform="translate(170 0)">
    <text x="10" y="20" fill="#1f2937" font-weight="bold">SWS</text>
    <path d="M20 110 L38 110 A18 18 0 0 0 33.2 97.7 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="150" y1="110" x2="95" y2="40" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="20" y1="110" x2="150" y2="110" stroke="#2563eb" stroke-width="3.5"/>
    <line x1="95" y1="40" x2="20" y2="110" stroke="#2563eb" stroke-width="3.5"/>
    <text x="130" y="70" fill="#6b7280">a</text>
    <text x="44" y="70" fill="#1e3a8a" font-weight="bold">b</text>
    <text x="81" y="128" fill="#1e3a8a" font-weight="bold">c</text>
    <text x="40" y="104" fill="#1e3a8a" font-weight="bold">α</text>
  </g>
  <g transform="translate(0 135)">
    <text x="10" y="20" fill="#1f2937" font-weight="bold">WSW</text>
    <path d="M20 110 L38 110 A18 18 0 0 0 33.2 97.7 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M150 110 L132 110 A18 18 0 0 1 138.9 95.9 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="150" y1="110" x2="95" y2="40" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="95" y1="40" x2="20" y2="110" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="20" y1="110" x2="150" y2="110" stroke="#2563eb" stroke-width="3.5"/>
    <text x="130" y="70" fill="#6b7280">a</text>
    <text x="44" y="70" fill="#6b7280">b</text>
    <text x="81" y="128" fill="#1e3a8a" font-weight="bold">c</text>
    <text x="40" y="104" fill="#1e3a8a" font-weight="bold">α</text>
    <text x="120" y="104" fill="#1e3a8a" font-weight="bold">β</text>
  </g>
  <g transform="translate(170 135)">
    <text x="10" y="20" fill="#1f2937" font-weight="bold">SsW</text>
    <path d="M150 110 L132 110 A18 18 0 0 1 138.9 95.9 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="20" y1="110" x2="150" y2="110" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="150" y1="110" x2="95" y2="40" stroke="#2563eb" stroke-width="3.5"/>
    <line x1="95" y1="40" x2="20" y2="110" stroke="#2563eb" stroke-width="3.5"/>
    <text x="130" y="70" fill="#1e3a8a" font-weight="bold">a</text>
    <text x="44" y="70" fill="#1e3a8a" font-weight="bold">b</text>
    <text x="81" y="128" fill="#6b7280">c</text>
    <text x="120" y="104" fill="#1e3a8a" font-weight="bold">β</text>
  </g>
</svg>
