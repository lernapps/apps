<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" font-family="sans-serif" font-size="14">
  <title>Ein Dreieck mit den Ecken A, B und C; die drei Seiten sind mit 1, 2 und 3 nummeriert</title>
  <rect width="340" height="200" fill="#ffffff"/>
  <polygon points="40,170 300,170 200,40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="22" y="185" fill="#1f2937" font-weight="bold">A</text>
  <text x="306" y="185" fill="#1f2937" font-weight="bold">B</text>
  <text x="195" y="30" fill="#1f2937" font-weight="bold">C</text>
  <circle cx="170" cy="187" r="10" fill="#ffffff" stroke="#374151"/>
  <text x="166" y="192" fill="#1f2937">1</text>
  <circle cx="264" cy="98" r="10" fill="#ffffff" stroke="#374151"/>
  <text x="260" y="103" fill="#1f2937">2</text>
  <circle cx="106" cy="96" r="10" fill="#ffffff" stroke="#374151"/>
  <text x="102" y="101" fill="#1f2937">3</text>
</svg>
