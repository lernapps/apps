<svg xmlns="http://www.w3.org/2000/svg" width="340" height="160" viewBox="0 0 340 160" font-family="sans-serif" font-size="14">
  <title>Links ein blau gefülltes Rechteck mit den Seiten a und b: der Flächeninhalt. Rechts dasselbe Rechteck, nur der Rand orange: der Umfang mit den Seiten a, b, a, b</title>
  <rect width="340" height="160" fill="#ffffff"/>
  <text x="20" y="20" fill="#1e3a8a" font-weight="bold">Flächeninhalt A</text>
  <rect x="20" y="48" width="130" height="80" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="85" y="94" fill="#1e3a8a" font-weight="bold" font-size="18" text-anchor="middle">A</text>
  <text x="85" y="148" fill="#1e3a8a" font-weight="bold" text-anchor="middle">a</text>
  <text x="8" y="93" fill="#1e3a8a" font-weight="bold" text-anchor="middle">b</text>
  <text x="180" y="20" fill="#9a3412" font-weight="bold">Umfang u</text>
  <rect x="185" y="48" width="130" height="80" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
  <text x="250" y="42" fill="#9a3412" font-weight="bold" text-anchor="middle">a</text>
  <text x="250" y="148" fill="#9a3412" font-weight="bold" text-anchor="middle">a</text>
  <text x="174" y="93" fill="#9a3412" font-weight="bold" text-anchor="middle">b</text>
  <text x="326" y="93" fill="#9a3412" font-weight="bold" text-anchor="middle">b</text>
</svg>
