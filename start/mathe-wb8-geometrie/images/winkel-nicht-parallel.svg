<svg xmlns="http://www.w3.org/2000/svg" width="340" height="220" viewBox="0 0 340 220" font-family="sans-serif" font-size="13">
  <title>Zwei Geraden g und h, die nach rechts aufeinander zulaufen, also nicht parallel sind. Die Gerade s schneidet beide. Bei g ist der blaue Winkel alpha markiert, bei h an derselben Stelle der orange Winkel beta</title>
  <rect width="340" height="220" fill="#ffffff"/>
  <line x1="15" y1="40" x2="325" y2="85" stroke="#374151" stroke-width="2.2"/>
  <line x1="15" y1="185" x2="325" y2="135" stroke="#374151" stroke-width="2.2"/>
  <line x1="95" y1="10" x2="205" y2="210" stroke="#374151" stroke-width="2.2"/>
  <path d="M119.9,55.2 L149.6,59.5 A30,30 0 0 0 105.4,28.9 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="144.9" y="24.1" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">α</text>
  <path d="M176.9,158.9 L206.5,154.1 A30,30 0 0 0 162.4,132.6 Z" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="196.2" y="124.3" fill="#9a3412" font-weight="bold" font-size="14" text-anchor="middle">β</text>
  <text x="22" y="33" fill="#111827" font-weight="bold" font-size="14">g</text>
  <text x="22" y="208" fill="#111827" font-weight="bold" font-size="14">h</text>
  <text x="77" y="28" fill="#111827" font-weight="bold" font-size="14">s</text>
</svg>
