<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" font-family="sans-serif" font-size="13">
  <title>Zwei Geraden schneiden sich in einem Punkt. Vier Winkel: alpha rechts und gamma links sind blau, beta oben und delta unten sind lila</title>
  <rect width="340" height="200" fill="#ffffff"/>
  <line x1="314.9" y1="61.2" x2="25.1" y2="138.8" stroke="#374151" stroke-width="2.2"/>
  <line x1="84" y1="-22.9" x2="256" y2="222.9" stroke="#374151" stroke-width="2.2"/>
  <path d="M170,100 L189.5,127.9 A34,34 0 0 0 202.8,91.2 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="217" y="122.1" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">α</text>
  <path d="M170,100 L202.8,91.2 A34,34 0 0 0 150.5,72.1 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="187.1" y="58" fill="#5b21b6" font-weight="bold" font-size="14" text-anchor="middle">β</text>
  <path d="M170,100 L150.5,72.1 A34,34 0 0 0 137.2,108.8 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="123" y="87.9" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">γ</text>
  <path d="M170,100 L137.2,108.8 A34,34 0 0 0 189.5,127.9 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="152.9" y="152" fill="#5b21b6" font-weight="bold" font-size="14" text-anchor="middle">δ</text>
</svg>
