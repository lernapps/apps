<svg xmlns="http://www.w3.org/2000/svg" width="320" height="140" viewBox="0 0 320 140" font-family="sans-serif" font-size="14">
  <title>Links ein Parallelogramm mit Grundseite g und Höhe h, links ein orange Dreieck abgeschnitten. Rechts ist das Dreieck an der anderen Seite angelegt, es entsteht ein Rechteck</title>
  <rect width="320" height="140" fill="#ffffff"/>
  <defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <polygon points="40,110 120,110 150,40 40,40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <polygon points="10,110 40,110 40,40" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <line x1="40" y1="40" x2="40" y2="110" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="82" fill="#111827" font-weight="bold">h</text>
  <text x="65" y="130" fill="#1e3a8a" font-weight="bold" text-anchor="middle">g</text>
  <line x1="160" y1="75" x2="182" y2="75" stroke="#374151" stroke-width="2" marker-end="url(#pf)"/>
  <polygon points="190,110 270,110 300,40 190,40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <polygon points="270,110 300,110 300,40" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <line x1="190" y1="40" x2="190" y2="110" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="196" y="82" fill="#111827" font-weight="bold">h</text>
  <text x="245" y="130" fill="#1e3a8a" font-weight="bold" text-anchor="middle">g</text>
</svg>
