<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" font-family="sans-serif" font-size="14">
  <title>Ein Dreieck mit den Seiten a, b und c in einem Rechteck mit derselben Grundseite g und derselben Höhe h</title>
  <rect width="320" height="200" fill="#ffffff"/>
  <rect x="30" y="30" width="240" height="130" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polygon points="30,160 270,160 110,30" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="110" y1="30" x2="110" y2="160" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polyline points="110,148 122,148 122,160" fill="none" stroke="#ea580c" stroke-width="1.5"/>
  <text x="116" y="110" fill="#9a3412" font-weight="bold">h</text>
  <text x="125" y="182" fill="#1e3a8a" font-weight="bold">g = c</text>
  <text x="56" y="100" fill="#1e3a8a" font-weight="bold">b</text>
  <text x="196" y="92" fill="#1e3a8a" font-weight="bold">a</text>
  <text x="40" y="52" fill="#374151">Teil 1</text>
  <text x="220" y="52" fill="#374151">Teil 2</text>
</svg>
