<svg xmlns="http://www.w3.org/2000/svg" width="320" height="172" viewBox="0 0 320 172" font-family="sans-serif" font-size="14">
  <title>Ein Parallelogramm. Unten eine Seite mit 8 cm, links eine Seite mit 5 cm, innen eine gestrichelte Strecke mit 4 cm, die im rechten Winkel auf der unteren Seite steht</title>
  <rect width="320" height="172" fill="#ffffff"/>
  <polygon points="20,140 220,140 295,40 95,40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <line x1="95" y1="40" x2="95" y2="140" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <polyline points="95,128 107,128 107,140" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="120" y="162" fill="#1e3a8a" font-weight="bold" text-anchor="middle">8 cm</text>
  <text x="16" y="84" fill="#1e3a8a" font-weight="bold">5 cm</text>
  <text x="101" y="96" fill="#111827" font-weight="bold">4 cm</text>
</svg>
