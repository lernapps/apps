<svg xmlns="http://www.w3.org/2000/svg" width="330" height="230" viewBox="0 0 330 230" font-family="sans-serif" font-size="13">
  <title>Koordinatensystem, x von 0 bis 8, y von 0 bis 5. Die senkrechte Spiegelachse g geht durch alle Punkte mit x = 4. Links davon liegt der Punkt P bei (1|3)</title>
  <rect width="330" height="230" fill="#ffffff"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="68" y1="200" x2="68" y2="40"/>
    <line x1="100" y1="200" x2="100" y2="40"/>
    <line x1="132" y1="200" x2="132" y2="40"/>
    <line x1="164" y1="200" x2="164" y2="40"/>
    <line x1="196" y1="200" x2="196" y2="40"/>
    <line x1="228" y1="200" x2="228" y2="40"/>
    <line x1="260" y1="200" x2="260" y2="40"/>
    <line x1="292" y1="200" x2="292" y2="40"/>
    <line x1="36" y1="168" x2="292" y2="168"/>
    <line x1="36" y1="136" x2="292" y2="136"/>
    <line x1="36" y1="104" x2="292" y2="104"/>
    <line x1="36" y1="72" x2="292" y2="72"/>
    <line x1="36" y1="40" x2="292" y2="40"/>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <line x1="36" y1="200" x2="307" y2="200"/><polyline points="300,195 307,200 300,205"/>
    <line x1="36" y1="200" x2="36" y2="28"/><polyline points="31,35 36,28 41,35"/>
  </g>
  <g fill="#374151" text-anchor="middle">
    <text x="36" y="218">0</text><text x="68" y="218">1</text><text x="100" y="218">2</text><text x="132" y="218">3</text><text x="164" y="218">4</text><text x="196" y="218">5</text><text x="228" y="218">6</text><text x="260" y="218">7</text><text x="292" y="218">8</text>
  </g>
  <g fill="#374151" text-anchor="end">
    <text x="28" y="173">1</text><text x="28" y="141">2</text><text x="28" y="109">3</text><text x="28" y="77">4</text><text x="28" y="45">5</text>
  </g>
  <text x="310" y="205" fill="#111827" font-weight="bold" font-size="13">x</text>
  <text x="45" y="30" fill="#111827" font-weight="bold" font-size="13">y</text>
  <line x1="164" y1="206" x2="164" y2="34" stroke="#2563eb" stroke-width="2.5"/>
  <text x="170" y="44" fill="#1e3a8a" font-weight="bold" font-size="14">g</text>
  <circle cx="68" cy="104" r="5" fill="#2563eb"/>
  <text x="75" y="97" fill="#1e3a8a" font-weight="bold" font-size="14">P</text>
</svg>
