<svg xmlns="http://www.w3.org/2000/svg" width="260" height="182" viewBox="0 0 260 182" font-family="sans-serif" font-size="14">
  <title>Ein blaues Trapez mit den parallelen Seiten a unten und c oben und der Höhe h. Daneben dasselbe Trapez grau und auf den Kopf gestellt. Zusammen bilden sie ein Parallelogramm mit der Grundseite a + c</title>
  <rect width="260" height="182" fill="#ffffff"/>
  <polygon points="20,120 140,120 120,50 60,50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <polygon points="140,120 200,120 240,50 120,50" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="60" y1="50" x2="60" y2="120" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="66" y="98" fill="#9a3412" font-weight="bold">h</text>
  <text x="80" y="140" fill="#1e3a8a" font-weight="bold" text-anchor="middle">a</text>
  <text x="90" y="42" fill="#1e3a8a" font-weight="bold" text-anchor="middle">c</text>
  <text x="170" y="140" fill="#374151" font-weight="bold" text-anchor="middle">c</text>
  <text x="180" y="42" fill="#374151" font-weight="bold" text-anchor="middle">a</text>
  <line x1="20" y1="152" x2="200" y2="152" stroke="#111827" stroke-width="1.5"/>
  <line x1="20" y1="147" x2="20" y2="157" stroke="#111827" stroke-width="1.5"/>
  <line x1="200" y1="147" x2="200" y2="157" stroke="#111827" stroke-width="1.5"/>
  <text x="110" y="172" fill="#111827" font-weight="bold" text-anchor="middle">a + c</text>
</svg>
