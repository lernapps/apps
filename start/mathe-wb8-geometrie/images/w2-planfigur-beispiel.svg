<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" font-family="sans-serif" font-size="14">
  <title>Planfigur zu b = 4 cm, c = 6 cm, α = 50°: die Seiten b und c und der Winkel α sind blau, die übrigen Stücke grau</title>
  <rect width="340" height="200" fill="#ffffff"/>
  <path d="M40 170 L72 170 A32 32 0 0 0 64.8 149.8 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
