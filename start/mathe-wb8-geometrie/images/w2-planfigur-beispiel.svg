  <line x1="40" y1="170" x2="300" y2="170" stroke="#2563eb" stroke-width="3.5"/>
  <line x1="40" y1="170" x2="200" y2="40" stroke="#2563eb" stroke-width="3.5"/>
  <path d="M272 170 A28 28 0 0 1 282.9 147.8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M179.8 56.4 A26 26 0 0 0 215.9 60.6" fill="none" stroke="#6b7280" stroke-width="1.5"/>
