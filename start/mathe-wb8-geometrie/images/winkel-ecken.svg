<svg xmlns="http://www.w3.org/2000/svg" width="340" height="175" viewBox="0 0 340 175" font-family="sans-serif" font-size="13">
  <title>Links ein Dreieck ABC mit den Winkeln alpha bei A (blau), beta bei B (lila) und gamma bei C (grün). Rechts die drei abgerissenen Ecken, mit den Spitzen an einem Punkt aneinandergelegt, auf einer gestrichelten Geraden</title>
  <rect width="340" height="175" fill="#ffffff"/>
  <text x="15" y="20" fill="#374151" font-size="13">Dreieck</text>
  <polygon points="15,145 165,145 60,40" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <path d="M15,145 L43,145 A28,28 0 0 0 26,119.3 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="50.1" y="126.9" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">α</text>
  <path d="M165,145 L145.2,125.2 A28,28 0 0 0 137,145 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="126.2" y="133.9" fill="#5b21b6" font-weight="bold" font-size="14" text-anchor="middle">β</text>
  <path d="M60,40 L49,65.7 A28,28 0 0 0 79.8,59.8 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="68.3" y="88.2" fill="#14532d" font-weight="bold" font-size="14" text-anchor="middle">γ</text>
  <text x="13" y="165" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">A</text>
  <text x="165" y="165" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">B</text>
  <text x="56" y="32" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">C</text>
  <text x="196" y="20" fill="#374151" font-size="13">Ecken aneinander</text>
  <line x1="190" y1="145" x2="334" y2="145" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M262,145 L310,145 A48,48 0 0 0 295.9,111.1 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M262,145 L295.9,111.1 A48,48 0 0 0 243.1,100.9 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <path d="M262,145 L243.1,100.9 A48,48 0 0 0 214,145 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="291.6" y="137.8" fill="#5b21b6" font-weight="bold" font-size="14" text-anchor="middle">β</text>
  <text x="268.1" y="118.6" fill="#14532d" font-weight="bold" font-size="14" text-anchor="middle">γ</text>
  <text x="235.3" y="132.4" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">α</text>
</svg>
