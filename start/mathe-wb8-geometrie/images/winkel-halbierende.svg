<svg xmlns="http://www.w3.org/2000/svg" width="340" height="240" viewBox="0 0 340 240" font-family="sans-serif" font-size="13">
  <title>Zwei parallele Geraden g oben und h unten, geschnitten von der Geraden s. Bei g ist rechts oberhalb von g der blaue Winkel alpha markiert. Bei h ist der Winkel zwischen h nach links und s nach oben von der Winkelhalbierenden w in zwei gleiche lila Hälften geteilt. w trifft g. Dort ist der orange Winkel epsilon zwischen g nach rechts und w markiert</title>
  <rect width="340" height="240" fill="#ffffff"/>
  <line x1="15" y1="65" x2="325" y2="65" stroke="#374151" stroke-width="2.2"/>
  <line x1="15" y1="200" x2="325" y2="200" stroke="#374151" stroke-width="2.2"/>
  <polyline points="300,60 307,65 300,70" fill="none" stroke="#374151" stroke-width="2"/>
  <polyline points="300,195 307,200 300,205" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="262.3" y1="31.2" x2="163.5" y2="233.8" stroke="#374151" stroke-width="2.2"/>
  <line x1="180" y1="200" x2="80.5" y2="40.7" stroke="#6b7280" stroke-width="2.2"/>
  <path d="M245.8,65 L273.8,65 A28,28 0 0 0 258.1,39.8 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="281.5" y="47.7" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">α</text>
  <path d="M180,200 L194.9,169.4 A34,34 0 0 0 162,171.2 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M180,200 L162,171.2 A34,34 0 0 0 146,200 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="178.5" y1="171" x2="178" y2="161.1" stroke="#7c3aed" stroke-width="2"/>
  <line x1="154.6" y1="185.9" x2="145.9" y2="181.1" stroke="#7c3aed" stroke-width="2"/>
  <path d="M95.6,65 L111.5,90.4 A30,30 0 0 0 125.6,65 Z" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="135.9" y="92.3" fill="#9a3412" font-weight="bold" font-size="14" text-anchor="middle">ε</text>
  <text x="22" y="57" fill="#111827" font-weight="bold" font-size="14">g</text>
  <text x="22" y="192" fill="#111827" font-weight="bold" font-size="14">h</text>
  <text x="173.5" y="231.8" fill="#111827" font-weight="bold" font-size="14">s</text>
  <text x="64.5" y="54.7" fill="#374151" font-weight="bold" font-size="14">w</text>
</svg>
