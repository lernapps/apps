  <text x="55" y="160" fill="#374151" font-size="13" text-anchor="middle">senkrecht</text>
  <text x="170" y="160" fill="#374151" font-size="13" text-anchor="middle">waagerecht</text>
  <text x="285" y="160" fill="#374151" font-size="13" text-anchor="middle">beides</text>
