  <title>Die Buchstaben A, B und H. Durch A geht eine senkrechte Symmetrieachse, durch B eine waagerechte, durch H beide</title>
  <rect width="340" height="170" fill="#ffffff"/>
  <path d="M25,120 L55,40 L85,120 M37,90 H73" fill="none" stroke="#2563eb" stroke-width="9" stroke-linejoin="round"/>
  <path d="M145,40 V120 H175 A20,20 0 0 0 175,80 A20,20 0 0 0 175,40 Z M145,80 H175" fill="none" stroke="#2563eb" stroke-width="9" stroke-linejoin="round"/>
  <path d="M255,40 V120 M315,40 V120 M255,80 H315" fill="none" stroke="#2563eb" stroke-width="9"/>
  <line x1="55" y1="22" x2="55" y2="138" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="128" y1="80" x2="212" y2="80" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="285" y1="22" x2="285" y2="138" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 5"/>
