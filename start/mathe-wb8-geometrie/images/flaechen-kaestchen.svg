<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180" viewBox="0 0 300 180" font-family="sans-serif" font-size="14">
  <title>Ein blaues Rechteck aus Kästchen, jedes Kästchen 1 cm mal 1 cm</title>
  <rect width="300" height="180" fill="#ffffff"/>
  <rect x="50" y="20" width="200" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="90" y1="20" x2="90" y2="140" stroke="#2563eb" stroke-width="1"/>
  <line x1="130" y1="20" x2="130" y2="140" stroke="#2563eb" stroke-width="1"/>
  <line x1="170" y1="20" x2="170" y2="140" stroke="#2563eb" stroke-width="1"/>
  <line x1="210" y1="20" x2="210" y2="140" stroke="#2563eb" stroke-width="1"/>
  <line x1="50" y1="60" x2="250" y2="60" stroke="#2563eb" stroke-width="1"/>
  <line x1="50" y1="100" x2="250" y2="100" stroke="#2563eb" stroke-width="1"/>
  <line x1="50" y1="150" x2="90" y2="150" stroke="#111827" stroke-width="1.5"/>
  <line x1="50" y1="145" x2="50" y2="155" stroke="#111827" stroke-width="1.5"/>
  <line x1="90" y1="145" x2="90" y2="155" stroke="#111827" stroke-width="1.5"/>
  <text x="70" y="170" fill="#111827" text-anchor="middle">1 cm</text>
</svg>
