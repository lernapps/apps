<svg xmlns="http://www.w3.org/2000/svg" width="340" height="210" viewBox="0 0 340 210" font-family="sans-serif" font-size="13">
  <title>Links ein spitzwinkliges Dreieck mit der Höhe innen, rechts ein stumpfwinkliges Dreieck mit der Höhe außen und der Verlängerung x der Grundseite</title>
  <rect width="340" height="210" fill="#ffffff"/>
  <text x="20" y="20" fill="#374151">Höhe innen</text>
  <polygon points="20,170 150,170 90,50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <line x1="90" y1="50" x2="90" y2="170" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polyline points="90,160 100,160 100,170" fill="none" stroke="#ea580c" stroke-width="1.5"/>
  <text x="95" y="120" fill="#9a3412" font-weight="bold">h</text>
  <text x="75" y="190" fill="#1e3a8a" font-weight="bold">g</text>
  <text x="190" y="20" fill="#374151">Höhe außen</text>
  <line x1="200" y1="170" x2="250" y2="170" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 4"/>
  <polygon points="250,170 330,170 200,70" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <line x1="200" y1="70" x2="200" y2="170" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polyline points="200,160 210,160 210,170" fill="none" stroke="#ea580c" stroke-width="1.5"/>
  <text x="182" y="125" fill="#9a3412" font-weight="bold">h</text>
  <text x="285" y="190" fill="#1e3a8a" font-weight="bold">g</text>
  <text x="220" y="190" fill="#4b5563" font-weight="bold">x</text>
</svg>
