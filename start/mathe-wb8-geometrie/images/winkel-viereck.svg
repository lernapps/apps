<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" font-family="sans-serif" font-size="13">
  <title>Ein Viereck ABCD mit den Winkeln alpha, beta, gamma und delta. Die gestrichelte Diagonale AC teilt es in zwei Dreiecke, ein blaues und ein lila</title>
  <rect width="340" height="200" fill="#ffffff"/>
  <polygon points="30,165 245,175 310,60" fill="#dbeafe" stroke="none"/>
  <polygon points="30,165 310,60 95,35" fill="#ede9fe" stroke="none"/>
  <polygon points="30,165 245,175 310,60 95,35" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="30" y1="165" x2="310" y2="60" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="7 5"/>
  <path d="M54,166.1 A24,24 0 0 0 40.7,143.5" fill="none" stroke="#111827" stroke-width="1.8"/>
  <text x="62.8" y="150.8" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">α</text>
  <path d="M256.8,154.1 A24,24 0 0 0 221,173.9" fill="none" stroke="#111827" stroke-width="1.8"/>
  <text x="226.6" y="146.7" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">β</text>
  <path d="M286.2,57.2 A24,24 0 0 0 298.2,80.9" fill="none" stroke="#111827" stroke-width="1.8"/>
  <text x="276.1" y="82.2" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">γ</text>
  <path d="M84.3,56.5 A24,24 0 0 0 118.8,37.8" fill="none" stroke="#111827" stroke-width="1.8"/>
  <text x="113.1" y="73.4" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">δ</text>
  <text x="20" y="181" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">A</text>
  <text x="249" y="195" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">B</text>
  <text x="322" y="64" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">C</text>
  <text x="91" y="26" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">D</text>
</svg>
