<svg xmlns="http://www.w3.org/2000/svg" width="260" height="256" viewBox="0 0 260 256" font-family="sans-serif" font-size="14">
  <title>Das Netz eines Quaders mit den Kanten a, b und c: sechs Rechtecke, je zwei gleiche in derselben Farbe, beschriftet mit a · b, a · c und b · c</title>
  <rect width="260" height="256" fill="#ffffff"/>
  <rect x="70" y="25" width="120" height="50" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="130.0" y="55.0" fill="#111827" font-weight="bold" font-size="13" text-anchor="middle">a · c</text>
  <rect x="70" y="75" width="120" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130.0" y="110.0" fill="#111827" font-weight="bold" font-size="13" text-anchor="middle">a · b</text>
  <rect x="70" y="135" width="120" height="50" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="130.0" y="165.0" fill="#111827" font-weight="bold" font-size="13" text-anchor="middle">a · c</text>
  <rect x="70" y="185" width="120" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130.0" y="220.0" fill="#111827" font-weight="bold" font-size="13" text-anchor="middle">a · b</text>
  <rect x="20" y="75" width="50" height="60" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="45.0" y="110.0" fill="#111827" font-weight="bold" font-size="13" text-anchor="middle">b · c</text>
  <rect x="190" y="75" width="50" height="60" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="215.0" y="110.0" fill="#111827" font-weight="bold" font-size="13" text-anchor="middle">b · c</text>
  <text x="130" y="18" fill="#111827" font-weight="bold" text-anchor="middle">a</text>
  <text x="10" y="110" fill="#111827" font-weight="bold" text-anchor="middle">b</text>
  <text x="60" y="55" fill="#111827" font-weight="bold" text-anchor="middle">c</text>
</svg>
