<svg xmlns="http://www.w3.org/2000/svg" width="340" height="230" viewBox="0 0 340 230" font-family="sans-serif" font-size="13">
  <title>Koordinatensystem mit der senkrechten Spiegelachse x = 5. Links das blaue Dreieck ABC, rechts sein oranges Spiegelbild A'B'C'. Gestrichelte Linien verbinden jeden Punkt mit seinem Bildpunkt, sie stehen senkrecht auf der Achse</title>
  <rect width="340" height="230" fill="#ffffff"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="66" y1="200" x2="66" y2="50"/>
    <line x1="96" y1="200" x2="96" y2="50"/>
    <line x1="126" y1="200" x2="126" y2="50"/>
    <line x1="156" y1="200" x2="156" y2="50"/>
    <line x1="186" y1="200" x2="186" y2="50"/>
    <line x1="216" y1="200" x2="216" y2="50"/>
    <line x1="246" y1="200" x2="246" y2="50"/>
    <line x1="276" y1="200" x2="276" y2="50"/>
    <line x1="306" y1="200" x2="306" y2="50"/>
    <line x1="36" y1="170" x2="306" y2="170"/>
    <line x1="36" y1="140" x2="306" y2="140"/>
    <line x1="36" y1="110" x2="306" y2="110"/>
    <line x1="36" y1="80" x2="306" y2="80"/>
    <line x1="36" y1="50" x2="306" y2="50"/>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <line x1="36" y1="200" x2="321" y2="200"/><polyline points="314,195 321,200 314,205"/>
    <line x1="36" y1="200" x2="36" y2="38"/><polyline points="31,45 36,38 41,45"/>
  </g>
  <g fill="#374151" text-anchor="middle">
    <text x="36" y="218">0</text><text x="66" y="218">1</text><text x="96" y="218">2</text><text x="126" y="218">3</text><text x="156" y="218">4</text><text x="186" y="218">5</text><text x="216" y="218">6</text><text x="246" y="218">7</text><text x="276" y="218">8</text><text x="306" y="218">9</text>
  </g>
  <g fill="#374151" text-anchor="end">
    <text x="28" y="175">1</text><text x="28" y="145">2</text><text x="28" y="115">3</text><text x="28" y="85">4</text><text x="28" y="55">5</text>
  </g>
  <text x="324" y="205" fill="#111827" font-weight="bold" font-size="13">x</text>
  <text x="45" y="40" fill="#111827" font-weight="bold" font-size="13">y</text>
  <line x1="186" y1="206" x2="186" y2="44" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="66" y1="140" x2="306" y2="140" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="156" y1="170" x2="216" y2="170" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="126" y1="80" x2="246" y2="80" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="66,140 156,170 126,80" fill="#dbeafe" fill-opacity="0.8" stroke="#2563eb" stroke-width="2"/>
  <polygon points="306,140 216,170 246,80" fill="#ffedd5" fill-opacity="0.8" stroke="#ea580c" stroke-width="2"/>
  <polyline points="177,80 177,71 186,71" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="156" y="74" fill="#374151" font-weight="bold" font-size="13" text-anchor="middle">2</text>
  <text x="216" y="74" fill="#374151" font-weight="bold" font-size="13" text-anchor="middle">2</text>
  <text x="60" y="134" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">A</text>
  <text x="150" y="188" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">B</text>
  <text x="120" y="74" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">C</text>
  <text x="314" y="134" fill="#9a3412" font-weight="bold" font-size="14" text-anchor="middle">A'</text>
  <text x="224" y="188" fill="#9a3412" font-weight="bold" font-size="14" text-anchor="middle">B'</text>
  <text x="254" y="74" fill="#9a3412" font-weight="bold" font-size="14" text-anchor="middle">C'</text>
  <text x="192" y="54" fill="#1e3a8a" font-weight="bold" font-size="14">g</text>
