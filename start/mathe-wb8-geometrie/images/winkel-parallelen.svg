<svg xmlns="http://www.w3.org/2000/svg" width="340" height="220" viewBox="0 0 340 220" font-family="sans-serif" font-size="13">
  <title>Zwei parallele Geraden g und h, geschnitten von der Geraden s. Blau markiert: alpha an g links unterhalb von g, beta an h an derselben Stelle (Stufenwinkel) und gamma an h rechts oberhalb von h (Wechselwinkel)</title>
  <rect width="340" height="220" fill="#ffffff"/>
  <line x1="15" y1="65" x2="325" y2="65" stroke="#374151" stroke-width="2.2"/>
  <line x1="15" y1="165" x2="325" y2="165" stroke="#374151" stroke-width="2.2"/>
  <polyline points="285,60 292,65 285,70" fill="none" stroke="#374151" stroke-width="2"/>
  <polyline points="285,160 292,165 285,170" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="203.9" y1="15" x2="88.4" y2="215" stroke="#374151" stroke-width="2.2"/>
  <path d="M175,65 L145,65 A30,30 0 0 0 160,91 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="136.9" y="92" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">α</text>
  <path d="M117.3,165 L87.3,165 A30,30 0 0 0 102.3,191 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="79.2" y="192" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">β</text>
  <path d="M117.3,165 L147.3,165 A30,30 0 0 0 132.3,139 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="155.4" y="148" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">γ</text>
  <text x="22" y="57" fill="#111827" font-weight="bold" font-size="14">g</text>
  <text x="22" y="157" fill="#111827" font-weight="bold" font-size="14">h</text>
  <text x="211.9" y="27" fill="#111827" font-weight="bold" font-size="14">s</text>
</svg>
