<svg xmlns="http://www.w3.org/2000/svg" width="340" height="225" viewBox="0 0 340 225" font-family="sans-serif" font-size="15">
  <title>Ein Dreieck ABC mit drei Linien von C zur Seite c: die Höhe h_c im rechten Winkel, die Winkelhalbierende w_γ, die γ halbiert, und die Seitenhalbierende s_c zur Mitte M von c</title>
  <rect width="340" height="225" fill="#ffffff"/>
  <polygon points="20,190 320,190 70,40" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <line x1="70" y1="40" x2="70" y2="190" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 4"/>
  <polyline points="70,180 80,180 80,190" fill="none" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="125.5" y2="190" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="3 3"/>
  <path d="M60.5 68.5 A30 30 0 0 0 80.4 68.1" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M80.4 68.1 A30 30 0 0 0 95.7 55.5" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="170" y2="190" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="10 4"/>
  <line x1="95" y1="184" x2="95" y2="196" stroke="#374151" stroke-width="1.5"/>
  <line x1="245" y1="184" x2="245" y2="196" stroke="#374151" stroke-width="1.5"/>
  <circle cx="170" cy="190" r="3.5" fill="#374151"/>
  <text x="4" y="206" fill="#1f2937" font-weight="bold">A</text>
  <text x="318" y="206" fill="#1f2937" font-weight="bold">B</text>
  <text x="64" y="30" fill="#1f2937" font-weight="bold">C</text>
  <text x="61" y="214" fill="#9a3412" font-weight="bold">h<tspan font-size="13" dy="4">c</tspan></text>
  <text x="114" y="214" fill="#6d28d9" font-weight="bold">w<tspan font-size="13" dy="4">γ</tspan></text>
  <text x="162" y="214" fill="#374151" font-weight="bold">s<tspan font-size="13" dy="4">c</tspan></text>
  <text x="176" y="184" fill="#374151" font-weight="bold">M</text>
  <text x="250" y="214" fill="#374151" font-style="italic">c</text>
