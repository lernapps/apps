<svg xmlns="http://www.w3.org/2000/svg" width="340" height="190" viewBox="0 0 340 190" font-family="sans-serif" font-size="13">
  <title>Der Buchstabe N mit seinem Mittelpunkt Z. Ein Pfeil zeigt eine halbe Drehung um Z gegen den Uhrzeigersinn. Die Ecke P oben rechts und die Ecke P' unten links liegen auf einer Geraden durch Z, gleich weit von Z entfernt</title>
  <rect width="340" height="190" fill="#ffffff"/>
  <path d="M140,135 V55 L200,135 V55" fill="none" stroke="#2563eb" stroke-width="9" stroke-linejoin="round"/>
  <line x1="200" y1="55" x2="140" y2="135" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 4"/>
  <path d="M229.8,67.1 A66,66 0 0 0 105.7,109.8" fill="none" stroke="#ea580c" stroke-width="2"/>
  <polygon points="109.2,120.8 101.6,114.3 109.9,110.7" fill="#ea580c"/>
  <circle cx="170" cy="95" r="4" fill="#111827"/>
  <text x="179" y="99" fill="#111827" font-weight="bold" font-size="14">Z</text>
  <circle cx="200" cy="55" r="5" fill="#ea580c"/>
  <circle cx="140" cy="135" r="5" fill="#ea580c"/>
  <text x="208" y="76" fill="#9a3412" font-weight="bold" font-size="14">P</text>
  <text x="118" y="152" fill="#9a3412" font-weight="bold" font-size="14">P'</text>
  <text x="62" y="40" fill="#9a3412" font-weight="bold" font-size="14">180°</text>
  <text x="12" y="180" fill="#374151" font-size="13">halbe Drehung gegen den Uhrzeigersinn</text>
</svg>
