<svg xmlns="http://www.w3.org/2000/svg" width="340" height="180" viewBox="0 0 340 180" font-family="sans-serif" font-size="15">
  <title>Zwei beschriftete Dreiecke: Dreieck 1 mit A links unten, B oben, C rechts unten; Dreieck 2 mit A oben, B links unten, C rechts unten</title>
  <rect width="340" height="180" fill="#ffffff"/>
  <text x="10" y="20" fill="#374151">Dreieck 1</text>
  <polygon points="25,150 95,45 150,150" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="10" y="166" fill="#1f2937" font-weight="bold">A</text>
  <text x="90" y="38" fill="#1f2937" font-weight="bold">B</text>
  <text x="152" y="166" fill="#1f2937" font-weight="bold">C</text>
  <line x1="170" y1="10" x2="170" y2="170" stroke="#e5e7eb" stroke-width="1"/>
  <text x="185" y="20" fill="#374151">Dreieck 2</text>
  <polygon points="250,45 195,150 325,150" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="245" y="38" fill="#1f2937" font-weight="bold">A</text>
  <text x="180" y="166" fill="#1f2937" font-weight="bold">B</text>
  <text x="320" y="168" fill="#1f2937" font-weight="bold">C</text>
</svg>
