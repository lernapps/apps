<svg xmlns="http://www.w3.org/2000/svg" width="340" height="172" viewBox="0 0 340 172" font-family="sans-serif" font-size="14">
  <title>Oben vorwärts: g mal h, dann durch 2, ergibt A. Unten rückwärts: A mal 2, dann durch g, ergibt h</title>
  <rect width="340" height="172" fill="#ffffff"/>
  <defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <text x="10" y="20" fill="#374151" font-size="13">vorwärts</text>
  <rect x="10" y="34" width="64" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="42" y="55" fill="#111827" font-weight="bold" font-size="15" text-anchor="middle">g</text>
  <line x1="76" y1="50" x2="134" y2="50" stroke="#374151" stroke-width="2" marker-end="url(#pf)"/>
  <text x="105.0" y="42" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">· h</text>
  <rect x="138" y="34" width="64" height="32" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="170" y="55" fill="#111827" font-weight="bold" font-size="15" text-anchor="middle">g · h</text>
  <line x1="204" y1="50" x2="262" y2="50" stroke="#374151" stroke-width="2" marker-end="url(#pf)"/>
  <text x="233.0" y="42" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">: 2</text>
  <rect x="266" y="34" width="64" height="32" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="298" y="55" fill="#111827" font-weight="bold" font-size="15" text-anchor="middle">A</text>
  <text x="10" y="112" fill="#374151" font-size="13">rückwärts</text>
  <rect x="266" y="126" width="64" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="298" y="147" fill="#111827" font-weight="bold" font-size="15" text-anchor="middle">A</text>
  <line x1="264" y1="142" x2="206" y2="142" stroke="#374151" stroke-width="2" marker-end="url(#pf)"/>
  <text x="235.0" y="134" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">· 2</text>
  <rect x="138" y="126" width="64" height="32" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="170" y="147" fill="#111827" font-weight="bold" font-size="15" text-anchor="middle">2 · A</text>
  <line x1="136" y1="142" x2="78" y2="142" stroke="#374151" stroke-width="2" marker-end="url(#pf)"/>
  <text x="107.0" y="134" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">: g</text>
  <rect x="10" y="126" width="64" height="32" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="42" y="147" fill="#111827" font-weight="bold" font-size="15" text-anchor="middle">h</text>
</svg>
