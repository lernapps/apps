<svg xmlns="http://www.w3.org/2000/svg" width="330" height="232" viewBox="0 0 330 232" font-family="sans-serif" font-size="14">
  <title>Ein Quader mit den Kanten a, b und c, auseinandergezogen: unten orange eine Schicht Würfelchen, darüber blau die weiteren Schichten</title>
  <rect width="330" height="232" fill="#ffffff"/>
  <rect x="40" y="170" width="150" height="30" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <polygon points="40,170 190,170 240,135 90,135" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <polygon points="190,200 190,170 240,135 240,165" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <rect x="40" y="96" width="150" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <polygon points="40,96 190,96 240,61 90,61" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <polygon points="190,156 190,96 240,61 240,121" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <line x1="40" y1="126" x2="190" y2="126" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="190" y1="126" x2="240" y2="91" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="115" y="220" fill="#1e3a8a" font-weight="bold" text-anchor="middle">a</text>
  <text x="226" y="196" fill="#1e3a8a" font-weight="bold">b</text>
  <line x1="24" y1="96" x2="24" y2="200" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="19" y1="96" x2="29" y2="96" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="19" y1="200" x2="29" y2="200" stroke="#6b7280" stroke-width="1.5"/>
  <text x="12" y="153" fill="#1e3a8a" font-weight="bold" text-anchor="middle">c</text>
  <text x="250" y="186" fill="#9a3412" font-weight="bold" font-size="13">1 Schicht</text>
  <text x="250" y="120" fill="#1e3a8a" font-weight="bold" font-size="13">weitere</text>
  <text x="250" y="136" fill="#1e3a8a" font-weight="bold" font-size="13">Schichten</text>
</svg>
