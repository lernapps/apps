<svg xmlns="http://www.w3.org/2000/svg" width="340" height="205" viewBox="0 0 340 205" font-family="sans-serif" font-size="15">
  <title>Ein Dreieck ABC mit der Höhe h_c von C auf c. Gesucht ist der Winkel x bei C zwischen der Seite b und der Höhe</title>
  <rect width="340" height="205" fill="#ffffff"/>
  <polygon points="30,180 310,180 130,40" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <path d="M30 180 L58 180 A28 28 0 0 0 46.3 157.2 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="130" y1="40" x2="130" y2="180" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
  <polyline points="130,170 140,170 140,180" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M130 40 L130 72 A32 32 0 0 1 111.4 66 Z" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="14" y="196" fill="#1f2937" font-weight="bold">A</text>
  <text x="312" y="196" fill="#1f2937" font-weight="bold">B</text>
  <text x="124" y="30" fill="#1f2937" font-weight="bold">C</text>
  <text x="62" y="174" fill="#1e3a8a" font-weight="bold">α</text>
  <text x="114" y="90" fill="#9a3412" font-weight="bold">x</text>
  <text x="135" y="140" fill="#374151" font-weight="bold">h<tspan font-size="13" dy="4">c</tspan></text>
  <text x="66" y="104" fill="#1f2937" font-style="italic">b</text>
  <text x="220" y="196" fill="#1f2937" font-style="italic">c</text>
</svg>
