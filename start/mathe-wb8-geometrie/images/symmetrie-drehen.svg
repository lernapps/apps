  <text x="45" y="20" fill="#111827" font-weight="bold" font-size="13">y</text>
  <line x1="156" y1="150" x2="246" y2="150" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="246" y1="150" x2="246" y2="120" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="156" y1="150" x2="156" y2="60" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="156" y1="60" x2="126" y2="60" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="156" y1="150" x2="246" y2="120" stroke="#2563eb" stroke-width="2"/>
