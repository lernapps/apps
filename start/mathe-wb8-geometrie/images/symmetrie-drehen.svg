<svg xmlns="http://www.w3.org/2000/svg" width="330" height="270" viewBox="0 0 330 270" font-family="sans-serif" font-size="13">
  <title>Koordinatensystem. Drehpunkt Z bei (4|3), Punkt P bei (7|4), Bildpunkt P' bei (3|6). Von Z zu P geht es 3 nach rechts und 1 nach oben, von Z zu P' 3 nach oben und 1 nach links. Ein Bogen zeigt die Vierteldrehung um 90 Grad gegen den Uhrzeigersinn</title>
  <rect width="330" height="270" fill="#ffffff"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="66" y1="240" x2="66" y2="30"/>
    <line x1="96" y1="240" x2="96" y2="30"/>
    <line x1="126" y1="240" x2="126" y2="30"/>
    <line x1="156" y1="240" x2="156" y2="30"/>
    <line x1="186" y1="240" x2="186" y2="30"/>
    <line x1="216" y1="240" x2="216" y2="30"/>
    <line x1="246" y1="240" x2="246" y2="30"/>
    <line x1="276" y1="240" x2="276" y2="30"/>
    <line x1="36" y1="210" x2="276" y2="210"/>
    <line x1="36" y1="180" x2="276" y2="180"/>
    <line x1="36" y1="150" x2="276" y2="150"/>
    <line x1="36" y1="120" x2="276" y2="120"/>
    <line x1="36" y1="90" x2="276" y2="90"/>
    <line x1="36" y1="60" x2="276" y2="60"/>
    <line x1="36" y1="30" x2="276" y2="30"/>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <line x1="36" y1="240" x2="291" y2="240"/><polyline points="284,235 291,240 284,245"/>
    <line x1="36" y1="240" x2="36" y2="18"/><polyline points="31,25 36,18 41,25"/>
  </g>
  <g fill="#374151" text-anchor="middle">
    <text x="36" y="258">0</text><text x="66" y="258">1</text><text x="96" y="258">2</text><text x="126" y="258">3</text><text x="156" y="258">4</text><text x="186" y="258">5</text><text x="216" y="258">6</text><text x="246" y="258">7</text><text x="276" y="258">8</text>
  </g>
  <g fill="#374151" text-anchor="end">
    <text x="28" y="215">1</text><text x="28" y="185">2</text><text x="28" y="155">3</text><text x="28" y="125">4</text><text x="28" y="95">5</text><text x="28" y="65">6</text><text x="28" y="35">7</text>
  </g>
