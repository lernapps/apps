  <text x="201" y="167" fill="#1e3a8a" font-weight="bold" font-size="13" text-anchor="middle">3</text>
  <text x="254" y="140" fill="#1e3a8a" font-weight="bold" font-size="13">1</text>
  <text x="164" y="83" fill="#9a3412" font-weight="bold" font-size="13">3</text>
  <text x="141" y="53" fill="#9a3412" font-weight="bold" font-size="13" text-anchor="middle">1</text>
  <circle cx="156" cy="150" r="4" fill="#111827"/>
