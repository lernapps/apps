<svg xmlns="http://www.w3.org/2000/svg" width="330" height="210" viewBox="0 0 330 210" font-family="sans-serif" font-size="14">
  <title>Ein Dreieck ABC, die Seite c liegt schräg unten. Von C aus gehen drei gestrichelte Strecken 1, 2 und 3 zur Seite c</title>
  <rect width="330" height="210" fill="#ffffff"/>
  <polygon points="40,175 300,75 110,30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="24" y="191" fill="#1e3a8a">A</text><text x="306" y="91" fill="#1e3a8a">B</text><text x="106" y="22" fill="#1e3a8a">C</text>
  <text x="180" y="151" fill="#1e3a8a">c</text>
  <line x1="110" y1="30" x2="110.0" y2="148.1" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="110" y1="30" x2="149.6" y2="132.9" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="110" y1="30" x2="170.0" y2="125.0" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="96" y="126" fill="#111827" font-weight="bold">1</text>
  <text x="128" y="112" fill="#111827" font-weight="bold">2</text>
  <text x="174" y="103" fill="#111827" font-weight="bold">3</text>
</svg>
