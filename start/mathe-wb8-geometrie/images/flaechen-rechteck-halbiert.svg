<svg xmlns="http://www.w3.org/2000/svg" width="300" height="190" viewBox="0 0 300 190" font-family="sans-serif" font-size="14">
  <title>Ein Rechteck 6 cm mal 4 cm, durch eine Diagonale in zwei gleiche Dreiecke geteilt</title>
  <rect width="300" height="190" fill="#ffffff"/>
  <polygon points="40,150 220,150 220,30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <polygon points="40,150 40,30 220,30" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <line x1="40" y1="150" x2="220" y2="30" stroke="#ea580c" stroke-width="3"/>
  <text x="115" y="172" fill="#1e3a8a">6 cm</text>
  <text x="230" y="95" fill="#1e3a8a">4 cm</text>
</svg>
