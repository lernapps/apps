  <title>Zwei Geraden schneiden sich. Rechts oben liegt der blaue Winkel alpha, links daneben der orange Winkel beta, der mit alpha eine Gerade bildet</title>
  <rect width="340" height="180" fill="#ffffff"/>
  <line x1="15" y1="110" x2="325" y2="110" stroke="#374151" stroke-width="2.2"/>
