<svg xmlns="http://www.w3.org/2000/svg" width="340" height="150" viewBox="0 0 340 150" font-family="sans-serif" font-size="13">
  <title>Drei Vierecke, nummeriert: 1 ein schiefes Viereck mit zwei Paaren paralleler Seiten, 2 ein Viereck mit zwei parallelen Seiten verschiedener Länge und gleich langen Schrägseiten, 3 ein Rechteck</title>
  <rect width="340" height="150" fill="#ffffff"/>
  <polygon points="15,110 85,110 105,45 35,45" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <polygon points="122,110 218,110 192,45 148,45" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <polygon points="234,55 330,55 330,105 234,105" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="138" fill="#111827" font-weight="bold" font-size="15" text-anchor="middle">1</text>
  <text x="170" y="138" fill="#111827" font-weight="bold" font-size="15" text-anchor="middle">2</text>
  <text x="285" y="138" fill="#111827" font-weight="bold" font-size="15" text-anchor="middle">3</text>
</svg>
