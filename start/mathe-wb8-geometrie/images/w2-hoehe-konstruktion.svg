<svg xmlns="http://www.w3.org/2000/svg" width="340" height="215" viewBox="0 0 340 215" font-family="sans-serif" font-size="14">
  <title>Konstruktion mit c = 6 cm, α = 50° und h_c = 4 cm: Die Parallele zu c im Abstand 4 cm schneidet den freien Schenkel von α im Punkt C</title>
  <rect width="340" height="215" fill="#ffffff"/>
  <line x1="10" y1="41" x2="330" y2="41" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="30" y1="185" x2="168.4" y2="20" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M30 185 L62 185 A32 32 0 0 0 50.6 160.5 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="150.8" y1="41" x2="246" y2="185" stroke="#374151" stroke-width="2"/>
  <line x1="30" y1="185" x2="150.8" y2="41" stroke="#374151" stroke-width="2"/>
  <line x1="150.8" y1="41" x2="150.8" y2="185" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 4"/>
  <polyline points="150.8,175 160.8,175 160.8,185" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="30" y1="185" x2="246" y2="185" stroke="#2563eb" stroke-width="3.5"/>
  <circle cx="150.8" cy="41" r="4" fill="#ea580c"/>
  <text x="14" y="204" fill="#1f2937" font-weight="bold">A</text>
  <text x="242" y="204" fill="#1f2937" font-weight="bold">B</text>
  <text x="132" y="34" fill="#9a3412" font-weight="bold">C</text>
  <text x="104" y="204" fill="#1e3a8a" font-weight="bold">c = 6 cm</text>
  <text x="66" y="180" fill="#1e3a8a" font-weight="bold">α = 50°</text>
  <text x="157" y="122" fill="#1e3a8a" font-weight="bold">h<tspan font-size="13" dy="4">c</tspan></text>
  <text x="222" y="33" fill="#4b5563" font-size="13">Parallele zu c</text>
</svg>
