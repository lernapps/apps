<svg xmlns="http://www.w3.org/2000/svg" width="340" height="190" viewBox="0 0 340 190" font-family="sans-serif" font-size="13">
  <title>Ein Dreieck ABC. Durch C geht eine gestrichelte Parallele zur Seite AB. Links neben gamma liegt bei C ein Winkel in derselben Farbe wie alpha, rechts einer in derselben Farbe wie beta</title>
  <rect width="340" height="190" fill="#ffffff"/>
  <line x1="10" y1="50" x2="330" y2="50" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="7 5"/>
  <polygon points="40,160 270,160 125,50" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <path d="M40,160 L70,160 A30,30 0 0 0 58.3,136.3 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80.4" y="145.2" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">α</text>
  <path d="M270,160 L246.1,141.9 A30,30 0 0 0 240,160 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="227.3" y="150.7" fill="#5b21b6" font-weight="bold" font-size="14" text-anchor="middle">β</text>
  <path d="M125,50 L107.9,72.2 A28,28 0 0 0 147.3,66.9 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="130.5" y="96.6" fill="#14532d" font-weight="bold" font-size="14" text-anchor="middle">γ</text>
  <path d="M125,50 L97,50 A28,28 0 0 0 107.9,72.2 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="87.3" y="73.5" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">α</text>
  <path d="M125,50 L147.3,66.9 A28,28 0 0 0 153,50 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="164.8" y="68.4" fill="#5b21b6" font-weight="bold" font-size="14" text-anchor="middle">β</text>
  <text x="34" y="180" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">A</text>
  <text x="276" y="180" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">B</text>
  <text x="125" y="40" fill="#111827" font-weight="bold" font-size="14" text-anchor="middle">C</text>
</svg>
