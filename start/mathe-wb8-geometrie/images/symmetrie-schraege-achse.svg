<svg xmlns="http://www.w3.org/2000/svg" width="300" height="284" viewBox="0 0 300 284" font-family="sans-serif" font-size="13">
  <title>Koordinatensystem, x und y von 0 bis 7. Die schräge Spiegelachse g geht durch (0|0) und (7|7). Der Punkt P liegt bei (1|4). Drei mögliche Bildpunkte sind mit 1, 2 und 3 markiert</title>
  <rect width="300" height="284" fill="#ffffff"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="68" y1="254" x2="68" y2="30"/>
    <line x1="100" y1="254" x2="100" y2="30"/>
    <line x1="132" y1="254" x2="132" y2="30"/>
    <line x1="164" y1="254" x2="164" y2="30"/>
    <line x1="196" y1="254" x2="196" y2="30"/>
    <line x1="228" y1="254" x2="228" y2="30"/>
    <line x1="260" y1="254" x2="260" y2="30"/>
    <line x1="36" y1="222" x2="260" y2="222"/>
    <line x1="36" y1="190" x2="260" y2="190"/>
    <line x1="36" y1="158" x2="260" y2="158"/>
    <line x1="36" y1="126" x2="260" y2="126"/>
    <line x1="36" y1="94" x2="260" y2="94"/>
    <line x1="36" y1="62" x2="260" y2="62"/>
    <line x1="36" y1="30" x2="260" y2="30"/>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <line x1="36" y1="254" x2="275" y2="254"/><polyline points="268,249 275,254 268,259"/>
    <line x1="36" y1="254" x2="36" y2="18"/><polyline points="31,25 36,18 41,25"/>
  </g>
  <g fill="#374151" text-anchor="middle">
    <text x="36" y="272">0</text><text x="68" y="272">1</text><text x="100" y="272">2</text><text x="132" y="272">3</text><text x="164" y="272">4</text><text x="196" y="272">5</text><text x="228" y="272">6</text><text x="260" y="272">7</text>
  </g>
  <g fill="#374151" text-anchor="end">
    <text x="28" y="227">1</text><text x="28" y="195">2</text><text x="28" y="163">3</text><text x="28" y="131">4</text><text x="28" y="99">5</text><text x="28" y="67">6</text><text x="28" y="35">7</text>
  </g>
  <text x="278" y="259" fill="#111827" font-weight="bold" font-size="13">x</text>
  <text x="45" y="20" fill="#111827" font-weight="bold" font-size="13">y</text>
  <line x1="36" y1="254" x2="260" y2="30" stroke="#2563eb" stroke-width="2.5"/>
  <text x="242" y="34" fill="#1e3a8a" font-weight="bold" font-size="14">g</text>
  <circle cx="68" cy="126" r="5" fill="#2563eb"/>
  <text x="64" y="117" fill="#1e3a8a" font-weight="bold" font-size="14" text-anchor="middle">P</text>
  <circle cx="164" cy="126" r="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="164" y="131" fill="#111827" font-weight="bold" font-size="13" text-anchor="middle">1</text>
  <circle cx="164" cy="222" r="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="164" y="227" fill="#111827" font-weight="bold" font-size="13" text-anchor="middle">2</text>
  <circle cx="260" cy="126" r="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="260" y="131" fill="#111827" font-weight="bold" font-size="13" text-anchor="middle">3</text>
