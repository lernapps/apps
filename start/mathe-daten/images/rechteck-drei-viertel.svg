<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-labelledby="t d"><title id="t">Rechteck in vier gleiche Teile geteilt, drei davon gefärbt</title><desc id="d">Ein Rechteck ist in vier gleich große Teile geteilt. Drei Teile sind gefärbt, ein Teil ist weiß. Das ist der Bruch drei Viertel.</desc><rect width="360" height="150" rx="8" fill="#ffffff" stroke="#6b7280"/><rect x="50" y="40" width="65" height="60" fill="#1d4ed8" stroke="#111827" stroke-width="2"/><rect x="115" y="40" width="65" height="60" fill="#1d4ed8" stroke="#111827" stroke-width="2"/><rect x="180" y="40" width="65" height="60" fill="#1d4ed8" stroke="#111827" stroke-width="2"/><rect x="245" y="40" width="65" height="60" fill="#ffffff" stroke="#111827" stroke-width="2"/><text x="180.0" y="26" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">Das Ganze ist das ganze Rechteck.</text><text x="180.0" y="130" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">3 von 4 gleich großen Teilen sind gefärbt.</text></svg>
