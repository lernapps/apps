<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" aria-labelledby="t d"><title id="t">Kreisdiagramm: Wie kommen die Kinder der 6a zur Schule?</title><desc id="d">Ein Kreis, in vier Teile geteilt: Zu Fuß 8 von 24 Kindern, Fahrrad 6, Bus 7 und Auto 3. Der ganze Kreis steht für alle 24 Kinder.</desc><rect width="360" height="270" rx="8" fill="#ffffff" stroke="#6b7280"/><path d="M180,135 L180.0,57.0 A78,78 0 0 1 247.5,174.0 Z" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/><text x="261.4" y="92.0" font-size="14" text-anchor="start" fill="#111827" font-family="system-ui, sans-serif"><tspan font-weight="700">Zu Fuß</tspan>: 8</text><path d="M180,135 L247.5,174.0 A78,78 0 0 1 141.0,202.5 Z" fill="#b45309" stroke="#ffffff" stroke-width="2"/><text x="204.3" y="229.8" font-size="14" text-anchor="start" fill="#111827" font-family="system-ui, sans-serif"><tspan font-weight="700">Fahrrad</tspan>: 6</text><path d="M180,135 L141.0,202.5 A78,78 0 0 1 124.8,79.8 Z" fill="#047857" stroke="#ffffff" stroke-width="2"/><text x="86.8" y="151.3" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif"><tspan font-weight="700">Bus</tspan>: 7</text><path d="M180,135 L124.8,79.8 A78,78 0 0 1 180.0,57.0 Z" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/><text x="144.0" y="52.2" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif"><tspan font-weight="700">Auto</tspan>: 3</text><text x="180.0" y="262" font-size="13" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">Der ganze Kreis sind alle 24 Kinder.</text></svg>
