<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="t d"><title id="t">Säulendiagramm: Wie kommen die Kinder der 6a zur Schule?</title><desc id="d">Vier Säulen: Zu Fuß 8, Fahrrad 6, Bus 7, Auto 3. Die senkrechte Achse zeigt die Anzahl der Kinder von 0 bis 10.</desc><rect width="360" height="260" rx="8" fill="#ffffff" stroke="#6b7280"/><line x1="56" y1="210.0" x2="344" y2="210.0" stroke="#d1d5db"/><text x="48" y="215.0" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif">0</text><line x1="56" y1="192.0" x2="344" y2="192.0" stroke="#d1d5db"/><text x="48" y="197.0" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif">1</text><line x1="56" y1="174.0" x2="344" y2="174.0" stroke="#d1d5db"/><text x="48" y="179.0" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif">2</text><line x1="56" y1="156.0" x2="344" y2="156.0" stroke="#d1d5db"/><text x="48" y="161.0" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif">3</text><line x1="56" y1="138.0" x2="344" y2="138.0" stroke="#d1d5db"/><text x="48" y="143.0" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif">4</text><line x1="56" y1="120.0" x2="344" y2="120.0" stroke="#d1d5db"/><text x="48" y="125.0" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif">5</text><line x1="56" y1="102.0" x2="344" y2="102.0" stroke="#d1d5db"/><text x="48" y="107.0" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif">6</text><line x1="56" y1="84.0" x2="344" y2="84.0" stroke="#d1d5db"/><text x="48" y="89.0" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif">7</text><line x1="56" y1="66.0" x2="344" y2="66.0" stroke="#d1d5db"/><text x="48" y="71.0" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif">8</text><line x1="56" y1="48.0" x2="3