<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="t d"><title id="t">Säulendiagramm mit Achse ab 5: Kinder mit Fahrrad in 6a und 6b</title><desc id="d">Zwei Säulen. Die senkrechte Achse hat die Marken 5, 6, 7, 8 und 9. Die Säule der 6a reicht bis 6, die der 6b bis 7.</desc><rect width="360" height="240" rx="8" fill="#ffffff" stroke="#6b7280"/><text x="4" y="16" font-size="13" fill="#111827" font-family="system-ui, sans-serif">Kinder mit Fahrrad</text><line x1="60" y1="190.0" x2="350" y2="190.0" stroke="#d1d5db"/><text x="52" y="195.0" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif">5</text><line x1="60" y1="152.5" x2="350" y2="152.5" stroke="#d1d5db"/><text x="52" y="157.5" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif">6</text><line x1="60" y1="115.0" x2="350" y2="115.0" stroke="#d1d5db"/><text x="52" y="120.0" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif">7</text><line x1="60" y1="77.5" x2="350" y2="77.5" stroke="#d1d5db"/><text x="52" y="82.5" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif">8</text><line x1="60" y1="40.0" x2="350" y2="40.0" stroke="#d1d5db"/><text x="52" y="45.0" font-size="14" text-anchor="end" fill="#111827" font-family="system-ui, sans-serif">9</text><rect x="90" y="152.5" width="70" height="37.5" fill="#1d4ed8"/><text x="125" y="210" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">6a</text><rect x="210" y="115.0" width="70" height="75.0" fill="#1d4ed8"/><text x="245" y="210" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">6b</text><line x1="60" y1="190" x2="350" y2="190" stroke="#111827" stroke-width="1.5"/><line x1="60" y1="34" x2="60" y2="190" stroke="#111827" stroke-width="1.5"/></svg>
