<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 130" role="img" aria-labelledby="t d"><title id="t">Zahlenstrahl von 0 bis 10</title><desc id="d">Ein Zahlenstrahl beginnt bei 0 und geht nach rechts. Die Zahlen 3 und 7 sind markiert. Die 7 liegt weiter rechts, also ist 7 größer als 3.</desc><rect width="360" height="130" rx="8" fill="#ffffff" stroke="#6b7280"/><line x1="24" y1="70" x2="336" y2="70" stroke="#111827" stroke-width="2"/><polygon points="344,70 336,65 336,75" fill="#111827"/><line x1="24.0" y1="64" x2="24.0" y2="76" stroke="#111827" stroke-width="2"/><text x="24.0" y="96" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">0</text><line x1="54.2" y1="64" x2="54.2" y2="76" stroke="#111827" stroke-width="2"/><text x="54.2" y="96" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">1</text><line x1="84.4" y1="64" x2="84.4" y2="76" stroke="#111827" stroke-width="2"/><text x="84.4" y="96" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">2</text><line x1="114.6" y1="64" x2="114.6" y2="76" stroke="#111827" stroke-width="2"/><text x="114.6" y="96" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">3</text><line x1="144.8" y1="64" x2="144.8" y2="76" stroke="#111827" stroke-width="2"/><text x="144.8" y="96" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">4</text><line x1="175.0" y1="64" x2="175.0" y2="76" stroke="#111827" stroke-width="2"/><text x="175.0" y="96" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">5</text><line x1="205.2" y1="64" x2="205.2" y2="76" stroke="#111827" stroke-width="2"/><text x="205.2" y="96" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">6</text><line x1="235.4" y1="64" x2="235.4" y2="76" stroke="#111827" stroke-width="2"/><text x="235.4" y="96" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">7</text><line x1="265.6" y1="64" x2="265.6" y2="76" stroke="#111827" stroke-width="2"/><text x="265.6" y="96" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">8</text><line x1="295.8" y1="64" x2="295.8" y2="76" stroke="#111827" stroke-width="2"/><text x="295.8" y="96" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">9</text><line x1="326.0" y1="64" x2="326.0" y2="76" stroke="#111827" stroke-width="2"/><text x="326.0" y="96" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">10</text><circle cx="114.6" cy="70" r="8" fill="#1d4ed8" stroke="#111827" stroke-width="2"/><circle cx="235.4" cy="70" r="8" fill="#1d4ed8" stroke="#111827" stroke-width="2"/><text x="180.0" y="24" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">Weiter rechts bedeutet größer.</text></svg>
