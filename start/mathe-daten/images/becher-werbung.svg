<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="t d"><title id="t">Werbung mit zwei Bechern</title><desc id="d">Ein kleiner Becher für Schuljahr 1 mit 120 verkauften Bechern und ein Becher, der doppelt so breit und doppelt so hoch gezeichnet ist, für Schuljahr 2 mit 240 verkauften Bechern.</desc><rect width="360" height="240" rx="8" fill="#ffffff" stroke="#6b7280"/><text x="180" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">So viele Becher verkauft</text><rect x="50" y="130" width="50" height="60" fill="#b45309" stroke="#111827" stroke-width="2"/><path d="M100,148.0 q15.0,0 15.0,15.0 q0,15.0 -15.0,15.0" fill="none" stroke="#111827" stroke-width="3"/><rect x="200" y="70" width="100" height="120" fill="#b45309" stroke="#111827" stroke-width="2"/><path d="M300,106.0 q30.0,0 30.0,30.0 q0,30.0 -30.0,30.0" fill="none" stroke="#111827" stroke-width="3"/><line x1="30" y1="190" x2="340" y2="190" stroke="#111827" stroke-width="1.5"/><text x="75" y="212" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">Schuljahr 1: 120</text><text x="250" y="212" font-size="14" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif">Schuljahr 2: 240</text></svg>
