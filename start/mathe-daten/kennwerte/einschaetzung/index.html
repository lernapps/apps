<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Aussage über die beiden Boxplots stimmt?</legend>
<div class="question-material"><figure class="block-figure"><div class="block-image-credit block-image-fill"><img src="../../images/boxplot-8b-8c.svg" alt="Boxplots der Klassen 8b und 8c auf derselben Skala von 0 bis 40 Minuten. Die Box der 8c ist kürzer als die der 8b." loading="lazy" decoding="async"><span class="block-credit" tabindex="0" role="img" data-info="Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0." aria-label="Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.">© CC-BY-4.0</span></div><figcaption><p>Vergleiche die Boxen und die Linien.</p></figcaption></figure></div>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>Am Boxplot sieht man, wie viele Kinder die 8c hat</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>In der 8c braucht ein Kind 35 Minuten</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>In der 8c liegen die mittleren Werte enger beieinander als in der 8b</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Am Boxplot sieht man, wie viele Kinder die 8c hat</strong></p><p>Ein Boxplot zeigt nicht, wie viele Werte es gibt, sondern wie sie verteilt sind. Die Anzahl kann man an ihm nicht ablesen.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>In der 8c braucht ein Kind 35 Minuten</strong></p><p>Das gilt für die 8b. Die Linie der 8c endet schon bei 19.</p></li>
<li class="question-info question-info-right" data-option="2"><p class="question-info-head"><strong>In der 8c liegen die mittleren Werte enger beieinander als in der 8b</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Die Box der 8c ist kürzer. Die mittlere Hälfte der Werte liegt dort in einem kleineren Bereich.</p></li>
</ul>
<p class="question-explanation">Die Länge der Box zeigt, wie weit die mittlere Hälfte der Werte streut. Die 8c streut weniger.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Auch die 9a derselben Schule hat ihre Schulwege gemessen. Die Daten der 9a, der Größe nach geordnet, sind 3, 5, 6, 8, 9, 11, 13, 14, 20. Ordne den Stellen im Boxplot ihre Werte zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Linkes Ende der Linie</span> <select name="frage-a6-0" data-left="0"><option value="">bitte wählen</option><option value="5">11</option><option value="4">20</option><option value="1">5,5</option><option value="3">13,5</option><option value="2">9</option><option value="0">3</option></select></label></li>
<li><label><span>Linke Kante der Box (Q1)</span> <select name="frage-a6-1" data-left="1"><option value="">bitte wählen</option><option value="5">11</option><option value="4">20</option><option value="1">5,5</option><option value="3">13,5</option><option value="2">9</option><option value="0">3</option></select></label></li>
<li><label><span>Dicker Strich in der Box (Median)</span> <select name="frage-a6-2" data-left="2"><option value="">bitte wählen</option><option value="5">11</option><option value="4">20</option><option value="1">5,5</option><option value="3">13,5</option><option value="2">9</option><option value="0">3</option></select></label></li>
<li><label><span>Rechte Kante der Box (Q3)</span> <select name="frage-a6-3" data-left="3"><option value="">bitte wählen</option><option value="5">11</option><option value="4">20</option><option value="1">5,5</option><option value="3">13,5</option><option value="2">9</option><option value="0">3</option></select></label></li>
<li><label><span>Rechtes Ende der Linie</span> <select name="frage-a6-4" data-left="4"><option value="">bitte wählen</option><option value="5">11</option><option value="4">20</option><option value="1">5,5</option><option value="3">13,5</option><option value="2">9</option><option value="0">3</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Linkes Ende der Linie – 3; Linke Kante der Box (Q1) – 5,5; Dicker Strich in der Box (Median) – 9; Rechte Kante der Box (Q3) – 13,5; Rechtes Ende der Linie – 20</p>
<p class="question-explanation">Bei neun Werten ist der fünfte der Median (9). Die untere Hälfte 3, 5, 6, 8 hat die Mitte 5,5, die obere Hälfte 11, 13, 14, 20 hat die Mitte 13,5. Kleinster und größter Wert sind 3 und 20.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
