<main class="explainer" id="inhalt-der-seite" data-storage="mathe-daten">
<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../stichprobe/">Spricht die Stichprobe für alle?</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Die Schülervertretung will eine Stichprobe von 30 Lernenden befragen. Welche Auswahl ist am wenigsten einseitig?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>30 Lernende aus den Klassen 6a und 6b</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>30 Lernende, die aus der Liste aller Lernenden zufällig gezogen werden</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Die 30 Lernenden, die morgens als Erste am Schultor stehen</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>30 Lernende aus den Klassen 6a und 6b</strong></p><p>Das sind nur zwei Klassen einer Stufe. Ältere Lernende fehlen, und die kommen vielleicht anders zur Schule.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>30 Lernende, die aus der Liste aller Lernenden zufällig gezogen werden</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Jede und jeder hat die gleiche Chance. Alle Klassen und alle Verkehrsmittel können vorkommen.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Die 30 Lernenden, die morgens als Erste am Schultor stehen</strong></p><p>Wer früh kommt, kommt vielleicht eher mit dem Bus oder zu Fuß. Die Auswahl hängt vom Verkehrsmittel ab.</p></li>
</ul>
<p class="question-explanation">Zufällig aus allen ausgewählt heißt, dass jede und jeder dieselbe Chance hat und keine Gruppe von vornherein ausgelassen wird.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="true-false">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Eine zufällige Stichprobe von nur 5 Lernenden zeigt zuverlässig, wie alle 600 zur Schule kommen.</legend>
<label class="question-option"><input type="radio" name="frage-a3" value="true"> <span>Stimmt</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="false"> <span>Stimmt nicht</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Die Aussage stimmt nicht.</p>
<p class="question-explanation">Mit nur 5 Lernenden ändern sich die Anteile bei jedem Ziehen stark. Bei 100 Lernenden liegen sie meist nah an den Anteilen aller 600.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jedem Problem eines Erhebungsplans zu, wie du es verbesserst.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Die Frage legt die Antwort nahe</span> <select name="frage-a5-0" data-left="0"><option value="">bitte wählen</option><option value="0">Neutrale Frage stellen</option><option value="2">Größere Stichprobe wählen</option><option value="3">Mit „ungefähr“ formulieren</option><option value="1">Zufällig auswählen</option></select></label></li>
<li><label><span>Es werden nur die Ersten am Tor gefragt</span> <select name="frage-a5-1" data-left="1"><option value="">bitte wählen</option><option value="0">Neutrale Frage stellen</option><option value="2">Größere Stichprobe wählen</option><option value="3">Mit „ungefähr“ formulieren</option><option value="1">Zufällig auswählen</option></select></label></li>
<li><label><span>Es werden nur 5 Lernende gefragt</span> <select name="frage-a5-2" data-left="2"><option value="">bitte wählen</option><option value="0">Neutrale Frage stellen</option><option value="2">Größere Stichprobe wählen</option><option value="3">Mit „ungefähr“ formulieren</option><option value="1">Zufällig auswählen</option></select></label></li>
<li><label><span>Das Ergebnis wird als „genau“ angegeben</span> <select name="frage-a5-3" data-left="3"><option value="">bitte wählen</option><option value="0">Neutrale Frage stellen</option><option value="2">Größere Stichprobe wählen</option><option value="3">Mit „ungefähr“ formulieren</option><option value="1">Zufällig auswählen</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Die Frage legt die Antwort nahe – Neutrale Frage stellen; Es werden nur die Ersten am Tor gefragt – Zufällig auswählen; Es werden nur 5 Lernende gefragt – Größere Stichprobe wählen; Das Ergebnis wird als „genau“ angegeben – Mit „ungefähr“ formulieren</p>
<p class="question-explanation">Jedes Problem hat seine Verbesserung. Zusammen ergeben sie einen Plan, dem man eher trauen kann.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Von 60 zufällig gezogenen Lernenden fahren 22 mit dem Rad. Welche Aussage über alle 600 passt zu diesem Ergebnis?</legend>
<label class="question-option"><input type="radio" name="frage-a6" value="0"> <span>Mit dem Rad fahren nur die Kinder der Stichprobe</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="1"> <span>Ungefähr 37 % der Lernenden fahren mit dem Rad</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="2"> <span>Genau 220 Lernende fahren mit dem Rad</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Mit dem Rad fahren nur die Kinder der Stichprobe</strong></p><p>Von den Kindern, die nicht befragt wurden, weiß man es nicht. Man schließt aus der Stichprobe auf alle.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Ungefähr 37 % der Lernenden fahren mit dem Rad</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>22 von 60 sind etwa 37 %. Das Wort „ungefähr“ sagt, dass die Aussage eine Schätzung ist.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Genau 220 Lernende fahren mit dem Rad</strong></p><p>Eine Stichprobe liefert eine Schätzung und keine genaue Zahl. Eine andere Stichprobe hätte etwas anderes ergeben.</p></li>
</ul>
<p class="question-explanation">Aus einer guten Stichprobe darf man auf alle schließen, aber vorsichtig: ungefähr, nicht genau.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
