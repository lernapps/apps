<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../wenn-ein-wort-fehlt/">Wenn mir ein Wort fehlt</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-language-text"><p>Wähle das Wort, das zur Beschreibung passt.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-language-text"><p>Schreibe den Satz auf Englisch. Er umschreibt das Wort mit einem Relativsatz.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Dir fehlt das Wort easy. Du kennst difficult. Welche Umschreibung passt?</legend>
<label class="question-option"><input type="radio" name="frage-a3" value="0"> <span>It is very difficult.</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="1"> <span>It is not difficult.</span></label>
<label class="question-option"><input type="radio" name="frage-a3" value="2"> <span>It is a bit difficult.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>It is very difficult.</strong></p><p>very difficult heißt sehr schwer. Das ist nicht easy, sondern das Gegenteil mit very.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>It is not difficult.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das Gegenteil von difficult mit not umschreibt easy.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>It is a bit difficult.</strong></p><p>a bit difficult heißt ein bisschen schwer. Das ist nicht easy.</p></li>
</ul>
<p class="question-explanation">Mit not und dem Gegenteil umschreibst du easy.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>

<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>

<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Mr Hill sagt: „The hamster is homeless.“ Was bedeutet das?</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>Der Hamster hat ein kleines Zuhause.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>Der Hamster hat kein Zuhause.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>Der Hamster hat ein schönes Zuhause.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info" data-option="0"><p class="question-info-head"><strong>Der Hamster hat ein kleines Zuhause.</strong></p><p>-less heißt nicht weniger, sondern ohne.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Der Hamster hat kein Zuhause.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>home ist der Stamm, -less heißt ohne.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Der Hamster hat ein schönes Zuhause.</strong></p><p>-less heißt ohne, nicht schön. Mit -ful würde es voller heißen, aber homeful gibt es nicht.</p></li>
</ul>
<p class="question-explanation">homeless heißt ohne Zuhause.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="explainer-language-text"><p>Bilde das englische Wort aus Stamm und Vor- oder Nachsilbe.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
