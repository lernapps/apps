<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>

<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Jona verschlüsselt eine Nachricht mit 12 Buchstaben. Der Schlüssel ist 4 Buchstaben pro Zeile. Wie viele Zeilen schreibt er?</legend>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a1">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 3</p>
<p class="question-explanation">12 Buchstaben, je 4 in einer Zeile, ergeben 12 : 4 = 3 Zeilen.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Selin bekommt den Geheimtext TFMCRFSHEUES, 12 Buchstaben. Der Schlüssel ist 3 Buchstaben pro Zeile. Was ist der Klartext?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>TREFFUMSECHS</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>TCSUFRHEMFES</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>SEUEHSFRCMFT</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>TREFFUMSECHS</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>12 Buchstaben in 3 Spalten sind 4 Zeilen. Selin schreibt TFMC, RFSH und EUES als Spalten. Die Zeilen sind TRE, FFU, MSE, CHS: Treff um sechs.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>TCSUFRHEMFES</strong></p><p>Du hast den Geheimtext noch einmal verschlüsselt, also in Zeilen geschrieben. Zum Entschlüsseln schreibst du ihn in Spalten.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>SEUEHSFRCMFT</strong></p><p>Das ist der Geheimtext rückwärts gelesen. Die Skytale vertauscht die Buchstaben anders.</p></li>
</ul>
<p class="question-explanation">Zum Entschlüsseln schreibt man den Geheimtext Spalte für Spalte in Kästchen mit 3 Spalten und liest die Zeilen.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="number">
<form class="question-form" novalidate>
<fieldset>

<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a3">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>

<p><strong>Richtige Antwort:</strong> 5</p>
<p class="question-explanation">A → B → C → D → E → F sind 5 Schritte. Der Schlüssel ist 5.</p>
</div>
