<main class="explainer" id="inhalt-der-seite" data-task-start="first">
<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../information/">Information wird zu Daten</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="question" id="frage-a1" data-id="a1" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Bringe den Weg der Nachricht in die richtige Reihenfolge.</legend>
<p class="question-hint">Gib jedem Eintrag seinen Platz: 1 für den ersten.</p>
<ul class="question-pairs">
<li><label><span>Frau Berg schreibt die Daten auf einen Zettel.</span> <select name="frage-a1-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>Selin liest den Zettel.</span> <select name="frage-a1-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>Frau Berg weiß, wann und wo sich die 6b trifft.</span> <select name="frage-a1-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
<li><label><span>Selin versteht, dass sich die 6b am Montag um 8 Uhr am Bahnhof trifft.</span> <select name="frage-a1-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 1. Frau Berg weiß, wann und wo sich die 6b trifft., 2. Frau Berg schreibt die Daten auf einen Zettel., 3. Selin liest den Zettel., 4. Selin versteht, dass sich die 6b am Montag um 8 Uhr am Bahnhof trifft.</p>
<p class="question-explanation">Erst ist die Information in Frau Bergs Kopf, dann wird sie zu Daten auf dem Zettel. Beim Lesen und Deuten wird sie bei Selin wieder zur Information.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Ordne jedem Satz zu, ob er Daten oder eine Information beschreibt.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Auf dem Zettel steht „8:00“.</span> <select name="frage-a2-0" data-left="0"><option value="">bitte wählen</option><option value="1">Information, aus den Daten verstanden</option><option value="0">Daten, noch ohne Bedeutung</option><option value="2">weder Daten noch Information</option></select></label></li>
<li><label><span>Selin weiß, dass sie um 8 Uhr am Bahnhof sein muss.</span> <select name="frage-a2-1" data-left="1"><option value="">bitte wählen</option><option value="1">Information, aus den Daten verstanden</option><option value="0">Daten, noch ohne Bedeutung</option><option value="2">weder Daten noch Information</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Auf dem Zettel steht „8:00“. – Daten, noch ohne Bedeutung; Selin weiß, dass sie um 8 Uhr am Bahnhof sein muss. – Information, aus den Daten verstanden</p>
<p class="question-explanation">Zeichen auf dem Zettel sind Daten. Was Selin daraus versteht, ist eine Information.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="question" id="frage-a3" data-id="a3" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wo Mia die 21 sieht, und was sie bedeutet. Ordne zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>21 auf dem Thermometer</span> <select name="frage-a3-0" data-left="0"><option value="">bitte wählen</option><option value="3">Das ist die Rückennummer.</option><option value="0">Es sind 21 Grad warm.</option><option value="2">Die Cousine wird 21 Jahre alt.</option><option value="1">Es ist 9 Uhr abends.</option></select></label></li>
<li><label><span>21:00 auf dem Wecker</span> <select name="frage-a3-1" data-left="1"><option value="">bitte wählen</option><option value="3">Das ist die Rückennummer.</option><option value="0">Es sind 21 Grad warm.</option><option value="2">Die Cousine wird 21 Jahre alt.</option><option value="1">Es ist 9 Uhr abends.</option></select></label></li>
<li><label><span>21 Kerzen auf dem Kuchen ihrer Cousine</span> <select name="frage-a3-2" data-left="2"><option value="">bitte wählen</option><option value="3">Das ist die Rückennummer.</option><option value="0">Es sind 21 Grad warm.</option><option value="2">Die Cousine wird 21 Jahre alt.</option><option value="1">Es ist 9 Uhr abends.</option></select></label></li>
<li><label><span>21 auf dem Trikot</span> <select name="frage-a3-3" data-left="3"><option value="">bitte wählen</option><option value="3">Das ist die Rückennummer.</option><option value="0">Es sind 21 Grad warm.</option><option value="2">Die Cousine wird 21 Jahre alt.</option><option value="1">Es ist 9 Uhr abends.</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 21 auf dem Thermometer – Es sind 21 Grad warm.; 21:00 auf dem Wecker – Es ist 9 Uhr abends.; 21 Kerzen auf dem Kuchen ihrer Cousine – Die Cousine wird 21 Jahre alt.; 21 auf dem Trikot – Das ist die Rückennummer.</p>
<p class="question-explanation">Dieselben Daten, die Zahl 21, bedeuten je nach Zusammenhang etwas anderes. Das Thermometer, die Uhr oder der Kuchen sagen dir, wie du die 21 deuten musst.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Lies im Säulendiagramm ab. Wie viele Stimmen haben Bärenhöhle und Lindenzoo zusammen?</legend>
<div class="question-material"><figure class="block-figure"><div class="block-image-credit block-image-fill"><img src="../../images/abstimmung.svg" alt="Ein Säulendiagramm mit vier Säulen für Seeberg, Falkenburg, Bärenhöhle und Lindenzoo und einer Skala von 0 bis 12." loading="lazy" decoding="async"><span class="block-credit" tabindex="0" role="img" data-info="Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0." aria-label="Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.">© CC-BY-4.0</span></div><figcaption><p>Lies die Höhe jeder Säule an der Skala links ab.</p></figcaption></figure></div>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a4">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 8</p>
<p class="question-explanation">Die Säule der Bärenhöhle reicht bis 5, die des Lindenzoos bis 3. 5 + 3 = 8.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Form beantwortet die Frage am schnellsten? Ordne zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Welches Ziel liegt vorn? Ich will es auf einen Blick sehen.</span> <select name="frage-a5-0" data-left="0"><option value="">bitte wählen</option><option value="2">Text</option><option value="0">Säulendiagramm</option><option value="1">Tabelle</option></select></label></li>
<li><label><span>Wie viele Stimmen hat die Bärenhöhle genau?</span> <select name="frage-a5-1" data-left="1"><option value="">bitte wählen</option><option value="2">Text</option><option value="0">Säulendiagramm</option><option value="1">Tabelle</option></select></label></li>
<li><label><span>Die Eltern wollen wissen, wohin die Fahrt geht und warum.</span> <select name="frage-a5-2" data-left="2"><option value="">bitte wählen</option><option value="2">Text</option><option value="0">Säulendiagramm</option><option value="1">Tabelle</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Welches Ziel liegt vorn? Ich will es auf einen Blick sehen. – Säulendiagramm; Wie viele Stimmen hat die Bärenhöhle genau? – Tabelle; Die Eltern wollen wissen, wohin die Fahrt geht und warum. – Text</p>
<p class="question-explanation">Das Diagramm zeigt den Vergleich, die Tabelle die genaue Zahl, der Text die Bedeutung.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="true-false">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In einem Baum der Informatik steht die Wurzel unten, wie bei einem echten Baum.</legend>
<label class="question-option"><input type="radio" name="frage-a6" value="true"> <span>Stimmt</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="false"> <span>Stimmt nicht</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Die Aussage stimmt nicht.</p>
<p class="question-explanation">In der Informatik steht der Baum auf dem Kopf. Die Wurzel ist oben, die Blätter sind unten.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
