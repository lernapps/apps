<li class="explainer-assessment-item" data-key="a18"><p class="explainer-assessment-label">Aufgabe 18</p><div class="question" id="frage-a18" data-id="a18" data-type="matching">

<fieldset>

<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>

<li><label><span>Pixelgrafik</span> <select name="frage-a18-0" data-left="0"><option value="">bitte wählen</option><option value="1">Formen wie Kreis und Linie mit ihren Zahlen</option><option value="2">den Namen des Bildes, zum Beispiel „Zelt“</option><option value="0">die Farbe jedes einzelnen Bildpunkts</option></select></label></li>
<li><label><span>Vektorgrafik</span> <select name="frage-a18-1" data-left="1"><option value="">bitte wählen</option><option value="1">Formen wie Kreis und Linie mit ihren Zahlen</option><option value="2">den Namen des Bildes, zum Beispiel „Zelt“</option><option value="0">die Farbe jedes einzelnen Bildpunkts</option></select></label></li>

</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>

<fieldset>

<li class="explainer-assessment-item" data-key="a20"><p class="explainer-assessment-label">Aufgabe 20</p><div class="question" id="frage-a20" data-id="a20" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Das Zelt-Logo soll auf das Plakat und auf ein kleines T-Shirt-Bild, beide Male scharf. Welche Grafikart passt?</legend>
<label class="question-option"><input type="radio" name="frage-a20" value="0"> <span>Vektorgrafik, weil sie in jeder Größe glatt bleibt</span></label>
<label class="question-option"><input type="radio" name="frage-a20" value="1"> <span>Pixelgrafik, weil sie jedes Pixel genau speichert</span></label>
<label class="question-option"><input type="radio" name="frage-a20" value="2"> <span>Egal, beide werden beim Vergrößern gleich</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Vektorgrafik, weil sie in jeder Größe glatt bleibt</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Das Logo besteht aus wenigen Formen. Der Computer rechnet sie für jede Größe neu aus.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Pixelgrafik, weil sie jedes Pixel genau speichert</strong></p><p>Sie speichert jedes Pixel, aber nur in einer Größe. Auf dem Plakat würde das Logo treppig.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Egal, beide werden beim Vergrößern gleich</strong></p><p>Das stimmt nicht. Sonne A und Sonne B sahen vergrößert ganz verschieden aus.</p></li>
</ul>
<p class="question-explanation">Für Logos, Schilder und Pläne aus klaren Formen ist eine Vektorgrafik besser.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>

<form class="question-form" novalidate>
<fieldset>

</fieldset>

<div class="question-reveal" hidden>

<p class="question-explanation">12 Buchstaben, je 4 in einer Zeile, ergeben 12 : 4 = 3 Zeilen.</p>

<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a22"><p class="explainer-assessment-label">Aufgabe 22</p><div class="question" id="frage-a22" data-id="a22" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Selin bekommt den Geheimtext TFMCRFSHEUES, 12 Buchstaben. Der Schlüssel ist 3 Buchstaben pro Zeile. Was ist der Klartext?</legend>
<label class="question-option"><input type="radio" name="frage-a22" value="0"> <span>TREFFUMSECHS</span></label>
<label class="question-option"><input type="radio" name="frage-a22" value="1"> <span>TCSUFRHEMFES</span></label>
<label class="question-option"><input type="radio" name="frage-a22" value="2"> <span>SEUEHSFRCMFT</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>TREFFUMSECHS</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>12 Buchstaben in 3 Spalten sind 4 Zeilen. Selin schreibt TFMC, RFSH und EUES als Spalten. Die Zeilen sind TRE, FFU, MSE, CHS: Treff um sechs.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>TCSUFRHEMFES</strong></p><p>Du hast den Geheimtext noch einmal verschlüsselt, also in Zeilen geschrieben. Zum Entschlüsseln schreibst du ihn in Spalten.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>SEUEHSFRCMFT</strong></p><p>Das ist der Geheimtext rückwärts gelesen. Die Skytale vertauscht die Buchstaben anders.</p></li>
</ul>
<p class="question-explanation">Zum Entschlüsseln schreibt man den Geheimtext Spalte für Spalte in Kästchen mit 3 Spalten und liest die Zeilen.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a23"><p class="explainer-assessment-label">Aufgabe 23</p><div class="question" id="frage-a23" data-id="a23" data-type="number">
<form class="question-form" novalidate>
<fieldset>

</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 5</p>
<p class="question-explanation">A → B → C → D → E → F sind 5 Schritte. Der Schlüssel ist 5.</p>
</div>
