<h1>Self-assessment</h1>
<p class="explainer-assessment-nojs">The self-assessment needs JavaScript. <a href="../../../en/information/">Information becomes data</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>With this self-assessment, 6 tasks give you an overview of what you know already. It asks about every page.</p>
<p>The app does not tell you for each task whether it is right. Only at the end do you see for each page asked whether you know it already. What you leave empty counts as not known.</p>
<p class="explainer-assessment-privacy">Your result stays on this device only. A new start replaces it.</p>
<p><button type="button" class="explainer-assessment-begin">Let's go</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Page 1 of 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Task 1</p><div class="question" id="frage-a1" data-id="a1" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Put the path of the message in the right order.</legend>
<p class="question-hint">Give each entry its place: 1 for the first.</p>
<ul class="question-pairs">
<li><label><span>Ms Berg writes the data on a note.</span> <select name="frage-a1-1" data-item="1"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option></select></label></li>
<li><label><span>Selin reads the note.</span> <select name="frage-a1-2" data-item="2"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option></select></label></li>
<li><label><span>Ms Berg knows when and where class 6b will meet.</span> <select name="frage-a1-0" data-item="0"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option></select></label></li>
<li><label><span>Selin understands that class 6b meets on Monday at 8 o'clock at the station.</span> <select name="frage-a1-3" data-item="3"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> 1. Ms Berg knows when and where class 6b will meet., 2. Ms Berg writes the data on a note., 3. Selin reads the note., 4. Selin understands that class 6b meets on Monday at 8 o'clock at the station.</p>
<p class="question-explanation">First the information is in Ms Berg's head, then it becomes data on the note. When Selin reads it and works out what it means, it becomes information again.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Task 2</p><div class="question" id="frage-a2" data-id="a2" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Match each sentence to what it describes, data or information.</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>The note says “8:00”.</span> <select name="frage-a2-0" data-left="0"><option value="">please choose</option><option value="1">information, understood from the data</option><option value="0">data, without a meaning yet</option><option value="2">neither data nor information</option></select></label></li>
<li><label><span>Selin knows that she has to be at the station at 8 o'clock.</span> <select name="frage-a2-1" data-left="1"><option value="">please choose</option><option value="1">information, understood from the data</option><option value="0">data, without a meaning yet</option><option value="2">neither data nor information</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> The note says “8:00”. – data, without a meaning yet; Selin knows that she has to be at the station at 8 o'clock. – information, understood from the data</p>
<p class="question-explanation">Symbols on the note are data. What Selin understands from them is information.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Task 3</p><div class="question" id="frage-a3" data-id="a3" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Where Mia sees 21, and what it means. Match them.</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>21 on the thermometer</span> <select name="frage-a3-0" data-left="0"><option value="">please choose</option><option value="3">That is the shirt number.</option><option value="0">It is 21 degrees.</option><option value="2">Her cousin is turning 21.</option><option value="1">It is 9 o'clock in the evening.</option></select></label></li>
<li><label><span>21:00 on the alarm clock</span> <select name="frage-a3-1" data-left="1"><option value="">please choose</option><option value="3">That is the shirt number.</option><option value="0">It is 21 degrees.</option><option value="2">Her cousin is turning 21.</option><option value="1">It is 9 o'clock in the evening.</option></select></label></li>
<li><label><span>21 candles on her cousin's cake</span> <select name="frage-a3-2" data-left="2"><option value="">please choose</option><option value="3">That is the shirt number.</option><option value="0">It is 21 degrees.</option><option value="2">Her cousin is turning 21.</option><option value="1">It is 9 o'clock in the evening.</option></select></label></li>
<li><label><span>21 on the sports shirt</span> <select name="frage-a3-3" data-left="3"><option value="">please choose</option><option value="3">That is the shirt number.</option><option value="0">It is 21 degrees.</option><option value="2">Her cousin is turning 21.</option><option value="1">It is 9 o'clock in the evening.</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> 21 on the thermometer – It is 21 degrees.; 21:00 on the alarm clock – It is 9 o'clock in the evening.; 21 candles on her cousin's cake – Her cousin is turning 21.; 21 on the sports shirt – That is the shirt number.</p>
<p class="question-explanation">The same data, the number 21, means something different depending on the context. The thermometer, the clock or the cake tells you how to read the 21.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Next</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Page 2 of 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Task 4</p><div class="question" id="frage-a4" data-id="a4" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Read it off the bar chart. How many votes did Bärenhöhle and Lindenzoo get together?</legend>
<div class="question-material"><figure class="block-figure"><div class="block-image-credit block-image-fill"><img src="../../../images/abstimmung.svg" alt="A bar chart with four bars for Seeberg, Falkenburg, Bärenhöhle and Lindenzoo and a scale from 0 to 12." loading="lazy" decoding="async"><span class="block-credit" tabindex="0" role="img" data-info="Source: own drawing. Licence: CC-BY-4.0." aria-label="Source: own drawing. Licence: CC-BY-4.0.">© CC-BY-4.0</span></div><figcaption><p>Read the height of each bar on the scale on the left.</p></figcaption></figure></div>
<label class="question-number">Your answer <input type="text" inputmode="decimal" autocomplete="off" name="frage-a4">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> 8</p>
<p class="question-explanation">The Bärenhöhle bar goes up to 5, the Lindenzoo bar up to 3. 5 + 3 = 8.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Task 5</p><div class="question" id="frage-a5" data-id="a5" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Which form answers the question fastest? Match them.</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>Which place is in the lead? I want to see it at a glance.</span> <select name="frage-a5-0" data-left="0"><option value="">please choose</option><option value="2">text</option><option value="0">bar chart</option><option value="1">table</option></select></label></li>
<li><label><span>Exactly how many votes did Bärenhöhle get?</span> <select name="frage-a5-1" data-left="1"><option value="">please choose</option><option value="2">text</option><option value="0">bar chart</option><option value="1">table</option></select></label></li>
<li><label><span>The parents want to know where the trip is going and why.</span> <select name="frage-a5-2" data-left="2"><option value="">please choose</option><option value="2">text</option><option value="0">bar chart</option><option value="1">table</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> Which place is in the lead? I want to see it at a glance. – bar chart; Exactly how many votes did Bärenhöhle get? – table; The parents want to know where the trip is going and why. – text</p>
<p class="question-explanation">The chart shows the comparison, the table the exact number, the text the meaning.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Task 6</p><div class="question" id="frage-a6" data-id="a6" data-type="true-false">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In a computer science tree, the root is at the bottom, like on a real tree.</legend>
<label class="question-option"><input type="radio" name="frage-a6" value="true"> <span>True</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="false"> <span>False</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> The statement is false.</p>
<p class="question-explanation">In computer science, the tree is upside down. The root is at the top, the leaves are at the bottom.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>
