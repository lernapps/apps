<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Task 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Which row of pixels has the code 100001? (■ is black, □ is white.)</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>■□□□□■</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>□■■■■□</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>■■□□□□</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>■□□□□■</strong> <span class="question-badge question-badge-right">right answer</span></p><p>The first and the last digit are 1, so only the first and the last pixel are black.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>□■■■■□</strong></p><p>Here black and white are swapped. That would be 011110.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>■■□□□□</strong></p><p>That would be 110000. With the code 100001 the second pixel is white.</p></li>
</ul>
<p class="question-explanation">Each digit is one pixel, from left to right. 1 is black, 0 is white.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Task 3</p><div class="question" id="frage-a3" data-id="a3" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">A picture has 6 × 6 pixels. Each pixel has a colour number with 2 bits. How many bits does the picture need?</legend>
<label class="question-number">Your answer <input type="text" inputmode="decimal" autocomplete="off" name="frage-a3" aria-describedby="frage-a3-unit"> <span id="frage-a3-unit">bits</span> </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> 72 bits</p>
<p class="question-explanation">6 × 6 = 36 pixels, each with 2 bits. 36 × 2 = 72 bits.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>

<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">What does each kind of image store? Match them.</legend>
<p class="question-hint">Choose the match for each entry.</p>
<ul class="question-pairs">
<li><label><span>bitmap image</span> <select name="frage-a4-0" data-left="0"><option value="">please choose</option><option value="1">shapes such as circles and lines with their numbers</option><option value="0">the colour of every single dot</option><option value="2">the name of the picture, for example “tent”</option></select></label></li>
<li><label><span>vector image</span> <select name="frage-a4-1" data-left="1"><option value="">please choose</option><option value="1">shapes such as circles and lines with their numbers</option><option value="0">the colour of every single dot</option><option value="2">the name of the picture, for example “tent”</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> bitmap image – the colour of every single dot; vector image – shapes such as circles and lines with their numbers</p>
<p class="question-explanation">Neither kind stores what the picture shows. One stores dots, the other stores shapes.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Task 5</p><div class="question" id="frage-a5" data-id="a5" data-type="true-false">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">A photo of Seeberg is best stored as a vector image.</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="true"> <span>True</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="false"> <span>False</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> The statement is false.</p>
<p class="question-explanation">A photo has very many different coloured dots and hardly any clear shapes. A bitmap image suits it.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Task 6</p><div class="question" id="frage-a6" data-id="a6" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">The tent logo is going on the poster and on a small T-shirt picture, sharp both times. Which kind of image suits it?</legend>
<label class="question-option"><input type="radio" name="frage-a6" value="0"> <span>a vector image, because it stays smooth at any size</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="1"> <span>a bitmap image, because it stores every pixel exactly</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="2"> <span>it does not matter, both turn out the same when made bigger</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>a vector image, because it stays smooth at any size</strong> <span class="question-badge question-badge-right">right answer</span></p><p>The logo is made of a few shapes. The computer works them out again for any size.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>a bitmap image, because it stores every pixel exactly</strong></p><p>It stores every pixel, but only at one size. On the poster the logo would become jagged.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>it does not matter, both turn out the same when made bigger</strong></p><p>That is not true. Sun A and sun B looked very different when made bigger.</p></li>
</ul>
<p class="question-explanation">For logos, signs and plans made of clear shapes, a vector image is better.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
