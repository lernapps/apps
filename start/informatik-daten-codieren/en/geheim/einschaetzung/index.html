<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Task 1</p><div class="question" id="frage-a1" data-id="a1" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Jona encrypts a message of 12 letters. The key is 4 letters per row. How many rows does he write?</legend>
<label class="question-number">Your answer <input type="text" inputmode="decimal" autocomplete="off" name="frage-a1">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> 3</p>
<p class="question-explanation">12 letters, 4 in each row, give 12 ÷ 4 = 3 rows.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Task 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Selin gets the ciphertext BTTLOAWVATEE, 12 letters. The key is 3 letters per row. What is the plaintext?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>BOATATTWELVE</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>BLWTTOVETAAE</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>EETAVWAOLTTB</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>BOATATTWELVE</strong> <span class="question-badge question-badge-right">right answer</span></p><p>12 letters in 3 columns make 4 rows. Selin writes BTTL, OAWV and ATEE as columns. The rows are BOA, TAT, TWE, LVE: boat at twelve.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>BLWTTOVETAAE</strong></p><p>You encrypted the ciphertext again, by writing it in rows. To decrypt, you write it in columns.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>EETAVWAOLTTB</strong></p><p>That is the ciphertext read backwards. The scytale mixes up the letters in a different way.</p></li>
</ul>
<p class="question-explanation">To decrypt, you write the ciphertext column by column into boxes with 3 columns and read the rows.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Task 3</p><div class="question" id="frage-a3" data-id="a3" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">With a key, A becomes F. Which key is it?</legend>
<label class="question-number">Your answer <input type="text" inputmode="decimal" autocomplete="off" name="frage-a3">  </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> 5</p>
<p class="question-explanation">A → B → C → D → E → F is 5 steps. The key is 5.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
