<label class="question-number">Your answer <input type="text" inputmode="decimal" autocomplete="off" name="frage-a3" aria-describedby="frage-a3-unit"> <span id="frage-a3-unit">bits</span> </label>

<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>

</div></li>
