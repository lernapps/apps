<g font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#222">
<text x="26.0" y="18" font-size="15">128</text>
<rect x="6" y="26" width="40" height="60" rx="6" fill="url(#rueckseite)" stroke="#333" stroke-width="2"/>
