<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../bits/">Alles ist 0 und 1</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 8 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>

<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Was bedeutet das Zeichen? Ordne zu.</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>Das rote Ampelmännchen leuchtet.</span> <select name="frage-a1-0" data-left="0"><option value="">bitte wählen</option><option value="1">Du darfst gehen.</option><option value="0">Stehen bleiben.</option><option value="2">Die Kasse hat die Nummer der Ware gelesen.</option></select></label></li>
<li><label><span>Das grüne Ampelmännchen leuchtet.</span> <select name="frage-a1-1" data-left="1"><option value="">bitte wählen</option><option value="1">Du darfst gehen.</option><option value="0">Stehen bleiben.</option><option value="2">Die Kasse hat die Nummer der Ware gelesen.</option></select></label></li>
<li><label><span>Die Kasse piept beim Strichcode der Milch.</span> <select name="frage-a1-2" data-left="2"><option value="">bitte wählen</option><option value="1">Du darfst gehen.</option><option value="0">Stehen bleiben.</option><option value="2">Die Kasse hat die Nummer der Ware gelesen.</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> Das rote Ampelmännchen leuchtet. – Stehen bleiben.; Das grüne Ampelmännchen leuchtet. – Du darfst gehen.; Die Kasse piept beim Strichcode der Milch. – Die Kasse hat die Nummer der Ware gelesen.</p>
<p class="question-explanation">Jedes Zeichen steht nach einer festen Regel für eine Bedeutung. Wer die Regel kennt, versteht das Zeichen ohne Worte.</p>
</div>
