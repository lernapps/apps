# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Es gibt keine KMK-Bildungsstandards Geschichte für die Sekundarstufe I. Die Stränge sind die Epochen und
# Inhaltsbereiche, die alle drei Länder teilen, dazu die Grundbegriffe des Fachs (Zeit, Quellen), die alle drei in
# Jg 5/6 als Inhalt lehren. Prozesskompetenzen (Quellen interpretieren, Karten lesen, urteilen) sind nicht modelliert.
# Quellenkürzel in den Kommentaren (genaue Titel, Ausgaben und URLs: .vibe/research-geschichte.md):
#   HE = Hessen, Gymnasium (G9):
#        KC = Kerncurriculum Sek I Gymnasium Geschichte (2011), Kap. 6: Basisnarrative und Dimensionen, ohne Jahrgang
#        LP = Lehrplan Geschichte, Gymnasialer Bildungsgang, Jg 6 bis 13; Themen 6.x, 8.x, 9.x, 10.x mit verbindlichen
#             Inhalten (1), (2) … ; Jg 6 -> "5-6", Jg 8 -> "7-8", Jg 9 und 10 -> "9-10" (Jg 5 und 7 ohne Geschichte)
#        Steht ein Inhalt nur im KC, zählt die HE-Stimme für jede Stufe ("5-10").
#   BY = LehrplanPLUS Bayern Gymnasium Geschichte (G9), G6 bis G10 = Jahrgangsstufe, LB = Lernbereich
#   NW = Kernlehrplan NRW Sek I Gymnasium (G9) Geschichte, Heft 3407 (2019), IF = Inhaltsfeld;
#        Stufe 1 = bis Ende Erprobungsstufe (Jg 5/6) -> "5-6"; Stufe 2 = bis Ende Sek I -> "7-10" (zählt für 7-8 und 9-10)
#        SK/MK/UK/HK = Sach-, Methoden-, Urteils-, Handlungskompetenz
# Richtstufe: eine Stimme je Land, zwei von drei entscheiden; bei Gleichstand entscheiden die requires,
# lassen sie beide Stufen zu, die frühere. "SCHWACH BELEGT" = nur ein Land ausdrücklich, das zweite nur allgemein.
name: { de: Geschichte, en: History }               # the file name is the subject's id: geschichte
source:
  title: Gemeinsame Inhaltsbereiche der Länder (keine KMK-Bildungsstandards Geschichte Sek I); Grundlage Kerncurriculum Hessen, Sekundarstufe I - Gymnasium, Geschichte (Hessisches Kultusministerium), mit LehrplanPLUS Bayern und Kernlehrplan NRW
  url: https://kultus.hessen.de/sites/kultus.hessen.de/files/2021-07/kerncurriculum_geschichte_gymnasium.pdf
strands:
  - id: grundlagen
    name: { de: "Geschichte und Zeit: Grundbegriffe", en: "History and time: basic concepts" }
    competencies:
      # HE LP 6.1 (1), (3): Vor-Urteile, Geschichte als Prozess; BY G6 LB1: Dimensionen Vergangenheit, Gegenwart und Zukunft; NW Stufe 1 SK 1, HK 1: Bezug der Vergangenheit zur eigenen Gegenwart. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: was-ist-geschichte
        iCan: "Ich kann Vergangenheit, Gegenwart und Zukunft unterscheiden und erklären, womit sich das Fach Geschichte beschäftigt."
        gradeBand: "5-6"
      # HE LP 6.1 (2): Orte und Räume geschichtlicher Überlieferung (Wohnort, Stadt, Region); BY G6 LB3, LB5: Spuren antiker Bezüge in Lebenswelt und Heimatraum; NW Stufe 1 SK 1: Spuren der Vergangenheit in der Gegenwart identifizieren. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: spuren-der-vergangenheit
        iCan: "Ich kann in meiner Umgebung Spuren der Vergangenheit finden, zum Beispiel alte Gebäude, Straßennamen oder Denkmäler."
        gradeBand: "5-6"
        requires: [was-ist-geschichte]
      # HE LP 6.1 (3): absolute Chronologie; BY G6 LB1: Zeit als zentrale Dimension; Grundlegende Daten v. Chr. (LB2, LB3, LB5); NW 2.1 Sachkompetenz: Datierungssysteme; Stufe 1 SK 6: zeitliche Dimension. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: zeitrechnung
        iCan: "Ich kann Jahreszahlen vor und nach Christi Geburt lesen und ausrechnen, wie lange ein Ereignis her ist."
        gradeBand: "5-6"
        requires: [was-ist-geschichte]
      # HE LP 6.1 (3): absolute Chronologie; BY G6 LB3, LB5: Daten als Jahrhunderte („5. Jh. v. Chr.“, „1. Jh. v. Chr.“); NW 2.1 Sachkompetenz: Datierungssysteme; Stufe 1 SK 6. Hinweis: Teil von `zeitrechnung`, als eigene Seite getrennt. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: jahrhunderte
        iCan: "Ich kann eine Jahreszahl dem richtigen Jahrhundert und Jahrtausend zuordnen, zum Beispiel 1517 dem 16. Jahrhundert."
        gradeBand: "5-6"
        requires: [zeitrechnung]
      # HE LP 6.1 (3): relative Chronologie; 6.2 Arbeitsmethoden: Einführung der Zeitleiste; BY G6 LB5: römische Geschichte mithilfe Grundlegender Daten gliedern; NW Stufe 1 SK 6: Ereignisse in ihrer zeitlichen Dimension identifizieren. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: zeitleiste
        iCan: "Ich kann Ereignisse auf einer Zeitleiste in die richtige Reihenfolge bringen und Abstände zwischen ihnen erkennen."
        gradeBand: "5-6"
        requires: [zeitrechnung, jahrhunderte]
      # HE LP 6.1 (3): Zeitalter/Epochen; KC Kap. 6: Konzept der Epoche; BY G6 LB3, LB6: Begriffe Antike, Mittelalter, Epochengrenzen; G7 LB3: Neuzeit; NW 2.1 Sachkompetenz: historische Epochen; Stufe 1 SK 6. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: epochen
        iCan: "Ich kann die Epochen Urgeschichte, Antike, Mittelalter und Neuzeit in die richtige Reihenfolge bringen und ungefähr datieren."
        gradeBand: "5-6"
        requires: [zeitleiste]
      # HE LP 6.1 (5): Formen geschichtlicher Überlieferung; 6.3 Hinweise: Schriftzeugnisse, Bilder, Bauwerke als Quellen; BY G6 LB1: schriftliche, mündliche, bildliche und gegenständliche Quellen; NW 2.1 Methodenkompetenz: Gattungen; Stufe 1 MK 4: Quellen unterschiedlicher Gattungen. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: quellenarten
        iCan: "Ich kann schriftliche, bildliche, gegenständliche und mündliche Quellen unterscheiden und Beispiele nennen."
        gradeBand: "5-6"
        requires: [was-ist-geschichte]
      # HE KC Kap. 6 Analysekompetenz: Gattungen, Augenzeuge – Historiker (ohne Jahrgang); BY G6 LB1: Quellen von Darstellungstexten unterscheiden; NW Stufe 1 MK 3: zwischen Quellen und Darstellungen unterscheiden. Stimmen HE/BY/NW 5-10/5-6/5-6: Mehrheit
      - id: quelle-und-darstellung
        iCan: "Ich kann eine Quelle von einer Darstellung unterscheiden, zum Beispiel einen Brief aus der Zeit von einem Text im Schulbuch."
        gradeBand: "5-6"
        requires: [quellenarten]
      # HE LP 6.1 (5): Quellen als Überreste und Überlieferung; BY G6 LB1: Überrest und Überlieferung. Stimmen HE/BY/NW 5-6/5-6/–: Mehrheit
      - id: ueberrest-und-tradition
        iCan: "Ich kann unterscheiden, ob eine Quelle zufällig erhalten ist (Überrest) oder mit Absicht für die Nachwelt geschaffen wurde (Überlieferung)."
        gradeBand: "5-6"
        requires: [quellenarten]
      # HE LP 6.2 (1): kulturelle Überreste und ihre Deutung; Arbeitsmethoden: Funde als Quellen („Ötzi“); BY G6 LB1: Bedeutung der Archäologie; NW IF1 (Stufe 1): grundlegende Verfahrensweisen und Zugriffe historischen Arbeitens. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: archaeologie
        iCan: "Ich kann erklären, wie Archäologinnen und Archäologen Funde ausgraben, datieren und deuten."
        gradeBand: "5-6"
        requires: [quellenarten]
  - id: urgeschichte
    name: { de: "Urgeschichte und frühe Hochkulturen", en: "Prehistory and early civilisations" }
    competencies:
      # SCHWACH BELEGT (ausdrücklich nur KC HE und die Beschreibung von IF1 NW). HE KC Basisnarrativ Ur- und Frühgeschichte: „Menschwerdung“ (ohne Jahrgang); LP 6.2 nennt sie nicht; BY G6 (Titel „Von den ersten Menschen …“), LB1 nennt nur die Altsteinzeit; NW IF1 (Stufe 1): „Entwicklung des Menschen“ (Beschreibung des Inhaltsfelds). Stimmen HE/BY/NW 5-10/5-6/5-6: Mehrheit
      - id: menschwerdung
        iCan: "Ich kann beschreiben, wie sich die ersten Menschen in Afrika entwickelten und über die Erde ausbreiteten."
        gradeBand: "5-6"
        requires: [epochen]
      # HE LP 6.2 (1): Leben in der Altsteinzeit (Kalt- und Warmzeiten, Gruppen, Wohnplätze); BY G6 LB1: Jäger und Sammler der Altsteinzeit; NW IF1 (Stufe 1): Lebensweisen in der Alt- und Jungsteinzeit. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: altsteinzeit
        iCan: "Ich kann beschreiben, wie die Menschen in der Altsteinzeit als Jäger und Sammler lebten."
        gradeBand: "5-6"
        requires: [menschwerdung]
      # HE LP 6.2 (1): Auseinandersetzung mit der Natur, Werkzeuge und Waffen; BY G6 LB1: Überlebenstechniken (Feuer, Wohnungsbau, Werkzeug- und Waffentechnik); NW IF1 (Stufe 1): steinzeitliche Lebensformen. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: feuer-und-werkzeuge
        iCan: "Ich kann erklären, wie Feuer, Werkzeuge und Waffen das Leben der Menschen in der Steinzeit verändert haben."
        gradeBand: "5-6"
        requires: [altsteinzeit]
      # HE LP 6.2 (2): Ackerbau und Viehhaltung, Sesshaftigkeit, Vorratswirtschaft; BY G6 LB1: Bauern der Jungsteinzeit; NW IF1 (Stufe 1): Lebensweisen in der Jungsteinzeit. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: jungsteinzeit
        iCan: "Ich kann beschreiben, wie die Menschen in der Jungsteinzeit als Bauern und Viehzüchter in Dörfern lebten."
        gradeBand: "5-6"
        requires: [altsteinzeit]
      # HE LP 6.2 (2): „Jungsteinzeitliche Revolution“, Arbeitsteilung, Konflikte um Eigentum; KC: Arbeitsteilung und Sesshaftwerdung; BY G6 LB1: Wandel von der Alt- zur Jungsteinzeit; NW IF1 (Stufe 1) UK: Bedeutung der Neolithischen Revolution, auch für die Umwelt. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: neolithische-revolution
        iCan: "Ich kann erklären, warum der Übergang zur Sesshaftigkeit „Neolithische Revolution“ heißt und wie er Arbeit, Besitz und Umwelt veränderte."
        gradeBand: "5-6"
        requires: [jungsteinzeit]
      # HE LP 6.3 (1): Leben in der Stromkultur, Nilschwelle, Bewässerung; BY G6 LB2: Nutzung der Stromlandschaft, Bedeutung des Nils; NW IF1 (Stufe 1): Einfluss naturgegebener Voraussetzungen auf die Entstehung. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: nil-und-hochkultur
        iCan: "Ich kann erklären, warum am Nil eine Hochkultur entstand und wie die Nilschwemme das Leben der Menschen bestimmte."
        gradeBand: "5-6"
        requires: [neolithische-revolution]
      # HE LP 6.3: arbeitsteilige, differenzierte Sozialordnung; KC: Herrschaft, Religion, Wirtschaft und Schrift in frühen Stromkulturen; BY G6 LB2: Merkmale einer Hochkultur; NW IF1 (Stufe 1): Merkmale der Hochkultur Ägyptens. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: merkmale-hochkultur
        iCan: "Ich kann die Merkmale einer Hochkultur nennen, zum Beispiel Staat, Schrift, Arbeitsteilung und Religion, und sie am alten Ägypten zeigen."
        gradeBand: "5-6"
        requires: [nil-und-hochkultur]
      # HE LP 6.3 (2): Pharao als König und Gott, Beamte und Priester, Ausdifferenzierung der Gesellschaft; BY G6 LB2: Herrschaft der Pharaonen, Gesellschaft; NW IF1 (Stufe 1): Merkmale der Hochkultur Ägyptens. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: pharao-und-gesellschaft
        iCan: "Ich kann die Herrschaft des Pharaos und den Aufbau der ägyptischen Gesellschaft mit Beamten, Priestern, Bauern und Sklaven beschreiben."
        gradeBand: "5-6"
        requires: [merkmale-hochkultur]
      # HE LP 6.3 (2): Legitimation von Herrschaft, Pharao als König; BY G6 LB2: Merkmale von Monarchie, Grundbegriff Monarchie; NW Stufe 1 SK 6: Herrschaftsformen identifizieren. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: monarchie
        iCan: "Ich kann am Beispiel des Pharaos erklären, was eine Monarchie ist und wie ein Herrscher seine Macht begründen kann."
        gradeBand: "5-6"
        requires: [pharao-und-gesellschaft]
      # HE LP 6.3 (2), (3): Tempel und Gräber, Götter und Jenseitsvorstellungen, Pyramiden um 2500 v. Chr.; BY G6 LB2: Bau- und Kunstwerke (Pyramiden), Religion; NW IF1 (Stufe 1): Merkmale der Hochkultur Ägyptens. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: religion-aegypten
        iCan: "Ich kann die Götter- und Jenseitsvorstellungen der Ägypter beschreiben und erklären, warum sie Pyramiden und Grabmäler bauten."
        gradeBand: "5-6"
        requires: [merkmale-hochkultur]
      # HE LP 6.3 (3): Schrift, Schreibwerkzeuge und Beschreibstoffe; KC: Schrift in frühen Stromkulturen; BY G6 LB2: kulturelle Leistungen der Hochkultur; NW IF1 (Stufe 1): Merkmale der Hochkultur Ägyptens. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: hieroglyphen
        iCan: "Ich kann erklären, wie die Ägypter mit Hieroglyphen schrieben und warum die Schrift für eine Hochkultur wichtig war."
        gradeBand: "5-6"
        requires: [merkmale-hochkultur]
      # HE LP 6.3 (3): Kalender, Landvermessung, Architektur; BY G6 LB2: Bedeutung grundlegender technischer und kultureller Leistungen für die Menschheit. Stimmen HE/BY/NW 5-6/5-6/–: Mehrheit
      - id: leistungen-aegypten
        iCan: "Ich kann Leistungen der Ägypter nennen, die bis heute wirken, zum Beispiel den Kalender, die Landvermessung und die Baukunst."
        gradeBand: "5-6"
        requires: [merkmale-hochkultur]
  - id: antike
    name: { de: "Antike: Griechenland und Rom", en: "Antiquity: Greece and Rome" }
    competencies:
      # HE LP 6.4 (1): räumliche Gliederung Griechenlands; KC: griechische Polis; BY G6 LB3: Landesnatur, Polis; NW IF2 (Stufe 1): Lebenswelten in griechischen Poleis. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: polis
        iCan: "Ich kann erklären, wie die Landschaft Griechenlands dazu beitrug, dass viele selbstständige Stadtstaaten (Poleis) entstanden."
        gradeBand: "5-6"
        requires: [epochen]
      # HE LP 6.4 (1): Kolonisation; BY G6 LB3: Kolonisation (Vergleich mit Migration heute). Stimmen HE/BY/NW 5-6/5-6/–: Mehrheit
      - id: griechische-kolonisation
        iCan: "Ich kann erklären, warum Griechen Kolonien rund um das Mittelmeer gründeten."
        gradeBand: "5-6"
        requires: [polis]
      # HE LP 6.4 (1): Götter und Helden, Kulte und Feste, Homer; BY G6 LB3: Mythen und Epen, Olympische Spiele, Theater; NW IF2 (Stufe 1): gemeinsame Götterwelt (Beschreibung des Inhaltsfelds). Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: goetter-und-olympia
        iCan: "Ich kann beschreiben, woran die Griechen glaubten und welche Rolle Götter, Mythen und die Olympischen Spiele für sie spielten."
        gradeBand: "5-6"
        requires: [polis]
      # HE LP 6.4 (2): Grundzüge der attischen Demokratie um 430 v. Chr.; BY G6 LB3: Verfassung der attischen Demokratie (Schaubild); NW IF2 (Stufe 1): Formen politischer Beteiligung in griechischen Poleis. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: attische-demokratie
        iCan: "Ich kann beschreiben, wie die Demokratie in Athen funktionierte, zum Beispiel mit Volksversammlung, Rat und Scherbengericht."
        gradeBand: "5-6"
        requires: [polis]
      # HE LP 6.4 (2): Bürger und Nichtbürger, Rolle der Frau; BY G6 LB7: Geschlechterrollen in der athenischen Gesellschaft; NW IF2 (Stufe 1) UK: Beteiligungsmöglichkeiten verschiedener Bevölkerungsgruppen. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: buerger-und-nichtbuerger
        iCan: "Ich kann erklären, wer in Athen mitbestimmen durfte und wer nicht, zum Beispiel Frauen, Fremde und Sklaven."
        gradeBand: "5-6"
        requires: [attische-demokratie]
      # HE KC: Freiheit und Mitbestimmung in der griechischen Polis (ohne Jahrgang); LP 6.4 nur Rollenspiel; BY G6 LB3: attische Demokratie vor dem Hintergrund moderner Vorstellungen beurteilen; NW IF2 (Stufe 1) UK: Beteiligung in Vergangenheit (Polis) und Gegenwart (Deutschland). Stimmen HE/BY/NW 5-10/5-6/5-6: Mehrheit
      - id: demokratie-damals-heute
        iCan: "Ich kann die Demokratie im antiken Athen mit unserer Demokratie heute vergleichen."
        gradeBand: "5-6"
        requires: [buerger-und-nichtbuerger]
      # HE LP 6.4 (2): Perserkriege und Aufstieg zur führenden Seemacht; BY G6 LB3: Zusammenhang von attischer Demokratie und Perserkriegen. Stimmen HE/BY/NW 5-6/5-6/–: Mehrheit
      - id: perserkriege
        iCan: "Ich kann erklären, wie die Perserkriege Athen zur führenden Seemacht machten und die Demokratie stärkten."
        gradeBand: "5-6"
        requires: [attische-demokratie]
      # SCHWACH BELEGT (BY nennt Alexander nur als Beispiel). HE LP 6.4 (3): Alexanderreich 336–323 v. Chr., Welt des Hellenismus; BY G6 LB4: „z. B. Alexander der Große“ (nur Beispiel). Stimmen HE/BY/NW 5-6/5-6/–: Mehrheit
      - id: alexander-und-hellenismus
        iCan: "Ich kann beschreiben, wie Alexander der Große ein Weltreich eroberte und wie sich dadurch die griechische Kultur ausbreitete (Hellenismus)."
        gradeBand: "5-6"
        requires: [polis]
      # HE LP 6.5 (1): Gründungssage Roms 753 v. Chr.; BY G6 LB5: Narrationen zur Gründung Roms, Mythos und Geschichtsschreibung. Stimmen HE/BY/NW 5-6/5-6/–: Mehrheit
      # Siehe auch: latein/gruendungsmythos
      - id: gruendungssage-roms
        iCan: "Ich kann die Sage von der Gründung Roms erzählen und erklären, wie sich ein Mythos von einem Geschichtsbericht unterscheidet."
        gradeBand: "5-6"
        requires: [quelle-und-darstellung]
      # HE LP 6.5 (1): Grundzüge der republikanischen Ordnung; BY G6 LB5: römische Republik, Grundbegriffe Senat, Republik, Diktator; NW IF2 (Stufe 1): res publica. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      # Siehe auch: latein/koenigszeit-und-republik, latein/senat-und-magistrate
      - id: roemische-republik
        iCan: "Ich kann den Aufbau der römischen Republik mit Senat, Konsuln und Volksversammlung beschreiben."
        gradeBand: "5-6"
        requires: [gruendungssage-roms]
      # HE LP 6.5 (1): Patrizier und Plebejer; BY G6 LB5: römische Republik, Gesellschaft und Machtverhältnisse; NW IF2 (Stufe 1): Lebenswirklichkeiten unterschiedlicher gesellschaftlicher Gruppen. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: patrizier-und-plebejer
        iCan: "Ich kann den Streit zwischen Patriziern und Plebejern erklären und beschreiben, wie die Plebejer mehr Rechte erkämpften."
        gradeBand: "5-6"
        requires: [roemische-republik]
      # HE LP 6.5 (1): altrömische Familie; BY G6 LB7: Struktur und Aufgaben der „familia“; NW IF2 (Stufe 1): römische Familie; UK Werte antiker Erziehung. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      # Siehe auch: latein/roemische-familie
      - id: roemische-familie
        iCan: "Ich kann beschreiben, wie eine römische Familie (familia) aufgebaut war und welche Rolle Vater, Mutter, Kinder und Sklaven hatten."
        gradeBand: "5-6"
        requires: [roemische-republik]
      # HE LP 6.5 (2): Etappen der Ausdehnung; BY G6 LB5: Ausdehnung des Imperium Romanum in Etappen (Karte); NW IF2 (Stufe 1): römische Expansion; KC HE: Entwicklung zum Imperium Romanum. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      # Siehe auch: latein/provinzen-und-imperium
      - id: expansion-roms
        iCan: "Ich kann beschreiben, wie Rom vom Stadtstaat zum Weltreich wurde, und die Etappen auf einer Karte zeigen."
        gradeBand: "5-6"
        requires: [roemische-republik]
      # HE LP 6.5 (2): innere Konflikte und Reformen, Sklavenaufstände; BY G6 LB5: Entwicklung von der Republik zum Prinzipat; NW IF2 (Stufe 1): Rückwirkungen der Expansion auf die inneren Verhältnisse der res publica. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: krise-der-republik
        iCan: "Ich kann erklären, wie die Eroberungen zu Konflikten in Rom führten und die Republik in eine Krise stürzten."
        gradeBand: "5-6"
        requires: [expansion-roms, patrizier-und-plebejer]
      # HE LP 6.5 (2): Herausbildung der Alleinherrschaft, Caesar 44 v. Chr., Augustus, Pax Augusta; BY G6 LB5: von der Republik zum Prinzipat, Zeitalter des Augustus; NW IF2 (Stufe 1): Herrschaft im Imperium Romanum. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      # Siehe auch: latein/augustus-und-prinzipat
      - id: caesar-und-augustus
        iCan: "Ich kann erklären, wie Caesar und Augustus die Alleinherrschaft errichteten und wie aus der Republik das Kaisertum (Prinzipat) wurde."
        gradeBand: "5-6"
        requires: [krise-der-republik, monarchie]
      # HE LP 6.5 (3): Leben und Wohnen in Rom und auf dem Land, Brot und Spiele; BY G6 LB5/LB7: Gesellschaft (kein eigener Inhalt zum Stadtleben); NW IF2 (Stufe 1): großstädtisches Alltagsleben im antiken Rom. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      - id: leben-in-rom
        iCan: "Ich kann das Alltagsleben in der Großstadt Rom beschreiben, zum Beispiel Wohnen, Arbeiten, Thermen und „Brot und Spiele“."
        gradeBand: "5-6"
        requires: [roemische-republik]
      # HE LP 6.5 (3): Romanisierung der Provinzen; BY G6 LB5: römische Herrschaft in den Provinzen, Bayern; Grundbegriffe Romanisierung, Provinz; NW IF2 (Stufe 1) UK: Einfluss des Imperium Romanum auf die eroberten Gebiete. Stimmen HE/BY/NW 5-6/5-6/5-6: Mehrheit
      # Siehe auch: latein/provinzen-und-imperium
      - id: romanisierung
        iCan: "Ich kann erklären, wie die Römer das Leben in den Provinzen prägten (Romanisierung), auch im Gebiet des heutigen Deutschlands."
        gradeBand: "5-6"
        requires: [expansion-roms]
