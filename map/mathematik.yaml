# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
#
# PROPOSAL (research, not applied): subject model Mathematik, strands and Bausteine revised from public sources.
# Format of map/<subject>.yaml (docs/learning-map-contract.md). Details, decisions and the id migration: report.md.
#
# Source abbreviations used in the comments (full citations in report.md):
#   KMK    = KMK Bildungsstandards Mathematik ESA/MSA (i.d.F. 23.06.2022); page of the PDF
#   KMK L <Leitidee> S. n = the Leitidee of the KMK under which the content is named, with page of the PDF (Leitideen: S. 7)
#   KMK-P  = KMK Bildungsstandards Mathematik Primarbereich (i.d.F. 23.06.2022)
#   HE     = Hessen, Lehrplan Mathematik gymnasialer Bildungsgang Jg. 5-13 (G9), unit number "5.1" ... "10.5" (grade = first number)
#   HE-KC  = Hessen, Kerncurriculum Mathematik Sek I Gymnasium, Kap. 7.3 Schwerpunktsetzungen (two-year bands 5/6, 7/8, 9/10)
#   BY     = Bayern, LehrplanPLUS Gymnasium (neunstufig) Mathematik 5 ... 10, section "M<Jg> <n.m>"
#   NRW    = Nordrhein-Westfalen, Kernlehrplan Sek I Gymnasium Mathematik (Heft 3401, 2019): E = Erprobungsstufe (5-6),
#            S1 = Erste Stufe, S2 = Zweite Stufe, Ari/Fkt/Geo/Sto-n = Kompetenzerwartung n of the Inhaltsfeld
#   SILP   = NRW, Beispiel fuer einen schulinternen Lehrplan Gymnasium Sek I Mathematik (31.01.2020), unit "6.2" ... (grade = first number;
#            the Kernlehrplan itself names only the stages, the example gives the grades; S1 is read as 7-8, S2 as 9-10)
#   "bands" = where HE / BY / NRW place it; the Richtstufe is the majority. Where all three differ it says "no majority".
# Strands = the five Leitideen of the KMK (S. 7, 15-22); ids kept from the Sachgebiets-Fassung (arithmetik, algebra,
#   geometrie, stochastik; funktionen merged into algebra). Where the KMK names a content under two Leitideen, the
#   comment names both and the Schwerpunkt decides.
# requires: Neue und geänderte Kanten sind am Baustein begründet („# requires <id>: …“), die übrigen über die Fundstellen; Methode: Skill map-research.
name: { de: Mathematik, en: Mathematics }
source:
  title: KMK-Bildungsstandards Mathematik, ESA und MSA (2022)
  url: https://www.kmk.org/fileadmin/Dateien/veroeffentlichungen_beschluesse/2022/2022_06_23-Bista-ESA-MSA-Mathe.pdf
status: draft
strands:
  # ===================================================================================================================
  # Leitidee „Zahl und Operation“: KMK S. 7 (Liste der Leitideen), S. 15-16. Zahlvorstellungen, Rechnen, Rechengesetze,
  # Potenzen und Wurzeln, Prozent- und Zinsrechnung, Zahlenfolgen und Zählprinzipien. Id aus der Sachgebiets-Fassung (Arithmetik).
  # ===================================================================================================================
  - id: arithmetik
    name: { de: Zahl und Operation, en: Number and operation }
    competencies:
      - id: natuerliche-zahlen
        # KMK L Zahl und Operation S. 15: „nutzen sinntragende Vorstellungen von rationalen Zahlen, insbesondere von natürlichen …“, „stellen Zahlen der Situation angemessen dar“
        # KMK p.15 (stellen Zahlen der Situation angemessen dar), KMK-P p.14; HE 5.1 (Stellenwertsysteme, bis Billion); BY M5 1.1; NRW E Ari-8 (SILP 5.2)
        # bands: HE 5 / BY 5 / NRW 5-6 -> 5-6
        name: { de: "Natürliche Zahlen im Stellenwertsystem", en: "Natural numbers and place value" }
        iCan: "Ich kann natürliche Zahlen im Stellenwertsystem lesen, schreiben und darstellen."
        gradeBand: "5-6"
      - id: zahlen-vergleichen-ordnen
        # KMK L Zahl und Operation S. 15: „nutzen sinntragende Vorstellungen von rationalen Zahlen, insbesondere von natürlichen …“
        # NARROWED to natural numbers (was: also fractions, negative numbers, roots; those moved to their own Bausteine).
        # KMK p.15-16; HE 5.1 (Vergleichen, Ordnen, Zahlenstrahl, Groessenordnung); BY M5 1.1 (Zahlenstrahl, Skalierung); NRW E Ari-8
        # bands: 5 / 5 / 5-6 -> 5-6
        name: { de: "Zahlen vergleichen und ordnen", en: "Comparing and ordering numbers" }
        iCan: "Ich kann natürliche Zahlen vergleichen, am Zahlenstrahl ablesen und der Größe nach ordnen."
        gradeBand: "5-6"
        requires: [natuerliche-zahlen]
      - id: runden
        # KMK L Zahl und Operation S. 16: „runden Zahlen dem Sachverhalt entsprechend sinnvoll“
        # KMK p.16 (runden Zahlen sinnvoll); HE 5.1, 6.1 (Dezimalbrueche runden); BY M5 1.1; NRW E Ari-10
        # bands: 5-6 / 5 / 5-6 -> 5-6
        name: { de: "Runden", en: "Rounding" }
        iCan: "Ich kann Zahlen und Größen sinnvoll runden und die Genauigkeit zur Aufgabe passend wählen."
        gradeBand: "5-6"
        requires: [natuerliche-zahlen]
      - id: schriftliche-verfahren
        # KMK L Zahl und Operation S. 16: „führen [Verfahren, denen Algorithmen bzw. Kalküle zu Grunde liegen] aus (z. B. schriftliche Rechenoperationen)“
        # NEW (split from grundrechenarten-rechengesetze). KMK p.16 (Algorithmen, z. B. schriftliche Rechenoperationen), KMK-P p.14;
        # HE 5.1 (schriftliche Division); BY M5 1.2, 3.1; NRW E Ari-14
        # bands: 5 / 5 / 5-6 -> 5-6
        name: { de: "Schriftliche Rechenverfahren", en: "Written calculation methods" }
        iCan: "Ich kann natürliche Zahlen schriftlich addieren, subtrahieren, multiplizieren und dividieren."
        gradeBand: "5-6"
        requires: [natuerliche-zahlen]
      - id: grundrechenarten-rechengesetze
        # KMK L Zahl und Operation S. 16: „nutzen Rechengesetze (z. B. Kommutativ-, Assoziativ-, Distributivgesetz), auch zum vorteilhaften Rechnen“
        # NARROWED to laws and precedence (schriftliche Verfahren split off). KMK p.16 (Rechengesetze, vorteilhaftes Rechnen);
        # HE 5.1 (Vorrangregeln, Distributivgesetz); BY M5 1.2, 3.2; NRW E Ari-3, Ari-4
        # bands: 5 / 5 / 5-6 -> 5-6
        name: { de: "Vorrangregeln und Rechengesetze", en: "Order of operations and laws of arithmetic" }
        iCan: "Ich kann Klammern und Vorrangregeln beachten und Rechengesetze für vorteilhaftes Rechnen nutzen."
        gradeBand: "5-6"
        requires: [schriftliche-verfahren]
      - id: ueberschlagen
        # KMK L Zahl und Operation S. 16: „nutzen Überschlagsrechnungen zur Orientierung und zur Kontrolle“
        # NEW (split from groessenvorstellungen-schaetzen). KMK p.16 (Ueberschlagsrechnungen zur Orientierung und Kontrolle);
        # HE 5.1, 6.1; BY M5 3.1, M6 1.3; NRW E Ari-10
        # bands: 5-6 / 5-6 / 5-6 -> 5-6
        name: { de: "Überschlagsrechnung", en: "Estimating results" }
        iCan: "Ich kann Ergebnisse mit einem Überschlag auf Sinn prüfen."
        gradeBand: "5-6"
        requires: [runden, grundrechenarten-rechengesetze]
      - id: potenzen
        # KMK L Zahl und Operation S. 15-16: „stellen Zahlen … in Zehnerpotenzschreibweise“ dar; „erläutern Potenzen und Wurzeln und berechnen einfache Potenzen“
        # NARROWED: natural exponents and powers of ten. Potenzgesetze, negative
        # exponents, roots: own Bausteine.
        # KMK p.15-16 (Zehnerpotenzschreibweise, einfache Potenzen); HE 5.1 (Potenzschreibweise, Stellenwertsysteme); BY M5 3.1; NRW E Ari-1, S2 Ari-1
        # bands: 5 / 5 / 5-6 -> 5-6
        name: { de: "Potenzen und Zehnerpotenzen", en: "Powers and powers of ten" }
        iCan: "Ich kann Potenzen mit natürlichen Exponenten berechnen und Zehnerpotenzen zum Darstellen großer Zahlen nutzen."
        gradeBand: "5-6"
        requires: [grundrechenarten-rechengesetze]
      - id: teilbarkeit
        # KMK L Zahl und Operation S. 15: „untersuchen Zahlen nach ihren Faktoren“
        # NARROWED (ggT/kgV and Primfaktoren split off). KMK p.15 (untersuchen Zahlen nach ihren Faktoren); HE 6.1; BY M5 3.1; NRW E Ari-2
        # bands: 6 / 5 / 5-6 -> 5-6
        name: { de: "Teiler, Vielfache und Teilbarkeit", en: "Factors, multiples and divisibility" }
        iCan: "Ich kann Teiler und Vielfache bestimmen und Teilbarkeitsregeln anwenden."
        gradeBand: "5-6"
        requires: [grundrechenarten-rechengesetze]
      - id: primfaktoren-ggt-kgv
        # KMK L Zahl und Operation S. 15: „untersuchen Zahlen nach ihren Faktoren, in einfachen Fällen ohne digitale Mathematikwerkzeuge“
        # NEW (split from teilbarkeit). KMK p.15; HE 6.1 (Primzahlen, Primfaktorzerlegung, ggT, kgV); BY M5 3.1 (Primfaktorzerlegung);
        # NRW E Ari-1 (Primfaktorzerlegung; ggT/kgV not named, SILP 5.9)
        # bands: 6 / 5 / 5-6 -> 5-6
        name: { de: "Primfaktoren, ggT und kgV", en: "Prime factors, HCF and LCM" }
        iCan: "Ich kann Zahlen in Primfaktoren zerlegen und ggT und kgV bestimmen."
        gradeBand: "5-6"
        requires: [teilbarkeit, potenzen]
      - id: muster-zahlenfolgen
        # KMK L Zahl und Operation S. 16: „führen Zahlenfolgen fort, auch unter Verwendung von Variablen als allgemeine Zahl“ (MSA)
        # Nur unter Zahl und Operation genannt; der Term als Regel führt zu L Strukturen und funktionaler Zusammenhang S. 18 („verwenden Variablen“).
        # NEW (weakly backed in the Laender: only NRW). KMK p.16 (Zahlenfolgen fortfuehren, auch mit Variablen), KMK-P p.16 (Strukturen in Mustern); NRW E Fkt-3 (SILP 6.9)
        # bands: HE - / BY - / NRW 5-6 -> 5-6 (single curriculum)
        name: { de: "Zahlenfolgen und Muster", en: "Number sequences and patterns" }
        iCan: "Ich kann Zahlenfolgen fortsetzen und die Regel mit Worten und mit einem Term beschreiben."
        gradeBand: "5-6"
        requires: [grundrechenarten-rechengesetze]
      - id: zaehlprinzip
        # KMK L Zahl und Operation S. 15-16: „kombinatorische Überlegungen“, „führen in konkreten Situationen systematische Zählprinzipien aus“ (MSA)
        # Nur unter Zahl und Operation genannt (Sachgebiet Stochastik, S. 15); Siehe auch: zufall-baumdiagramm (L Daten und Zufall S. 22).
        # NEW. KMK p.16 (systematische Zaehlprinzipien, MSA); BY M5 3.1 (Zaehlprinzip, Baumdiagramme); NRW S2 Sto-4 (kombinatorische Ueberlegungen); HE 5.1 only "Anzahlen bestimmen"
        # bands: (5) / 5 / 9-10 -> 5-6 (no real majority; BY places it earliest, NRW latest)
        name: { de: "Zählprinzip", en: "Counting principle" }
        iCan: "Ich kann mit dem Zählprinzip und Baumdiagrammen die Anzahl von Möglichkeiten bestimmen."
        gradeBand: "5-6"
        requires: [grundrechenarten-rechengesetze]
      - id: brueche-begriff
        # KMK L Zahl und Operation S. 16: „erläutern an Beispielen die verschiedenen Vorstellungen zum Bruchbegriff“
        # NARROWED (kuerzen/erweitern split off). KMK p.16 (Vorstellungen zum Bruchbegriff); HE 6.1; BY M6 1.1; NRW E Ari-11 (SILP 5.9)
        # bands: 6 / 6 / 5-6 -> 5-6
        name: { de: "Bruchbegriff", en: "Understanding fractions" }
        iCan: "Ich kann Brüche als Teil eines Ganzen deuten und darstellen."
        gradeBand: "5-6"
        requires: [natuerliche-zahlen]
      - id: brueche-kuerzen-erweitern
        # KMK L Zahl und Operation S. 15-16: „Vorstellungen von … gebrochenen Zahlen“, „Vorstellungen zum Bruchbegriff“
        # NEW (split from brueche-begriff). HE 6.1 (Kuerzen, Erweitern, Hauptnenner, Vergleichen und Ordnen); BY M6 1.1; NRW E Ari-12
        # bands: 6 / 6 / 5-6 -> 5-6
        # requires primfaktoren-ggt-kgv: Zum Vergleichen bringt man Brüche auf den Hauptnenner, das kgV der Nenner (HE 6.1: „Kürzen und Erweitern von Brüchen, Hauptnenner als kgV“; BY M6 1.1: Hauptnenner „mithilfe eines algorithmischen (z. B. auf der Primfaktorzerlegung basierenden) Verfahrens“)
        name: { de: "Brüche kürzen und erweitern", en: "Simplifying and expanding fractions" }
        iCan: "Ich kann Brüche kürzen und erweitern und der Größe nach vergleichen."
        gradeBand: "5-6"
        requires: [brueche-begriff, primfaktoren-ggt-kgv]
      - id: bruchrechnung-grundaufgaben
        # KMK L Zahl und Operation S. 16: Bruchbegriff „(insbesondere Teile eines oder mehrerer Ganzer, relative Anteile)“
        # NARROWED to the three Grundaufgaben (arithmetic with fractions split into the next Bausteine).
        # HE 6.1 ("Grundaufgaben der Bruchrechnung": Bruchteil, Ganzes, Anteil); BY M6 1.1, 1.5 (Anteile von Anteilen); NRW E Ari-13
        # bands: 6 / 6 / 5-6 -> 5-6
        name: { de: "Bruchteile und Anteile", en: "Fractions of a quantity" }
        iCan: "Ich kann Bruchteil, Ganzes und Anteil bestimmen."
        gradeBand: "5-6"
        requires: [brueche-begriff]
      - id: brueche-addieren-subtrahieren
        # KMK L Zahl und Operation S. 15: „rechnen mit natürlichen, ganzen und rationalen Zahlen“, „Vorstellungen von Operationen rationaler Zahlen“
        # NEW. KMK p.16 (rechnen mit rationalen Zahlen); HE 6.1; BY M6 1.3; NRW E Ari-14 (SILP 6.5)
        # bands: 6 / 6 / 6 -> 5-6
        name: { de: "Bruchrechnung: Addition und Subtraktion", en: "Adding and subtracting fractions" }
        iCan: "Ich kann Brüche und gemischte Zahlen addieren und subtrahieren."
        gradeBand: "5-6"
        requires: [brueche-kuerzen-erweitern]
      - id: brueche-multiplizieren-dividieren
        # KMK L Zahl und Operation S. 15: „rechnen mit natürlichen, ganzen und rationalen Zahlen“, „Vorstellungen von Operationen rationaler Zahlen“
        # NEW. HE 6.1; BY M6 1.4; NRW E Ari-14 (SILP 6.7)
        # bands: 6 / 6 / 6 -> 5-6
        name: { de: "Bruchrechnung: Multiplikation und Division", en: "Multiplying and dividing fractions" }
        iCan: "Ich kann Brüche multiplizieren und dividieren."
        gradeBand: "5-6"
        requires: [brueche-addieren-subtrahieren]
      - id: dezimalbrueche
        # KMK L Zahl und Operation S. 15: „stellen Zahlen der Situation angemessen dar“; „Vorstellungen von … gebrochenen Zahlen“
        # KMK p.16; HE 6.1 (Dezimalschreibweise, gewoehnliche Brueche in endliche und periodische Dezimalbrueche); BY M6 1.2; NRW E Ari-8 (SILP 6.4)
        # bands: 6 / 6 / 6 -> 5-6
        name: { de: "Dezimalbrüche und Periode", en: "Decimals and recurring decimals" }
        iCan: "Ich kann Brüche in Dezimalbrüche umwandeln und erklären, ob sie abbrechen oder sich wiederholen."
        gradeBand: "5-6"
        requires: [brueche-begriff]
      - id: dezimalbrueche-rechnen
        # KMK L Zahl und Operation S. 15: „rechnen mit natürlichen, ganzen und rationalen Zahlen“
        # NEW (split from bruchrechnung-grundaufgaben). HE 6.1 (vier Grundrechenarten bei abbrechenden Dezimalbruechen); BY M6 1.3, 1.4; NRW E Ari-14 (SILP 6.5, 6.7)
        # bands: 6 / 6 / 6 -> 5-6
        name: { de: "Rechnen mit Dezimalbrüchen", en: "Calculating with decimals" }
        iCan: "Ich kann mit Dezimalbrüchen rechnen."
        gradeBand: "5-6"
        requires: [dezimalbrueche, schriftliche-verfahren]
      - id: rationale-zahlen
        # KMK L Zahl und Operation S. 15-16: „beschreiben die Notwendigkeit von Zahlbereichserweiterungen von ℕ nach ℤ und ℚ an Beispielen“
        # Content stays (negative numbers: Zahlengerade, Gegenzahl, Betrag), BAND CHANGED 7-8 -> 5-6. KMK p.15-16 (Zahlbereichserweiterung N -> Z -> Q);
        # HE 7.2; BY M5 1.1; NRW E Ari-15 (ganze Zahlen darstellen, SILP 6.2), S1 Ari-1, Ari-2
        # bands: HE 7 / BY 5 / NRW 6 -> 5-6 (HE dissents; 2 of 3)
        name: { de: "Negative Zahlen und Betrag", en: "Negative numbers and absolute value" }
        iCan: "Ich kann mit negativen Zahlen, Gegenzahlen und Beträgen umgehen und sie an Beispielen wie Temperatur erklären."
        gradeBand: "5-6"
        requires: [natuerliche-zahlen]
      - id: prozent-grundbegriffe
        # KMK L Zahl und Operation S. 16: „verwenden Prozent- und Zinsrechnung vorstellungsbasiert (z. B. Prozentstreifen) und sachgerecht“
        # Auch L Strukturen und funktionaler Zusammenhang S. 18 („nutzen die Prozentrechnung bei Wachstumsprozessen“); Schwerpunkt hier: Prozent als Zahlvorstellung.
        # unchanged (used by an app). KMK p.16, 18 (Prozent- und Zinsrechnung vorstellungsbasiert, z. B. Prozentstreifen); HE 7.1 (Prozentbegriff, Bruch-/Dezimal-/Prozentschreibweise);
        # BY M6 1.1, 3; NRW E Ari-8 (Prozentzahl als Darstellung, SILP 5.2/6.4)
        # bands: HE 7 / BY 6 / NRW 5-6 -> 5-6 (HE dissents; the calculation Bausteine below are 7-8)
        name: { de: "Prozentrechnung: Grundbegriffe", en: "Percentages: basic terms" }
        iCan: "Ich kann Prozent als Hundertstel deuten und in einer Aufgabe Grundwert, Prozentwert und Prozentsatz erkennen."
        gradeBand: "5-6"
        requires: [dezimalbrueche]
      - id: rationale-zahlen-rechnen
        # KMK L Zahl und Operation S. 15: „rechnen mit natürlichen, ganzen und rationalen Zahlen … und erklären die Bedeutung der Rechenoperationen“
        # REPLACES rechnen-rational-reell (negative numbers only; roots moved to wurzelgesetze). KMK p.16 (rechnen mit ganzen und rationalen Zahlen);
        # HE 7.2 (Rechnen, Klammer-/Vorrangregeln); BY M5 1.2, 3.1 (Vorzeichenregeln, ganze Zahlen), M6 1.3-1.5; NRW S1 Ari-3 (SILP 7.4)
        # bands: HE 7 / BY 5 / NRW 7 -> 7-8 (BY dissents)
        name: { de: "Rechnen mit negativen Zahlen", en: "Calculating with negative numbers" }
        iCan: "Ich kann mit negativen Zahlen rechnen und dabei Vorzeichen- und Klammerregeln beachten."
        gradeBand: "7-8"
        requires: [rationale-zahlen, brueche-multiplizieren-dividieren]
      - id: prozent-prozentwert
        # KMK L Zahl und Operation S. 16: „verwenden Prozent- und Zinsrechnung vorstellungsbasiert … und sachgerecht“
        # unchanged (used by an app). KMK p.15; HE 7.1 (Grundaufgaben); BY M6 3 (Grundgleichung der Prozentrechnung); NRW S1 Fkt-8 (SILP 7.2)
        # bands: 7 / 6 / 7 -> 7-8 (BY dissents)
        name: { de: "Prozentwert berechnen", en: "Finding the percentage value" }
        iCan: "Ich kann den Prozentwert aus Grundwert und Prozentsatz berechnen."
        gradeBand: "7-8"
        requires: [prozent-grundbegriffe]
      - id: prozent-prozentsatz
        # KMK L Zahl und Operation S. 16: „verwenden Prozent- und Zinsrechnung vorstellungsbasiert … und sachgerecht“
        # unchanged (used by an app); sources and bands as prozent-prozentwert
        name: { de: "Prozentsatz berechnen", en: "Finding the percentage rate" }
        iCan: "Ich kann den Prozentsatz aus Prozentwert und Grundwert berechnen."
        gradeBand: "7-8"
        requires: [prozent-grundbegriffe]
      - id: prozent-grundwert
        # KMK L Zahl und Operation S. 16: „verwenden Prozent- und Zinsrechnung vorstellungsbasiert … und sachgerecht“
        # unchanged (used by an app); sources and bands as prozent-prozentwert
        name: { de: "Grundwert berechnen", en: "Finding the base value" }
        iCan: "Ich kann den Grundwert aus Prozentwert und Prozentsatz berechnen."
        gradeBand: "7-8"
        requires: [prozent-grundbegriffe]
      - id: prozent-veraenderung
        # KMK L Zahl und Operation S. 16: „verwenden Prozent- und Zinsrechnung … sachgerecht“
        # Auch L Strukturen und funktionaler Zusammenhang S. 18 („Prozentrechnung bei Wachstumsprozessen“); Schwerpunkt hier: eine einzelne Änderung, noch kein Prozess (der ist zinseszins).
        # unchanged (used by an app). HE 7.1 (erhoehter/verminderter Grundwert), 8.3 (Aenderung um/auf, Prozentsaetze ueber 100 %); BY M7 3; NRW S1 Fkt-9 (Wachstumsfaktor)
        # bands: 7-8 / 7 / 7-8 -> 7-8
        name: { de: "Prozentuale Zu- und Abnahme", en: "Percentage increase and decrease" }
        iCan: "Ich kann neue und alte Werte nach einer prozentualen Zunahme oder Abnahme berechnen."
        gradeBand: "7-8"
        requires: [prozent-prozentwert]
      - id: prozent-vergleich
        # KMK L Zahl und Operation S. 16: „verwenden Prozent- und Zinsrechnung … sachgerecht“
        # unchanged (used by an app). HE 7.1 ("Vergleich des Anteils"); BY M6 3, M7 3; NRW S1 Fkt-8
        # bands: 7 / 6-7 / 7 -> 7-8
        name: { de: "Prozentualer Vergleich", en: "Percentage comparison" }
        iCan: "Ich kann angeben, um wie viel Prozent ein Wert größer oder kleiner als ein anderer ist."
        gradeBand: "7-8"
        requires: [prozent-prozentsatz]
      - id: prozent-sachaufgaben
        # KMK L Zahl und Operation S. 16: „verwenden Prozent- und Zinsrechnung … sachgerecht“; S. 16 „prüfen und interpretieren Ergebnisse, auch in Sachsituationen“
        # unchanged (used by an app). HE 7.1 (Aufgaben aus komplexen Sachzusammenhaengen), 8.1; BY M7 3 (komplexere Aufgaben); NRW S1 Fkt-8
        # bands: 7 / 7 / 7 -> 7-8
        name: { de: "Sachaufgaben zur Prozentrechnung", en: "Percentage word problems" }
        iCan: "Ich kann Sachaufgaben zur Prozentrechnung in eine Gleichung oder einen Dreisatz übersetzen und lösen."
        gradeBand: "7-8"
        requires: [prozent-prozentwert, prozent-prozentsatz, prozent-grundwert]
      - id: prozent-von-prozenten
        # KMK L Zahl und Operation S. 16: „verwenden Prozent- und Zinsrechnung … sachgerecht“
        # Auch L Strukturen und funktionaler Zusammenhang S. 18 (Wachstumsprozesse); Schwerpunkt hier: Prozentpunkte und das Verknüpfen von Änderungen als Rechnung.
        # unchanged. HE 8.3 (Verknuepfungen von Prozentsaetzen); BY M6 3 (Prozent und Prozentpunkte); NRW S1 Fkt-9 (kombinieren prozentuale Veraenderungen)
        # bands: 8 / 6 / 7-8 -> 7-8
        name: { de: "Prozentpunkte und mehrfache Änderungen", en: "Percentage points and successive changes" }
        iCan: "Ich kann Prozentpunkte und Prozente unterscheiden und mehrere prozentuale Änderungen verknüpfen."
        gradeBand: "7-8"
        requires: [prozent-veraenderung]
      - id: zinsrechnung
        # KMK L Zahl und Operation S. 15-16: „sachgerechte Nutzung von Prozent- und Zinsrechnung“, „verwenden Prozent- und Zinsrechnung“
        # Auch L Strukturen und funktionaler Zusammenhang S. 18 (Zinsrechnung als Beispiel für Wachstum); Schwerpunkt hier: einmalige Zinsen, kein Wachstumsprozess.
        # NARROWED (Zinseszins split off). KMK p.15, 18; HE 7.1 (Jahreszinsen), 8.3 (Monats-, Tageszinsen); BY M6 3 (Zins), M7 3; NRW S1 Fkt-8
        # bands: 7-8 / 6-7 / 7 -> 7-8
        name: { de: "Zinsrechnung", en: "Simple interest" }
        iCan: "Ich kann Jahres-, Monats- und Tageszinsen berechnen."
        gradeBand: "7-8"
        requires: [prozent-prozentwert, prozent-prozentsatz, prozent-grundwert]
      - id: quadratwurzeln
        # KMK L Zahl und Operation S. 16: „erläutern Potenzen und Wurzeln und berechnen einfache Potenzen und Wurzeln“, „Heron-Verfahren zur Bestimmung von Quadratwurzeln“
        # NEW (split from reelle-zahlen). KMK p.16 (Wurzeln erlaeutern und berechnen; Heron-Verfahren, Intervallschachtelung); HE 9.2; BY M9 1; NRW S2 Ari-6, Ari-7, Ari-9 (SILP 9.2)
        # bands: 9 / 9 / 9-10 -> 9-10
        name: { de: "Quadratwurzeln", en: "Square roots" }
        iCan: "Ich kann Quadratwurzeln erklären und Näherungswerte bestimmen."
        gradeBand: "9-10"
        requires: [potenzen, zahlen-vergleichen-ordnen, dezimalbrueche-rechnen]
      - id: reelle-zahlen
        # KMK L Zahl und Operation S. 15-16: „nutzen sinntragende Vorstellungen von reellen Zahlen (z. B. Vollständigkeit der Zahlengerade)“, Zahlbereichserweiterung „von ℚ nach ℝ“
        # NARROWED to the number domain (Quadratwurzeln and Pi moved: quadratwurzeln, kreis-umfang-flaeche). KMK p.15-16 (reelle Zahlen, Vollstaendigkeit der Zahlengerade);
        # HE 9.2 (irrationale Quadratwurzeln und reelle Zahlen); BY M9 1 (Irrationalitaet); NRW S2 Ari-2
        # bands: 9 / 9 / 9-10 -> 9-10
        name: { de: "Reelle Zahlen", en: "Real numbers" }
        iCan: "Ich kann rationale und irrationale Zahlen unterscheiden und die reellen Zahlen als Zahlbereich einordnen."
        gradeBand: "9-10"
        requires: [quadratwurzeln, rationale-zahlen-rechnen]
      - id: wurzelgesetze
        # KMK L Zahl und Operation S. 16: Vorgehensweisen und Verfahren, denen Kalküle zu Grunde liegen, „sowie bei Wurzeln und Potenzen“
        # NEW (from rechnen-rational-reell). KMK p.16; HE 9.2 (Rechenregeln fuer Quadratwurzeln); BY M9 1; NRW S2 Ari-7
        # bands: 9 / 9 / 9-10 -> 9-10
        name: { de: "Wurzelgesetze", en: "Laws of roots" }
        iCan: "Ich kann Wurzelgesetze anwenden und einfache Wurzelterme vereinfachen."
        gradeBand: "9-10"
        requires: [quadratwurzeln, rationale-zahlen-rechnen]
      - id: potenzgesetze
        # KMK L Zahl und Operation S. 16: „erläutern Potenzen und Wurzeln“; Verfahren, denen Kalküle zu Grunde liegen, „sowie bei Wurzeln und Potenzen“
        # NEW (split from potenzen). KMK p.16; HE 10.1 (Potenzgesetze); BY M7 1.2 (Produkte/Potenzen von Potenzen), M8 4; NRW S2 Ari-3 (SILP "Potenzen und Wurzeln" in 9-10)
        # bands: HE 10 / BY 7 / NRW 9-10 -> 9-10 (BY dissents)
        name: { de: "Potenzgesetze", en: "Laws of exponents" }
        iCan: "Ich kann die Potenzgesetze für natürliche Exponenten anwenden."
        gradeBand: "9-10"
        requires: [terme-umformen]
      - id: potenzen-ganzzahlige-exponenten
        # KMK L Zahl und Operation S. 15-16: „Zehnerpotenzschreibweise“; Kalküle „bei Wurzeln und Potenzen“
        # NEW. HE 10.1 (ganzzahlige Exponenten); BY M6 1.4 (negative Exponenten als Schreibweise), M8 4; NRW S2 Ari-4 (Bruchdarstellung <-> Potenzschreibweise)
        # bands: 10 / 6-8 / 9-10 -> 9-10 (BY dissents)
        name: { de: "Negative Exponenten", en: "Negative exponents" }
        iCan: "Ich kann Potenzen mit negativen Exponenten als Bruch deuten und berechnen."
        gradeBand: "9-10"
        requires: [potenzgesetze]
      - id: n-te-wurzeln
        # KMK L Zahl und Operation S. 16: „erläutern Potenzen und Wurzeln und berechnen einfache Potenzen und Wurzeln“; Kalküle „bei Wurzeln und Potenzen“
        # NEW. HE 10.1 (Potenzgleichungen x^n = a, Wurzelfunktionen); BY M9 5 (allgemeine Wurzel, rationale Exponenten); NRW S2 Ari-5, Ari-9
        # bands: 10 / 9 / 9-10 -> 9-10
        name: { de: "N-te Wurzeln", en: "Nth roots" }
        iCan: "Ich kann n-te Wurzeln bestimmen und Wurzeln als Potenzen mit Bruch-Exponenten schreiben."
        gradeBand: "9-10"
        requires: [quadratwurzeln, potenzen-ganzzahlige-exponenten]

  # ===================================================================================================================
  # Leitidee „Größen und Messen“: KMK S. 7, S. 17. Größenvorstellungen, Einheiten, Messen; Umfang, Fläche, Volumen und
  # Oberfläche; Streckenlängen und Winkelgrößen berechnen.
  # ===================================================================================================================
  - id: groessen-und-messen
    name: { de: Größen und Messen, en: Quantities and measurement }
    competencies:
      - id: groessenvorstellungen-schaetzen
        # KMK L Größen und Messen S. 17: „schätzen Größen mit Hilfe von Vorstellungen über geeignete Repräsentanten … und nutzen dies auch zur Plausibilitätsprüfung“
        # NARROWED (Ueberschlag split off). KMK p.17 (schaetzen Groessen mit Repraesentanten, Plausibilitaetspruefung), KMK-P p.15; HE 5.3; BY M5 4.1; NRW E Ari-9
        # bands: 5 / 5 / 5-6 -> 5-6
        name: { de: "Größen schätzen", en: "Estimating quantities" }
        iCan: "Ich kann Größen mithilfe von Bezugsgrößen schätzen und prüfen, ob ein Ergebnis zur Sache passt."
        gradeBand: "5-6"
      - id: umrechnung-groessen
        # KMK L Größen und Messen S. 17: „wählen Einheiten von Größen situationsgerecht aus … und wandeln sie ggf. um“
        # KMK p.17 (Einheiten situationsgerecht waehlen und umwandeln); HE 5.3; BY M5 4.1; NRW E Ari-9
        # bands: 5 / 5 / 5-6 -> 5-6
        name: { de: "Einheiten umrechnen", en: "Converting units" }
        iCan: "Ich kann Größen in andere Einheiten umrechnen und passende Einheiten wählen."
        gradeBand: "5-6"
        requires: [groessenvorstellungen-schaetzen]
      - id: messen-laenge-masse-geld-zeit
        # KMK L Größen und Messen S. 17: „nutzen das Grundprinzip des Messens als Vergleichen mit (Standard-)Einheiten“, „nehmen in ihrer Umwelt gezielt Messungen vor“
        # KMK p.17 (Grundprinzip des Messens, Messungen vornehmen, Berechnungen mit Massangaben); HE 5.3 (Sachrechnen: Waehrung, Laenge, Gewicht, Zeitpunkt/Zeitspanne); BY M5 4.1; NRW E Ari-9
        # bands: 5 / 5 / 5-6 -> 5-6
        name: { de: "Länge, Masse, Geld und Zeit", en: "Length, mass, money and time" }
        iCan: "Ich kann Länge, Masse, Geld und Zeit messen und damit in Sachaufgaben rechnen."
        gradeBand: "5-6"
        requires: [groessenvorstellungen-schaetzen]
      - id: einheiten-flaeche-volumen
        # KMK L Größen und Messen S. 17: „wählen Einheiten von Größen situationsgerecht aus (insbesondere für … Fläche, Volumen …) und wandeln sie ggf. um“
        # NEW. KMK p.17 (Einheiten fuer Flaeche, Volumen waehlen und umwandeln; Einheitsquadrat/-wuerfel), KMK-P p.15; HE 5.3; BY M5 4.2, M6 2.2; NRW E Ari-9, Geo-11
        # bands: 5 / 5-6 / 5-6 -> 5-6
        name: { de: "Flächen- und Volumeneinheiten", en: "Units of area and volume" }
        iCan: "Ich kann Flächen- und Volumeneinheiten umrechnen und ihre Größe einschätzen."
        gradeBand: "5-6"
        requires: [umrechnung-groessen]
      - id: flaeche-umfang-quadrat-rechteck
        # KMK L Größen und Messen S. 17: „berechnen Flächeninhalt und Umfang von Rechteck, Dreieck und Kreis“
        # KMK p.17; HE 5.2, 6.2; BY M5 4.2; NRW E Geo-12
        # bands: 5-6 / 5 / 5-6 -> 5-6
        name: { de: "Fläche und Umfang: Rechteck, Quadrat", en: "Area and perimeter: rectangles, squares" }
        iCan: "Ich kann Flächeninhalt und Umfang von Quadrat und Rechteck berechnen."
        gradeBand: "5-6"
        requires: [grundfiguren-eben, einheiten-flaeche-volumen]
      - id: zusammengesetzte-figuren
        # KMK L Größen und Messen S. 17: „Flächeninhalt und Umfang … sowie daraus zusammengesetzten Figuren“
        # KMK p.17; HE 6.2; BY M5 4.2; NRW E Geo-13
        # bands: 6 / 5 / 5-6 -> 5-6
        name: { de: "Zusammengesetzte Figuren", en: "Composite shapes" }
        iCan: "Ich kann Flächeninhalt und Umfang zusammengesetzter Figuren durch Zerlegen berechnen."
        gradeBand: "5-6"
        requires: [flaeche-umfang-quadrat-rechteck]
      - id: volumen-oberflaeche-quader-wuerfel
        # KMK L Größen und Messen S. 17: „berechnen Volumen und Oberflächeninhalt von Prisma …“ (der Quader ist ein Prisma); Grundprinzip des Messens bei „Volumina“
        # KMK p.17; HE 5.2, 6.2; BY M5 4.2, M6 2.2; NRW E Geo-12
        # bands: 5-6 / 5-6 / 5-6 -> 5-6
        name: { de: "Volumen und Oberfläche: Quader, Würfel", en: "Volume and surface area: cuboids, cubes" }
        iCan: "Ich kann Volumen und Oberflächeninhalt von Quader und Würfel berechnen."
        gradeBand: "5-6"
        requires: [flaeche-umfang-quadrat-rechteck, grundkoerper-quader-wuerfel]
      - id: flaeche-umfang-dreieck-viereck
        # KMK L Größen und Messen S. 17: „berechnen Flächeninhalt und Umfang von Rechteck, Dreieck und Kreis sowie daraus zusammengesetzten Figuren“
        # REPLACES flaeche-umfang-dreieck-viereck-kreis (Kreis split to kreis-umfang-flaeche). KMK p.17; HE 7.3 (Parallelogramm, Dreieck, Trapez); BY M6 2.1; NRW S1 Geo-8 (SILP 7.5, 8.2)
        # bands: 7 / 6 / 7-8 -> 7-8 (BY dissents)
        name: { de: "Fläche und Umfang: Dreieck, Viereck", en: "Area and perimeter: triangles, quadrilaterals" }
        iCan: "Ich kann Flächeninhalt und Umfang von Dreieck und besonderen Vierecken berechnen."
        gradeBand: "7-8"
        requires: [flaeche-umfang-quadrat-rechteck, vierecke-grundfiguren]
      - id: volumen-oberflaeche-prisma
        # KMK L Größen und Messen S. 17: „berechnen Volumen und Oberflächeninhalt von Prisma …“
        # KMK p.17; HE 8.2; BY M8 7; NRW S2 Geo-5
        # bands: 8 / 8 / 9-10 -> 7-8 (NRW dissents)
        name: { de: "Volumen und Oberfläche: Prisma", en: "Volume and surface area: prisms" }
        iCan: "Ich kann Volumen und Oberflächeninhalt von Prismen berechnen."
        gradeBand: "7-8"
        requires: [volumen-oberflaeche-quader-wuerfel, flaeche-umfang-dreieck-viereck, grundkoerper-prisma-zylinder]
      - id: kreis-umfang-flaeche
        # KMK L Größen und Messen S. 17: „berechnen Flächeninhalt und Umfang von … Kreis“
        # NEW (split from flaeche-umfang-dreieck-viereck-kreis and reelle-zahlen: Pi). KMK p.17 (Kreis); HE 9.6; BY M8 7; NRW S2 Geo-3, Geo-4 (SILP 9.3)
        # bands: 9 / 8 / 9-10 -> 9-10 (BY dissents)
        name: { de: "Kreisumfang und Kreisfläche", en: "Circumference and area of circles" }
        iCan: "Ich kann Umfang und Flächeninhalt eines Kreises berechnen und die Zahl Pi am Kreis erklären."
        gradeBand: "9-10"
        requires: [flaeche-umfang-quadrat-rechteck, dezimalbrueche-rechnen]
      - id: volumen-oberflaeche-zylinder
        # KMK L Größen und Messen S. 17: „berechnen Volumen und Oberflächeninhalt von … Zylinder“
        # NEW (split from volumen-oberflaeche-pyramide-kegel-zylinder-kugel). KMK p.17; HE 9.6; BY M8 7; NRW S2 Geo-5
        # bands: 9 / 8 / 9-10 -> 9-10 (BY dissents)
        name: { de: "Volumen und Oberfläche: Zylinder", en: "Volume and surface area: cylinders" }
        iCan: "Ich kann Volumen und Oberflächeninhalt von Zylindern berechnen."
        gradeBand: "9-10"
        requires: [volumen-oberflaeche-prisma, kreis-umfang-flaeche]
      - id: volumen-oberflaeche-pyramide-kegel-kugel
        # KMK L Größen und Messen S. 17: „berechnen Volumen und Oberflächeninhalt von … Pyramide, … Kegel und Kugel“
        # NARROWED (Zylinder split off). KMK p.17; HE 10.3; BY M10 5; NRW S2 Geo-5, Geo-6
        # bands: 10 / 10 / 9-10 -> 9-10
        name: { de: "Volumen und Oberfläche: Pyramide, Kegel, Kugel", en: "Volume and surface area: pyramids, cones, spheres" }
        iCan: "Ich kann Volumen und Oberflächeninhalt von Pyramide, Kegel und Kugel berechnen."
        gradeBand: "9-10"
        requires: [volumen-oberflaeche-zylinder, satz-des-pythagoras, grundkoerper-pyramide-kegel-kugel]
      # requires trigonometrie: HE, BY und NRW lehren das Bogenmaß nach Sinus und Kosinus (HE 10.4, BY M10 3)
      #   Funktion: fraglich – die Kante folgt der Reihenfolge der Lehrpläne, inhaltlich braucht das Bogenmaß Gradmaß und Kreisumfang; sinnvoll, weil das Bogenmaß für Sinus und Kosinus als Funktionen eingeführt wird
      - id: bogenmass
        # KMK L Größen und Messen S. 17: „wählen Einheiten von Größen situationsgerecht aus (insbesondere für … Winkel) und wandeln sie ggf. um“
        # Das Bogenmaß nennt die KMK nicht; es dient der Sinusfunktion (L Strukturen und funktionaler Zusammenhang S. 19). Schwerpunkt: Winkeleinheit umrechnen.
        # NEW. HE Übergangsprofil Jg. 10 (Kreis und Kreisteile: Winkel im Bogenmaß), HE 10.4; BY M10 3 (Bogenmaß, Einheitskreis); NRW S2 (Inhalt Sinusfunktionen: Grad- und Bogenmaß)
        # bands: 10 / 10 / 9-10 -> 9-10
        name: { de: "Bogenmaß", en: "Radians" }
        iCan: "Ich kann Winkel im Bogenmaß angeben und zwischen Grad- und Bogenmaß wechseln."
        gradeBand: "9-10"
        requires: [trigonometrie, kreis-umfang-flaeche]
      - id: berechnungen-dreiecke-vielecke
        # KMK L Größen und Messen S. 17: „berechnen Streckenlängen und Winkelgrößen, auch unter Nutzung des Satzes von Pythagoras, von trigonometrischen Beziehungen und Ähnlichkeitsbeziehungen“
        # Die Sätze selbst stehen unter L Raum und Form S. 20-21 (satz-des-pythagoras, trigonometrie, strahlensaetze); dieser Baustein ist das Berechnen.
        # unchanged (synthesis Baustein). KMK p.17 (berechnen Streckenlaengen und Winkelgroessen mit Pythagoras, Trigonometrie, Aehnlichkeit); HE 9.5, HE-KC 9/10 (Berechnungen in Dreiecken und Vielecken); BY M9 6, 7; NRW S2 Geo-9
        # bands: 9-10 / 9-10 / 9-10 -> 9-10
        name: { de: "Berechnungen an Dreiecken und Vielecken", en: "Calculations in triangles and polygons" }
        iCan: "Ich kann Streckenlängen und Winkel in Dreiecken und Vielecken mit Pythagoras, Ähnlichkeit und Trigonometrie berechnen."
        gradeBand: "9-10"
        requires: [strahlensaetze, trigonometrie]

  # ===================================================================================================================
  # Leitidee „Strukturen und funktionaler Zusammenhang“: KMK S. 7, S. 18-19. Variablen und Terme, Gleichungen und
  # Gleichungssysteme, Zuordnungen und Funktionen, Maßstab, Prozentrechnung bei Wachstum. Id aus der Sachgebiets-Fassung (Algebra).
  # ===================================================================================================================
  - id: algebra
    name: { de: Strukturen und funktionaler Zusammenhang, en: Structures and functional relationships }
    competencies:
      - id: einfache-gleichungen
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: „lösen einfache lineare Gleichungen numerisch (systematisches Probieren), algebraisch (Umformen)“ (ESA)
        # Auch L Zahl und Operation S. 16 („Zusammenhang zwischen Rechenoperationen und deren Umkehrungen“, die Umkehraufgabe); Schwerpunkt: die Gleichung.
        # NEW. KMK p.19 (einfache lineare Gleichungen numerisch, systematisches Probieren); KMK-P p.16 (Gleichheit von Ausdruecken); HE 5.1 (Variable, einfache Gleichungen durch Probieren), 7.2;
        # BY M5 1.2, 3.1 (a + x = b ... durch Probieren oder Umkehraufgabe); NRW E Ari-5 (Rechenanweisungen umkehren)
        # bands: 5 / 5 / 5-6 -> 5-6
        name: { de: "Einfache Gleichungen", en: "Simple equations" }
        iCan: "Ich kann einfache Gleichungen durch Probieren oder mit der Umkehraufgabe lösen."
        gradeBand: "5-6"
        requires: [grundrechenarten-rechengesetze]
      - id: dreisatz
        # KMK L Strukturen und funktionaler Zusammenhang S. 18: „lösen realitätsnahe Probleme im Zusammenhang mit linearen, proportionalen und antiproportionalen Zuordnungen, ggf. auch mit Hilfe des Dreisatzes“
        # BAND CHANGED 7-8 -> 5-6, and no longer requires proportional-antiproportional (reversed). KMK p.19 (ggf. Dreisatz); HE 7.1; BY M5 4.1 (Schlussrechnung/Dreisatz); NRW E Fkt-2 (SILP 5.3)
        # bands: HE 7 / BY 5 / NRW 5-6 -> 5-6 (HE dissents)
        name: { de: "Dreisatz", en: "Rule of three" }
        iCan: "Ich kann Sachaufgaben mit dem Dreisatz lösen."
        gradeBand: "5-6"
        requires: [grundrechenarten-rechengesetze, messen-laenge-masse-geld-zeit]
      - id: massstab
        # KMK L Strukturen und funktionaler Zusammenhang S. 18: „nutzen Maßstäbe beim Lesen und Anfertigen von Zeichnungen situationsgerecht“
        # NEW. KMK p.18 (nutzen Maßstäbe beim Lesen und Anfertigen von Zeichnungen); HE 5.3 (optional: Maßstab lesen); BY M5 4.1; NRW E Fkt-4, Geo-10
        # bands: HE 5 (optional) / BY 5 / NRW 5-6 -> 5-6
        name: { de: "Maßstab", en: "Scale" }
        iCan: "Ich kann mit Maßstäben rechnen und Zeichnungen im passenden Maßstab lesen und anfertigen."
        gradeBand: "5-6"
        requires: [dreisatz, umrechnung-groessen]
      - id: terme-variable
        # KMK L Strukturen und funktionaler Zusammenhang S. 18: „verwenden Variablen je nach Kontext als eine feste Zahl, als eine beliebige Zahl …“, „stellen Terme auf“
        # NARROWED (umformen split off), BAND CHANGED 5-6 -> 7-8. KMK p.18 (Variablen; Terme aufstellen); HE 8.1 (Aufstellen von Termen, Wertgleichheit); BY M7 1.1; NRW S1 Ari-4, Ari-5, Ari-7 (E Ari-6/7 only first steps; SILP 7.6)
        # bands: 8 / 7 / 7-8 -> 7-8
        # requires rationale-zahlen-rechnen: Beim Einsetzen in Terme kommen negative Zahlen vor; Vorzeichen- und Klammerregeln bereiten die Termumformungen vor (BY M7 1.1: „greifen auf die aus den vorhergehenden Jahrgangsstufen bekannten Rechenregeln für rationale Zahlen zurück“; HE 7.2: „Klammerregeln / Vorrangregeln (Propädeutik der in Klasse 8 zu behandelnden Termumformungen)“; NRW S1 Ari-3 vor Ari-4)
        name: { de: "Terme mit Variablen", en: "Expressions with variables" }
        iCan: "Ich kann Terme mit Variablen aufstellen, ihren Wert berechnen und auf Wertgleichheit prüfen."
        gradeBand: "7-8"
        requires: [einfache-gleichungen, rationale-zahlen-rechnen]
      - id: terme-umformen
        # KMK L Strukturen und funktionaler Zusammenhang S. 18: „stellen Terme auf …, formen sie um und interpretieren sie“
        # NEW. KMK p.18 (formen Terme um); HE 8.1 (Umformungsregeln); BY M7 1.2 (Zusammenfassen, Ausklammern); NRW S1 Ari-7 (SILP 7.5)
        # bands: 8 / 7 / 7-8 -> 7-8
        name: { de: "Terme umformen", en: "Simplifying expressions" }
        iCan: "Ich kann gleichartige Glieder zusammenfassen und gemeinsame Faktoren ausklammern."
        gradeBand: "7-8"
        requires: [terme-variable]
      - id: klammern-binome
        # KMK L Strukturen und funktionaler Zusammenhang S. 18: „stellen Terme auf …, formen sie um und interpretieren sie“
        # unchanged (used by an app). KMK p.18; HE 8.1 (Binomische Formeln, Faktorisieren); BY M7 1.2; NRW S1 (binomische Formeln, SILP 7.6)
        # bands: 8 / 7 / 7-8 -> 7-8
        name: { de: "Klammern und binomische Formeln", en: "Brackets and binomial formulas" }
        iCan: "Ich kann Klammern auflösen und die binomischen Formeln vorwärts und rückwärts anwenden."
        gradeBand: "7-8"
        requires: [terme-umformen]
      - id: lineare-gleichungen
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: „lösen lineare … Gleichungen … algebraisch (Umformen) … und vergleichen die Effektivität verschiedener Lösungsverfahren“
        # BAND CHANGED 5-6 -> 7-8 (the 5-6 content is einfache-gleichungen). KMK p.19 (algebraisch/Umformen); HE 8.1; BY M7 3 (Aequivalenzumformungen); NRW S1 Ari-9, Ari-10
        # bands: 8 / 7 / 7-8 -> 7-8
        name: { de: "Lineare Gleichungen", en: "Linear equations" }
        iCan: "Ich kann lineare Gleichungen lösen und die Lösungsverfahren vergleichen."
        gradeBand: "7-8"
        requires: [terme-umformen]
      - id: gleichungen-aufstellen
        # KMK L Strukturen und funktionaler Zusammenhang S. 18-19: „stellen Terme auf, um allgemeine Zusammenhänge im Sachkontext zu beschreiben“; „lösen lineare … Gleichungen“
        # NEW. KMK p.18 (Terme/Gleichungen im Sachkontext); HE 8.1 ("Aufstellen von Termen"), 8.3 (komplexe Fragestellungen mit linearen Gleichungen); BY M7 3 (passende Gleichungen aufstellen); NRW S1 Ari-6 (Gleichungen aufstellen), Ari-9 (im Sachkontext deuten)
        # bands: 8 / 7 / 7-8 -> 7-8
        name: { de: "Gleichungen aufstellen", en: "Setting up equations" }
        iCan: "Ich kann zu einer Sachaufgabe eine lineare Gleichung aufstellen, lösen und die Lösung deuten."
        gradeBand: "7-8"
        requires: [lineare-gleichungen]
      - id: formeln-umstellen
        # KMK L Strukturen und funktionaler Zusammenhang S. 18-19: Terme „formen sie um“; Gleichungen „algebraisch (Umformen)“ lösen
        # Das Umstellen von Formeln nennt die KMK nicht eigens.
        # NEW (not named by KMK / NRW). HE 8.1 (Umstellen einer Formel); BY M8 4 (Formeln nach einer Variablen aufloesen)
        # bands: 8 / 8 / - -> 7-8 (two curricula)
        name: { de: "Formeln umstellen", en: "Rearranging formulas" }
        iCan: "Ich kann eine Formel nach einer Variablen umstellen."
        gradeBand: "7-8"
        requires: [lineare-gleichungen]
      - id: ungleichungen
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: Gleichungen „algebraisch (Umformen)“ lösen
        # Ungleichungen nennt die KMK nicht; nächste Stelle sind die Gleichungen.
        # KMK (Ungleichungen not named); HE 8.1 (Lösungsmenge auf der Zahlengeraden); BY M8 2 (Intervallschreibweise); NRW S1 Ari-6 (Ungleichungen aufstellen)
        # bands: 8 / 8 / 7-8 -> 7-8
        name: { de: "Lineare Ungleichungen", en: "Linear inequalities" }
        iCan: "Ich kann lineare Ungleichungen lösen und die Lösungsmenge auf der Zahlengeraden zeigen."
        gradeBand: "7-8"
        requires: [lineare-gleichungen]
      - id: bruchterme
        # KMK L Strukturen und funktionaler Zusammenhang S. 18: „stellen Terme auf …, formen sie um und interpretieren sie“
        # NEW (not in HE except as optional item). KMK p.18 (Terme umformen); BY M8 4; NRW S1 Ari-7 (Bruchterme), SILP 8.5
        # bands: HE - / BY 8 / NRW 7-8 -> 7-8
        name: { de: "Bruchterme", en: "Algebraic fractions" }
        iCan: "Ich kann Bruchterme kürzen, erweitern und zusammenfassen."
        gradeBand: "7-8"
        requires: [klammern-binome]
      - id: bruchgleichungen
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: „lösen lineare … Gleichungen … algebraisch (Umformen)“
        # Bruchgleichungen nennt die KMK nicht eigens.
        # NEW. BY M8 4; NRW S1 Ari-9 (elementare Bruchgleichungen), SILP 8.5; HE: optional (8)
        # bands: HE - / BY 8 / NRW 7-8 -> 7-8
        name: { de: "Bruchgleichungen", en: "Equations with fractions" }
        iCan: "Ich kann einfache Gleichungen lösen, in denen die Variable im Nenner steht."
        gradeBand: "7-8"
        requires: [bruchterme, lineare-gleichungen]
      - id: zuordnungen
        # KMK L Strukturen und funktionaler Zusammenhang S. 18: „erkennen und verwenden funktionale Zusammenhänge … und stellen diese in verschiedenen Repräsentationen dar (sprachlich, tabellarisch, grafisch …)“
        # BAND CHANGED 5-6 -> 7-8 (tables of quantities are already Primarstufe: KMK-P p.16). KMK p.18; HE 7.1 (Zuordnungen), HE-KC 5/6 first notions; BY M8 1; NRW E Fkt-1 (SILP 5.8)
        # bands: HE 7 / BY 8 / NRW 5-6 -> 7-8 (NRW dissents)
        name: { de: "Zuordnungen", en: "Relations between quantities" }
        iCan: "Ich kann Zuordnungen zwischen Größen in Tabellen, Schaubildern und mit Worten darstellen und beschreiben."
        gradeBand: "7-8"
        requires: [koordinatensystem]
      - id: proportionale-zuordnungen
        # KMK L Strukturen und funktionaler Zusammenhang S. 18: „unterscheiden proportionale und antiproportionale Zusammenhänge in Sachsituationen und stellen damit Berechnungen an“
        # REPLACES proportional-antiproportional (split). KMK p.18-19; HE 7.1 (Quotientengleichheit, Proportionalitätsfaktor, Ursprungsgerade); HE-KC 7/8; BY M8 2 (y = a·x); NRW S1 Fkt-1 (Quotientengleichheit, Proportionalitaetsfaktor)
        # bands: 7 / 8 / 7-8 -> 7-8
        name: { de: "Proportionale Zuordnungen", en: "Direct proportion" }
        iCan: "Ich kann proportionale Zuordnungen erkennen, darstellen und mit dem Proportionalitätsfaktor rechnen."
        gradeBand: "7-8"
        requires: [zuordnungen, dreisatz]
      - id: antiproportionale-zuordnungen
        # KMK L Strukturen und funktionaler Zusammenhang S. 18: „unterscheiden proportionale und antiproportionale Zusammenhänge in Sachsituationen und stellen damit Berechnungen an“
        # REPLACES proportional-antiproportional (split). KMK p.18-19; HE 7.1 (Produktgleichheit); BY M8 3 (y = a/x als indirekte Proportionalität); NRW S1 Fkt-1 (Produktgleichheit)
        # bands: 7 / 8 / 7-8 -> 7-8
        name: { de: "Antiproportionale Zuordnungen", en: "Inverse proportion" }
        iCan: "Ich kann antiproportionale Zuordnungen erkennen, darstellen und von proportionalen unterscheiden."
        gradeBand: "7-8"
        requires: [zuordnungen, dreisatz]
      - id: funktionsbegriff
        # KMK L Strukturen und funktionaler Zusammenhang S. 18: Variablen „als Veränderliche in einem bestimmten Bereich“; „erkennen und verwenden funktionale Zusammenhänge“
        # NEW. KMK p.18 (funktionale Zusammenhaenge, Darstellungen); HE 8.1 (Festigung des Funktionsbegriffs); HE-KC; BY M8 1 (Funktion als eindeutige Zuordnung, Definitions-/Wertemenge); NRW S1 Fkt-3
        # bands: 8 / 8 / 7-8 -> 7-8
        name: { de: "Funktionsbegriff", en: "Concept of a function" }
        iCan: "Ich kann erklären, was eine Funktion ist, und Funktionsterm, Graph, Definitionsmenge und Wertemenge unterscheiden."
        gradeBand: "7-8"
        requires: [zuordnungen]
      - id: funktionen-darstellung
        # KMK L Strukturen und funktionaler Zusammenhang S. 18-19: „können zwischen diesen Darstellungsformen wechseln“; „bestimmen kennzeichnende Merkmale von Funktionen im Funktionsterm, Graph und der Wertetabelle“
        # KMK p.18, 19 (Repraesentationen wechseln); HE 8.1; BY M8 1; NRW S1 Fkt-4
        # bands: 8-10 / 8 / 7-8 -> 7-8
        name: { de: "Darstellungen von Funktionen", en: "Representing functions" }
        iCan: "Ich kann zwischen Funktionsgleichung, Wertetabelle und Graph wechseln."
        gradeBand: "7-8"
        requires: [funktionsbegriff]
      - id: lineare-funktionen
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: „bestimmen kennzeichnende Merkmale von linearen Funktionen“, „interpretieren die Steigung linearer Funktionen im Sachzusammenhang“
        # KMK p.19 (kennzeichnende Merkmale, Steigung interpretieren); HE 8.1; BY M8 2; NRW S1 Fkt-5, Fkt-6 (SILP 8.3)
        # bands: 8 / 8 / 7-8 -> 7-8
        name: { de: "Lineare Funktionen", en: "Linear functions" }
        iCan: "Ich kann lineare Funktionen mit Gleichung, Tabelle und Graph beschreiben und Steigung und Achsenabschnitt deuten."
        gradeBand: "7-8"
        requires: [proportionale-zuordnungen, funktionen-darstellung]
      - id: geradengleichungen
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: „bestimmen kennzeichnende Merkmale von linearen Funktionen im Funktionsterm, Graph und der Wertetabelle und stellen Beziehungen zwischen den Darstellungen her“
        # NEW. HE 8.1 (Funktionsgleichungen zu Graphen, Nullstelle, Punktprobe); BY M8 2 (Geradengleichungen aufstellen, Nullstellen, Schnittpunkt zweier Geraden); NRW S1 Fkt-5
        # bands: 8 / 8 / 7-8 -> 7-8
        name: { de: "Geradengleichungen", en: "Equations of lines" }
        iCan: "Ich kann die Gleichung einer Geraden aus zwei Punkten oder aus Punkt und Steigung bestimmen und Nullstelle und Schnittpunkt berechnen."
        gradeBand: "7-8"
        requires: [lineare-funktionen, lineare-gleichungen]
      - id: lineare-gleichungssysteme
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: „lösen … lineare Gleichungssysteme … grafisch (mit Hilfe von Funktionsgraphen)“, „untersuchen Fragen der Lösbarkeit und der Lösungsvielfalt“
        # NARROWED to the graphical solution and the solution count; BAND CHANGED 9-10 -> 7-8. KMK p.19 (lineare Gleichungssysteme grafisch, Loesbarkeit); HE 9.1 (geometrische Lösung); BY M8 6; NRW S1 Ari-9 (SILP 8.4)
        # bands: HE 9 / BY 8 / NRW 7-8 -> 7-8 (HE dissents)
        name: { de: "Lineare Gleichungssysteme: grafisch", en: "Simultaneous equations: graphical" }
        iCan: "Ich kann Gleichungssysteme mit zwei Gleichungen und zwei Variablen zeichnerisch lösen und sagen, wie viele Lösungen sie haben."
        gradeBand: "7-8"
        requires: [lineare-gleichungen, lineare-funktionen]
      - id: lgs-rechnerisch
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: „lösen … lineare Gleichungssysteme … algebraisch (Umformen)“
        # NEW (split from lineare-gleichungssysteme). KMK p.19 (algebraisch); HE 9.1 (Einsetzungs-, Gleichsetzungs-, Additionsverfahren); BY M8 6; NRW S1 Ari-9, Ari-10
        # bands: 9 / 8 / 7-8 -> 7-8 (HE dissents)
        name: { de: "Lineare Gleichungssysteme: rechnerisch", en: "Simultaneous equations: algebraic" }
        iCan: "Ich kann ein Gleichungssystem mit dem Einsetzungs-, Gleichsetzungs- oder Additionsverfahren lösen."
        gradeBand: "7-8"
        requires: [lineare-gleichungssysteme]
      - id: zinseszins
        # KMK L Strukturen und funktionaler Zusammenhang S. 18: „nutzen die Prozentrechnung bei Wachstumsprozessen (beispielsweise bei der Zinsrechnung)“
        # Auch L Zahl und Operation S. 15-16 („Prozent- und Zinsrechnung“); Schwerpunkt: Wachstumsprozess.
        # NEW (split from zinsrechnung). KMK p.18 (Prozentrechnung bei Wachstumsprozessen, z. B. Zinsrechnung); HE 7.1 (Zinsen von Zinsen), 8.3 (Zinseszins); NRW S1 Ari-8, Fkt-9 (SILP 8.6); BY M10 1 (exponentielles Wachstum, later)
        # bands: 8 / 10 / 7-8 -> 7-8 (BY dissents)
        name: { de: "Zinseszins", en: "Compound interest" }
        iCan: "Ich kann Zinseszinsen berechnen."
        gradeBand: "7-8"
        requires: [zinsrechnung, prozent-veraenderung]
      - id: quadratische-gleichungen-einfach
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: „lösen lineare und quadratische Gleichungen … numerisch …, algebraisch (Umformen)“ (MSA)
        # NEW (split from quadratische-gleichungen). KMK p.19; HE 9.3 (Ausklammern, Produkt gleich null, rein quadratisch); BY M9 2.1; NRW S2 Ari-8
        # bands: 9 / 9 / 9-10 -> 9-10
        name: { de: "Einfache quadratische Gleichungen", en: "Simple quadratic equations" }
        iCan: "Ich kann einfache quadratische Gleichungen lösen, zum Beispiel durch Wurzelziehen, Ausklammern oder Produkt gleich null."
        gradeBand: "9-10"
        requires: [klammern-binome, quadratwurzeln]
      - id: quadratische-gleichungen
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: „lösen lineare und quadratische Gleichungen“, „untersuchen Fragen der Lösbarkeit und der Lösungsvielfalt von … quadratischen Gleichungen“
        # NARROWED to the general case. KMK p.19 (quadratische Gleichungen, Lösbarkeit); HE 9.3; BY M9 2.1 (Loesungsformel); NRW S2 Ari-8 (quadratische Ergaenzung, p-q-Formel, Vieta; SILP 9.4)
        # bands: 9 / 9 / 9-10 -> 9-10
        name: { de: "Quadratische Gleichungen", en: "Quadratic equations" }
        iCan: "Ich kann quadratische Gleichungen mit passenden Verfahren lösen und die Anzahl der Lösungen bestimmen."
        gradeBand: "9-10"
        requires: [quadratische-gleichungen-einfach, lineare-gleichungen]
      - id: quadratische-funktionen
        # KMK L Strukturen und funktionaler Zusammenhang S. 18: „analysieren, interpretieren und vergleichen unterschiedliche funktionale Zusammenhänge (… quadratische Funktionen)“
        # NARROWED (Anwenden split off); sinn unchanged. KMK p.18-19; HE 9.3; BY M9 2.1 (Parameter a, d, e; Scheitelpunkt); NRW S2 Fkt-4, Fkt-5, Fkt-8 (SILP 9.4)
        # bands: 9 / 9 / 9-10 -> 9-10
        name: { de: "Quadratische Funktionen", en: "Quadratic functions" }
        iCan: "Ich kann quadratische Funktionen und ihre Parabeln beschreiben und zeichnen."
        gradeBand: "9-10"
        requires: [lineare-funktionen, klammern-binome]
      - id: quadratische-funktionen-anwenden
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: „wenden insbesondere lineare und quadratische Funktionen … bei der Beschreibung und Bearbeitung von Problemen an“
        # NEW (split from quadratische-funktionen). KMK p.19 (lineare und quadratische Funktionen bei Problemen anwenden); HE 9.3 (Extremalprobleme); BY M9 2.2; NRW S2 Fkt-9, Fkt-12
        # bands: 9 / 9 / 9-10 -> 9-10
        name: { de: "Quadratische Funktionen anwenden", en: "Applying quadratic functions" }
        iCan: "Ich kann Sachprobleme mit quadratischen Funktionen lösen, zum Beispiel Nullstellen und Höchstwerte bestimmen."
        gradeBand: "9-10"
        requires: [quadratische-funktionen, quadratische-gleichungen]
      - id: potenzfunktionen
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: „bestimmen kennzeichnende Merkmale von Funktionen im Funktionsterm, Graph und der Wertetabelle“
        # Potenz- und Wurzelfunktionen nennt die KMK nicht eigens.
        # Backed by HE and BY only (KMK and NRW do not name them). HE 10.1 (Potenz- und Wurzelfunktionen); BY M9 5 (a·x^n)
        # bands: 10 / 9 / - -> 9-10
        name: { de: "Potenz- und Wurzelfunktionen", en: "Power and root functions" }
        iCan: "Ich kann einfache Potenz- und Wurzelfunktionen mit ihren Graphen beschreiben."
        gradeBand: "9-10"
        requires: [potenzgesetze, funktionen-darstellung]
      - id: exponentialfunktionen
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: „Exponentialfunktionen der Form f(x) = a·b^x“; S. 19 „beschreiben Veränderungen von Größen mittels Funktionen (auch nicht lineare Veränderungen)“
        # KMK p.19 (f(x) = a·b^x); HE 10.2; BY M10 1; NRW S2 Fkt-10 (SILP 10.2)
        # bands: 10 / 10 / 9-10 -> 9-10
        # requires funktionen-darstellung: Exponentialfunktionen beschreibt man mit Term, Wertetabelle und Graph (BY M10 1: zu b · a^x „den Verlauf des zugehörigen Graphen und dessen typische Merkmale“; KMK p.19: Funktionen in Term, Graph und Wertetabelle; HE 8.1 vor 10.2)
        name: { de: "Exponentialfunktionen", en: "Exponential functions" }
        iCan: "Ich kann Wachstum und Zerfall mit Exponentialfunktionen beschreiben und Modelle beurteilen."
        gradeBand: "9-10"
        requires: [prozent-veraenderung, potenzgesetze, funktionen-darstellung]
      - id: logarithmen
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: Exponentialfunktionen „bei der Beschreibung und Bearbeitung von Problemen“
        # Logarithmen nennt die KMK nicht; sie dienen hier dem Lösen von Exponentialgleichungen. Auch L Zahl und Operation S. 16 („Rechenoperationen und deren Umkehrungen“).
        # KMK: not named; HE 10.2 (Logarithmieren); BY M10 1; NRW S2 Ari-10 (Exponentialgleichungen b^x = c durch Logarithmieren)
        # bands: 10 / 10 / 9-10 -> 9-10
        name: { de: "Logarithmen", en: "Logarithms" }
        iCan: "Ich kann den Logarithmus als Umkehrung des Potenzierens erklären und damit einfache Exponentialgleichungen lösen."
        gradeBand: "9-10"
        requires: [exponentialfunktionen]
      - id: sinusfunktion
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: „verwenden die Sinusfunktion in der Form f(x) = a·sin(b·x) zur Beschreibung periodischer Vorgänge“
        # NARROWED (the parameters and periodic processes split off into periodische-vorgaenge): the functions and their graphs.
        # KMK p.19 (f(x) = a·sin(b·x) fuer periodische Vorgaenge); HE 10.4; BY M10 3 („leiten mithilfe des Einheitskreises den Verlauf der Graphen
        # der Sinus- und der Kosinusfunktion ab und begründen insbesondere deren Periodizität“); NRW S2 Fkt-13, Fkt-14
        # bands: 10 / 10 / 9-10 -> 9-10
        name: { de: "Sinus- und Kosinusfunktion", en: "Sine and cosine functions" }
        iCan: "Ich kann die Graphen der Sinus- und Kosinusfunktion am Einheitskreis herleiten und ihre Eigenschaften beschreiben."
        gradeBand: "9-10"
        requires: [bogenmass, funktionen-darstellung]
      - id: periodische-vorgaenge
        # KMK L Strukturen und funktionaler Zusammenhang S. 19: „verwenden die Sinusfunktion in der Form f(x) = a·sin(b·x) zur Beschreibung periodischer Vorgänge“
        # NEW (split from sinusfunktion: the KMK names the parameter form and the periodic processes). BY M10 3 („beschreiben für Funktionen mit
        # Termen der Form a ⋅ sin(b ⋅ (x + c)) + d, wie sich Änderungen der Parameter … auswirken“; „lösen realitätsbezogene Problemstellungen zu
        # periodischen Vorgängen“); HE 10.4; NRW S2 Fkt-14
        # bands: 10 / 10 / 9-10 -> 9-10
        # requires sinusfunktion: Die Parameter verändern den Graphen der Sinusfunktion; ohne die Grundform keine Amplitude und Periode (BY M10 3: Graph, dann Parameter)
        name: { de: "Periodische Vorgänge beschreiben", en: "Describing periodic processes" }
        iCan: "Ich kann periodische Vorgänge mit Funktionen der Form f(x) = a·sin(b·x) beschreiben und Amplitude und Periode deuten."
        gradeBand: "9-10"
        requires: [sinusfunktion]

  # ===================================================================================================================
  # Leitidee „Raum und Form“: KMK S. 7, S. 20-21. Geometrische Objekte in Ebene und Raum, Abbildungen, Konstruktionen,
  # Sätze der ebenen Geometrie. Id aus der Sachgebiets-Fassung (Geometrie).
  # ===================================================================================================================
  - id: geometrie
    name: { de: Raum und Form, en: Space and shape }
    competencies:
      - id: geometrische-grundbegriffe
        # KMK L Raum und Form S. 20: „benennen und beschreiben geometrische Objekte … mit Hilfe mathematischer Modelle (Punkte, Winkel, Strecken, Geraden, Flächen, Körper)“
        # KMK p.20 (benennen und beschreiben geometrische Objekte mit Hilfe mathematischer Modelle: Punkte, Winkel, Strecken, Geraden, Flächen, Körper); HE 5.2 (Geometrische Grundbegriffe: Punkt, Strecke; die Begriffe Gerade, Ebene einführen); BY M5 2 (Punkte, Strecken, Geraden … abkürzende Schreibweisen); NRW E Geo-1 (erläutern Grundbegriffe)
        # bands: 5 / 5 / 5-6 -> 5-6. Neu (Owner, 2026-11-11): Wurzel der Geometrie; bisher steckte der Inhalt unausgesprochen in parallel-senkrecht-abstand.
        name: { de: "Geometrische Grundbegriffe", en: "Basic geometric terms" }
        iCan: "Ich kann Punkt, Strecke, Gerade und Ebene unterscheiden und richtig benennen."
        gradeBand: "5-6"
      - id: parallel-senkrecht-abstand
        # KMK L Raum und Form S. 20: „erkennen und beschreiben Eigenschaften und Beziehungen geometrischer Objekte (z. B. … Lagebeziehungen)“
        # KMK p.20; HE 5.2 (Lagebeziehung von Geraden); BY M5 2; NRW E Geo-1
        # bands: 5 / 5 / 5-6 -> 5-6
        # requires geometrische-grundbegriffe: Lagebeziehungen beschreibt man zwischen Punkten und Geraden; die Begriffe kommen zuerst (HE 5.2: „Geometrische Grundbegriffe“ vor „Lagebeziehung von Geraden“ in einer Einheit; BY M5 2: Lagebeziehungen „zwischen Punkt und Gerade, zwischen zwei Geraden“; NRW E Geo-1: Grundbegriffe zur Beschreibung der Lagebeziehungen)
        name: { de: "Parallelen, Senkrechten und Abstand", en: "Parallel and perpendicular lines" }
        iCan: "Ich kann parallele und senkrechte Geraden zeichnen und Abstände messen."
        gradeBand: "5-6"
        requires: [geometrische-grundbegriffe]
      - id: grundfiguren-eben
        # KMK L Raum und Form S. 20: „analysieren und klassifizieren geometrische Objekte der Ebene (insbesondere Winkel, Dreiecke, Vierecke)“
        # KMK p.20 (benennen und beschreiben geometrische Objekte; analysieren Winkel, Dreiecke, Vierecke); HE 5.2; BY M5 2; NRW E Geo-1
        # bands: 5 / 5 / 5-6 -> 5-6
        # requires parallel-senkrecht-abstand: Die Eigenschaften der Grundfiguren beschreibt man mit parallelen und senkrechten Seiten (Rechteck, Parallelogramm, Trapez) (HE 5.2: „Ebene Figuren“ und „Lagebeziehung von Geraden“ in einer Einheit; NRW E Geo-1: Grundbegriffe zur Beschreibung ebener Figuren „sowie deren Lagebeziehungen“; BY M5 2: Lagebeziehungen vor den Vierecken)
        name: { de: "Ebene Grundfiguren", en: "Basic plane shapes" }
        iCan: "Ich kann ebene Grundfiguren erkennen, benennen und ihre Eigenschaften beschreiben."
        gradeBand: "5-6"
        requires: [parallel-senkrecht-abstand]
      - id: winkel-messen
        # KMK L Raum und Form S. 20: „analysieren und klassifizieren geometrische Objekte der Ebene (insbesondere Winkel …)“
        # Auch L Größen und Messen S. 17 (Winkel als Größe, „Einheiten … Winkel“); Schwerpunkt: Winkel zeichnen und nach Größe einteilen, Grundlage der Geometrie.
        # KMK p.17, 20; HE 6.2 (Winkel); BY M5 2 (Winkel bis 360°); NRW E Geo-9
        # bands: 6 / 5 / 5-6 -> 5-6
        name: { de: "Winkel messen und zeichnen", en: "Measuring and drawing angles" }
        iCan: "Ich kann Winkel messen, zeichnen und nach ihrer Größe einteilen."
        gradeBand: "5-6"
        requires: [grundfiguren-eben]
      - id: koordinatensystem
        # KMK L Raum und Form S. 20: „stellen ebene geometrische Figuren … im ebenen kartesischen Koordinatensystem dar“
        # KMK p.20-21 (Figuren im kartesischen Koordinatensystem); HE 5.2, 7.2; BY M5 2; NRW E Geo-6 (SILP 6.2: vier Quadranten)
        # bands: 5 / 5 / 5-6 -> 5-6
        # requires geometrische-grundbegriffe: Im Koordinatensystem stellt man Punkte, Strecken und Geraden dar (BY M5 2: „stellen Punkte, Strecken, Geraden und Kreise sorgfältig im kartesischen Koordinatensystem dar“; HE 5.2: Grundbegriffe und Koordinatensystem in einer Einheit)
        name: { de: "Koordinatensystem", en: "Coordinate system" }
        iCan: "Ich kann Punkte und Figuren im Koordinatensystem eintragen und ablesen."
        gradeBand: "5-6"
        requires: [natuerliche-zahlen, geometrische-grundbegriffe]
      - id: symmetrie
        # KMK L Raum und Form S. 20: „erkennen und beschreiben Eigenschaften und Beziehungen geometrischer Objekte (z. B. Symmetrie …)“
        # KMK p.20 (Symmetrie); HE 5.2, 6.2; BY M7 2.1; NRW E Geo-5
        # bands: 5-6 / 7 / 5-6 -> 5-6 (BY dissents)
        name: { de: "Symmetrie", en: "Symmetry" }
        iCan: "Ich kann Achsen-, Punkt- und Drehsymmetrie bei Figuren erkennen und nutzen."
        gradeBand: "5-6"
        requires: [grundfiguren-eben]
      - id: vierecke-grundfiguren
        # KMK L Raum und Form S. 20: „analysieren und klassifizieren geometrische Objekte der Ebene (insbesondere … Vierecke)“
        # NARROWED (Kreis is in grundfiguren-eben), BAND CHANGED 7-8 -> 5-6. KMK p.20; HE 5.2; BY M5 2 (Vierecke erkennen und erzeugen); NRW E Geo-2
        # bands: 5 / 5 / 5-6 -> 5-6
        name: { de: "Besondere Vierecke", en: "Special quadrilaterals" }
        iCan: "Ich kann besondere Vierecke mit ihren Eigenschaften beschreiben und unterscheiden."
        gradeBand: "5-6"
        requires: [grundfiguren-eben]
      - id: konstruktionen
        # KMK L Raum und Form S. 21: „zeichnen und konstruieren geometrische Figuren unter Verwendung angemessener Medien wie Zirkel, Geodreieck oder digitaler Mathematikwerkzeuge“
        # unchanged (the basic drawing and constructing; triangle constructions are dreieckskonstruktion). KMK p.21; HE 5.2 (Geodreieck, Zirkel); BY M5 2; NRW E Geo-4
        # bands: 5 / 5 / 5-6 -> 5-6
        name: { de: "Zeichnen und Konstruieren", en: "Drawing and constructing" }
        iCan: "Ich kann Figuren mit Geodreieck, Zirkel oder Geometriesoftware zeichnen und konstruieren."
        gradeBand: "5-6"
        requires: [grundfiguren-eben]
      - id: bewegungen-figuren
        # KMK L Raum und Form S. 20: „operieren (z. B. verschieben, drehen, spiegeln) gedanklich“; „elementare geometrische Abbildungen (z. B. Verschiebungen, Drehungen, Spiegelungen …)“
        # KMK p.20 (verschieben, drehen, spiegeln); HE 6.2; HE-KC 5/6; NRW E Geo-7 (SILP 6.10); BY: not as a unit
        # bands: 6 / - / 5-6 -> 5-6
        # requires winkel-messen: Eine Drehung ist durch Zentrum und Drehwinkel bestimmt (HE 6.2: „Winkel“ vor „Bewegung von Figuren … Drehung“ in einer Einheit; KMK p.20: verschieben, drehen, spiegeln)
        name: { de: "Spiegeln, Verschieben, Drehen", en: "Reflections, translations, rotations" }
        iCan: "Ich kann Figuren spiegeln, verschieben und drehen und die Bildfigur bestimmen."
        gradeBand: "5-6"
        requires: [symmetrie, koordinatensystem, winkel-messen]
      - id: grundkoerper-quader-wuerfel
        # KMK L Raum und Form S. 20: „analysieren und klassifizieren geometrische Objekte … des Raumes“
        # KMK p.20; HE 5.2; BY M5 4.2; NRW E Geo-3
        # bands: 5 / 5 / 5-6 -> 5-6
        name: { de: "Quader und Würfel", en: "Cuboids and cubes" }
        iCan: "Ich kann Quader, Würfel und zusammengesetzte Körper erkennen und beschreiben."
        gradeBand: "5-6"
        requires: [grundfiguren-eben]
      - id: netze-schraegbilder-modelle
        # KMK L Raum und Form S. 20: „fertigen Netze, Schrägbilder und Modelle von ausgewählten Körpern … an“
        # NARROWED to Quader/Wuerfel (Prisma/Zylinder and Pyramide/Kegel split off). KMK p.20; HE 5.2; BY M5 4.2; NRW E Geo-15
        # bands: 5 / 5 / 5-6 -> 5-6
        name: { de: "Netze und Schrägbilder: Quader, Würfel", en: "Nets and oblique drawings: cuboids, cubes" }
        iCan: "Ich kann Netze, Schrägbilder und Modelle von Quader und Würfel zeichnen oder bauen."
        gradeBand: "5-6"
        requires: [grundkoerper-quader-wuerfel]
      - id: haus-der-vierecke
        # KMK L Raum und Form S. 20: „analysieren und klassifizieren geometrische Objekte der Ebene (insbesondere … Vierecke)“
        # KMK p.20 (klassifizieren); HE 8.2, HE-KC 7/8; BY M7 2.1 („ordnen … die Menge aller symmetrischen Vierecke anhand ihrer
        # Symmetrieeigenschaften; … begründen, welche Arten von Vierecken Spezialfälle anderer sind“); NRW E Geo-2 (klassifizieren besondere Vierecke)
        # bands: HE 8 / BY 7 / NRW 5-6 -> 7-8 (NRW dissents). The 5-6 content (Vierecke beschreiben, BY M5 2) is vierecke-grundfiguren.
        name: { de: "Haus der Vierecke", en: "Hierarchy of quadrilaterals" }
        iCan: "Ich kann Vierecke nach ihren Eigenschaften im Haus der Vierecke ordnen und begründen."
        gradeBand: "7-8"
        requires: [vierecke-grundfiguren, symmetrie]
      - id: winkelsaetze
        # KMK L Raum und Form S. 20-21: „wenden Sätze der ebenen Geometrie … bei Konstruktionen, Berechnungen, Begründungen und Beweisen an“
        # KMK p.20-21; HE 7.3; BY M7 2.2; NRW S1 Geo-1, Geo-2 (SILP 7.3)
        # bands: 7 / 7 / 7-8 -> 7-8
        name: { de: "Winkelsätze", en: "Angle theorems" }
        iCan: "Ich kann mit Winkelsätzen und dem Winkelsummensatz fehlende Winkel berechnen."
        gradeBand: "7-8"
        requires: [winkel-messen]
      - id: dreieckskonstruktion
        # KMK L Raum und Form S. 21: „zeichnen und konstruieren geometrische Figuren“, „untersuchen Fragen der Lösbarkeit und Lösungsvielfalt von Konstruktionsaufgaben“
        # NEW (split from konstruktionen). KMK p.21 (Konstruktion, Loesbarkeit); HE 7.3 (Konstruktion von Dreiecken und Vierecken); BY M7 5; NRW S1 Geo-3, Geo-4, Geo-5
        # bands: 7 / 7 / 7-8 -> 7-8
        name: { de: "Dreieckskonstruktion", en: "Constructing triangles" }
        iCan: "Ich kann Dreiecke aus Seiten und Winkeln konstruieren und sagen, ob die Konstruktion eindeutig ist."
        gradeBand: "7-8"
        requires: [konstruktionen, winkel-messen]
      - id: kongruenz
        # KMK L Raum und Form S. 20: „Eigenschaften und Beziehungen geometrischer Objekte (z. B. Symmetrie, Idee der Kongruenz …)“
        # KMK p.20 (Idee der Kongruenz); HE 7.3, 8.2; BY M7 5; NRW S1 Geo-3 (Kongruenzsaetze)
        # bands: 7-8 / 7 / 7-8 -> 7-8
        name: { de: "Kongruenz", en: "Congruence" }
        iCan: "Ich kann erkennen und begründen, dass Figuren deckungsgleich sind, und die Kongruenzsätze für Dreiecke anwenden."
        gradeBand: "7-8"
        requires: [bewegungen-figuren, dreieckskonstruktion]
      - id: linien-im-dreieck
        # KMK L Raum und Form S. 21: „zeichnen und konstruieren geometrische Figuren“
        # Die besonderen Linien im Dreieck nennt die KMK nicht eigens.
        # NEW. HE 8.2 (Mittelsenkrechte, Winkelhalbierende, Hoehen, Umkreis, Inkreis); BY M7 2.1, M7 5; NRW S1 Geo (Konstruktion: Mittelsenkrechte, Seitenhalbierende, Winkelhalbierende, Inkreis, Umkreis)
        # bands: 8 / 7 / 7-8 -> 7-8
        name: { de: "Besondere Linien im Dreieck", en: "Special lines in triangles" }
        iCan: "Ich kann Mittelsenkrechten, Winkelhalbierenden und Höhen im Dreieck konstruieren und Um- und Inkreis zeichnen."
        gradeBand: "7-8"
        requires: [dreieckskonstruktion]
      - id: kreis-sehne-tangente
        # KMK L Raum und Form S. 20: „Eigenschaften und Beziehungen geometrischer Objekte (z. B. … Lagebeziehungen)“
        # Sehne, Sekante und Tangente nennt die KMK nicht eigens.
        # NEW. HE 8.2 (Sehne, Sekante, Tangente); BY M7 5 (Tangente an einen Kreis); NRW S2 Geo (Kreis: Tangente)
        # bands: 8 / 7 / 9-10 -> 7-8 (NRW dissents)
        name: { de: "Sehne, Sekante und Tangente", en: "Chords, secants and tangents" }
        iCan: "Ich kann Sehne, Sekante und Tangente am Kreis unterscheiden und eine Tangente zeichnen."
        gradeBand: "7-8"
        requires: [grundfiguren-eben]
      - id: satz-des-thales
        # KMK L Raum und Form S. 20-21: „wenden Sätze der ebenen Geometrie (insbesondere … den Satz des Thales …) … an“ (MSA)
        # KMK p.21 (Satz des Thales, MSA); HE 8.2, HE-KC 7/8; BY M7 5; NRW S1 Geo-2 (SILP 7.3)
        # bands: 8 / 7 / 7-8 -> 7-8
        name: { de: "Satz des Thales", en: "Thales' theorem" }
        iCan: "Ich kann den Satz des Thales erklären und bei Konstruktionen anwenden."
        gradeBand: "7-8"
        requires: [winkelsaetze, konstruktionen, kreis-sehne-tangente]
      - id: grundkoerper-prisma-zylinder
        # KMK L Raum und Form S. 20: „analysieren und klassifizieren geometrische Objekte … des Raumes (insbesondere Prismen, Pyramiden, Zylinder, Kegel, Kugel)“
        # unchanged. KMK p.20; HE 8.2, HE-KC 7/8; BY M8 7; NRW S2 Geo (Koerper: Prisma, Zylinder)
        # bands: 8 / 8 / 9-10 -> 7-8 (NRW dissents)
        name: { de: "Prisma und Zylinder", en: "Prisms and cylinders" }
        iCan: "Ich kann Prisma und Zylinder erkennen und von anderen Körpern unterscheiden."
        gradeBand: "7-8"
        requires: [grundkoerper-quader-wuerfel]
      - id: netze-schraegbilder-prisma-zylinder
        # KMK L Raum und Form S. 20: „fertigen Netze, Schrägbilder und Modelle von ausgewählten Körpern (z. B. Prisma, Pyramide) an“
        # NEW (split from netze-schraegbilder-modelle). KMK p.20 (Netze, Schraegbilder, Modelle von Prisma ...); HE 8.2; BY M8 7; HE-KC 7/8
        # bands: 8 / 8 / - -> 7-8
        name: { de: "Netze und Schrägbilder: Prisma, Zylinder", en: "Nets and oblique drawings: prisms, cylinders" }
        iCan: "Ich kann Netze, Schrägbilder und Modelle von Prisma und Zylinder zeichnen oder bauen."
        gradeBand: "7-8"
        requires: [netze-schraegbilder-modelle, grundkoerper-prisma-zylinder]
      - id: aehnlichkeit
        # KMK L Raum und Form S. 20: „Eigenschaften und Beziehungen geometrischer Objekte (z. B. … Ähnlichkeit …)“; Abbildungen „zentrische Streckungen“ (MSA)
        # NEW (split from aehnlichkeit-strahlensaetze). KMK p.20-21 (Aehnlichkeit, zentrische Streckung); HE 9.4 (maßstabsgetreues Vergroessern); BY M9 4 (Ähnlichkeit, Flächen-/Volumenveränderung); NRW S2 Geo-2 (SILP 9.8)
        # bands: 9 / 9 / 9-10 -> 9-10
        name: { de: "Ähnlichkeit", en: "Similarity" }
        iCan: "Ich kann Figuren maßstabsgetreu vergrößern und verkleinern und ähnliche Figuren erkennen."
        gradeBand: "9-10"
        requires: [kongruenz, proportionale-zuordnungen, massstab]
      - id: strahlensaetze
        # KMK L Raum und Form S. 20-21: „wenden Sätze der ebenen Geometrie (insbesondere … Ähnlichkeitsbeziehungen …) bei Konstruktionen, Berechnungen … an“
        # Auch L Größen und Messen S. 17 (Streckenlängen „unter Nutzung … von Ähnlichkeitsbeziehungen“); Schwerpunkt: der Satz.
        # NEW (split from aehnlichkeit-strahlensaetze). KMK p.20-21; HE 9.4; BY M9 4; NRW S2 Geo-9 (Aehnlichkeitsbeziehungen)
        # bands: 9 / 9 / 9-10 -> 9-10
        name: { de: "Strahlensätze", en: "Intercept theorems" }
        iCan: "Ich kann mit den Strahlensätzen Streckenlängen berechnen."
        gradeBand: "9-10"
        requires: [aehnlichkeit, lineare-gleichungen]
      - id: satz-des-pythagoras
        # KMK L Raum und Form S. 20-21: „wenden Sätze der ebenen Geometrie (insbesondere den Satz des Pythagoras …) … an“
        # Auch L Größen und Messen S. 17 (Streckenlängen „unter Nutzung des Satzes von Pythagoras“); Schwerpunkt: der Satz und seine Umkehrung.
        # KMK p.17, 20; HE 9.5; BY M9 6; NRW S2 Geo-1 (SILP 9.1)
        # bands: 9 / 9 / 9-10 -> 9-10
        name: { de: "Satz des Pythagoras", en: "Pythagorean theorem" }
        iCan: "Ich kann mit dem Satz des Pythagoras und seiner Umkehrung Streckenlängen berechnen und rechte Winkel prüfen."
        gradeBand: "9-10"
        requires: [quadratwurzeln, flaeche-umfang-quadrat-rechteck]
      - id: trigonometrie
        # KMK L Raum und Form S. 20-21: „wenden Sätze der ebenen Geometrie (insbesondere … trigonometrische Beziehungen) … an“ (MSA)
        # Auch L Größen und Messen S. 17 (Streckenlängen und Winkelgrößen „unter Nutzung … von trigonometrischen Beziehungen“); Schwerpunkt: die Beziehungen.
        # KMK p.17, 20 (trigonometrische Beziehungen; MSA); HE 10.4; BY M9 7.1; NRW S2 Geo-7, Geo-9
        # bands: 10 / 9 / 9-10 -> 9-10
        name: { de: "Trigonometrie im rechtwinkligen Dreieck", en: "Right-angled trigonometry" }
        iCan: "Ich kann mit Sinus, Kosinus und Tangens Seiten und Winkel in rechtwinkligen Dreiecken berechnen."
        gradeBand: "9-10"
        requires: [satz-des-pythagoras, aehnlichkeit]
      - id: sinus-kosinussatz
        # KMK L Raum und Form S. 20-21: „trigonometrische Beziehungen“ bei „Konstruktionen, Berechnungen, Begründungen und Beweisen“ (MSA)
        # Auch L Größen und Messen S. 17; Sinus- und Kosinussatz nennt die KMK nicht eigens.
        # NEW (split from trigonometrie / berechnungen). HE 10.4 (Sinus-, Kosinussatz); BY M9 7.2; NRW S2 Geo-8 (Kosinussatz); KMK p.20-21 ("allgemeine Dreiecke" only in HE-KC 9/10)
        # bands: 10 / 9 / 9-10 -> 9-10
        name: { de: "Sinussatz und Kosinussatz", en: "Sine rule and cosine rule" }
        iCan: "Ich kann mit Sinus- und Kosinussatz Seiten und Winkel in beliebigen Dreiecken berechnen."
        gradeBand: "9-10"
        requires: [trigonometrie]
      - id: grundkoerper-pyramide-kegel-kugel
        # KMK L Raum und Form S. 20: „analysieren und klassifizieren geometrische Objekte … des Raumes (insbesondere … Pyramiden, … Kegel, Kugel)“
        # unchanged. KMK p.20; HE 10.3 (HE 5.2 and NRW E only name the solids); BY M10 5; NRW S2 Geo-5
        # bands: 10 / 10 / 9-10 -> 9-10
        name: { de: "Pyramide, Kegel und Kugel", en: "Pyramids, cones and spheres" }
        iCan: "Ich kann Pyramide, Kegel und Kugel beschreiben und Körper aus dem Alltag in Grundkörper zerlegen."
        gradeBand: "9-10"
        requires: [grundkoerper-prisma-zylinder]
      - id: netze-schraegbilder-pyramide-kegel
        # KMK L Raum und Form S. 20: „fertigen Netze, Schrägbilder und Modelle von ausgewählten Körpern (z. B. Prisma, Pyramide) an“
        # NEW (split from netze-schraegbilder-modelle). KMK p.20 (Prisma, Pyramide); HE 10.3, HE-KC 9/10; BY M10 5
        # bands: 10 / 10 / - -> 9-10
        name: { de: "Netze und Schrägbilder: Pyramide, Kegel", en: "Nets and oblique drawings: pyramids, cones" }
        iCan: "Ich kann Netze, Schrägbilder und Modelle von Pyramide und Kegel zeichnen oder bauen."
        gradeBand: "9-10"
        requires: [netze-schraegbilder-prisma-zylinder, grundkoerper-pyramide-kegel-kugel]

  # ===================================================================================================================
  # Leitidee „Daten und Zufall“: KMK S. 7, S. 21-22. Beschreibende Statistik und Wahrscheinlichkeitsrechnung.
  # Id aus der Sachgebiets-Fassung (Stochastik).
  # ===================================================================================================================
  - id: stochastik
    name: { de: Daten und Zufall, en: Data and chance }
    competencies:
      - id: daten-darstellen
        # KMK L Daten und Zufall S. 21-22: „organisieren sie in Tabellen und stellen sie grafisch dar“, „erstellen und interpretieren Diagramme (z. B. Säulen- oder Balkendiagramm, Kreisdiagramm, Liniendiagramm)“
        # NARROWED to tables and the common diagrams; Boxplot split off. KMK p.21-22 (Tabellen, Saeulen-, Balken-, Kreis-, Liniendiagramm); HE 5.1, 6.1, 7.1 (Kreis-, Saeulendiagramm), 8.4; HE-KC 5/6, 7/8; BY M6 3; NRW E Sto-2, Sto-4
        # bands: 5-8 / 6 / 5-6 -> 5-6
        # requires zahlen-vergleichen-ordnen: Die Achse eines Säulen- oder Balkendiagramms ist ein Zahlenstrahl mit passender Skalierung (HE 5.1: „Bestimmung von Anzahlen und Darstellung in Diagrammen“ und „Vergleichen, Ordnen, Zahlenstrahl“ in einer Einheit; BY M5 1.1: Zahlen „unter Wahl einer geeigneten Skalierung am Zahlenstrahl“ darstellen)
        name: { de: "Daten darstellen", en: "Representing data" }
        iCan: "Ich kann Daten in Tabellen und Diagrammen darstellen und die Darstellung begründen."
        gradeBand: "5-6"
        requires: [zahlen-vergleichen-ordnen]
      - id: umfragen-erhebungen
        # KMK L Daten und Zufall S. 21: „planen einfache Befragungen“ (ESA), „sammeln systematisch Daten (z. B. … Daten aus Befragungen …)“
        # NARROWED to the simple survey (planning with Stichprobe split off). KMK p.21 (ESA: planen einfache Befragungen); HE-KC 5/6 (Umfragen und Erhebungen); NRW E Sto-1 (SILP 5.1, 6.8); BY M6 3 (Daten aus Erhebungen)
        # bands: HE 5-6 (KC) / 6 / 5-6 -> 5-6
        name: { de: "Umfragen durchführen", en: "Conducting surveys" }
        iCan: "Ich kann eine einfache Umfrage planen, durchführen und die Antworten in Listen erfassen."
        gradeBand: "5-6"
        requires: [daten-darstellen]
      - id: haeufigkeiten
        # KMK L Daten und Zufall S. 21-22: „werten grafische Darstellungen und Tabellen von statistischen Erhebungen aus“; „relativen Häufigkeiten“
        # NARROWED to the statistics side (the estimate-for-probability part is haeufigkeit-als-schaetzwert). KMK p.22; HE 5.1 (absolute), 6.1 (relative); BY M6 3; NRW E Sto-3
        # bands: 5-6 / 6 / 5-6 -> 5-6
        name: { de: "Absolute und relative Häufigkeit", en: "Absolute and relative frequency" }
        iCan: "Ich kann absolute und relative Häufigkeiten bestimmen."
        gradeBand: "5-6"
        requires: [brueche-begriff]
      - id: mittelwert
        # KMK L Daten und Zufall S. 21-22: „ermitteln und interpretieren Kenngrößen (z. B. … arithmetisches Mittel …)“
        # NEW (split from kenngroessen-lage-streumasse). KMK p.21-22 (arithmetisches Mittel); HE 6.1 (Mittelwerte); BY M6 3; NRW E Sto-3
        # bands: 6 / 6 / 5-6 -> 5-6
        name: { de: "Arithmetisches Mittel", en: "Arithmetic mean" }
        iCan: "Ich kann das arithmetische Mittel berechnen und deuten."
        gradeBand: "5-6"
        requires: [daten-darstellen, dezimalbrueche-rechnen]
      - id: zufallserscheinungen
        # KMK L Daten und Zufall S. 22: „beschreiben Zufallserscheinungen aus dem Alltag“
        # BAND CHANGED 5-6 -> 7-8. KMK p.22 (beschreiben Zufallserscheinungen); HE 7.4 (HE-KC 5/6 first notions); BY M8 5; NRW S1 Sto-1 (SILP 7.7)
        # bands: 7 / 8 / 7-8 -> 7-8
        name: { de: "Zufallsversuche", en: "Random experiments" }
        iCan: "Ich kann Zufallserscheinungen im Alltag erkennen und Zufallsversuche mit ihren Ergebnissen beschreiben."
        gradeBand: "7-8"
        requires: [haeufigkeiten]
      - id: haeufigkeit-als-schaetzwert
        # KMK L Daten und Zufall S. 22: „nutzen … die auftretenden relativen Häufigkeiten als Schätzwerte von Wahrscheinlichkeiten, die bei wachsendem Stichprobenumfang besser werden“
        # NEW (split from haeufigkeiten). KMK p.22 (relative Haeufigkeiten als Schaetzwerte, wachsender Stichprobenumfang); HE 7.4; BY M8 5; NRW S1 Sto-1 (empirisches Gesetz der grossen Zahlen)
        # bands: 7 / 8 / 7-8 -> 7-8
        name: { de: "Relative Häufigkeit als Schätzwert", en: "Relative frequency as an estimate" }
        iCan: "Ich kann relative Häufigkeiten als Schätzwerte für Wahrscheinlichkeiten deuten und erklären, warum sie bei vielen Versuchen verlässlicher werden."
        gradeBand: "7-8"
        requires: [zufallserscheinungen]
      - id: wahrscheinlichkeitsbegriff
        # KMK L Daten und Zufall S. 21-22: Wahrscheinlichkeiten „als Prognosen von relativen Häufigkeiten“ (S. 21), „interpretieren Wahrscheinlichkeitsaussagen“ (S. 22)
        # BAND CHANGED 5-6 -> 7-8. KMK p.22; HE 7.4 (HE-KC 5/6); BY M8 5; NRW S1 Sto (Begriffsbildung: Wahrscheinlichkeit)
        # bands: 7 / 8 / 7-8 -> 7-8
        name: { de: "Wahrscheinlichkeitsbegriff", en: "Concept of probability" }
        iCan: "Ich kann erklären, was Wahrscheinlichkeit bedeutet, und Wahrscheinlichkeiten auf einer Skala von 0 bis 1 einordnen."
        gradeBand: "7-8"
        requires: [haeufigkeit-als-schaetzwert]
      - id: zufall-laplace
        # KMK L Daten und Zufall S. 22: „bestimmen Wahrscheinlichkeiten bei einfachen Zufallsexperimenten“
        # unchanged (used by an app). KMK p.22 (einfache Zufallsexperimente); HE 7.4 (Laplace-Formel); BY M8 5; NRW S1 Sto-4
        # bands: 7 / 8 / 7-8 -> 7-8
        name: { de: "Laplace-Formel", en: "Laplace formula" }
        iCan: "Ich kann Wahrscheinlichkeiten mit der Laplace-Formel berechnen: günstige durch mögliche Ergebnisse."
        gradeBand: "7-8"
        requires: [wahrscheinlichkeitsbegriff]
      - id: zufall-gegenereignis
        # KMK L Daten und Zufall S. 22: „bestimmen Wahrscheinlichkeiten bei ein- oder mehrstufigen Zufallsexperimenten“
        # unchanged (used by an app). HE 7.4 (Ereignisse, Additionssatz); BY M8 5 (Gegenereignis named); NRW S1 Sto-3 (stochastische Regeln)
        # bands: 7 / 8 / 7-8 -> 7-8
        name: { de: "Gegenereignis", en: "Complementary event" }
        iCan: "Ich kann die Wahrscheinlichkeit über das Gegenereignis mit 1 minus P(E) berechnen."
        gradeBand: "7-8"
        requires: [zufall-laplace]
      - id: zufall-baumdiagramm
        # KMK L Daten und Zufall S. 22: „bestimmen Wahrscheinlichkeiten bei ein- oder mehrstufigen Zufallsexperimenten, auch mit Hilfe entsprechender Visualisierungen (z. B. Baumdiagramm, Vierfeldertafel)“
        # unchanged (used by an app; its text still mentions the Vierfeldertafel, which the sources place later: see vierfeldertafel). KMK p.22; HE 7.4, HE-KC 7/8; BY M8 5 (Baum fuer Zaehlen), M10 2; NRW S1 Sto-2 (SILP 8.1)
        # bands: 7 / 8-10 / 7-8 -> 7-8
        # requires zaehlprinzip: Das Baumdiagramm zum Zählen von Möglichkeiten ist die Grundlage des Wahrscheinlichkeitsbaums (BY M5 3.1: Zählprinzip und „Baumdiagramme zur systematischen Bestimmung von Anzahlen“; BY M8 5: Laplace-Wahrscheinlichkeiten „nutzen dabei auch das Zählprinzip und Baumdiagramme“; KMK p.16, 22)
        name: { de: "Mehrstufige Zufallsexperimente", en: "Multistage random experiments" }
        iCan: "Ich kann ein mehrstufiges Zufallsexperiment als Baumdiagramm oder Vierfeldertafel darstellen."
        gradeBand: "7-8"
        requires: [zufall-laplace, zaehlprinzip]
      - id: zufall-pfadregel-1
        # KMK L Daten und Zufall S. 22: „bestimmen Wahrscheinlichkeiten bei … mehrstufigen Zufallsexperimenten, auch mit Hilfe … (z. B. Baumdiagramm …)“
        # unchanged (used by an app; requires extended by the fraction skill it needs). KMK p.22; HE 7.4 (Multiplikationsregel); BY M10 2; NRW S1 Sto-3 (SILP 8.1)
        # bands: 7 / 10 / 7-8 -> 7-8 (BY dissents)
        name: { de: "Erste Pfadregel (Produktregel)", en: "Multiplication rule for paths" }
        iCan: "Ich kann die Wahrscheinlichkeit eines Pfades berechnen, indem ich die Zweigwahrscheinlichkeiten multipliziere."
        gradeBand: "7-8"
        requires: [zufall-baumdiagramm, brueche-multiplizieren-dividieren]
      - id: zufall-ohne-zuruecklegen
        # KMK L Daten und Zufall S. 22: „bestimmen Wahrscheinlichkeiten bei … mehrstufigen Zufallsexperimenten“
        # unchanged (used by an app). KMK p.22; HE 7.4; BY M10 2; NRW S1 Sto-2, Sto-3
        # bands: 7 / 10 / 7-8 -> 7-8 (BY dissents)
        name: { de: "Ziehen mit und ohne Zurücklegen", en: "Drawing with and without replacement" }
        iCan: "Ich kann Ziehen mit und ohne Zurücklegen unterscheiden und die Zweigwahrscheinlichkeiten anpassen."
        gradeBand: "7-8"
        requires: [zufall-pfadregel-1]
      - id: zufall-pfadregel-2
        # KMK L Daten und Zufall S. 22: „bestimmen Wahrscheinlichkeiten bei … mehrstufigen Zufallsexperimenten, auch mit Hilfe … (z. B. Baumdiagramm …)“
        # unchanged (used by an app; requires extended). KMK p.22; HE 7.4 (Additionssatz); BY M10 2; NRW S1 Sto-3
        # bands: 7 / 10 / 7-8 -> 7-8 (BY dissents)
        name: { de: "Zweite Pfadregel (Summenregel)", en: "Addition rule for paths" }
        iCan: "Ich kann die Wahrscheinlichkeit eines Ereignisses berechnen, indem ich die Wahrscheinlichkeiten seiner Pfade addiere."
        gradeBand: "7-8"
        requires: [zufall-pfadregel-1]
      - id: zufall-ergebnisform
        # KMK L Daten und Zufall S. 22: „bestimmen Wahrscheinlichkeiten bei ein- oder mehrstufigen Zufallsexperimenten“
        # Auch L Zahl und Operation S. 15 („stellen Zahlen der Situation angemessen dar“); bleibt hier, weil die App mathe-stochastik ihn nutzt.
        # unchanged (used by an app). WEAKLY BACKED: no source names it as a unit; touches BY M6 3 (relative Haeufigkeit als Bruch, Dezimalbruch, Prozentsatz) and HE 7.4 (Bruchrechnung wiederholen). Candidate to fold into wahrscheinlichkeitsbegriff later.
        # bands: no source unit; follows prozent-grundbegriffe and laplace -> 7-8
        name: { de: "Darstellung von Wahrscheinlichkeiten", en: "Writing probabilities" }
        iCan: "Ich kann Wahrscheinlichkeiten als Bruch, Dezimalzahl, Prozentangabe oder Rechenterm angeben und zwischen den Formen wechseln."
        gradeBand: "7-8"
        requires: [zufall-laplace, prozent-grundbegriffe]
      - id: zufall-ereignis-uebersetzen
        # KMK L Daten und Zufall S. 22: „bestimmen Wahrscheinlichkeiten bei … mehrstufigen Zufallsexperimenten, auch mit Hilfe entsprechender Visualisierungen (z. B. Baumdiagramm …)“
        # unchanged (used by an app). Indirectly backed: KMK p.22 (Wahrscheinlichkeiten bei mehrstufigen Experimenten mit Visualisierungen), NRW S1 Sto-2, Sto-3, BY M10 2. The wording "genau einmal / mindestens einmal" is the app's.
        # bands: 7 / 10 / 7-8 -> 7-8
        name: { de: "Ereignisse im Baumdiagramm", en: "Events in tree diagrams" }
        iCan: "Ich kann Ereignisse wie genau einmal oder mindestens einmal in die passenden Pfade eines Baumdiagramms übersetzen."
        gradeBand: "7-8"
        requires: [zufall-pfadregel-2]
      - id: simulationen
        # KMK L Daten und Zufall S. 21: „erproben Simulationen“ (ESA), „nutzen Simulationen, um stochastische Fragen zu entscheiden“ (MSA)
        # KMK p.21 (Simulationen); HE 8.4; BY M10 2 (stochastische Simulationen, Monte-Carlo); NRW S1 Sto-5
        # bands: 8 / 10 / 7-8 -> 7-8 (BY dissents)
        name: { de: "Simulationen", en: "Simulations" }
        iCan: "Ich kann einfache Zufallsversuche mit Zufallszahlen und Tabellenkalkulation simulieren und auswerten."
        gradeBand: "7-8"
        requires: [haeufigkeit-als-schaetzwert]
      # requires mittelwert: HE lehrt den Mittelwert vor den Kenngrößen (HE 6.1 vor 9.7); NRW vergleicht Median und Mittel (E Sto-3)
