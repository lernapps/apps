        # bands: 5 / 5 / 5-6 -> 5-6
        iCan: "Ich kann Netze, Schrägbilder und Modelle von Quader und Würfel zeichnen oder bauen."
        gradeBand: "5-6"
        requires: [grundkoerper-quader-wuerfel]
      - id: einheiten-flaeche-volumen
        # NEW. KMK p.17 (Einheiten fuer Flaeche, Volumen waehlen und umwandeln; Einheitsquadrat/-wuerfel), KMK-P p.15; HE 5.3; BY M5 4.2, M6 2.2; NRW E Ari-9, Geo-11
        # bands: 5 / 5-6 / 5-6 -> 5-6
        iCan: "Ich kann Flächen- und Volumeneinheiten umrechnen und ihre Größe einschätzen."
        gradeBand: "5-6"
        requires: [umrechnung-groessen]
      - id: flaeche-umfang-quadrat-rechteck
        # KMK p.17; HE 5.2, 6.2; BY M5 4.2; NRW E Geo-12
        # bands: 5-6 / 5 / 5-6 -> 5-6
        iCan: "Ich kann Flächeninhalt und Umfang von Quadrat und Rechteck berechnen."
        gradeBand: "5-6"
        requires: [grundfiguren-eben, umrechnung-groessen, einheiten-flaeche-volumen]
      - id: zusammengesetzte-figuren
        # KMK p.17; HE 6.2; BY M5 4.2; NRW E Geo-13
        # bands: 6 / 5 / 5-6 -> 5-6
        iCan: "Ich kann Flächeninhalt und Umfang zusammengesetzter Figuren durch Zerlegen berechnen."
        gradeBand: "5-6"
        requires: [flaeche-umfang-quadrat-rechteck, grundfiguren-eben]
      - id: volumen-oberflaeche-quader-wuerfel
        # KMK p.17; HE 5.2, 6.2; BY M5 4.2, M6 2.2; NRW E Geo-12
        # bands: 5-6 / 5-6 / 5-6 -> 5-6
        iCan: "Ich kann Volumen und Oberflächeninhalt von Quader und Würfel berechnen."
