        gradeBand: "7-8"
        requires: [konstruktionen, winkel-messen]
      - id: kongruenz
        # KMK p.20 (Idee der Kongruenz); HE 7.3, 8.2; BY M7 5; NRW S1 Geo-3 (Kongruenzsaetze)
        # bands: 7-8 / 7 / 7-8 -> 7-8
        iCan: "Ich kann erkennen und begründen, dass Figuren deckungsgleich sind, und die Kongruenzsätze für Dreiecke anwenden."
        gradeBand: "7-8"
        requires: [bewegungen-figuren, dreieckskonstruktion]
      - id: linien-im-dreieck
        # NEW. HE 8.2 (Mittelsenkrechte, Winkelhalbierende, Hoehen, Umkreis, Inkreis); BY M7 2.1, M7 5; NRW S1 Geo (Konstruktion: Mittelsenkrechte, Seitenhalbierende, Winkelhalbierende, Inkreis, Umkreis)
        # bands: 8 / 7 / 7-8 -> 7-8
        iCan: "Ich kann Mittelsenkrechten, Winkelhalbierenden und Höhen im Dreieck konstruieren und Um- und Inkreis zeichnen."
        gradeBand: "7-8"
        requires: [dreieckskonstruktion]
      - id: kreis-sehne-tangente
        # NEW. HE 8.2 (Sehne, Sekante, Tangente); BY M7 5 (Tangente an einen Kreis); NRW S2 Geo (Kreis: Tangente)
        # bands: 8 / 7 / 9-10 -> 7-8 (NRW dissents)
