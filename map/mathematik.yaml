        # bands: 5-6 / 7 / 5-6 -> 5-6 (BY dissents)
        iCan: "Ich kann Achsen-, Punkt- und Drehsymmetrie bei Figuren erkennen und nutzen."
        gradeBand: "5-6"
        requires: [grundfiguren-eben]
      - id: vierecke-grundfiguren
        # NARROWED (Kreis is in grundfiguren-eben), BAND CHANGED 7-8 -> 5-6. KMK p.20; HE 5.2; BY M5 2 (Vierecke erkennen und erzeugen); NRW E Geo-2
        # bands: 5 / 5 / 5-6 -> 5-6
        iCan: "Ich kann besondere Vierecke mit ihren Eigenschaften beschreiben und unterscheiden."
        gradeBand: "5-6"
        requires: [grundfiguren-eben, parallel-senkrecht-abstand]
      - id: konstruktionen
