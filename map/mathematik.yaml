        gradeBand: "7-8"
        requires: [grundfiguren-eben, parallel-senkrecht-abstand]
      - id: satz-des-thales
        # KMK p.21 (Satz des Thales, MSA); HE 8.2, HE-KC 7/8; BY M7 5; NRW S1 Geo-2 (SILP 7.3)
        # bands: 8 / 7 / 7-8 -> 7-8
        iCan: "Ich kann den Satz des Thales erklären und bei Konstruktionen anwenden."
        gradeBand: "7-8"
        requires: [winkelsaetze, konstruktionen, kreis-sehne-tangente]
      - id: flaeche-umfang-dreieck-viereck
        # REPLACES flaeche-umfang-dreieck-viereck-kreis (Kreis split to kreis-umfang-flaeche). KMK p.17; HE 7.3 (Parallelogramm, Dreieck, Trapez); BY M6 2.1; NRW S1 Geo-8 (SILP 7.5, 8.2)
        # bands: 7 / 6 / 7-8 -> 7-8 (BY dissents)
        iCan: "Ich kann Flächeninhalt und Umfang von Dreieck und besonderen Vierecken berechnen."
        gradeBand: "7-8"
        requires: [flaeche-umfang-quadrat-rechteck, vierecke-grundfiguren]
      - id: grundkoerper-prisma-zylinder
        # unchanged. KMK p.20; HE 8.2, HE-KC 7/8; BY M8 7; NRW S2 Geo (Koerper: Prisma, Zylinder)
        # bands: 8 / 8 / 9-10 -> 7-8 (NRW dissents)
        iCan: "Ich kann Prisma und Zylinder erkennen und von anderen Körpern unterscheiden."
        gradeBand: "7-8"
        requires: [grundkoerper-quader-wuerfel]
      - id: netze-schraegbilder-prisma-zylinder
        # NEW (split from netze-schraegbilder-modelle). KMK p.20 (Netze, Schraegbilder, Modelle von Prisma ...); HE 8.2; BY M8 7; HE-KC 7/8
        # bands: 8 / 8 / - -> 7-8
        iCan: "Ich kann Netze, Schrägbilder und Modelle von Prisma und Zylinder zeichnen oder bauen."
        gradeBand: "7-8"
        requires: [netze-schraegbilder-modelle, grundkoerper-prisma-zylinder]
      - id: volumen-oberflaeche-prisma
        # KMK p.17; HE 8.2; BY M8 7; NRW S2 Geo-5
        # bands: 8 / 8 / 9-10 -> 7-8 (NRW dissents)
        iCan: "Ich kann Volumen und Oberflächeninhalt von Prismen berechnen."
        gradeBand: "7-8"
        requires: [volumen-oberflaeche-quader-wuerfel, flaeche-umfang-dreieck-viereck, grundkoerper-prisma-zylinder]
      - id: kreis-umfang-flaeche
        # NEW (split from flaeche-umfang-dreieck-viereck-kreis and reelle-zahlen: Pi). KMK p.17 (Kreis); HE 9.6; BY M8 7; NRW S2 Geo-3, Geo-4 (SILP 9.3)
        # bands: 9 / 8 / 9-10 -> 9-10 (BY dissents)
        iCan: "Ich kann Umfang und Flächeninhalt eines Kreises berechnen und die Zahl Pi am Kreis erklären."
        gradeBand: "9-10"
        requires: [flaeche-umfang-quadrat-rechteck, dezimalbrueche-rechnen]
      - id: aehnlichkeit
        # NEW (split from aehnlichkeit-strahlensaetze). KMK p.20-21 (Aehnlichkeit, zentrische Streckung); HE 9.4 (maßstabsgetreues Vergroessern); BY M9 4 (Ähnlichkeit, Flächen-/Volumenveränderung); NRW S2 Geo-2 (SILP 9.8)
        # bands: 9 / 9 / 9-10 -> 9-10
        iCan: "Ich kann Figuren maßstabsgetreu vergrößern und verkleinern und ähnliche Figuren erkennen."
        gradeBand: "9-10"
        requires: [kongruenz, proportionale-zuordnungen, massstab]
      - id: strahlensaetze
        # NEW (split from aehnlichkeit-strahlensaetze). KMK p.20-21; HE 9.4; BY M9 4; NRW S2 Geo-9 (Aehnlichkeitsbeziehungen)
        # bands: 9 / 9 / 9-10 -> 9-10
        iCan: "Ich kann mit den Strahlensätzen Streckenlängen berechnen."
        gradeBand: "9-10"
        requires: [aehnlichkeit, lineare-gleichungen]
      - id: satz-des-pythagoras
        # KMK p.17, 20; HE 9.5; BY M9 6; NRW S2 Geo-1 (SILP 9.1)
        # bands: 9 / 9 / 9-10 -> 9-10
        iCan: "Ich kann mit dem Satz des Pythagoras und seiner Umkehrung Streckenlängen berechnen und rechte Winkel prüfen."
        gradeBand: "9-10"
        requires: [quadratwurzeln, flaeche-umfang-quadrat-rechteck]
      - id: trigonometrie
        # KMK p.17, 20 (trigonometrische Beziehungen; MSA); HE 10.4; BY M9 7.1; NRW S2 Geo-7, Geo-9
        # bands: 10 / 9 / 9-10 -> 9-10
        iCan: "Ich kann mit Sinus, Kosinus und Tangens Seiten und Winkel in rechtwinkligen Dreiecken berechnen."
        gradeBand: "9-10"
        requires: [satz-des-pythagoras, aehnlichkeit]
      - id: sinus-kosinussatz
        # NEW (split from trigonometrie / berechnungen). HE 10.4 (Sinus-, Kosinussatz); BY M9 7.2; NRW S2 Geo-8 (Kosinussatz); KMK p.20-21 ("allgemeine Dreiecke" only in HE-KC 9/10)
        # bands: 10 / 9 / 9-10 -> 9-10
        iCan: "Ich kann mit Sinus- und Kosinussatz Seiten und Winkel in beliebigen Dreiecken berechnen."
        gradeBand: "9-10"
        requires: [trigonometrie]
      - id: grundkoerper-pyramide-kegel-kugel
        # unchanged. KMK p.20; HE 10.3 (HE 5.2 and NRW E only name the solids); BY M10 5; NRW S2 Geo-5
        # bands: 10 / 10 / 9-10 -> 9-10
        iCan: "Ich kann Pyramide, Kegel und Kugel beschreiben und Körper aus dem Alltag in Grundkörper zerlegen."
        gradeBand: "9-10"
        requires: [grundkoerper-prisma-zylinder]
      - id: netze-schraegbilder-pyramide-kegel
        # NEW (split from netze-schraegbilder-modelle). KMK p.20 (Prisma, Pyramide); HE 10.3, HE-KC 9/10; BY M10 5
        # bands: 10 / 10 / - -> 9-10
        iCan: "Ich kann Netze, Schrägbilder und Modelle von Pyramide und Kegel zeichnen oder bauen."
        gradeBand: "9-10"
        requires: [netze-schraegbilder-prisma-zylinder, grundkoerper-pyramide-kegel-kugel]
      - id: volumen-oberflaeche-zylinder
        # NEW (split from volumen-oberflaeche-pyramide-kegel-zylinder-kugel). KMK p.17; HE 9.6; BY M8 7; NRW S2 Geo-5
        # bands: 9 / 8 / 9-10 -> 9-10 (BY dissents)
        iCan: "Ich kann Volumen und Oberflächeninhalt von Zylindern berechnen."
        gradeBand: "9-10"
        requires: [volumen-oberflaeche-prisma, kreis-umfang-flaeche]
      - id: volumen-oberflaeche-pyramide-kegel-kugel
        # NARROWED (Zylinder split off). KMK p.17; HE 10.3; BY M10 5; NRW S2 Geo-5, Geo-6
        # bands: 10 / 10 / 9-10 -> 9-10
        iCan: "Ich kann Volumen und Oberflächeninhalt von Pyramide, Kegel und Kugel berechnen."
        gradeBand: "9-10"
        requires: [volumen-oberflaeche-zylinder, satz-des-pythagoras, grundkoerper-pyramide-kegel-kugel]
      - id: berechnungen-dreiecke-vielecke
        # unchanged (synthesis Baustein). KMK p.17 (berechnen Streckenlaengen und Winkelgroessen mit Pythagoras, Trigonometrie, Aehnlichkeit); HE 9.5, HE-KC 9/10 (Berechnungen in Dreiecken und Vielecken); BY M9 6, 7; NRW S2 Geo-9
        # bands: 9-10 / 9-10 / 9-10 -> 9-10
        iCan: "Ich kann Streckenlängen und Winkel in Dreiecken und Vielecken mit Pythagoras, Ähnlichkeit und Trigonometrie berechnen."
        gradeBand: "9-10"
        requires: [satz-des-pythagoras, strahlensaetze, trigonometrie]

  # ===================================================================================================================
  # STOCHASTIK: KMK Leitidee "Daten und Zufall" (Sachgebiet Stochastik), p. 21-22, plus systematic counting (p. 16).
  # ===================================================================================================================
  - id: stochastik
    name: { de: Stochastik, en: Probability and statistics }
    competencies:
      - id: daten-darstellen
        # NARROWED to tables and the common diagrams; Boxplot split off. KMK p.21-22 (Tabellen, Saeulen-, Balken-, Kreis-, Liniendiagramm); HE 5.1, 6.1, 7.1 (Kreis-, Saeulendiagramm), 8.4; HE-KC 5/6, 7/8; BY M6 3; NRW E Sto-2, Sto-4
        # bands: 5-8 / 6 / 5-6 -> 5-6
        iCan: "Ich kann Daten in Tabellen und Diagrammen darstellen und die Darstellung begründen."
        gradeBand: "5-6"
      - id: umfragen-erhebungen
        # NARROWED to the simple survey (planning with Stichprobe split off). KMK p.21 (ESA: planen einfache Befragungen); HE-KC 5/6 (Umfragen und Erhebungen); NRW E Sto-1 (SILP 5.1, 6.8); BY M6 3 (Daten aus Erhebungen)
        # bands: HE 5-6 (KC) / 6 / 5-6 -> 5-6
        iCan: "Ich kann eine einfache Umfrage planen, durchführen und die Antworten in Listen erfassen."
        gradeBand: "5-6"
        requires: [daten-darstellen]
      - id: haeufigkeiten
        # NARROWED to the statistics side (the estimate-for-probability part is haeufigkeit-als-schaetzwert). KMK p.22; HE 5.1 (absolute), 6.1 (relative); BY M6 3; NRW E Sto-3
        # bands: 5-6 / 6 / 5-6 -> 5-6
        iCan: "Ich kann absolute und relative Häufigkeiten bestimmen."
        gradeBand: "5-6"
        requires: [brueche-begriff]
      - id: mittelwert
        # NEW (split from kenngroessen-lage-streumasse). KMK p.21-22 (arithmetisches Mittel); HE 6.1 (Mittelwerte); BY M6 3; NRW E Sto-3
        # bands: 6 / 6 / 5-6 -> 5-6
        iCan: "Ich kann das arithmetische Mittel berechnen und deuten."
        gradeBand: "5-6"
        requires: [daten-darstellen, dezimalbrueche-rechnen]
      - id: zaehlprinzip
        # NEW. KMK p.16 (systematische Zaehlprinzipien, MSA); BY M5 3.1 (Zaehlprinzip, Baumdiagramme); NRW S2 Sto-4 (kombinatorische Ueberlegungen); HE 5.1 only "Anzahlen bestimmen"
        # bands: (5) / 5 / 9-10 -> 5-6 (no real majority; BY places it earliest, NRW latest)
        iCan: "Ich kann mit dem Zählprinzip und Baumdiagrammen die Anzahl von Möglichkeiten bestimmen."
        gradeBand: "5-6"
        requires: [grundrechenarten-rechengesetze]
      - id: zufallserscheinungen
        # BAND CHANGED 5-6 -> 7-8. KMK p.22 (beschreiben Zufallserscheinungen); HE 7.4 (HE-KC 5/6 first notions); BY M8 5; NRW S1 Sto-1 (SILP 7.7)
        # bands: 7 / 8 / 7-8 -> 7-8
        iCan: "Ich kann Zufallserscheinungen im Alltag erkennen und Zufallsversuche mit ihren Ergebnissen beschreiben."
        gradeBand: "7-8"
        requires: [haeufigkeiten]
      - id: haeufigkeit-als-schaetzwert
        # NEW (split from haeufigkeiten). KMK p.22 (relative Haeufigkeiten als Schaetzwerte, wachsender Stichprobenumfang); HE 7.4; BY M8 5; NRW S1 Sto-1 (empirisches Gesetz der grossen Zahlen)
        # bands: 7 / 8 / 7-8 -> 7-8
        iCan: "Ich kann relative Häufigkeiten als Schätzwerte für Wahrscheinlichkeiten deuten und erklären, warum sie bei vielen Versuchen verlässlicher werden."
        gradeBand: "7-8"
        requires: [zufallserscheinungen]
      - id: wahrscheinlichkeitsbegriff
        # BAND CHANGED 5-6 -> 7-8. KMK p.22; HE 7.4 (HE-KC 5/6); BY M8 5; NRW S1 Sto (Begriffsbildung: Wahrscheinlichkeit)
        # bands: 7 / 8 / 7-8 -> 7-8
        iCan: "Ich kann erklären, was Wahrscheinlichkeit bedeutet, und Wahrscheinlichkeiten auf einer Skala von 0 bis 1 einordnen."
        gradeBand: "7-8"
        requires: [haeufigkeit-als-schaetzwert, brueche-begriff]
      - id: zufall-laplace
        # unchanged (used by an app). KMK p.22 (einfache Zufallsexperimente); HE 7.4 (Laplace-Formel); BY M8 5; NRW S1 Sto-4
        # bands: 7 / 8 / 7-8 -> 7-8
        iCan: "Ich kann Wahrscheinlichkeiten mit der Laplace-Formel berechnen: günstige durch mögliche Ergebnisse."
        gradeBand: "7-8"
        requires: [wahrscheinlichkeitsbegriff]
      - id: zufall-gegenereignis
        # unchanged (used by an app). HE 7.4 (Ereignisse, Additionssatz); BY M8 5 (Gegenereignis named); NRW S1 Sto-3 (stochastische Regeln)
        # bands: 7 / 8 / 7-8 -> 7-8
        iCan: "Ich kann die Wahrscheinlichkeit über das Gegenereignis mit 1 minus P(E) berechnen."
        gradeBand: "7-8"
        requires: [zufall-laplace]
      - id: zufall-baumdiagramm
        # unchanged (used by an app; its text still mentions the Vierfeldertafel, which the sources place later: see vierfeldertafel). KMK p.22; HE 7.4, HE-KC 7/8; BY M8 5 (Baum fuer Zaehlen), M10 2; NRW S1 Sto-2 (SILP 8.1)
        # bands: 7 / 8-10 / 7-8 -> 7-8
        iCan: "Ich kann ein mehrstufiges Zufallsexperiment als Baumdiagramm oder Vierfeldertafel darstellen."
        gradeBand: "7-8"
        requires: [zufall-laplace]
      - id: zufall-pfadregel-1
        # unchanged (used by an app; requires extended by the fraction skill it needs). KMK p.22; HE 7.4 (Multiplikationsregel); BY M10 2; NRW S1 Sto-3 (SILP 8.1)
        # bands: 7 / 10 / 7-8 -> 7-8 (BY dissents)
        iCan: "Ich kann die Wahrscheinlichkeit eines Pfades berechnen, indem ich die Zweigwahrscheinlichkeiten multipliziere."
        gradeBand: "7-8"
        requires: [zufall-baumdiagramm, brueche-multiplizieren-dividieren]
      - id: zufall-ohne-zuruecklegen
        # unchanged (used by an app). KMK p.22; HE 7.4; BY M10 2; NRW S1 Sto-2, Sto-3
        # bands: 7 / 10 / 7-8 -> 7-8 (BY dissents)
        iCan: "Ich kann Ziehen mit und ohne Zurücklegen unterscheiden und die Zweigwahrscheinlichkeiten anpassen."
        gradeBand: "7-8"
        requires: [zufall-pfadregel-1]
      - id: zufall-pfadregel-2
        # unchanged (used by an app; requires extended). KMK p.22; HE 7.4 (Additionssatz); BY M10 2; NRW S1 Sto-3
        # bands: 7 / 10 / 7-8 -> 7-8 (BY dissents)
        iCan: "Ich kann die Wahrscheinlichkeit eines Ereignisses berechnen, indem ich die Wahrscheinlichkeiten seiner Pfade addiere."
        gradeBand: "7-8"
        requires: [zufall-pfadregel-1, brueche-addieren-subtrahieren]
      - id: zufall-ergebnisform
        # unchanged (used by an app). WEAKLY BACKED: no source names it as a unit; touches BY M6 3 (relative Haeufigkeit als Bruch, Dezimalbruch, Prozentsatz) and HE 7.4 (Bruchrechnung wiederholen). Candidate to fold into wahrscheinlichkeitsbegriff later.
        # bands: no source unit; follows prozent-grundbegriffe and laplace -> 7-8
        iCan: "Ich kann Wahrscheinlichkeiten als Bruch, Dezimalzahl, Prozentangabe oder Rechenterm angeben und zwischen den Formen wechseln."
        gradeBand: "7-8"
        requires: [zufall-laplace, prozent-grundbegriffe]
      - id: zufall-ereignis-uebersetzen
        # unchanged (used by an app). Indirectly backed: KMK p.22 (Wahrscheinlichkeiten bei mehrstufigen Experimenten mit Visualisierungen), NRW S1 Sto-2, Sto-3, BY M10 2. The wording "genau einmal / mindestens einmal" is the app's.
        # bands: 7 / 10 / 7-8 -> 7-8
        iCan: "Ich kann Ereignisse wie genau einmal oder mindestens einmal in die passenden Pfade eines Baumdiagramms übersetzen."
        gradeBand: "7-8"
        requires: [zufall-baumdiagramm, zufall-pfadregel-2]
      - id: simulationen
        # KMK p.21 (Simulationen); HE 8.4; BY M10 2 (stochastische Simulationen, Monte-Carlo); NRW S1 Sto-5
        # bands: 8 / 10 / 7-8 -> 7-8 (BY dissents)
        iCan: "Ich kann einfache Zufallsversuche mit Zufallszahlen und Tabellenkalkulation simulieren und auswerten."
        gradeBand: "7-8"
        requires: [haeufigkeit-als-schaetzwert]
      - id: kenngroessen-lage-streumasse
        # NARROWED (Mittelwert split off). KMK p.22 (Median, Spannweite, Quartile); HE 9.7 (Zentralwert, Spannweite, Standardabweichung), HE-KC 9/10; BY M7 4; NRW E Sto-3 (SILP 5.1, 6.8)
        # bands: HE 9 / BY 7 / NRW 5-6 -> no majority; middle taken: 7-8
        iCan: "Ich kann Median, Spannweite und Quartile von Daten bestimmen und deuten."
        gradeBand: "7-8"
        requires: [mittelwert]
      - id: boxplot
        # NEW (split from daten-darstellen). KMK p.22 (Boxplot, MSA); BY M7 4; NRW E Sto (Boxplots, SILP 5.1); HE-KC 7/8 (Boxplot)
        # bands: HE (7-8 KC) / 7 / 5-6 -> 7-8
        iCan: "Ich kann einen Boxplot zeichnen und daraus Aussagen über die Daten ablesen."
        gradeBand: "7-8"
        requires: [kenngroessen-lage-streumasse]
      - id: daten-kritisch-lesen
        # NEW. KMK p.22 (reflektieren Umgang mit und Darstellung von Daten in Medien); BY M6 3 (Darstellungen in Diagrammen beurteilen); NRW E Sto-6, S2 Sto-2 (Manipulation, SILP 9.9)
        # bands: HE - / 6 / 5-6 and 9-10 -> no majority; middle taken: 7-8
        iCan: "Ich kann Diagramme in Medien kritisch lesen und erkennen, wie sie täuschen können."
        gradeBand: "7-8"
        requires: [daten-darstellen]
      - id: stichproben-erhebungen-planen
        # NEW (split from umfragen-erhebungen). KMK p.21 (MSA: Stichprobenauswahl, Erhebungsinstrument); HE 9.7 (Gesamtheit, Stichprobe, Arbeitsweisen der Statistik); NRW S2 Sto-1
        # bands: 9 / - / 9-10 -> 9-10
        iCan: "Ich kann eine statistische Erhebung mit Stichprobe und Erhebungsinstrument planen und beurteilen, wie aussagekräftig sie ist."
        gradeBand: "9-10"
        requires: [umfragen-erhebungen, haeufigkeiten]
      - id: vierfeldertafel
        # NEW. KMK p.22 (Vierfeldertafel, MSA); BY M9 3 (verknuepfte Ereignisse, Vierfeldertafeln); NRW S2 Sto-5; HE-KC 7/8 (Baumdiagramme und Vierfeldertafeln)
        # bands: (HE-KC 7-8) / 9 / 9-10 -> 9-10
        iCan: "Ich kann zwei verknüpfte Ereignisse in einer Vierfeldertafel darstellen und Wahrscheinlichkeiten ablesen."
        gradeBand: "9-10"
        requires: [zufall-laplace, haeufigkeiten]
      - id: bedingte-wahrscheinlichkeit
        # NEW. KMK p.22 (bedingte Wahrscheinlichkeiten erkennen, MSA); NRW S2 (Inhalt: bedingte Wahrscheinlichkeit, stochastische Unabhaengigkeit; SILP 10.6); BY M9 3 (aus Vierfeldertafeln); HE: not named
        # bands: HE - / 9 / 10 -> 9-10
        iCan: "Ich kann bedingte Wahrscheinlichkeiten am Baumdiagramm oder in der Vierfeldertafel erkennen und berechnen."
        gradeBand: "9-10"
        requires: [vierfeldertafel, zufall-pfadregel-2]
