# The basic vocabulary of German as a foreign language (docs/learning-map-contract.md, section 6): which lexicon, which
# levels, and the corrections for children's everyday life. scripts/vocabulary.mjs writes words.yaml from it and the
# lexicon. Licence: CC BY-NC-SA 4.0, as DAFlex (LICENSE.md in this folder).
language: de
source:
  title: "DAFlex with TreeTagger German (STTS) parts of speech (CEFRLex, CENTAL, UCLouvain)"
  # Direct static TSV used to generate words.yaml: https://cental.uclouvain.be/cefrlex/static/resources/de/DAFlex.tsv
  url: https://cental.uclouvain.be/cefrlex/daflex/download/
  licence: CC BY-NC-SA 4.0
  cite:
    - "François, T., Kerres, P., De Meyere, D. & Suñer Muñoz, F. DAFlex: A CEFR-graded lexical resource for German as a foreign language. CENTAL / VALIBEL, UCLouvain. https://cental.uclouvain.be/cefrlex/daflex/ (reference article forthcoming)."
levels: [A1, A2]
# DAFlex has no single level per word, only frequencies and document counts per level (from textbooks and simplified
# readers). A word is placed on the first level at which at least three documents of the corpus use it: at least 1
# document gives A1 5087 and A2 4909 (many single-reader words); at least 2 gives A1 2393 and A2 1703; at least 3 gives
# A1 1680 and A2 1039 (comparable to English ~2400 and French ~1930) while keeping core child vocabulary that at least 4
# would drop (Bleistift, Rucksack, Bäckerei, Ohr, Bauch, Handy). scripts/vocabulary.mjs also leaves out lemmas with a
# digit, an underscore, or no leading letter.
minDocuments: 3
# Corrections for children and young learners in their first years of German (Standard German / Bundesdeutsch). Each
# correction names its reason. DAFlex lowercases the second part of hyphenated nouns (T-shirt, E-mail, S-bahn, U-bahn):
# search in DAFlex's spelling before adding a word.
