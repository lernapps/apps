# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Keine KMK-Bildungsstandards für Sport: Stränge = die Bewegungs- und Inhaltsfelder, die die drei Länder teilen.
# Quellenkürzel in den Kommentaren (genaue Titel, Ausgaben und URLs: .vibe/research-sport.md):
#   HE = Kerncurriculum Hessen Sek I Gymnasium Sport (2011): Kap. 5 Leitideen, Kap. 6 Ende Jg 9/10 (Inhaltsfelder für Jg 7-9),
#        Kap. 7.1 Ende Jg 6. Stimme "5-6" = Kap. 7.1, "7-10" = Kap. 6; "5-10" = für alle Stufen gleich (Kompetenzerwartungen,
#        Leitideen, Inhaltsfelder Wasser und Fahren-Rollen-Gleiten)
#   BY = LehrplanPLUS Bayern Gymnasium, Basissport 5-10 (S5 ... S10), LB1 Gesundheit und Fitness, LB2 Fairness/Kooperation/
#        Selbstkompetenz, LB3 Freizeit und Umwelt, LB4 Sportliche Handlungsfelder 4.1-4.6
#   NW = Kernlehrplan NRW Sek I Gymnasium Sport (2019), 2.4 bis Ende Erprobungsstufe ("5-6"), 2.5 bis Ende Sek I ("7-10");
#        IF a-f = Inhaltsfelder, BF1-BF9 = Bewegungsfelder; SiLP = Beispiel für einen schulinternen Lehrplan (nur Hinweis)
# Stimmen HE / BY / NW. SCHWACH = weniger als zwei Länder nennen den Baustein ausdrücklich (eines nur allgemein oder zur Wahl).
name: { de: Sport, en: Physical education }       # the file name is the subject's id: sport
source:
  title: Bewegungs- und Inhaltsfelder der Länder (keine KMK-Bildungsstandards), Leitquelle Kernlehrplan Sport Gymnasium Sek I NRW (2019), verglichen mit dem Kerncurriculum Hessen und dem LehrplanPLUS Bayern
  url: https://lehrplannavigator.nrw.de/system/files/media/document/file/g9_sp_klp_3426_2019_06_23.pdf
strands:
  - id: fitness
    name: { de: "Den Körper trainieren, die Fitness verbessern", en: "Fitness and training" }
    competencies:
      # HE Kap. 6 Bewegungskompetenz, S. 18 (Kraft, Ausdauer, Schnelligkeit, Beweglichkeit anforderungsgemäß anwenden); gilt laut Kap. 7.1 auch für Ende Jg 6; BY S6 4.1 (koordinative und konditionelle Fähigkeiten verbessern); NW 2.4.1 IF d, S. 22 (motorische Grundfähigkeiten Kraft, Schnelligkeit, Ausdauer, Beweglichkeit benennen)
      # Stimmen 5-10 / 5-6 (Jg 6) / 5-6 -> 5-6 (Mehrheit)
      - id: motorische-grundfaehigkeiten
        iCan: "Ich kann die motorischen Grundfähigkeiten Ausdauer, Kraft, Schnelligkeit und Beweglichkeit unterscheiden und zu jeder ein Beispiel aus dem Sport nennen."
        gradeBand: "5-6"
      # HE Kap. 7.1 Den Körper trainieren, S. 28 (Rhythmisierung, Gleichgewicht, Orientierung im Raum, Reaktion, Differenzierung des Krafteinsatzes); BY S5 4.2, 4.3 (koordinative Fähigkeiten zeigen); NW 2.5.1 IF d, S. 30 (koordinative Anforderungen von Bewegungsaufgaben benennen)
      # Stimmen 5-6 / 5-6 (Jg 5) / 7-10 -> 5-6 (Mehrheit)
      - id: koordinative-faehigkeiten
        iCan: "Ich kann koordinative Fähigkeiten wie Gleichgewicht, Orientierung, Reaktion, Rhythmus und Differenzierung an Beispielen erklären."
        gradeBand: "5-6"
        requires: [motorische-grundfaehigkeiten]
      # HE Kap. 7.1 Den Körper trainieren, S. 28 (koordinative Anforderungen unter Präzisions-, Zeit- und Variabilitätsdruck); BY S6 4.1 (koordinative Fähigkeiten zunehmend systematisch verbessern); NW 2.5.2 BF1, S. 33 (Koordinationstraining unter unterschiedlichen Anforderungssituationen; SiLP Jg 9, UV 1.7)
      # Stimmen 5-6 / 5-6 (Jg 6) / 7-10 -> 5-6 (Mehrheit)
      - id: koordination-trainieren
        iCan: "Ich kann erklären, wie man Koordination gezielt übt: unter Zeitdruck, mit hoher Genauigkeit und unter wechselnden Bedingungen."
        gradeBand: "5-6"
        requires: [koordinative-faehigkeiten]
      # HE Kap. 6 Urteils- und Entscheidungskompetenz, S. 19 (Bewegungs- und Körpererfahrungen reflektieren; nur allgemein); BY S5 LB1 (Atmung und Pulsfrequenz vor, während und nach Belastungen); S6 LB1 (Belastung und Temperaturregulation); NW 2.4.1 IF d, S. 22 (psycho-physische Reaktionen des Körpers beschreiben); IF f, S. 23 (Anstrengung anhand der Reaktionen des Körpers beurteilen)
      # Stimmen 5-10 / 5-6 (Jg 5) / 5-6 -> 5-6 (Mehrheit)
      - id: belastung-und-koerper
        iCan: "Ich kann beschreiben, wie Atmung, Puls, Körpertemperatur und Schwitzen sich vor, während und nach einer Belastung verändern."
        gradeBand: "5-6"
      # SCHWACH (nur BY nennt das Pulsmessen ausdrücklich; NW allgemein; Voraussetzung von belastung-ueber-puls). BY S6 LB1 (messen weitgehend sicher ihren Puls; Pulsschätz- und Pulsvorgabeläufe); NW 2.4.1 IF d, S. 22 (einfache Methoden zur Erfassung körperlicher Leistungsfähigkeit anwenden; allgemein)
      # Stimmen – / 5-6 (Jg 6) / 5-6 -> 5-6 (Mehrheit)
      - id: puls-messen
        iCan: "Ich kann meinen Puls am Handgelenk oder am Hals messen und die Schläge pro Minute ausrechnen."
        gradeBand: "5-6"
        requires: [belastung-und-koerper]
      # HE Kap. 7.1 Laufen, Springen, Werfen, S. 27 (ausdauerndes Laufen in selbst gewähltem Tempo); BY S5 LB1 (Ausdauerleistung im aeroben Bereich); NW 2.4.2 BF1, S. 23 f. (aerobe Ausdauerleistung ohne Unterbrechung)
      # Stimmen 5-6 / 5-6 (Jg 5) / 5-6 -> 5-6 (Mehrheit)
      - id: aerobe-ausdauer
        iCan: "Ich kann erklären, was aerobe Ausdauer ist und woran ich merke, dass ich in einem Tempo laufe, das ich lange durchhalten kann."
        gradeBand: "5-6"
        requires: [belastung-und-koerper]
      # HE Kap. 7.1 LSW, S. 27 (Dauerlauf in selbst gewähltem Tempo über mindestens 15 Minuten); BY S5 LB1 (15-minütige Ausdauerleistung im aeroben Bereich); NW 2.4.2 BF1, S. 24 (z. B. Laufen 15 min)
      # Stimmen 5-6 / 5-6 (Jg 5) / 5-6 -> 5-6 (Mehrheit)
      - id: ausdauer-15-minuten
        iCan: "Ich kann 15 Minuten ohne Pause in einem gleichmäßigen Tempo laufen."
        gradeBand: "5-6"
        requires: [aerobe-ausdauer]
      # HE Kap. 6 LSW, S. 22 (Dauerlauf in gleichmäßigem Tempo über mindestens 30 Minuten); BY S8 LB1 (30-minütige Ausdauerleistung im aeroben Bereich); NW 2.5.2 BF1, S. 33 (z. B. Laufen 30 min)
      # Stimmen 7-10 / 7-8 (Jg 8) / 7-10 -> 7-8 (Mehrheit)
      - id: ausdauer-30-minuten
        iCan: "Ich kann 30 Minuten ohne Pause in einem selbst gewählten, gleichmäßigen Tempo laufen."
        gradeBand: "7-8"
        requires: [ausdauer-15-minuten, dauermethode]
      # HE Kap. 6 LSW, S. 22 (Trainingsmethoden: kontinuierliche Dauermethode); BY S7 LB1 (Wissen über die Dauermethode umsetzen); NW 2.5.1 IF d, S. 30 (grundlegende Methoden zur Verbesserung von Ausdauer und Kraft beschreiben)
      # Stimmen 7-10 / 7-8 (Jg 7) / 7-10 -> 7-8 (Mehrheit)
      - id: dauermethode
        iCan: "Ich kann die Dauermethode beschreiben: lange, gleichmäßige Belastung ohne Pause mit mittlerer Intensität."
        gradeBand: "7-8"
        requires: [aerobe-ausdauer]
      # HE Kap. 6 LSW, S. 22 (Fahrtspiel, Tempowechselmethode); BY S6 4.1 (Dauerläufe, z. B. Fahrtspiel); S7, S9 4.1; NW 2.5.1 IF d, S. 30 (Methoden zur Verbesserung der Ausdauer)
      # Stimmen 7-10 / 5-6 (Jg 6) / 7-10 -> 7-8 (Gleichstand 7-8/9-10: requires entscheidet (früheste Stufe nach den Voraussetzungen))
      - id: fahrtspiel
        iCan: "Ich kann das Fahrtspiel als Trainingsmethode mit Tempowechseln beschreiben und einen Lauf danach gestalten."
        gradeBand: "7-8"
        requires: [dauermethode]
      # BY S8 LB1 (extensives Intervalltraining); S10 4.1, 4.2; NW 2.5.1 IF d, S. 30 (Methoden zur Verbesserung der Ausdauer)
      # Stimmen – / 7-8 (Jg 8) / 7-10 -> 7-8 (Mehrheit)
      - id: intervallmethode
        iCan: "Ich kann die extensive Intervallmethode mit Belastung und lohnender Pause beschreiben."
        gradeBand: "7-8"
        requires: [dauermethode]
      # HE Kap. 6 Den Körper trainieren, S. 24 (gezielte Belastungsdosierung); BY S6 LB1 (Pulskontrolle, Pulsvorgabeläufe); NW 2.5.1 IF d, S. 30 (Belastungsgrößen, u. a. Intensität)
      # Stimmen 7-10 / 5-6 (Jg 6) / 7-10 -> 7-8 (Gleichstand 7-8/9-10: requires entscheidet (früheste Stufe nach den Voraussetzungen))
      - id: belastung-ueber-puls
        iCan: "Ich kann die Belastung in einem Ausdauertraining über meinen Puls steuern."
        gradeBand: "7-8"
        requires: [puls-messen, aerobe-ausdauer]
      # HE Kap. 6 Den Körper trainieren, S. 24 (Bereich Ausdauer: Wissen über Gesundheit); BY S7 LB1 (gesundheitlicher Wert aeroben Ausdauertrainings; Herz-Kreislauf-System, Immunsystem, Psyche); S9 LB1; NW 2.5.1 IF f, S. 32 (Auswirkungen gezielten Sporttreibens auf die Gesundheit beschreiben)
      # Stimmen 7-10 / 7-8 (Jg 7) / 7-10 -> 7-8 (Mehrheit)
      - id: ausdauer-und-gesundheit
        iCan: "Ich kann erklären, wie Ausdauertraining Herz, Kreislauf, Immunsystem und Wohlbefinden stärkt."
        gradeBand: "7-8"
        requires: [aerobe-ausdauer]
      # HE Kap. 6 Den Körper trainieren, S. 24 (Kraft: Kompensation und Vermeidung gesundheitlicher Risiken); BY S5 LB1 (Bedeutung der Rumpfmuskulatur für die Wirbelsäule und eine gute Haltung); NW 2.4.2 BF1, S. 23 (Muskel- und Körperspannung aufbauen und nutzen)
      # Stimmen 7-10 / 5-6 (Jg 5) / 5-6 -> 5-6 (Mehrheit)
      - id: rumpfmuskulatur
        iCan: "Ich kann erklären, warum eine kräftige Bauch- und Rückenmuskulatur die Wirbelsäule schützt und für eine gute Haltung wichtig ist."
        gradeBand: "5-6"
      # HE Kap. 6 Den Körper trainieren, S. 24 (Übungsauswahl und Art der Übungsausführung); BY S5 LB1 (Kräftigung der Bauch- und Rückenmuskulatur); S6 LB1 (je zwei funktionelle Übungen); S8 LB1 (richtige Ausführung und Atmung); NW 2.5.2 BF1, S. 33 (gesund-funktionales Muskeltraining sachgemäß durchführen)
      # Stimmen 7-10 / 5-6 (Jg 5) / 7-10 -> 7-8 (Gleichstand 7-8/9-10: requires entscheidet (früheste Stufe nach den Voraussetzungen))
      - id: kraeftigungsuebungen
        iCan: "Ich kann Kräftigungsübungen für Bauch und Rücken richtig ausführen und dabei auf Haltung und Atmung achten."
        gradeBand: "7-8"
        requires: [rumpfmuskulatur]
      # HE Kap. 6 Den Körper trainieren, S. 24 (Kraft: Trainingsmethoden, Bestimmung der angemessenen Trainingslast); BY S8 LB1 (gesundheitsorientierte Kräftigung, z. B. Zirkeltraining); NW 2.5.2 BF1, S. 33 (Muskeltraining, z. B. als Zirkeltraining; SiLP Jg 9, UV 1.6)
      # Stimmen 7-10 / 7-8 (Jg 8) / 7-10 -> 7-8 (Mehrheit)
      - id: zirkeltraining
        iCan: "Ich kann ein Zirkeltraining mit Stationen für verschiedene Muskelgruppen aufbauen und Belastungs- und Pausenzeiten festlegen."
        gradeBand: "7-8"
        requires: [kraeftigungsuebungen]
      # HE Kap. 6 Bewegungskompetenz, S. 18 (Beweglichkeit anforderungsgemäß anwenden); BY S5 LB1 (einfache Dehn- und Mobilisationsübungen); S8 LB1 (richtige Ausführung von Dehnübungen); NW 2.4.1 IF d, S. 22 (Beweglichkeit als motorische Grundfähigkeit; nur benennen)
      # Stimmen 5-10 / 5-6 (Jg 5) / 5-6 -> 5-6 (Mehrheit)
      - id: dehnen-und-mobilisieren
        iCan: "Ich kann Dehn- und Mobilisationsübungen für die wichtigsten Muskelgruppen richtig ausführen und erklären, wozu sie dienen."
        gradeBand: "5-6"
        requires: [motorische-grundfaehigkeiten]
      # HE Kap. 6 Den Körper trainieren, S. 24 (Belastungsdosierung, angemessene Trainingslast); BY S10 LB1 (Wahl der Belastungsparameter); NW 2.5.1 IF d, S. 30 (Belastungsgrößen Intensität, Umfang, Dichte, Dauer erläutern)
      # Stimmen 7-10 / 9-10 (Jg 10) / 7-10 -> 9-10 (Mehrheit)
      - id: belastungsgroessen
        iCan: "Ich kann die Belastungsgrößen Intensität, Umfang, Dauer und Dichte erklären."
        gradeBand: "9-10"
        requires: [intervallmethode]
      # HE Kap. 6 Den Körper trainieren, S. 24 (Trainingsmethoden, Trainingswirkungen); Urteils- und Entscheidungskompetenz, S. 19 (Wirkung von Trainieren und Üben); BY S9 LB1 (Trainingslehre: mittel- und langfristige Trainingsplanung, Regeneration); NW 2.5.1 IF d, S. 30 (grundlegende Methoden und Prinzipien beschreiben)
      # Stimmen 7-10 / 9-10 (Jg 9) / 7-10 -> 9-10 (Mehrheit)
      - id: trainingsprinzipien
        iCan: "Ich kann erklären, warum Training regelmäßig sein muss, die Belastung allmählich steigen soll und Erholung dazugehört."
        gradeBand: "9-10"
        requires: [belastungsgroessen]
      # HE Kap. 6 Den Körper trainieren, S. 24 (Trainingswirkungen, Auswirkungen auf die körperliche Entwicklung, Vermeidung gesundheitlicher Risiken); BY S10 LB1 (gesundheitsorientiertes Krafttraining: Altersgemäßheit, Trainierbarkeit, positive Auswirkungen); NW 2.5.1 IF f, S. 32 (Auswirkungen gezielten Sporttreibens auf die Gesundheit)
      # Stimmen 7-10 / 9-10 (Jg 10) / 7-10 -> 9-10 (Mehrheit)
      - id: krafttraining-und-gesundheit
        iCan: "Ich kann erklären, wie gesundheitsorientiertes Krafttraining wirkt und worauf Jugendliche dabei achten müssen."
        gradeBand: "9-10"
        requires: [zirkeltraining, trainingsprinzipien]
      # HE Kap. 6 Urteils- und Entscheidungskompetenz, S. 19 (Rückschlüsse für die eigene Leistungssteigerung ziehen; persönliche Ziele setzen); BY S9 LB1 (mittel- und langfristige Trainingsplanung); S10 4.1 (einfache Übungseinheiten selbständig organisieren); NW 2.5.1 IF d, S. 30 (individualisierten Trainingsplan aus vorgegebenen Einzelelementen zusammenstellen)
      # Stimmen 5-10 / 9-10 (Jg 9) / 7-10 -> 9-10 (Mehrheit)
      - id: trainingsplan
        iCan: "Ich kann aus vorgegebenen Übungen einen eigenen Trainingsplan zusammenstellen, um meine Ausdauer oder Kraft zu verbessern."
        gradeBand: "9-10"
        requires: [trainingsprinzipien]
  - id: gesundheit
    name: { de: "Gesundheit, Sicherheit und Wagnis", en: "Health, safety and risk" }
    competencies:
      # HE Kap. 6 Den Körper trainieren, S. 24 (funktionelles Aufwärmen); BY S5 LB1 (spielerische Formen des Aufwärmens); S6 LB1 (Varianten des Aufwärmens); NW 2.4.1 IF f, S. 23 (Merkmale einer sachgerechten Vorbereitung, u. a. allgemeines Aufwärmen); 2.4.2 BF1, S. 23
      # Stimmen 7-10 / 5-6 (Jg 5) / 5-6 -> 5-6 (Mehrheit)
      - id: aufwaermen-warum
        iCan: "Ich kann erklären, warum ich mich vor dem Sport aufwärme und was dabei in meinem Körper passiert."
        gradeBand: "5-6"
        requires: [belastung-und-koerper]
      # HE Kap. 6 Den Körper trainieren, S. 24 (funktionelles Aufwärmen); BY S8 LB1 (gestalten weitgehend selbständig ein allgemeines Aufwärmprogramm); NW 2.4.2 BF1, S. 23 (allgemeines und spezielles Aufwärmen; SiLP Jg 6, UV 1.3)
      # Stimmen 7-10 / 7-8 (Jg 8) / 5-6 -> 7-8 (Mehrheit)
      - id: aufwaermprogramm
        iCan: "Ich kann ein allgemeines Aufwärmprogramm aus lockerem Einlaufen, Mobilisieren und steigernden Übungen zusammenstellen."
        gradeBand: "7-8"
        requires: [aufwaermen-warum]
      # HE Kap. 6 Den Körper trainieren, S. 24 (funktionelles Aufwärmen); BY S9 LB1 (gestalten selbständig ein sportartspezifisches Aufwärmprogramm); NW 2.5.2 BF1, S. 33 (allgemein und sportartspezifisch aufwärmen); 2.5.1 IF f, S. 32 (Prinzipien der Vorbereitung erläutern)
      # Stimmen 7-10 / 9-10 (Jg 9) / 7-10 -> 9-10 (Mehrheit)
      - id: sportartspezifisch-aufwaermen
        iCan: "Ich kann ein Aufwärmen planen, das auf eine bestimmte Sportart vorbereitet."
        gradeBand: "9-10"
        requires: [aufwaermprogramm]
      # HE Kap. 6 Urteils- und Entscheidungskompetenz, S. 19 (Zusammenhang von sportlichem Handeln, Körperhygiene und Ernährung); BY S5 LB1 (Merkmale funktioneller Sportkleidung, Körperpflege nach dem Sport); NW 2.4.1 IF f, S. 23 (Merkmale einer sachgerechten Vorbereitung, u. a. Kleidung)
      # Stimmen 5-10 / 5-6 (Jg 5) / 5-6 -> 5-6 (Mehrheit)
      - id: sportkleidung-und-hygiene
        iCan: "Ich kann passende Sportkleidung wählen und erklären, warum ich Schmuck ablege und mich nach dem Sport wasche."
        gradeBand: "5-6"
      # HE Kap. 7.1 Bewegen an und mit Geräten, S. 26 (sach-, situations- und bewegungsgerechte Nutzung der Geräte); BY S5 LB1 (Unfallprophylaxe, sicherer Umgang mit Groß- und Kleingeräten); S5 LB2 (Signale, Handzeichen, feste Organisationsformen); NW 2.4.1 IF f, S. 23 (Gefahrenmomente, Organisations- und Sicherheitsvereinbarungen benennen)
      # Stimmen 5-6 / 5-6 (Jg 5) / 5-6 -> 5-6 (Mehrheit)
      - id: sicher-in-der-sporthalle
        iCan: "Ich kann Regeln für sicheres Verhalten in der Sporthalle nennen, zum Beispiel beim Umgang mit Geräten und bei Signalen der Lehrkraft."
        gradeBand: "5-6"
      # HE Kap. 7.1 Bewegen an und mit Geräten, S. 26 (fachgerechter Auf- und Abbau der Geräte einschließlich der Absicherung); BY S5 LB3, 4.4 (Auf- und Abbau von Geräten in der Gruppe); S6 LB1 (Aufbau- und Stationspläne); NW 2.4.1 IF e, S. 22 f. (Spielflächen und -geräte gemeinsam auf- und abbauen)
      # Stimmen 5-6 / 5-6 (Jg 5) / 5-6 -> 5-6 (Mehrheit)
      - id: geraete-auf-und-abbauen
        iCan: "Ich kann Geräte und Matten nach einem Aufbauplan gemeinsam mit anderen sicher auf- und abbauen."
        gradeBand: "5-6"
        requires: [sicher-in-der-sporthalle]
      # HE Kap. 6 Bewegen im Wasser, S. 23 (Kenntnisse über eine erste Hilfe; Erläuterung gilt auch für Jg 5/6); BY S9 LB1 (Sofortmaßnahmen bei typischen Sportverletzungen); NW 2.5.1 IF f, S. 32 (Unfall- und Verletzungsprophylaxe; Erste Hilfe nicht ausdrücklich)
      # Stimmen 5-10 / 9-10 (Jg 9) / 7-10 -> 9-10 (Mehrheit)
      - id: erste-hilfe-sportverletzung
        iCan: "Ich kann bei typischen Sportverletzungen wie Prellung, Zerrung oder Verstauchung Erste Hilfe nach der PECH-Regel leisten."
        gradeBand: "9-10"
        requires: [sicher-in-der-sporthalle]
      # HE Kap. 6 Urteils- und Entscheidungskompetenz, S. 19 (Ernährung, Rückschlüsse für eine gesunde Lebensweise); BY S5 LB1 (Aspekte gesunder Ernährung, z. B. Getränke, Zucker, Vitamine)
      # Stimmen 5-10 / 5-6 (Jg 5) / – -> 5-6 (Mehrheit)
      - id: gesunde-ernaehrung
        iCan: "Ich kann erklären, was zu einer gesunden Ernährung gehört, zum Beispiel genug Wasser, wenig Zucker und viel Obst und Gemüse."
        gradeBand: "5-6"
      # HE Kap. 6 Urteils- und Entscheidungskompetenz, S. 19 (Zusammenhang von sportlichem Handeln und Ernährung); BY S7 LB1 (gesunde Ernährung im Zusammenhang mit sportlicher Betätigung, Flüssigkeitshaushalt, Nährstoffe)
      # Stimmen 5-10 / 7-8 (Jg 7) / – -> 7-8 (Mehrheit)
      - id: ernaehrung-und-sport
        iCan: "Ich kann erklären, was ich vor, während und nach dem Sport essen und trinken sollte und warum Flüssigkeit wichtig ist."
        gradeBand: "7-8"
        requires: [gesunde-ernaehrung]
      # HE Kap. 5 Leitidee Gesundheit, S. 15 (Sporttreiben in den Alltag integrieren; Folgen von Bewegungsmangel); BY S10 LB1 (regelmäßige sportliche Aktivitäten und Wohlbefinden); S10 LB3 (gesundheitsfördernde Freizeitgestaltung); S9 LB3; NW 2.5.1 IF f, S. 32 (Muster des eigenen Bewegungsverhaltens im Alltag erfassen und analysieren)
      # Stimmen 5-10 / 9-10 (Jg 10) / 7-10 -> 9-10 (Mehrheit)
      - id: bewegungsmangel
        iCan: "Ich kann erklären, welche Folgen Bewegungsmangel hat und wie ich mehr Bewegung in meinen Alltag bringe."
        gradeBand: "9-10"
        requires: [ausdauer-und-gesundheit]
      # HE Kap. 5 Leitidee Gesundheit, S. 15 (Entspannungsmethoden); Leitidee Körperwahrnehmung, S. 14; BY S5 LB1 (Wechsel zwischen Anspannung und Entspannung bewusst wahrnehmen; einfache Entspannungsformen); S6 LB1; NW 2.4.1 IF a, S. 20 (Körperempfindungen und Körperwahrnehmungen beschreiben)
      # Stimmen 5-10 / 5-6 (Jg 5) / 5-6 -> 5-6 (Mehrheit)
      - id: anspannung-entspannung
        iCan: "Ich kann den Unterschied zwischen Anspannung und Entspannung in meinem Körper wahrnehmen und beschreiben."
        gradeBand: "5-6"
      # HE Kap. 5 Leitidee Gesundheit, S. 15 (Entspannungsmethoden); BY S10 LB1 (Entspannungsmethoden gezielt durchführen, z. B. Progressive Muskelrelaxation, Autogenes Training); NW Kap. 2.2 IF f, S. 17 (Methoden zur Stressreduktion)
      # Stimmen 5-10 / 9-10 (Jg 10) / 5-10 -> 9-10 (Mehrheit)
      - id: entspannungsmethode
        iCan: "Ich kann eine Entspannungsmethode wie die Progressive Muskelentspannung durchführen und erklären, wie sie wirkt."
        gradeBand: "9-10"
        requires: [anspannung-entspannung]
      # BY S10 LB1 (Trends im Sport beurteilen); S7 LB1 (kritisch mit der Gewichtsregulation auseinandersetzen); NW 2.5.1 IF f, S. 32 (gesundheitliche Auswirkungen unter Berücksichtigung medial vermittelter Fitnesstrends und Körperideale beurteilen)
      # Stimmen – / 9-10 (Jg 10) / 7-10 -> 9-10 (Mehrheit)
      - id: koerperbilder-und-trends
        iCan: "Ich kann Fitnesstrends und Körperideale aus Medien und Werbung kritisch beurteilen."
        gradeBand: "9-10"
        requires: [bewegungsmangel]
      # HE Kap. 5 Leitidee Gesundheit, S. 15 (Gefahren des Dopings); BY S10 LB1 (Sport und Doping: Formen, Folgen, gesellschaftspolitische Hintergründe)
