# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Keine KMK-Bildungsstandards Informatik (Stand 11/2026). Gemeinsamer Bezug für die Stränge:
# GI = Gesellschaft für Informatik, Bildungsstandards Informatik für die Sekundarstufe I (Januar 2025), Inhaltsbereiche
#      ID, AL, SA, IS, IMG mit Nummer und Stufe (5-6 oder 7-10). Kein Ländertext; zählt nicht als Stimme.
# HE = Kerncurriculum Informatik für den Wahlunterricht, Sek I gymnasialer Bildungsgang, Hessen (August 2021): ab Jg 7,
#      Erwartungen am Ende 9/10, Stimme "7-10" (zählt für 7-8 und 9-10). I1-I5 = Inhaltsbereiche, TF = Themenfeld.
# BY = LehrplanPLUS Bayern Gymnasium: NT6 und NT7 (Natur und Technik, Schwerpunkt Informatik, alle Schüler),
#      Inf9 und Inf10 (Informatik im NTG). LB = Lernbereich.
# NW = Kernlehrplan NRW: "5/6" = Informatik Klasse 5 und 6 (Pflicht, Heft 5028, 2021), Stimme 5-6;
#      "WP" = Wahlpflichtfach Informatik Gymnasium (2023, G9 ab Klasse 9), Stimme 9-10.
# Stimmen: HE / BY / NW. Gleichstand: früheste Stufe, die die requires erlauben. "schwach" = nur ein Land (mit GI)
# oder nur als Voraussetzung aufgenommen. Titel, Ausgaben und URLs: .vibe/research-informatik.md.
name: { de: Informatik, en: Computer science }      # the file name is the subject's id: informatik
source:
  title: "Gesellschaft für Informatik: Bildungsstandards Informatik für die Sekundarstufe I, Empfehlungen (Januar 2025), doi:10.18420/rec2025_052"
  url: https://www.mnu.de/images/fachbereiche/Informatik/Bildungsstandards_Sek_I_2025__pdf-A_.pdf
strands:
  - id: daten
    name: { de: "Information und Daten", en: "Information and data" }
    competencies:
      # GI ID-3 (5-6); HE I3: unterscheiden die Begriffe Information und Daten; NW 5/6 IuD: erläutern den Zusammenhang und die Bedeutung von Information und Daten. Stimmen 7-10 / – / 5-6 → 5-6 (Gleichstand 5-6/7-8/9-10 → früheste nach requires)
      - id: information-und-daten
        iCan: "Ich kann Information und Daten unterscheiden und erklären, dass Daten erst durch ihre Deutung zu Information werden."
        gradeBand: "5-6"
      # GI ID-3 (5-6); HE I3: interpretieren Daten in Bezug auf die dargestellte Information; BY NT6 2.1: interpretieren ... Darstellungen von Informationen; NW 5/6 IuD: interpretieren ausgewählte Daten als Information im gegebenen Kontext. Stimmen 7-10 / 5-6 / 5-6 → 5-6 (Mehrheit)
      - id: daten-interpretieren
        iCan: "Ich kann Daten in ihrem Zusammenhang deuten, zum Beispiel erkennen, ob die Zahl 21 ein Alter, eine Temperatur oder eine Uhrzeit ist."
        gradeBand: "5-6"
        requires: [information-und-daten]
      # GI ID-2 (5-6); HE I3: unterschiedliche Darstellungsformen von Daten; BY NT6 2.1: Darstellungsformen von Information; vergleichen und bewerten Darstellungen; NW 5/6 IuD: stellen eine Information in geeigneter Form als Daten formalsprachlich oder graphisch dar. Stimmen 7-10 / 5-6 / 5-6 → 5-6 (Mehrheit)
      - id: darstellungsformen-von-information
        iCan: "Ich kann eine Information in verschiedenen Formen darstellen, zum Beispiel als Text, Tabelle, Bild oder Diagramm, und eine passende Form wählen."
        gradeBand: "5-6"
        requires: [information-und-daten]
      # GI ID-1 (5-6); HE I3: führen Codierungen durch; NW 5/6 IuD: nennen Beispiele für die Codierung von Daten aus ihrer Erfahrungswelt. Stimmen 7-10 / – / 5-6 → 5-6 (Gleichstand 5-6/7-8/9-10 → früheste nach requires)
      - id: codierung-im-alltag
        iCan: "Ich kann Beispiele für Codierungen aus dem Alltag nennen und eine Nachricht mit einer vorgegebenen Codierung codieren und decodieren."
        gradeBand: "5-6"
        requires: [information-und-daten]
      # GI ID-1 (5-6): Codierungen für Zahlen; HE TF Hardware: Stellenwertsystem, Konvertierung von Dezimal- und Binärzahlen; NW 5/6 IuD: codieren und decodieren Daten unter Verwendung des Binärsystems. Stimmen 7-10 / – / 5-6 → 5-6 (Gleichstand 5-6/7-8/9-10 → früheste nach requires)
      - id: binaersystem
        iCan: "Ich kann erklären, wie das Binärsystem als Stellenwertsystem mit den Ziffern 0 und 1 funktioniert, und eine Binärzahl in eine Dezimalzahl umrechnen."
        gradeBand: "5-6"
        requires: [codierung-im-alltag]
      # GI ID-1 (5-6); HE TF Hardware: Konvertierung, Horner-Schema; NW 5/6 IuD: codieren Daten unter Verwendung des Binärsystems. Stimmen 7-10 / – / 5-6 → 5-6 (Gleichstand 5-6/7-8/9-10 → früheste nach requires)
      - id: dezimal-in-binaer
        iCan: "Ich kann eine Dezimalzahl in eine Binärzahl umrechnen, zum Beispiel durch fortgesetztes Teilen durch 2."
        gradeBand: "5-6"
        requires: [binaersystem]
      # SCHWACH (nur NW; aufgenommen als direkte Voraussetzung von zeichencodierung). GI –; NW 5/6 IuD: erläutern Einheiten von Datenmengen; vergleichen Datenmengen hinsichtlich ihrer Größe. Stimmen – / – / 5-6 → 5-6 (einzige Stimme)
      - id: bit-und-byte
        iCan: "Ich kann die Einheiten Bit, Byte, Kilobyte, Megabyte und Gigabyte erklären und Datenmengen damit vergleichen."
        gradeBand: "5-6"
        requires: [binaersystem]
      # SCHWACH (nur HE und GI). GI ID-1 (5-6): Codierungen für Texte; HE TF Hardware: Darstellung von Zeichen: ASCII-Code, Ausblick auf Unicode. Stimmen 7-10 / – / – → 7-8 (Gleichstand 7-8/9-10 → früheste nach requires)
      - id: zeichencodierung
        iCan: "Ich kann erklären, wie Buchstaben und Zeichen mit einem Code wie ASCII oder Unicode als Binärzahlen gespeichert werden."
        gradeBand: "7-8"
        requires: [bit-und-byte, binaersystem]
      # GI ID-1 (5-6): Codierungen für Grafiken; BY NT6 2.1: Vektor- und Pixelgrafik als unterschiedliche Grafikarten; NW WP IuD: beschreiben das Codierungsprinzip von Pixel- und Vektorgrafiken. Stimmen – / 5-6 / 9-10 → 5-6 (Gleichstand 5-6/9-10 → früheste nach requires)
      - id: pixelgrafik
        iCan: "Ich kann erklären, wie ein Bild als Raster aus Pixeln mit Farbwerten gespeichert wird."
        gradeBand: "5-6"
        requires: [codierung-im-alltag]
      # GI ID-1 (5-6); BY NT6 2.1: beurteilen, ob sich eine Vektor- oder Pixelgrafik besser eignet; NW WP IuD: Codierungsprinzip von Pixel- und Vektorgrafiken. Stimmen – / 5-6 / 9-10 → 5-6 (Gleichstand 5-6/9-10 → früheste nach requires)
      - id: pixel-und-vektorgrafik
        iCan: "Ich kann Pixel- und Vektorgrafiken unterscheiden und begründen, welche Grafikart für einen Zweck besser passt."
        gradeBand: "5-6"
        requires: [pixelgrafik]
      # SCHWACH (nur HE und GI). GI ID-4 (7-10); HE TF Hardware: analoge und digitale Darstellung von Information. Stimmen 7-10 / – / – → 7-8 (Gleichstand 7-8/9-10 → früheste nach requires)
      - id: analog-und-digital
        iCan: "Ich kann den Unterschied zwischen analoger und digitaler Darstellung erklären und Beispiele für das Digitalisieren nennen."
        gradeBand: "7-8"
        requires: [binaersystem]
      # GI ID-7 (7-10); HE I3: verwenden die Datentypen Text, Zahl und Wahrheitswert; BY Inf9 LB3: Datentypen ganze Zahlen, Gleitkommazahlen, Wahrheitswerte, Zeichen, Zeichenketten; NW WP IuD: wählen geeignete Datentypen im Kontext eines Anwendungsbeispiels aus. Stimmen 7-10 / 9-10 / 9-10 → 9-10 (Mehrheit)
      - id: datentypen
        iCan: "Ich kann die Datentypen ganze Zahl, Kommazahl, Text und Wahrheitswert unterscheiden und für eine Angabe den passenden Datentyp wählen."
        gradeBand: "9-10"
        requires: [daten-interpretieren]
      # GI ID-7 (7-10): zugehörige Operationen; HE TF Programmierung: Operationen auf Daten; BY Inf9 LB1: Formel, Funktion (Tabellenkalkulation); NW WP IuD: verarbeiten Daten ... unter Berücksichtigung logischer und arithmetischer Operationen. Stimmen 7-10 / 9-10 / 9-10 → 9-10 (Mehrheit)
      - id: rechnen-und-vergleichen
        iCan: "Ich kann mit Daten in einem Programm rechnen und Werte vergleichen, zum Beispiel mit +, -, *, /, < und =."
        gradeBand: "9-10"
        requires: [datentypen]
      # GI ID-7 (7-10); HE TF Programmierung: Datentyp Wahrheitswert, Operationen auf Daten; BY Inf9 LB2: Verknüpfung von Bedingungen (SQL); NW WP IuD: logische Operationen; WP IS: logische Schaltungen. Stimmen 7-10 / 9-10 / 9-10 → 9-10 (Mehrheit)
      - id: logische-verknuepfungen
        iCan: "Ich kann Bedingungen mit und, oder und nicht verknüpfen und den Wahrheitswert des Ergebnisses bestimmen."
        gradeBand: "9-10"
        requires: [rechnen-und-vergleichen]
      # SCHWACH (nur BY und GI). GI ID-7 (7-10): strukturierte Datentypen; BY Inf10 LB2: eindimensional indizierte Datenstruktur (Array/Feld). Stimmen – / 9-10 / – → 9-10 (einzige Stimme)
      - id: feld-array
        iCan: "Ich kann gleichartige Daten in einem Feld (Array) speichern und über den Index auf einzelne Elemente zugreifen."
        gradeBand: "9-10"
        requires: [datentypen, variable]
      # GI –; HE I3: wenden Bäume als Strukturierungsprinzip an (Hypertexte, Dateisysteme, DNS); BY NT6 2.3: stellen baumartige Informationsstrukturen mithilfe von Baumdiagrammen dar. Stimmen 7-10 / 5-6 / – → 5-6 (Gleichstand 5-6/7-8/9-10 → früheste nach requires)
      - id: baum
        iCan: "Ich kann hierarchische Informationen als Baum mit Wurzel, Knoten, Kanten und Blättern darstellen."
        gradeBand: "5-6"
        requires: [darstellungsformen-von-information]
      # GI –; HE TF Internet: Struktur von Hypertexten und deren grafische Darstellung; BY NT7 2.1: Darstellung der Objektstruktur einer Hypertextstruktur: Graph aus Knoten und Kanten. Stimmen 7-10 / 7-8 / – → 7-8 (Mehrheit)
      - id: graph
        iCan: "Ich kann vernetzte Informationen, zum Beispiel verlinkte Webseiten, als Graph aus Knoten und Kanten darstellen."
        gradeBand: "7-8"
        requires: [baum]
      # GI ID-6 (7-10); HE TF Internet: Struktur von Hypertexten; stellen Hypertextstrukturen grafisch dar; BY NT7 2.1: modellieren Hypertextstrukturen; Erstellung mit WYSIWYG-Editor. Stimmen 7-10 / 7-8 / – → 7-8 (Mehrheit)
      - id: hypertext
        iCan: "Ich kann den Aufbau eines Hypertexts aus Seiten und Verweisen beschreiben und einen einfachen Hypertext erstellen."
        gradeBand: "7-8"
        requires: [graph]
      # SCHWACH (nur BY und GI). GI ID-9 (7-10): Datenflüsse mit Tabellenkalkulationssystemen; BY Inf9 LB1: Tabellenblatt, Zelle, Formel, Zellbezug. Stimmen – / 9-10 / – → 9-10 (einzige Stimme)
      - id: tabellenkalkulation-formeln
        iCan: "Ich kann in einer Tabellenkalkulation Formeln mit Zellbezügen schreiben, damit Ergebnisse automatisch neu berechnet werden."
        gradeBand: "9-10"
        requires: [rechnen-und-vergleichen]
      # SCHWACH (nur BY und GI). GI ID-9 (7-10); BY Inf9 LB1: Zellbezug (relative und absolute Adressierung). Stimmen – / 9-10 / – → 9-10 (einzige Stimme)
      - id: relative-und-absolute-bezuege
        iCan: "Ich kann relative und absolute Zellbezüge unterscheiden und beim Kopieren einer Formel richtig einsetzen."
        gradeBand: "9-10"
        requires: [tabellenkalkulation-formeln]
      # SCHWACH (nur BY und GI). GI ID-9 (7-10): modellieren Datenflüsse; BY Inf9 LB1: Datenflussdiagramm: Funktion, Datenfluss, Ein- und Ausgabe. Stimmen – / 9-10 / – → 9-10 (einzige Stimme)
      - id: datenflussdiagramm
        iCan: "Ich kann darstellen, wie Daten durch Funktionen fließen, und dazu ein Datenflussdiagramm zeichnen."
        gradeBand: "9-10"
        requires: [tabellenkalkulation-formeln]
      # SCHWACH (nur BY und GI). GI ID-9 (7-10); BY Inf9 LB1: vordefinierte Funktionen (u. a. bedingte Funktion), Verkettung von Funktionen. Stimmen – / 9-10 / – → 9-10 (einzige Stimme)
      - id: funktionen-verketten
        iCan: "Ich kann vordefinierte Funktionen einer Tabellenkalkulation, auch die WENN-Funktion, nutzen und mehrere Funktionen verketten."
        gradeBand: "9-10"
        requires: [datenflussdiagramm, logische-verknuepfungen]
      # GI ID-10 (7-10); HE TF Datenbanken: Datenbanken im Alltag; Datenbank versus Tabelle; BY Inf9 LB2: analysieren Datenbestände einfacher Beispiele aus der Praxis. Stimmen 7-10 / 9-10 / – → 9-10 (Mehrheit)
      - id: datenbanken-im-alltag
        iCan: "Ich kann Beispiele nennen, wo im Alltag Datenbanken große Datenbestände verwalten, und erklären, wozu man sie braucht."
        gradeBand: "9-10"
        requires: [darstellungsformen-von-information]
      # GI ID-10 (7-10): modellieren Datenbanktabellen; HE TF Datenbanken: Entity-Relationship-Diagramm: Entity, Attribute; BY Inf9 LB2: objektorientiertes Datenmodell: Objekt, Klasse, Attribut. Stimmen 7-10 / 9-10 / – → 9-10 (Mehrheit)
      - id: datenmodell
        iCan: "Ich kann einen Ausschnitt der Wirklichkeit mit Objekttypen (Entitäten oder Klassen) und ihren Attributen modellieren und als Diagramm darstellen."
        gradeBand: "9-10"
        requires: [datenbanken-im-alltag]
      # GI ID-10 (7-10); HE TF Datenbanken: Struktur einer Tabelle: Datenfelder mit Datentypen, Datensatz; BY Inf9 LB2: Tabellenschema, Datentyp, Datensatz. Stimmen 7-10 / 9-10 / – → 9-10 (Mehrheit)
      - id: tabellenschema
        iCan: "Ich kann ein Datenmodell in ein Tabellenschema mit Datenfeldern und Datentypen überführen und Datensatz und Datenfeld unterscheiden."
        gradeBand: "9-10"
        requires: [datenmodell, datentypen]
      # GI ID-10 (7-10); HE TF Datenbanken: ER-Diagramm: Schlüssel; BY Inf9 LB2: Primärschlüssel. Stimmen 7-10 / 9-10 / – → 9-10 (Mehrheit)
      - id: primaerschluessel
        iCan: "Ich kann erklären, wozu ein Primärschlüssel dient, und für eine Tabelle einen geeigneten Schlüssel wählen."
        gradeBand: "9-10"
        requires: [tabellenschema]
      # GI ID-10 (7-10); HE TF Datenbanken: Implementierung einer Datenbank; Bearbeitung von Datensätzen; BY Inf9 LB2: setzen Tabellenschemata in einem Datenbanksystem um. Stimmen 7-10 / 9-10 / – → 9-10 (Mehrheit)
      - id: datenbank-anlegen
        iCan: "Ich kann eine Datenbanktabelle in einem Datenbanksystem anlegen und Datensätze eingeben, ändern und löschen."
        gradeBand: "9-10"
        requires: [primaerschluessel]
      # GI ID-10 (7-10); HE TF Datenbanken: einfache Abfragen mit Selektion und Projektion; BY Inf9 LB2: SQL: select, from, where; Verknüpfung von Bedingungen. Stimmen 7-10 / 9-10 / – → 9-10 (Mehrheit)
      - id: sql-abfrage
        iCan: "Ich kann mit SQL (SELECT, FROM, WHERE) gezielt Spalten und Datensätze aus einer Tabelle abfragen."
        gradeBand: "9-10"
        requires: [datenbank-anlegen, logische-verknuepfungen]
      # GI ID-10 (7-10); HE TF Datenbanken: ER-Diagramm: Beziehung; Datenbank mit mehreren Tabellen; BY Inf10 LB1: Beziehung, Kardinalität, Primär- und Fremdschlüssel. Stimmen 7-10 / 9-10 / – → 9-10 (Mehrheit)
      - id: beziehungen-und-fremdschluessel
        iCan: "Ich kann Beziehungen zwischen Objekttypen modellieren und sie in verknüpften Tabellen mit Fremdschlüsseln umsetzen."
        gradeBand: "9-10"
        requires: [primaerschluessel]
      # GI ID-10 (7-10); HE TF Datenbanken: erkennen Redundanz und Inkonsistenz ... Aufteilung auf verknüpfte Tabellen; BY Inf10 LB1: Redundanz und Konsistenz von Datenbeständen, Anomalien. Stimmen 7-10 / 9-10 / – → 9-10 (Mehrheit)
      - id: redundanz-und-konsistenz
        iCan: "Ich kann an einem Beispiel erklären, warum doppelt gespeicherte Daten (Redundanz) zu Widersprüchen führen und wie verknüpfte Tabellen das vermeiden."
        gradeBand: "9-10"
        requires: [beziehungen-und-fremdschluessel]
      # GI ID-12 (7-10); HE TF Kryptologie: symmetrische Verfahren; NW 5/6 IuD: erläutern ein einfaches Transpositionsverfahren als Möglichkeit der Verschlüsselung. Stimmen 7-10 / – / 5-6 → 5-6 (Gleichstand 5-6/7-8/9-10 → früheste nach requires)
      - id: verschluesselung-grundidee
        iCan: "Ich kann an einem einfachen Verfahren, zum Beispiel einer Skytale, erklären, wie man einen Text mit einem Schlüssel ver- und entschlüsselt."
        gradeBand: "5-6"
        requires: [codierung-im-alltag]
      # GI ID-12 (7-10); HE TF Kryptologie: vergleichen und bewerten Verfahren; bewerten kryptografische Verfahren; NW 5/6 IuD: vergleichen verschiedene Verschlüsselungsverfahren unter Berücksichtigung von Sicherheitsaspekten; WP: beurteilen. Stimmen 7-10 / – / 5-6 → 5-6 (Gleichstand 5-6/7-8/9-10 → früheste nach requires)
      - id: verschluesselung-bewerten
        iCan: "Ich kann Verschlüsselungsverfahren vergleichen und beurteilen, wie sicher sie sind, zum Beispiel wie viele Schlüssel ein Angreifer ausprobieren müsste."
        gradeBand: "5-6"
        requires: [verschluesselung-grundidee]
      # GI ID-12 (7-10); HE TF Kryptologie: Algorithmus eines symmetrischen Verfahrens, zum Beispiel Caesar-Chiffre; NW WP IuD: verwenden Substitutionsverfahren als Möglichkeit der Verschlüsselung. Stimmen 7-10 / – / 9-10 → 9-10 (Mehrheit)
      - id: caesar-verschluesselung
        iCan: "Ich kann einen Text mit einem Ersetzungsverfahren wie der Caesar-Verschlüsselung ver- und entschlüsseln."
        gradeBand: "9-10"
        requires: [verschluesselung-grundidee]
      # SCHWACH (nur NW und GI (BY und HE Sek I ohne KI; HE-Entwurf KI und Digitale Welt 5/6 nennt es)). GI AL-9 (7-10); IMG-8 (7-10); NW 5/6 AuKI: benennen Anwendungsbeispiele künstlicher Intelligenz aus ihrer Lebenswelt; WP KI. Stimmen – / – / 5-6 → 5-6 (einzige Stimme)
      - id: ki-im-alltag
        iCan: "Ich kann Beispiele für künstliche Intelligenz aus meinem Alltag nennen, zum Beispiel Empfehlungen, Sprach- oder Bilderkennung."
        gradeBand: "5-6"
        requires: [informatiksysteme-im-alltag]
      # SCHWACH (nur NW und GI). GI ID-11 (7-10); AL-9; NW 5/6 AuKI: Entscheidungsbaum enaktiv als Prinzip des maschinellen Lernens; Funktionsweise künstlicher neuronaler Netze; WP KI. Stimmen – / – / 5-6 → 5-6 (einzige Stimme)
      - id: maschinelles-lernen
        iCan: "Ich kann an einem Beispiel erklären, dass ein KI-System aus Beispieldaten Muster lernt, statt dass jemand jede Regel programmiert."
        gradeBand: "5-6"
        requires: [ki-im-alltag, daten-interpretieren]
      # SCHWACH (nur NW und GI). GI ID-11 (7-10); ID-8; NW WP KI: analysieren den Einfluss von Trainingsdaten auf die Ergebnisse eines Verfahrens maschinellen Lernens. Stimmen – / – / 9-10 → 9-10 (einzige Stimme)
      - id: trainingsdaten
        iCan: "Ich kann an einem Beispiel zeigen, wie die Auswahl der Trainingsdaten die Ergebnisse eines lernenden Systems beeinflusst, auch durch Verzerrungen."
        gradeBand: "9-10"
        requires: [maschinelles-lernen]
  - id: algorithmen
    name: { de: "Algorithmen", en: "Algorithms" }
    competencies:
      # GI AL-1, AL-2 (5-6); HE I1: erkennen algorithmische Eigenschaften in Handlungsvorschriften; BY NT7 2.3: Algorithmus: Definition des Begriffs; entwickeln Algorithmen; NW 5/6 Alg: formulieren zu Abläufen aus dem Alltag eindeutige Handlungsvorschriften. Stimmen 7-10 / 7-8 / 5-6 → 7-8 (Mehrheit)
      - id: algorithmus-begriff
        iCan: "Ich kann erklären, was ein Algorithmus ist, und für einen Ablauf aus dem Alltag eine eindeutige Handlungsvorschrift aufschreiben."
        gradeBand: "7-8"
      # GI AL-1 (5-6); HE TF Programmierung: Eigenschaften von Algorithmen; prüfen Handlungsvorschriften; BY NT7 2.3: Algorithmus: Definition des Begriffs; NW WP Alg: überprüfen algorithmische Eigenschaften (Endlichkeit, Eindeutigkeit, Terminierung). Stimmen 7-10 / 7-8 / 9-10 → 7-8 (Gleichstand 7-8/9-10 → früheste nach requires)
      - id: algorithmische-eigenschaften
        iCan: "Ich kann prüfen, ob eine Handlungsvorschrift ein Algorithmus ist: endlich beschrieben, eindeutig und nach endlich vielen Schritten fertig."
        gradeBand: "7-8"
        requires: [algorithmus-begriff]
      # GI AL-2 (5-6): algorithmische Grundbausteine; HE TF Programmierung: Anweisungen, Sequenzen; BY NT7 2.3: Strukturelemente Anweisung, Sequenz; NW 5/6 Alg: identifizieren Anweisungen und die Grundstruktur Sequenz. Stimmen 7-10 / 7-8 / 5-6 → 7-8 (Mehrheit)
      - id: sequenz
        iCan: "Ich kann Anweisungen in der richtigen Reihenfolge zu einer Sequenz anordnen."
        gradeBand: "7-8"
        requires: [algorithmus-begriff]
      # GI AL-2 (5-6); HE TF Programmierung: Kontrollstrukturen: Verzweigungen; BY NT7 2.3: ein- und zweiseitig bedingte Anweisung; NW 5/6 Alg: Grundstruktur Verzweigung. Stimmen 7-10 / 7-8 / 5-6 → 7-8 (Mehrheit)
      - id: verzweigung
        iCan: "Ich kann mit einer Verzweigung (wenn – dann – sonst) festlegen, dass ein Algorithmus abhängig von einer Bedingung verschiedene Anweisungen ausführt."
        gradeBand: "7-8"
        requires: [sequenz]
      # GI AL-2 (5-6); HE TF Programmierung: Kontrollstrukturen: Wiederholungen; BY NT7 2.3: Wiederholung mit fester Anzahl; NW 5/6 Alg: Grundstruktur Schleife. Stimmen 7-10 / 7-8 / 5-6 → 7-8 (Mehrheit)
      - id: wiederholung-feste-anzahl
        iCan: "Ich kann mit einer Wiederholung mit fester Anzahl Anweisungen mehrmals ausführen lassen."
        gradeBand: "7-8"
        requires: [sequenz]
      # GI AL-2 (5-6); HE TF Programmierung: Kontrollstrukturen: Wiederholungen; BY NT7 2.3: Wiederholung mit Bedingung; NW 5/6 Alg: Grundstruktur Schleife. Stimmen 7-10 / 7-8 / 5-6 → 7-8 (Mehrheit)
      - id: wiederholung-mit-bedingung
        iCan: "Ich kann mit einer Wiederholung mit Bedingung Anweisungen so lange ausführen lassen, bis eine Bedingung erfüllt ist."
        gradeBand: "7-8"
        requires: [wiederholung-feste-anzahl, verzweigung]
      # GI AL-3 (5-6); HE I1: implementieren Algorithmen in einer Programmiersprache ... innerhalb einer Programmierumgebung; BY NT7 2.3: setzen einfache Algorithmen mithilfe geeigneter Programmierwerkzeuge um; NW 5/6 Alg: implementieren Algorithmen in einer visuellen Programmiersprache. Stimmen 7-10 / 7-8 / 5-6 → 7-8 (Mehrheit)
