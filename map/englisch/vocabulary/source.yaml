# The basic vocabulary of English (docs/learning-map-contract.md, section 6): which lexicon, which levels, and the
# corrections for children's everyday life. scripts/vocabulary.mjs writes words.yaml from it and the lexicon.
# Licence: CC BY-NC-SA 4.0, as EFLLex (LICENSE.md in this folder).
language: en
source:
  title: "EFLLex with NLP4J parts of speech (CEFRLex, CENTAL, UCLouvain)"
  url: https://cental.uclouvain.be/cefrlex/efllex/download/
  licence: CC BY-NC-SA 4.0
  cite:
    - "Dürlich, L. & François, T. (2018). EFLLex: A Graded Lexical Resource for Learners of English as a Foreign Language. In Proceedings of the 11th International Conference on Language Resources and Evaluation (LREC 2018), Miyazaki, Japan."
levels: [A1, A2]
# EFLLex has no level per word, only frequencies per level (from textbooks and readers). A word is on the first level at
# which at least two documents of its corpus use it. Words seen once at all would give A1 2114 and A2 1779 words, mostly
# from single readers; at least 2 documents gives about A1 1300 and A2 1100 (French: A1 1251, A2 679); at least 3 gives
# about A1 1030 and A2 820; a frequency of 10 per million gives about A1 1160 and A2 450 (counts before the corrections).
# The script also leaves out lemmas with a digit or underscore or without a leading letter (50s, 12th, -hour_journey).
minDocuments: 2
# Corrections for a child of the first year of English, British English. Each names its reason.
level:
  - word: zero
    pos: CD
    level: A1
    reason: "die Zahl 0 in Telefonnummern, Spielständen und Temperaturen, von Anfang an"
