# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Es gibt keine KMK-Bildungsstandards Evangelische Religion für die Sek I (EPA nur für das Abitur).
# Stränge: die Inhaltsbereiche, die die Länder teilen (HE Inhaltsfelder; NW Inhaltsfelder; Bibel nach NW IF5 und BY ER5 LB2).
# Die Karte beschreibt Wissen über Inhalte des christlichen Glaubens in evangelischer Prägung, kein Bekenntnis.
# Quellenkürzel:
#   HE = Kerncurriculum Hessen Sek I Gymnasium, Evangelische Religion, Ausgabe 2026 (Stand Juni 2026): Inhaltsfelder
#        am Ende Jg 6 (Kap. 7.1, S. 23 f.) -> 5-6, Ende Jg 8 (Kap. 7.2, S. 26-28) -> 7-8, Ende Jg 9/10 (Kap. 6, S. 19-21) -> 9-10;
#        Synopse Kap. 8.3 (S. 34 f.)
#   BY = LehrplanPLUS Bayern Gymnasium, Evangelische Religionslehre, Jg 5-10 (ER5 bis ER10, LB = Lernbereich)
#   NW = Kernlehrplan NRW Sek I Gymnasium (G9), Evangelische Religionslehre, Heft 3414 (2019): Stufe 1 = Ende Jg 6 -> 5-6,
#        Stufe 2 = Ende Sek I -> zählt für 7-8 und 9-10
# Genaue Titel, Ausgaben und URLs: .vibe/research-evangelische-religion.md
name: { de: Evangelische Religion, en: Protestant religious education }
source:
  title: Kerncurriculum Hessen, Sekundarstufe I - Gymnasium, Evangelische Religion, Ausgabe 2026 (Hessisches Ministerium für Kultus, Bildung und Chancen), verglichen mit LehrplanPLUS Bayern und Kernlehrplan NRW
  url: https://kultus.hessen.de/sites/kultus.hessen.de/files/2026-10/web_kc_evangelische_religion_sek1_gymnasium.pdf
strands:
  - id: mensch
    name: { de: "Mensch und Welt", en: "Human being and world" }
    competencies:
      # HE Jg 6 Mensch und Welt: 1. Mose 1 und 2 (S. 23); BY ER5 LB4: biblische Schöpfungstexte Gen 1,1–2,4a und Gen 2,4b–3,24; NW IF1 Stufe 1: biblische Schöpfungstexte (S. 18). Stimmen HE/BY/NW 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      # Siehe auch: katholische-religion/schoepfungserzaehlungen
      - id: schoepfungserzaehlungen
        iCan: { de: "Ich kann die beiden Schöpfungserzählungen am Anfang der Bibel (1. Mose 1 und 2) wiedergeben und ihre wichtigsten Aussagen nennen." }
        gradeBand: "5-6"
        requires: [bibelstellen-finden]
      # BY ER8 LB3: Reden von der Schöpfung als Glaubensperspektive im Unterschied zu Fragen nach der Weltentstehung; NW IF1 Stufe 1: identifizieren die biblischen Schöpfungstexte als Glaubensaussagen (S. 18). Stimmen HE/BY/NW – / 7-8 / 5-6 -> 5-6 (Gleichstand 5-6/7-8; requires entscheidet)
      - id: schoepfungstexte-als-glaubensaussagen
        iCan: { de: "Ich kann erklären, warum die Schöpfungserzählungen Glaubensaussagen sind und keine naturwissenschaftlichen Berichte." }
        gradeBand: "5-6"
        requires: [schoepfungserzaehlungen, bibel-textsorten]
      # HE Jg 6 Mensch und Welt: Welt als Schöpfung, Mensch als Geschöpf (S. 23); BY ER5 LB4: der Mensch als Geschöpf und Teil der Schöpfung; Gott als Bewahrer und Vollender; NW IF1 Stufe 1: Verantwortung in der Welt als Gottes Schöpfung (S. 18). Stimmen HE/BY/NW 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: mensch-als-geschoepf
        iCan: { de: "Ich kann erklären, was Christen meinen, wenn sie den Menschen und die Welt als Gottes Schöpfung bezeichnen." }
        gradeBand: "5-6"
        requires: [schoepfungserzaehlungen]
      # HE Jg 6 Mensch und Welt: Mensch als Geschöpf und Ebenbild Gottes, 1. Mose 1,26 f. (S. 23); BY ER5 LB4: Ebenbildlichkeit des Menschen, Würde jedes Menschen; NW IF1 Stufe 2: Menschenwürde als Konsequenz der Gottesebenbildlichkeit (S. 28). Stimmen HE/BY/NW 5-6 / 5-6 / 7-10 -> 5-6 (Mehrheit)
      # Siehe auch: katholische-religion/gottebenbildlichkeit
      - id: ebenbild-gottes
        iCan: { de: "Ich kann erklären, was die Bibel meint, wenn sie den Menschen „Ebenbild Gottes“ nennt, und was Christen daraus für die Würde jedes Menschen ableiten." }
        gradeBand: "5-6"
        requires: [mensch-als-geschoepf]
      # HE Jg 6 Mensch und Welt: Selbstwahrnehmung / Fremdwahrnehmung (Identität) (S. 23, 34); BY ER5 LB1: Rollenerwartungen, eigene und fremde Ansprüche. Stimmen HE/BY/NW 5-6 / 5-6 / – -> 5-6 (Mehrheit)
      # Siehe auch: katholische-religion/identitaet-jugendalter
      - id: identitaet
        iCan: { de: "Ich kann erklären, was „Identität“ bedeutet und wie das Bild, das ich von mir habe, und das Bild, das andere von mir haben, zusammenhängen." }
        gradeBand: "5-6"
      # HE Jg 6 Mensch und Welt: biblische Sicht des Menschen (S. 23); Gott: Lk 15,11–32 (S. 23); BY ER5 LB1: Geschichten von der liebenden Zuwendung Gottes (Mk 10,13–16, Lk 15,11–32, Lk 19,1–10). Stimmen HE/BY/NW 5-6 / 5-6 / – -> 5-6 (Mehrheit)
      - id: gottes-zuwendung
        iCan: { de: "Ich kann an biblischen Geschichten wie Zachäus oder dem verlorenen Sohn zeigen, wie die Bibel von Gottes Zuwendung zu jedem Menschen erzählt." }
        gradeBand: "5-6"
        requires: [identitaet, bibelstellen-finden]
      # HE Jg 8 Mensch und Welt: Begrenztheit und Fehlbarkeit, Frage nach gelingendem Leben (S. 26); BY ER10 LB3: biblisch-christliche Vorstellungen gelingenden Lebens. Stimmen HE/BY/NW 7-8 / 9-10 / – -> 7-8 (Gleichstand 7-8/9-10; requires entscheidet)
      # Siehe auch: katholische-religion/glueck-und-sinn
      - id: gelingendes-leben
        iCan: { de: "Ich kann erklären, was Christen unter gelingendem Leben verstehen, obwohl Menschen begrenzt sind und Fehler machen." }
        gradeBand: "7-8"
        requires: [gottes-zuwendung]
      # HE Jg 8 Mensch und Welt: Rechtfertigungslehre Martin Luthers, Röm 3,21–28 (S. 26); BY ER8 LB1: reformatorische Entdeckungen zu Gott und Mensch; NW IF2 Stufe 2: Gedanke der Rechtfertigung als Grundlage evangelischen Glaubens (S. 28). Stimmen HE/BY/NW 7-8 / 7-8 / 7-10 -> 7-8 (Mehrheit)
      - id: rechtfertigung
        iCan: { de: "Ich kann erklären, was die evangelische Lehre von der Rechtfertigung meint: Nach ihr nimmt Gott den Menschen ohne Vorbedingung an, nicht wegen seiner Leistungen." }
        gradeBand: "7-8"
        requires: [gottes-zuwendung, luther-leben]
      # BY ER8 LB1: Gedanke der Freiheit eines Christenmenschen; NW IF2 Stufe 2: reformatorische Zuordnung von Freiheit und Verantwortung des Einzelnen vor Gott (S. 28 f.). Stimmen HE/BY/NW – / 7-8 / 7-10 -> 7-8 (Mehrheit)
      - id: freiheit-eines-christenmenschen
        iCan: { de: "Ich kann Luthers Gedanken von der „Freiheit eines Christenmenschen“ erklären: frei vor Gott und zugleich verantwortlich für andere." }
        gradeBand: "7-8"
        requires: [rechtfertigung]
      # HE Jg 9/10 Mensch und Welt: Wahrheitsansprüche verschiedener Weltverständnisse (S. 19, 35); BY ER8 LB3: Begriff Weltbild, verschiedene Vorstellungsmodelle von Welt; NW IF6 Stufe 2: Vorstellungen von Welt und Wirklichkeit in Religionen und Weltanschauungen (S. 32). Stimmen HE/BY/NW 9-10 / 7-8 / 7-10 -> 7-8 (Gleichstand 7-8/9-10; requires entscheidet)
      - id: weltbilder
        iCan: { de: "Ich kann verschiedene Vorstellungen von der Welt beschreiben, zum Beispiel als Schöpfung, als Kreislauf oder als Zufall, und vergleichen, was sie für das Leben bedeuten." }
        gradeBand: "7-8"
        requires: [mensch-als-geschoepf]
      # HE Jg 9/10 Gott: Glauben und Wissen (S. 19, 35); BY ER8 LB3: Zugänge von Naturwissenschaft und Glauben, Sachfragen und Sinnfragen; NW IF1 Stufe 1: Verhältnis von Erklärungsansätzen zur Weltentstehung und biblischem Schöpfungsgedanken (in Ansätzen) (S. 18). Stimmen HE/BY/NW 9-10 / 7-8 / 5-6 -> 7-8 (dreifach uneins: Mitte)
      # Siehe auch: katholische-religion/schoepfung-und-naturwissenschaft
      - id: glaube-und-naturwissenschaft
        iCan: { de: "Ich kann erklären, wie Naturwissenschaft und Glaube auf verschiedene Fragen antworten: Wie ist die Welt entstanden? Und: Welchen Sinn hat sie?" }
        gradeBand: "7-8"
        requires: [schoepfungstexte-als-glaubensaussagen]
      # HE Jg 9/10 Mensch und Welt: Vergänglichkeit des Lebens, Ps 90 (S. 19); BY ER8 LB4: Zeit, Endlichkeit und Ewigkeit; Lebenszeit als Gabe Gottes; NW IF7 Stufe 2: Bewältigung von Endlichkeitserfahrungen (S. 33). Stimmen HE/BY/NW 9-10 / 7-8 / 7-10 -> 7-8 (Gleichstand 7-8/9-10; requires entscheidet)
      - id: zeit-und-endlichkeit
        iCan: { de: "Ich kann erklären, wie biblische Texte wie Psalm 90 über die Vergänglichkeit und die begrenzte Lebenszeit des Menschen sprechen." }
        gradeBand: "7-8"
        requires: [psalmen]
      # HE Jg 9/10 Mensch und Welt: Vergänglichkeit des Lebens (S. 19, 35); BY ER10 LB4: Abschied und Trauer; NW IF7 Stufe 2: religiöse und säkulare Symbole und Rituale im Umgang mit Tod und Trauer (S. 33). Stimmen HE/BY/NW 9-10 / 9-10 / 7-10 -> 9-10 (Mehrheit)
      # Siehe auch: katholische-religion/tod-und-trauer
      - id: tod-und-trauer
        iCan: { de: "Ich kann beschreiben, wie Menschen Abschied nehmen und trauern, und dabei religiöse und nichtreligiöse Rituale unterscheiden." }
        gradeBand: "9-10"
        requires: [lebenswenden-feiern]
      # HE Jg 9/10 Mensch und Welt: Vergänglichkeit; Offb 21,1–7 (S. 19); BY ER10 LB4: religiöse und philosophische Vorstellungen von Sterben und Tod; NW IF3 und IF7 Stufe 2: christliche und andere Vorstellungen von einem Leben nach dem Tod (S. 30, 33). Stimmen HE/BY/NW 9-10 / 9-10 / 7-10 -> 9-10 (Mehrheit)
      # Siehe auch: katholische-religion/auferstehung-und-jenseits
      - id: vorstellungen-vom-leben-nach-dem-tod
        iCan: { de: "Ich kann verschiedene religiöse und nichtreligiöse Vorstellungen von einem Leben nach dem Tod beschreiben und vergleichen." }
        gradeBand: "9-10"
        requires: [tod-und-trauer]
      # HE Jg 9/10 Mensch und Welt: Offb 21,1–7 (Das neue Jerusalem); Jesus Christus: Kreuz und Auferstehung (S. 19 f.); BY ER10 LB4: christlicher Auferstehungsglaube (Joh 11, Röm 8, 1 Kor 15), Sprachbilder wie Gericht, Paradies, ewiges Leben; NW IF3 Stufe 2: Auferstehung Jesu als Grundlage christlicher Hoffnung (S. 30). Stimmen HE/BY/NW 9-10 / 9-10 / 7-10 -> 9-10 (Mehrheit)
      # Siehe auch: katholische-religion/christliche-hoffnung
      - id: auferstehungshoffnung
        iCan: { de: "Ich kann erklären, was Christen meinen, wenn sie auf die Auferstehung der Toten und ein ewiges Leben hoffen." }
        gradeBand: "9-10"
        requires: [auferstehung-im-neuen-testament, vorstellungen-vom-leben-nach-dem-tod]
  - id: gott
    name: { de: "Gott", en: "God" }
    competencies:
      # HE Jg 6 Gott: Gottesvorstellungen, Rede über Gott (S. 23); BY ER5 LB3: eigene Glaubensfragen und Gottesvorstellungen; NW IF2 Stufe 1: subjektive Gottesvorstellungen (S. 19). Stimmen HE/BY/NW 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      # Siehe auch: katholische-religion/gottesbilder
      - id: gottesvorstellungen
        iCan: { de: "Ich kann verschiedene Vorstellungen beschreiben, die Menschen von Gott haben, und sie mit meinen eigenen vergleichen." }
        gradeBand: "5-6"
      # HE Jg 6 Gott: Beziehung zu Gott verändert sich im Laufe des Lebens (S. 23); BY ER5 LB3: veränderte Vorstellungen und Redeweisen von Gott; NW IF2 Stufe 1: lebensgeschichtliche Veränderungen von Gottesvorstellungen (S. 19). Stimmen HE/BY/NW 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: gottesvorstellungen-veraendern-sich
        iCan: { de: "Ich kann an Beispielen erklären, wie und warum sich Vorstellungen von Gott im Laufe eines Lebens verändern können." }
        gradeBand: "5-6"
        requires: [gottesvorstellungen]
      # HE Jg 6 Gott: Gottesvorstellungen der Bibel in Erfahrungen, Bildern und Symbolen; Ps 23 (S. 23); BY ER5 LB3: Gott als Befreier, Begleiter, Wegweiser; NW IF2 Stufe 1: in biblischen Erzählungen Erfahrungen mit Gott (S. 19). Stimmen HE/BY/NW 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      # Siehe auch: katholische-religion/biblische-gottesbilder
      - id: gottesbilder-der-bibel
        iCan: { de: "Ich kann Bilder nennen, in denen die Bibel von Gott spricht, zum Beispiel Hirte, Vater oder Befreier, und erklären, warum sie in Bildern von Gott spricht." }
        gradeBand: "5-6"
        requires: [gottesvorstellungen, bibel-erfahrungen-mit-gott]
      # HE Jg 8 Ethik: 1. Mose in Auswahl, Abraham und Lot (S. 28); BY ER5 LB3: Abrahamserzählungen (eine Geschichtstradition zur Wahl); NW IF2 Stufe 1: Glaube in biblischen Erzählungen als Vertrauen (S. 19); IF6 Stufe 1: Berufung auf Abraham (S. 22). Stimmen HE/BY/NW 7-8 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      # Siehe auch: katholische-religion/abraham
      - id: abraham
        iCan: { de: "Ich kann die Geschichte von Abraham in Grundzügen erzählen und erklären, warum sie vom Vertrauen auf Gott handelt." }
        gradeBand: "5-6"
        requires: [bibelstellen-finden]
      # HE Jg 6 Gott: 2. Mose 3,1–14 (S. 23); BY ER5 LB3: Exodustradition; Gott sucht die Beziehung zu den Menschen (Offenbarung). Stimmen HE/BY/NW 5-6 / 5-6 / – -> 5-6 (Mehrheit)
      # Siehe auch: katholische-religion/gottesname
      - id: dornbusch
        iCan: { de: "Ich kann die Erzählung vom brennenden Dornbusch wiedergeben und erklären, was der Gottesname „Ich bin, der ich bin“ bedeuten kann." }
        gradeBand: "5-6"
        requires: [bibelstellen-finden]
      # HE Jg 6 Gott: 2. Mose 3; Ethik: 2. Mose 20 (S. 23 f.); Jg 8 Religionen: 2. Mose 12 (S. 28); BY ER5 LB3: Exodustradition, Gott als Befreier; NW IF2 Stufe 1: in biblischen Erzählungen Erfahrungen mit Gott (S. 19). Stimmen HE/BY/NW 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      # Siehe auch: katholische-religion/gott-der-befreiung, katholische-religion/exodus
      - id: exodus
        iCan: { de: "Ich kann die Erzählung vom Auszug aus Ägypten in Grundzügen wiedergeben und erklären, warum sie Gott als Befreier zeigt." }
        gradeBand: "5-6"
        requires: [dornbusch]
      # BY ER5 LB3: Gott als Begleiter; Glaubensgewissheit und -zweifel; NW IF2 Stufe 1: Grundhaltung des Glaubens an Gott als Vertrauen (S. 19). Stimmen HE/BY/NW – / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: glaube-als-vertrauen
        iCan: { de: "Ich kann erklären, warum „glauben“ in der Bibel vor allem bedeutet, Gott zu vertrauen." }
        gradeBand: "5-6"
        requires: [abraham]
      # HE Jg 6 Gott: Formen der Gottesbeziehung (Gebet); Ps 23, Ps 104 (S. 23); BY ER5 LB3: Sprache der Psalmen; ER7 LB1: Psalmen und Gebete als Sprachformen; NW Stufe 1 übergeordnet: Formen religiöser Sprache (Psalm, Gebet) (S. 17). Stimmen HE/BY/NW 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      # Siehe auch: katholische-religion/psalmen
      - id: psalmen
        iCan: { de: "Ich kann erklären, wie Menschen in den Psalmen mit Gott sprechen: Sie loben, danken, klagen und bitten." }
        gradeBand: "5-6"
        requires: [bibel-textsorten]
      # HE Jg 6 Gott: Gestaltungsformen der Gottesbeziehung (Gebet) (S. 23); BY ER7 LB1: Psalmen und Gebete als Sprachformen (Lob, Dank, Klage, Bitte); NW Stufe 1 übergeordnet: einfache religiöse Handlungen (u. a. Gebet) (S. 17). Stimmen HE/BY/NW 5-6 / 7-8 / 5-6 -> 5-6 (Mehrheit)
      # Siehe auch: katholische-religion/gebet
      - id: gebet
        iCan: { de: "Ich kann erklären, was ein Gebet ist und welche Formen des Gebets es im Christentum gibt." }
        gradeBand: "5-6"
        requires: [psalmen]
      # HE Jg 8 Gott: Mt 6,9–13 (S. 27); BY ER7 LB1: das Vaterunser als grundlegendes Gebet (Memoriertext). Stimmen HE/BY/NW 7-8 / 7-8 / – -> 7-8 (Mehrheit)
      # Siehe auch: katholische-religion/vaterunser
      - id: vaterunser
        iCan: { de: "Ich kann das Vaterunser wiedergeben und erklären, worum Christen darin bitten." }
        gradeBand: "7-8"
        requires: [gebet]
      # HE Jg 8 Gott: Jesus eröffnet Menschen die Möglichkeit einer Gottesbeziehung; Mk 1,9–11 (S. 27); BY ER9 LB2: Bedeutung Jesu für den christlichen Gottesglauben. Stimmen HE/BY/NW 7-8 / 9-10 / – -> 7-8 (Gleichstand 7-8/9-10; requires entscheidet)
      - id: jesus-und-die-gottesbeziehung
        iCan: { de: "Ich kann erklären, warum Jesus für Christen zeigt, wer Gott ist und wie Menschen mit Gott in Beziehung kommen." }
        gradeBand: "7-8"
        requires: [gottesbilder-der-bibel, reich-gottes]
      # HE Jg 9/10 Jesus Christus: alte und neue Glaubensbekenntnisse (S. 35); BY ER7 LB1: die drei Artikel des Apostolischen Glaubensbekenntnisses (ER5 LB4, ER6 LB3: 1. und 2. Artikel); NW IF2 Stufe 2: Bekenntnisse des Glaubens an Gott (S. 28 f.). Stimmen HE/BY/NW 9-10 / 7-8 / 7-10 -> 7-8 (Gleichstand 7-8/9-10; requires entscheidet)
      # Siehe auch: katholische-religion/glaubensbekenntnis
      - id: glaubensbekenntnis
        iCan: { de: "Ich kann die drei Teile des Apostolischen Glaubensbekenntnisses nennen und sagen, wovon jeder handelt: Gott der Schöpfer, Jesus Christus und der Heilige Geist." }
        gradeBand: "7-8"
        requires: [mensch-als-geschoepf, messias]
      # HE Jg 9/10 Jesus Christus: alte und neue Glaubensbekenntnisse (S. 35); BY ER7 LB1: unterscheiden das Bekenntnis von anderen Sprachformen; NW IF2 Stufe 2: unterscheiden Aussagen über Gott von Bekenntnissen des Glaubens an Gott (S. 29). Stimmen HE/BY/NW 9-10 / 7-8 / 7-10 -> 7-8 (Gleichstand 7-8/9-10; requires entscheidet)
      - id: bekenntnis-und-aussage
        iCan: { de: "Ich kann erklären, worin sich ein Bekenntnis („Ich glaube an …“) von einer Aussage über Gott unterscheidet." }
        gradeBand: "7-8"
        requires: [glaubensbekenntnis]
      # HE Jg 8 Gott: andere Vorstellungen von Gott fordern Christen zum Gespräch heraus; Mk 1,9–11 (S. 27); BY ER7 LB1: die drei Artikel als grundlegendes Bekenntnis des christlichen Gottesglaubens; NW IF6 Stufe 2: Merkmale des Gottesglaubens in Judentum, Christentum und Islam vergleichen (S. 32). Stimmen HE/BY/NW 7-8 / 7-8 / 7-10 -> 7-8 (Mehrheit). Schwach belegt: kein Land nennt die Dreieinigkeit als eigenen Inhalt; aufgenommen als direkte Voraussetzung von gottesglaube-vergleichen
      # Siehe auch: katholische-religion/dreieiner-gott
      - id: dreieinigkeit
        iCan: { de: "Ich kann erklären, was Christen meinen, wenn sie von Gott als Vater, Sohn und Heiligem Geist sprechen." }
        gradeBand: "7-8"
        requires: [glaubensbekenntnis, pfingsten]
      # HE Jg 9/10 Religionen: 2. Mose 20,1–6 (S. 21); BY ER8 LB2: Kritik der Propheten an der Götzenverehrung; ER7 LB4: das 1. Gebot in seiner kritischen Funktion; NW IF2 Stufe 2: Funktionalisierung Gottes (S. 29). Stimmen HE/BY/NW 9-10 / 7-8 / 7-10 -> 7-8 (Gleichstand 7-8/9-10; requires entscheidet)
      # Siehe auch: katholische-religion/gott-und-goetze
      - id: erstes-gebot
        iCan: { de: "Ich kann erklären, was das erste Gebot meint und warum Propheten gegen die Verehrung anderer Götter auftraten." }
        gradeBand: "7-8"
        requires: [zehn-gebote, propheten]
      # HE Jg 9/10 Gott: Tragfähigkeit des Redens von Gott angesichts von Widerfahrnissen; Hiob, Ps 22 (S. 19); BY ER9 LB2: Anfragen an den Gottesglauben angesichts von Leidenserfahrungen (schon ER5 LB4: Frage nach dem Warum von Leid); NW IF2 Stufe 2: Argumente für und gegen den Glauben an Gott (S. 29). Stimmen HE/BY/NW 9-10 / 9-10 / 7-10 -> 9-10 (Mehrheit)
      # Siehe auch: katholische-religion/theodizee
      - id: theodizee
        iCan: { de: "Ich kann die Frage erklären, wie ein guter und mächtiger Gott Leid zulassen kann, und an Hiob zeigen, wie die Bibel mit dieser Frage umgeht." }
        gradeBand: "9-10"
        requires: [gottesbilder-der-bibel, psalmen]
      # HE Jg 9/10 Gott: Angemessenheit und Tragfähigkeit des menschlichen Redens von Gott (S. 19); BY ER5 LB3: Spannungen im Gottesbild der Bibel, Fragen, die offenbleiben; NW IF2 Stufe 2: Rede von der Unverfügbarkeit Gottes (S. 29). Stimmen HE/BY/NW 9-10 / 5-6 / 7-10 -> 9-10 (Mehrheit)
      # Siehe auch: katholische-religion/analoge-rede-von-gott
      - id: unverfuegbarkeit-gottes
        iCan: { de: "Ich kann erklären, warum nach christlichem Verständnis menschliche Worte und Bilder Gott nie ganz erfassen können." }
        gradeBand: "9-10"
        requires: [gottesbilder-der-bibel]
      # HE Jg 9/10 Gott: Der Glaube an Gott wird hinterfragt und erfährt Kritik (S. 19); BY ER9 LB2: Anfragen an den Gottesglauben angesichts von Vernunft und Autonomie; NW IF2 Stufe 2: Formen der Bestreitung oder Infragestellung Gottes (S. 29). Stimmen HE/BY/NW 9-10 / 9-10 / 7-10 -> 9-10 (Mehrheit)
      # Siehe auch: katholische-religion/kritik-am-gottesglauben
      - id: gottesbestreitung
        iCan: { de: "Ich kann Formen beschreiben, wie Menschen den Glauben an Gott bestreiten oder in Frage stellen, zum Beispiel Atheismus oder Gleichgültigkeit." }
        gradeBand: "9-10"
        requires: [gottesvorstellungen-veraendern-sich]
      # HE Jg 9/10 Gott: Glauben und Wissen (S. 19, 35); BY ER9 LB2: eigene Anfragen an den Gottesglauben; NW IF2 Stufe 2: erörtern Argumente für und gegen den Glauben an Gott (S. 29). Stimmen HE/BY/NW 9-10 / 9-10 / 7-10 -> 9-10 (Mehrheit)
