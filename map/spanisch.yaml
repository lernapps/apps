# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Spanisch ist am Gymnasium zweite Fremdsprache (HE und NW ab Jg 7) oder dritte Fremdsprache (BY ab Jg 8;
# HE und NW ab Jg 9). Es gibt keine KMK-Bildungsstandards Spanisch für die Sek I; die KMK-Standards für die erste
# Fremdsprache tragen die Struktur (sprachliche Mittel, interkulturelle Kompetenz, Text- und Medienkompetenz), aber
# keine einzelnen Spanisch-Inhalte.
# Quellenkürzel in den Kommentaren:
#   KMK = Bildungsstandards für die erste Fremdsprache (Englisch/Französisch) ESA/MSA, i. d. F. vom 22.06.2023;
#         LG = Lexiko-Grammatik (S. 18-19), Aussprache und Prosodie (S. 20), IK = Interkulturelle Kompetenz (S. 20),
#         SPR = Sprechen (S. 14), SCHR = Schreiben (S. 15-16), TM = Text- und Medienkompetenz (S. 21-22).
#   HE  = Lehrplan Spanisch, Gymnasialer Bildungsgang, Jahrgangsstufen 7 bis 13 (Hessen, G9), Spanisch als 2. Fremdsprache;
#         "HE7 3.3" = Jahrgangsstufe 7, Abschnitt 3.3 (1.1 Textverstehen, 1.2 Texterstellen, 2.1 Situationen,
#         2.2 Themenbereiche, 2.3 Landeskunde, 2.4 Lektüre, 3.1 Lautlehre, 3.2 Wortschatz, 3.3 Grammatik,
#         3.4 Rechtschreibung, 4 Methoden); HE7 S. 11-14, HE8 S. 15-17, HE9 S. 18-20, HE10 S. 21-22.
#         HE-KC = Kerncurriculum Hessen Sek I Gymnasium, Moderne Fremdsprachen (2023), Kap. 7.4 (Ende Jg 8, 2. FS) und
#         6.1 (Ende Jg 10); nur dort gezählt, wo der Lehrplan schweigt.
#   BY  = LehrplanPLUS Bayern Gymnasium, Spanisch (3. Fremdsprache), Fachlehrpläne Sp8 bis Sp10 (Spanisch beginnt in
#         Jg 8; für Jg 5-7 gibt es keinen Fachlehrplan Spanisch); Lernbereiche 1.1 Fertigkeiten, 1.2 sprachliche Mittel,
#         2 Interkulturelle Kompetenzen, 3 Text- und Medienkompetenzen, 4 Methodische Kompetenzen, 5 Themengebiete.
#   NW  = Kernlehrplan Spanisch Sek I Gymnasium NRW (G9, Heft 3416, 2019), Spanisch als 2. Fremdsprache ab Klasse 7:
#         S1 = erste Stufe (Schreiben S. 17, Grammatik S. 19, Aussprache S. 19-20, Orthografie S. 20, IK S. 21,
#         TM = Text- und Medienkompetenz S. 21-22), S2 = zweite Stufe (Schreiben S. 25, Grammatik S. 27, Aussprache und
#         Orthografie S. 28, IK S. 29, TM S. 29-30). Der Kernlehrplan nennt für die Stufen keine Jahrgänge.
# Richtstufe = Stufe im Lehrgang, nicht Jahrgang: Jede Stimme wird zum Lernjahr y (Jahrgang - erster Jahrgang + 1); bei n
# Lernjahren geht y in Teil floor(3 * (y - 1/2) / n) + 1, Teil 1 -> 5-6, 2 -> 7-8, 3 -> 9-10.
#   HE ab Jg 7, n = 4: Jg 7 -> 5-6, Jg 8 und 9 -> 7-8, Jg 10 -> 9-10. HE-KC Ende Jg 8 = LJ 1-2 -> 5-6 und 7-8,
#   Ende Jg 10 = LJ 3-4 -> 7-8 und 9-10.   BY ab Jg 8, n = 3: Jg 8 -> 5-6, Jg 9 -> 7-8, Jg 10 -> 9-10.
#   NW ab Jg 7, n = 4, Stufen ohne Jahrgang: S1 = LJ 1-2 -> 5-6 und 7-8, S2 = LJ 3-4 -> 7-8 und 9-10 (eine Stimme für jede
#   Stufe, die sie abdeckt). Das Schulbeispiel (SiLP 2020) stimmt nicht mit.
# Es gewinnt die Stufe mit den meisten Stimmen; Gleichstand: die frühere, außer requires erzwingt die spätere. Hält eine
# Stufe mehr als die Hälfte eines Strangs, rücken Bausteine entlang requires weiter ("verteilt", mit Grund).
# SCHWACH = schwach belegt (Grund genannt). Genaue Titel, Ausgaben und URLs: .vibe/research-spanisch.md.
name: { de: Spanisch, en: Spanish }                # the file name is the subject's id: spanisch
source:
  title: KMK, Bildungsstandards für die erste Fremdsprache (Englisch/Französisch) für den Ersten Schulabschluss und den Mittleren Schulabschluss, Beschluss vom 15.10.2004 und vom 04.12.2003 i.d.F. vom 22.06.2023 (Struktur; Inhalte aus den Lehrplänen Hessen, Bayern und NRW)
  url: https://www.kmk.org/fileadmin/Dateien/veroeffentlichungen_beschluesse/2023/2023_06_22-Bista-ESA-MSA-ErsteFremdsprache.pdf
strands:
  - id: grammatik
    name: { de: Grammatik, en: Grammar }
    competencies:
      # HE7 3.3 (Genus; bestimmter/unbestimmter Artikel); BY Sp8 1.2 (Substantiv; bestimmter und unbestimmter Artikel); NW S1 Grammatik (artículo determinado und indeterminado) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: artikel-und-genus
        iCan: "Ich kann den bestimmten und unbestimmten Artikel (el, la, un, una) richtig verwenden und das Genus eines Nomens erkennen."
        gradeBand: "5-6"
      # HE7 3.3 (Numerus: los amigos, unas amigas); BY Sp8 1.2 (Pluralbildung) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW – | 2× 5-6 → 5-6 (Mehrheit)
      - id: plural
        iCan: "Ich kann den Plural von Nomen und Artikeln bilden (los amigos, unas casas)."
        gradeBand: "5-6"
        requires: [artikel-und-genus]
      # HE7 3.3 (Verbparadigma); HE8 3.3 (betonte Personalpronomen); BY Sp8 1.2 (Subjektpronomen inkl. ustedes); NW S1 Grammatik (frequente Pronomina) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: subjektpronomen
        iCan: "Ich kann die Subjektpronomen (yo, tú, él, nosotros, ustedes …) verwenden und weiß, dass man sie oft weglässt."
        gradeBand: "5-6"
      # HE7 3.3 (Struktur des Aussagesatzes); BY Sp8 1.2 (Aussagesatz); NW S1 Grammatik (grundlegende syntaktische Strukturen) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: aussagesatz
        iCan: "Ich kann einfache spanische Aussagesätze in der richtigen Wortstellung bilden."
        gradeBand: "5-6"
        requires: [subjektpronomen]
      # BY Sp8 1.2 (Negation no, nunca, tampoco; Indefinitpronomen nada, nadie); NW S1 Grammatik (Negation) | HE –; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 2× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: verneinung
        iCan: "Ich kann Sätze mit no, nunca, nada, nadie und tampoco verneinen und weiß, wann man zwei Verneinungswörter braucht."
        gradeBand: "5-6"
        requires: [aussagesatz]
      # HE7 3.3 (Fragesätze mit Fragepronomen, Intonationsfrage); BY Sp8 1.2 (Interrogativpronomen und Fragesatz, auch qué und cuál); NW S1 Grammatik (Fragen formulieren) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: fragesaetze
        iCan: "Ich kann Fragen mit und ohne Fragewort stellen (¿Quién?, ¿Dónde?, ¿Cuándo?, ¿Qué?, ¿Cuál?)."
        gradeBand: "5-6"
        requires: [aussagesatz]
      # HE7 3.3 (Possessivbegleiter mi amiga, tus padres); BY Sp8 1.2 (Possessivbegleiter); NW S1 Grammatik (frequente Pronomina) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: possessivbegleiter
        iCan: "Ich kann mit mi, tu, su, nuestro und vuestro sagen, wem etwas gehört."
        gradeBand: "5-6"
        requires: [subjektpronomen, plural]
      # HE7 3.3 (Demonstrativpronomen este, ese, aquel); BY Sp8 1.2 (Demonstrativpronomen und -begleiter); NW S1 Grammatik (frequente Pronomina) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: demonstrativbegleiter
        iCan: "Ich kann mit este, ese und aquel auf Nahes und Fernes zeigen."
        gradeBand: "5-6"
        requires: [artikel-und-genus]
      # HE9 3.3 (pronombres posesivos tónicos mío, tuyo, suyo); BY Sp9 1.2 (Possessivpronomen) | HE Jg 9 = LJ 3/4 → 7-8; BY Jg 9 = LJ 2/3 → 7-8; NW – | 2× 7-8 → 7-8 (Mehrheit)
      - id: possessivpronomen
        iCan: "Ich kann die betonten Possessivformen (mío, tuyo, suyo) verwenden, zum Beispiel in „Es mío“."
        gradeBand: "7-8"
        requires: [possessivbegleiter]
      # HE10 3.3 (Übersicht: alle indefiniten Pronomen); BY Sp9 1.2 (Indefinitbegleiter cualquier, cada, algún, ningún) | HE Jg 10 = LJ 4/4 → 9-10; BY Jg 9 = LJ 2/3 → 7-8; NW – | 1× 7-8, 1× 9-10 → 7-8 (Gleichstand: die frühere)
      - id: indefinitbegleiter
        iCan: "Ich kann algún, ningún, cada, cualquier und otro richtig verwenden."
        gradeBand: "7-8"
        requires: [verneinung]
      # HE7 3.3 (Adjektive und ihre Veränderung, attributiv und prädikativ); BY Sp8 1.2 (Adjektiv); NW S1 Grammatik (Adjektive) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: adjektiv-angleichung
        iCan: "Ich kann Adjektive in Genus und Numerus an das Nomen angleichen (un chico alto, unas chicas altas)."
        gradeBand: "5-6"
        requires: [plural]
      # BY Sp8 1.2 (Stellung hinter dem Substantiv, verkürzte Form bei Voranstellung); NW S1 Grammatik (Adjektive und Adverbien: Stellung) | HE –; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 2× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: adjektiv-stellung
        iCan: "Ich kann Adjektive richtig stellen und die Kurzformen buen, gran und primer vor dem Nomen verwenden."
        gradeBand: "5-6"
        requires: [adjektiv-angleichung]
      # BY Sp8 1.2 (Adverbien muy und mucho; auch Wortschatz); NW S1 Grammatik (Adverbien) | HE –; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 2× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: muy-und-mucho
        iCan: "Ich kann muy und mucho richtig unterscheiden (muy bien, mucho tiempo, trabaja mucho)."
        gradeBand: "5-6"
        requires: [adjektiv-angleichung]
      # HE9 3.3 (Adverbien auf -mente, Adverb und Adjektiv); BY Sp9 1.2 (Adverbien auf -mente); NW S1 Grammatik (Adverbien) | HE Jg 9 = LJ 3/4 → 7-8; BY Jg 9 = LJ 2/3 → 7-8; NW S1 = LJ 1-2/4 → 5-6/7-8 | 1× 5-6, 3× 7-8 → 7-8 (Mehrheit)
      - id: adverbien-auf-mente
        iCan: "Ich kann Adverbien auf -mente bilden und Adverb und Adjektiv richtig unterscheiden."
        gradeBand: "7-8"
        requires: [adjektiv-angleichung]
      # HE8 3.3 (Steigerung der Adjektive und Vergleich); BY Sp8 1.2 (Komparativ; tan(to) … como); NW S1 Grammatik (Komparativ) | HE Jg 8 = LJ 2/4 → 7-8; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 2× 5-6, 2× 7-8 → 5-6 (Gleichstand: die frühere)
      - id: komparativ
        iCan: "Ich kann mit más … que, menos … que und tan … como vergleichen, auch mit mejor und peor."
        gradeBand: "5-6"
        requires: [adjektiv-angleichung]
      # HE8 3.3 (Steigerung der Adjektive); BY Sp8 1.2 (relativer Superlativ); NW S1 Grammatik (Superlativ) | HE Jg 8 = LJ 2/4 → 7-8; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 2× 5-6, 2× 7-8 → 7-8 (Gleichstand: die frühere 5-6; verteilt: 5-6 hielte sonst 43 von 83; baut auf komparativ auf)
      - id: superlativ
        iCan: "Ich kann mit el más … und la menos … sagen, wer oder was am meisten oder am wenigsten etwas ist."
        gradeBand: "7-8"
        requires: [komparativ]
      # HE8 3.3 (Elativ auf -ísimo); BY Sp10 1.2 (absoluter Superlativ -ísimo); NW S1 Grammatik (Superlativ) | HE Jg 8 = LJ 2/4 → 7-8; BY Jg 10 = LJ 3/3 → 9-10; NW S1 = LJ 1-2/4 → 5-6/7-8 | 1× 5-6, 2× 7-8, 1× 9-10 → 7-8 (Mehrheit)
      - id: absoluter-superlativ
        iCan: "Ich kann den absoluten Superlativ auf -ísimo bilden (guapísimo, riquísimo)."
        gradeBand: "7-8"
        requires: [adjektiv-angleichung]
      # HE7 3.3 (Verbparadigma Präsens -ar, -er, -ir); BY Sp8 1.2 (Präsensformen der regelmäßigen Verben); NW S1 Grammatik (Präsensformen der verbos regulares) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: praesens-regelmaessig
        iCan: "Ich kann regelmäßige Verben auf -ar, -er und -ir im Präsens konjugieren."
        gradeBand: "5-6"
        requires: [subjektpronomen]
      # HE7 3.3 (ser (de)); BY Sp8 1.2 (ser; Gebrauch von ser); NW S1 Grammatik (u. a. ser) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: ser
        iCan: "Ich kann ser im Präsens konjugieren und damit sagen, wer jemand ist, woher er kommt und wie er ist."
        gradeBand: "5-6"
        requires: [subjektpronomen]
      # HE7 3.3 (estar); BY Sp8 1.2 (estar; Gebrauch von estar); NW S1 Grammatik (u. a. estar) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: estar
        iCan: "Ich kann estar im Präsens konjugieren und damit sagen, wo etwas ist und wie es jemandem geht."
        gradeBand: "5-6"
        requires: [subjektpronomen]
      # HE7 3.3 (hay); BY Sp8 1.2 (Gebrauch von ser, estar und hay); NW S1 Grammatik (u. a. hay) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: hay
        iCan: "Ich kann mit hay sagen, dass es etwas gibt, und hay von está unterscheiden."
        gradeBand: "5-6"
        requires: [estar, artikel-und-genus]
      # HE7 3.3 (ser, estar); BY Sp8 1.2 (Gebrauch von ser, estar und hay); NW S1 Grammatik (ser, estar) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: ser-oder-estar
        iCan: "Ich kann entscheiden, ob ich ser oder estar brauche (es alto, está cansado)."
        gradeBand: "5-6"
        requires: [ser, estar, adjektiv-angleichung]
      # HE7 3.3 (tener); BY Sp8 1.2 (1. Person von tener; Gruppenverben); NW S1 Grammatik (wichtige unregelmäßige Verben; tener que) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: tener
        iCan: "Ich kann tener im Präsens konjugieren und damit Besitz und Alter angeben (Tengo catorce años)."
        gradeBand: "5-6"
        requires: [praesens-regelmaessig]
      # HE7 3.3 (ir (a), venir (de)); BY Sp8 1.2 (ir; venir); NW S1 Grammatik (u. a. ir) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: ir-praesens
        iCan: "Ich kann ir im Präsens konjugieren und mit a und de Ziel und Herkunft angeben (voy a Madrid, vengo de casa)."
        gradeBand: "5-6"
        requires: [praesens-regelmaessig]
      # HE7 3.3 (hacer, decir, poner, venir); BY Sp8 1.2 (1. Person von saber, hacer, poner, salir, decir …; Verben mit -zco); NW S1 Grammatik (u. a. hacer) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: verben-mit-unregelmaessiger-ich-form
        iCan: "Ich kann Verben mit unregelmäßiger ich-Form im Präsens konjugieren (hago, pongo, salgo, digo, conozco)."
        gradeBand: "5-6"
        requires: [praesens-regelmaessig]
      # HE7 3.3 (Gruppenverben empezar, querer (ie), encontrar, volver (ue)); BY Sp8 1.2 (Gruppenverben e/ie, o/ue, auch jugar); NW S1 Grammatik (Gruppenverben) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: gruppenverben-diphthong
        iCan: "Ich kann Verben mit Stammwechsel e → ie und o → ue im Präsens konjugieren (quiero, puedo, juego)."
        gradeBand: "5-6"
        requires: [praesens-regelmaessig]
      # BY Sp8 1.2 (Gruppenverben e/i); NW S1 Grammatik (Gruppenverben) | HE –; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 2× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: gruppenverben-e-i
        iCan: "Ich kann Verben mit Stammwechsel e → i im Präsens konjugieren (pido, repito, sigo)."
        gradeBand: "5-6"
        requires: [gruppenverben-diphthong]
      # HE7 3.3 (reflexive Verben llamarse, irse); BY Sp8 1.2 (reflexiver Gebrauch von Verben, Stellung der Reflexivpronomen); NW S1 Grammatik (reflexive Verben) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: reflexive-verben
        iCan: "Ich kann reflexive Verben konjugieren und das Reflexivpronomen richtig stellen (me levanto, se llama)."
        gradeBand: "5-6"
        requires: [praesens-regelmaessig]
      # HE7 3.3 (querer als Gruppenverb); BY Sp8 1.2 Wortschatz (querer, preferir + infinitivo; saber/poder); NW S1 Grammatik (modale Hilfsverben, u. a. poder, querer) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: querer-poder-infinitiv
        iCan: "Ich kann mit querer, poder und preferir und einem Infinitiv sagen, was ich will, kann oder lieber mache."
        gradeBand: "5-6"
        requires: [gruppenverben-diphthong]
      # BY Sp8 1.2 Wortschatz (Verpflichtungen: tener que); NW S1 Grammatik (tener que) | HE –; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 2× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: tener-que
        iCan: "Ich kann mit tener que und einem Infinitiv sagen, was jemand tun muss."
        gradeBand: "5-6"
        requires: [tener]
      # HE8 3.3 (Strukturen mit gustar und parecer; a mí no me gusta nada); BY Sp8 1.2 Wortschatz (gustar + infinitivo); NW S1 Grammatik (modale Hilfsverben, u. a. gustar) | HE Jg 8 = LJ 2/4 → 7-8; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 2× 5-6, 2× 7-8 → 5-6 (Gleichstand: die frühere)
      - id: gustar
        iCan: "Ich kann mit gustar, encantar und parecer sagen, was mir und anderen gefällt (me gusta, a él le gustan)."
        gradeBand: "5-6"
        requires: [praesens-regelmaessig]
      # HE7 3.3 (Verlaufsform estamos comiendo); BY Sp8 1.2 (Verlaufsform estar + gerundio); NW S1 Grammatik (estar + gerundio) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 3× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: estar-gerundio
        iCan: "Ich kann mit estar und dem gerundio sagen, was gerade passiert (estoy comiendo)."
        gradeBand: "5-6"
        requires: [estar]
      # HE7 3.3 (de und a, Verbindung zu al und del); BY Sp8 1.2 (Verschmelzung des Artikels mit a und de; Präpositionen) | HE Jg 7 = LJ 1/4 → 5-6; BY Jg 8 = LJ 1/3 → 5-6; NW – | 2× 5-6 → 5-6 (Mehrheit)
      - id: praepositionen-a-und-de
        iCan: "Ich kann die Präpositionen a und de verwenden und mit dem Artikel zu al und del verbinden."
        gradeBand: "5-6"
        requires: [artikel-und-genus]
      # BY Sp8 1.2 (Präpositionen des Ortes; Wortschatz aquí, allí); NW S1 Grammatik (basale Ortsadverbien) | HE –; BY Jg 8 = LJ 1/3 → 5-6; NW S1 = LJ 1-2/4 → 5-6/7-8 | 2× 5-6, 1× 7-8 → 5-6 (Mehrheit)
      - id: ortsangaben
        iCan: "Ich kann mit Präpositionen und Adverbien des Ortes sagen, wo etwas ist (encima de, al lado de, aquí, allí)."
