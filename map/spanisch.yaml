# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Spanisch ist am Gymnasium zweite Fremdsprache (HE und NW ab Jg 7) oder dritte Fremdsprache (BY ab Jg 8;
# HE und NW ab Jg 9). Es gibt keine KMK-Bildungsstandards Spanisch für die Sek I; die KMK-Standards für die erste
# Fremdsprache tragen die Struktur (sprachliche Mittel, interkulturelle Kompetenz), aber keine einzelnen Inhalte.
# Quellenkürzel in den Kommentaren:
#   KMK = Bildungsstandards für die erste Fremdsprache (Englisch/Französisch) ESA/MSA, i. d. F. vom 22.06.2023;
#         LG = Lexiko-Grammatik (S. 18-19), Aussprache und Prosodie (S. 20), IK = Interkulturelle Kompetenz (S. 20).
#   HE  = Lehrplan Spanisch, Gymnasialer Bildungsgang, Jahrgangsstufen 7 bis 13 (Hessen, G9), Spanisch als 2. Fremdsprache;
#         "HE7 3.3" = Jahrgangsstufe 7, Abschnitt 3.3 (2.1 Situationen, 2.2 Themenbereiche, 2.3 Landeskunde, 3.1 Lautlehre,
#         3.2 Wortschatz, 3.3 Grammatik, 3.4 Rechtschreibung, 4 Methoden); HE7 S. 11-14, HE8 S. 15-17, HE9 S. 18-20, HE10 S. 21-22.
#         HE-KC = Kerncurriculum Hessen Sek I Gymnasium, Moderne Fremdsprachen (2023), Kap. 7.4 (Ende Jg 8, 2. FS) und
#         6.1 (Ende 9/10); nur dort gezählt, wo der Lehrplan schweigt.
#   BY  = LehrplanPLUS Bayern Gymnasium, Spanisch (3. Fremdsprache), Fachlehrpläne Sp8 bis Sp10 (Spanisch beginnt in
#         Jg 8; für Jg 5-7 gibt es keinen Fachlehrplan Spanisch); Lernbereiche 1.1 Fertigkeiten, 1.2 sprachliche Mittel,
#         2 Interkulturelle Kompetenzen, 4 Methodische Kompetenzen, 5 Themengebiete.
#   NW  = Kernlehrplan Spanisch Sek I Gymnasium NRW (G9, Heft 3416, 2019), Spanisch als 2. Fremdsprache ab Klasse 7:
#         S1 = erste Stufe (Jg 7/8; Grammatik S. 19, Aussprache S. 19-20, Orthografie S. 20, IK S. 21),
#         S2 = zweite Stufe (Jg 9/10; Grammatik S. 27, Aussprache und Orthografie S. 28, IK S. 29). Die Jahrgänge der
#         Stufen nennt das Schulbeispiel (SiLP 2020), nicht der Kernlehrplan.
# Stimmen HE/BY/NW: HE und BY nach Jahrgang (7, 8 -> 7-8; 9, 10 -> 9-10), NW nach Stufe (S1 7-8, S2 9-10). Zwei von drei
# entscheiden. Gleichstand: die frühere Stufe, außer ein requires liegt in der späteren. Eine Stufe 5-6 gibt es nicht,
# weil der Spanischunterricht in keinem der drei Länder vor Jg 7 beginnt. SCHWACH = schwach belegt (Grund genannt).
# Genaue Titel, Ausgaben und URLs: .vibe/research-spanisch.md.
name: { de: Spanisch, en: Spanish }                # the file name is the subject's id: spanisch
source:
  title: KMK, Bildungsstandards für die erste Fremdsprache (Englisch/Französisch) für den Ersten Schulabschluss und den Mittleren Schulabschluss, Beschluss vom 15.10.2004 und vom 04.12.2003 i.d.F. vom 22.06.2023 (Struktur; Inhalte aus den Lehrplänen Hessen, Bayern und NRW)
  url: https://www.kmk.org/fileadmin/Dateien/veroeffentlichungen_beschluesse/2023/2023_06_22-Bista-ESA-MSA-ErsteFremdsprache.pdf
strands:
  - id: grammatik
    name: { de: Grammatik, en: Grammar }
    competencies:
      # HE7 3.3 (Genus; bestimmter/unbestimmter Artikel); BY Sp8 1.2 (Substantiv; bestimmter und unbestimmter Artikel); NW S1 Grammatik (artículo determinado und indeterminado) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: artikel-und-genus
        iCan: "Ich kann den bestimmten und unbestimmten Artikel (el, la, un, una) richtig verwenden und das Genus eines Nomens erkennen."
        gradeBand: "7-8"
      # HE7 3.3 (Numerus: los amigos, unas amigas); BY Sp8 1.2 (Pluralbildung) | 7-8/7-8/– → 7-8 (Mehrheit)
      - id: plural
        iCan: "Ich kann den Plural von Nomen und Artikeln bilden (los amigos, unas casas)."
        gradeBand: "7-8"
        requires: [artikel-und-genus]
      # HE7 3.3 (Verbparadigma); HE8 3.3 (betonte Personalpronomen); BY Sp8 1.2 (Subjektpronomen inkl. ustedes); NW S1 Grammatik (frequente Pronomina) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: subjektpronomen
        iCan: "Ich kann die Subjektpronomen (yo, tú, él, nosotros, ustedes …) verwenden und weiß, dass man sie oft weglässt."
        gradeBand: "7-8"
      # HE7 3.3 (Struktur des Aussagesatzes); BY Sp8 1.2 (Aussagesatz); NW S1 Grammatik (grundlegende syntaktische Strukturen) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: aussagesatz
        iCan: "Ich kann einfache spanische Aussagesätze in der richtigen Wortstellung bilden."
        gradeBand: "7-8"
        requires: [subjektpronomen]
      # BY Sp8 1.2 (Negation no, nunca, tampoco; Indefinitpronomen nada, nadie); NW S1 Grammatik (Negation) | –/7-8/7-8 → 7-8 (Mehrheit)
      - id: verneinung
        iCan: "Ich kann Sätze mit no, nunca, nada, nadie und tampoco verneinen und weiß, wann man zwei Verneinungswörter braucht."
        gradeBand: "7-8"
        requires: [aussagesatz]
      # HE7 3.3 (Fragesätze mit Fragepronomen, Intonationsfrage); BY Sp8 1.2 (Interrogativpronomen und Fragesatz, auch qué und cuál); NW S1 Grammatik (Fragen formulieren) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: fragesaetze
        iCan: "Ich kann Fragen mit und ohne Fragewort stellen (¿Quién?, ¿Dónde?, ¿Cuándo?, ¿Qué?, ¿Cuál?)."
        gradeBand: "7-8"
        requires: [aussagesatz]
      # HE7 3.3 (Possessivbegleiter mi amiga, tus padres); BY Sp8 1.2 (Possessivbegleiter); NW S1 Grammatik (frequente Pronomina) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: possessivbegleiter
        iCan: "Ich kann mit mi, tu, su, nuestro und vuestro sagen, wem etwas gehört."
        gradeBand: "7-8"
        requires: [subjektpronomen, plural]
      # HE7 3.3 (Demonstrativpronomen este, ese, aquel); BY Sp8 1.2 (Demonstrativpronomen und -begleiter); NW S1 Grammatik (frequente Pronomina) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: demonstrativbegleiter
        iCan: "Ich kann mit este, ese und aquel auf Nahes und Fernes zeigen."
        gradeBand: "7-8"
        requires: [artikel-und-genus]
      # HE9 3.3 (pronombres posesivos tónicos mío, tuyo, suyo); BY Sp9 1.2 (Possessivpronomen) | 9-10/9-10/– → 9-10 (Mehrheit)
      - id: possessivpronomen
        iCan: "Ich kann die betonten Possessivformen (mío, tuyo, suyo) verwenden, zum Beispiel in „Es mío“."
        gradeBand: "9-10"
        requires: [possessivbegleiter]
      # HE10 3.3 (Übersicht: alle indefiniten Pronomen); BY Sp9 1.2 (Indefinitbegleiter cualquier, cada, algún, ningún) | 9-10/9-10/– → 9-10 (Mehrheit)
      - id: indefinitbegleiter
        iCan: "Ich kann algún, ningún, cada, cualquier und otro richtig verwenden."
        gradeBand: "9-10"
        requires: [verneinung]
      # HE7 3.3 (Adjektive und ihre Veränderung, attributiv und prädikativ); BY Sp8 1.2 (Adjektiv); NW S1 Grammatik (Adjektive) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: adjektiv-angleichung
        iCan: "Ich kann Adjektive in Genus und Numerus an das Nomen angleichen (un chico alto, unas chicas altas)."
        gradeBand: "7-8"
        requires: [plural]
      # BY Sp8 1.2 (Stellung hinter dem Substantiv, verkürzte Form bei Voranstellung); NW S1 Grammatik (Adjektive und Adverbien: Stellung) | –/7-8/7-8 → 7-8 (Mehrheit)
      - id: adjektiv-stellung
        iCan: "Ich kann Adjektive richtig stellen und die Kurzformen buen, gran und primer vor dem Nomen verwenden."
        gradeBand: "7-8"
        requires: [adjektiv-angleichung]
      # BY Sp8 1.2 (Adverbien muy und mucho; auch Wortschatz); NW S1 Grammatik (Adverbien) | –/7-8/7-8 → 7-8 (Mehrheit)
      - id: muy-und-mucho
        iCan: "Ich kann muy und mucho richtig unterscheiden (muy bien, mucho tiempo, trabaja mucho)."
        gradeBand: "7-8"
        requires: [adjektiv-angleichung]
      # HE9 3.3 (Adverbien auf -mente, Adverb und Adjektiv); BY Sp9 1.2 (Adverbien auf -mente); NW S1 Grammatik (Adverbien) | 9-10/9-10/7-8 → 9-10 (Mehrheit)
      - id: adverbien-auf-mente
        iCan: "Ich kann Adverbien auf -mente bilden und Adverb und Adjektiv richtig unterscheiden."
        gradeBand: "9-10"
        requires: [adjektiv-angleichung]
      # HE8 3.3 (Steigerung der Adjektive und Vergleich); BY Sp8 1.2 (Komparativ; tan(to) … como); NW S1 Grammatik (Komparativ) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: komparativ
        iCan: "Ich kann mit más … que, menos … que und tan … como vergleichen, auch mit mejor und peor."
        gradeBand: "7-8"
        requires: [adjektiv-angleichung]
      # HE8 3.3 (Steigerung der Adjektive); BY Sp8 1.2 (relativer Superlativ); NW S1 Grammatik (Superlativ) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: superlativ
        iCan: "Ich kann mit el más … und la menos … sagen, wer oder was am meisten oder am wenigsten etwas ist."
        gradeBand: "7-8"
        requires: [komparativ]
      # HE8 3.3 (Elativ auf -ísimo); BY Sp10 1.2 (absoluter Superlativ -ísimo); NW S1 Grammatik (Superlativ) | 7-8/9-10/7-8 → 7-8 (Mehrheit)
      - id: absoluter-superlativ
        iCan: "Ich kann den absoluten Superlativ auf -ísimo bilden (guapísimo, riquísimo)."
        gradeBand: "7-8"
        requires: [adjektiv-angleichung]
      # HE7 3.3 (Verbparadigma Präsens -ar, -er, -ir); BY Sp8 1.2 (Präsensformen der regelmäßigen Verben); NW S1 Grammatik (Präsensformen der verbos regulares) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: praesens-regelmaessig
        iCan: "Ich kann regelmäßige Verben auf -ar, -er und -ir im Präsens konjugieren."
        gradeBand: "7-8"
        requires: [subjektpronomen]
      # HE7 3.3 (ser (de)); BY Sp8 1.2 (ser; Gebrauch von ser); NW S1 Grammatik (u. a. ser) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: ser
        iCan: "Ich kann ser im Präsens konjugieren und damit sagen, wer jemand ist, woher er kommt und wie er ist."
        gradeBand: "7-8"
        requires: [subjektpronomen]
      # HE7 3.3 (estar); BY Sp8 1.2 (estar; Gebrauch von estar); NW S1 Grammatik (u. a. estar) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: estar
        iCan: "Ich kann estar im Präsens konjugieren und damit sagen, wo etwas ist und wie es jemandem geht."
        gradeBand: "7-8"
        requires: [subjektpronomen]
      # HE7 3.3 (hay); BY Sp8 1.2 (Gebrauch von ser, estar und hay); NW S1 Grammatik (u. a. hay) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: hay
        iCan: "Ich kann mit hay sagen, dass es etwas gibt, und hay von está unterscheiden."
        gradeBand: "7-8"
        requires: [estar, artikel-und-genus]
      # HE7 3.3 (ser, estar); BY Sp8 1.2 (Gebrauch von ser, estar und hay); NW S1 Grammatik (ser, estar) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: ser-oder-estar
        iCan: "Ich kann entscheiden, ob ich ser oder estar brauche (es alto, está cansado)."
        gradeBand: "7-8"
        requires: [ser, estar, adjektiv-angleichung]
      # HE7 3.3 (tener); BY Sp8 1.2 (1. Person von tener; Gruppenverben); NW S1 Grammatik (wichtige unregelmäßige Verben; tener que) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: tener
        iCan: "Ich kann tener im Präsens konjugieren und damit Besitz und Alter angeben (Tengo catorce años)."
        gradeBand: "7-8"
        requires: [praesens-regelmaessig]
      # HE7 3.3 (ir (a), venir (de)); BY Sp8 1.2 (ir; venir); NW S1 Grammatik (u. a. ir) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: ir-praesens
        iCan: "Ich kann ir im Präsens konjugieren und mit a und de Ziel und Herkunft angeben (voy a Madrid, vengo de casa)."
        gradeBand: "7-8"
        requires: [praesens-regelmaessig]
      # HE7 3.3 (hacer, decir, poner, venir); BY Sp8 1.2 (1. Person von saber, hacer, poner, salir, decir …; Verben mit -zco); NW S1 Grammatik (u. a. hacer) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: verben-mit-unregelmaessiger-ich-form
        iCan: "Ich kann Verben mit unregelmäßiger ich-Form im Präsens konjugieren (hago, pongo, salgo, digo, conozco)."
        gradeBand: "7-8"
        requires: [praesens-regelmaessig]
      # HE7 3.3 (Gruppenverben empezar, querer (ie), encontrar, volver (ue)); BY Sp8 1.2 (Gruppenverben e/ie, o/ue, auch jugar); NW S1 Grammatik (Gruppenverben) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: gruppenverben-diphthong
        iCan: "Ich kann Verben mit Stammwechsel e → ie und o → ue im Präsens konjugieren (quiero, puedo, juego)."
        gradeBand: "7-8"
        requires: [praesens-regelmaessig]
      # BY Sp8 1.2 (Gruppenverben e/i); NW S1 Grammatik (Gruppenverben) | –/7-8/7-8 → 7-8 (Mehrheit)
      - id: gruppenverben-e-i
        iCan: "Ich kann Verben mit Stammwechsel e → i im Präsens konjugieren (pido, repito, sigo)."
        gradeBand: "7-8"
        requires: [gruppenverben-diphthong]
      # HE7 3.3 (reflexive Verben llamarse, irse); BY Sp8 1.2 (reflexiver Gebrauch von Verben, Stellung der Reflexivpronomen); NW S1 Grammatik (reflexive Verben) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: reflexive-verben
        iCan: "Ich kann reflexive Verben konjugieren und das Reflexivpronomen richtig stellen (me levanto, se llama)."
        gradeBand: "7-8"
        requires: [praesens-regelmaessig]
      # HE7 3.3 (querer als Gruppenverb); BY Sp8 1.2 Wortschatz (querer, preferir + infinitivo; saber/poder); NW S1 Grammatik (modale Hilfsverben, u. a. poder, querer) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: querer-poder-infinitiv
        iCan: "Ich kann mit querer, poder und preferir und einem Infinitiv sagen, was ich will, kann oder lieber mache."
        gradeBand: "7-8"
        requires: [gruppenverben-diphthong]
      # BY Sp8 1.2 Wortschatz (Verpflichtungen: tener que); NW S1 Grammatik (tener que) | –/7-8/7-8 → 7-8 (Mehrheit)
      - id: tener-que
        iCan: "Ich kann mit tener que und einem Infinitiv sagen, was jemand tun muss."
        gradeBand: "7-8"
        requires: [tener]
      # HE8 3.3 (Strukturen mit gustar und parecer; a mí no me gusta nada); BY Sp8 1.2 Wortschatz (gustar + infinitivo); NW S1 Grammatik (modale Hilfsverben, u. a. gustar) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: gustar
        iCan: "Ich kann mit gustar, encantar und parecer sagen, was mir und anderen gefällt (me gusta, a él le gustan)."
        gradeBand: "7-8"
        requires: [praesens-regelmaessig]
      # HE7 3.3 (Verlaufsform estamos comiendo); BY Sp8 1.2 (Verlaufsform estar + gerundio); NW S1 Grammatik (estar + gerundio) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: estar-gerundio
        iCan: "Ich kann mit estar und dem gerundio sagen, was gerade passiert (estoy comiendo)."
        gradeBand: "7-8"
        requires: [estar]
      # HE7 3.3 (de und a, Verbindung zu al und del); BY Sp8 1.2 (Verschmelzung des Artikels mit a und de; Präpositionen) | 7-8/7-8/– → 7-8 (Mehrheit)
      - id: praepositionen-a-und-de
        iCan: "Ich kann die Präpositionen a und de verwenden und mit dem Artikel zu al und del verbinden."
        gradeBand: "7-8"
        requires: [artikel-und-genus]
      # BY Sp8 1.2 (Präpositionen des Ortes; Wortschatz aquí, allí); NW S1 Grammatik (basale Ortsadverbien) | –/7-8/7-8 → 7-8 (Mehrheit)
      - id: ortsangaben
        iCan: "Ich kann mit Präpositionen und Adverbien des Ortes sagen, wo etwas ist (encima de, al lado de, aquí, allí)."
        gradeBand: "7-8"
        requires: [estar, praepositionen-a-und-de]
      # BY Sp8 1.2 (Konjunktionen y/e, o/u, pero, porque, cuando, si + indicativo); NW S1 Grammatik (einfache Konnektoren; cuando- und porque-Satz) | –/7-8/7-8 → 7-8 (Mehrheit)
      - id: konjunktionen
        iCan: "Ich kann Sätze mit y, o, pero, porque, cuando und si verbinden und dabei y zu e und o zu u verändern."
        gradeBand: "7-8"
        requires: [aussagesatz]
      # HE9 3.3 (Relativpronomen que); BY Sp8 1.2 (Relativpronomen que); NW S1 Grammatik (einfache Relativsätze) | 9-10/7-8/7-8 → 7-8 (Mehrheit)
      - id: relativsatz-mit-que
        iCan: "Ich kann einfache Relativsätze mit que bilden (el chico que vive aquí)."
        gradeBand: "7-8"
        requires: [aussagesatz]
      # HE9 3.3 (Relativpronomen lo que); BY Sp9 1.2 (Relativpronomen donde und lo que) | 9-10/9-10/– → 9-10 (Mehrheit)
      - id: relativpronomen-lo-que-donde
        iCan: "Ich kann Relativsätze mit lo que und donde bilden."
        gradeBand: "9-10"
        requires: [relativsatz-mit-que]
      # HE9 3.3 (el que, la que, cuyo); BY Sp10 1.2 (Relativsatz mit el que, quien und Präpositionen) | 9-10/9-10/– → 9-10 (Mehrheit)
      - id: relativpronomen-mit-praeposition
        iCan: "Ich kann Relativsätze mit el que, la que und quien bilden, auch nach einer Präposition (la chica con la que hablo)."
        gradeBand: "9-10"
        requires: [relativpronomen-lo-que-donde]
      # HE8 3.3 (Personalpronomen als direktes Pronomen lo …); BY Sp8 1.2 (pronombre átono: complemento directo); NW S1 Grammatik (frequente Pronomina) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: direkte-objektpronomen
        iCan: "Ich kann die direkten Objektpronomen lo, la, los und las verwenden und richtig stellen."
        gradeBand: "7-8"
        requires: [praesens-regelmaessig, artikel-und-genus]
      # HE8 3.3 (Personalpronomen als indirektes Pronomen le …); BY Sp8 1.2 (pronombre átono: complemento indirecto); NW S1 Grammatik (frequente Pronomina) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: indirekte-objektpronomen
        iCan: "Ich kann die indirekten Objektpronomen me, te, le, nos, os und les verwenden und richtig stellen."
        gradeBand: "7-8"
        requires: [praesens-regelmaessig]
      # HE8 3.3 (betonte Personalpronomen und Hervorhebung: a mí, a él); BY Sp8 1.2 (pronombres tónicos, inkl. conmigo, contigo); NW S1 Grammatik (frequente Pronomina) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: betonte-pronomen
        iCan: "Ich kann die betonten Pronomen nach Präpositionen verwenden (para mí, con él, conmigo, contigo)."
        gradeBand: "7-8"
        requires: [subjektpronomen]
      # BY Sp8 1.2 (Stellung beim konjugierten Verb, Infinitiv und gerundio); NW S2 Grammatik (vor- oder nachgestelltes complemento directo e indirecto) | –/7-8/9-10 → 7-8 (Gleichstand, requires)
      - id: pronomen-bei-infinitiv-und-gerundio
        iCan: "Ich kann Objektpronomen an Infinitiv und gerundio anhängen oder vor das konjugierte Verb stellen (quiero verlo, lo quiero ver)."
        gradeBand: "7-8"
        requires: [direkte-objektpronomen, indirekte-objektpronomen]
      # HE10 3.3 (2 Objektpronomen im Satz und beim Imperativ); BY Sp9 1.2 (Stellung von zwei Objektpronomen inkl. se) | 9-10/9-10/– → 9-10 (Mehrheit)
      - id: zwei-objektpronomen
        iCan: "Ich kann zwei Objektpronomen in einem Satz verwenden und le zu se verändern (se lo doy)."
        gradeBand: "9-10"
        requires: [pronomen-bei-infinitiv-und-gerundio]
      # HE8 3.3 (positive Imperative tú, vosotros); BY Sp8 1.2 (bejahter Aufforderungssatz, 2. Person Singular und Plural); NW S1 Grammatik (affirmativer imperativo) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: imperativ-tu-vosotros
        iCan: "Ich kann den bejahten Imperativ für tú und vosotros bilden (¡habla!, ¡comed!)."
        gradeBand: "7-8"
        requires: [praesens-regelmaessig]
      # HE8 3.3 (¡pon!, ¡ten!, ¡sal!, ¡haz!, ¡ven!, ¡di!); BY Sp8 1.2 (imperativo, auch unregelmäßige Formen); NW S1 Grammatik (affirmativer imperativo) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: imperativ-unregelmaessig
        iCan: "Ich kann die unregelmäßigen Imperative ¡pon!, ¡ten!, ¡sal!, ¡haz!, ¡ven!, ¡di!, ¡ve! und ¡sé! verwenden."
        gradeBand: "7-8"
        requires: [imperativ-tu-vosotros]
      # HE8 3.3 (¡dime!, ¡dile!, ¡hazlo!, ¡ponlo!); BY Sp8 1.2 (Stellung beim bejahten Imperativ) | 7-8/7-8/– → 7-8 (Mehrheit)
      - id: imperativ-mit-pronomen
        iCan: "Ich kann Pronomen an den bejahten Imperativ anhängen und den Akzent richtig setzen (¡dime!, ¡hazlo!, ¡levántate!)."
        gradeBand: "7-8"
        requires: [imperativ-unregelmaessig, direkte-objektpronomen, indirekte-objektpronomen]
      # HE9 3.3 (Pronomen beim negativen Imperativ: no me digas); BY Sp9 1.2 (Aufforderungssatz bejaht und verneint); NW S2 Grammatik (verneinter imperativo) | 9-10/9-10/9-10 → 9-10 (Mehrheit)
      - id: imperativ-verneint
        iCan: "Ich kann den verneinten Imperativ mit den Formen des subjuntivo bilden (¡no hables!, ¡no me digas!)."
