# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Für Kunst gibt es keine KMK-Bildungsstandards (Sek I). Wie bei Musik ist die Quelle Hessen (KD-17). Die
# Stränge sind die Inhaltsbereiche, die Hessen, Bayern und NRW teilen:
#   - die bildnerischen Mittel Farbe, Form/Fläche und Raum (NW IF1, HE KC „Kunstwerk als Form“, HE G9 farbiges und
#     zeichnerisches Gestalten, BY LB1),
#   - die Gestaltungsfelder Zeichnung/Grafik, Plastik, Fotografie/Film/Aktion, Architektur/Design (NW IF3, HE KC
#     „Medien, Techniken und Verfahren“, BY LB1 bis LB3),
#   - die Bildstrategien (NW IF2, HE KC „Strategien der Bilderfindung“),
#   - die Bildbetrachtung (HE KC „Bildbetrachtung“, NW Rezeption, BY Werkanalyse) und
#   - die Kunstgeschichte (HE KC „Epochen, Schlüsselwerke“, HE G9 je Jahrgang eine Epoche, BY je Jahrgang Epochen).
# Prozesskompetenzen sind nicht modelliert.
# Quellenkürzel in den Kommentaren:
#   HE = Hessen. G9 = Lehrplan Kunst, Gymnasialer Bildungsgang, Jahrgangsstufen 5 bis 13, verbindliche Themen 5.1 bis
#        9.3 und Übergangsprofil (ÜP); in Jg 8 und 10 hat Kunst keinen Unterricht. Jg 5, 6 -> "5-6", 7 -> "7-8",
#        9 -> "9-10". KC = Kerncurriculum Hessen Sek I Gymnasium Kunst (2011): Kap. 7.1 (Ende Jg 6) -> "5-6",
#        Kap. 6 (Ende Jg 9/10) -> "7-10". Hessen stimmt mit G9, wo G9 den Inhalt nennt, sonst mit KC.
#   BY = LehrplanPLUS Bayern Gymnasium Kunst, Ku5 bis Ku10; LB1 Bildende Kunst, LB2 Architektur und Produktdesign,
#        LB3 Interaktion, Inszenierung und Kommunikation. „(MuG)“ (nur Musisches Gymnasium) zählt nicht.
#   NW = Kernlehrplan Kunst Sek I Gymnasium NRW (Heft 3405, 2019): E = bis Ende Erprobungsstufe -> "5-6",
#        S = bis Ende Sek I -> "7-10"; IF1 Bildgestaltung, IF2 Bildkonzepte, IF3 Gestaltungsfelder.
# Abstimmung: eine Stimme je Land; "7-10" zählt für 7-8 und 9-10; Gleichstand: requires, sonst die frühere Stufe.
# Ein Vorschlag (Werkliste) ist nur ein Hinweis, keine Stimme. Titel, Ausgaben und URLs: .vibe/research-kunst.md.
name: { de: Kunst, en: Art }                       # the file name is the subject's id: kunst
source:
  title: Kerncurriculum Hessen, Sekundarstufe I - Gymnasium, Kunst (Hessisches Kultusministerium), mit Lehrplan Kunst G9 Hessen; Stränge nach den gemeinsamen Inhaltsbereichen von Hessen, Bayern und Nordrhein-Westfalen
  url: https://kultus.hessen.de/sites/kultus.hessen.de/files/2021-07/kerncurriculum_kunst_gymnasium.pdf
strands:
  - id: farbe
    name: { de: "Farbe", en: "Colour" }
    competencies:
      # HE G9 5.1 Farbdifferenzierung (Mischen, Aufhellen, Abdunkeln); BY Ku5 LB1 Grundlagen zur Farbsystematik; NW E IF1 Farbe: Farbeigenschaften (Farbton, -helligkeit, -sättigung). Stimmen HE/BY/NW: 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: farbeigenschaften
        iCan: { de: "Ich kann Farben nach Farbton, Helligkeit und Sättigung (Leuchtkraft) unterscheiden." }
        gradeBand: "5-6"
      # HE G9 5.1 Farbbezeichnung (Normbezeichnungen, eigene Farbbezeichnungen); NW E IF1 Rezeption: bestimmen Farben hinsichtlich ihrer Qualität. Stimmen HE/BY/NW: 5-6 / – / 5-6 -> 5-6 (Mehrheit)
      - id: farben-benennen
        iCan: { de: "Ich kann Farben genau benennen, mit üblichen Farbnamen und mit eigenen treffenden Namen." }
        gradeBand: "5-6"
        requires: [farbeigenschaften]
      # HE G9 5.1 Farbbezeichnung (Normbezeichnungen), Farbkontraste; BY Ku5 LB1 Grundlagen zur Farbsystematik; Ku10 LB1 Farbbeziehungen nach Itten oder Küppers; NW E IF1 Farbe: Farbbeziehungen. Stimmen HE/BY/NW: 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: farbkreis
        iCan: { de: "Ich kann Grundfarben, Mischfarben erster und zweiter Ordnung im Farbkreis zeigen und ihre Lage erklären." }
        gradeBand: "5-6"
        requires: [farbeigenschaften]
      # HE G9 5.1 Farbdifferenzierung: Mischen, Aufhellen, Abdunkeln, Abstimmen; BY Ku5 LB1 Grundlagen zur Farbsystematik; NW E IF1 Farbe: Farbhelligkeit, Farbsättigung. Stimmen HE/BY/NW: 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: farben-mischen
        iCan: { de: "Ich kann aus wenigen Farben viele Farbtöne mischen und eine Farbe gezielt aufhellen und abdunkeln." }
        gradeBand: "5-6"
        requires: [farbkreis]
      # HE G9 7.1 genaues Mischen von Farbwerten; BY Ku7 LB1 subtraktive Farbmischung; Ku10 LB1 additive und subtraktive Farbmischung. Stimmen HE/BY/NW: 7-8 / 7-8 / – -> 7-8 (Mehrheit)
      - id: subtraktive-farbmischung
        iCan: { de: "Ich kann erklären, warum Malfarben beim Mischen dunkler werden, und mit Cyan, Magenta und Gelb gezielt mischen." }
        gradeBand: "7-8"
        requires: [farben-mischen]
      # HE G9 6.1 Farbverwandtschaften: Farbfamilien durch Beimischen von Schwarz und Weiß, Nachbarfarben; BY Ku10 LB1 Farbbeziehungen; NW E IF1 Farbe: Farbverwandtschaften. Stimmen HE/BY/NW: 5-6 / 9-10 / 5-6 -> 5-6 (Mehrheit)
      - id: farbverwandtschaften
        iCan: { de: "Ich kann Farbfamilien und Nachbarfarben bilden, auch durch Beimischen von Schwarz und Weiß." }
        gradeBand: "5-6"
        requires: [farben-mischen]
      # HE G9 5.1 Wirkung von Farben: Farbkontraste; BY Ku5 LB1 einfache Farbkontraste; Ku7 LB1 Hell-Dunkel-Kontrast, Farbe-an-sich-Kontrast; NW E IF1 Farbe: Farbkontraste, Farbgegensätze. Stimmen HE/BY/NW: 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: farbkontraste
        iCan: { de: "Ich kann an Bildern zeigen, was ein Farbkontrast ist, und den Farbe-an-sich-Kontrast und den Hell-Dunkel-Kontrast erkennen." }
        gradeBand: "5-6"
        requires: [farbeigenschaften]
      # HE G9 5.1 Farbkontraste; BY Ku7 LB1 Komplementärkontrast; NW E IF1 Farbe: Farbkontraste. Stimmen HE/BY/NW: 5-6 / 7-8 / 5-6 -> 5-6 (Mehrheit)
      - id: komplementaerkontrast
        iCan: { de: "Ich kann Komplementärfarben im Farbkreis finden und ihre starke Wirkung im Bild beschreiben." }
        gradeBand: "5-6"
        requires: [farbkreis, farbkontraste]
      # HE G9 5.1 Farbkontraste, charakteristische Farbstimmungen; BY Ku7 LB1 Kalt-Warm-Kontrast; NW E IF1 Farbe: Farbkontraste. Stimmen HE/BY/NW: 5-6 / 7-8 / 5-6 -> 5-6 (Mehrheit)
      - id: kalt-warm-kontrast
        iCan: { de: "Ich kann warme und kalte Farben unterscheiden und ihre Wirkung im Bild beschreiben." }
        gradeBand: "5-6"
        requires: [farbkontraste]
      # BY Ku10 LB1 Farbbeziehungen und Farbkontraste nach Itten oder Küppers; NW S IF1 Farbe: Farbbeziehungen (Farbkontraste). Stimmen HE/BY/NW: – / 9-10 / 7-10 -> 9-10 (Mehrheit)
      - id: weitere-farbkontraste
        iCan: { de: "Ich kann Qualitäts-, Quantitäts- und Simultankontrast an Bildern erkennen und erklären." }
        gradeBand: "9-10"
        requires: [komplementaerkontrast, kalt-warm-kontrast]
      # HE G9 5.1 Farbauftrag und Wirkungsweise: deckendes und lasierendes Malen; BY Ku5 LB1 deckender und lasierender Farbauftrag; NW E IF1 Wirkung des Farbauftrags (deckend, lasierend, pastos). Stimmen HE/BY/NW: 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: farbauftrag
        iCan: { de: "Ich kann deckend, lasierend und pastos malen und die Wirkung des Farbauftrags beschreiben." }
        gradeBand: "5-6"
      # BY Ku5 LB1 selbsthergestellte Farben, Eigenschaften von Pigmenten und Bindemitteln; NW E IF1 Farbauftrag in Abhängigkeit vom Farbmaterial. Stimmen HE/BY/NW: – / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: farbmaterial
        iCan: { de: "Ich kann erklären, dass Malfarbe aus Pigment und Bindemittel besteht, und eine einfache Farbe selbst herstellen." }
        gradeBand: "5-6"
        requires: [farbauftrag]
      # HE G9 5.1 malerische Spur innerer Bewegung; 6.1 Farbauftrag als Ausdrucksmittel (Spritzen, Schmieren, Tupfen, Gießen, Reiben); NW S IF1 unterschiedliche Möglichkeiten des Farbauftrags im Hinblick auf Ausdrucksqualität. Stimmen HE/BY/NW: 5-6 / – / 7-10 -> 5-6 (Gleichstand 5-6/7-8/9-10; requires lässt alle zu, die frühere)
      - id: malspuren
        iCan: { de: "Ich kann Farbe auf verschiedene Weise auftragen, zum Beispiel tupfen, spritzen oder wischen, und die Wirkung der Spuren beschreiben." }
        gradeBand: "5-6"
        requires: [farbauftrag]
      # HE G9 5.1 Wirkung von Farben und Farbkompositionen; 6.1 Farbstimmungen, Farbklänge; BY Ku5 LB1 Farbauftrag sowie einfache Farbkontraste zur Darstellung von Bildmotiven; NW E IF1 Funktion der Farbwahl für eine angestrebte Bildwirkung. Stimmen HE/BY/NW: 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: farbwirkung
        iCan: { de: "Ich kann beschreiben, welche Stimmung Farben und Farbklänge in einem Bild erzeugen." }
        gradeBand: "5-6"
        requires: [farbkontraste]
      # HE G9 7.1 genaues Bestimmen beobachteter Farben, Farbmodulation, Licht; BY Ku10 LB1 Lokalfarbe, Erscheinungsfarbe; NW S IF1 Farbfunktionen (Lokal-, Erscheinungsfarbe). Stimmen HE/BY/NW: 7-8 / 9-10 / 7-10 -> 7-8 (Gleichstand 7-8/9-10; requires lässt beide zu, die frühere)
      - id: lokalfarbe-erscheinungsfarbe
        iCan: { de: "Ich kann die eigene Farbe eines Gegenstands (Lokalfarbe) von der Farbe unterscheiden, die er im Licht zeigt (Erscheinungsfarbe)." }
        gradeBand: "7-8"
        requires: [farben-mischen]
      # HE G9 7.1 Farbe, Farbmodulation, Form, Plastizität; BY Ku8 LB1 malerische Mittel zur Darstellung von Form, Materialität und Beleuchtung; NW S IF1 Licht-Schatten-Modellierung. Stimmen HE/BY/NW: 7-8 / 7-8 / 7-10 -> 7-8 (Mehrheit)
      - id: farbmodulation
        iCan: { de: "Ich kann einen Gegenstand durch fein abgestufte Farbtöne plastisch malen." }
        gradeBand: "7-8"
        requires: [lokalfarbe-erscheinungsfarbe, licht-und-schatten]
      # HE G9 9.1 Farbe als Mittel der Verfremdung, Akzentuierung und der Vermittlung von Stimmungswerten; BY Ku10 LB1 Ausdrucksfarbe; Eigenwert von Farbe; NW S IF1 Farbfunktionen (Ausdrucksfarbe). Stimmen HE/BY/NW: 9-10 / 9-10 / 7-10 -> 9-10 (Mehrheit)
      - id: ausdrucksfarbe
        iCan: { de: "Ich kann Farben unabhängig vom Gegenstand einsetzen, um ein Gefühl auszudrücken (Ausdrucksfarbe)." }
        gradeBand: "9-10"
        requires: [farbwirkung, lokalfarbe-erscheinungsfarbe]
      # HE G9 9.1 Sinnbild und Deutung, sinnbildhafte Darstellungen; BY Ku7 LB1 mittelalterliche Ikonografie: Zuordnung von Farben und Attributen zu Figuren; NW S IF1 Farbfunktionen (Symbolfarbe). Stimmen HE/BY/NW: 9-10 / 7-8 / 7-10 -> 7-8 (Gleichstand 7-8/9-10; requires lässt beide zu, die frühere)
      - id: symbolfarbe
        iCan: { de: "Ich kann erklären, wofür eine Farbe in einem Bild als Zeichen steht, zum Beispiel Blau für Maria (Symbolfarbe)." }
        gradeBand: "7-8"
        requires: [farbwirkung]
  - id: form-flaeche
    name: { de: "Form und Fläche", en: "Form and surface" }
    competencies:
      # HE G9 5.2 Flächen im Wechselspiel: Figur-Grund; BY Ku7 LB3 Klärung von Figur und Grund; NW E IF1 Figur-Grund-Beziehungen. Stimmen HE/BY/NW: 5-6 / 7-8 / 5-6 -> 5-6 (Mehrheit)
      - id: figur-grund
        iCan: { de: "Ich kann Figur und Grund in einem Bild unterscheiden und gezielt gestalten, auch als Positiv- und Negativform." }
        gradeBand: "5-6"
      # HE G9 5.2 Ordnungen, Reihungen, Streuung, Ballung; NW E IF1 Flächenorganisation (Streuung, Reihung, Ballung). Stimmen HE/BY/NW: 5-6 / – / 5-6 -> 5-6 (Mehrheit)
      - id: streuung-reihung-ballung
        iCan: { de: "Ich kann Formen auf einer Fläche streuen, reihen oder ballen und die Wirkung vergleichen." }
        gradeBand: "5-6"
      # HE G9 5.2 Fläche und Umriss, Flächengliederung; BY Ku5 LB1 Platzierung und Größe der Bildgegenstände im Format; Ku6 LB1 Platzierung; NW E IF1 Mittel der Flächenorganisation. Stimmen HE/BY/NW: 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: platzierung-im-format
        iCan: { de: "Ich kann Bildgegenstände bewusst im Format platzieren und ihre Größe so wählen, dass das Wichtige auffällt." }
        gradeBand: "5-6"
        requires: [figur-grund]
      # BY Ku6 LB1 Ansicht, Platzierung und Bildausschnitt; NW E IF3 Fotografie (Narration). Stimmen HE/BY/NW: – / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: bildausschnitt-und-ansicht
        iCan: { de: "Ich kann einen Bildausschnitt und eine Ansicht wählen, die die Wirkung eines Bildes steigern." }
        gradeBand: "5-6"
        requires: [platzierung-im-format]
      # BY Ku9 LB1 Komposition (Bildaufbau); NW S IF1 Ordnungsprinzipien (Symmetrie, Asymmetrie). Stimmen HE/BY/NW: – / 9-10 / 7-10 -> 9-10 (Mehrheit)
      - id: symmetrie-asymmetrie
        iCan: { de: "Ich kann symmetrische und asymmetrische Bildordnungen unterscheiden und ihre Wirkung beschreiben." }
        gradeBand: "9-10"
        requires: [streuung-reihung-ballung]
      # HE G9 9.2 Arrangement, Komposition und Kontext; BY Ku9 LB1 Bildaufbau, Blickachsen, Kompositionslinien; NW S IF1 Richtungsbezüge. Stimmen HE/BY/NW: 9-10 / 9-10 / 7-10 -> 9-10 (Mehrheit)
      - id: richtungen-im-bild
        iCan: { de: "Ich kann Richtungen und Kompositionslinien in einem Bild finden und zeigen, wie sie den Blick lenken." }
        gradeBand: "9-10"
        requires: [symmetrie-asymmetrie]
      # HE G9 5.2 Entwicklung eines Formrepertoires; BY Ku9 LB2 geometrische und florale bzw. organische Formen; NW E IF1 Form: tektonische und organische Formen, Formkontraste und Formverwandtschaften. Stimmen HE/BY/NW: 5-6 / 9-10 / 5-6 -> 5-6 (Mehrheit)
      - id: formeigenschaften
        iCan: { de: "Ich kann geometrische (tektonische) und organische Formen unterscheiden und Formverwandtschaften und Formkontraste erkennen." }
        gradeBand: "5-6"
      # BY Ku6 LB2 Relief, Ornament, Dekor; Ku9 LB2 Muster, Ornament; NW E IF1 Reihung als Mittel der Flächenorganisation. Stimmen HE/BY/NW: – / 5-6 / 5-6 -> 5-6 (Mehrheit). SCHWACH BELEGT: NW nennt nur die Reihung; das Ornament selbst ist nur in BY verbindlich (in HE G9 5.2 fakultativ)
      - id: ornament-und-muster
        iCan: { de: "Ich kann ein Ornament oder Muster aus einer Grundform durch Wiederholen und Spiegeln entwickeln." }
        gradeBand: "5-6"
        requires: [streuung-reihung-ballung, formeigenschaften]
      # HE G9 6.2 Bewegungsdarstellung der zeichnerischen Spur, Auflösung der statischen Ordnung; BY Ku9 LB1 menschliche Figur in Posen und in Bewegung; NW E IF1 Linie als Bewegungsspur. Stimmen HE/BY/NW: 5-6 / 9-10 / 5-6 -> 5-6 (Mehrheit)
      - id: bewegung-darstellen
        iCan: { de: "Ich kann Bewegung auf einer Fläche darstellen, zum Beispiel durch schräge Richtungen, Wiederholung und Bewegungsspuren." }
        gradeBand: "5-6"
        requires: [punkt-und-linie]
  - id: raum
    name: { de: "Raum, Körper und Perspektive", en: "Space, body and perspective" }
    competencies:
      # HE G9 5.2 Flächen im Wechselspiel: Staffelung; BY Ku5 LB1 Trennung von Vordergrund und Hintergrund; NW E IF1 raumillusionierende Mittel auf der Fläche. Stimmen HE/BY/NW: 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: vordergrund-hintergrund
        iCan: { de: "Ich kann in einem Bild Vordergrund, Mittelgrund und Hintergrund trennen." }
        gradeBand: "5-6"
      # HE G9 5.2 Überlagern und teilweises Verdecken, Staffelung; BY Ku6 LB1 Staffelung, Überschneidung; NW E IF1 Überdeckung. Stimmen HE/BY/NW: 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: ueberdeckung
        iCan: { de: "Ich kann durch Überdecken (Überschneiden) und Staffeln Raum auf der Fläche darstellen." }
        gradeBand: "5-6"
        requires: [vordergrund-hintergrund]
      # HE G9 6.2 räumliche Strukturen wie Staffelung; BY Ku6 LB1 Größenverhältnisse; NW E IF1 Größenabnahme. Stimmen HE/BY/NW: 5-6 / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: groessenabnahme
        iCan: { de: "Ich kann Raum darstellen, indem ich Dinge in der Ferne kleiner zeichne." }
        gradeBand: "5-6"
        requires: [vordergrund-hintergrund]
      # BY Ku5 LB1 Platzierung der Bildgegenstände im Format; NW E IF1 Höhenlage. Stimmen HE/BY/NW: – / 5-6 / 5-6 -> 5-6 (Mehrheit)
      - id: hoehenlage
        iCan: { de: "Ich kann Raum darstellen, indem ich Dinge in der Ferne höher im Bild anordne (Höhenlage)." }
        gradeBand: "5-6"
        requires: [vordergrund-hintergrund]
      # HE G9 9.2 Parallel- und Fluchtpunktperspektive im Bildzusammenhang; BY Ku6 LB1 Grundlagen der Parallelperspektive; Ku7 LB1 Parallelperspektive differenziert, auch verschachtelte Formen; NW S IF1 Parallelperspektive. Stimmen HE/BY/NW: 9-10 / 5-6 / 7-10 -> 9-10 (Mehrheit)
      - id: parallelperspektive
        iCan: { de: "Ich kann Körper wie Würfel und Häuser in Parallelperspektive zeichnen." }
        gradeBand: "9-10"
        requires: [ueberdeckung]
      # HE G9 9.2 Fluchtpunktperspektive; BY Ku8 LB1 Zentralperspektive mit Fluchtpunkt, Fluchtlinien und Horizont, Betrachterstandpunkt; NW S IF1 Ein-Fluchtpunktperspektive. Stimmen HE/BY/NW: 9-10 / 7-8 / 7-10 -> 7-8 (Gleichstand 7-8/9-10; requires lässt beide zu, die frühere)
      - id: horizont-und-fluchtpunkt
        iCan: { de: "Ich kann Horizont, Augenhöhe, Fluchtpunkt und Fluchtlinien in einem Bild finden und erklären, wo der Betrachter steht." }
        gradeBand: "7-8"
        requires: [groessenabnahme]
      # HE G9 9.2 Fluchtpunktperspektive im Bildzusammenhang; BY Ku8 LB1 Gesetzmäßigkeiten der Zentralperspektive einsetzen; NW S IF1 Ein-Fluchtpunktperspektive. Stimmen HE/BY/NW: 9-10 / 7-8 / 7-10 -> 7-8 (Gleichstand 7-8/9-10; requires lässt beide zu, die frühere)
      - id: zentralperspektive
        iCan: { de: "Ich kann einen Raum oder eine Straße mit einem Fluchtpunkt zeichnen." }
        gradeBand: "7-8"
        requires: [horizont-und-fluchtpunkt]
      # HE G9 9.2 Fluchtpunktperspektive; NW S IF1 Zwei-Fluchtpunktperspektive. Stimmen HE/BY/NW: 9-10 / – / 7-10 -> 9-10 (Mehrheit)
      - id: zwei-fluchtpunkte
        iCan: { de: "Ich kann einen Körper über Eck mit zwei Fluchtpunkten zeichnen." }
        gradeBand: "9-10"
        requires: [zentralperspektive]
      # HE G9 7.1 Räumlichkeit und Plastizität, Licht; 9.2 Licht / Schatten; BY Ku7 LB1 Lichtwirkung; Ku8 LB1 Beleuchtung; NW S IF1 Licht-Schatten-Modellierung. Stimmen HE/BY/NW: 7-8 / 7-8 / 7-10 -> 7-8 (Mehrheit)
      - id: licht-und-schatten
        iCan: { de: "Ich kann Eigenschatten und Schlagschatten unterscheiden und einen Körper durch Licht und Schatten plastisch wirken lassen." }
        gradeBand: "7-8"
      # HE G9 9.1 Farb- und Luftperspektive: Trübung, Unschärfe, Verblauung, Abnahme der Kontrastintensität; BY Ku10 LB1 Luftperspektive, Unschärfe und Verblauen; NW S IF1 Luftperspektive. Stimmen HE/BY/NW: 9-10 / 9-10 / 7-10 -> 9-10 (Mehrheit)
      - id: luftperspektive
        iCan: { de: "Ich kann Ferne darstellen, indem ich Farben und Kontraste nach hinten blasser, bläulicher und unschärfer werden lasse (Luftperspektive)." }
        gradeBand: "9-10"
        requires: [vordergrund-hintergrund, farbeigenschaften]
      # HE G9 9.1 Farb- und Luftperspektive; BY Ku10 LB1 Farbperspektive; NW S IF1 Farbperspektive. Stimmen HE/BY/NW: 9-10 / 9-10 / 7-10 -> 9-10 (Mehrheit)
      - id: farbperspektive
        iCan: { de: "Ich kann mit warmen Farben vorn und kalten Farben hinten Raumtiefe erzeugen (Farbperspektive)." }
        gradeBand: "9-10"
        requires: [kalt-warm-kontrast, vordergrund-hintergrund]
      # HE G9 6.2 zeichnerisches Präzisieren: Proportionen; BY Ku6 LB1 einfache Proportionsschemata für den menschlichen Körper; NW S IF1 Raum: Proportion. Stimmen HE/BY/NW: 5-6 / 5-6 / 7-10 -> 5-6 (Mehrheit)
      - id: koerperproportionen
        iCan: { de: "Ich kann einen menschlichen Körper nach einem einfachen Proportionsschema zeichnen, zum Beispiel mit Kopfmaßen." }
        gradeBand: "5-6"
      # HE G9 7.2 zeichnerische Untersuchung des menschlichen Kopfes (Grundform, Merkmale, Individualität); BY Ku6 LB1 Proportionsschemata für das Gesicht; NW S IF1 Raum: Proportion. Stimmen HE/BY/NW: 7-8 / 5-6 / 7-10 -> 7-8 (Mehrheit)
      - id: gesichtsproportionen
        iCan: { de: "Ich kann einen Kopf von vorn in seinen Proportionen zeichnen, zum Beispiel mit den Augen auf halber Höhe." }
        gradeBand: "7-8"
        requires: [koerperproportionen]
      # HE G9 9.1 Ausdrucksmerkmale wie Pose, Haltung; BY Ku9 LB1 menschliche Figur in Posen und in Bewegung, perspektivische Verkürzungen. Stimmen HE/BY/NW: 9-10 / 9-10 / – -> 9-10 (Mehrheit)
      - id: figur-in-bewegung
        iCan: { de: "Ich kann eine menschliche Figur in einer Pose oder Bewegung zeichnen, auch mit Verkürzungen." }
        gradeBand: "9-10"
        requires: [koerperproportionen, bewegung-darstellen]
  - id: zeichnung-druck
    name: { de: "Zeichnung und Druckgrafik", en: "Drawing and printmaking" }
    competencies:
