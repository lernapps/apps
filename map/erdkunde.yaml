# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Erdkunde (Geographie), Gymnasium Sek I, Jg 5-10. KMK-Bildungsstandards gibt es für das Fach nicht.
# Quellenkürzel in den Kommentaren:
#   DG = DGfG, Bildungsstandards im Fach Geographie für den Mittleren Schulabschluss, 10. Auflage 2020
#        (F1-F5 Fachwissen S. 13-16, O1-O5 Räumliche Orientierung S. 17-18; S = Standard). Gemeinsamer Bezug,
#        kein verbindlicher Inhalt: die Standards nennen Inhalte nur als Beispiele ("z. B.").
#   HE = Hessen: KC = Kerncurriculum Erdkunde Sek I Gymnasium (nur "Ende 9/10"; Stimme "5-10" zählt für alle Stufen);
#        LP = Lehrplan Erdkunde, gymnasialer Bildungsgang (G9), Jahrgangsstufen 5, 6.1, 6.2, 8, 9.
#   BY = LehrplanPLUS Gymnasium Bayern, Geographie Geo5, Geo7, Geo10 (Lernbereiche LB); Geo11 liegt nach Jg 10.
#   NW = Kernlehrplan Erdkunde Sek I Gymnasium NRW (2019): Stufe 1 = bis Ende Erprobungsstufe (IF1-IF3, 5-6),
#        Stufe 2 = bis Ende Sek I (IF4-IF10, Stimme "7-10"). Das NRW-Umsetzungsbeispiel (SiLP) stimmt nicht mit.
# Stimmen HE/BY/NW -> Richtstufe. Gleichstand: die frühere Stufe, außer requires erzwingt die spätere; liegen die
# Stimmen 5-6 und 9-10 auseinander oder sind alle drei verschieden, die mittlere.
# Genaue Titel, Ausgaben und URLs: .vibe/research-erdkunde.md.
name: { de: Erdkunde, en: Geography }              # the file name is the subject's id: erdkunde
source:
  title: Deutsche Gesellschaft für Geographie (DGfG), Bildungsstandards im Fach Geographie für den Mittleren Schulabschluss, 10. Auflage 2020
  url: https://fachportal.lernnetz.de/files/Inhalte%20der%20Unterrichtsf%C3%A4cher/Geographie/Download%20Center/Bildungsstandards%20SI%20Geographie%202020%20Web.pdf
strands:
  - id: orientierung
    name: { de: "Orientierung und Karten", en: "Spatial orientation and maps" }
    competencies:
      # DG O4 S11, S13; HE LP 5 (Windrose, Kompass); BY Geo5 LB1, LB2 (Himmelsrichtungen); NW Stufe 1 MK1 (orientieren sich vor Ort und mit Karten).
      # Stimmen 5-6/5-6/5-6 -> 5-6 (Mehrheit)
      - id: himmelsrichtungen
        iCan: "Ich kann die Himmelsrichtungen bestimmen, auch mit einem Kompass und mit dem Stand der Sonne."
        gradeBand: "5-6"
      # DG O3 S5; HE LP 5 (Globus, Karte/Atlas); BY Geo5 LB2 (Orientierung mit Globus und Karten); NW Stufe 1 MK1 (mit Karten).
      # Stimmen 5-6/5-6/5-6 -> 5-6 (Mehrheit)
      - id: globus-und-karte
        iCan: "Ich kann erklären, wie eine Karte die Erde verkleinert, vereinfacht und von oben zeigt, und Globus und Karte vergleichen."
        gradeBand: "5-6"
      # DG O3 S5, S6; HE LP 5 (Maßstab und Legende); BY Geo5 LB1 (Einzelzeichen); NW Stufe 1 MK4 (einfache diskontinuierliche Texte auswerten).
      # Stimmen 5-6/5-6/5-6 -> 5-6 (Mehrheit)
      - id: legende
        iCan: "Ich kann eine Karte mit Hilfe der Legende lesen und die Kartenzeichen deuten."
        gradeBand: "5-6"
        requires: [globus-und-karte]
      # DG O3 S5; HE LP 5 (Messen und Zeichnen, Maßstab); BY Geo5 LB1, LB2 (Maßstab und Distanzen); NW –.
      # Stimmen 5-6/5-6/– -> 5-6 (Mehrheit)
      - id: massstab
        iCan: "Ich kann mit dem Maßstab einer Karte Entfernungen messen und berechnen."
        gradeBand: "5-6"
        requires: [globus-und-karte]
      # DG O3 S5 (Verebnung des Reliefs); HE LP 5 (Höhenprofil); BY Geo5 LB1 (Landhöhen), LB2 (Höhendarstellungen); NW –.
      # Stimmen 5-6/5-6/– -> 5-6 (Mehrheit)
      - id: hoehendarstellung
        iCan: "Ich kann Höhen auf einer Karte an Höhenlinien und Höhenschichtfarben ablesen."
        gradeBand: "5-6"
        requires: [legende]
      # DG O3 S8; HE LP 5 (Profilzeichnung Alpen, Höhenprofil); BY Geo5 LB1 (Profilzeichnungen), LB3 (Profile); NW –.
      # Stimmen 5-6/5-6/– -> 5-6 (Mehrheit)
      - id: hoehenprofil
        iCan: "Ich kann aus einer Karte ein einfaches Höhenprofil zeichnen."
        gradeBand: "5-6"
        requires: [hoehendarstellung, massstab]
      # DG O3 S6; HE KC Kap. 6 (topographische, physische, thematische Karten auswerten); BY Geo5 LB1, LB2 (unterscheiden topografische, physische und thematische Karten); NW –.
      # Stimmen 5-10/5-6/– -> 5-6 (Mehrheit)
      - id: kartenarten
        iCan: "Ich kann physische, thematische und topografische Karten unterscheiden und für eine Frage die passende Karte wählen."
        gradeBand: "5-6"
        requires: [legende]
      # DG O3 S6; HE LP 5 (Globus, Karte/Atlas); BY Geo5 LB2 (Einführung in die Atlasarbeit); NW Stufe 1 MK3 (Inhaltsverzeichnis, Register, Planquadrate).
      # Stimmen 5-6/5-6/5-6 -> 5-6 (Mehrheit)
      - id: atlas
        iCan: "Ich kann mit Inhaltsverzeichnis, Register und Planquadraten im Atlas einen Ort finden."
        gradeBand: "5-6"
        requires: [kartenarten]
      # DG O3 S8; HE LP 5 (Schulwegeskizze, Handskizzen); BY Geo5 LB1, LB2 (Kartenskizze); NW Stufe 1 MK6 (Skizzen).
      # Stimmen 5-6/5-6/5-6 -> 5-6 (Mehrheit)
      - id: kartenskizze
        iCan: "Ich kann eine einfache Kartenskizze zeichnen, zum Beispiel von meinem Schulweg."
        gradeBand: "5-6"
        requires: [legende, himmelsrichtungen]
      # DG O3 S9; HE LP 5 (Feldbeobachtungen und -kartierungen); BY Geo5 LB1 (Nutzungskartierungen), LB5 (einfache Formen der Kartierung); NW –.
      # Stimmen 5-6/5-6/– -> 5-6 (Mehrheit)
      - id: kartierung
        iCan: "Ich kann bei einem Gang durch den Ort kartieren, wie Gebäude und Flächen genutzt werden."
        gradeBand: "5-6"
        requires: [kartenskizze, stadtviertel]
      # DG O4 S11–S13; HE KC Kap. 6 (Standort bestimmen, zielgerichtet bewegen); BY Geo5 LB1 (digitale Geomedien), LB5 (orientieren sich mit Karten in städtischen Räumen); NW Stufe 1 MK1 (vor Ort, GPS-basierte Anwendungen).
      # Stimmen 5-10/5-6/5-6 -> 5-6 (Mehrheit)
      - id: standort-und-weg
        iCan: "Ich kann mit einer Karte, Landmarken und einem Smartphone (GPS) meinen Standort bestimmen und einen Weg finden."
        gradeBand: "5-6"
        requires: [himmelsrichtungen, legende]
      # DG O1 S1; HE LP 5 (Kontinente/Ozeane); KC Räumliches Orientierungswissen; BY Geo5 LB2 (Ozeane und Kontinente); NW Stufe 1 SK4 (Orientierungsraster).
      # Stimmen 5-6/5-6/5-6 -> 5-6 (Mehrheit)
      - id: kontinente-und-ozeane
        iCan: "Ich kann die Kontinente und Ozeane benennen und auf dem Globus und der Weltkarte zeigen."
        gradeBand: "5-6"
        requires: [globus-und-karte]
      # DG O1 S1; HE LP 5 (Bundesländer, Hauptstädte); BY Geo5 LB5 (administrative Gliederung); NW –.
      # Stimmen 5-6/5-6/– -> 5-6 (Mehrheit)
      - id: bundeslaender
        iCan: "Ich kann die Bundesländer und ihre Hauptstädte auf einer Karte zeigen."
        gradeBand: "5-6"
        requires: [atlas]
      # DG O1 S1; HE LP 5 (Flüsse, Gebirge, Tiefländer, Becken); BY Geo5 LB3 (naturräumliche Gliederung); NW IF2 (Großlandschaften Deutschlands).
      # Stimmen 5-6/5-6/5-6 -> 5-6 (Mehrheit)
      - id: grosslandschaften-deutschland
        iCan: "Ich kann Deutschland in Norddeutsches Tiefland, Mittelgebirge, Alpenvorland und Alpen gliedern und die großen Flüsse zeigen."
        gradeBand: "5-6"
        requires: [hoehendarstellung]
      # DG O1 S1; HE LP 6.1 (Großräume Europas, Grundkenntnisse über Europa); BY Geo7 LB2, LB3 (Staaten, Teilräume, Großlandschaften); NW IF2 (Großlandschaften Europas).
      # Stimmen 5-6/7-8/5-6 -> 5-6 (Mehrheit)
      # Siehe auch: franzoesisch/frankreich-auf-der-karte
      - id: topographie-europa
        iCan: "Ich kann Europa in Teilräume gliedern und seine Staaten, Hauptstädte, Gebirge, Flüsse und Meere auf einer Karte zeigen."
        gradeBand: "5-6"
        requires: [kontinente-und-ozeane]
      # DG O1 S1; HE LP 9 (weltweites Orientierungsraster, Übergangsprofil); LP 6.2, 8 je ein Kontinent; BY Geo10 LB5–LB7 (topografischer Überblick); NW Stufe 2 Orientierungsraster der IF.
      # Stimmen 9-10/9-10/7-10 -> 9-10 (Mehrheit)
      - id: topographie-welt
        iCan: "Ich kann wichtige Staaten, Gebirge, Flüsse und Wüsten der anderen Kontinente auf einer Karte zeigen."
        gradeBand: "9-10"
        requires: [topographie-europa]
      # DG O1 S2; HE LP 6.2 (Pole, Äquator, 0- und 180-Meridian); BY Geo5 LB1, LB2 (Gradnetz); NW Stufe 2 MK1 (Gradnetzangaben).
      # Stimmen 5-6/5-6/7-10 -> 5-6 (Mehrheit)
      - id: gradnetz
        iCan: "Ich kann das Gradnetz der Erde mit Äquator, Nullmeridian, Breitenkreisen und Längenkreisen beschreiben."
        gradeBand: "5-6"
        requires: [globus-und-karte]
      # DG O2 S4; HE LP 6.2 (Bestimmung von Standortkoordinaten); BY Geo5 LB1 (bestimmen Lage im Gradnetz); NW Stufe 2 MK1 (Gradnetzangaben).
      # Stimmen 5-6/5-6/7-10 -> 5-6 (Mehrheit)
      - id: koordinaten
        iCan: "Ich kann die Lage eines Ortes mit geographischer Breite und Länge angeben und einen Ort zu gegebenen Koordinaten finden."
        gradeBand: "5-6"
        requires: [gradnetz, atlas]
      # DG O2 S3, S4; HE KC Kap. 6 (Lage zu Bezugseinheiten und Orientierungsrastern in Beziehung setzen); BY Geo7 LB3 (Lage im Gradnetz Europas); NW Stufe 2 SK5 (in Orientierungsraster einordnen).
      # Stimmen 5-10/7-8/7-10 -> 7-8 (Mehrheit)
      - id: lage-beschreiben
        iCan: "Ich kann die Lage eines Ortes genau beschreiben: im Gradnetz, auf dem Kontinent und zu Flüssen, Gebirgen und Nachbarländern."
        gradeBand: "7-8"
        requires: [koordinaten, topographie-europa]
      # DG O3 S6; HE KC Kap. 6 (thematische Karten auswerten); BY Geo7 LB1 (werten physische und thematische Karten aus); NW Stufe 2 MK4 (diskontinuierliche Texte auswerten).
      # Stimmen 5-10/7-8/7-10 -> 7-8 (Mehrheit)
      - id: thematische-karte
        iCan: "Ich kann eine thematische Karte zu einer Frage auswerten, zum Beispiel zur Bevölkerungsdichte."
        gradeBand: "7-8"
        requires: [kartenarten]
      # DG O3 S6; HE KC Kap. 6 (Karten konventionell oder Web-GIS); BY Geo7 LB1 (Satellitenbilder, digitale Geomedien); NW Stufe 1 MK3 (digitale Kartenanwendungen); Stufe 2 MK12 (GIS).
      # Stimmen 5-10/7-8/5-6 -> 5-6 (Gleichstand 5-6/7-8, requires entscheidet nicht; nach der Regel die frühere Stufe)
      - id: digitale-karten
        iCan: "Ich kann digitale Karten und Satellitenbilder nutzen, um Orte zu finden und Informationen abzulesen."
        gradeBand: "5-6"
        requires: [kartenarten]
      # DG O3 S7; O5 S16; HE KC Kap. 6 (Raumdarstellungen stets konstruiert; Manipulationsmöglichkeiten); BY Geo7 LB1 (kritisch mit Darstellungen auseinandersetzen); NW Stufe 2 UK4, UK5 (Wirkungsabsicht von Quellen, Raumwahrnehmungen in Medien).
      # Stimmen 5-10/7-8/7-10 -> 7-8 (Mehrheit)
      - id: karten-sind-gemacht
        iCan: "Ich kann an Beispielen zeigen, dass Karten die Welt immer aus einem Blickwinkel darstellen, etwa durch Kartennetz, Ausschnitt oder Farbwahl."
        gradeBand: "7-8"
        requires: [thematische-karte]
      # SCHWACH BELEGT. DG O5 S15; HE KC Kap. 6 (kognitive Karten/mental maps); BY –; NW Stufe 2 UK5 (von Raumwahrnehmungen geleitete Setzung von Themen). Hinweis: NW nennt die Wahrnehmung, nicht die Kopfkarte.
      # Stimmen 5-10/–/7-10 -> 7-8 (Gleichstand 7-8/9-10, requires entscheidet nicht; nach der Regel die frühere Stufe)
      - id: mental-maps
        iCan: "Ich kann an Kopfkarten (Mental Maps) zeigen, dass Menschen denselben Raum verschieden wahrnehmen."
        gradeBand: "7-8"
        requires: [kartenskizze]
  - id: erde
    name: { de: "Planet Erde und Relief", en: "Planet Earth and its landforms" }
    competencies:
      # DG F1 S1, S2; HE LP 5 (Planetennatur der Erde); KC Erde als Planet; BY Geo5 LB2 (Sonnensystem, Einzigartigkeit der Erde); NW IF5 (Himmelskörper Erde).
      # Stimmen 5-6/5-6/7-10 -> 5-6 (Mehrheit)
      - id: sonnensystem
        iCan: "Ich kann die Planeten unseres Sonnensystems ordnen und erklären, warum es Leben nur auf der Erde gibt."
        gradeBand: "5-6"
      # DG F1 S1; HE LP 5 (Planetennatur, Globus); BY Geo5 LB2 (Aufbau und Gestalt der Erde); NW –.
      # Stimmen 5-6/5-6/– -> 5-6 (Mehrheit)
      - id: gestalt-der-erde
        iCan: "Ich kann Form und Größe der Erde beschreiben und sagen, wie viel ihrer Oberfläche Land und wie viel Meer ist."
        gradeBand: "5-6"
        requires: [sonnensystem]
      # DG F1 S2 (Tag und Nacht); HE LP 8 (Rotation, Tellurium); KC Erde als Planet (Rotation); BY –; NW IF5 (Himmelskörper Erde).
      # Stimmen 7-8/–/7-10 -> 7-8 (Mehrheit)
      - id: tag-und-nacht
        iCan: "Ich kann mit der Drehung der Erde um ihre Achse erklären, wie Tag und Nacht entstehen."
        gradeBand: "7-8"
        requires: [gestalt-der-erde]
      # DG F1 S2 (Jahreszeiten); HE LP 8 (Erdachse, Umlaufbahn, Jahreszeiten); KC Erde als Planet; BY –; NW IF5 (Schrägstellung der Erdachse, Jahreszeiten). Hinweis: BY Geo10 LB3 nennt nur das Jahreszeitenklima der Tropen.
      # Stimmen 7-8/–/7-10 -> 7-8 (Mehrheit)
      - id: jahreszeiten
        iCan: "Ich kann mit der Neigung der Erdachse und dem Umlauf der Erde um die Sonne erklären, wie die Jahreszeiten entstehen."
        gradeBand: "7-8"
        requires: [tag-und-nacht]
      # DG F1 S2; HE LP 8 (Zenit, Polarkreise, Wendekreise); BY Geo10 LB3 (globale Strahlungsverhältnisse, Sonneneinstrahlung); NW IF5 (Beleuchtungszonen, Temperaturzonen).
      # Stimmen 7-8/9-10/7-10 -> 7-8 (Gleichstand 7-8/9-10, requires entscheidet nicht; nach der Regel die frühere Stufe)
      - id: beleuchtungszonen
        iCan: "Ich kann Wendekreise und Polarkreise erklären und die Beleuchtungszonen der Erde unterscheiden."
        gradeBand: "7-8"
        requires: [jahreszeiten, gradnetz]
      # DG F1 S1 (Aufbau); HE KC Erde als Planet (Aufbau der Erde); BY Geo5 LB2 (Schalenbau); NW IF4 (Schalenbau der Erde).
      # Stimmen 5-10/5-6/7-10 -> 5-6 (Gleichstand 5-6/7-8/9-10, requires entscheidet nicht; nach der Regel die frühere Stufe)
      - id: schalenbau
        iCan: "Ich kann den Schalenbau der Erde mit Kruste, Mantel und Kern beschreiben."
        gradeBand: "5-6"
        requires: [gestalt-der-erde]
      # DG F2 S5 (Lageveränderung der Platten); HE LP 8 (Plattentektonik); BY Geo7 LB3 (Plattengrenzen); NW IF4 (Plattentektonik).
      # Stimmen 7-8/7-8/7-10 -> 7-8 (Mehrheit)
      - id: plattentektonik
        iCan: "Ich kann erklären, dass die Erdkruste aus Platten besteht, die sich langsam bewegen, und warum sich die Lage der Kontinente verändert hat."
        gradeBand: "7-8"
        requires: [schalenbau]
      # DG F2 S5, S7; HE LP 8 (Plattentektonik); BY Geo7 LB3 (Zusammenhang zwischen Plattengrenzen, Vulkanismus und Erdbeben); NW IF4 (Konvergenz, Divergenz, Subduktion).
      # Stimmen 7-8/7-8/7-10 -> 7-8 (Mehrheit)
      - id: plattengrenzen
        iCan: "Ich kann an Plattengrenzen unterscheiden, ob Platten auseinanderdriften, aufeinander zustoßen und abtauchen (Subduktion) oder aneinander vorbeigleiten."
        gradeBand: "7-8"
        requires: [plattentektonik]
      # DG F2 S4 (Vulkane); HE LP 8 (Vulkanismus); BY Geo7 LB3 (Vulkanismus: Vorkommen und Ursachen); NW IF4 (Vulkanismus).
      # Stimmen 7-8/7-8/7-10 -> 7-8 (Mehrheit)
      - id: vulkanismus
        iCan: "Ich kann den Aufbau eines Vulkans beschreiben und erklären, warum es vor allem an Plattengrenzen Vulkane gibt."
        gradeBand: "7-8"
        requires: [plattengrenzen]
      # DG F2 S4 (Erdbeben); HE LP 8 (Erdbeben); BY Geo7 LB3 (Erdbeben: Vorkommen und Ursachen); NW IF4 (Erd- und Seebeben). Hinweis: Tsunami nur NW (Seebeben).
      # Stimmen 7-8/7-8/7-10 -> 7-8 (Mehrheit)
      - id: erdbeben
        iCan: "Ich kann erklären, wie Erdbeben und Seebeben entstehen, wie man ihre Stärke misst und wie ein Tsunami entsteht."
        gradeBand: "7-8"
        requires: [plattengrenzen]
      # DG F2 S7 (Gebirgsbildung); HE LP 8 (Gebirgsbildung); BY Geo5 LB3 (Alpen: Entstehung); NW –.
      # Stimmen 7-8/5-6/– -> 7-8 (Gleichstand 5-6/7-8; requires plattengrenzen (7-8) schließt 5-6 aus)
      - id: gebirgsbildung
        iCan: "Ich kann erklären, wie Faltengebirge wie die Alpen entstehen, wenn Platten zusammenstoßen."
        gradeBand: "7-8"
        requires: [plattengrenzen]
      # DG F4 S18 (Naturrisiken); HE KC Umwelt-Gesellschaft (naturgeographische Prozesse als Gefahr); BY Geo7 LB3 (Vor- und Nachteile des Lebens in bedrohten Siedlungsräumen); NW IF4 (Leben und Wirtschaften in Risikoräumen).
      # Stimmen 5-10/7-8/7-10 -> 7-8 (Mehrheit)
      - id: leben-in-risikoraeumen
        iCan: "Ich kann erklären, warum Menschen trotz der Gefahr an Vulkanen und in Erdbebengebieten leben, zum Beispiel wegen fruchtbarer Böden, Rohstoffen, Energie und Tourismus."
        gradeBand: "7-8"
        requires: [vulkanismus, erdbeben]
      # DG F4 S20; HE –; BY Geo7 LB3 (Monitoring aktueller Erdbeben und Vulkanaktivitäten); NW IF4 UK (Katastrophenvorsorge, Eindämmung von Naturrisiken).
      # Stimmen –/7-8/7-10 -> 7-8 (Mehrheit)
      - id: katastrophenvorsorge
        iCan: "Ich kann Maßnahmen beschreiben, mit denen sich Menschen vor Erdbeben und Vulkanausbrüchen schützen, zum Beispiel Frühwarnung, Überwachung und erdbebensicheres Bauen."
        gradeBand: "7-8"
        requires: [leben-in-risikoraeumen]
      # DG F2 S7 (Verwitterung); HE LP 8 (Verwitterung, Erosion, Sedimentation); BY Geo5 LB3 (endogene und exogene Prozesse bei der Entstehung von Oberflächenformen); NW –.
      # Stimmen 7-8/5-6/– -> 5-6 (Gleichstand 5-6/7-8; requires: Grundlage von kuestenformen und boden (beide 5-6))
      - id: exogene-kraefte
        iCan: "Ich kann erklären, wie Verwitterung, Abtragung und Ablagerung durch Wasser, Wind und Eis die Erdoberfläche formen."
        gradeBand: "5-6"
      # DG F2 S6 (Bedeutung des Gesteins für den Boden); HE KC Natur/Umwelt (Faktor Boden); BY Geo5 LB1 (Bodenbestimmung), LB4 (Bodeneigenschaft); NW IF3 (Standortfaktor Boden).
      # Stimmen 5-10/5-6/5-6 -> 5-6 (Mehrheit)
      - id: boden
        iCan: "Ich kann erklären, wie aus Gestein durch Verwitterung Boden entsteht und woran man einen fruchtbaren Boden erkennt."
        gradeBand: "5-6"
        requires: [exogene-kraefte]
      # DG F2 S4; HE LP 5 (Gezeiten, Watt, Marsch); BY Geo5 LB3 (Gefährdung des Ökosystems Wattenmeer); NW –.
      # Stimmen 5-6/5-6/– -> 5-6 (Mehrheit)
      - id: gezeiten-und-watt
        iCan: "Ich kann Ebbe und Flut erklären und beschreiben, wie das Wattenmeer entsteht und warum es geschützt wird."
        gradeBand: "5-6"
        requires: [grosslandschaften-deutschland]
      # SCHWACH BELEGT. DG F2 S4, S7; HE LP 5 (Küste am Meer); BY Geo5 LB3 (Küste: Entstehung, Küstenformen); Geo7 LB6 (natürliche Küstenformung); NW –. Hinweis: HE nennt die Küste, nicht die Küstenformen.
      # Stimmen 5-6/5-6/– -> 5-6 (Mehrheit)
      - id: kuestenformen
        iCan: "Ich kann Steilküste und Flachküste unterscheiden und erklären, wie Meer und Wind die Küste formen."
        gradeBand: "5-6"
        requires: [exogene-kraefte]
      # DG F4 S20; HE LP 5 (Küstenschutz, Landgewinnung); BY Geo5 LB3 (Maßnahmen zum Küstenschutz); Geo7 LB6 (anthropogene Küstenformung); NW –.
      # Stimmen 5-6/5-6/– -> 5-6 (Mehrheit)
      - id: kuestenschutz
        iCan: "Ich kann Maßnahmen des Küstenschutzes wie Deiche und Landgewinnung beschreiben."
        gradeBand: "5-6"
        requires: [kuestenformen, gezeiten-und-watt]
      # DG F4 S18; HE LP 5 (Lawine, Bannwald); BY Geo5 LB3 (Alpen: Naturgefahren, Schutzmaßnahmen); NW –.
      # Stimmen 5-6/5-6/– -> 5-6 (Mehrheit)
      - id: naturgefahren-alpen
        iCan: "Ich kann Naturgefahren in den Alpen wie Lawinen, Muren und Hochwasser beschreiben und Schutzmaßnahmen wie den Bannwald nennen."
        gradeBand: "5-6"
        requires: [grosslandschaften-deutschland]
  - id: klima
    name: { de: "Wetter, Klima und Landschaftszonen", en: "Weather, climate and natural zones" }
    competencies:
      # DG F2 S7 (Wettergeschehen); HE LP 6.1, 6.2 (Klimazonen Europas; einfache Messwerterfassung Klimadaten); BY Geo5 LB1, LB4 (Messungen zu Wetterelementen); NW IF2 (Temperatur und Niederschlag); IF5 (Klimaelemente).
      # Stimmen 5-6/5-6/5-6 -> 5-6 (Mehrheit)
      - id: wetter-und-klima
        iCan: "Ich kann Wetter und Klima unterscheiden und die Wetterelemente Temperatur, Niederschlag, Luftdruck und Wind nennen."
        gradeBand: "5-6"
      # DG –; HE LP 6.2 (einfache Messwerterfassung); BY Geo5 LB1 (Messungen zu Temperatur und Niederschlag, Säulendiagramme), LB4; NW –.
      # Stimmen 5-6/5-6/– -> 5-6 (Mehrheit)
      - id: wetter-messen
