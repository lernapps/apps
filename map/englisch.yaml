# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Quellenkürzel in den Kommentaren:
#   KMK = Bildungsstandards für die erste Fremdsprache (Englisch/Französisch) ESA/MSA, i. d. F. vom 22.06.2023;
#         LG = Lexiko-Grammatik, IK = Interkulturelle Kompetenz, TM = Text- und Medienkompetenz, SCHR = Schreiben.
#         Die KMK nennt Bereiche und Niveaus, aber kaum einzelne Inhalte und keine Jahrgänge: Sie trägt die Stränge.
#   HE  = Lehrplan Englisch, Gymnasialer Bildungsgang, Jahrgangsstufen 5 bis 13 (Hessen, G9); "HE7 3.3" = Jahrgangsstufe 7,
#         Abschnitt 3.3 (2.1 Situationen, 2.2 Themenbereiche, 2.3 Landeskunde, 2.4 Lektüren, 3.1 Lautlehre,
#         3.2 Wortschatz, 3.3 Grammatik, 3.4 Rechtschreibung, 4 Methoden). HE-KC = Kerncurriculum Hessen Sek I
#         Gymnasium, Moderne Fremdsprachen (2023), Kap. 6.1 (Ende 9/10) und 7.1 (Ende Jg 6).
#   BY  = LehrplanPLUS Bayern Gymnasium, Englisch (1. Fremdsprache), Fachlehrpläne E5 bis E10; Lernbereiche 1.2 sprachliche
#         Mittel, 2 Interkulturelle Kompetenzen, 3 Text- und Medienkompetenzen, 4 Methodische Kompetenzen, 5 Themengebiete.
#   NW  = Kernlehrplan Englisch Sek I Gymnasium NRW (G9, Heft 3417, 2019): EPS = bis Ende der Erprobungsstufe (Jg 6),
#         S1 = bis Ende der ersten Stufe (Jg 8), S2 = bis Ende der zweiten Stufe (Jg 10); S. = Seite des Hefts.
# Stimmen HE/BY/NW: HE und BY nach Jahrgang, NW nach Stufe (EPS 5-6, S1 7-8, S2 9-10); "5-10" = in mehreren Jahrgängen
# genannt, zählt für jede Stufe. Zwei von drei entscheiden; bei drei verschiedenen die mittlere; bei Gleichstand die
# frühere, außer requires erzwingt die spätere. SCHWACH = weniger als zwei Länder oder ein Land nur allgemein.
# Fremdsprache: Die Richtstufe ist die Stufe im Lehrgang. Englisch beginnt in HE, BY und NW in Jg 5 (6 Lernjahre bis
# Jg 10), die drei Teile des Lehrgangs sind also die Jahrgangsstufen 5-6, 7-8, 9-10. Hielte eine Stufe mehr als die
# Hälfte eines Strangs, ist sie entlang requires verteilt ("verteilt", mit Grund).
# Genaue Titel, Ausgaben und URLs: .vibe/research-englisch.md.
name: { de: Englisch, en: English }                # the file name is the subject's id: englisch
source:
  title: KMK, Bildungsstandards für die erste Fremdsprache (Englisch/Französisch) für den Ersten Schulabschluss und den Mittleren Schulabschluss, Beschluss vom 15.10.2004 und vom 04.12.2003 i.d.F. vom 22.06.2023
  url: https://www.kmk.org/fileadmin/Dateien/veroeffentlichungen_beschluesse/2023/2023_06_22-Bista-ESA-MSA-ErsteFremdsprache.pdf
strands:
  # KMK 2.1 Verfügen über sprachliche Mittel: Lexiko-Grammatik (S. 18 f.)
  - id: grammatik
    name: { de: Grammatik, en: Grammar }
    competencies:
      # HE5 3.3 (to be; Lang- und Kurzformen); BY E5 1.2 (Hilfsverben be, have (got), do); NW EPS (statements, questions, short answers; negations) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: to-be
        iCan: "Ich kann die Formen von „to be“ (am, is, are) in Aussagen, Verneinungen und Fragen verwenden."
        gradeBand: "5-6"
      # HE5 3.3 (to have (got)); BY E5 1.2 (have (got)); NW – | 5-6/5-6/– → 5-6 (Mehrheit)
      - id: have-got
        iCan: "Ich kann mit „have got“ und „has got“ sagen, was jemand hat, und danach fragen."
        gradeBand: "5-6"
      # HE5 3.3 (Subjekt- und Objektformen der Personalpronomen); BY E5 1.2 (Personalpronomen); NW EPS (pronouns) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: personalpronomen
        iCan: "Ich kann die Personalpronomen als Subjekt (I, he, they) und als Objekt (me, him, them) richtig verwenden."
        gradeBand: "5-6"
      # HE5 3.3 (adjektivische Formen der Possessivpronomen); BY E5 1.2 (Possessivbegleiter); NW EPS (determiners) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: possessivbegleiter
        iCan: "Ich kann mit my, your, his, her, its, our und their sagen, wem etwas gehört."
        gradeBand: "5-6"
        requires: [personalpronomen]
      # HE5 3.3 (a/an; the/the+Vokal); BY E5 1.2 (bestimmter/unbestimmter Artikel); NW EPS (articles) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: artikel
        iCan: "Ich kann die Artikel a, an und the richtig verwenden und „the“ vor Vokalen richtig aussprechen."
        gradeBand: "5-6"
      # HE5 3.3 (Singular/Plural); HE6 3.3 (unregelmäßige Plurale); BY E5 1.2 (regelmäßiger/unregelmäßiger Plural); NW EPS (nouns: singular vs. plural) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: plural
        iCan: "Ich kann den Plural von Nomen bilden, auch die unregelmäßigen Formen wie children, men und feet."
        gradeBand: "5-6"
      # HE5 3.3 (’s/s’-genitive; of-genitive); BY E5 1.2 (’s/of-genitive); NW EPS (s-genitive, of-construction) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: genitiv
        iCan: "Ich kann mit dem s-Genitiv (Tom’s bike, the girls’ room) und mit „of“ ausdrücken, wem etwas gehört."
        gradeBand: "5-6"
        requires: [plural]
      # HE5 3.3 (Demonstrativpronomen); BY E5 1.2 (Demonstrativpronomen und -begleiter); NW EPS (determiners) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: demonstrativ
        iCan: "Ich kann this, that, these und those richtig verwenden, um auf Nahes und Fernes zu zeigen."
        gradeBand: "5-6"
        requires: [plural]
      # SCHWACH. HE5 3.3 (there als grammatisches Subjekt); BY –; NW – | 5-6/–/– → 5-6 (festgelegt: nur HE; aufgenommen als direkte Voraussetzung von bild-beschreiben)
      - id: there-is-are
        iCan: "Ich kann mit „there is“ und „there are“ sagen, was es an einem Ort gibt."
        gradeBand: "5-6"
      # HE5 3.3 (Befehl; Bejahung und Verneinung); BY E5 1.2 (Imperative); NW EPS (commands) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: imperativ
        iCan: "Ich kann Aufforderungen und Verbote mit dem Imperativ formulieren (Open the door. Don’t run.)."
        gradeBand: "5-6"
      # HE5 3.3 (S-P-O; Orts-/Zeitangaben); BY E5 1.2 (place – time, S-V-O im Aussagesatz); NW EPS (word order) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: wortstellung
        iCan: "Ich kann Aussagesätze in der Reihenfolge Subjekt – Verb – Objekt bilden und Ortsangaben vor Zeitangaben stellen."
        gradeBand: "5-6"
      # HE5 3.3 (simple present, 3. Person Singular -s); BY E5 1.2 (present tense simple); NW EPS (simple present) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: simple-present
        iCan: "Ich kann im simple present über Gewohnheiten und Tatsachen sprechen und das -s bei he, she, it anhängen."
        gradeBand: "5-6"
        requires: [personalpronomen]
      # HE5 3.3 (Umschreibung mit do bei Verneinungen und Fragen); BY E5 1.2 (Verneinung; Entscheidungsfragen); NW EPS (questions; negations) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: simple-present-fragen
        iCan: "Ich kann im simple present mit do und does Fragen stellen und mit don’t und doesn’t verneinen."
        gradeBand: "5-6"
        requires: [simple-present]
      # HE5 3.3 (wichtige Interrogativpronomen); BY E5 1.2 (Fragen mit Fragewort, whose); NW EPS (questions) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: fragewoerter
        iCan: "Ich kann Fragen mit who, what, where, when, why, how und whose stellen."
        gradeBand: "5-6"
        requires: [simple-present-fragen]
      # HE5 3.3 (who/what-Frage nach dem Subjekt); BY E5 1.2 (Fragen mit who/what (Subjekt/Objekt)); NW – | 5-6/5-6/– → 5-6 (Mehrheit)
      - id: subjektfragen
        iCan: "Ich kann Fragen nach dem Subjekt ohne do bilden (Who lives here?) und von Fragen nach dem Objekt unterscheiden."
        gradeBand: "5-6"
        requires: [fragewoerter]
      # HE –; BY E5 1.2 (einfache Kurzantworten); NW EPS (short answers) | –/5-6/5-6 → 5-6 (Mehrheit)
      - id: kurzantworten
        iCan: "Ich kann auf Ja-Nein-Fragen mit Kurzantworten wie „Yes, I do.“ oder „No, she isn’t.“ antworten."
        gradeBand: "5-6"
        requires: [simple-present-fragen, to-be]
      # HE5 3.3 (Adverbien der Häufigkeit; Stellung); BY E5 1.2 Wortschatz (Häufigkeitsangaben); NW EPS (word order incl. adverbials of frequency) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: adverbien-haeufigkeit
        iCan: "Ich kann Häufigkeitsadverbien wie always, often und never verwenden und an die richtige Stelle im Satz setzen."
        gradeBand: "5-6"
        requires: [simple-present]
      # HE5 3.3 (present progressive); BY E5 1.2 (present tense progressive); NW EPS (present progressive) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: present-progressive
        iCan: "Ich kann im present progressive sagen, was gerade passiert (She is reading.)."
        gradeBand: "5-6"
        requires: [to-be]
      # HE5 3.3 (Kontrastierung mit simple present); BY E5 1.2; E5 5 (erste Einblicke in aspect); NW EPS (simple present, present progressive) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: simple-oder-progressive
        iCan: "Ich kann entscheiden, ob ich simple present oder present progressive brauche, und Signalwörter dafür nutzen."
        gradeBand: "5-6"
        requires: [simple-present, present-progressive, adverbien-haeufigkeit]
      # HE5 3.3 (can, (must), may, should); BY E5 1.2 (can, must, needn’t, mustn’t); NW EPS (modal auxiliaries: can/cannot, may (not), must (not), needn’t, should (not)) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: can-must
        iCan: "Ich kann mit can, can’t, must, mustn’t und needn’t Fähigkeit, Erlaubnis, Pflicht und Verbot ausdrücken."
        gradeBand: "5-6"
      # HE –; BY E5 1.2 Wortschatz (I want / I’d like (you) to); NW EPS (in einfacher Form Wünsche ausdrücken) | –/5-6/5-6 → 5-6 (Mehrheit) Hinweis: NW nennt nur die Sprechabsicht, nicht die Form.
      - id: would-like
        iCan: "Ich kann mit „I’d like …“ und „I’d like you to …“ höflich sagen, was ich möchte."
        gradeBand: "5-6"
      # HE5 3.3 (much; many; few, a few, little, a little, a lot of, lots of); BY E5 1.2 (much, many, a lot of, lots of); NW EPS (quantifiers) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: much-many
        iCan: "Ich kann Mengen mit much, many, a lot of, a few und a little angeben."
        gradeBand: "5-6"
        requires: [plural]
      # HE5 3.3 (bestimmte Mengenangaben: a cup of, a bottle of, a pair of); BY –; NW EPS (quantifiers) | 5-6/–/5-6 → 5-6 (Mehrheit)
      - id: mengen-mit-of
        iCan: "Ich kann Mengen mit Ausdrücken wie a cup of, a bottle of und a pair of angeben."
        gradeBand: "5-6"
        requires: [plural]
      # HE5 3.3 (some); HE6 3.3 (some/any/no); BY E5 1.2 (some, any); NW EPS (determiners, quantifiers) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: some-any
        iCan: "Ich kann some, any und no in Aussagen, Verneinungen und Fragen richtig verwenden."
        gradeBand: "5-6"
      # HE6 3.3 (alle Zusammensetzungen und Ausnahmen); BY E5 1.2 (somebody, anybody, nobody; something, anything, nothing); NW EPS (pronouns) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: somebody-anything
        iCan: "Ich kann Wörter wie somebody, anything, nobody und everywhere richtig verwenden."
        gradeBand: "5-6"
        requires: [some-any]
      # HE8 3.3 (Zusammenschau der wichtigsten Präpositionen); BY E5 1.2 Wortschatz (Zeitangaben); NW EPS (zeitliche Bezüge herstellen) | 7-8/5-6/5-6 → 5-6 (Mehrheit)
      - id: praepositionen-zeit
        iCan: "Ich kann die Präpositionen in, on und at bei Zeitangaben richtig verwenden (on Monday, at 6 o’clock, in July)."
        gradeBand: "5-6"
      # HE5 3.3 (Ortsangaben); HE8 3.3 (Zusammenschau der Präpositionen); BY E5 1.2 Wortschatz (Ortsangaben); NW EPS (räumliche Bezüge herstellen) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: praepositionen-ort
        iCan: "Ich kann mit Präpositionen wie in, on, under, next to und behind sagen, wo etwas ist."
        gradeBand: "5-6"
      # HE5 3.3 (attributiver und prädikativer Gebrauch; Stellung); BY E5 1.2 (beschreiben mit einfachen Mitteln); NW EPS (adjectives) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: adjektive
        iCan: "Ich kann Adjektive vor ein Nomen (a big house) und nach „be“ (The house is big.) stellen."
        gradeBand: "5-6"
      # HE5 3.3 (einfache Konjunktionen when, but, as); HE6 3.3 (so / because); BY E5 1.2 (einfache Nebensätze, v. a. temporal, kausal); NW EPS (compound sentences: and, or, but; adverbial clauses: time, reason, result) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: konjunktionen
        iCan: "Ich kann Sätze mit and, but, or, because, when und so verbinden."
        gradeBand: "5-6"
      # HE –; BY E5 1.2 (Objektsätze mit that); NW EPS (that-clause) | –/5-6/5-6 → 5-6 (Mehrheit)
      - id: that-saetze
        iCan: "Ich kann Gedanken und Aussagen mit einem that-Satz anschließen (I think that …)."
        gradeBand: "5-6"
        requires: [konjunktionen]
      # HE6 3.3 (simple past); BY E5 1.2 (simple past); NW EPS (simple past) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: simple-past
        iCan: "Ich kann im simple past mit regelmäßigen Verben (-ed) von abgeschlossenen Ereignissen erzählen."
        gradeBand: "5-6"
        requires: [simple-present]
      # HE6 3.3 (irregular forms: mind. 70); HE7 (ca. 90); HE8 (ca. 120); BY E5 1.2 Wortschatz (erste unregelmäßige Verben); E9 (die meisten); NW EPS (simple past); S1 (Ablautsystem der irregular verbs) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: unregelmaessige-verben
        iCan: "Ich kann die wichtigsten unregelmäßigen Verben im simple past und als dritte Form (go – went – gone) verwenden."
        gradeBand: "5-6"
        requires: [simple-past]
      # HE6 3.3 (simple past: Frage; Negation); BY E5 1.2 (simple past; Verneinung); NW EPS (simple past; questions; negations) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: simple-past-fragen
        iCan: "Ich kann im simple past mit did Fragen stellen und mit didn’t verneinen."
        gradeBand: "5-6"
        requires: [simple-past, simple-present-fragen]
      # HE6 3.3 (past progressive, Kontrastierung mit simple past); BY E6 1.2 (past tense progressive); NW S1 S. 26 (past progressive) | 5-6/5-6/7-8 → 5-6 (Mehrheit) → 7-8 (verteilt: NW erst in S1; HE6 und BY E6 im 2. Lernjahr; setzt simple past und present progressive voraus, kein Baustein in 5-6 baut darauf auf; 5-6 hielte sonst mehr als die Hälfte des Strangs)
      - id: past-progressive
        iCan: "Ich kann im past progressive sagen, was gerade im Gang war, als etwas anderes passierte (I was reading when …)."
        gradeBand: "7-8"
        requires: [simple-past, present-progressive]
      # HE5 3.3 (be going to); BY E6 1.2 (going-to-future); NW EPS (going to-future) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: going-to
        iCan: "Ich kann mit „going to“ über Pläne und sichere Vorhersagen sprechen."
        gradeBand: "5-6"
        requires: [present-progressive]
      # HE6 3.3 (will-future); BY E6 1.2 (will-future); NW EPS (will-future) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: will-future
        iCan: "Ich kann mit dem will-future Vermutungen, Vorhersagen und spontane Entschlüsse ausdrücken."
        gradeBand: "5-6"
      # HE6 3.3 (Kontrastierung mit going to nur in eindeutigen Fällen); BY E6 1.2 (going-to-future, will-future); NW EPS (will-future, going to-future) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: will-oder-going-to
        iCan: "Ich kann in eindeutigen Fällen entscheiden, ob ich „will“ oder „going to“ brauche."
        gradeBand: "5-6"
        requires: [will-future, going-to]
      # HE6 3.3 (present perfect: resultativer Gebrauch); BY E6 1.2 (present perfect simple: resultativer Gebrauch); NW EPS (present perfect) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: present-perfect
        iCan: "Ich kann im present perfect sagen, was schon passiert ist, auch mit ever, never, already und yet."
        gradeBand: "5-6"
        requires: [unregelmaessige-verben]
      # HE6 3.3 (Kontrastierung mit dem simple past); BY E6 1.2; E7 5 (kontrastive Betrachtung der Tempora); NW EPS (simple past, present perfect) | 5-6/5-6/5-6 → 5-6 (Mehrheit) → 7-8 (verteilt: Ende der Kette simple past → present perfect → Vergleich; HE6 und BY E6/E7 im 2. Lernjahr oder später; kein Baustein in 5-6 baut darauf auf; 5-6 hielte sonst mehr als die Hälfte des Strangs)
      - id: present-perfect-oder-simple-past
        iCan: "Ich kann entscheiden, ob ich present perfect oder simple past brauche, und Signalwörter dafür nutzen."
        gradeBand: "7-8"
        requires: [present-perfect, simple-past]
      # HE6 3.3 (Ausdruck der Dauer; since und for); BY E7 1.2 (present perfect simple / progressive); NW S1 S. 26 (Dauer ausdrücken) | 5-6/7-8/7-8 → 7-8 (Mehrheit)
      - id: since-for
        iCan: "Ich kann mit dem present perfect und since oder for ausdrücken, wie lange etwas schon dauert."
        gradeBand: "7-8"
        requires: [present-perfect]
      # HE8 3.3 (present perfect progressive); BY E7 1.2 (present perfect progressive); NW S1 S. 26 (present perfect progressive) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: present-perfect-progressive
        iCan: "Ich kann im present perfect progressive sagen, dass eine Handlung bis jetzt andauert (I have been waiting for an hour.)."
        gradeBand: "7-8"
        requires: [since-for, present-progressive]
      # HE8 3.3 (past perfect); BY E7 1.2 (past perfect simple); NW S1 S. 26 (past perfect) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: past-perfect
        iCan: "Ich kann im past perfect ausdrücken, dass etwas vor einem anderen Ereignis in der Vergangenheit geschah."
        gradeBand: "7-8"
        requires: [simple-past, present-perfect]
      # HE8 3.3 (Temporalsätze: Zeitenfolge); BY E7 1.2 (Temporalsätze: Zeitenfolge); NW S1 S. 26 (Abfolge von Handlungen ausdrücken) | 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: zeitenfolge-temporalsaetze
        iCan: "Ich kann in Sätzen mit when, after, before und as soon as die Zeiten richtig aufeinander abstimmen."
        gradeBand: "7-8"
        requires: [past-perfect, will-future]
      # HE10 3.3 (present progressive/present simple mit futurischer Bedeutung); BY E6 1.2 (timetable-future); NW S1 S. 26 (ways of talking about the future) | 9-10/5-6/7-8 → 7-8 (drei verschiedene Stimmen: die mittlere)
      - id: present-fuer-zukunft
        iCan: "Ich kann mit present progressive und simple present über feste Verabredungen und Fahrpläne in der Zukunft sprechen."
        gradeBand: "7-8"
        requires: [will-oder-going-to]
      # HE8 3.3 (future II); BY –; NW S2 S. 34 (will-future progressive, will-future perfect) | 7-8/–/9-10 → 7-8 (Gleichstand: die frühere)
      - id: future-progressive-perfect
        iCan: "Ich kann mit „will be doing“ und „will have done“ über Abläufe und Ergebnisse in der Zukunft sprechen."
        gradeBand: "7-8"
        requires: [will-future, present-perfect]
      # HE9 3.3 (past perfect progressive); BY –; NW S2 S. 34 (tense and aspect) | 9-10/–/9-10 → 9-10 (Mehrheit)
      - id: past-perfect-progressive
        iCan: "Ich kann im past perfect progressive ausdrücken, wie lange etwas vor einem Zeitpunkt in der Vergangenheit schon andauerte."
        gradeBand: "9-10"
        requires: [past-perfect, present-perfect-progressive]
      # HE9 3.3 (dynamic and stative verbs); BY –; NW S1 S. 26 (dynamic and stative verbs) | 9-10/–/7-8 → 7-8 (Gleichstand: die frühere)
      - id: dynamic-stative
        iCan: "Ich kann Zustandsverben wie know, like und belong erkennen, die man meist nicht in der Verlaufsform verwendet."
        gradeBand: "7-8"
        requires: [simple-oder-progressive]
      # KMK LG S. 19 (grammatische Strukturen hinreichend korrekt; ESA: Vermischung von Zeitformen als typischer Fehler); HE9, HE10 3.3 (Revision: Zeiten; simple form/progressive form); BY E9 1.2 (Übersicht Tempus/Aspekt; Übersicht Zukunft); E10 (Zeitenfolge); NW S2 S. 34 (tense and aspect) | 9-10/9-10/9-10 → 9-10 (Mehrheit)
      - id: zeiten-ueberblick
        iCan: "Ich kann in einem Text für jede Handlung die passende Zeitform wählen und meine Wahl begründen."
        gradeBand: "9-10"
        requires: [zeitenfolge-temporalsaetze, present-perfect-progressive, present-fuer-zukunft]
      # HE6 3.3 (shall, might, could); BY E6 1.2 (could, may, might, should); NW EPS (may, should); S2 (shall, might) | 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: modalverben-could-might-should
        iCan: "Ich kann mit could, may, might und should Möglichkeiten, Vermutungen und Ratschläge ausdrücken."
        gradeBand: "5-6"
        requires: [can-must]
      # HE6 3.3 (Ersatzformen: have to, be able (allowed) to); BY E6 1.2 (Ersatzformen); NW S1 S. 26 (substitutes for modal auxiliaries) | 5-6/5-6/7-8 → 5-6 (Mehrheit) → 7-8 (verteilt: NW erst in S1; HE6 und BY E6 im 2. Lernjahr; folgt auf can-must und will-future, kein Baustein in 5-6 baut darauf auf; 5-6 hielte sonst mehr als die Hälfte des Strangs)
      - id: modale-ersatzformen
        iCan: "Ich kann die Ersatzformen have to, be able to und be allowed to verwenden, auch in anderen Zeiten."
        gradeBand: "7-8"
        requires: [can-must, will-future]
