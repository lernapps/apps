# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Keine KMK-Bildungsstandards für Ethik; die Stränge sind die Inhaltsbereiche, die die drei Länder teilen
# (Fragenkreise NRW = Inhaltsfelder Hessen, Gegenstandsbereiche Bayern). Quellenkürzel:
# HE = Lehrplan Ethik, Gymnasialer Bildungsgang, Hessen (G9, Jg 5-13): Rahmenthema x.y = Jahrgang x (verbindlich);
#      KC6 / KC8 / KC10 = Kerncurriculum Hessen Sek I Gymnasium Ethik (2011), Inhaltsfelder am Ende von Jg 6 / 8 / 9/10
#      (Kap. 7.1 S. 22-23, 7.2 S. 26-27, Kap. 6 S. 18-19); KC zählt nur, wo der Lehrplan G9 nichts nennt.
# BY = LehrplanPLUS Bayern Gymnasium Ethik, online (Eth5 bis Eth10, LB = Lernbereich).
# NW = Kernlehrplan Praktische Philosophie Sek I NRW (Heft 5017, 2008), Gymnasium: "5/6" (Kap. 4.1) und "7-9" (Kap. 4.2);
#      FK = Fragenkreis, K = Kompetenzerwartung. NRW hat kein Fach Ethik; Praktische Philosophie ist das Ersatzfach.
# Richtstufe: eine Stimme je Land (HE / BY / NW). NW "7-10" = Kap. 4.2 ohne Jahrgang, zählt für 7-8 und 9-10.
# Gleichstand: die früheste Stufe, die requires zulässt. Drei verschiedene Stimmen: die mittlere.
# "schwach" = schwach belegt (Grund im Kommentar). Genaue Titel, Ausgaben und URLs: .vibe/research-ethik.md.
name: { de: Ethik, en: Ethics }                    # the file name is the subject's id: ethik
source:
  title: Kerncurriculum Hessen, Sekundarstufe I – Gymnasium, Ethik (Hessisches Kultusministerium, 2011), Inhaltsfelder; abgeglichen mit den Fragenkreisen des Kernlehrplans Praktische Philosophie NRW (2008) und dem LehrplanPLUS Ethik Bayern
  url: https://kultus.hessen.de/sites/kultus.hessen.de/files/2021-06/kerncurriculum_ethik_gymnasium.pdf
strands:
  - id: ich-und-identitaet
    name: { de: "Ich und Identität", en: "Self and identity" }
    competencies:
      # HE KC6 Selbst und Welt: eigene und fremde Gefühle (S. 22); BY Eth5 LB1: grundlegende Gefühle wahrnehmen und benennen; eigene und fremde Gefühle; NW 5/6 FK1 Ich und mein Leben; K: erkennen und benennen ihre Gefühle (S. 27). Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: gefuehle-benennen
        iCan: "Ich kann grundlegende Gefühle bei mir und bei anderen erkennen und benennen."
        gradeBand: "5-6"
      # HE 5.1 Freiheit I: Nahrung, Kleidung, Wohnung; persönliche Zuwendung und soziale Einbindung; BY Eth5 LB1: Grundbedürfnisse, materielle und soziale Bedürfnisse; NW 5/6 FK1 Ich und mein Leben. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: beduerfnisse-unterscheiden
        iCan: "Ich kann materielle und soziale Grundbedürfnisse des Menschen unterscheiden und Beispiele nennen."
        gradeBand: "5-6"
      # HE 6.4 Menschenbilder I: Selbstdisziplin gegen Instinkt, Verzicht aus freier Entscheidung; BY Eth5 LB1: Genuss und Bedürfnisaufschub; NW –. Stimmen 5-6 / 5-6 / –: Mehrheit
      - id: beduerfnisaufschub
        iCan: "Ich kann abwägen, wann es sich lohnt, auf die sofortige Erfüllung eines Wunsches zu verzichten."
        gradeBand: "5-6"
        requires: [beduerfnisse-unterscheiden]
      # HE 5.4 Wahrheit I: Selbst- und Fremdwahrnehmung; KC8 Selbst- und Fremdwahrnehmung; BY Eth5 LB1: Fremd- und Selbstwahrnehmung; Eth7 LB3; Eth9 LB4: Selbstbild und Fremdbild; NW 5/6 FK1 Ich und mein Leben; K: beschreiben die eigene Rolle in sozialen Kontexten (S. 27). Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: selbstbild-und-fremdbild
        iCan: "Ich kann mein Bild von mir selbst mit dem Bild vergleichen, das andere von mir haben."
        gradeBand: "5-6"
        requires: [gefuehle-benennen]
      # HE 6.4 Menschenbilder I: Wo liegen meine Stärken? Wo kann ich besser werden?; 8.1: Umgang mit Schwächen und Stärken; BY Eth7 LB3: eigene Stärken und Schwächen, angemessenes Selbstwertgefühl; NW 5/6 FK1 Ich und mein Leben; K: benennen die eigenen Stärken (S. 27). Stimmen 5-6 / 7-8 / 5-6: Mehrheit
      - id: staerken-und-schwaechen
        iCan: "Ich kann meine Stärken und Schwächen benennen und überlegen, worin ich besser werden kann."
        gradeBand: "5-6"
        requires: [selbstbild-und-fremdbild]
      # HE –; BY Eth6 LB4: vielfältige Freizeitgestaltung, reale Begegnung, Freizeit mit wenig Geld; NW 5/6 FK1 Freizeit, freie Zeit. Stimmen – / 5-6 / 5-6: Mehrheit
      - id: freizeit-gestalten
        iCan: "Ich kann beurteilen, wie ich meine freie Zeit sinnvoll und abwechslungsreich gestalten kann."
        gradeBand: "5-6"
        requires: [beduerfnisse-unterscheiden]
      # HE KC8 Selbst und Welt: Genderthematik, Entwicklung des Ichbewusstseins (S. 26); BY Eth7 LB3: Veränderungen in der Pubertät, Entwicklung der Sexualität; NW 7-9 FK1 Geschlechtlichkeit und Pubertät. Stimmen 7-8 / 7-8 / 7-10: Mehrheit
      - id: pubertaet
        iCan: "Ich kann körperliche, seelische und soziale Veränderungen in der Pubertät beschreiben."
        gradeBand: "7-8"
      # HE 8.1 Gewissen und Identität II: Anerkennungen und Abgrenzungen, Unterscheidung des Ich von den anderen; BY Eth7 LB3: Identitätsbildung und Unsicherheit; NW 7-9 FK2 Rollen- und Gruppenverhalten; K: reflektieren den Wert der eigenen Persönlichkeit in Beziehung zu anderen (S. 30). Stimmen 7-8 / 7-8 / 7-10: Mehrheit
      - id: identitaet
        iCan: "Ich kann erklären, wie sich meine Identität im Jugendalter durch Anerkennung und Abgrenzung bildet."
        gradeBand: "7-8"
        requires: [selbstbild-und-fremdbild, pubertaet]
      # HE 6.4 Menschenbilder I: Rollenverhalten von Mädchen und Jungen; KC8 Genderthematik; BY Eth8 LB3: Geschlechterrollen in Freundschaft und Partnerschaft; NW 7-9 FK1 Geschlechtlichkeit und Pubertät. Stimmen 5-6 / 7-8 / 7-10: Mehrheit
      - id: geschlechterrollen
        iCan: "Ich kann Rollenbilder von Mädchen und Jungen erkennen und prüfen, ob sie Menschen einengen."
        gradeBand: "7-8"
        requires: [pubertaet]
      # HE 6.2 Liebe I: Freundschaft im Zwiespalt zwischen Vernunft und Gefühl; BY Eth7 LB2: Strategien zur Selbstkontrolle von Wut; Eth9 LB3: Ursachen von Wut; NW 7-9 FK1 Gefühl und Verstand; K: entwickeln bei starken Gefühlen einen rationalen Standpunkt (S. 30). Stimmen 5-6 / 7-8 / 7-10: Mehrheit
      - id: gefuehl-und-verstand
        iCan: "Ich kann beschreiben, wie Gefühl und Verstand mein Handeln lenken, und bei starken Gefühlen wie Wut überlegt reagieren."
        gradeBand: "7-8"
        requires: [gefuehle-benennen]
      # HE 6.4 Menschenbilder I: Bedeutung von Idolen und Vorbildern; 8.1: Idole, Vorbilder, Autoritäten; BY Eth7 LB3: Ideale, Idole; Eth8 LB2: Vorbilder im Einsatz für andere; NW 7-9 FK2 Rollen- und Gruppenverhalten. Stimmen 5-6 / 7-8 / 7-10: Mehrheit
      - id: vorbilder-und-idole
        iCan: "Ich kann beurteilen, welchen Einfluss Idole und Vorbilder auf mich haben."
        gradeBand: "7-8"
        requires: [identitaet]
      # HE 9.1 Freiheit III: Selbstfindung und Selbstbestimmung, Individualität und Konformitätsdruck; BY Eth7 LB3: eigene und fremde Lebensentwürfe; NW 5/6 FK1 Ich und mein Leben. Stimmen 9-10 / 7-8 / 5-6: dreifach uneins: Mitte
      - id: lebensentwuerfe
        iCan: "Ich kann eigene und fremde Lebensentwürfe vergleichen und überlegen, wer ich werden will."
        gradeBand: "7-8"
        requires: [staerken-und-schwaechen]
      # HE 8.1 Gewissen und Identität II: Sucht, Selbstzweifel und Selbstakzeptanz, Umgang mit Drogen; BY Eth8 LB1: Sinnfindung als Prävention von Sucht; Eth6 LB2: Suchtgefahr digitaler Medien; NW –. Stimmen 7-8 / 7-8 / –: Mehrheit
      - id: sucht
        iCan: "Ich kann Ursachen und Folgen von Sucht beschreiben und Wege nennen, mich davor zu schützen."
        gradeBand: "7-8"
        requires: [identitaet]
      # HE 5.1 Freiheit I: Der Mensch lebt in Abhängigkeiten (von natürlichen Ressourcen, anderen Menschen, Tradition); BY Eth5 LB2: fundamentale Bedeutung der Familie für Entwicklung; NW 5/6 FK2 Der Mensch in der Gemeinschaft. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: abhaengigkeit-des-menschen
        iCan: "Ich kann zeigen, wie ein Mensch zum Leben auf andere Menschen und auf die Natur angewiesen ist."
        gradeBand: "5-6"
        requires: [beduerfnisse-unterscheiden]
      # HE 7.1 Freiheit II: Freiheit hat ihre Grenze an der Freiheit des anderen (GG Art. 2); KC8 Perspektiven und Grenzen von Freiheit; BY Eth7 LB3: Zusammenhang von Freiheit und moralischer Verantwortung; Eth6 LB3: Selbstentfaltung und Selbstbegrenzung; NW 7-9 FK1 Freiheit und Unfreiheit. Stimmen 7-8 / 7-8 / 7-10: Mehrheit
      - id: freiheit-und-ihre-grenzen
        iCan: "Ich kann erklären, warum meine Freiheit an der Freiheit der anderen ihre Grenze findet."
        gradeBand: "7-8"
        requires: [abhaengigkeit-des-menschen]
      # HE 9.1 Freiheit III: Freiheit gründet in der Personalität; KC10 Freiheit und Würde: Handlungs- und Willensfreiheit (S. 19); BY –; NW 7-9 FK1 Freiheit und Unfreiheit. Stimmen 9-10 / – / 7-10: Mehrheit
      - id: handlungsfreiheit-und-willensfreiheit
        iCan: "Ich kann Handlungsfreiheit und Willensfreiheit unterscheiden und fragen, ob der Mensch wirklich frei entscheidet."
        gradeBand: "9-10"
        requires: [freiheit-und-ihre-grenzen]
  - id: zusammenleben
    name: { de: "Die Anderen und das Zusammenleben", en: "Others and living together" }
    competencies:
      # HE 5.1 Freiheit I: Familie (Geburt, Kindheit, Erwachsenwerden, Alter); KC6 Familie und Schule; BY Eth5 LB2: verschiedene Familienformen, Bedeutung der Familie; NW 5/6 FK2 Der Mensch in der Gemeinschaft. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: familienformen
        iCan: "Ich kann verschiedene Familienformen beschreiben und erklären, was eine Familie für Kinder leistet."
        gradeBand: "5-6"
        requires: [abhaengigkeit-des-menschen]
      # HE 5.2 Würde I: Pflichten in Familie und Schule; BY Eth5 LB2: Rechte und Pflichten von Eltern und Kindern, Aufgabenverteilung; NW 5/6 FK2 Der Mensch in der Gemeinschaft. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: rechte-und-pflichten-in-der-familie
        iCan: "Ich kann Rechte und Pflichten von Eltern und Kindern nennen und eine faire Aufgabenverteilung in der Familie begründen."
        gradeBand: "5-6"
        requires: [familienformen]
      # HE 6.2 Liebe I: Einfühlung, Empathie; BY Eth5 LB2: versetzen sich in das Erleben anderer Familienangehöriger; NW 5/6 K: unterscheiden verschiedene Perspektiven (S. 28); FK2 Der Mensch in der Gemeinschaft. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: perspektivwechsel
        iCan: "Ich kann mich in die Lage eines anderen Menschen versetzen und beschreiben, wie er eine Situation erlebt."
        gradeBand: "5-6"
        requires: [gefuehle-benennen]
      # HE 6.2 Liebe I: Streit, Konflikt und Friedensschluss; BY Eth5 LB2: gutes Zuhören und Ich-Botschaften; Eth7 LB2: konstruktive Kommunikation in Konflikten; NW 5/6 FK2 Umgang mit Konflikten; K: hören anderen im Gespräch zu (S. 28). Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: zuhoeren-und-ich-botschaften
        iCan: "Ich kann gut zuhören und in einem Streit Ich-Botschaften verwenden."
        gradeBand: "5-6"
        requires: [perspektivwechsel]
      # HE 6.2 Liebe I: Freund, Gegner, Feind; Bekannte, Spielkameraden, Freunde; falsche Freundschaften; BY Eth6 LB3: Toleranz, Solidarität und Freundschaft; NW 7-9 FK2 Freundschaft, Liebe und Partnerschaft. Stimmen 5-6 / 5-6 / 7-10: Mehrheit
      - id: freundschaft
        iCan: "Ich kann Merkmale einer echten Freundschaft nennen und sie von Bekanntschaft und falscher Freundschaft unterscheiden."
        gradeBand: "5-6"
        requires: [perspektivwechsel]
      # HE 6.2 Liebe I: eigennützige und uneigennützige Freundschaft; BY Eth8 LB3: Aristoteles, die drei Arten der Freundschaft; NW 7-9 FK2 Freundschaft, Liebe und Partnerschaft. Stimmen 5-6 / 7-8 / 7-10: Mehrheit
      - id: arten-der-freundschaft
        iCan: "Ich kann mit Aristoteles Freundschaften um des Nutzens, der Freude oder des Guten willen unterscheiden."
        gradeBand: "7-8"
        requires: [freundschaft]
      # HE 8.2 Liebe II: Liebe bezieht sich auf die ganze Person; Achtung der geliebten Person; BY Eth8 LB3: Verliebtheit und Liebe, Bindung und Verantwortung; NW 7-9 FK2 Freundschaft, Liebe und Partnerschaft. Stimmen 7-8 / 7-8 / 7-10: Mehrheit
      - id: liebe-und-partnerschaft
        iCan: "Ich kann Verliebtheit und Liebe unterscheiden und erklären, welche Verantwortung zu einer Partnerschaft gehört."
        gradeBand: "7-8"
        requires: [arten-der-freundschaft, pubertaet]
      # HE 8.2 Liebe II: Liebe, Eros, Agape, Karitas; BY Eth8 LB3: Merkmale von Liebe, Erich Fromm: Die Kunst des Liebens; NW 7-9 FK2 Freundschaft, Liebe und Partnerschaft. Stimmen 7-8 / 7-8 / 7-10: Mehrheit
      - id: formen-der-liebe
        iCan: "Ich kann verschiedene Formen der Liebe unterscheiden, zum Beispiel Eros, Freundesliebe und Nächstenliebe (Agape)."
        gradeBand: "7-8"
        requires: [liebe-und-partnerschaft]
      # HE 8.2 Liebe II: Sexualität bedarf einer auf freier Entscheidung, Respekt und Verantwortung beruhenden Partnerschaft; BY Eth8 LB3: Sexualität als menschliches Grundbedürfnis und Ausdruck erfüllter Liebe; NW 7-9 FK1 Geschlechtlichkeit und Pubertät. Stimmen 7-8 / 7-8 / 7-10: Mehrheit
      - id: sexualitaet-und-verantwortung
        iCan: "Ich kann erklären, warum Sexualität auf freier Entscheidung, Respekt und Verantwortung beruhen muss."
        gradeBand: "7-8"
        requires: [liebe-und-partnerschaft]
      # HE 8.2 Liebe II: Heterosexualität und Homosexualität; BY Eth8 LB3: Arten von sexueller Orientierung; NW 7-9 FK1 Geschlechtlichkeit und Pubertät. Stimmen 7-8 / 7-8 / 7-10: Mehrheit
      - id: sexuelle-orientierung
        iCan: "Ich kann verschiedene sexuelle Orientierungen benennen und begründen, warum jeder Mensch darin Respekt verdient."
        gradeBand: "7-8"
        requires: [sexualitaet-und-verantwortung, menschenwuerde]
      # HE 10.2 Liebe III: Ehe/Partnerschaft als Lebens- und Rechtsform; nichteheliche und gleichgeschlechtliche Partnerschaften; BY Eth8 LB3: partnerschaftliche Lebensformen heute; NW 7-9 FK2 Freundschaft, Liebe und Partnerschaft. Stimmen 9-10 / 7-8 / 7-10: Gleichstand 7-8/9-10; requires (liebe-und-partnerschaft, recht-und-moral: 7-8): früheste passende Stufe 7-8
      - id: ehe-und-lebensformen
        iCan: "Ich kann Ehe und andere Formen der Partnerschaft als Lebens- und Rechtsformen vergleichen."
        gradeBand: "7-8"
        requires: [liebe-und-partnerschaft, recht-und-moral]
      # HE 8.1 Gewissen und Identität II: Wir-Gefühl und Außenseitertum; BY Eth6 LB3: Gründe für Außenseiter, Möglichkeiten, Außenseiter zu integrieren; NW 5/6 FK2 Der Mensch in der Gemeinschaft. Stimmen 7-8 / 5-6 / 5-6: Mehrheit
      - id: aussenseiter
        iCan: "Ich kann Gründe nennen, warum jemand zum Außenseiter wird, und Wege zeigen, ihn in die Gruppe einzubeziehen."
        gradeBand: "5-6"
        requires: [perspektivwechsel]
      # HE 8.1 Gewissen und Identität II: Wahrnehmung der eigenen Rolle in Familie, Schule und unter Freunden; BY –; NW 7-9 FK2 Rollen- und Gruppenverhalten; 5/6 K: beschreiben die eigene Rolle in sozialen Kontexten. Stimmen 7-8 / – / 7-10: Mehrheit
      - id: soziale-rollen
        iCan: "Ich kann die Rollen beschreiben, die ich in Familie, Schule und Freundeskreis einnehme, und Erwartungen an diese Rollen prüfen."
        gradeBand: "7-8"
        requires: [selbstbild-und-fremdbild]
      # HE 8.1 Gewissen und Identität II: Chancen und Gefährdungen durch die Gruppe; 9.1: Konformitätsdruck; BY Eth7 LB3: Peergroup, Gruppenzwang; Eth6 LB4: Gruppenzwang beim Konsum; NW 7-9 FK2 Rollen- und Gruppenverhalten. Stimmen 7-8 / 7-8 / 7-10: Mehrheit
      - id: gruppendruck
        iCan: "Ich kann erklären, wie Gruppendruck wirkt, und Möglichkeiten nennen, ihm zu widerstehen."
        gradeBand: "7-8"
        requires: [soziale-rollen, identitaet]
      # HE 8.1 Gewissen und Identität II: Merkmale, Entstehung, Folgen und Abbau von Vorurteilen und Ausgrenzungen; BY Eth5 LB1: Vorurteil und Stereotyp; NW 7-9 FK2 Begegnung mit Fremden; FK6 Vorurteil, Urteil, Wissen. Stimmen 7-8 / 5-6 / 7-10: Mehrheit
      - id: vorurteile
        iCan: "Ich kann an Beispielen erklären, wie Vorurteile und Stereotype entstehen und was sie bei den Betroffenen bewirken."
        gradeBand: "7-8"
        requires: [urteil-und-vorurteil]
      # HE 7.4 Wahrheit II: Toleranz als Gleichgültigkeit oder als Wertschätzung der Verschiedenheit; Grenzen der Toleranzbereitschaft; BY Eth6 LB3: Toleranz; NW 7-9 FK2 Begegnung mit Fremden, Interkulturalität; K: gehen tolerant damit um (S. 31). Stimmen 7-8 / 5-6 / 7-10: Mehrheit
      - id: toleranz
        iCan: "Ich kann erklären, was Toleranz bedeutet und wo die Grenzen der Toleranz liegen."
        gradeBand: "7-8"
        requires: [vorurteile]
      # HE 8.1 Gewissen und Identität II: das Fremde als Belastung und als Bereicherung; KC6 Wahrnehmung der eigenen sowie fremder Kulturen; BY Eth6 LB3: der Andere als der Unbekannte, der Andere als Bereicherung; NW 5/6 K: beschreiben Beispiele interkulturellen Zusammenlebens (S. 28); 7-9 FK2 Interkulturalität. Stimmen 7-8 / 5-6 / 5-6: Mehrheit
      - id: interkulturelles-zusammenleben
        iCan: "Ich kann Beispiele für das Zusammenleben von Menschen verschiedener Kulturen beschreiben und Chancen und Probleme dabei erörtern."
        gradeBand: "5-6"
        requires: [perspektivwechsel]
      # HE 7.1 Freiheit II: Normalität von Interessenkonflikten in Schule und Gesellschaft; BY Eth7 LB2: Ursachen von Konflikten, Konflikte als Chance; NW 5/6 FK2 Umgang mit Konflikten. Stimmen 7-8 / 7-8 / 5-6: Mehrheit
      - id: konfliktursachen
        iCan: "Ich kann Ursachen von Konflikten benennen, zum Beispiel unterschiedliche Interessen, Wahrnehmungen und Erwartungen."
        gradeBand: "7-8"
        requires: [wahrnehmung-ist-subjektiv]
      # HE 7.1 Freiheit II: gewaltfreie Konfliktlösungen, Kompromissbereitschaft; KC10 Konflikte verantwortungsvoll lösen; BY Eth7 LB2: ein Konfliktlösungsmodell; Scheinlösungen; NW 5/6 FK2 Umgang mit Konflikten; K: üben Wege gewaltfreier Konfliktlösung ein (S. 28). Stimmen 7-8 / 7-8 / 5-6: Mehrheit
      - id: konflikte-gewaltfrei-loesen
        iCan: "Ich kann einen Konflikt Schritt für Schritt mit einem Konfliktlösungsmodell gewaltfrei lösen."
        gradeBand: "7-8"
        requires: [konfliktursachen, zuhoeren-und-ich-botschaften]
      # HE 7.2 Würde II: Diskriminierung und Ausgrenzung; 8.1: Ausgrenzungen; BY Eth7 LB2: Mobbing, Rollenverteilung, Cybermobbing; NW 7-9 FK3 Gewalt und Aggression. Stimmen 7-8 / 7-8 / 7-10: Mehrheit
      - id: mobbing
        iCan: "Ich kann erklären, wie Mobbing und Cybermobbing auf Betroffene wirken, welche Rollen es dabei gibt und wie man Mobbing beendet."
        gradeBand: "7-8"
        requires: [aussenseiter, konflikte-gewaltfrei-loesen]
      # HE 7.1 Freiheit II: Ursachen von und Umgang mit Gewalt; Gewalt als Eingriff in Würde und Freiheit; BY Eth9 LB3: Ursachen und Wahrnehmung aggressiver Verhaltensweisen, verbale Deeskalation; NW 7-9 FK3 Gewalt und Aggression. Stimmen 7-8 / 9-10 / 7-10: Gleichstand 7-8/9-10; requires (konfliktursachen, gefuehl-und-verstand: 7-8): früheste passende Stufe 7-8
      - id: gewalt-und-aggression
        iCan: "Ich kann Ursachen von Gewalt und aggressivem Verhalten beschreiben und Wege zur Deeskalation nennen."
        gradeBand: "7-8"
        requires: [konfliktursachen, gefuehl-und-verstand]
      # HE 5.1 Freiheit I: Kooperations- und Solidargemeinschaft, Kranken- und Altersfürsorge; BY Eth8 LB2: Engagement in Schule, vor Ort und global; Ehrenamt; NW 7-9 K: lernen Bereiche sozialer Verantwortung kennen (S. 31); FK3 Freiheit und Verantwortung. Stimmen 5-6 / 7-8 / 7-10: Mehrheit
      - id: soziales-engagement
        iCan: "Ich kann Formen sozialen Engagements in Schule, Wohnort und Welt beschreiben und ihren Nutzen beurteilen."
        gradeBand: "7-8"
        requires: [abhaengigkeit-des-menschen]
  - id: gutes-handeln
    name: { de: "Gutes Handeln: Werte, Normen und Gewissen", en: "Acting well: values, norms and conscience" }
    competencies:
      # HE 6.1 Gewissen und Identität I: Das Gute und das Böse; Gut und Böse im Urteil der Schülerinnen und Schüler; BY –; NW 5/6 FK3 „Gut“ und „böse“. Stimmen 5-6 / – / 5-6: Mehrheit
      - id: gut-und-boese
        iCan: "Ich kann an Beispielen erklären, was Menschen gut oder böse nennen und warum sie das tun."
        gradeBand: "5-6"
      # HE 5.2 Würde I: Pflichten gegen andere: Wahrhaftigkeit, Wohlwollen, Achtung, Fairness, Dankbarkeit; BY Eth5 LB2: Entscheidungskriterien (z. B. Verantwortlichkeit, Gerechtigkeit); NW 5/6 K: erfassen den Handlungen zugrunde liegenden Werte und vergleichen diese (S. 28). Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: werte-erkennen
        iCan: "Ich kann erkennen, welche Werte hinter einer Handlung stehen, zum Beispiel Ehrlichkeit, Hilfsbereitschaft oder Gerechtigkeit."
        gradeBand: "5-6"
        requires: [gut-und-boese]
      # HE 8.4 Menschenbilder II: Unterscheidung von Regeln und ethischen Normen; KC: Recht basiert auf Normen, Moral bezieht sich auf Werte; BY Eth5 LB1: Zusammenhang von Bedürfnissen und Regeln; NW 7-9 K: erfassen ethische und politische Grundbegriffe; begründen kriteriengeleitet Werthaltungen (S. 31). Stimmen 7-8 / 5-6 / 7-10: Mehrheit
      - id: werte-und-normen
        iCan: "Ich kann Werte und Normen unterscheiden und erklären, wie Normen aus Werten folgen."
        gradeBand: "7-8"
