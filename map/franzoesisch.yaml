# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Französisch als zweite Fremdsprache am Gymnasium (G9): Beginn in Jg 6 (BY) oder Jg 7 (HE, NW).
# Quellenkürzel: KMK = Bildungsstandards für die erste Fremdsprache (Englisch/Französisch) ESA/MSA i. d. F. vom 22.06.2023
#   (nennt Kompetenzbereiche, keine einzelnen sprachlichen Mittel; Seitenangaben der PDF; TMK = Text- und Medienkompetenz);
# HE = Lehrplan Französisch, Gymnasialer Bildungsgang Jg 5-13, Hessen, Teil B 2 „Französisch als 2. Fremdsprache“
#   (Jg 7-10, S. 33-44), dazu KC = Kerncurriculum Hessen Moderne Fremdsprachen Sek I Gymnasium (2023);
# BY = LehrplanPLUS Bayern Gymnasium, Französisch (2. Fremdsprache), F6-F10, Lernbereiche 1 Kommunikative Kompetenzen,
#   2 Interkulturelle Kompetenzen, 3 Text- und Medienkompetenzen (TMK), 5 Themengebiete;
# NW = Kernlehrplan NRW Sek I Gymnasium Französisch (Heft 3410, 2019), Französisch als zweite Fremdsprache:
#   S1 = erste Stufe (A2), S2 = zweite Stufe (B1); Hinweis: SiLP = Beispiel für einen schulinternen Lehrplan (2020),
#   stimmt nicht mit.
# Richtstufe = Abschnitt des Lehrgangs, nicht der Jahrgang. Jede Stimme wird zum Lernjahr y; bei n Lernjahren geht y in
#   Drittel ⌊3·(y − ½)/n⌋ + 1 (1 → 5-6, 2 → 7-8, 3 → 9-10). HE: Jg 7-10, n = 4 (Jg 7 → 5-6, Jg 8 und 9 → 7-8,
#   Jg 10 → 9-10; KC Ende Jg 8 → 5-6, 7-8; KC Ende Jg 10 und Übergangsprofil → alle drei). BY: Jg 6-10, n = 5
#   (Jg 6 und 7 → 5-6, Jg 8 → 7-8, Jg 9 und 10 → 9-10). NW: Jg 7-10 ohne Jahrgänge; S1 = Lernjahre 1-2 → 5-6, 7-8;
#   S2 = Lernjahre 3-4 → 7-8, 9-10. Zwei von drei entscheiden, bei drei verschiedenen die mittlere; Gleichstand → frühere
#   Stufe, außer requires erzwingt die spätere. Hält eine Stufe mehr als die Hälfte eines Strangs, wandern Bausteine
#   entlang requires in die nächste Stufe („verteilt“). Titel, Ausgaben, URLs und Entscheidungen:
#   .vibe/research-franzoesisch.md.
name: { de: Französisch, en: French }               # the file name is the subject's id: franzoesisch
source:
  title: KMK, Bildungsstandards für die erste Fremdsprache (Englisch/Französisch) für den Ersten Schulabschluss und den Mittleren Schulabschluss, Beschluss vom 15.10.2004 und vom 04.12.2003 i.d.F. vom 22.06.2023
  url: https://www.kmk.org/fileadmin/Dateien/veroeffentlichungen_beschluesse/2023/2023_06_22-Bista-ESA-MSA-ErsteFremdsprache.pdf
strands:
  - id: grammatik
    name: { de: "Grammatik", en: "Grammar" }
    competencies:
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Pronomen: verbundene Personalpronomen; BY F6 Grammatik: pronoms personnels sujets; NW –.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / – -> 5-6 (Mehrheit)
      - id: subjektpronomen
        iCan: "Ich kann die Subjektpronomen je, tu, il, elle, on, nous, vous, ils und elles verwenden."
        gradeBand: "5-6"
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Verben: être; BY F6 Grammatik: verbes irréguliers « être »; NW S1 Grammatik (S. 19): frequente unregelmäßige Verben.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / S1 → 5-6, 7-8 -> 5-6 (Mehrheit)
      - id: verb-etre
        iCan: "Ich kann das Verb être im Präsens konjugieren und damit Personen und Dinge vorstellen (c’est, il est)."
        gradeBand: "5-6"
        requires: [subjektpronomen]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Verben: avoir; BY F6 Grammatik: « avoir »; F6 Methoden: il y a; NW S1 Grammatik (S. 19): frequente unregelmäßige Verben.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / S1 → 5-6, 7-8 -> 5-6 (Mehrheit)
      - id: verb-avoir
        iCan: "Ich kann das Verb avoir im Präsens konjugieren und Wendungen wie il y a und j’ai 13 ans verwenden."
        gradeBand: "5-6"
        requires: [subjektpronomen]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Substantive: best. Artikel; BY F6 Grammatik: article défini; NW – (Hinweis: SiLP UV 7.2).
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / – -> 5-6 (Mehrheit)
      - id: bestimmter-artikel
        iCan: "Ich kann den bestimmten Artikel le, la, l’ und les richtig vor ein Nomen setzen."
        gradeBand: "5-6"
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Substantive: unbest. Artikel; BY F6 Grammatik: article indéfini; NW – (Hinweis: SiLP UV 7.1).
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / – -> 5-6 (Mehrheit)
      - id: unbestimmter-artikel
        iCan: "Ich kann den unbestimmten Artikel un, une und des verwenden."
        gradeBand: "5-6"
        requires: [bestimmter-artikel]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Substantive (sg. und pl.); BY F6 Grammatik: singulier et pluriel du substantif; NW –.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / – -> 5-6 (Mehrheit)
      - id: plural-der-nomen
        iCan: "Ich kann den Plural regelmäßiger Nomen bilden und weiß, dass man das Plural-s meist nicht hört."
        gradeBand: "5-6"
        requires: [bestimmter-artikel]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 8 Substantive: wichtige Besonderheiten der Pluralbildung; BY F6 Wortschatz: unregelmäßige Pluralformen (animal/animaux, cadeau/x, jeu/x); F7 (bateau/x …); NW –.
      # Stimmen HE/BY/NW Jg 8 → 7-8 / Jg 6 → 5-6 / – -> 5-6 (Gleichstand 5-6/7-8, frühere Stufe)
      - id: plural-besonderheiten
        iCan: "Ich kann besondere Pluralformen bilden, zum Beispiel animal – animaux, cadeau – cadeaux, jeu – jeux."
        gradeBand: "5-6"
        requires: [plural-der-nomen]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Substantive: Verbindungen von Präpositionen und Begleiter (z. B. au); BY F6 Grammatik: article contracté; NW –.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / – -> 5-6 (Mehrheit)
      - id: zusammengezogener-artikel
        iCan: "Ich kann à und de mit dem bestimmten Artikel zusammenziehen: au, aux, du, des."
        gradeBand: "5-6"
        requires: [bestimmter-artikel]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Substantive: Possessivbegleiter; BY F6 Grammatik: déterminants possessifs; NW – (Hinweis: SiLP UV 7.3).
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / – -> 5-6 (Mehrheit)
      - id: possessivbegleiter
        iCan: "Ich kann mit mon, ma, mes, ton, ta, tes, son, sa, ses, notre, votre und leur sagen, wem etwas gehört."
        gradeBand: "5-6"
        requires: [bestimmter-artikel]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Substantive: Demonstrativbegleiter; BY F6 Grammatik: déterminants démonstratifs; NW –.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / – -> 5-6 (Mehrheit)
      - id: demonstrativbegleiter
        iCan: "Ich kann mit ce, cet, cette und ces auf etwas zeigen."
        gradeBand: "5-6"
        requires: [bestimmter-artikel]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 8 Substantive: Teilungsartikel (fakultativ schon Jg 7; Jg 9 article partitif); BY F7 Grammatik: article partitif; NW –.
      # Stimmen HE/BY/NW Jg 8 → 7-8 / Jg 7 → 5-6 / – -> 5-6 (Gleichstand 5-6/7-8, frühere Stufe)
      - id: teilungsartikel
        iCan: "Ich kann mit dem Teilungsartikel du, de la und de l’ eine unbestimmte Menge angeben, zum Beispiel du pain."
        gradeBand: "5-6"
        requires: [zusammengezogener-artikel]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Substantive: Mengenangaben; BY F6 Wortschatz: un peu de / beaucoup de / combien de; F7 Grammatik: expression de la quantité + « de »; NW –.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / – -> 5-6 (Mehrheit)
      - id: mengenangaben-mit-de
        iCan: "Ich kann Mengen mit de angeben, zum Beispiel beaucoup de, un kilo de, pas de."
        gradeBand: "5-6"
        requires: [teilungsartikel]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Pronomen: Indefinitpronomen tout; BY F7 Grammatik: adjectif indéfini « tout »; NW –.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 7 → 5-6 / – -> 5-6 (Mehrheit)
      - id: tout
        iCan: "Ich kann tout, toute, tous und toutes richtig angleichen und verwenden."
        gradeBand: "5-6"
        requires: [bestimmter-artikel]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Adjektive: Angleichung nach Numerus und Genus; BY F6 Grammatik: adjectifs fréquents; NW – (Hinweis: SiLP UV 7.6).
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / – -> 5-6 (Mehrheit)
      - id: adjektiv-angleichung
        iCan: "Ich kann ein Adjektiv in Geschlecht und Zahl an sein Nomen angleichen."
        gradeBand: "5-6"
        requires: [plural-der-nomen]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Adjektive: Grundregeln zur Stellung; BY F6 Grammatik: adjectifs fréquents + place; NW –.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / – -> 5-6 (Mehrheit)
      - id: adjektiv-stellung
        iCan: "Ich kann Adjektive richtig vor oder hinter das Nomen stellen, zum Beispiel un petit chat noir."
        gradeBand: "5-6"
        requires: [adjektiv-angleichung]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 8 Adjektive: unregelmäßige Bildung; BY F6 Grammatik: adjectifs fréquents (+ place); NW –.
      # Stimmen HE/BY/NW Jg 8 → 7-8 / Jg 6 → 5-6 / – -> 5-6 (Gleichstand 5-6/7-8, frühere Stufe); verteilt nach 7-8 (grammatik hielt nach den Stimmen 50 von 88 Bausteinen in 5-6). SCHWACH BELEGT: BY nennt nur „adjectifs fréquents“, nicht ausdrücklich die unregelmäßigen
      - id: adjektive-unregelmaessig
        iCan: "Ich kann unregelmäßige Adjektive wie beau, nouveau, vieux, blanc und long bilden."
        gradeBand: "7-8"
        requires: [adjektiv-stellung]
      # KMK Lexiko-Grammatik (MSA: breites Spektrum sprachlicher Mittel); HE Jg 8 Adjektive: Steigerung, Vergleich; BY F7 Grammatik: comparatif et superlatif de l’adjectif; NW S2 Grammatik (S. 28): Komparativ und Superlativ von Adjektiven und Adverbien.
      # Stimmen HE/BY/NW Jg 8 → 7-8 / Jg 7 → 5-6 / S2 → 7-8, 9-10 -> 7-8 (Mehrheit)
      - id: adjektiv-steigerung
        iCan: "Ich kann Adjektive steigern und vergleichen, auch mit bon – meilleur."
        gradeBand: "7-8"
        requires: [adjektiv-angleichung]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 8 Adverbien: Bildung der abgeleiteten Adverbien; BY F8 Grammatik: adverbes en « -ment », « -emment », « -amment », « -ément »; NW –.
      # Stimmen HE/BY/NW Jg 8 → 7-8 / Jg 8 → 7-8 / – -> 7-8 (Mehrheit)
      - id: adverb-bildung
        iCan: "Ich kann Adverbien auf -ment, -emment und -amment aus Adjektiven bilden."
        gradeBand: "7-8"
        requires: [adjektiv-angleichung]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 8 Adverbien: Adjektiv vs. Adverb; BY F8 Grammatik: emplois fréquents des adverbes; NW –.
      # Stimmen HE/BY/NW Jg 8 → 7-8 / Jg 8 → 7-8 / – -> 7-8 (Mehrheit)
      - id: adjektiv-oder-adverb
        iCan: "Ich kann entscheiden, ob ich ein Adjektiv oder ein Adverb brauche, zum Beispiel bon oder bien."
        gradeBand: "7-8"
        requires: [adverb-bildung]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 9 Adverbien: Steigerung der Adverbien – Vergleich; unregelmäßige Adverbbildungen; BY F8 Grammatik: adverbes … + comparatif/superlatif; NW S2 Grammatik (S. 28): Komparativ und Superlativ von … Adverbien.
      # Stimmen HE/BY/NW Jg 9 → 7-8 / Jg 8 → 7-8 / S2 → 7-8, 9-10 -> 7-8 (Mehrheit)
      - id: adverb-steigerung
        iCan: "Ich kann Adverbien steigern und vergleichen, auch mit bien – mieux."
        gradeBand: "7-8"
        requires: [adverb-bildung, adjektiv-steigerung]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Substantive: das Nomen als complément d’objet direct / indirect; BY F6 Grammatik: complément d’objet direct + indirect; F8 Sprachreflexion: Verbvalenzen; NW –.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / – -> 5-6 (Mehrheit)
      - id: direktes-und-indirektes-objekt
        iCan: "Ich kann im Satz das direkte Objekt und das indirekte Objekt mit à erkennen."
        gradeBand: "5-6"
        requires: [aussagesatz-wortstellung]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Pronomen: Objektpronomen me, te, nous, vous, le, la, les (Formen und Stellung); BY F6 Grammatik: pronoms objets directs + place, aussi devant infinitif; NW –.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / – -> 5-6 (Mehrheit)
      - id: direkte-objektpronomen
        iCan: "Ich kann ein direktes Objekt durch le, la, les, me, te, nous oder vous ersetzen und richtig stellen, auch vor einem Infinitiv."
        gradeBand: "5-6"
        requires: [direktes-und-indirektes-objekt, subjektpronomen]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 8 Pronomen: Objektpronomen lui, leur; BY F7 Grammatik: pronoms objets indirects + place, aussi devant infinitif; NW –.
      # Stimmen HE/BY/NW Jg 8 → 7-8 / Jg 7 → 5-6 / – -> 5-6 (Gleichstand 5-6/7-8, frühere Stufe); verteilt nach 7-8 (grammatik hielt nach den Stimmen 50 von 88 Bausteinen in 5-6)
      - id: indirekte-objektpronomen
        iCan: "Ich kann ein indirektes Objekt durch lui oder leur ersetzen und richtig stellen."
        gradeBand: "7-8"
        requires: [direkte-objektpronomen]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Pronomen: unverbundene Personalpronomen; Jg 8: betontes Personalpronomen; BY F7 Grammatik: pronoms personnels disjoints; NW –.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 7 → 5-6 / – -> 5-6 (Mehrheit)
      - id: unverbundene-personalpronomen
        iCan: "Ich kann die betonten Pronomen moi, toi, lui, elle, nous, vous, eux und elles verwenden, zum Beispiel nach Präpositionen."
        gradeBand: "5-6"
        requires: [subjektpronomen]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 8 Pronomen: Adverbialpronomen en; BY F7 Grammatik: « en » partitif; NW – (Hinweis: SiLP UV 7.6).
      # Stimmen HE/BY/NW Jg 8 → 7-8 / Jg 7 → 5-6 / – -> 5-6 (Gleichstand 5-6/7-8, frühere Stufe); verteilt nach 7-8 (grammatik hielt nach den Stimmen 50 von 88 Bausteinen in 5-6)
      - id: pronomen-en-mengen
        iCan: "Ich kann mit en eine Menge ersetzen, zum Beispiel J’en prends deux."
        gradeBand: "7-8"
        requires: [mengenangaben-mit-de, direkte-objektpronomen]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 8 Pronomen: Adverbialpronomen y; BY F9 Grammatik: pronoms adverbiaux « y » / « en »; NW – (Hinweis: SiLP UV 8.6).
      # Stimmen HE/BY/NW Jg 8 → 7-8 / Jg 9 → 9-10 / – -> 7-8 (Gleichstand 7-8/9-10, frühere Stufe)
      - id: pronomen-y
        iCan: "Ich kann mit y einen Ort oder eine Ergänzung mit à ersetzen, zum Beispiel J’y vais."
        gradeBand: "7-8"
        requires: [indirekte-objektpronomen]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 8 Pronomen: Adverbialpronomen en; Stellung aller Objekt- und Adverbialpronomen; BY F9 Grammatik: pronoms adverbiaux « y » / « en »; NW –.
      # Stimmen HE/BY/NW Jg 8 → 7-8 / Jg 9 → 9-10 / – -> 7-8 (Gleichstand 7-8/9-10, frühere Stufe)
      - id: pronomen-en-ergaenzung
        iCan: "Ich kann mit en eine Ergänzung mit de ersetzen, zum Beispiel J’en parle."
        gradeBand: "7-8"
        requires: [pronomen-en-mengen]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 8 Verben: reflexive Verben; Pronomen: Reflexivpronomen (fakultativ schon Jg 7); BY F7 Grammatik: verbes pronominaux (présent, futur proche, impératif); NW –.
      # Stimmen HE/BY/NW Jg 8 → 7-8 / Jg 7 → 5-6 / – -> 5-6 (Gleichstand 5-6/7-8, frühere Stufe)
      - id: reflexive-verben
        iCan: "Ich kann reflexive Verben wie se lever im Präsens, im futur composé und im Imperativ verwenden."
        gradeBand: "5-6"
        requires: [verben-auf-er, direkte-objektpronomen]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Satz: bejahter Aussagesatz, Grundregeln der Wortstellung im Aussagesatz; BY F6 Methoden: S-V-O; F6 Themengebiete: Sprachreflexion Satzstellung; NW S1 Grammatik (S. 19): bejahte und verneinte Aussage-, Frage- und Aufforderungssätze.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / S1 → 5-6, 7-8 -> 5-6 (Mehrheit)
      - id: aussagesatz-wortstellung
        iCan: "Ich kann einfache Aussagesätze in der Reihenfolge Subjekt – Verb – Objekt bilden."
        gradeBand: "5-6"
        requires: [subjektpronomen]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Satz: verneinter Aussagesatz; Adverbien: ne … pas; BY F6 Grammatik: phrases négatives (« ne … pas »); NW S1 Grammatik (S. 19): bejahte und verneinte Aussage-, Frage- und Aufforderungssätze.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / S1 → 5-6, 7-8 -> 5-6 (Mehrheit)
      - id: verneinung-ne-pas
        iCan: "Ich kann einen Satz mit ne … pas verneinen."
        gradeBand: "5-6"
        requires: [aussagesatz-wortstellung]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Adverbien: ne … plus, ne … rien; Jg 8: weitere Adverbien der Verneinung; BY F6 Grammatik: « ne … plus », « ne … jamais », « ne … rien »; NW –.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / – -> 5-6 (Mehrheit)
      - id: verneinung-plus-rien-jamais
        iCan: "Ich kann mit ne … plus, ne … rien und ne … jamais verneinen."
        gradeBand: "5-6"
        requires: [verneinung-ne-pas]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 8 Adverbien: Besonderheit von ne … personne; BY F8 Grammatik: « personne ne », « rien ne », « ne … rien », « ne … personne »; NW –.
      # Stimmen HE/BY/NW Jg 8 → 7-8 / Jg 8 → 7-8 / – -> 7-8 (Mehrheit)
      - id: verneinung-personne
        iCan: "Ich kann mit ne … personne, personne ne und rien ne verneinen."
        gradeBand: "7-8"
        requires: [verneinung-plus-rien-jamais]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Satz: Intonationsfrage; BY F6 Grammatik: interrogation par intonation; NW S1 Aussprache (S. 19): Intonationsfrage; S1 Grammatik (S. 19): Fragesätze.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / S1 → 5-6, 7-8 -> 5-6 (Mehrheit)
      - id: intonationsfrage
        iCan: "Ich kann eine Frage nur mit der Satzmelodie stellen, zum Beispiel Tu viens ?"
        gradeBand: "5-6"
        requires: [aussagesatz-wortstellung]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Satz: „Est-ce que“-Frage; BY F6 Grammatik: interrogation avec « est-ce que »; NW S1 Grammatik (S. 19): Fragesätze (Hinweis: SiLP UV 7.3).
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / S1 → 5-6, 7-8 -> 5-6 (Mehrheit)
      - id: frage-mit-est-ce-que
        iCan: "Ich kann Fragen mit est-ce que bilden."
        gradeBand: "5-6"
        requires: [intonationsfrage]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Frageadverbien: où, quand, pourquoi, comment; BY F6 Grammatik: interrogation … avec et sans pronom interrogatif; NW S1 Grammatik (S. 19): Fragesätze.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / S1 → 5-6, 7-8 -> 5-6 (Mehrheit)
      - id: fragewoerter
        iCan: "Ich kann Fragen mit où, quand, comment, pourquoi und combien stellen."
        gradeBand: "5-6"
        requires: [frage-mit-est-ce-que]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Pronomen: Fragepronomen (qui, que, qu’est-ce que); BY F6 Grammatik: interrogation avec « est-ce que », avec pronom interrogatif; NW –.
      # Stimmen HE/BY/NW Jg 7 → 5-6 / Jg 6 → 5-6 / – -> 5-6 (Mehrheit)
      - id: fragepronomen-qui-que
        iCan: "Ich kann mit qui, que und qu’est-ce que nach Personen und Sachen fragen."
        gradeBand: "5-6"
        requires: [frage-mit-est-ce-que]
      # KMK Lexiko-Grammatik (S. 18 f.); HE –; BY F6 Grammatik: adjectif interrogatif « quel » (aussi « quel est » / « quels sont »); NW –.
      # Stimmen HE/BY/NW – / Jg 6 → 5-6 / – -> 5-6 (eine Stimme). SCHWACH BELEGT: nur BY; aufgenommen als Voraussetzung von fragepronomen-lequel
      - id: fragebegleiter-quel
        iCan: "Ich kann mit quel, quelle, quels und quelles fragen, zum Beispiel Quelle heure est-il ?"
        gradeBand: "5-6"
        requires: [frage-mit-est-ce-que, adjektiv-angleichung]
      # KMK Lexiko-Grammatik (S. 18 f.); HE Jg 7 Satz: Inversionsfrage (Jg 8 erneut genannt); BY F6 Grammatik: inversion avec sujet nominal; F8: interrogation par inversion avec pronom sujet; NW –.
