        iCan: "Ich kann erklären, was religiöser Fundamentalismus und religiös begründeter Extremismus sind und warum sie manche Menschen anziehen."
        gradeBand: "7-8"
        requires: [religioese-angebote-pruefen]
  - id: ethik
