        requires: [exodus]
      # DBK MuW (Bergpredigt, Gleichnisse); 2004: 4.1 Nr. 3; HE 8: Gebot der Gottes- und Nächstenliebe, Nächsten- und Feindesliebe (S. 26, 36); BY KR6 LB5: Mk 12,28-34, Mt 5,43-48; KR10 LB4; NW IF1 S: Grundgedanken biblisch-christlicher Ethik. Stimmen 7-8/5-6/7-10 -> 7-8 (Mehrheit).
