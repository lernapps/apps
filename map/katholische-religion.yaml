      # Siehe auch: evangelische-religion/sinnangebote
      - id: religioese-angebote-pruefen
        iCan: "Ich kann Merkmale nennen, an denen man prüfen kann, ob eine religiöse oder weltanschauliche Gruppe Menschen frei lässt oder sie abhängig macht."
        gradeBand: "7-8"
        requires: [einzigartigkeit-des-menschen]
      # DBK Religion (Fundamentalismus und Fanatismus unterscheiden); BY KR8 LB5: Radikalismus und Fundamentalismus; KR7 LB5: fundamentalistische Haltungen; NW IF7 S: religiöser Fundamentalismus, religiös verbrämter Extremismus; SiLP 10.4. Stimmen –/7-8/7-10 -> 7-8 (Mehrheit).
