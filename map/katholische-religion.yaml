        requires: [religionen-in-der-umgebung]
      # Schwach belegt. DBK Religion (eine fernöstliche Religion); BY KR10 LB5: Wiedergeburt, Karma, Dharma, Götter; NW IF6 S: eine fernöstliche Religion (Wahl der Schule). Stimmen –/9-10/7-10 -> 9-10 (Mehrheit). Hinweis: NW verlangt nur eine fernöstliche Religion, das SiLP wählt den Buddhismus.
      # Siehe auch: evangelische-religion/hinduismus-grundbegriffe
