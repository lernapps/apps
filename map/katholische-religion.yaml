        iCan: "Ich kann Grundzüge des Hinduismus erklären, zum Beispiel Wiedergeburt, Karma und die Vielfalt der Götter."
        gradeBand: "9-10"
      # DBK Religion (eine fernöstliche Religion); BY KR10 LB5: Vier edle Wahrheiten, Achtfacher Pfad, Siddhartha Gautama; NW IF6 S: eine fernöstliche Religion als Weg der Heilssuche; SiLP 8.6. Stimmen –/9-10/7-10 -> 9-10 (Mehrheit).
      # Siehe auch: evangelische-religion/buddhismus-lehre
      - id: buddhismus
        iCan: "Ich kann Grundzüge des Buddhismus erklären, zum Beispiel das Leben Siddhartha Gautamas, die vier edlen Wahrheiten und den achtfachen Pfad."
        gradeBand: "9-10"
      # DBK Religion (fernöstliche Religion als Weg der Erlösung, Vergleich); BY KR10 LB5: christliche und hinduistische/buddhistische Erlösungsvorstellungen unterscheiden; NW IF6 S: Sicht auf Welt und Mensch im Christentum und in einer fernöstlichen Religion vergleichen. Stimmen –/9-10/7-10 -> 9-10 (Mehrheit).
