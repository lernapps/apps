# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Katholische Religion, Gymnasium Sekundarstufe I (Jg 5-10). Kein Fach mit KMK-Bildungsstandards.
# Stränge = die sechs Bereiche der Kirchlichen Richtlinien der Deutschen Bischofskonferenz (DBK) mit den gemeinsamen
# Strang-ids der Religionslehren (mensch, gott, bibel, jesus-christus, kirche, religionen, ethik); die Namen folgen
# der DBK. HE, BY und NW folgen den DBK-Bereichen (HE: sechs Inhaltsfelder mit gleichem Namen; BY:
# Gegenstandsbereiche je Lernbereich; NW: IF1-IF7, IF6 und IF7 bilden zusammen den Strang religionen). Der Strang
# ethik ist kein eigener DBK-Bereich: Er fasst die Inhalte zum Handeln aus "Mensch und Welt" (DBK MuW, HE Mensch
# und Welt, BY KR9 LB1 und KR10 LB1, NW IF1 "Menschsein in Freiheit und Verantwortung") zusammen, wie der Strang
# ethik der Karte Evangelische Religion. Die Bausteine beschreiben Wissen über Glauben und Praxis der katholischen
# Kirche, kein Bekenntnis. "Siehe auch: evangelische-religion/<id>" = gleicher Inhalt in der Karte Evangelische Religion.
# Quellenkürzel:
#   DBK  = Die deutschen Bischöfe Nr. 116, Kirchliche Richtlinien zu Bildungsstandards für den katholischen
#          Religionsunterricht in der Sekundarstufe I (24.06.2025), Kap. 3.3 Kompetenzerwartungen Ende Jg 10, nach Bereich
#          (MuW, Gott, Bibel, Jesus, Kirche, Religion); "2004" = Vorgänger Nr. 78 (23.09.2004), Kap. 4.x Nr. n.
#          Die DBK nennt nur das Ende von Jg 10 und stimmt daher bei der Richtstufe nicht mit.
#   HE   = Kerncurriculum Hessen Sek I Gymnasium, Katholische Religion, Ausgabe 2026 (Stand Juni 2026; Inhalt wie 2011).
#          "6" = Kap. 7.1 Ende Jg 6 -> 5-6; "8" = Kap. 7.2 Ende Jg 8 -> 7-8; "9/10" = Kap. 6 Ende Jg 9/10 -> 9-10;
#          Seiten der PDF (8.3 Schwerpunktsetzungen: S. 35 = 9/10, S. 36 = 8, S. 37 = 6).
#   BY   = LehrplanPLUS Bayern Gymnasium, Katholische Religionslehre, KR5-KR10, Lernbereich LB n (Jahrgang = KR-Zahl).
#   NW   = Kernlehrplan NRW Gymnasium Sek I (G9), Katholische Religionslehre (Heft 3403, 2019), Inhaltsfeld IFn;
#          "E" = bis Ende der Erprobungsstufe (Jg 6) -> 5-6; "S" = bis Ende Sek I -> 7-10 (zählt für 7-8 und 9-10).
#          "SiLP j.n" = Jahrgang j im Beispiel für einen schulinternen Lehrplan (2020), nur als Hinweis, keine Stimme.
# Abstimmung je Baustein: Stimmen HE/BY/NW -> Richtstufe (Grund). "schwach belegt" = weniger als zwei Länder.
# Genaue Titel, Ausgaben und URLs: .vibe/research-katholische-religion.md.
name: { de: Katholische Religion, en: Catholic religious education }   # the file name is the subject's id
source:
  title: Die deutschen Bischöfe Nr. 116, Kirchliche Richtlinien zu Bildungsstandards für den katholischen Religionsunterricht in der Sekundarstufe I (Sekretariat der Deutschen Bischofskonferenz, 24.06.2025)
  url: https://epflicht.ulb.uni-bonn.de/download/pdf/811625
strands:
  - id: mensch
    name: { de: "Mensch und Welt", en: "Human beings and the world" }
    competencies:
      # DBK MuW (biblisch-christliches Menschenbild); HE 6: von Gott angenommen sein (S. 21, 37); BY KR5 LB4: gemeinsame Gotteskindschaft, einzigartige Würde; NW IF1 E: Einzigartigkeit und Unverwechselbarkeit des Menschen. Stimmen 5-6/5-6/5-6 -> 5-6 (einstimmig).
      - id: einzigartigkeit-des-menschen
        iCan: "Ich kann erklären, warum nach christlichem Verständnis jeder Mensch einzigartig ist und eine eigene Würde hat."
        gradeBand: "5-6"
      # DBK MuW (Grundlagen biblischer Schöpfungstheologie); 2004: 4.1 Nr. 2; HE 6: biblische Schöpfungstexte (S. 21, 37); BY KR8 LB1: Gen 1 und Gen 2; NW IF1 E: der Mensch als Geschöpf Gottes. Stimmen 5-6/7-8/5-6 -> 5-6 (Mehrheit).
      # Siehe auch: evangelische-religion/schoepfungserzaehlungen
      - id: schoepfungserzaehlungen
        iCan: "Ich kann die beiden Schöpfungserzählungen am Anfang der Bibel (Gen 1 und Gen 2) wiedergeben und ihre Unterschiede nennen."
        gradeBand: "5-6"
        requires: [aufbau-der-bibel]
      # DBK MuW (Menschenbild); HE 6: Mensch als Geschöpf und Ebenbild Gottes (S. 37); 9/10: Ebenbild in Einmaligkeit und Freiheit (S. 17); BY KR7 LB1: Gottebenbildlichkeit (Gen 1,26-27); KR8 LB1; NW IF1 E: Glaubensaussage über die Gottesebenbildlichkeit konkretisieren. Stimmen 5-6/7-8/5-6 -> 5-6 (Mehrheit).
      # Siehe auch: evangelische-religion/ebenbild-gottes
      - id: gottebenbildlichkeit
        iCan: "Ich kann erklären, was die Bibel meint, wenn sie den Menschen „Ebenbild Gottes“ nennt."
        gradeBand: "5-6"
        requires: [schoepfungserzaehlungen, einzigartigkeit-des-menschen]
      # DBK MuW; 2004: 4.1 Nr. 1 und 2 (Evolutionslehre, Glaubenszeugnisse); HE 9/10: biblischer Schöpfungsglaube und naturwissenschaftliche Theorien (S. 17, 35); BY KR8 LB1: Abgrenzung von einer naturwissenschaftlichen Sichtweise; NW IF5 S: Frage nach der Historizität von der Frage nach der Wahrheit unterscheiden (allgemein). Stimmen 9-10/7-8/7-10 -> 7-8 (Gleichstand 7-8/9-10; die frühere Stufe, kein requires verlangt eine spätere).
      # Siehe auch: evangelische-religion/glaube-und-naturwissenschaft
      - id: schoepfung-und-naturwissenschaft
        iCan: "Ich kann erklären, warum sich nach katholischem Verständnis die biblischen Schöpfungserzählungen und naturwissenschaftliche Theorien zur Entstehung der Welt nicht widersprechen müssen."
        gradeBand: "7-8"
        requires: [schoepfungserzaehlungen, literarische-gattungen]
      # DBK 2004: 4.1 Nr. 2 (Sündenfall, Kain und Abel, Noah); HE 9/10: gottgeschenkte Freiheit kann verfehlt werden (S. 17); BY KR6 LB2: Kain und Abel; KR8 LB1: Gefährdungen des Menschen in Gen 3-11; NW IF1 E: Spannung zwischen guter Schöpfung und ihrer Gefährdung. Stimmen 9-10/5-6/5-6 -> 5-6 (Mehrheit). Hinweis: BY: erste Behandlung Jg 6.
      - id: urgeschichte
        iCan: "Ich kann an Erzählungen der biblischen Urgeschichte wie Sündenfall oder Kain und Abel erklären, wie die Bibel von Gefährdungen des Menschen erzählt."
        gradeBand: "5-6"
        requires: [schoepfungserzaehlungen]
      # DBK MuW (Identität und Personalität); HE 8: Identitätsfindung, Wertmaßstäbe (S. 26); BY KR7 LB1: Pubertät, Identitätsfindung, Gottebenbildlichkeit; NW IF1 S: Leitbilder für die Entwicklung der eigenen Identität; Medien und Geschlechterrollen; SiLP 7.1. Stimmen 7-8/7-8/7-10 -> 7-8 (einstimmig).
      # Siehe auch: evangelische-religion/identitaet
      - id: identitaet-jugendalter
        iCan: "Ich kann beschreiben, welche Fragen nach der eigenen Identität im Jugendalter wichtig werden und was das christliche Menschenbild dazu sagt."
        gradeBand: "7-8"
        requires: [gottebenbildlichkeit]
      # DBK MuW (Identität, Sexualität); HE 8: Der Mensch als Mann und Frau erschaffen (S. 26, 36); BY KR9 LB3: Rollenklischees; KR8 LB1: gleichwertige Stellung von Mann und Frau; NW IF1 S: Geschlechterrollenvorstellungen vor dem Hintergrund des christlichen Menschenbildes. Stimmen 7-8/9-10/7-10 -> 7-8 (Gleichstand 7-8/9-10; die frühere Stufe, kein requires verlangt eine spätere).
      # Siehe auch: evangelische-religion/geschlechterrollen
      - id: geschlechterrollen
        iCan: "Ich kann Bilder von Frauen und Männern in Medien beschreiben und mit der biblischen Aussage vergleichen, dass Gott den Menschen als Mann und Frau gleichwertig geschaffen hat."
        gradeBand: "7-8"
        requires: [gottebenbildlichkeit, identitaet-jugendalter]
      # DBK MuW (Sinnhorizont menschlicher Existenz); BY KR10 LB4: Glücksversprechen, Sinnkonzepte, Kohelet; NW IF7 S: alternative Formen der Suche nach Sinn und Erfüllung; SiLP 10.4. Stimmen –/9-10/7-10 -> 9-10 (Mehrheit).
      # Siehe auch: evangelische-religion/gelingendes-leben
      - id: glueck-und-sinn
        iCan: "Ich kann verschiedene Vorstellungen von Glück und gelingendem Leben beschreiben und mit biblischen Leitlinien vergleichen."
        gradeBand: "9-10"
        requires: [christliche-ethik]
      # DBK 2004: 4.1 Nr. 5 (Vollendung der Schöpfung); HE 9/10: Hoffnung auf Erlösung und Vollendung der Schöpfung (S. 17, 35); BY KR10 LB2: christliche Jenseitsvorstellungen (Himmel, Fegefeuer, Hölle); NW IF3 S: Zusammenhang zwischen Auferweckung Jesu und Auferweckung der Toten. Stimmen 9-10/9-10/7-10 -> 9-10 (einstimmig).
      # Siehe auch: evangelische-religion/auferstehungshoffnung
      - id: christliche-hoffnung
        iCan: "Ich kann erklären, was Christen mit der Hoffnung auf die Vollendung der Welt meinen und wie sie von Himmel, Gericht und Fegefeuer sprechen."
        gradeBand: "9-10"
        requires: [auferstehung]
      # BY KR10 LB2: Krankensalbung, Sterbebegleitung, christliches Begräbnis, Hospizbewegung; NW IF7 S: Wandel im Umgang mit lebensbedeutsamen Ereignissen; SiLP 9.3. Stimmen –/9-10/7-10 -> 9-10 (Mehrheit).
      # Siehe auch: evangelische-religion/tod-und-trauer
      - id: tod-und-trauer
        iCan: "Ich kann beschreiben, wie Christen mit Sterben, Tod und Trauer umgehen, zum Beispiel mit Krankensalbung, Begräbnis und Gebet für Verstorbene."
        gradeBand: "9-10"
        requires: [christliche-hoffnung]
  - id: gott
    name: { de: "Die Frage nach Gott", en: "The question of God" }
    competencies:
      # DBK Gott (Kontexte der Gottesfrage); 2004: 4.2 Nr. 1; HE 6: Gottes Nähe und Ferne (S. 21, 37); BY KR6 LB1: Staunen, Suchen und Fragen als Zugang zu Gott; KR5 LB3; NW IF2 E: Frage nach Gott, eigene und fremde Antwortversuche. Stimmen 5-6/5-6/5-6 -> 5-6 (einstimmig).
      - id: fragen-nach-gott
        iCan: "Ich kann Situationen beschreiben, in denen Menschen nach Gott fragen, und verschiedene Antworten darauf nennen."
        gradeBand: "5-6"
      # DBK Gott (Gottesdarstellungen); 2004: 4.2 Nr. 2; HE 6: Sprache des Glaubens, Symbol und Metapher (S. 21, 37); BY KR5 LB3: Gottesbilder von Kindern und Jugendlichen, symbolische Gottesvorstellungen; NW IF2 E: bildliches Sprechen von Gott. Stimmen 5-6/5-6/5-6 -> 5-6 (einstimmig).
      # Siehe auch: evangelische-religion/gottesvorstellungen
      - id: gottesbilder
        iCan: "Ich kann beschreiben, wie Menschen sich Gott vorstellen, und erklären, warum Religionen in Bildern und Symbolen von Gott sprechen."
        gradeBand: "5-6"
        requires: [fragen-nach-gott]
      # DBK Gott (christliche Gottesvorstellung); HE 6: Gott im AT und im NT; Symbol und Metapher (S. 21, 37); BY KR5 LB3: Gott als Schöpfer, König, Befreier, Vater, Bundesgott; NW IF2 E: Namen und Bildworte von Gott deuten. Stimmen 5-6/5-6/5-6 -> 5-6 (einstimmig).
      # Siehe auch: evangelische-religion/gottesbilder-der-bibel
      - id: biblische-gottesbilder
        iCan: "Ich kann biblische Bilder und Namen für Gott wie Hirte, Vater oder Fels deuten."
        gradeBand: "5-6"
        requires: [gottesbilder]
      # DBK Gott (Beziehung zu Gott); 2004: 4.2 Nr. 2, 4.5 Nr. 2; HE 6: Sprache des Glaubens (Gebet) (S. 21, 37); BY KR5 LB4: Gebetshaltungen und Gebetsformen; NW IF2 E: Gebet als Ausdruck der Beziehung zu Gott. Stimmen 5-6/5-6/5-6 -> 5-6 (einstimmig).
      # Siehe auch: evangelische-religion/gebet
      - id: gebet
        iCan: "Ich kann Formen des Gebets wie Bitte, Dank, Lob und Klage unterscheiden und erklären, warum Christen beten."
        gradeBand: "5-6"
        requires: [fragen-nach-gott]
      # DBK Bibel (Psalmen); HE 6: Kirche (Gebet, Psalm) (S. 21); BY KR5 LB1: ein Psalm (z. B. Ps 23); KR5 LB4; NW IF2 E: menschliche Erfahrungen in Psalmen. Stimmen 5-6/5-6/5-6 -> 5-6 (einstimmig).
      # Siehe auch: evangelische-religion/psalmen
      - id: psalmen
        iCan: "Ich kann an einem Psalm zeigen, wie Menschen darin ihre Freude, Angst oder Klage vor Gott bringen."
        gradeBand: "5-6"
        requires: [gebet]
      # DBK –; 2004: 4.4 Nr. 2 (Vater unser); HE 6: Gott im NT – Abba (Vaterunser) (S. 21, 37); BY KR5 LB4: vertieftes Verständnis des Vaterunsers als Gebet Jesu; NW IF2 S: Vaterunser als gemeinsames Gebet; SiLP 7.4. Stimmen 5-6/5-6/7-10 -> 5-6 (Mehrheit).
      # Siehe auch: evangelische-religion/vaterunser
      - id: vaterunser
        iCan: "Ich kann das Vaterunser erklären und begründen, warum es als Gebet Jesu das gemeinsame Gebet aller Christen ist."
        gradeBand: "5-6"
        requires: [gebet]
      # DBK 2004: 4.2 Nr. 2 (Gott und Götze); HE 9/10: Kritik selbst gemachter Gottesvorstellungen (Ex 32; Jes 44) (S. 17, 35); BY KR5 LB3: historische Gottesvorstellungen mit dem biblischen Gottesbild vergleichen; NW IF2 S: biblische Gottesbilder. Stimmen 9-10/5-6/7-10 -> 9-10 (Mehrheit).
      # Siehe auch: evangelische-religion/erstes-gebot
      - id: gott-und-goetze
        iCan: "Ich kann an der Erzählung vom goldenen Kalb erklären, warum die Bibel selbst gemachte Götterbilder kritisiert."
        gradeBand: "9-10"
        requires: [biblische-gottesbilder, exodus]
      # DBK Bibel (Gott der Freiheit, Exodus); HE 8: Gott offenbart sich und lässt sich ansprechen (Ex 3) (S. 26, 36); NW IF2 S: Glaube an die Gegenwart Gottes als Spezifikum des jüdisch-christlichen Gottesverständnisses. Stimmen 7-8/–/7-10 -> 7-8 (Mehrheit).
      # Siehe auch: evangelische-religion/dornbusch
      - id: gottesname
        iCan: "Ich kann an der Erzählung vom brennenden Dornbusch (Ex 3) erklären, was der Gottesname JHWH („Ich bin da“) bedeutet."
        gradeBand: "7-8"
        requires: [exodus]
      # DBK Bibel (Gott der Freiheit und Gerechtigkeit); 2004: 4.3 Nr. 3; HE 8: Gott führt in die Freiheit (Jahwe, Exodus) (S. 26, 36); BY KR8 LB2: von Gott geschenkte Freiheit (Exoduserfahrung); NW IF2 S: biblische Gottesbilder. Stimmen 7-8/7-8/7-10 -> 7-8 (einstimmig).
      # Siehe auch: evangelische-religion/exodus
      - id: gott-der-befreiung
        iCan: "Ich kann an der Exodus-Erzählung erklären, warum die Bibel Gott als einen Gott der Befreiung beschreibt."
        gradeBand: "7-8"
        requires: [gottesname]
      # DBK Gott (christliche Gottesvorstellung); 2004: 4.2 Nr. 3; HE 8: Gottes Selbstoffenbarung in Jesus Christus und im Heiligen Geist; Trinität (S. 26, 36); 9/10 (S. 17); BY KR5 LB3: liebender und dreifaltiger Gott, Taufformel (Mt 28,18-20); NW IF2 S: Trinität grundlegend für das christliche Gottesverständnis. Stimmen 7-8/5-6/7-10 -> 7-8 (Mehrheit).
      # Siehe auch: evangelische-religion/dreieinigkeit
      - id: dreieiner-gott
        iCan: "Ich kann erklären, was Christen meinen, wenn sie von Gott als Vater, Sohn und Heiligem Geist sprechen (Dreifaltigkeit)."
        gradeBand: "7-8"
        requires: [biblische-gottesbilder, pfingsten]
      # HE 8: trinitarisches Glaubensbekenntnis als spezifisch christliches Gottesverständnis (S. 26, 36); 9/10: Glaubensbekenntnis (S. 17); BY KR5 LB3: Credo; KR10 LB3: Nizäno-konstantinopolitanisches Glaubensbekenntnis. Stimmen 7-8/5-6/– -> 7-8 (Gleichstand 5-6/7-8; requires entscheidet (dreieiner-gott)).
      # Siehe auch: evangelische-religion/glaubensbekenntnis
      - id: glaubensbekenntnis
        iCan: "Ich kann den Aufbau des christlichen Glaubensbekenntnisses beschreiben und seine Teile Vater, Sohn und Heiligem Geist zuordnen."
        gradeBand: "7-8"
        requires: [dreieiner-gott]
      # DBK Gott (Zweifel und Kritik am Gottesglauben); 2004: 4.2 Nr. 4; HE 8: religionskritischer Einwand, der Glaube schränke Freiheit ein (S. 26); NW IF2 S: Anfragen an den Gottesglauben; Plausibilität einer Infragestellung Gottes; SiLP 10.1. Stimmen 7-8/–/7-10 -> 7-8 (Mehrheit).
      # Siehe auch: evangelische-religion/gottesbestreitung
      - id: kritik-am-gottesglauben
        iCan: "Ich kann Einwände gegen den Glauben an Gott nennen und erklären, was Christen darauf antworten."
        gradeBand: "7-8"
        requires: [fragen-nach-gott, gott-der-befreiung]
      # DBK Gott (Zweifel); 2004: 4.2 Nr. 5; HE 9/10: Theodizeefrage, Ijob, Passion Jesu (S. 18, 35); BY KR6 LB3: Leiderfahrungen und Umgang mit Leid (allgemein); NW IF2 S: Gottesfrage zwischen Bekenntnis, Indifferenz und Infragestellung; SiLP 10.1. Stimmen 9-10/–/7-10 -> 9-10 (Mehrheit). Hinweis: BY behandelt Leid in Jg 6 ohne die Theodizeefrage; keine Stimme.
      # Siehe auch: evangelische-religion/theodizee
      - id: theodizee
        iCan: "Ich kann die Frage erklären, warum ein guter und allmächtiger Gott Leid zulässt (Theodizee), und Antwortversuche aus der Bibel wie das Buch Ijob nennen."
        gradeBand: "9-10"
        requires: [kritik-am-gottesglauben]
      # DBK 2004: 4.2 Nr. 2 (analoge Rede); HE 9/10: analoge Rede von Gott (S. 17, 35); NW IF2 S: Möglichkeiten und Grenzen der Rede von Gott (Beschreibung des Inhaltsfelds, S. 16). Stimmen 9-10/–/7-10 -> 9-10 (Mehrheit).
      # Siehe auch: evangelische-religion/unverfuegbarkeit-gottes
      - id: analoge-rede-von-gott
        iCan: "Ich kann erklären, warum Menschen nach christlichem Verständnis von Gott nur in Vergleichen sprechen können."
        gradeBand: "9-10"
        requires: [gottesbilder, gott-und-goetze]
  - id: bibel
    name: { de: "Bibel und Tradition", en: "Bible and tradition" }
    competencies:
      # DBK Bibel (Aufbau und Entstehung); 2004: 4.3 Nr. 1; HE 6: Aufbau (S. 22, 37); BY KR5 LB1: die Bibel als Bibliothek; NW IF5 E: Entstehung und Aufbau der Bibel. Stimmen 5-6/5-6/5-6 -> 5-6 (einstimmig).
      # Siehe auch: evangelische-religion/bibel-aufbau
      - id: aufbau-der-bibel
        iCan: "Ich kann den Aufbau der Bibel mit Altem und Neuem Testament und ihren wichtigsten Büchergruppen beschreiben."
        gradeBand: "5-6"
      # Schwach belegt. DBK 2004: 4.3 Nr. 1 (Abkürzungen, Perikopen finden); BY KR5 LB1: Nachschlagen und Zitieren von Textstellen. Stimmen –/5-6/– -> 5-6 (nur ein Land). Hinweis: nur BY; aufgenommen als direkte Voraussetzung für die Arbeit mit Bibeltexten.
      # Siehe auch: evangelische-religion/bibelstellen-finden
      - id: bibelstellen-finden
        iCan: "Ich kann eine Bibelstelle mit Buch, Kapitel und Vers nachschlagen und richtig angeben."
        gradeBand: "5-6"
        requires: [aufbau-der-bibel]
      # DBK Bibel (Aufbau und Entstehung); HE 6: Entstehungsgeschichte (S. 22, 37); BY KR5 LB1: Entstehung der Bibel im Überblick; NW IF5 E: Entstehung der Bibel. Stimmen 5-6/5-6/5-6 -> 5-6 (einstimmig).
      # Siehe auch: evangelische-religion/bibel-entstehung
      - id: entstehung-der-bibel
        iCan: "Ich kann in Grundzügen beschreiben, wie die Bibel über viele Jahrhunderte entstanden ist."
        gradeBand: "5-6"
        requires: [aufbau-der-bibel]
      # DBK Bibel (Bedeutung der hebräischen Bibel für Juden und Christen); HE 6: zentrale Glaubensurkunde der Juden und der Christen (S. 22, 37); BY KR9 LB5: Tora als geistiges Zentrum des Tanach; NW IF5 E: Bibel als Buch (Bibel als Dokument des jüdisch-christlichen Glaubens, S. 16). Stimmen 5-6/9-10/5-6 -> 5-6 (Mehrheit).
      - id: hebraeische-bibel
        iCan: "Ich kann erklären, dass die Hebräische Bibel der Juden weitgehend dem Alten Testament der Christen entspricht."
        gradeBand: "5-6"
        requires: [aufbau-der-bibel]
      # DBK Bibel (Gattung Evangelium); HE 6: Evangelien als die Frohe Botschaft Jesu Christi (S. 22, 37); BY KR7 LB3: antike Gattung Evangelium; NW IF5 E: Aufbau der Bibel (allgemein). Stimmen 5-6/7-8/5-6 -> 5-6 (Mehrheit).
      - id: vier-evangelien
        iCan: "Ich kann die vier Evangelien nennen und erklären, was das Wort „Evangelium“ bedeutet."
        gradeBand: "5-6"
        requires: [aufbau-der-bibel]
      # DBK Bibel (Gattung und Verständnis); HE 6: literarische Gattungen (S. 22, 37); 8: Gleichnisse, Streitgespräche, Wundererzählungen (S. 27); BY KR7 LB3: antike Gattung Evangelium; NW IF5 S: Entstehung und Gattungen biblischer Texte. Stimmen 5-6/7-8/7-10 -> 7-8 (Mehrheit).
      # Siehe auch: evangelische-religion/bibel-textsorten
      - id: literarische-gattungen
        iCan: "Ich kann wichtige Textsorten der Bibel wie Erzählung, Psalm, Gleichnis, Brief und Evangelium unterscheiden."
        gradeBand: "7-8"
        requires: [aufbau-der-bibel]
      # DBK 2004: 4.3 Nr. 1 (synoptische Frage); HE 8: Synoptiker und synoptischer Vergleich (S. 27, 36); BY KR7 LB3: Entstehung der Evangelien, synoptische Frage (Zwei-Quellen-Theorie); NW IF5 S: Entstehungsprozess der Evangelien; SiLP 7.3. Stimmen 7-8/7-8/7-10 -> 7-8 (einstimmig).
      # Siehe auch: evangelische-religion/entstehung-der-evangelien
      - id: synoptische-frage
        iCan: "Ich kann erklären, warum sich die Evangelien nach Markus, Matthäus und Lukas ähneln und wie sie nach der Zwei-Quellen-Theorie entstanden sind."
        gradeBand: "7-8"
        requires: [vier-evangelien]
      # DBK Bibel (Entstehungskontext und Gattung); HE 9/10: Kenntnisse von Aufbau, Entstehungsgeschichte, Gattungen zur Deutung (S. 18); BY KR7 LB3: Bezüge zwischen Entstehungskontext und Konzeption des Markusevangeliums; NW IF5 S: Bedeutung des Entstehungskontextes und der literarischen Form. Stimmen 9-10/7-8/7-10 -> 7-8 (Gleichstand 7-8/9-10; die frühere Stufe, kein requires verlangt eine spätere).
