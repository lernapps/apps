      # DBK MuW (Dekalog); 2004: 4.3 Nr. 3; HE 8: Zehn Gebote als Orientierung (S. 26); 9/10: Dekalog (S. 17); BY KR8 LB2: Exoduserfahrung und Dekalog; KR9 LB1: Prolog Ex 20,2; NW IF1 S: Grundgedanken biblisch-christlicher Ethik; SiLP 8.5. Stimmen 7-8/7-8/7-10 -> 7-8 (einstimmig).
