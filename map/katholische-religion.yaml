      # DBK Religion (antisemitische, islamfeindliche und antichristliche Vorurteile); 2004: 4.6 Nr. 1 und 2; HE 6: religiöse Vorurteile hinterfragen (Kommunikationskompetenz, S. 20); 9/10: analysieren (S. 16); BY KR7 LB5: Dialoghemmnisse; NW IF6 E: einseitige Darstellungen im Alltag oder in den Medien. Stimmen 5-6/7-8/5-6 -> 5-6 (Mehrheit).
