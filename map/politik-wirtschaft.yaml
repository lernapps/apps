# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Keine KMK-Bildungsstandards für das Fach; Stränge = die Inhaltsbereiche, die die drei Länder teilen.
# Quellenkürzel in den Kommentaren:
#   HE = Lehrplan Politik und Wirtschaft, Gymnasialer Bildungsgang, Jahrgangsstufen 7 bis 13, Hessen (G9); Unterrichtsthema
#        7.1 bis 10.3 = Jahrgang (7, 8 -> "7-8"; 9, 10 -> "9-10"); "fak." = fakultativ, zählt nicht.
#   KC = Kerncurriculum Hessen Sek I Gymnasium Politik und Wirtschaft (2011), Inhaltsfelder (IF), nur Ende 9/10:
#        zählt als Stimme "7-10", wenn der Lehrplan den Inhalt nicht nennt (Politik und Wirtschaft ab Jg 7).
#   BY = LehrplanPLUS Bayern Gymnasium, Fächer für alle Ausbildungsrichtungen: PuG10 = Politik und Gesellschaft 10
#        (HG, SG, NTG, MuG, WWG), WR10 = Wirtschaft und Recht 10 (HG, SG, NTG, MuG, SWG), Geo7/Geo10 = Geographie,
#        G10 = Geschichte 10 (Lernbereich LB). "nur SWG"/"nur WWG" = PuG 8/9 bzw. WR 8/9 nur in einer Ausbildungsrichtung,
#        zählt nicht.
#   NW = Kernlehrplan Wirtschaft-Politik Sek I Gymnasium NRW (2019, Heft 3429); St1 = bis Ende Erprobungsstufe ("5-6"),
#        St2 = bis Ende Sek I (zählt für "7-8" und "9-10"); SiLP = Umsetzungsbeispiel, nur Hinweis.
# Abstimmung: eine Stimme je Land (HE/BY/NW); zwei von drei entscheiden; drei verschiedene: die mittlere;
# Gleichstand: requires, sonst die früheste Stufe. Genaue Titel, Ausgaben und URLs: .vibe/research-politik-wirtschaft.md.
name: { de: Politik und Wirtschaft, en: Politics and economics }  # the file name is the subject's id: politik-wirtschaft
source:
  title: Kerncurriculum Hessen, Sekundarstufe I - Gymnasium, Politik und Wirtschaft (Hessisches Kultusministerium), mit Lehrplan Politik und Wirtschaft G9 Hessen
  url: https://kultus.hessen.de/sites/kultus.hessen.de/files/2021-07/kerncurriculum_politik_und_wirtschaft_gymnasium.pdf
strands:
  - id: gesellschaft
    name: { de: "Individuum und Gesellschaft", en: "Individual and society" }
    competencies:
      # HE 7.1 (Bedeutung der Familie, Schutz der Familie im GG); NW IF4 St1 (Bedürfnisse und Rollen von Familienmitgliedern; Bedeutung von Lebensformen für die Gesellschaft); BY nur SWG: PuG8 LB2 (Sozialisationsinstanz Familie).
      # Stimmen HE/BY/NW 7-8/–/5-6 -> 5-6 (Gleichstand, früheste Stufe)
      - id: familie-aufgaben
        iCan: { de: "Ich kann beschreiben, welche Aufgaben eine Familie für ihre Mitglieder und für die Gesellschaft erfüllt." }
        gradeBand: "5-6"
      # HE 7.1 (Familie im Wandel und in unterschiedlichen Kulturen; alternative Familienformen); NW IF4 St1 (Wandel von Lebensformen: familiäre und nicht-familiäre Strukturen).
      # Stimmen HE/BY/NW 7-8/–/5-6 -> 5-6 (Gleichstand, früheste Stufe)
      - id: familie-im-wandel
        iCan: { de: "Ich kann verschiedene Familien- und Lebensformen beschreiben und erklären, wie sie sich gewandelt haben." }
        gradeBand: "5-6"
        requires: [familie-aufgaben]
      # HE 7.1 (Erziehungs- und Sozialisationsformen); KC IF Individuum und Gesellschaft (Sozialisation); NW IF4 St1 (Identität und Rollen: Familie, Schule und Peergroup); BY nur SWG: PuG8 LB2 (Bezugspersonen, Sozialisationsinstanzen).
      # Stimmen HE/BY/NW 7-8/–/5-6 -> 5-6 (Gleichstand, früheste Stufe)
      - id: sozialisation
        iCan: { de: "Ich kann erklären, wie Familie, Schule, Freunde und Medien mich prägen." }
        gradeBand: "5-6"
      # HE 7.1 (Rollenerwartungen); NW IF4 St1 (Identität und Rollen; Folgen von Rollenerwartungen in der Familie); IF4 St2 (Einfluss sozialer Erwartungen auf die Identitätsbildung); BY nur SWG: PuG8 LB1.
      # Stimmen HE/BY/NW 7-8/–/5-6 -> 5-6 (Gleichstand, früheste Stufe)
      - id: rollen-und-erwartungen
        iCan: { de: "Ich kann erklären, was eine soziale Rolle ist und wie Erwartungen anderer mein Verhalten beeinflussen." }
        gradeBand: "5-6"
        requires: [sozialisation]
      # KC IF Individuum und Gesellschaft (Genderproblematik); HE 7.1 fak. (Geschlechterrollen, Gleichberechtigung); NW IF4 St1 (Wandel von Geschlechterrollen; Herausforderungen im Zusammenleben ... Geschlechterrollen).
      # Stimmen HE/BY/NW 7-10/–/5-6 -> 5-6 (Gleichstand, früheste Stufe)
      - id: geschlechterrollen
        iCan: { de: "Ich kann beschreiben, wie sich die Rollen von Frauen und Männern gewandelt haben, und begründen, warum Gleichberechtigung wichtig ist." }
        gradeBand: "5-6"
        requires: [rollen-und-erwartungen]
      # HE 7.1 (Gruppendruck und Selbstbestimmung, Normen, Sanktionen); NW IF4 St2 (Werte, Normen und Gesetze; soziale Erwartungen); BY nur SWG: PuG8 LB2 (primäre soziale Gruppe: Normen, Sanktionen, Strukturen).
      # Stimmen HE/BY/NW 7-8/–/7-10 -> 7-8 (Mehrheit)
      - id: gruppen-normen-sanktionen
        iCan: { de: "Ich kann an Beispielen erklären, wie eine Gruppe mit Normen und Sanktionen das Verhalten ihrer Mitglieder lenkt, und mit Gruppendruck umgehen." }
        gradeBand: "7-8"
        requires: [rollen-und-erwartungen]
      # HE 7.1 (Normen; Menschenrechte als Maxime des Handelns); BY PuG10 LB1 (Notwendigkeit gemeinsamer Werte und Normen für das Zusammenleben); NW IF4 St2 (Gemeinsamkeiten und Unterschiede von Werten, Normen und Gesetzen).
      # Stimmen HE/BY/NW 7-8/9-10/7-10 -> 7-8 (Gleichstand, früheste Stufe)
      - id: werte-normen-gesetze
        iCan: { de: "Ich kann Werte, Normen und Gesetze unterscheiden und an Beispielen zeigen, wie sie zusammenhängen." }
        gradeBand: "7-8"
        requires: [gruppen-normen-sanktionen]
      # HE 7.1 (Kindheit und Jugend in der modernen Gesellschaft; Ich-Identität); NW IF4 St2 (individuelle Lebensgestaltung: Selbstverwirklichung, soziale Erwartungen und soziale Verantwortung); BY nur SWG: PuG8 LB1 (Jugend als Lebensphase, Identitätssuche, Rolle der Peergroups).
      # Stimmen HE/BY/NW 7-8/–/7-10 -> 7-8 (Mehrheit)
      - id: jugend-als-lebensphase
        iCan: { de: "Ich kann beschreiben, was die Lebensphase Jugend ausmacht und welche Fragen der eigenen Identität sie mit sich bringt." }
        gradeBand: "7-8"
        requires: [rollen-und-erwartungen]
      # KC IF Individuum und Gesellschaft (sozialer Wandel; individuelle Lebensgestaltung und gesellschaftliche Erwartungen); NW IF4 St2 (Wandel der Wertorientierungen von Jugendlichen); BY nur SWG: PuG8 LB1 (Einstellungen, Werte und Zukunftserwartungen Jugendlicher).
      # Stimmen HE/BY/NW 7-10/–/7-10 -> 7-8 (Gleichstand, früheste Stufe)
      - id: wertewandel-jugend
        iCan: { de: "Ich kann beschreiben, welche Werte Jugendlichen heute wichtig sind und wie sich das verändert hat." }
        gradeBand: "7-8"
        requires: [jugend-als-lebensphase, werte-normen-gesetze]
      # HE 7.1 (Familie in unterschiedlichen Kulturen; Subkulturen); KC IF Individuum und Gesellschaft (interkulturelle Differenz); BY Geo7 LB2 (Kultur und Lebensweisen in Europa; Bereitschaft, sich für Integration einzusetzen); NW IF4 St1 (Zusammenleben von Menschen mit unterschiedlichen kulturellen Hintergründen).
      # Stimmen HE/BY/NW 7-8/7-8/5-6 -> 7-8 (Mehrheit)
      - id: zusammenleben-in-vielfalt
        iCan: { de: "Ich kann Chancen und Schwierigkeiten beschreiben, wenn Menschen mit unterschiedlicher Herkunft und Kultur zusammenleben." }
        gradeBand: "7-8"
      # HE 7.1 (Umgang mit Minderheiten und Randgruppen, Fremdenfeindlichkeit; Menschenwürde); NW IF4 St1 (Herausforderungen im Zusammenleben); BY nur SWG: PuG8 LB4 (Minderheitenschutz).
      # Stimmen HE/BY/NW 7-8/–/5-6 -> 7-8 (Gleichstand, requires entscheidet)
      - id: vorurteile-und-minderheiten
        iCan: { de: "Ich kann erklären, wie Vorurteile entstehen, und begründen, warum Minderheiten geschützt werden müssen." }
        gradeBand: "7-8"
        requires: [zusammenleben-in-vielfalt]
      # KC IF Demokratie (Elemente gesellschaftspolitischer Partizipation); HE Übergangsprofil (Verantwortungsbereitschaft); NW IF4 St2 (Möglichkeiten des sozialen Engagements; Bedeutung für Identität und Gesellschaft); BY nur SWG: PuG8 6.1 (Vereine, Ehrenamt). SCHWACH BELEGT: HE nennt Engagement nur allgemein.
      # Stimmen HE/BY/NW 7-10/–/7-10 -> 7-8 (Gleichstand, früheste Stufe)
      - id: soziales-engagement
        iCan: { de: "Ich kann Möglichkeiten nennen, mich für andere zu engagieren, zum Beispiel im Ehrenamt, und begründen, was das mir und der Gesellschaft bringt." }
        gradeBand: "7-8"
  - id: teilhabe
    name: { de: "Demokratie und Teilhabe", en: "Democracy and participation" }
    competencies:
      # HE 7.2 (Demokratie und politische Beteiligung; Verantwortung für das Gemeinwesen); BY PuG10 LB1 (das Politische in vielen Lebensbereichen erkennen); NW IF2 St1 (Verknüpfung von Politik und Lebenswelt im Erfahrungsbereich von Kindern und Jugendlichen).
      # Stimmen HE/BY/NW 7-8/9-10/5-6 -> 7-8 (drei verschiedene Stimmen, mittlere)
      - id: politik-begriff
        iCan: { de: "Ich kann erklären, was Politik ist: das gemeinsame Regeln von Fragen, die alle betreffen." }
        gradeBand: "7-8"
      # HE 7.2 (Schule gestalten: Mitbestimmung in schulischen Gremien; SV, Schulkonferenz); NW IF2 St1 (Grundprinzipien, Aufbau und Aufgaben der Schülervertretung; Wahlen auf schulischer Ebene).
      # Stimmen HE/BY/NW 7-8/–/5-6 -> 5-6 (Gleichstand, früheste Stufe)
      - id: mitbestimmung-schule
        iCan: { de: "Ich kann erklären, wie ich in der Klasse und in der Schule mitbestimmen kann, zum Beispiel über Klassensprecher, Schülervertretung und Schulkonferenz." }
        gradeBand: "5-6"
      # HE 7.2 (Kommunale Selbstverwaltung: Aufgaben und Struktur; Einnahmen und Ausgaben); NW IF2 St1 (Aufbau und Aufgaben von Städten/Gemeinden); BY nur SWG: PuG9 LB3 (Politik in der Kommune).
      # Stimmen HE/BY/NW 7-8/–/5-6 -> 5-6 (Gleichstand, früheste Stufe)
      - id: gemeinde-aufgaben
        iCan: { de: "Ich kann Aufgaben einer Gemeinde nennen und zeigen, wo sie meinen Alltag betreffen." }
        gradeBand: "5-6"
      # HE 7.2 (Struktur der Kommune; Wahlen, Parteien); NW IF2 St1 (Institutionen, Akteure und Prozesse; Wahlen auf kommunaler Ebene).
      # Stimmen HE/BY/NW 7-8/–/5-6 -> 5-6 (Gleichstand, früheste Stufe)
      - id: gemeinderat-buergermeister
        iCan: { de: "Ich kann erklären, wie Gemeinderat und Bürgermeisterin oder Bürgermeister gewählt werden und wie sie entscheiden." }
        gradeBand: "5-6"
        requires: [gemeinde-aufgaben]
      # HE 7.2 (Bürgerbeteiligung; Jugendparlament, Jugendforum); NW IF2 St1 (Formen demokratischer Beteiligung in Stadt/Gemeinde); BY nur SWG: PuG8 LB4 (Mitwirkungsmöglichkeiten Jugendlicher auf kommunaler Ebene).
      # Stimmen HE/BY/NW 7-8/–/5-6 -> 5-6 (Gleichstand, früheste Stufe)
      - id: beteiligung-kommune
        iCan: { de: "Ich kann Wege beschreiben, wie Kinder und Jugendliche in ihrer Gemeinde mitwirken können, zum Beispiel in einem Jugendparlament." }
        gradeBand: "5-6"
        requires: [gemeinderat-buergermeister]
      # HE 7.2 (Politische Ordnung und Entscheidung im kommunalen Bereich; kontroverse Interessen, z. B. Verkehrsplanung); NW IF2 St1 (unterschiedliche Positionen, Interessengebundenheit und Kontroversität in kommunalen Entscheidungsprozessen).
      # Stimmen HE/BY/NW 7-8/–/5-6 -> 5-6 (Gleichstand, früheste Stufe)
      - id: kommunaler-streitfall
        iCan: { de: "Ich kann an einem Streitfall in meiner Gemeinde zeigen, welche Interessen aufeinandertreffen und wie entschieden wird." }
        gradeBand: "5-6"
        requires: [gemeinderat-buergermeister]
      # HE 7.2 (Demokratie und politische Beteiligung); BY PuG10 LB1 (grundlegende Werte der freiheitlichen Demokratie); NW IF2 St1 (Leben in der Demokratie).
      # Stimmen HE/BY/NW 7-8/9-10/5-6 -> 7-8 (drei verschiedene Stimmen, mittlere)
      - id: demokratie-merkmale
        iCan: { de: "Ich kann Merkmale einer Demokratie nennen, zum Beispiel freie Wahlen, Meinungsfreiheit, Mehrheitsentscheidung und Schutz von Minderheiten." }
        gradeBand: "7-8"
        requires: [politik-begriff]
      # HE 7.2 (Wahlen); BY PuG10 LB2 (Funktionen demokratischer Wahlen; Bedeutung der Wahlteilnahme); NW IF2 St1 (Funktion und Bedeutung von Wahlen auf schulischer und kommunaler Ebene).
      # Stimmen HE/BY/NW 7-8/9-10/5-6 -> 7-8 (drei verschiedene Stimmen, mittlere)
      - id: wahlen-funktion
        iCan: { de: "Ich kann erklären, wozu Wahlen in einer Demokratie dienen und warum es wichtig ist, wählen zu gehen." }
        gradeBand: "7-8"
        requires: [demokratie-merkmale]
      # HE 10.1 (Mehrheitsbildung; Kompromiss als Voraussetzung für die Akzeptanz von Mehrheitsentscheidungen); BY PuG10 LB3 (Lösungen erarbeiten und Mehrheiten organisieren); PuG10 LB2 (Minderheitenschutz); NW IF2 St2 (Prinzipien demokratischer Institutionen); BY nur SWG: PuG8 LB4 (Kompromissfindung, Minderheitenschutz).
      # Stimmen HE/BY/NW 9-10/9-10/7-10 -> 9-10 (Mehrheit)
      - id: kompromiss-und-mehrheit
        iCan: { de: "Ich kann erklären, warum in einer Demokratie die Mehrheit entscheidet, Kompromisse nötig sind und die Minderheit geschützt bleibt." }
        gradeBand: "9-10"
        requires: [demokratie-merkmale]
      # HE 10.1 (Aufgaben, Stellung und innere Struktur der Parteien); BY PuG10 LB2 (Aufgaben von politischen Parteien); NW IF2 St2 (Aufgaben und Funktionen von Parteien im politischen System).
      # Stimmen HE/BY/NW 9-10/9-10/7-10 -> 9-10 (Mehrheit)
      - id: parteien-aufgaben
        iCan: { de: "Ich kann die Aufgaben von Parteien in der Demokratie erklären." }
        gradeBand: "9-10"
        requires: [wahlen-funktion]
      # HE 10.1 (Parteien und Verbände; pluralistische Demokratie); KC IF Demokratie (Pluralismus); BY PuG10 LB2 (Kennzeichen der pluralistischen Demokratie: Interessengruppen); NW IF2 St2 (Partizipation in der Zivilgesellschaft).
      # Stimmen HE/BY/NW 9-10/9-10/7-10 -> 9-10 (Mehrheit)
      - id: interessenverbaende
        iCan: { de: "Ich kann erklären, wie Verbände und andere Gruppen ihre Interessen in die Politik einbringen, und warum das zu einer pluralistischen Demokratie gehört." }
        gradeBand: "9-10"
        requires: [parteien-aufgaben]
      # HE 10.1 (Bürgerbeteiligung; Handlungsmöglichkeiten des Einzelnen); BY PuG10 LB2 (politische Mitwirkungsmöglichkeiten; Chancen und Grenzen der Durchsetzung eigener Interessen); NW IF2 St2 (Formen, Chancen und Grenzen zivilgesellschaftlicher Partizipation).
      # Stimmen HE/BY/NW 9-10/9-10/7-10 -> 9-10 (Mehrheit)
      - id: politische-beteiligung
        iCan: { de: "Ich kann Formen politischer Beteiligung neben Wahlen nennen, zum Beispiel Petition, Demonstration oder Bürgerinitiative, und ihre Chancen und Grenzen beurteilen." }
        gradeBand: "9-10"
        requires: [wahlen-funktion, beteiligung-kommune]
  - id: politisches-system
    name: { de: "Grundgesetz und politisches System", en: "Basic Law and political system" }
    competencies:
      # HE 7.1 (Konflikt und Konsens in der sozialen Gruppe und Menschenwürde); HE 8.1 (Menschenwürde, Grundrechte); BY PuG10 LB1 (Menschenwürde Art. 1 GG); NW IF2 St2 (Grundrechtsbindung).
      # Stimmen HE/BY/NW 7-8/9-10/7-10 -> 7-8 (Gleichstand, früheste Stufe)
      - id: menschenwuerde
        iCan: { de: "Ich kann erklären, was Menschenwürde bedeutet und warum sie nach Artikel 1 des Grundgesetzes unantastbar ist." }
        gradeBand: "7-8"
        requires: [werte-normen-gesetze]
      # HE 10.1 (Grundwerte der Verfassung); KC IF Demokratie (Grundrechtsbindung); BY PuG10 LB1 (das Grundgesetz als Grundlage für das Zusammenleben); NW IF2 St2 (Verfassungsstaatlichkeit).
      # Stimmen HE/BY/NW 9-10/9-10/7-10 -> 9-10 (Mehrheit)
      - id: grundgesetz-bedeutung
        iCan: { de: "Ich kann erklären, warum das Grundgesetz die Grundlage unseres Zusammenlebens ist und was es regelt." }
        gradeBand: "9-10"
        requires: [menschenwuerde, demokratie-merkmale]
      # HE 8.1 (Menschenwürde, Grundrechte); HE 10.1 (Grund- und Menschenrechte); BY PuG10 LB1 (ausgewählte Menschen- und Bürgerrechte, Art. 2–19 GG); NW IF2 St2 (Grundrechtsbindung).
      # Stimmen HE/BY/NW 7-8/9-10/7-10 -> 9-10 (Gleichstand, requires entscheidet)
      - id: grundrechte
        iCan: { de: "Ich kann wichtige Grundrechte des Grundgesetzes nennen und Freiheitsrechte von Gleichheitsrechten unterscheiden." }
        gradeBand: "9-10"
        requires: [grundgesetz-bedeutung]
      # BY PuG10 LB1 (Spannungsverhältnis zwischen Grundrechten an einem Beispiel, z. B. Grenzen der Meinungsfreiheit); NW IF2 St2 (Spannungsfeld zwischen innerer Sicherheit und Freiheitsrechten); HE 10.1 nur in der Begründung (Grundrechte im Rahmen der sozialen Einbindung).
      # Stimmen HE/BY/NW –/9-10/7-10 -> 9-10 (Mehrheit)
      - id: grundrechte-im-konflikt
        iCan: { de: "Ich kann an einem Beispiel zeigen, wie Grundrechte miteinander in Konflikt geraten, zum Beispiel Meinungsfreiheit und Schutz der Persönlichkeit, und wo ihre Grenzen liegen." }
        gradeBand: "9-10"
        requires: [grundrechte]
      # HE 10.1 (Volkssouveränität); KC IF Demokratie; BY PuG10 LB1 (Bundesrepublik als demokratischer Staat, Art. 20 GG); NW IF2 St2 (Prinzipien demokratischer Institutionen).
      # Stimmen HE/BY/NW 9-10/9-10/7-10 -> 9-10 (Mehrheit)
      - id: volkssouveraenitaet
        iCan: { de: "Ich kann erklären, was es heißt, dass alle Staatsgewalt vom Volk ausgeht." }
        gradeBand: "9-10"
        requires: [grundgesetz-bedeutung, wahlen-funktion]
      # HE 10.1 (parlamentarische Demokratie); KC IF Demokratie (parlamentarisch-repräsentatives System); BY PuG10 LB3 (Arbeitsweise des Bundestags und Stellung der Abgeordneten); NW IF2 St2 (Wahlen und Parlamentarismus).
      # Stimmen HE/BY/NW 9-10/9-10/7-10 -> 9-10 (Mehrheit)
      - id: repraesentative-demokratie
        iCan: { de: "Ich kann erklären, wie in einer repräsentativen Demokratie gewählte Abgeordnete für das Volk entscheiden, und das mit direkter Demokratie vergleichen." }
        gradeBand: "9-10"
        requires: [volkssouveraenitaet]
      # HE 10.1 (Gewaltenteilung); KC IF Demokratie; BY PuG10 LB3 (wechselseitige Abhängigkeiten der Verfassungsorgane); NW IF2 St2 (Grundlagen des Rechtsstaats: Gewaltenteilung).
      # Stimmen HE/BY/NW 9-10/9-10/7-10 -> 9-10 (Mehrheit)
      - id: gewaltenteilung
        iCan: { de: "Ich kann die Gewaltenteilung in Gesetzgebung, Regierung und Verwaltung sowie Rechtsprechung erklären und begründen, warum sie Macht begrenzt." }
        gradeBand: "9-10"
        requires: [grundgesetz-bedeutung]
      # HE 7.2 (Länderhoheit, Funktionsweise politischer Institutionen auf Länderebene); NW IF2 St2 (demokratische Institutionen auf Landes- und Bundesebene; SiLP UV IX, Jg 7/8: Landesebene); BY nur SWG: PuG9 LB3 (Politik im Freistaat Bayern).
      # Stimmen HE/BY/NW 7-8/–/7-10 -> 7-8 (Mehrheit)
      - id: landespolitik
        iCan: { de: "Ich kann erklären, wie mein Bundesland regiert wird: Landtag, Landesregierung und Ministerpräsidentin oder Ministerpräsident." }
        gradeBand: "7-8"
        requires: [gemeinderat-buergermeister, wahlen-funktion]
      # HE 7.2 (Länderhoheit); KC IF Demokratie (Föderalismus, Ebenen der Verwaltung und Entscheidung); HE 10.1 fak. (Föderalismus); BY PuG10 LB3 (Bundesrat; Zusammenwirken der Verfassungsorgane); NW IF2 St2 (föderales System der Bundesrepublik).
      # Stimmen HE/BY/NW 7-8/9-10/7-10 -> 7-8 (Gleichstand, früheste Stufe)
      - id: foederalismus
        iCan: { de: "Ich kann erklären, wie die Aufgaben zwischen Bund, Ländern und Gemeinden verteilt sind und warum Deutschland ein Bundesstaat ist." }
        gradeBand: "7-8"
        requires: [landespolitik]
      # HE 10.1 (Bundestag); BY PuG10 LB3 (Aufbau, Aufgaben und Zusammenwirken von Bundesregierung, Bundestag und Bundesrat); NW IF2 St2 (Parlamentarismus; Organe).
      # Stimmen HE/BY/NW 9-10/9-10/7-10 -> 9-10 (Mehrheit)
      - id: bundestag
        iCan: { de: "Ich kann die Aufgaben des Bundestags erklären: Gesetze beschließen, die Bundeskanzlerin oder den Bundeskanzler wählen und die Regierung kontrollieren." }
        gradeBand: "9-10"
        requires: [repraesentative-demokratie, gewaltenteilung]
      # HE 10.1 (Mehrheitsbildung: Fraktionen); BY PuG10 LB3 (Stellung des Abgeordneten, Art. 38 GG); NW IF2 St2 (Parlamentarismus).
      # Stimmen HE/BY/NW 9-10/9-10/7-10 -> 9-10 (Mehrheit)
      - id: abgeordnete
        iCan: { de: "Ich kann die Stellung von Abgeordneten erklären, zum Beispiel das freie Mandat nach Artikel 38 GG und die Arbeit in Fraktionen." }
        gradeBand: "9-10"
        requires: [bundestag]
      # HE 10.1 (Wahlsystem); BY PuG10 LB2 (Wahlrechtsgrundsätze); NW IF2 St2 (Wahlen).
      # Stimmen HE/BY/NW 9-10/9-10/7-10 -> 9-10 (Mehrheit)
      - id: wahlrechtsgrundsaetze
        iCan: { de: "Ich kann die Wahlrechtsgrundsätze allgemein, unmittelbar, frei, gleich und geheim an Beispielen erklären." }
        gradeBand: "9-10"
        requires: [wahlen-funktion]
