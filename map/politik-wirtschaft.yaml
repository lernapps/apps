  - id: medien
    name: { de: "Medien und Information", en: "Media and information" }
    competencies:
      # HE 7.4 (Freizeit und Medien); NW IF5 St1 (Nutzung digitaler und analoger Medien; kritische Auseinandersetzung mit der eigenen Mediennutzung); BY nur SWG: PuG8 LB1 (Jugend und neue Medien).
      # Stimmen HE/BY/NW 7-8/–/5-6 -> 5-6 (Gleichstand, früheste Stufe)
      - id: mediennutzung
        name: { de: "Eigene Mediennutzung", en: "My media use" }
        iCan: { de: "Ich kann beschreiben, welche Medien ich wofür nutze, und meine eigene Mediennutzung kritisch prüfen." }
        gradeBand: "5-6"
      # HE 7.4 (Medien: Informationsbeschaffung und Unterhaltung); BY PuG10 LB2 (Möglichkeiten und Wege differenzierter Urteils- und Meinungsbildung); NW IF5 St1 (Möglichkeiten der Informationsgewinnung).
      # Stimmen HE/BY/NW 7-8/9-10/5-6 -> 7-8 (drei verschiedene Stimmen, mittlere)
      - id: informationsquellen
        name: { de: "Informationsquellen prüfen", en: "Evaluating information sources" }
        iCan: { de: "Ich kann verschiedene Informationsquellen nutzen und prüfen, wie verlässlich eine Information ist." }
        gradeBand: "7-8"
        requires: [mediennutzung]
      # HE 7.4 (Aufbau einer Zeitung oder Entstehen einer Sendung); NW IF5 St1 (interessengeleitete Setzung und Verbreitung von medial vermittelten Inhalten).
      # Stimmen HE/BY/NW 7-8/–/5-6 -> 5-6 (Gleichstand, früheste Stufe)
      - id: nachrichten-entstehen
        name: { de: "Wie Nachrichten entstehen", en: "How news is made" }
        iCan: { de: "Ich kann beschreiben, wie eine Zeitung oder eine Nachrichtensendung entsteht und wer auswählt, worüber berichtet wird." }
        gradeBand: "5-6"
        requires: [mediennutzung]
      # HE 7.4 (Analyse medialer Mittel; Präsentationstechniken und ihre Wirkung); NW IF5 St1 (Wirkungen digitaler und analoger Medien).
      # Stimmen HE/BY/NW 7-8/–/5-6 -> 5-6 (Gleichstand, früheste Stufe)
      - id: mediale-mittel
        name: { de: "Mediale Gestaltungsmittel", en: "Media techniques and effects" }
        iCan: { de: "Ich kann untersuchen, wie Bilder, Schlagzeilen und Kameraeinstellungen eine bestimmte Wirkung erzeugen." }
        gradeBand: "5-6"
        requires: [nachrichten-entstehen]
      # HE 7.4 (Neue Medien: Aufbau und Probleme des Internets); NW IF5 St1 (Einfluss sozialer Netzwerke im Alltag); BY PuG10 LB1 nennt soziale Netzwerke nur als Beispiel. SCHWACH BELEGT: HE nennt nur das Internet allgemein.
      # Stimmen HE/BY/NW 7-8/–/5-6 -> 5-6 (Gleichstand, früheste Stufe)
      - id: soziale-netzwerke
        name: { de: "Soziale Netzwerke", en: "Social networks" }
        iCan: { de: "Ich kann beschreiben, wie soziale Netzwerke meinen Alltag beeinflussen, und Chancen und Risiken abwägen." }
        gradeBand: "5-6"
        requires: [mediennutzung]
      # HE 7.4 (Begründung: medialer Einfluss auf Freizeitverhalten, Einstellungen und Idole); NW IF4 St2 (Bedeutung digitaler Medien für die Identitätsbildung von Jugendlichen); BY nur SWG: PuG8 LB3 (Vorbilder, Idole und Influencer).
      # Stimmen HE/BY/NW 7-8/–/7-10 -> 7-8 (Mehrheit)
      - id: vorbilder-und-influencer
        name: { de: "Vorbilder und Influencer", en: "Role models and influencers" }
        iCan: { de: "Ich kann erklären, wie Vorbilder, Idole und Influencer in den Medien auf mich wirken, und ihren Einfluss beurteilen." }
        gradeBand: "7-8"
        requires: [soziale-netzwerke, jugend-als-lebensphase]
      # KC IF Demokratie (Rolle der Medien zwischen demokratischer Kontrollfunktion und Interessen); HE 10.1 fak. (Presse als 4. Gewalt); BY PuG10 LB2 (Kennzeichen der pluralistischen Demokratie: Massenmedien); NW IF2 St2 (Rolle der Medien im politischen Willensbildungsprozess).
      # Stimmen HE/BY/NW 7-10/9-10/7-10 -> 9-10 (Mehrheit)
      - id: medien-in-der-demokratie
        name: { de: "Medien in der Demokratie", en: "Media in a democracy" }
        iCan: { de: "Ich kann die Aufgaben der Medien in der Demokratie erklären: informieren, an der Meinungsbildung mitwirken und die Mächtigen kontrollieren." }
        gradeBand: "9-10"
        requires: [informationsquellen, demokratie-merkmale]
      # KC IF Demokratie (Medien zwischen Kontrollfunktion und politischen und wirtschaftlichen Interessen); HE 10.1 fak. (Grundgesetz und Pressefreiheit, Pressekonzentration); BY PuG10 LB1 (Grenzen der Meinungsfreiheit); NW IF2 St2 (mediale Einflüsse auf den Willensbildungsprozess).
      # Stimmen HE/BY/NW 7-10/9-10/7-10 -> 9-10 (Mehrheit)
      - id: pressefreiheit
        name: { de: "Meinungs- und Pressefreiheit", en: "Free speech and press freedom" }
        iCan: { de: "Ich kann erklären, warum Meinungs- und Pressefreiheit für die Demokratie wichtig sind und wodurch sie gefährdet werden." }
        gradeBand: "9-10"
        requires: [medien-in-der-demokratie, grundrechte]
      # BY PuG10 LB2 (Wirkung von Filterblasen auf die eigene politische Willensbildung); NW IF8 St2 (Algorithmen und Filter); IF2 St2 (Chancen und Risiken digitaler Medien für die politische Willensbildung).
      # Stimmen HE/BY/NW –/9-10/7-10 -> 9-10 (Mehrheit)
      - id: filterblasen
        name: { de: "Algorithmen und Filterblasen", en: "Algorithms and filter bubbles" }
        iCan: { de: "Ich kann erklären, wie Algorithmen und Filterblasen bestimmen, was ich im Netz sehe, und wie ich mir trotzdem ein ausgewogenes Urteil bilde." }
        gradeBand: "9-10"
        requires: [soziale-netzwerke, informationsquellen]
