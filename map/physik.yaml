# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
name: { de: Physik, en: Physics }                  # the file name is the subject's id: physik
source:
  title: KMK, Weiterentwickelte Bildungsstandards in den Naturwissenschaften für das Fach Physik (MSA), Beschluss vom 16.12.2004 i.d.F. vom 13.06.2024
  url: https://www.kmk.org/fileadmin/Dateien/veroeffentlichungen_beschluesse/2024/2024_06_13-WeBiS_Physik_MSA.pdf
strands:
  - id: energie
    name: { de: Energie, en: Energy }
    competencies:
      - id: energieformen
        iCan: "Ich kann Bewegungsenergie, Lageenergie, elektrische Energie, thermische Energie und Strahlungsenergie unterscheiden und Beispiele nennen."
        gradeBand: "7-8"
      - id: energie-und-joule
        iCan: "Ich kann Energie als physikalische Größe mit der Einheit Joule beschreiben."
        gradeBand: "7-8"
        requires: [energieformen]
      - id: lageenergie-bewegungsenergie
        iCan: "Ich kann erklären, wovon Lageenergie und Bewegungsenergie abhängen."
        gradeBand: "7-8"
        requires: [energieformen]
      - id: thermische-energie
        iCan: "Ich kann thermische Energie und Temperatur voneinander unterscheiden."
        gradeBand: "7-8"
        requires: [energieformen, temperatur]
      - id: energieumwandlung
        iCan: "Ich kann Energieumwandlungen in Geräten und Vorgängen mit einem Energieflussdiagramm beschreiben."
        gradeBand: "7-8"
        requires: [energieformen]
      - id: energieuebertragung
        iCan: "Ich kann beschreiben, wie Energie durch Arbeit, Wärme, Strahlung oder elektrischen Strom von einem Körper auf einen anderen übertragen wird."
        gradeBand: "7-8"
        requires: [energieumwandlung]
      - id: energieerhaltung
        iCan: "Ich kann mit dem Energieerhaltungssatz erklären, dass Energie nicht verloren geht, sondern nur umgewandelt oder übertragen wird."
        gradeBand: "7-8"
        requires: [energieumwandlung, energieuebertragung]
      - id: energieentwertung
        iCan: "Ich kann erklären, warum bei Energieumwandlungen ein Teil der Energie als nicht nutzbare Wärme entwertet wird."
        gradeBand: "9-10"
        requires: [energieerhaltung, thermische-energie]
      - id: energiebilanz
        iCan: "Ich kann die Energiebilanz eines Vorgangs berechnen."
        gradeBand: "9-10"
        requires: [energie-und-joule, energieerhaltung]
      - id: leistung
        iCan: "Ich kann Leistung als Energie pro Zeit erklären und mit der Einheit Watt angeben."
        gradeBand: "7-8"
        requires: [energie-und-joule]
      - id: leistung-berechnen
        iCan: "Ich kann Leistung, Energie oder Zeit aus den anderen beiden Größen berechnen."
        gradeBand: "9-10"
        requires: [leistung]
      - id: wirkungsgrad
        iCan: "Ich kann den Wirkungsgrad eines Geräts berechnen und bewerten."
        gradeBand: "9-10"
        requires: [energieentwertung, leistung-berechnen]
      - id: energiespeicherung
        iCan: "Ich kann erklären, wie Energie gespeichert werden kann, und Speicher wie Pumpspeicher oder Akku vergleichen."
        gradeBand: "9-10"
        requires: [energieumwandlung]
      - id: nachhaltige-energieversorgung
        iCan: "Ich kann Möglichkeiten einer nachhaltigen Energieversorgung vergleichen und bewerten."
        gradeBand: "9-10"
        requires: [energiespeicherung, stromversorgung]

  - id: elektrizitaetslehre
    name: { de: Elektrizitätslehre, en: Electricity }
    competencies:
      - id: einfacher-stromkreis
        iCan: "Ich kann einen einfachen Stromkreis aus Batterie, Lampe und Kabeln aufbauen und erklären, warum er geschlossen sein muss."
        gradeBand: "5-6"
      - id: leiter-nichtleiter
        iCan: "Ich kann Leiter und Nichtleiter unterscheiden und Beispiele nennen."
        gradeBand: "5-6"
        requires: [einfacher-stromkreis]
      - id: schalter
        iCan: "Ich kann erklären, wie ein Schalter einen Stromkreis öffnet und schließt."
        gradeBand: "5-6"
        requires: [einfacher-stromkreis]
      - id: schaltzeichen
        iCan: "Ich kann einen Stromkreis als Schaltplan mit Schaltzeichen zeichnen und einen Schaltplan lesen."
        gradeBand: "5-6"
        requires: [schalter]
      - id: reihenschaltung
        iCan: "Ich kann eine Reihenschaltung aufbauen und erklären, was passiert, wenn ein Bauteil ausfällt."
        gradeBand: "5-6"
        requires: [schaltzeichen]
      - id: parallelschaltung
        iCan: "Ich kann eine Parallelschaltung aufbauen und erklären, was passiert, wenn ein Zweig ausfällt."
        gradeBand: "5-6"
        requires: [schaltzeichen]
      - id: waermewirkung-strom
        iCan: "Ich kann die Wärmewirkung des elektrischen Stroms an Beispielen erklären."
        gradeBand: "5-6"
        requires: [einfacher-stromkreis]
      - id: lichtwirkung-strom
        iCan: "Ich kann die Lichtwirkung des elektrischen Stroms an Beispielen erklären."
        gradeBand: "5-6"
        requires: [einfacher-stromkreis]
      - id: magnetwirkung-strom
        iCan: "Ich kann die magnetische Wirkung des elektrischen Stroms an einem Elektromagneten erklären."
        gradeBand: "5-6"
        requires: [einfacher-stromkreis]
      - id: gefahren-des-stroms
        iCan: "Ich kann erklären, warum Strom aus der Steckdose gefährlich ist und Strom aus einer Batterie nicht."
        gradeBand: "5-6"
        requires: [einfacher-stromkreis]
      - id: sicher-mit-strom-umgehen
        iCan: "Ich kann Regeln für den sicheren Umgang mit Strom nennen und anwenden."
        gradeBand: "5-6"
        requires: [gefahren-des-stroms]
      - id: elektrische-ladung
        iCan: "Ich kann elektrische Ladung beschreiben und erklären, wie sich gleichartige und verschiedenartige Ladungen verhalten."
        gradeBand: "7-8"
      - id: stromstaerke
        iCan: "Ich kann die Stromstärke als Maß dafür erklären, wie viel Strom fließt, und sie in Ampere angeben."
        gradeBand: "7-8"
        requires: [einfacher-stromkreis]
      - id: stromstaerke-messen
        iCan: "Ich kann die Stromstärke mit einem Amperemeter richtig messen."
        gradeBand: "7-8"
        requires: [stromstaerke, schaltzeichen]
      - id: spannung
        iCan: "Ich kann die Spannung als Antrieb des Stroms erklären und sie in Volt angeben."
        gradeBand: "7-8"
        requires: [einfacher-stromkreis]
      - id: spannung-messen
        iCan: "Ich kann die Spannung mit einem Voltmeter richtig messen."
        gradeBand: "7-8"
        requires: [spannung, schaltzeichen]
      - id: widerstand
        iCan: "Ich kann den elektrischen Widerstand als Maß dafür erklären, wie stark ein Bauteil den Strom hemmt, und ihn in Ohm angeben."
        gradeBand: "7-8"
        requires: [stromstaerke, spannung, leiter-nichtleiter]
      - id: widerstand-einflussgroessen
        iCan: "Ich kann erklären, wie der Widerstand eines Drahtes von Material, Länge und Dicke abhängt."
        gradeBand: "7-8"
        requires: [widerstand]
      - id: ohmsches-gesetz
        iCan: "Ich kann den Zusammenhang zwischen Spannung und Stromstärke in einem Diagramm darstellen und beschreiben."
        gradeBand: "7-8"
        requires: [stromstaerke-messen, spannung-messen, widerstand]
      - id: ohmsches-gesetz-rechnen
        iCan: "Ich kann mit dem ohmschen Gesetz R = U / I eine fehlende Größe berechnen."
        gradeBand: "7-8"
        requires: [ohmsches-gesetz]
      - id: reihenschaltung-groessen
        iCan: "Ich kann in einer Reihenschaltung Stromstärke und Spannungen vorhersagen, berechnen und messen."
        gradeBand: "7-8"
        requires: [reihenschaltung, ohmsches-gesetz-rechnen]
      - id: parallelschaltung-groessen
        iCan: "Ich kann in einer Parallelschaltung Stromstärken und Spannung vorhersagen, berechnen und messen."
        gradeBand: "7-8"
        requires: [parallelschaltung, ohmsches-gesetz-rechnen]
      - id: gesamtwiderstand
        iCan: "Ich kann den Gesamtwiderstand von Reihen- und Parallelschaltungen berechnen."
        gradeBand: "9-10"
        requires: [reihenschaltung-groessen, parallelschaltung-groessen]
      - id: elektrische-leistung
        iCan: "Ich kann die elektrische Leistung aus Spannung und Stromstärke berechnen."
        gradeBand: "9-10"
        requires: [leistung, ohmsches-gesetz-rechnen]
      - id: elektrische-energie
        iCan: "Ich kann die elektrische Energie eines Geräts aus Leistung und Zeit berechnen und in Kilowattstunden angeben."
        gradeBand: "9-10"
        requires: [elektrische-leistung]
      - id: elektromagnetische-induktion
        iCan: "Ich kann erklären, wie sich durch ein sich änderndes Magnetfeld in einer Spule eine Spannung erzeugen lässt."
        gradeBand: "9-10"
        requires: [magnetwirkung-strom, spannung]
      - id: generator
        iCan: "Ich kann erklären, wie ein Generator mit Induktion Wechselspannung erzeugt."
        gradeBand: "9-10"
        requires: [elektromagnetische-induktion]
      - id: transformator
        iCan: "Ich kann erklären, wie ein Transformator Spannungen verändert, und die Spannungen berechnen."
        gradeBand: "9-10"
        requires: [elektromagnetische-induktion]
      - id: stromversorgung
        iCan: "Ich kann den Weg des Stroms vom Kraftwerk bis zur Steckdose beschreiben und erklären, warum Strom mit hoher Spannung übertragen wird."
        gradeBand: "9-10"
        requires: [generator, transformator, elektrische-leistung]

  - id: mechanik
    name: { de: Mechanik, en: Mechanics }
    competencies:
      - id: strecke-und-zeit-messen
        iCan: "Ich kann Strecken und Zeiten messen und in passenden Einheiten angeben."
        gradeBand: "5-6"
      - id: geschwindigkeit
        iCan: "Ich kann Geschwindigkeit als Strecke pro Zeit erklären."
        gradeBand: "7-8"
        requires: [strecke-und-zeit-messen]
      - id: geschwindigkeit-berechnen
        iCan: "Ich kann Geschwindigkeit, Strecke oder Zeit aus den anderen beiden Größen berechnen und Einheiten umrechnen."
        gradeBand: "7-8"
        requires: [geschwindigkeit]
      - id: geschwindigkeitsaenderung
        iCan: "Ich kann beschreiben, wann sich eine Bewegung beschleunigt, verlangsamt oder die Richtung ändert."
        gradeBand: "7-8"
        requires: [geschwindigkeit]
      - id: bewegungsdiagramme
        iCan: "Ich kann eine Bewegung in einem Weg-Zeit-Diagramm und einem Geschwindigkeit-Zeit-Diagramm darstellen und ablesen."
        gradeBand: "7-8"
        requires: [geschwindigkeit-berechnen]
      - id: kraft-wirkungen
        iCan: "Ich kann erklären, dass eine Kraft einen Körper verformen oder seine Bewegung ändern kann."
        gradeBand: "7-8"
      - id: kraft-darstellen
        iCan: "Ich kann eine Kraft mit Betrag und Richtung als Pfeil darstellen und mit einem Kraftmesser messen."
        gradeBand: "7-8"
        requires: [kraft-wirkungen]
      - id: kraefte-zusammensetzen
        iCan: "Ich kann Kräfte auf einen Körper zeichnerisch zusammensetzen und das Kräftegleichgewicht erkennen."
        gradeBand: "9-10"
        requires: [kraft-darstellen]
      - id: kraft-aendert-geschwindigkeit
        iCan: "Ich kann erklären, wie eine Kraft den Betrag und die Richtung der Geschwindigkeit ändert."
        gradeBand: "9-10"
        requires: [kraft-darstellen, geschwindigkeitsaenderung]
      - id: traegheitsprinzip
        iCan: "Ich kann mit dem Trägheitsprinzip erklären, wie sich ein Körper bewegt, wenn keine Kraft oder ein Kräftegleichgewicht auf ihn wirkt."
        gradeBand: "9-10"
        requires: [kraft-aendert-geschwindigkeit, kraefte-zusammensetzen]
      - id: masse
        iCan: "Ich kann Masse als Eigenschaft eines Körpers erklären und mit einer Waage messen."
        gradeBand: "5-6"
      - id: gewichtskraft
        iCan: "Ich kann Masse und Gewichtskraft unterscheiden und erklären, dass die Gewichtskraft vom Ort abhängt."
        gradeBand: "7-8"
        requires: [masse, kraft-darstellen]
      - id: gewichtskraft-berechnen
        iCan: "Ich kann die Gewichtskraft aus der Masse berechnen."
        gradeBand: "7-8"
        requires: [gewichtskraft]

  - id: elektromagnetische-strahlung
    name: { de: Elektromagnetische Strahlung, en: Electromagnetic radiation }
    competencies:
      - id: temperatur
        iCan: "Ich kann Temperaturen mit einem Thermometer messen und in Grad Celsius angeben."
        gradeBand: "5-6"
      - id: geradlinige-lichtausbreitung
        iCan: "Ich kann erklären, dass sich Licht geradlinig ausbreitet, und Lichtstrahlen zeichnen."
        gradeBand: "5-6"
      - id: schatten
        iCan: "Ich kann Schatten mit der geradlinigen Ausbreitung des Lichts erklären und ihre Form vorhersagen."
        gradeBand: "5-6"
        requires: [geradlinige-lichtausbreitung]
      - id: mondphasen
        iCan: "Ich kann die Mondphasen mit der Stellung von Sonne, Erde und Mond erklären."
        gradeBand: "7-8"
        requires: [schatten]
      - id: finsternisse
        iCan: "Ich kann Sonnenfinsternis und Mondfinsternis erklären."
        gradeBand: "7-8"
        requires: [mondphasen]
      - id: wahrnehmungsgrenzen
        iCan: "Ich kann erklären, welche Strahlung Lebewesen wahrnehmen und welche nur Sensoren erfassen, zum Beispiel Wärmestrahlung."
        gradeBand: "7-8"
        requires: [geradlinige-lichtausbreitung]
      - id: waermestrahlung
        iCan: "Ich kann Wärmestrahlung beschreiben und erklären, wie sie mit der Temperatur eines Körpers zusammenhängt."
        gradeBand: "7-8"
        requires: [temperatur, wahrnehmungsgrenzen]
      - id: reflexion
        iCan: "Ich kann das Reflexionsgesetz anwenden und den Weg des Lichts an einem Spiegel zeichnen."
        gradeBand: "5-6"
        requires: [geradlinige-lichtausbreitung]
      - id: streuung
        iCan: "Ich kann erklären, wie Licht an rauen Flächen und an Teilchen gestreut wird."
        gradeBand: "7-8"
        requires: [reflexion]
      - id: brechung
        iCan: "Ich kann erklären und zeichnen, wie Licht beim Übergang in einen anderen durchsichtigen Stoff gebrochen wird."
        gradeBand: "7-8"
        requires: [geradlinige-lichtausbreitung]
      - id: absorption-emission-transmission
        iCan: "Ich kann Absorption, Emission und Transmission von Strahlung unterscheiden und an Beispielen erklären."
        gradeBand: "7-8"
        requires: [reflexion, waermestrahlung]
      - id: wellenlaenge
        iCan: "Ich kann Strahlung mit ihrer Wellenlänge beschreiben."
        gradeBand: "9-10"
        requires: [wahrnehmungsgrenzen]
      - id: elektromagnetisches-spektrum
        iCan: "Ich kann das elektromagnetische Spektrum nach der Wellenlänge ordnen: Mobilfunk, Wärmestrahlung, sichtbares Licht und Röntgenstrahlung."
        gradeBand: "9-10"
        requires: [wellenlaenge]
      - id: mobilfunkstrahlung-roentgenstrahlung
        iCan: "Ich kann Nutzen und Risiken von Mobilfunkstrahlung und Röntgenstrahlung vergleichen."
        gradeBand: "9-10"
        requires: [elektromagnetisches-spektrum]
      - id: strahlungshaushalt-erde
        iCan: "Ich kann den Strahlungshaushalt der Erde beschreiben, auch das Rückstrahlvermögen von Flächen."
        gradeBand: "9-10"
        requires: [absorption-emission-transmission, elektromagnetisches-spektrum]
      - id: treibhauseffekt
        iCan: "Ich kann den natürlichen und den menschengemachten Treibhauseffekt erklären."
        gradeBand: "9-10"
        requires: [strahlungshaushalt-erde]
      - id: kippelemente
        iCan: "Ich kann erklären, was Kippelemente im Klimasystem sind, und ein Beispiel beschreiben."
        gradeBand: "9-10"
        requires: [treibhauseffekt]

  - id: ionisierende-strahlung
    name: { de: Ionisierende Strahlung, en: Ionising radiation }
    competencies:
      - id: radioaktivitaet
        iCan: "Ich kann erklären, was radioaktive Strahlung ist und wo sie vorkommt."
        gradeBand: "9-10"
        requires: [elektromagnetisches-spektrum]
      - id: aktivitaet-zaehlrate
        iCan: "Ich kann Aktivität und Zählrate unterscheiden und Zählraten mit einem Zählrohr deuten."
        gradeBand: "9-10"
        requires: [radioaktivitaet]
      - id: spontanzerfall
        iCan: "Ich kann den Zerfall von Atomkernen als Zufallsprozess beschreiben."
        gradeBand: "9-10"
        requires: [radioaktivitaet]
      - id: halbwertszeit
        iCan: "Ich kann erklären, was die Halbwertszeit ist, und sie aus einem Zerfallsdiagramm ablesen."
        gradeBand: "9-10"
        requires: [spontanzerfall, aktivitaet-zaehlrate]
      - id: halbwertszeit-rechnen
        iCan: "Ich kann mit der Halbwertszeit berechnen, wie viel einer radioaktiven Probe nach einer gegebenen Zeit übrig ist."
        gradeBand: "9-10"
        requires: [halbwertszeit]
      - id: absorption-ionisierender-strahlung
        iCan: "Ich kann erklären, wie sich ionisierende Strahlung abschirmen lässt."
        gradeBand: "9-10"
        requires: [radioaktivitaet]
      - id: biologische-wirkung
        iCan: "Ich kann die biologische Wirkung ionisierender Strahlung beschreiben und Regeln des Strahlenschutzes nennen."
        gradeBand: "9-10"
        requires: [absorption-ionisierender-strahlung]
      - id: medizinische-nutzung
        iCan: "Ich kann Nutzen und Risiken ionisierender Strahlung in der Medizin abwägen."
        gradeBand: "9-10"
        requires: [biologische-wirkung]
      - id: kernspaltung
        iCan: "Ich kann die Kernspaltung beschreiben und erklären, wie ein Kernkraftwerk Energie gewinnt."
        gradeBand: "9-10"
        requires: [spontanzerfall, energieumwandlung]
      - id: kernfusion
        iCan: "Ich kann die Kernfusion beschreiben und mit der Kernspaltung vergleichen."
        gradeBand: "9-10"
        requires: [kernspaltung]
      - id: lagerung-radioaktiver-abfaelle
        iCan: "Ich kann erklären, warum radioaktive Abfälle sicher gelagert werden müssen und welche Fragen dabei offen sind."
        gradeBand: "9-10"
        requires: [halbwertszeit, kernspaltung]
