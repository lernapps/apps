# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Latein als zweite Fremdsprache, Gymnasium Sekundarstufe I. Es gibt keine KMK-Bildungsstandards Latein (weder MSA
# noch Abitur, nur die EPA Latein von 1980 i. d. F. 2005); gemeinsamer Bezug der Länder ist die KMK-Vereinbarung über das Latinum.
# Quellenkürzel in den Kommentaren:
#   HE = Lehrplan Latein, Gymnasialer Bildungsgang (G9), Hessen, Teil B 2 Latein als 2. Fremdsprache, Jahrgang 7 bis 10;
#        Zahl = Jahrgang, dann der Abschnitt (1.1 Phonetik, 1.2 Lexik, 1.3 Syntax, 1.4 Morphologie, 2 Text, 3 Inhalte, 4 Methoden)
#   KC = Kerncurriculum Hessen Sek I Gymnasium Latein (2011): 7.1 Spracherwerbsphase, 7.2 Übergangsphase, Kap. 6 Abschluss Latinum
#   BY = LehrplanPLUS Gymnasium Bayern, Latein 6 bis 8 (2. Fremdsprache), Latein 9 und 10 (1./2. Fremdsprache); L6 = Jahrgang 6,
#        LB = Lernbereich, 2.1 Wortschatz, 2.2 Formenlehre, 2.3 Satzlehre, LB3 Kultureller Kontext, LB4 Methodik
#   NW = Kernlehrplan Latein Sek I Gymnasium G9 NRW (2019), Kap. 2.2 Latein als 2. Fremdsprache; St1 = erste Stufe, St2 = zweite Stufe;
#        IF1 Antike Welt, IF2 Textgestaltung, IF3 Sprachsystem
# Richtstufe = Drittel des Lehrgangs, nicht Jahrgang (Skill map-research, Fremdsprachen): Lernjahr y von n -> Teil
# floor(3(y - 1/2)/n) + 1, Teil 1 -> 5-6, 2 -> 7-8, 3 -> 9-10. Stimmen: HE L2 ab Jg 7 (n = 4): 7 -> 5-6, 8 und 9 -> 7-8,
# 10 -> 9-10; KC ohne Jahrgang: Spracherwerbsphase (Lernjahre 1-3) -> 5-6/7-8, Latinum (Lernjahr 4) -> 9-10.
# BY L2 ab Jg 6 (n = 5): 6 und 7 -> 5-6, 8 -> 7-8, 9 und 10 -> 9-10. NW L2 ab Jg 7 (n = 4): St1 (Lernjahre 1-2) -> 5-6/7-8,
# St2 (Lernjahre 3-4) -> 7-8/9-10. Das SiLP stimmt nicht mit. Gleichstand -> frühere Stufe, außer requires erzwingt die spätere.
# Klumpen: Hält eine Stufe mehr als die Hälfte eines Strangs, ist der Strang entlang requires in Drittel geteilt (Reihenfolge:
# requires, dann Stufe der Stimmen, dann Median der Lage im Lehrgang, dann Reihenfolge in der Datei); "Klumpen verteilt: Rang r/N"
# im Kommentar. Genaue Titel, Ausgaben, URLs und Entscheidungen: .vibe/research-latein.md.
# SCHWACH BELEGT = nur knapp oder nur allgemein belegt.
name: { de: Latein, en: Latin }                    # the file name is the subject's id: latein
source:
  title: KMK, Vereinbarung über das Latinum und das Graecum, Beschluss vom 22.09.2005 (gemeinsamer Bezug der Länder; KMK-Bildungsstandards Latein gibt es nicht)
  url: https://www.kmk.org/fileadmin/Dateien/veroeffentlichungen_beschluesse/2005/2005_09_22_VB_Latinum_Graecum.pdf
strands:
  - id: wortschatz
    name: { de: "Wortschatz, Wortbildung und Aussprache", en: "Vocabulary, word formation and pronunciation" }
    competencies:
      # HE 7 1.1 Phonetik (Aussprache, Quantitäten, Paenultimagesetz); BY L6 2.1 (quantitätsgerecht, korrekte Betonung); NW St2 Textkompetenz (lateinische Texte sinngemäß lesen); KC 7.1 Phonetik (Aussprache- und Betonungsregeln). Stimmen HE/BY/NW 5-6 | 5-6 | 7-8/9-10 -> 5-6 (Mehrheit). NW nennt nur das sinngemäße Lesen
      - id: aussprache-und-betonung
        iCan: "Ich kann lateinische Wörter richtig aussprechen und nach der Paenultima-Regel betonen."
        gradeBand: "5-6"
      # HE 7 4.2 Lexik (Vokabelkartei mit vollständiger Vokabelangabe); BY L6 2.1 (ca. 450 Wörter), LB4 (Vokabelkartei, Lerntechniken); NW St1 Sprachkompetenz (grundlegender Wortschatz; Strategien des Sprachenlernens); KC 7.1 Lexik (Grundwortschatz, Mnemotechniken). Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit)
      - id: vokabeln-lernen
        iCan: "Ich kann Vokabeln mit allen Lernangaben, zum Beispiel Genitiv, Genus und Stammformen, lernen und regelmäßig wiederholen."
        gradeBand: "5-6"
      # HE 7 1.2 Lexik (flektierbare und nichtflektierbare Wortarten); BY L6 2.1 (nach Wortarten ordnen), 2.2 (Grundbegriffe); NW St1 IF3 Wortarten. Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit)
      - id: wortarten
        iCan: "Ich kann die Wortarten Substantiv, Adjektiv, Verb, Pronomen, Adverb, Präposition und Konjunktion unterscheiden."
        gradeBand: "5-6"
      # HE 7 1.2 Lexik (Wortfamilien, Wortfelder, Sachfelder); BY L6 2.1 (Wort- und Sachfelder, Wortfamilien); NW St1 IF2 Textstruktur (Sachfelder); KC 7.1 Sprachkompetenz (Wortschatz nach Sach- und Wortfeldern strukturieren). Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit)
      - id: wortfelder-und-sachfelder
        iCan: "Ich kann Vokabeln nach Wortfamilien, Wortfeldern und Sachfeldern ordnen."
        gradeBand: "5-6"
        requires: [wortarten]
      # SCHWACH BELEGT (nur HE; aufgenommen als direkte Voraussetzung von wortbildung-praefixe). HE 7 1.1 Lautgesetze (Assimilation, Rhotazismus, Vokalschwächung). Stimmen HE/BY/NW 5-6 | – | – -> 5-6 (einzige Stimme). BY L9/L10 2.2 nennt nur allgemein Besonderheiten der Lautlehre
      - id: lautgesetze
        iCan: "Ich kann Lautveränderungen wie die Assimilation (ad-ferre wird zu afferre), den Rhotazismus und die Vokalschwächung erkennen."
        gradeBand: "5-6"
      # HE 7 1.2 Grundlagen der Wortbildung (Zusammensetzung); BY L6 2.1 (einfache Regeln der Wortbildungslehre); NW St1 Sprachkompetenz (ausgewählte Prinzipien der Wortbildungslehre). Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit; Klumpen verteilt: Rang 6/15 im Strang -> 7-8). Richtstufe 7-8
      - id: wortbildung-praefixe
        iCan: "Ich kann zusammengesetzte Wörter in Präfix und Grundwort zerlegen und so ihre Bedeutung erschließen, zum Beispiel ab-ire und ad-esse."
        gradeBand: "7-8"
        requires: [wortfelder-und-sachfelder, lautgesetze]
      # HE 7 1.2 Grundlagen der Wortbildung (Ableitung); BY L7 2.1 (weitere Regeln der Wortbildung); NW St2 Sprachkompetenz (grundlegende Prinzipien der Wortbildungslehre). Stimmen HE/BY/NW 5-6 | 5-6 | 7-8/9-10 -> 5-6 (Mehrheit; Klumpen verteilt: Rang 12/15 im Strang -> 9-10). Richtstufe 9-10
      - id: wortbildung-suffixe
        iCan: "Ich kann abgeleitete Wörter an ihren Suffixen erkennen, zum Beispiel -tor, -tas, -io und -osus, und ihre Bedeutung erschließen."
        gradeBand: "9-10"
        requires: [wortfelder-und-sachfelder]
      # HE 7 2.4 Texterschließung auf Wortebene (Bedeutung aus Kontext und Syntax); BY L6 2.1 (kontextspezifische Bedeutung mehrdeutiger Wörter, unter Anleitung); NW St1 IF3 (Wörter des Grundwortschatzes angemessen monosemieren); KC 7.1 Sprachkompetenz (polyseme Vokabeln kontextgerecht unterscheiden). Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit; Klumpen verteilt: Rang 7/15 im Strang -> 7-8). Richtstufe 7-8
      - id: bedeutung-im-kontext
        iCan: "Ich kann bei einem Wort mit mehreren Bedeutungen die passende Bedeutung aus dem Zusammenhang wählen."
        gradeBand: "7-8"
        requires: [vokabeln-lernen]
      # HE 10 4.2 Lexik (Wortbedeutung aus der Wortfamilie erschließen); BY L6 2.1 (Ableitung aus Bekanntem, einfacher Kontext, Wortbildungsregeln); NW St1 Sprachkompetenz (Bedeutung unbekannter Wörter mit der Wortbildungslehre erschließen). Stimmen HE/BY/NW 9-10 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit; Klumpen verteilt: Rang 13/15 im Strang -> 9-10). Richtstufe 9-10
      - id: unbekannte-woerter-erschliessen
        iCan: "Ich kann die Bedeutung eines unbekannten Wortes aus verwandten Wörtern, der Wortbildung und dem Zusammenhang erschließen."
        gradeBand: "9-10"
        requires: [wortbildung-praefixe, wortbildung-suffixe, bedeutung-im-kontext]
      # HE 7 1.2 Rezeption in anderen Sprachen (Lehn- und Fremdwörter im Deutschen); BY L6 2.1 (Lehn- und Fremdwörter); NW St1 IF3 (Bedeutung von Lehn- und Fremdwörtern erläutern); KC 7.1 Sprachkompetenz (Fremd- und Lehnwörter zurückführen). Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit; Klumpen verteilt: Rang 8/15 im Strang -> 7-8). Richtstufe 7-8
      - id: lehn-und-fremdwoerter
        iCan: "Ich kann deutsche Lehn- und Fremdwörter auf ihr lateinisches Ursprungswort zurückführen und ihre Bedeutung erklären."
        gradeBand: "7-8"
        requires: [vokabeln-lernen]
      # HE 7 1.2 Rezeption in anderen Sprachen (Parallelen in Englisch und den romanischen Sprachen); BY L6 2.1 (Verwandtschaft im Lateinischen, Deutschen, Englischen und in den romanischen Sprachen); NW St1 Sprachkompetenz (mit Einsichten in Semantik Wörter anderer Sprachen erschließen). Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit; Klumpen verteilt: Rang 9/15 im Strang -> 7-8). Richtstufe 7-8
      - id: latein-und-moderne-sprachen
        iCan: "Ich kann lateinische Wörter im Englischen und in romanischen Sprachen wie Französisch, Italienisch oder Spanisch wiedererkennen."
        gradeBand: "7-8"
        requires: [lehn-und-fremdwoerter]
      # HE 8 2.3 Textgattungen (Sentenzen, Sprichwörter); BY L6 2.1 (lateinische Wendungen wörtlich und übertragen), LB3 (Sentenzen, geflügelte Worte). Stimmen HE/BY/NW 7-8 | 5-6 | – -> 5-6 (Gleichstand 5-6/7-8, ohne Bindung durch requires: frühere Stufe; Klumpen verteilt: Rang 10/15 im Strang -> 7-8). Richtstufe 7-8. NW nennt Wendungen nicht eigens
      - id: lateinische-wendungen
        iCan: "Ich kann bekannte lateinische Wendungen und Sprichwörter wie „carpe diem“ wörtlich und im übertragenen Sinn verstehen."
        gradeBand: "7-8"
        requires: [bedeutung-im-kontext]
      # HE 8 2.3 Textgattungen (Inschriften); BY L6 2.1 (Inschriften, Abkürzungen), weiter in L7 und L8. Stimmen HE/BY/NW 7-8 | 5-6 | – -> 5-6 (Gleichstand 5-6/7-8, ohne Bindung durch requires: frühere Stufe; Klumpen verteilt: Rang 11/15 im Strang -> 9-10). Richtstufe 9-10. NW nennt Inschriften nicht
      - id: inschriften-und-abkuerzungen
        iCan: "Ich kann einfache lateinische Inschriften und Abkürzungen in meiner Umgebung lesen und erklären, zum Beispiel etc., e. g. oder n. Chr."
        gradeBand: "9-10"
        requires: [vokabeln-lernen]
      # HE 10 1.2 Lexik (Einführung einer Wortkunde und/oder eines Lexikons), 4.2 (Umgang mit dem Wörterbuch); BY L9 2.1 (mithilfe des Wörterbuchs die kontextspezifische Bedeutung), LB3 (Ordnungsprinzipien des Schulwörterbuchs); NW St2 IF3 (Wörter mit einem zweisprachigen Wörterbuch kontextbezogen monosemieren); KC 7.2 Übergangsphase (Wörterbuch und Wortkunde unter Anleitung nutzen). Stimmen HE/BY/NW 9-10 | 9-10 | 7-8/9-10 -> 9-10 (Mehrheit)
      - id: woerterbuch-benutzen
        iCan: "Ich kann in einem lateinisch-deutschen Wörterbuch die Grundform eines Wortes nachschlagen und die passende Bedeutung auswählen."
        gradeBand: "9-10"
        requires: [bedeutung-im-kontext, stammformen]
      # HE 10 1.2 Lexik (Erweiterung autorenbezogen, lektürebezogene Vokabelkartei); BY L9 2.1 (lektürebegleitender Wortschatz); NW St2 IF3 (autoren- und themenspezifisch erweiterter Grundwortschatz); KC Kap. 6 Lexik (autoren- und textspezifische Vokabeln). Stimmen HE/BY/NW 9-10 | 9-10 | 7-8/9-10 -> 9-10 (Mehrheit)
      - id: lektuerewortschatz
        iCan: "Ich kann meinen Grundwortschatz um die typischen Wörter eines Autors oder Themas erweitern, zum Beispiel um Militärwörter bei Caesar."
        gradeBand: "9-10"
        requires: [vokabeln-lernen, wortfelder-und-sachfelder]
  - id: formenlehre
    name: { de: "Formenlehre", en: "Morphology" }
    competencies:
      # HE 7 1.4 Morphologie (Stamm und Endung), 1.3 (Funktion der Kasus: Einführung); BY L6 2.2 (Grundbegriffe Deklination, Kasus, Numerus, Genus); NW St1 IF3 (Morpheme der Kasus). Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit)
      - id: kasus-numerus-genus
        iCan: "Ich kann bei einem Nomen Kasus, Numerus und Genus bestimmen und die sechs lateinischen Kasus nennen."
        gradeBand: "5-6"
        requires: [wortarten]
      # HE 7 1.4 Nominale Flexion (a- und o-Deklination); BY L6 2.2 (1. bis 3. Deklinationsklasse in allen Kasus); NW St1 IF3 (Kasus in der a-, o- und dritten Deklination). Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit)
      - id: a-deklination
        iCan: "Ich kann Substantive der a-Deklination in allen Kasus bilden und bestimmen."
        gradeBand: "5-6"
        requires: [kasus-numerus-genus]
      # HE 7 1.4 Nominale Flexion (a- und o-Deklination); BY L6 2.2 (1. bis 3. Deklinationsklasse); NW St1 IF3 (a-, o- und dritte Deklination). Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit)
      - id: o-deklination
        iCan: "Ich kann Substantive der o-Deklination auf -us, -er und -um in allen Kasus bilden und bestimmen."
        gradeBand: "5-6"
        requires: [kasus-numerus-genus]
      # HE 7 1.4 Substantive und Adjektive (a- und o-Deklination); BY L6 2.2 (Substantive und Adjektive der 1. bis 3. Deklination); NW St1 IF3 Wortarten (Adjektiv). Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit)
      - id: adjektive-a-o-deklination
        iCan: "Ich kann Adjektive der a- und o-Deklination wie bonus, bona, bonum bilden und dem passenden Substantiv zuordnen."
        gradeBand: "5-6"
        requires: [a-deklination, o-deklination]
      # HE 7 1.4 Nominale Flexion (3. Deklination: Einführung); BY L6 2.2 (Substantive der 3. Deklinationsklasse); NW St1 IF3 (dritte Deklination). Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit)
      - id: dritte-deklination
        iCan: "Ich kann Substantive der 3. Deklination bilden und bestimmen und dabei Nominativ und Stamm zusammen lernen, zum Beispiel rex, regis."
        gradeBand: "5-6"
        requires: [kasus-numerus-genus]
      # HE 8 1.4 Nominale Flexion (3. Deklination: Ergänzung); BY L7 2.2 (weitere Substantive v. a. der 3. Deklination); NW St1 IF3 (dritte Deklination). Stimmen HE/BY/NW 7-8 | 5-6 | 5-6/7-8 -> 5-6 (Gleichstand 5-6/7-8, ohne Bindung durch requires: frühere Stufe; Klumpen verteilt: Rang 25/54 im Strang -> 7-8). Richtstufe 7-8. NW nennt die dritte Deklination nur als Ganzes
      - id: dritte-deklination-i-staemme
        iCan: "Ich kann die Besonderheiten der i-Stämme und Mischstämme der 3. Deklination erkennen, zum Beispiel mare, mari und urbs, urbium."
        gradeBand: "7-8"
        requires: [dritte-deklination]
      # HE 9 1.4 Adjektive und Partizip Präsens (3. Deklination: Ergänzung); BY L6 2.2 (Adjektive der 1. bis 3. Deklination); NW St1 IF3 Wortarten (Adjektiv in der dritten Deklination). Stimmen HE/BY/NW 7-8 | 5-6 | 5-6/7-8 -> 5-6 (Gleichstand 5-6/7-8, ohne Bindung durch requires: frühere Stufe; Klumpen verteilt: Rang 26/54 im Strang -> 7-8). Richtstufe 7-8
      - id: adjektive-dritte-deklination
        iCan: "Ich kann ein-, zwei- und dreiendige Adjektive der 3. Deklination wie felix, fortis und acer bilden und bestimmen."
        gradeBand: "7-8"
        requires: [dritte-deklination-i-staemme, adjektive-a-o-deklination]
      # HE 8 1.4 Nominale Flexion (u- und e-Deklination); BY L7 2.2 (Substantive der 4. Deklination); NW St2 IF3 (ausgewählte Substantive der e- und u-Deklination). Stimmen HE/BY/NW 7-8 | 5-6 | 7-8/9-10 -> 7-8 (Mehrheit)
      - id: u-deklination
        iCan: "Ich kann Substantive der u-Deklination wie portus und manus bilden und bestimmen."
        gradeBand: "7-8"
        requires: [kasus-numerus-genus]
      # HE 8 1.4 Nominale Flexion (u- und e-Deklination); BY L7 2.2 (Substantive der 5. Deklination); NW St2 IF3 (ausgewählte Substantive der e- und u-Deklination). Stimmen HE/BY/NW 7-8 | 5-6 | 7-8/9-10 -> 7-8 (Mehrheit)
      - id: e-deklination
        iCan: "Ich kann Substantive der e-Deklination wie res und dies bilden und bestimmen."
        gradeBand: "7-8"
        requires: [kasus-numerus-genus]
      # HE 7 1.4 Adverb (Ableitung von Adjektiven der a- und o-Deklination); 9 (der 3. Deklination); BY L8 2.2 Adverbien (Adverbbildung); NW St1 IF3 Wortarten (Adverb). Stimmen HE/BY/NW 5-6 | 7-8 | 5-6/7-8 -> 5-6 (Gleichstand 5-6/7-8, ohne Bindung durch requires: frühere Stufe; Klumpen verteilt: Rang 27/54 im Strang -> 7-8). Richtstufe 7-8
      - id: adverbien-bilden
        iCan: "Ich kann Adverbien aus Adjektiven bilden, zum Beispiel laete aus laetus und fortiter aus fortis."
        gradeBand: "7-8"
        requires: [adjektive-a-o-deklination, adjektive-dritte-deklination]
      # HE 9 1.4 Adjektiv und Adverb (Komparation, Bildung und Deklination der Steigerungsformen); BY L8 2.2 Nomina (Steigerung der Adjektive); NW St2 IF3 (Komparation). Stimmen HE/BY/NW 7-8 | 7-8 | 7-8/9-10 -> 7-8 (Mehrheit; Klumpen verteilt: Rang 50/54 im Strang -> 9-10). Richtstufe 9-10
      - id: komparation-adjektive
        iCan: "Ich kann Komparativ und Superlativ von Adjektiven bilden und erkennen, auch bei unregelmäßigen wie bonus, melior, optimus."
        gradeBand: "9-10"
        requires: [adjektive-dritte-deklination]
      # HE 9 1.4 Adjektiv und Adverb (Komparation); BY L8 2.2 Adverbien (Steigerung); NW St2 IF3 (Komparation). Stimmen HE/BY/NW 7-8 | 7-8 | 7-8/9-10 -> 7-8 (Mehrheit; Klumpen verteilt: Rang 51/54 im Strang -> 9-10). Richtstufe 9-10
      - id: komparation-adverbien
        iCan: "Ich kann gesteigerte Adverbien bilden und erkennen, zum Beispiel celerius und celerrime."
        gradeBand: "9-10"
        requires: [komparation-adjektive, adverbien-bilden]
      # SCHWACH BELEGT (NW nennt Zahlwörter nicht; HE und BY stufen sehr verschieden ein). HE 9 1.4 Numeralia (unus, duo, tres; Rest fakultativ); BY L6 2.2 Numeralia (Kardinalia und Ordinalia 1 bis 12). Stimmen HE/BY/NW 7-8 | 5-6 | – -> 5-6 (Gleichstand 5-6/7-8, ohne Bindung durch requires: frühere Stufe; Klumpen verteilt: Rang 33/54 im Strang -> 7-8). Richtstufe 7-8. Gleichstand 5-6/9-10, 5-6 nicht möglich wegen requires
      - id: zahlwoerter
        iCan: "Ich kann die lateinischen Grundzahlen bis zehn und die häufigsten Ordnungszahlen erkennen und unus, duo, tres deklinieren."
        gradeBand: "7-8"
        requires: [adjektive-a-o-deklination, dritte-deklination]
      # HE 7 1.4 Pronomina (Personal- und Possessivpronomen); BY L6 2.2 Pronomina (Personalpronomen); NW St1 IF3 (Personalpronomina). Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit)
      - id: personalpronomen
        iCan: "Ich kann die Personalpronomen ego, tu, nos und vos in allen Kasus erkennen und übersetzen."
        gradeBand: "5-6"
        requires: [kasus-numerus-genus]
      # HE 7 1.4 Pronomina (Possessivpronomen); BY L6 2.2 Pronomina (Possessivpronomen). Stimmen HE/BY/NW 5-6 | 5-6 | – -> 5-6 (Mehrheit). NW nennt Possessivpronomina nicht eigens
      - id: possessivpronomen
        iCan: "Ich kann die Possessivpronomen meus, tuus, noster und vester erkennen und dem Bezugswort zuordnen."
        gradeBand: "5-6"
        requires: [personalpronomen, adjektive-a-o-deklination]
      # HE 7 1.3 Nomen (nichtreflexiv, direkt und indirekt reflexiv); BY L6 2.2 Pronomina (Reflexivpronomen); NW St1 IF3 (Reflexivpronomina). Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit)
      - id: reflexivpronomen
        iCan: "Ich kann die Reflexivpronomen se, sibi und suus erkennen und richtig übersetzen."
        gradeBand: "5-6"
        requires: [personalpronomen, possessivpronomen]
      # HE 7 1.4 Pronomina (is, ea, id), 1.3 (Gebrauch von is, ea, id); BY L6 2.2 Pronomina (Pronomen is); NW St1 IF3 (Demonstrativpronomina). Stimmen HE/BY/NW 5-6 | 5-6 | 5-6/7-8 -> 5-6 (Mehrheit)
      - id: is-ea-id
        iCan: "Ich kann das Pronomen is, ea, id in allen Formen erkennen und je nach Satz mit „er, sie, es“ oder „dieser“ übersetzen."
        gradeBand: "5-6"
        requires: [a-deklination, o-deklination]
      # HE 8 1.4 Pronomina (Demonstrativpronomina); BY L7 2.2 Pronomina (hic, ille, iste); NW St1 IF3 (Demonstrativpronomina). Stimmen HE/BY/NW 7-8 | 5-6 | 5-6/7-8 -> 5-6 (Gleichstand 5-6/7-8, ohne Bindung durch requires: frühere Stufe; Klumpen verteilt: Rang 28/54 im Strang -> 7-8). Richtstufe 7-8
      - id: demonstrativpronomen
        iCan: "Ich kann die Demonstrativpronomen hic, ille und iste erkennen und ihre Bedeutung unterscheiden."
        gradeBand: "7-8"
        requires: [is-ea-id]
