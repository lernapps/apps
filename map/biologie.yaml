# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Vorschlag. Quellenkürzel: KMK = Weiterentwickelte Bildungsstandards Biologie (MSA) 2024, verbindliche inhaltliche Aspekte
# (Z/V/M/U = Inhaltsbereich, Ziffer = Zeile der Liste auf S. 15);
# HE = Kerncurriculum Hessen Sek I Gymnasium Biologie (2011), Stufen "5/6" und "nach 9/10" (Kap. 7.3, S. 41-48);
# BY = LehrplanPLUS Bayern Gymnasium, online (NT5, NT6, Biologie 8-10; LB = Lernbereich);
# NW = Kernlehrplan NRW Sek I Gymnasium Biologie (2019), Stufe 1 (bis Jg 6) und Stufe 2 (bis Jg 10); SiLP = Jahrgang
# im Schulbeispiel, nur Hinweis.
# Richtstufe: eine Stimme je Land (HE / BY / NW). "7-10" = zweite Stufe von HE oder NW ohne Jahrgang, zählt für 7-8 und
# 9-10; ein Gleichstand wird über requires entschieden. Genaue Titel, Ausgaben und URLs: .vibe/research-biologie.md.
name: { de: Biologie, en: Biology }                # the file name is the subject's id: biologie
source:
  title: KMK, Weiterentwickelte Bildungsstandards in den Naturwissenschaften für das Fach Biologie (MSA), Beschluss vom 16.12.2004 i.d.F. vom 13.06.2024
  url: https://www.kmk.org/fileadmin/Dateien/veroeffentlichungen_beschluesse/2024/2024_06_13-WeBiS_Biologie_MSA.pdf
strands:
  - id: zellen
    name: { de: "Lebewesen bestehen aus Zellen", en: "Cells" }
    competencies:
      # KMK Z1 Kennzeichen des Lebendigen; HE –; BY NT5 2.2 (Jg 5): grundlegende Anforderungen an Lebewesen; NW IF1 (Stufe 1): Kennzeichen des Lebendigen. Stimmen – / 5-6 / 5-6: Mehrheit
      - id: kennzeichen-des-lebendigen
        iCan: "Ich kann an den Kennzeichen des Lebendigen erklären, ob etwas ein Lebewesen ist."
        gradeBand: "5-6"
      # KMK Z2 Zellen (Erkenntnisgewinnung); HE 9/10: Mikroskopieren und Zeichnen (KC 7.3, S. 41); BY NT5 2.1 (Jg 5): Mikroskopieren, Teile des Lichtmikroskops; NW IF1 (Stufe 1): Präparate mikroskopisch untersuchen. Stimmen 7-10 / 5-6 / 5-6: Mehrheit
      - id: mikroskopieren
        iCan: "Ich kann die Teile eines Lichtmikroskops benennen und ein Präparat damit scharf einstellen."
        gradeBand: "5-6"
      # KMK Z2 Zellen; HE 9/10: Anfertigen von Präparaten, Zeichnen von Zellen (S. 41); BY NT5 2.1 (Jg 5): einfache Präparate, beschriftete Zeichnungen; NW IF1 (Stufe 1): Zellen nach Vorgaben zeichnen. Stimmen 7-10 / 5-6 / 5-6: Mehrheit
      - id: praeparat-und-zeichnung
        iCan: "Ich kann ein einfaches Frischpräparat herstellen und davon eine beschriftete Zeichnung anfertigen."
        gradeBand: "5-6"
        requires: [mikroskopieren]
      # KMK Z2 Zellen; HE 9/10: Zellaufbau ausgewählter Zellen (S. 41); BY NT5 2.2 (Jg 5): tierische und pflanzliche Zellen, Zellbestandteile; NW IF1 (Stufe 1): Zellen anhand lichtmikroskopischer Strukturen unterscheiden. Stimmen 7-10 / 5-6 / 5-6: Mehrheit
      - id: tierzelle-pflanzenzelle
        iCan: "Ich kann Tier- und Pflanzenzellen an Zellmembran, Zellplasma, Zellkern, Zellwand, Vakuole und Chloroplasten unterscheiden."
        gradeBand: "5-6"
        requires: [kennzeichen-des-lebendigen, praeparat-und-zeichnung]
      # KMK Z2 Zellen; M1 Organsysteme; HE 5/6: Aufgabenteilung im Organismus; 9/10: Gewebe, Vernetzung zum System (S. 43); BY NT5 2.2 (Jg 5): Gewebe mikroskopieren; NT5 2.3: Organisationsebenen; NW IF1/IF2 (Stufe 1), Basiskonzept System: Zelle – Gewebe – Organ – Organismus. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: organisationsebenen
        iCan: "Ich kann an einem Beispiel die Ebenen Zelle, Gewebe, Organ, Organsystem und Organismus ordnen."
        gradeBand: "5-6"
        requires: [tierzelle-pflanzenzelle]
      # KMK Z3 Fotosynthese; HE 5/6: grundlegende phänomenologische Aspekte der Fotosynthese (S. 44); BY NT6 1.2 (Jg 6): Photosynthese, Bedeutung für das Leben auf der Erde; NW IF1 (Stufe 1): Fotosynthese als Reaktionsschema in Worten, Bedeutung. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: fotosynthese
        iCan: "Ich kann die Fotosynthese als Wortgleichung angeben und erklären, warum Pflanzen, Tiere und Menschen auf sie angewiesen sind."
        gradeBand: "5-6"
        requires: [tierzelle-pflanzenzelle, pflanzenorgane]
      # KMK Z3 Zellatmung; HE 5/6: grundlegende phänomenologische Aspekte zur Atmung (S. 44); BY NT5 2.3 (Jg 5): Zellatmung, einfaches Reaktionsschema; NW IF4 (Stufe 2; SiLP 8.8): Grundprinzip der Zellatmung. Stimmen 5-6 / 5-6 / 7-10: Mehrheit
      - id: zellatmung
        iCan: "Ich kann die Zellatmung als Wortgleichung angeben und erklären, wozu Zellen Sauerstoff und Nährstoffe brauchen."
        gradeBand: "5-6"
        requires: [tierzelle-pflanzenzelle]
      # KMK Z3 Fotosynthese und Zellatmung; HE 9/10: Vernetzung zu auf- und abbauenden Stoffwechselprozessen (S. 44); BY NT6 1.2 (Jg 6): Zusammenhang stofflich und energetisch; NW IF4 (Stufe 2; SiLP 8.8): Fotosynthese der Zellatmung gegenüberstellen. Stimmen 7-10 / 5-6 / 7-10: Gleichstand 7-8/9-10; requires entscheidet (klimawandel)
      - id: fotosynthese-und-zellatmung
        iCan: "Ich kann Fotosynthese und Zellatmung als Stoff- und Energieumwandlungen vergleichen und erklären, wie sie zusammenhängen."
        gradeBand: "7-8"
        requires: [fotosynthese, zellatmung]
      # KMK Z3 Zellatmung; HE 9/10: Stoff- und Energieumwandlung (S. 30); BY B10 3.4 (Jg 10): Glucoseabbau, ATP, aerob/anaerob; NW IF7 (Stufe 2; SiLP 10.2): Bedeutung der Glucose für den Energiehaushalt der Zelle. Stimmen 7-10 / 9-10 / 7-10: Mehrheit
      - id: zellatmung-energie
        iCan: "Ich kann erklären, wie Zellen bei der Zellatmung Energie aus Glucose für Bewegung, Wachstum und Körperwärme bereitstellen."
        gradeBand: "9-10"
        requires: [fotosynthese-und-zellatmung, naehrstoffe]
      # KMK Z4 Enzymreaktion (Voraussetzung); HE –; BY B9 3.1 (Jg 9): Vielfalt der Proteine; B10 3.1: Aufbau aus Aminosäuren; NW IF6 (Stufe 2; SiLP 10.4): funktionelle Vielfalt der Proteine. Stimmen – / 9-10 / 7-10: Mehrheit
      - id: proteine
        iCan: "Ich kann beschreiben, dass Proteine aus Aminosäuren bestehen und im Körper als Baustoffe, Enzyme, Hormone oder Antikörper viele Aufgaben haben."
        gradeBand: "9-10"
        requires: [naehrstoffe]
      # KMK Z4 Enzymreaktion; HE 9/10: Schlüssel-Schloss-Prinzip (S. 41); BY B10 3.2 (Jg 10): Enzyme als Biokatalysatoren, Schlüssel-Schloss-Modell, Substrat- und Wirkungsspezifität; NW IF2 (Stufe 1): Wirkungsweise von Verdauungsenzymen mit einfachen Modellvorstellungen; IF6/IF7 (Stufe 2): Schlüssel-Schloss-Modell. Stimmen 7-10 / 9-10 / 5-6: Mehrheit. Hinweis: NW führt das Enzymmodell schon in Stufe 1 ein
      - id: enzyme
        iCan: "Ich kann mit dem Schlüssel-Schloss-Modell erklären, wie ein Enzym einen bestimmten Stoff umsetzt."
        gradeBand: "9-10"
        requires: [proteine, verdauungsorgane]
      # SCHWACH BELEGT. KMK Z4 Enzymreaktion; HE –; BY B10 3.2 (Jg 10): Abhängigkeit der Enzymaktivität von Substratkonzentration, pH-Wert und Temperatur, Denaturierung; NW –. Stimmen – / 9-10 / –: festgelegt: nur BY stimmt (Jg 10), keine Mehrheit; requires enzyme (9-10). Hinweis: nur BY; aufgenommen, weil die KMK die Enzymreaktion verbindlich nennt
      - id: enzymaktivitaet
        iCan: "Ich kann an einem Versuch erklären, wie Temperatur und pH-Wert die Aktivität eines Enzyms beeinflussen."
        gradeBand: "9-10"
        requires: [enzyme]
      # KMK Z2 Zellen; HE 9/10: Zellaufbau ausgewählter Zellen (allgemein, S. 41); BY B9 LB2 (Jg 9): Bau einer prokaryotischen Zelle, Abgrenzung zu eukaryotischen Mikroorganismen; NW IF7 (Stufe 2; SiLP 10.1): Bau der Bakterienzelle. Stimmen 7-10 / 9-10 / 7-10: Mehrheit
      - id: bakterienzelle
        iCan: "Ich kann den Bau einer Bakterienzelle beschreiben und sie von Tier- und Pflanzenzellen abgrenzen."
        gradeBand: "9-10"
        requires: [tierzelle-pflanzenzelle]
      # KMK (Z2 Zellen); HE 9/10: Vermehrung bei Bakterien und Viren (S. 45); BY B9 LB2 (Jg 9): ungeschlechtliche Fortpflanzung durch Zweiteilung, exponentielles Populationswachstum; NW IF7 (Stufe 2; SiLP 10.1): Bau und Vermehrung von Bakterien. Stimmen 7-10 / 9-10 / 7-10: Mehrheit
      - id: vermehrung-der-bakterien
        iCan: "Ich kann erklären, wie sich Bakterien durch Zweiteilung vermehren und warum ihre Zahl dabei sehr schnell wächst."
        gradeBand: "9-10"
        requires: [bakterienzelle]
      # KMK Z1 Kennzeichen des Lebendigen (Grenzfall); M2; HE 9/10: Vermehrung bei Viren (S. 45); BY B10 LB2 (Jg 10): Bau und lytischer Vermehrungszyklus; NW IF7 (Stufe 2; SiLP 10.1): Aufbau und Vermehrung von Viren. Stimmen 7-10 / 9-10 / 7-10: Mehrheit
      - id: viren
        iCan: "Ich kann den Bau eines Virus beschreiben und erklären, warum sich Viren nur in Wirtszellen vermehren können."
        gradeBand: "9-10"
        requires: [bakterienzelle, kennzeichen-des-lebendigen]
      # KMK Z2 Zellen; V2 Vererbung; HE 9/10: vereinfachtes DNA-Modell (S. 41, 45); BY B9 3.1 (Jg 9): einfaches DNA-Modell; NW IF6 (Stufe 2; SiLP 10.4): DNA. Stimmen 7-10 / 9-10 / 7-10: Mehrheit
      - id: dna-modell
        iCan: "Ich kann mit einem einfachen DNA-Modell erklären, wie die Erbinformation in der DNA gespeichert ist."
        gradeBand: "9-10"
        requires: [tierzelle-pflanzenzelle]
      # KMK Z2 Mitose, Meiose (Voraussetzung); HE 9/10: Chromosomenmodell (S. 41); BY B9 3.2 (Jg 9): Chromosomen, Replikation, Ein-/Zwei-Chromatid-Chromosomen; NW IF6 (Stufe 2; SiLP 10.4): Chromosomen. Stimmen 7-10 / 9-10 / 7-10: Mehrheit
      - id: chromosomen
        iCan: "Ich kann den Bau eines Chromosoms beschreiben und Ein-Chromatid-, Zwei-Chromatid- und homologe Chromosomen unterscheiden."
        gradeBand: "9-10"
        requires: [dna-modell]
      # KMK Z2 Mitose; HE 9/10: Zellteilungsprozesse, Mitose (S. 45); BY B9 3.2 (Jg 9): Zellzyklus, Mitose; NW IF6 (Stufe 2; SiLP 10.4): Zellzyklus, Mitose. Stimmen 7-10 / 9-10 / 7-10: Mehrheit
      - id: mitose
        iCan: "Ich kann den Zellzyklus mit der Mitose beschreiben und erklären, warum dabei erbgleiche Tochterzellen entstehen."
        gradeBand: "9-10"
        requires: [chromosomen]
      # KMK Z2 Meiose; V2 genetische Variabilität; HE 9/10: Keimzellbildung, Meiose (S. 45); BY B9 3.3 (Jg 9): Meiose, Neukombination; NW IF6 (Stufe 2; SiLP 10.4): Meiose und Befruchtung. Stimmen 7-10 / 9-10 / 7-10: Mehrheit
      - id: meiose
        iCan: "Ich kann das Prinzip der Meiose beschreiben und erklären, warum Keimzellen einen einfachen Chromosomensatz haben und Geschwister verschieden sind."
        gradeBand: "9-10"
        requires: [mitose, befruchtung]
  - id: vielfalt
    name: { de: "Vielfalt und Veränderung von Lebewesen", en: "Diversity and change of living things" }
    competencies:
      # KMK V3 Verwandtschaft; U2 Artenkenntnis; HE 5/6: Bau und Funktion von Organen von Wirbeltieren, Körperformen (S. 41); BY NT6 1.4 (Jg 6): charakteristische Eigenschaften der Wirbeltierklassen; NW IF1 (Stufe 1): Wirbeltierklassen vergleichen und zuordnen. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: wirbeltierklassen
        iCan: "Ich kann die fünf Wirbeltierklassen an Körperbedeckung, Atmung, Körpertemperatur und Fortpflanzung unterscheiden und ein Tier einer Klasse zuordnen."
        gradeBand: "5-6"
      # KMK V3 Angepasstheit; HE 5/6: Körperbau, Lebensweise und Lebensraum (S. 47); BY NT6 1.3 (Jg 6): Fortbewegung im Wasser, an Land, in der Luft; NW IF1 (Stufe 1): Angepasstheit von Säugetieren und Vögeln (Skelett, Fortbewegung). Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: angepasstheit-fortbewegung
        iCan: "Ich kann an Beispielen erklären, wie der Körperbau von Fischen, Vögeln und Säugetieren an die Fortbewegung im Wasser, in der Luft oder an Land angepasst ist."
        gradeBand: "5-6"
        requires: [wirbeltierklassen]
      # KMK V3 Angepasstheit; HE 5/6: Körperbau und artspezifische Lebensweise (S. 47); BY NT6 1.3 (Jg 6): Fleisch- und Pflanzenfresser, Nahrungserwerb; NW IF1 (Stufe 1): Angepasstheit beim Nahrungserwerb. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: angepasstheit-ernaehrung
        iCan: "Ich kann an Gebiss und Verdauung von Pflanzenfressern und Fleischfressern erklären, wie Tiere an ihre Nahrung angepasst sind."
        gradeBand: "5-6"
        requires: [wirbeltierklassen]
      # KMK V3 Angepasstheit; HE 5/6: Regelung der Körpertemperatur (S. 44); BY NT6 1.3 (Jg 6): Temperaturregulation, Winterschlaf, Winterruhe, Vogelzug; NW IF4 (Stufe 2): Einfluss der Jahreszeiten. Stimmen 5-6 / 5-6 / 7-10: Mehrheit
      - id: ueberwinterung
        iCan: "Ich kann erklären, wie wechselwarme und gleichwarme Tiere mit Kältestarre, Winterschlaf, Winterruhe oder Vogelzug den Winter überstehen."
        gradeBand: "5-6"
        requires: [wirbeltierklassen]
      # KMK V3 Angepasstheit; HE 5/6: Fortpflanzungsstrategien bei Wirbeltieren (S. 45); BY NT6 1.3 (Jg 6): Fortpflanzung im Wasser/an Land, Metamorphose, Nesthocker; NW IF1 (Stufe 1): Fortpflanzung oder Individualentwicklung. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: fortpflanzung-wirbeltiere
        iCan: "Ich kann Fortpflanzung und Entwicklung von Wirbeltieren vergleichen, zum Beispiel äußere und innere Befruchtung, Metamorphose, Nesthocker und Nestflüchter."
        gradeBand: "5-6"
        requires: [wirbeltierklassen]
      # KMK V3 Verwandtschaft (Beispiel); HE 5/6: Abstammung und Züchtung, Wild- und Nutzformen (S. 47); BY NT6 1.4 (Jg 6): Züchtungsvorgänge, Nutz- und Heimtiere; NW IF1 (Stufe 1): Wild- und Nutztiere durch gezielte Züchtung, Rückführung auf Vererbung. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: zuechtung
        iCan: "Ich kann erklären, wie der Mensch aus Wildtieren durch Züchtung Haus- und Nutztiere mit gewünschten Merkmalen gemacht hat."
        gradeBand: "5-6"
        requires: [wirbeltierklassen]
      # KMK –; HE 5/6: Recherche zur artgerechten Haltung; Bewertung von Züchtung, Haltung und Nutzung (S. 47); BY NT6 1.4 (Jg 6): verantwortliche und tiergerechte Haltung; NT6 1.1: Tierschutz bei Heim- und Nutztieren; NW IF1 (Stufe 1): Formen der Nutztierhaltung erörtern, Tierschutz. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: nutztierhaltung
        iCan: "Ich kann Formen der Nutztierhaltung beschreiben und danach bewerten, ob sie tiergerecht sind."
        gradeBand: "5-6"
        requires: [zuechtung]
      # KMK M1 Organsysteme (übertragen); Z3; HE 5/6: Körperformen von Blütenpflanzen, Struktur und Zusammenspiel der Elemente (S. 36, 41); BY NT6 1.2 (Jg 6): Aufgaben der Pflanzenteile; NW IF1 (Stufe 1): Zusammenwirken der Organe einer Samenpflanze. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: pflanzenorgane
        iCan: "Ich kann Wurzel, Sprossachse und Blatt einer Samenpflanze benennen und ihre Aufgaben erklären."
        gradeBand: "5-6"
      # KMK V3 Angepasstheit; HE 5/6: Fortpflanzungsstrategien bei Blütenpflanzen (S. 45); BY NT5 2.4 (Jg 5): Blütenbau, Bestäubung und Befruchtung; NW IF1 (Stufe 1): Blüten präparieren, Fortpflanzung. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: bluete-und-bestaeubung
        iCan: "Ich kann den Aufbau einer Blüte beschreiben und erklären, wie es durch Bestäubung zur Befruchtung kommt."
        gradeBand: "5-6"
        requires: [pflanzenorgane]
      # KMK V3 Angepasstheit; HE 5/6: Fortpflanzungsstrategien bei Blütenpflanzen (allgemein, S. 45); BY NT6 1.2 (Jg 6): Frucht als Ausbreitungseinheit; NW IF1 (Stufe 1): Struktur und Funktion von Früchten und Samen. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: fruechte-und-samen
        iCan: "Ich kann erklären, wie Früchte und Samen durch Wind, Wasser oder Tiere verbreitet werden."
        gradeBand: "5-6"
        requires: [bluete-und-bestaeubung]
      # KMK (Erkenntnisgewinnung); HE –; BY NT6 1.2 (Jg 6): Einfluss von Außenfaktoren auf Keimung und Wachstum; NW IF1 (Stufe 1): Experiment nach Variablenkontrolle zu Keimung und Wachstum. Stimmen – / 5-6 / 5-6: Mehrheit
      - id: keimung-experiment
        iCan: "Ich kann ein Experiment zur Keimung planen, bei dem ich nur einen Faktor wie Wasser, Licht oder Temperatur verändere."
        gradeBand: "5-6"
        requires: [fruechte-und-samen]
      # KMK (V2 genetische Variabilität, Voraussetzung); HE 5/6: geschlechtliche und ungeschlechtliche Vermehrung (S. 45); BY NT6 1.2 (Jg 6): ungeschlechtliche Fortpflanzung, Ausläufer; NW IF1 (Stufe 1), Basiskonzept Entwicklung: ungeschlechtliche Vermehrung. Stimmen 5-6 / 5-6 / 5-6: Mehrheit
      - id: ungeschlechtliche-vermehrung
        iCan: "Ich kann geschlechtliche Fortpflanzung und ungeschlechtliche Vermehrung bei Pflanzen, zum Beispiel durch Ausläufer, unterscheiden."
        gradeBand: "5-6"
        requires: [bluete-und-bestaeubung]
      # KMK U2 Artenkenntnis; HE –; BY B9 LB5 (Jg 9): ausgewählte Vertreter der Wirbellosen, Formenkenntnis; NW IF4 (Stufe 2; SiLP 8.1): Merkmale im äußeren Körperbau ausgewählter Wirbellosen-Taxa. Stimmen – / 9-10 / 7-10: Mehrheit
      - id: wirbellose
        iCan: "Ich kann wichtige Gruppen der Wirbellosen wie Insekten, Spinnen, Weichtiere und Ringelwürmer am Körperbau unterscheiden und Tiere zuordnen."
        gradeBand: "9-10"
        requires: [wirbeltierklassen]
      # KMK U2 Artenkenntnis; HE –; BY B9 LB5 (Jg 9): Außenskelett aus Chitin, Tracheensystem, Metamorphoseformen; NW IF4 (Stufe 2; SiLP 8.1): Entwicklungsstadien von Insekten; Eingriffe in Lebensräume am Beispiel der Insekten. Stimmen – / 9-10 / 7-10: Mehrheit
      - id: insekten
        iCan: "Ich kann Körperbau, Atmung und Verwandlung (Metamorphose) von Insekten beschreiben."
        gradeBand: "9-10"
        requires: [wirbellose]
      # KMK V1 Evolutionstheorie; HE 9/10: Evolutionsmechanismen (S. 47); BY B9 LB4 (Jg 9): erweiterte Evolutionstheorie; vereinfacht schon NT6 1.4; NW IF5 (Stufe 2; SiLP 8.4): Darwin'sche Evolutionstheorie. Stimmen 7-10 / 9-10 / 7-10: Mehrheit
      - id: evolutionstheorie-darwin
        iCan: "Ich kann die Grundgedanken von Darwins Evolutionstheorie wiedergeben: Vielfalt, Überproduktion, natürliche Selektion und Fortpflanzungserfolg."
        gradeBand: "9-10"
        requires: [zuechtung]
      # KMK V3 Angepasstheit; HE 9/10: Angepasstheit als Resultat der Evolutionsmechanismen (S. 32); BY B9 LB4 (Jg 9): Angepasstheiten als Selektionsvorteil; NW IF5 (Stufe 2; SiLP 8.4): Angepasstheit vor dem Hintergrund der Selektionstheorie. Stimmen 7-10 / 9-10 / 7-10: Mehrheit
      - id: angepasstheit-selektion
        iCan: "Ich kann Angepasstheiten von Lebewesen als Ergebnis natürlicher Selektion erklären."
        gradeBand: "9-10"
        requires: [evolutionstheorie-darwin, angepasstheit-fortbewegung]
      # SCHWACH BELEGT. KMK V2 genetische Variabilität; HE 9/10: Mutation und Modifikation (S. 31, 47); 5/6: individuelle Veränderungen durch äußere Einflüsse; BY B9 3.3 (Jg 9): nur Genommutation; NW IF6 (Stufe 2): nur Genommutation. Stimmen 7-10 / 9-10 / 7-10: Mehrheit. Hinweis: Modifikation nennt nur HE; BY und NW nennen nur Mutationen
      - id: mutation-und-modifikation
        iCan: "Ich kann an Beispielen unterscheiden, ob ein Merkmal durch eine Mutation (erblich) oder durch Umwelteinflüsse (Modifikation, nicht erblich) verändert ist."
        gradeBand: "9-10"
        requires: [dna-modell]
      # KMK V1 Evolutionstheorie; V2 genetische Variabilität; HE 9/10: Mutation, Rekombination, Selektion (S. 47); BY B9 LB4 (Jg 9): genetische Variabilität, Selektion, Isolation; NW IF5 (Stufe 2; SiLP 8.4): Variabilität, natürliche Selektion. Stimmen 7-10 / 9-10 / 7-10: Mehrheit
      - id: evolutionsfaktoren
        iCan: "Ich kann erklären, wie Mutation, Rekombination, Selektion und Isolation zusammen Arten verändern."
        gradeBand: "9-10"
        requires: [angepasstheit-selektion, meiose, mutation-und-modifikation]
      # KMK V3 Artbildung; HE 9/10: Erläuterung des Artbegriffs (S. 47); BY –; NW IF5 (Stufe 2; SiLP 8.5): biologischen Artbegriff anwenden. Stimmen 7-10 / – / 7-10: Gleichstand 7-8/9-10; requires lassen beide zu: frühere Stufe
      - id: artbegriff
        iCan: "Ich kann mit dem biologischen Artbegriff entscheiden, ob zwei Lebewesen zur selben Art gehören."
        gradeBand: "7-8"
        requires: [fortpflanzung-wirbeltiere]
