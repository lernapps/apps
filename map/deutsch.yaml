# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Lernlandkarte Deutsch, Gymnasium Sekundarstufe I (Jg 5-10). Quellen, Entscheidungen, offene Punkte: .vibe/research-deutsch.md
# Quellenkürzel in den Kommentaren:
#   KMK = Bildungsstandards Deutsch ESA/MSA, i. d. F. vom 23.06.2022; Abschnitt 4.1-4.5 = Kompetenzbereich, Seite der PDF
#   HE  = Hessen: Lehrplan Deutsch, Gymnasialer Bildungsgang, Jg 5-13 (G9); "5.3" = Jahrgangsstufe 5, Arbeitsbereich III;
#         KC = Kerncurriculum Sek I Gymnasium Deutsch (2011): Kap. 6 (Ende 9/10), 7.1 (Ende 6), 7.2 (Ende 8),
#         "Schwerpunkt 5/6, 7/8, 9/10" = Hervorhebung in den Inhaltsfeldern. Stimme HE = Jahrgang des Lehrplans, sonst KC.
#   BY  = LehrplanPLUS Bayern Gymnasium Deutsch; "D7 3.2" = Jahrgangsstufe 7, Lernbereich 3.2
#   NW  = Kernlehrplan NRW Sek I Gymnasium Deutsch (G9), Heft 3409 (2019); E = bis Ende Erprobungsstufe (5-6),
#         S1 = erste Stufe (7-8), S2 = zweite Stufe (9-10); IF = Inhaltsfeld; Aufgabentyp = Kap. 3
# Richtstufe: zwei von drei Stimmen; drei verschiedene: die mittlere; Gleichstand: die frühere Stufe, außer eine direkte
# Voraussetzung liegt in derselben oder einer späteren Stufe (dann die spätere). "SCHWACH BELEGT" = weniger als zwei Länder.
name: { de: Deutsch, en: German }
source:
  title: KMK, Bildungsstandards für das Fach Deutsch, Erster Schulabschluss (ESA) und Mittlerer Schulabschluss (MSA), Beschluss vom 15.10.2004 und vom 04.12.2003 i. d. F. vom 23.06.2022
  url: https://www.kmk.org/fileadmin/Dateien/veroeffentlichungen_beschluesse/2022/2022_06_23-Bista-ESA-MSA-Deutsch.pdf
strands:
  - id: sprechen-zuhoeren
    name: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
    competencies:
      # KMK 4.1 Mit anderen sprechen: Gesprächsregeln (S. 18 f.); HE 5.1 Gespräche führen: Gesprächsregeln entwickeln (Jg 5); BY D5 1.3 Gesprächsregeln befolgen; NW E IF3 Gesprächsregeln entwickeln | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: gespraechsregeln
        iCan: "Ich kann Gesprächsregeln nennen und erklären, warum sie ein Gespräch gelingen lassen."
        gradeBand: "5-6"
      # KMK 4.1 Verstehend zuhören (S. 17 f.); HE 5.1 zuhören lernen, aufeinander eingehen (Jg 5); KC 7.1 Zuhören; BY D5 1.1 Verstehend zuhören; NW E IF3 aktiv zuhören, gezielt nachfragen | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: aktiv-zuhoeren
        iCan: "Ich kann aktiv zuhören, gezielt nachfragen und das Gehörte in eigenen Worten wiedergeben."
        gradeBand: "5-6"
      # KMK 4.1 Verstehend zuhören: Informationen sichern, Notizen (S. 18); HE KC 7.1 selbst verfasste Notizen strukturieren (Ende Jg 6); BY D8 3.1 strukturierte Mitschriften (Jg 8); NW E IF3 Gehörtes wiedergeben unter Nutzung eigener Notizen | Stimmen HE/BY/NW 5-6/7-8/5-6 → 5-6 (Mehrheit)
      - id: mitschreiben
        iCan: "Ich kann beim Zuhören Notizen machen und das Wichtigste festhalten."
        gradeBand: "5-6"
        requires: [aktiv-zuhoeren]
      # KMK 4.1 Zu anderen sprechen: argumentieren (S. 17); HE 5.1 Diskutieren und Argumentieren (Jg 5); BY D5 1.3 Position beziehen, Meinungen einfach begründen; NW E IF3 eigene Standpunkte begründen | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: meinung-begruenden-muendlich
        iCan: "Ich kann im Gespräch meine Meinung sagen und sie mit Gründen und Beispielen stützen."
        gradeBand: "5-6"
      # KMK 4.1 Zu anderen sprechen: appellieren (S. 17); HE 6.1 Diskutieren und Argumentieren: Überzeugung, Überredung (Jg 6); BY D6 1.3 Appelle argumentativ absichern; NW E IF3 Anliegen angemessen vortragen und begründen | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: ueberzeugen-ueberreden
        iCan: "Ich kann erklären, worin sich Überzeugen und Überreden unterscheiden, und andere mit Gründen von einem Anliegen überzeugen."
        gradeBand: "5-6"
        requires: [meinung-begruenden-muendlich]
      # KMK 4.1 Mit anderen sprechen: wertschätzende Gesprächsatmosphäre (S. 19); HE KC 7.1 Anliegen und Konflikte lösungsorientiert besprechen (Ende Jg 6); BY D6 1.3 Mittel der Konfliktlösung; NW E IF3 Verletzungen von Gesprächsregeln, Lösungsansatz | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: konflikte-im-gespraech-loesen
        iCan: "Ich kann einen Streit im Gespräch sachlich klären und gemeinsam nach einer Lösung suchen."
        gradeBand: "5-6"
        requires: [gespraechsregeln]
      # KMK 4.1 Zu anderen sprechen: Lautstärke, Betonung, Sprechtempo, Körpersprache (S. 17); HE 5.2 Leseförderung: Betonung, Blickkontakt (Jg 5); KC 7.1 verbale und nonverbale Ausdrucksmöglichkeiten; BY D6 1.2 stimmliche und nonverbale Mittel; NW E IF3 nonverbale und paraverbale Mittel | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: koerpersprache-und-stimme
        iCan: "Ich kann Lautstärke, Tempo, Betonung, Blickkontakt, Mimik und Gestik beim Sprechen bewusst einsetzen."
        gradeBand: "5-6"
      # KMK 4.1 Vor anderen sprechen: Gedicht (S. 19); 4.4 literarische Texte sinngestaltend vortragen (S. 35); HE 5.2 Lesen, Auswendiglernen, freies Sprechen von Texten (Jg 5); BY D5 1.2 Gedichte frei und sinnbetont vortragen; NW S1 IF2 Texte sinngestaltend vortragen | Stimmen HE/BY/NW 5-6/5-6/7-8 → 5-6 (Mehrheit)
      - id: vorlesen-und-vortragen
        iCan: "Ich kann einen Text sinngestaltend vorlesen und ein Gedicht auswendig vortragen."
        gradeBand: "5-6"
        requires: [koerpersprache-und-stimme]
      # KMK 4.1 Vor anderen sprechen: szenisches Sprechen und Spielen (S. 20); HE 5.1 Darstellendes Spiel: Rollen- und Stegreifspiel (Jg 5); BY D5 1.4 Szenisch spielen; NW E IF4 Texte medial umformen (szenisches Spiel) | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: szenisch-spielen
        iCan: "Ich kann eine Rolle in einer Szene mit Stimme, Mimik und Gestik spielen."
        gradeBand: "5-6"
        requires: [koerpersprache-und-stimme]
      # KMK 4.4 Medienangebot: Empfehlungen (S. 33 f.); HE 6.2 Buchvorstellungen (Jg 6); BY D5 2.2 Lieblingsbücher vorstellen und Wahl begründen; NW E IF2 Urteil über einen Text begründen (Leseempfehlung) | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: buch-vorstellen
        iCan: "Ich kann ein Buch vorstellen, das mir gefällt: Inhalt, Leseprobe und eine begründete Empfehlung."
        gradeBand: "5-6"
        requires: [vorlesen-und-vortragen]
      # KMK 4.1 Vor anderen sprechen: Stichwortzettel, Plakat, Kurzreferat (S. 19 f.); HE 5.1 Informationen präsentieren (Jg 5); KC Schwerpunkt 5/6: Vortragen, Stichwortzettel, Plakate; BY D5 1.2 informieren mit Plakaten; D6 1.2 Kurzreferat; NW S1 IF3 Kommunikationssituation Präsentation | Stimmen HE/BY/NW 5-6/5-6/7-8 → 5-6 (Mehrheit)
      - id: kurzvortrag
        iCan: "Ich kann einen kurzen Vortrag mit Stichwortzettel und Plakat halten."
        gradeBand: "5-6"
        requires: [koerpersprache-und-stimme]
      # KMK 4.1 Zu anderen sprechen: Feedback nach Kriterien (S. 17); HE KC 7.1 Vorträge kriterienorientiert beobachten und besprechen; KC Schwerpunkt 5/6: Rückmeldungen geben; BY D5 1.1 Rückmeldung zu längeren Gesprächsbeiträgen; NW – | Stimmen HE/BY/NW 5-6/5-6/– → 5-6 (Mehrheit) | SCHWACH BELEGT: NW nennt Feedback nicht ausdrücklich
      - id: feedback-geben
        iCan: "Ich kann nach vereinbarten Kriterien eine faire Rückmeldung zu einem Vortrag geben."
        gradeBand: "5-6"
        requires: [kurzvortrag]
      # KMK 4.1 Vor anderen sprechen: Referat (S. 19); HE 9.1 Referat (Jg 9); BY D7 1.2 Referate; NW S1 IF3 Präsentation | Stimmen HE/BY/NW 9-10/7-8/7-8 → 7-8 (Mehrheit)
      - id: referat
        iCan: "Ich kann ein Referat vorbereiten: Informationen sammeln, ordnen, gliedern und frei vortragen."
        gradeBand: "7-8"
        requires: [kurzvortrag, recherchieren]
      # KMK 4.1 Vor anderen sprechen: Präsentationssoftware (S. 20); HE KC Schwerpunkt 9/10: Folien, Präsentationsprogramme; BY D9 3.1 Präsentationsprogramme zielgerichtet einsetzen; NW S1 IF4 Präsentationsprogramme | Stimmen HE/BY/NW 9-10/9-10/7-8 → 9-10 (Mehrheit)
      - id: praesentation-mit-folien
        iCan: "Ich kann Folien so gestalten, dass sie meinen Vortrag unterstützen und nicht ablenken."
        gradeBand: "9-10"
        requires: [referat]
      # KMK 4.1 Mit anderen sprechen: Diskussionen (S. 19); HE 8.1 Diskussion vorbereiten, durchführen und auswerten (Jg 8); BY D8 1.3 kürzere Diskussionen vorbereiten und auswerten; NW S1 IF3 Kommunikationssituation Diskussion | Stimmen HE/BY/NW 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: diskussion-fuehren
        iCan: "Ich kann eine Diskussion vorbereiten, mich mit Argumenten beteiligen und auf Gegenargumente eingehen."
        gradeBand: "7-8"
        requires: [meinung-begruenden-muendlich, gespraechsregeln]
      # KMK 4.1 Mit anderen sprechen: Rollen (Moderation), Gespräche steuern (S. 19); HE 8.1 Gespräche leiten (Jg 8); BY D9 1.3 Möglichkeiten der Gesprächssteuerung; NW S2 IF3 Rolle moderierend | Stimmen HE/BY/NW 7-8/9-10/9-10 → 9-10 (Mehrheit)
      - id: gespraech-leiten
        iCan: "Ich kann eine Diskussion leiten: das Wort erteilen, Impulse geben und Ergebnisse zusammenfassen."
        gradeBand: "9-10"
        requires: [diskussion-fuehren]
      # KMK 4.1 Mit anderen sprechen: Debatten (MSA, S. 19); HE 10.1 Pro-und-Kontra-Diskussion, Debatte (Jg 10); BY D9 1.3 Debatten vorbereiten; NW S2 IF3 formalisierte Diskussionsformen, Debatte | Stimmen HE/BY/NW 9-10/9-10/9-10 → 9-10 (Mehrheit)
      - id: debatte
        iCan: "Ich kann eine Debatte nach festen Regeln vorbereiten und führen."
        gradeBand: "9-10"
        requires: [diskussion-fuehren]
      # KMK 4.1 Mit anderen sprechen: Interviews (S. 19); HE 8.1 Interviews durchführen und auswerten (Jg 8); BY –; NW S1 IF3 Informationsgespräch | Stimmen HE/BY/NW 7-8/–/7-8 → 7-8 (Mehrheit) | SCHWACH BELEGT: NW nennt nur das Informationsgespräch, BY nichts
      - id: interview
        iCan: "Ich kann ein Interview vorbereiten, führen und auswerten."
        gradeBand: "7-8"
        requires: [aktiv-zuhoeren, mitschreiben]
      # KMK 4.1 Zu anderen sprechen: Bewerbungsgespräch; Mit anderen sprechen: Vorstellungsgespräche (S. 17, 19); HE KC Schwerpunkt 7/8: Vorstellen, Bewerben; BY D9 1.3 ggf. Bewerbungsgespräch; NW S2 IF3 Bewerbungsgespräch | Stimmen HE/BY/NW 7-8/9-10/9-10 → 9-10 (Mehrheit)
      - id: bewerbungsgespraech
        iCan: "Ich kann mich auf ein Vorstellungsgespräch vorbereiten und mich darin angemessen verhalten."
        gradeBand: "9-10"
        requires: [sprachregister-waehlen]
  - id: schreiben
    name: { de: "Schreiben", en: "Writing" }
    competencies:
      # KMK 4.2 Texte planen: Schreibabsicht, Adressaten (S. 25); HE KC 7.1 Schreibabsicht und Adressaten klären (Ende Jg 6); BY D5 3.1 dem Schreibanlass angemessene Schreibform; NW E IF2 Schreibziel benennen, Adressaten einschätzen | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: schreibziel-und-adressat
        iCan: "Ich kann vor dem Schreiben klären, für wen und wozu ich schreibe, und meinen Text danach ausrichten."
        gradeBand: "5-6"
      # KMK 4.2 Texte planen: Cluster, Mindmap, Gliederung, Schreibplan (S. 24 f.); HE KC 7.1 Schreibprozess mit Schreibstrategien organisieren; KC Schwerpunkt 5/6: Sammeln; BY D5 3.2 Brainstorming, Cluster, Mindmap, Schreibplan; NW E IF2 eigene Texte mit Hilfen planen | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: schreibplan
        iCan: "Ich kann Ideen mit Cluster oder Mindmap sammeln und daraus einen Schreibplan machen."
        gradeBand: "5-6"
        requires: [schreibziel-und-adressat]
      # KMK 4.2 Texte überarbeiten (S. 27 f.); HE KC 7.1 Texte kriterienorientiert überprüfen; KC Schwerpunkt 5/6: Schreibkonferenz; BY D5 3.3 Textlupe, Schreibkonferenz; NW E IF1 Texte angeleitet überarbeiten; Aufgabentyp 5 | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: texte-ueberarbeiten
        iCan: "Ich kann einen Text mit einer Checkliste, der Textlupe oder in einer Schreibkonferenz überarbeiten."
        gradeBand: "5-6"
      # KMK 4.2 digitale Schreibwerkzeuge (S. 26); HE KC 7.1 mit Hilfestellung Textverarbeitungsprogramme einsetzen (Ende Jg 6); BY D6 3.1 Textverarbeitungsprogramme; NW E IF4 grundlegende Funktionen der Textverarbeitung | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: textverarbeitung
        iCan: "Ich kann mit einem Textverarbeitungsprogramm einen Text schreiben, gliedern und formatieren."
        gradeBand: "5-6"
      # KMK 4.2 Texte formulieren: Ausdrücken, Erlebtes und Erdachtes (S. 26); HE 5.1 Aufbau und sprachliche Mittel der einfachen Erzählung (Jg 5); BY D5 3.2 Handlungsverlauf Erzählsituation – Ereignis – Ausgang; NW E IF2 Geschichten erzählen; Aufgabentyp 1 | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: erzaehlung-aufbauen
        iCan: "Ich kann eine Erzählung mit Einleitung, Hauptteil mit Höhepunkt und Schluss aufbauen."
        gradeBand: "5-6"
        requires: [schreibplan]
      # KMK 4.2 Texte formulieren: Ausdrücken (S. 26); HE 6.1 Aufbau, Spannungsbogen, sprachliche Gestaltungsmittel (Jg 6); BY D5 3.1 treffende Verben, anschauliche Adjektive, wörtliche Rede; NW E IF2 Gestaltungsmittel Steigerung, Vorausdeutung, Pointierung | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: spannend-erzaehlen
        iCan: "Ich kann eine Geschichte mit Spannungsbogen, wörtlicher Rede und treffenden Wörtern lebendig erzählen."
        gradeBand: "5-6"
        requires: [erzaehlung-aufbauen, woertliche-rede-zeichensetzen]
      # KMK 4.2 Texte formulieren: kreative Schreibformen, Schreiben zu Bildern (S. 26); HE 5.1 Reizwortkette, Phantasie- und Bildergeschichten (Jg 5); BY D5 3.2 erzählen zu unterschiedlichen Impulsen; NW Aufgabentyp 1: auf der Basis von Materialien erzählen (E) | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: erzaehlen-nach-vorgaben
        iCan: "Ich kann zu Bildern, Reizwörtern oder einem Erzählkern eine eigene Geschichte erfinden."
        gradeBand: "5-6"
        requires: [erzaehlung-aufbauen]
      # KMK 4.2 Schreibformen: Umschreiben (S. 26); HE 5.1 Nacherzählen (Jg 5); 6.1 Nacherzählen mit veränderter Perspektive (Jg 6); BY D5 2.2 Umschreibungen aus anderen Perspektiven; NW Aufgabentyp 6: umschreiben (E) | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: nacherzaehlen
        iCan: "Ich kann eine Geschichte nacherzählen, auch aus der Sicht einer anderen Figur."
        gradeBand: "5-6"
        requires: [erzaehlung-aufbauen]
      # KMK 4.2 produktive Schreibformen (S. 26); HE 6.1 Erzählen nach literarischen Mustern: Fabeln, Lügengeschichten (Jg 6); BY D5 3.2 literarische Texte (Fabeln) variieren oder nachahmen; NW Aufgabentyp 6: Texte nach Textmustern verfassen (E) | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: nach-textmuster-schreiben
        iCan: "Ich kann nach dem Muster einer Fabel oder Lügengeschichte selbst eine Geschichte schreiben."
        gradeBand: "5-6"
        requires: [fabel, erzaehlung-aufbauen]
      # KMK 4.2 Ausdrücken: Gedicht (S. 26); 4.4 Parallelgedicht (S. 35); HE 5.2 Schreibwerkstatt: Elfchen, Haiku (Jg 5); BY D5 3.2 Gedichte variieren oder nachahmen; NW E IF2 Paralleltexte | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: gedicht-schreiben
        iCan: "Ich kann nach einem Muster ein eigenes Gedicht schreiben, zum Beispiel ein Elfchen oder ein Parallelgedicht."
        gradeBand: "5-6"
        requires: [vers-strophe-reim]
      # KMK 4.2 Ausdrücken: Gedanken und Gefühle (S. 26); HE 7.1 Beschreiben und Schildern: Gefühle, Stimmungen (Jg 7); BY D7 3.2 schildernde und beschreibende Elemente; NW – | Stimmen HE/BY/NW 7-8/7-8/– → 7-8 (Mehrheit)
      - id: schildern
        iCan: "Ich kann eine Situation oder Stimmung mit Sinneseindrücken anschaulich schildern."
        gradeBand: "7-8"
        requires: [spannend-erzaehlen]
      # KMK 4.2 Darstellen: Beschreiben, Funktionsbeschreibung (S. 26); HE 6.1 Gegenstands-, Tierbeschreibung (Jg 6); BY D5 3.2 informieren mit sachlogischem Aufbau; NW E IF2 Textfunktion beschreiben; Aufgabentyp 2 | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: gegenstand-beschreiben
        iCan: "Ich kann einen Gegenstand oder ein Tier sachlich, genau und in sinnvoller Reihenfolge beschreiben."
        gradeBand: "5-6"
        requires: [schreibziel-und-adressat]
      # KMK 4.2 Darstellen: Beschreiben (S. 26); HE 6.1 Personenbeschreibung (Jg 6); BY D6 3.2 Figuren durch Beschreibungen gestalten; NW Aufgabentyp 2: beschreiben (E) | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: personenbeschreibung
        iCan: "Ich kann eine Person nach Gesamteindruck, Einzelheiten und Besonderheiten beschreiben."
        gradeBand: "5-6"
        requires: [gegenstand-beschreiben]
      # KMK 4.2 Darstellen: Ortsbeschreibung (S. 26); HE 6.1 Wegbeschreibung (Jg 6); BY –; NW Aufgabentyp 2: beschreiben (E) | Stimmen HE/BY/NW 5-6/–/5-6 → 5-6 (Mehrheit) | SCHWACH BELEGT: BY nennt keine Wegbeschreibung; NW nur allgemein „beschreiben“
      - id: wegbeschreibung
        iCan: "Ich kann einen Weg so beschreiben, dass andere ihn finden."
        gradeBand: "5-6"
        requires: [schreibziel-und-adressat]
      # KMK 4.2 Darstellen: Instruieren, Gebrauchsanweisung, Spielanleitung (S. 26); HE 6.1 Vorgangsbeschreibung, Spielanleitung, Kochrezepte (Jg 6); BY D5 3.2 über einfache Vorgänge informieren; NW E IF2 Textfunktion beschreiben, erklären | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: vorgangsbeschreibung
        iCan: "Ich kann einen Vorgang wie eine Spielanleitung oder ein Rezept Schritt für Schritt beschreiben."
        gradeBand: "5-6"
        requires: [gegenstand-beschreiben]
      # KMK 4.2 Darstellen: Bildbeschreibung (S. 26); HE 7.1 Beschreiben: Raum, Bild (Jg 7); BY –; NW – | Stimmen HE/BY/NW 7-8/–/– → 7-8 (eine Stimme) | SCHWACH BELEGT: nur KMK und HE; aufgenommen, weil die KMK die Bildbeschreibung nennt
      - id: bildbeschreibung
        iCan: "Ich kann ein Bild geordnet beschreiben: vom Gesamteindruck über Vorder-, Mittel- und Hintergrund zur Wirkung."
        gradeBand: "7-8"
        requires: [gegenstand-beschreiben]
      # KMK 4.2 Darstellen: Berichten, Bericht (S. 26); HE 6.1 Berichten (Jg 6); BY D5 3.2 über Ereignisse informieren; NW E IF2 Textfunktion berichten; Aufgabentyp 2 | Stimmen HE/BY/NW 5-6/5-6/5-6 → 5-6 (Mehrheit)
      - id: bericht
        iCan: "Ich kann über ein Ereignis sachlich und in zeitlicher Reihenfolge berichten und dabei die W-Fragen beantworten."
        gradeBand: "5-6"
        requires: [schreibziel-und-adressat, tempus-praesens-praeteritum]
      # KMK 4.2 informierend materialgestützt schreiben (S. 26); HE 7.1 Berichten: Informationen verarbeiten, auswählen, ordnen (Jg 7); BY D7 3.2 informierende Texte aus Materialien; NW S1 IF2 Informationen aus verschiedenen Quellen nutzen; Aufgabentyp 2 | Stimmen HE/BY/NW 7-8/7-8/7-8 → 7-8 (Mehrheit)
      - id: informierender-text-aus-material
        iCan: "Ich kann aus mehreren Materialien wie Texten und Grafiken einen informierenden Text schreiben."
        gradeBand: "7-8"
        requires: [bericht, diagramme-lesen, quellen-pruefen]
      # KMK 4.2 Darstellen von Textbearbeitungen: Inhaltsangabe (S. 26); HE 8.1 Inhaltsangabe: Thema erfassen und benennen (Jg 8); BY D8 3.2 informieren über literarische Texte, Thema formulieren; NW – | Stimmen HE/BY/NW 7-8/7-8/– → 7-8 (Mehrheit)
      - id: basissatz
        iCan: "Ich kann einen Basissatz mit Autor, Titel, Textsorte, Erscheinungsjahr und Thema eines Textes formulieren."
        gradeBand: "7-8"
        requires: [kernaussagen-wiedergeben]
      # KMK 4.2 Darstellen von Textbearbeitungen: Inhaltsangabe (S. 26); HE 7.1 Inhaltsangabe, von Nacherzählung unterscheiden (Jg 7); 8.1 Klassenarbeit; BY D7 3.2 über Thema und Handlungsschritte informieren; NW – | Stimmen HE/BY/NW 7-8/7-8/– → 7-8 (Mehrheit) | NW nennt die Inhaltsangabe nicht (nur „Texte zusammenfassen“ am Ende der Sek I)
      - id: inhaltsangabe
        iCan: "Ich kann eine Inhaltsangabe zu einer Erzählung schreiben: im Präsens, sachlich und ohne wörtliche Rede."
