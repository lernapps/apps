# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# Source: Kerncurriculum Hessen, Sekundarstufe I - Gymnasium, Musik (Hessisches Kultusministerium).
# Strands are its ten Inhaltsfelder (Kapitel 6 and 7.1). The curriculum names areas and contents, not
# single competencies, and places them only at the end of grade 6 and at the end of grade 9/10
# (Kapitel 7.2, end of grade 8, is not given for Musik). Hence gradeBand is "5-6" or "9-10" only.
name: { de: Musik, en: Music }
source:
  title: Kerncurriculum Hessen, Sekundarstufe I - Gymnasium, Musik (Hessisches Kultusministerium)
  url: https://kultus.hessen.de/sites/kultus.hessen.de/files/2021-07/kerncurriculum_musik_gymnasium.pdf
strands:
  - id: hoerkultur
    name: { de: "Hörkultur", en: "Listening culture" }
    competencies:
      - id: konzentriert-hoeren
        iCan: { de: "Ich kann meine Aufmerksamkeit gezielt auf das Hören richten." }
        gradeBand: "5-6"
      - id: hoerweisen-unterscheiden
        iCan: { de: "Ich kann verschiedene Arten des Hörens unterscheiden, zum Beispiel nebenbei hören und genau hinhören." }
        gradeBand: "5-6"
        requires: [konzentriert-hoeren]
      - id: hoergewohnheiten-beschreiben
        iCan: { de: "Ich kann beschreiben, wann und wie ich selbst Musik höre, und das mit anderen vergleichen." }
        gradeBand: "5-6"
        requires: [hoerweisen-unterscheiden]
      - id: hoerlandschaft-entdecken
        iCan: { de: "Ich kann Stille und die Geräusche meiner Umgebung bewusst wahrnehmen und beschreiben." }
        gradeBand: "9-10"
        requires: [konzentriert-hoeren]
      - id: hoergewohnheiten-reflektieren
        iCan: { de: "Ich kann meine eigenen Hörgewohnheiten kritisch prüfen und begründen, was ich an ihnen ändern möchte." }
        gradeBand: "9-10"
        requires: [hoergewohnheiten-beschreiben]
  - id: klang
    name: { de: "Klang", en: "Sound" }
    competencies:
      - id: klangquellen-unterscheiden
        iCan: { de: "Ich kann Stimme, Körper, Gegenstände und Instrumente als Klangquellen unterscheiden." }
        gradeBand: "5-6"
      - id: schwingung
        iCan: { de: "Ich kann erklären, dass jeder Klang durch eine Schwingung entsteht." }
        gradeBand: "5-6"
        requires: [klangquellen-unterscheiden]
      - id: verstaerkung-resonanz
        iCan: { de: "Ich kann erklären, wie ein Resonanzkörper einen Klang lauter macht." }
        gradeBand: "5-6"
        requires: [schwingung]
      - id: klangformung
        iCan: { de: "Ich kann beschreiben, wie Material und Form eines Instruments den Klang verändern." }
        gradeBand: "5-6"
        requires: [schwingung]
      - id: klangweg-uebertragung
        iCan: { de: "Ich kann erklären, wie ein Klang als Schall durch die Luft zu meinem Ohr kommt." }
        gradeBand: "5-6"
        requires: [schwingung]
      - id: instrumentenfamilien
        iCan: { de: "Ich kann Instrumente nach der Art, wie sie klingen, in Familien einordnen." }
        gradeBand: "5-6"
        requires: [klangquellen-unterscheiden, schwingung]
      - id: stimme-klangquelle
        iCan: { de: "Ich kann erklären, wie meine Stimme entsteht und was dabei mitschwingt." }
        gradeBand: "5-6"
        requires: [klangquellen-unterscheiden]
      - id: klang-gestalten
        iCan: { de: "Ich kann einen Klang gezielt gestalten, zum Beispiel durch die Art des Anschlagens, durch Dämpfen oder durch Klangbearbeitung." }
        gradeBand: "9-10"
        requires: [klangformung, verstaerkung-resonanz]
  - id: ausdruck-wirkung
    name: { de: "Ausdruck und Wirkung", en: "Expression and effect" }
    competencies:
      - id: gefuehle-in-worte-fassen
        iCan: { de: "Ich kann in Worte fassen, welche Gefühle und Bilder Musik bei mir auslöst." }
        gradeBand: "5-6"
        requires: [konzentriert-hoeren]
      - id: wirkung-beschreiben
        iCan: { de: "Ich kann die Wirkung von Musik mit passenden Wörtern beschreiben, zum Beispiel feierlich, ruhig oder bedrohlich." }
        gradeBand: "5-6"
        requires: [gefuehle-in-worte-fassen]
      - id: mittel-der-wirkung
        iCan: { de: "Ich kann zeigen, welche musikalischen Mittel eine Wirkung erzeugen, zum Beispiel Tempo, Lautstärke oder Dur und Moll." }
        gradeBand: "5-6"
        requires: [wirkung-beschreiben]
      - id: wirkung-begruenden
        iCan: { de: "Ich kann begründen, warum eine Musik so wirkt, und meine Gefühle dazu einordnen." }
        gradeBand: "9-10"
        requires: [mittel-der-wirkung]
      - id: medien-inszenierung
        iCan: { de: "Ich kann erkennen, wie Film, Werbung oder Computerspiele Musik einsetzen, um zu wirken." }
        gradeBand: "9-10"
        requires: [wirkung-begruenden]
      - id: beeinflussung-erkennen
        iCan: { de: "Ich kann erkennen, wann Musik mich beeinflussen soll, und mich dazu begründet verhalten." }
        gradeBand: "9-10"
        requires: [medien-inszenierung]
  - id: gesang-instrumentalspiel
    name: { de: "Gesang und Instrumentalspiel", en: "Singing and playing instruments" }
    competencies:
      - id: haltung-atmung
        iCan: { de: "Ich kann mit aufrechter Haltung und ruhiger Atmung singen." }
        gradeBand: "5-6"
      - id: stimme-pflegen
        iCan: { de: "Ich kann meine Stimme pflegen und mich vor dem Singen einsingen." }
        gradeBand: "5-6"
        requires: [haltung-atmung]
      - id: artikulation-intonation
        iCan: { de: "Ich kann deutlich sprechen und sauber singen." }
        gradeBand: "5-6"
        requires: [haltung-atmung]
      - id: zielton-singen
        iCan: { de: "Ich kann einen vorgegebenen Ton mit der Stimme treffen." }
        gradeBand: "5-6"
        requires: [artikulation-intonation]
      - id: tonfolge-nachsingen
        iCan: { de: "Ich kann eine kurze Tonfolge hören und Ton für Ton nachsingen." }
        gradeBand: "5-6"
        requires: [zielton-singen]
      - id: lieder-auswendig-singen
        iCan: { de: "Ich kann mehrere Lieder aus verschiedenen Bereichen auswendig singen." }
        gradeBand: "5-6"
        requires: [artikulation-intonation]
      - id: lieder-genrebewusst-singen
        iCan: { de: "Ich kann ein großes Repertoire auswendig singen und dabei zum Stil des Liedes passend gestalten." }
        gradeBand: "9-10"
        requires: [lieder-auswendig-singen]
      - id: mehrstimmig-singen
        iCan: { de: "Ich kann in einem Chor oder Ensemble mehrstimmig singen und meine Stimme sicher halten." }
        gradeBand: "9-10"
        requires: [tonfolge-nachsingen, aufeinander-hoeren]
      - id: spieltechnik-instrument
        iCan: { de: "Ich kann ein Instrument sachgerecht behandeln und mit passender Spieltechnik spielen." }
        gradeBand: "5-6"
      - id: instrument-technisch-korrekt
        iCan: { de: "Ich kann ein Instrument technisch korrekt spielen und seinen Klang bewusst gestalten." }
        gradeBand: "9-10"
        requires: [spieltechnik-instrument]
      - id: rhythmus-nachklatschen
        iCan: { de: "Ich kann einen gehörten Rhythmus nachklatschen und im Takt bleiben." }
        gradeBand: "5-6"
      - id: rhythmus-nachbauen
        iCan: { de: "Ich kann ein Rhythmus-Muster zusammensetzen und im Takt klatschen oder spielen." }
        gradeBand: "5-6"
        requires: [rhythmus-nachklatschen]
      - id: tonfolge-im-metrum
        iCan: { de: "Ich kann eine kurze Tonfolge im gleichmäßigen Grundschlag singen oder spielen." }
        gradeBand: "5-6"
        requires: [tonfolge-nachsingen]
      - id: lied-begleiten
        iCan: { de: "Ich kann ein Lied mit dem Grundschlag begleiten und im Tempo bleiben." }
        gradeBand: "5-6"
        requires: [rhythmus-nachklatschen]
      - id: aufeinander-hoeren
        iCan: { de: "Ich kann beim gemeinsamen Musizieren auf die anderen hören und darauf reagieren." }
        gradeBand: "5-6"
      - id: mehrstimmig-realisieren
        iCan: { de: "Ich kann ein Musikstück mit mehreren Stimmen rhythmisch und tonal sicher gemeinsam aufführen." }
        gradeBand: "9-10"
        requires: [aufeinander-hoeren, rhythmus-nachbauen, tonfolge-im-metrum]
      - id: ueben-strategien
        iCan: { de: "Ich kann ein Stück mit passenden Übestrategien einüben und festigen." }
        gradeBand: "5-6"
      - id: musizieren-korrigieren
        iCan: { de: "Ich kann mein Musizieren und das der Gruppe vergleichend wahrnehmen und verbessern." }
        gradeBand: "9-10"
        requires: [ueben-strategien, aufeinander-hoeren]
      - id: musizieren-anleiten
        iCan: { de: "Ich kann eine kleine Gruppe beim Musizieren anleiten, zum Beispiel mit einem Einsatzzeichen." }
        gradeBand: "5-6"
        requires: [aufeinander-hoeren]
      - id: musizieren-organisieren
        iCan: { de: "Ich kann ein Musizieren in der Gruppe vorbereiten und organisieren und dabei anleiten." }
        gradeBand: "9-10"
        requires: [musizieren-anleiten]
      - id: frei-experimentieren
        iCan: { de: "Ich kann frei mit Stimme und Instrument experimentieren und neue Klänge entdecken." }
        gradeBand: "5-6"
        requires: [klangquellen-unterscheiden]
      - id: tonleiter-ganzton-halbton
        iCan: { de: "Ich kann Ganztonschritte und Halbtonschritte unterscheiden." }
        gradeBand: "5-6"
        requires: [halbtonschritte]
      - id: dur-tonleiter-bauen
        iCan: { de: "Ich kann die Dur-Tonleiter aus Ganzton- und Halbtonschritten aufbauen." }
        gradeBand: "5-6"
        requires: [tonleiter-ganzton-halbton]
      - id: dur-moll-hoeren
        iCan: { de: "Ich kann Dur und Moll am Klang unterscheiden." }
        gradeBand: "5-6"
        requires: [konzentriert-hoeren]
      - id: moll-aufbau
        iCan: { de: "Ich kann erklären, worin sich der Aufbau von Moll von Dur unterscheidet." }
        gradeBand: "5-6"
        requires: [dur-tonleiter-bauen, dur-moll-hoeren]
      - id: intervall-hoeren
        iCan: { de: "Ich kann den Abstand zwischen zwei Tönen hören und mit hoch, tief oder gleich beschreiben." }
        gradeBand: "5-6"
        requires: [tonhoehe-hoch-tief]
      - id: intervall-benennen
        iCan: { de: "Ich kann den Abstand zwischen zwei Tönen abzählen und mit dem Namen des Intervalls benennen." }
        gradeBand: "5-6"
        requires: [intervall-hoeren, klaviatur-tasten]
      - id: intervalle-erkennen-singen
        iCan: { de: "Ich kann Intervalle hören, benennen und singen." }
        gradeBand: "9-10"
        requires: [intervall-benennen, zielton-singen]
      - id: rhythmus-erfinden
        iCan: { de: "Ich kann einen eigenen Rhythmus über vier Takte erfinden und spielen." }
        gradeBand: "5-6"
        requires: [rhythmus-nachbauen, notenwerte-erkennen]
      - id: melodie-erfinden
        iCan: { de: "Ich kann aus den Tönen der Dur-Tonleiter eine kurze eigene Melodie erfinden und singen." }
        gradeBand: "5-6"
        requires: [dur-tonleiter-bauen, tonfolge-nachsingen]
      - id: musik-variieren
        iCan: { de: "Ich kann ein Lied oder eine Melodie verändern, zum Beispiel im Rhythmus, im Tempo oder in der Lautstärke." }
        gradeBand: "5-6"
        requires: [mittel-der-wirkung]
      - id: musik-nach-vorgabe-erfinden
        iCan: { de: "Ich kann nach einer Vorgabe außerhalb der Musik, zum Beispiel einem Bild oder einer Geschichte, eine kurze Musik erfinden." }
        gradeBand: "5-6"
        requires: [frei-experimentieren]
      - id: musik-aufgabenbezogen-gestalten
        iCan: { de: "Ich kann nach einer Aufgabe und nach musikalischen Kriterien ein eigenes Stück erfinden, ausarbeiten und vorführen." }
        gradeBand: "9-10"
        requires: [musik-nach-vorgabe-erfinden, musik-variieren]
  - id: bewegung-gestaltungsmedien
    name: { de: "Bewegung und Gestaltungsmedien", en: "Movement and media of design" }
    competencies:
      - id: bewegungsmuster-ausfuehren
        iCan: { de: "Ich kann ein Bewegungsmuster zu Musik auswählen und gut abgestimmt ausführen." }
        gradeBand: "5-6"
        requires: [grundschlag-finden]
      - id: bewegung-nach-ausdruck-form
        iCan: { de: "Ich kann mich so zu Musik bewegen, dass die Bewegung zu Ausdruck, Tempo und Form der Musik passt." }
        gradeBand: "5-6"
        requires: [bewegungsmuster-ausfuehren, wirkung-beschreiben]
      - id: musik-in-bild
        iCan: { de: "Ich kann den Verlauf und die Wirkung von Musik in einem Bild oder einer Zeichnung darstellen." }
        gradeBand: "5-6"
        requires: [wirkung-beschreiben]
      - id: musik-in-szene-sprache
        iCan: { de: "Ich kann Musik in einer Szene oder in Worten umsetzen." }
        gradeBand: "5-6"
        requires: [wirkung-beschreiben]
      - id: umsetzung-beurteilen
        iCan: { de: "Ich kann beurteilen, ob ein Bild, eine Bewegung oder eine Szene zur Musik passt." }
        gradeBand: "5-6"
        requires: [musik-in-bild]
      - id: choreografieren
        iCan: { de: "Ich kann nach Kriterien Bewegungen zur Musik entwerfen und als Choreografie einüben." }
        gradeBand: "9-10"
        requires: [bewegung-nach-ausdruck-form]
      - id: musik-digital-visualisieren
        iCan: { de: "Ich kann den Aufbau und den Ausdruck von Musik mit analogen oder digitalen Medien sichtbar machen." }
        gradeBand: "9-10"
        requires: [musik-in-bild]
      - id: umsetzung-kritisieren
        iCan: { de: "Ich kann eine Umsetzung von Musik kritisch bewerten und Alternativen vorschlagen." }
        gradeBand: "9-10"
        requires: [umsetzung-beurteilen]
  - id: parameter
    name: { de: "Parameter", en: "Musical parameters" }
    competencies:
      - id: parameter-nennen
        iCan: { de: "Ich kann die Grundeigenschaften Tempo, Tonhöhe, Tondauer, Lautstärke, Klangfarbe und Klangdichte nennen und unterscheiden." }
        gradeBand: "5-6"
        requires: [konzentriert-hoeren]
      - id: parameter-differenziert-hoeren
        iCan: { de: "Ich kann die Parameter in einem Musikstück genau heraushören und mit den Fachwörtern benennen." }
        gradeBand: "9-10"
        requires: [parameter-nennen]
      - id: tonhoehe-hoch-tief
        iCan: { de: "Ich kann hohe und tiefe Töne unterscheiden und ordnen." }
        gradeBand: "5-6"
        requires: [parameter-nennen]
      - id: frequenz-oktave
        iCan: { de: "Ich kann erklären, dass die Tonhöhe von der Frequenz in Hertz abhängt und dass die Oktave eine Verdopplung der Frequenz ist." }
        gradeBand: "5-6"
        requires: [tonhoehe-hoch-tief, schwingung]
      - id: klaviatur-tasten
        iCan: { de: "Ich kann die Tasten der Klaviatur benennen und das C finden." }
        gradeBand: "5-6"
        requires: [tonhoehe-hoch-tief]
      - id: halbtonschritte
        iCan: { de: "Ich kann Halbtonschritte auf der Klaviatur abzählen." }
        gradeBand: "5-6"
        requires: [klaviatur-tasten]
      - id: lautstaerke-hoeren
        iCan: { de: "Ich kann Lautstärken hören und der Stärke nach ordnen." }
        gradeBand: "5-6"
        requires: [parameter-nennen]
      - id: tempo-hoeren
        iCan: { de: "Ich kann schnelles und langsames Tempo hören und beschreiben." }
        gradeBand: "5-6"
        requires: [parameter-nennen]
      - id: tempo-woerter
        iCan: { de: "Ich kann Tempowörter wie Allegro und Adagio dem passenden Tempo zuordnen." }
        gradeBand: "5-6"
        requires: [tempo-hoeren]
      - id: tempo-schlaege-pro-minute
        iCan: { de: "Ich kann ein Tempo in Schlägen pro Minute angeben und damit rechnen." }
        gradeBand: "5-6"
        requires: [tempo-hoeren, grundschlag-finden]
      - id: klangfarbe-hoeren
        iCan: { de: "Ich kann hören, warum zwei Instrumente beim gleichen Ton verschieden klingen, und die Klangfarbe beschreiben." }
        gradeBand: "5-6"
        requires: [parameter-nennen]
      - id: klangdichte-hoeren
        iCan: { de: "Ich kann hören, ob wenige oder viele Stimmen und Instrumente gleichzeitig klingen, und die Dichte beschreiben." }
        gradeBand: "5-6"
        requires: [parameter-nennen]
      - id: tondauer-hoeren
        iCan: { de: "Ich kann kurze und lange Töne hören und der Dauer nach ordnen." }
        gradeBand: "5-6"
        requires: [parameter-nennen]
      - id: grundschlag-finden
        iCan: { de: "Ich kann in Musik den gleichmäßigen Grundschlag finden und mitklopfen." }
        gradeBand: "5-6"
        requires: [tempo-hoeren]
      - id: betonung-hoeren
        iCan: { de: "Ich kann betonte und unbetonte Schläge hören." }
        gradeBand: "5-6"
        requires: [grundschlag-finden]
      - id: taktarten-unterscheiden
        iCan: { de: "Ich kann den 2/4-, 3/4- und 4/4-Takt am Klang unterscheiden." }
        gradeBand: "5-6"
        requires: [betonung-hoeren]
      - id: rhythmus-erklaeren
        iCan: { de: "Ich kann erklären, dass der Rhythmus aus Tempo und Tondauer entsteht, und ihn vom Grundschlag unterscheiden." }
        gradeBand: "5-6"
        requires: [grundschlag-finden, tondauer-hoeren]
  - id: zeichen
    name: { de: "Zeichen und Notation", en: "Signs and notation" }
    competencies:
      - id: notensystem
        iCan: { de: "Ich kann das Notensystem mit seinen fünf Linien und den Violinschlüssel beschreiben." }
        gradeBand: "5-6"
        requires: [tonhoehe-hoch-tief]
      - id: noten-benennen
        iCan: { de: "Ich kann Noten auf Linien, in Zwischenräumen und auf Hilfslinien erkennen und mit ihrem Namen benennen." }
        gradeBand: "5-6"
        requires: [notensystem, klaviatur-tasten]
      - id: notenwerte-erkennen
        iCan: { de: "Ich kann ganze, halbe, Viertel- und Achtelnoten unterscheiden und ihre Dauer vergleichen." }
        gradeBand: "5-6"
        requires: [tondauer-hoeren]
      - id: pausen-kennen
        iCan: { de: "Ich kann Pausenzeichen lesen und weiß, dass eine Pause genauso lange dauert wie die Note mit gleichem Namen." }
        gradeBand: "5-6"
        requires: [notenwerte-erkennen]
      - id: notenwerte-im-takt
        iCan: { de: "Ich kann Notenwerte und Pausen zusammenzählen und sagen, ob sie in einen Takt passen." }
        gradeBand: "5-6"
        requires: [notenwerte-erkennen, taktarten-unterscheiden]
      - id: rhythmus-lesen
        iCan: { de: "Ich kann einen notierten Rhythmus lesen und in Klang umsetzen." }
        gradeBand: "5-6"
        requires: [notenwerte-im-takt, rhythmus-nachklatschen]
      - id: melodie-lesen
        iCan: { de: "Ich kann eine kurze Melodie aus Noten ablesen und anhören oder singen." }
        gradeBand: "5-6"
        requires: [noten-benennen, rhythmus-lesen]
      - id: rhythmus-notieren
        iCan: { de: "Ich kann einen Rhythmus, den ich gehört oder erfunden habe, in Notenwerten aufschreiben." }
        gradeBand: "5-6"
        requires: [notenwerte-im-takt]
      - id: melodie-notieren
        iCan: { de: "Ich kann eine kurze Melodie in Noten aufschreiben." }
        gradeBand: "5-6"
        requires: [noten-benennen, rhythmus-notieren]
      - id: dynamik-zeichen
        iCan: { de: "Ich kann Lautstärkezeichen wie piano und forte lesen und beim Musizieren umsetzen." }
        gradeBand: "5-6"
        requires: [lautstaerke-hoeren]
      - id: grafisch-notieren
        iCan: { de: "Ich kann Musik mit eigenen Zeichen als Grafik aufschreiben." }
        gradeBand: "5-6"
        requires: [parameter-nennen]
      - id: grafik-musizieren
        iCan: { de: "Ich kann nach einer grafischen Notation Klänge machen." }
        gradeBand: "5-6"
        requires: [grafisch-notieren]
      - id: gesten-verstehen
        iCan: { de: "Ich kann Handzeichen und Gesten, die Musik anzeigen, verstehen und darauf reagieren." }
        gradeBand: "5-6"
        requires: [aufeinander-hoeren]
      - id: traditionell-und-grafisch-notieren
        iCan: { de: "Ich kann ein Musikstück sowohl grafisch als auch in traditioneller Notenschrift festhalten." }
        gradeBand: "9-10"
        requires: [melodie-notieren, grafisch-notieren]
      - id: nach-notation-musizieren
        iCan: { de: "Ich kann nach Noten oder einer Grafik auch mehrstimmig musizieren." }
        gradeBand: "9-10"
        requires: [melodie-lesen, grafik-musizieren, mehrstimmig-realisieren]
  - id: form
    name: { de: "Form", en: "Form" }
    competencies:
      - id: abschnitte-hoeren
        iCan: { de: "Ich kann in einem Stück Abschnitte erkennen und mit Buchstaben wie A und B benennen." }
        gradeBand: "5-6"
        requires: [konzentriert-hoeren]
      - id: wiederholung-kontrast
        iCan: { de: "Ich kann Wiederholung und Kontrast in einem Stück hören und beschreiben." }
        gradeBand: "5-6"
        requires: [abschnitte-hoeren]
      - id: veraenderung-hoeren
        iCan: { de: "Ich kann hören, wie ein Abschnitt verändert wird." }
        gradeBand: "5-6"
        requires: [wiederholung-kontrast]
      - id: kompositionsmodelle
        iCan: { de: "Ich kann einfache Formmodelle wie Liedform oder Rondo erkennen." }
        gradeBand: "5-6"
        requires: [wiederholung-kontrast]
      - id: entwicklung-hoeren
        iCan: { de: "Ich kann beschreiben, wie sich Musik aus einem kurzen Motiv entwickelt." }
        gradeBand: "9-10"
        requires: [veraenderung-hoeren]
      - id: kanon-prinzip
        iCan: { de: "Ich kann das Kanonprinzip erklären und einen Kanon hören und singen." }
        gradeBand: "9-10"
        requires: [abschnitte-hoeren, aufeinander-hoeren]
      - id: formverlauf-darstellen
        iCan: { de: "Ich kann den Formverlauf eines Stücks in einer Übersicht darstellen." }
        gradeBand: "9-10"
        requires: [kompositionsmodelle, entwicklung-hoeren]
  - id: kontext
    name: { de: "Kontext", en: "Context" }
    competencies:
      - id: herkunft-einordnen
        iCan: { de: "Ich kann sagen, wann, wo und von wem ein Musikstück stammt." }
        gradeBand: "5-6"
      - id: musik-und-umfeld
        iCan: { de: "Ich kann Merkmale eines Musikstücks mit seiner Entstehung und seinem Umfeld verbinden und beurteilen." }
        gradeBand: "5-6"
        requires: [herkunft-einordnen]
      - id: musik-anderer-kulturen
        iCan: { de: "Ich kann Musik aus anderen Ländern und Kulturen kennenlernen und ihr einen Ort zuordnen." }
        gradeBand: "5-6"
        requires: [herkunft-einordnen]
      - id: musik-zeitepoche
        iCan: { de: "Ich kann ein Musikstück einer geschichtlichen Zeit zuordnen und die Zeit am Stück begründen." }
        gradeBand: "9-10"
        requires: [musik-und-umfeld]
      - id: soziale-bedingungen
        iCan: { de: "Ich kann erklären, wie Wirtschaft, Gesellschaft und Medien beeinflussen, welche Musik entsteht und gehört wird." }
        gradeBand: "9-10"
        requires: [musik-und-umfeld]
      - id: rezeption-erklaeren
        iCan: { de: "Ich kann erklären, wie ein Stück zu verschiedenen Zeiten aufgenommen und verstanden wurde." }
        gradeBand: "9-10"
        requires: [musik-zeitepoche]
  - id: gebrauchspraxis
    name: { de: "Musikalische Gebrauchspraxis", en: "Musical practices of use" }
    competencies:
      - id: gebrauchspraxen-nennen
        iCan: { de: "Ich kann Beispiele nennen, wofür Musik gebraucht wird, zum Beispiel bei Festen, im Sport oder zum Tanzen." }
        gradeBand: "5-6"
        requires: [herkunft-einordnen]
      - id: zweck-umfeld-einordnen
        iCan: { de: "Ich kann Musik nach Zweck und Umfeld einordnen und beurteilen." }
        gradeBand: "5-6"
        requires: [gebrauchspraxen-nennen]
      - id: repertoire-aufbauen
        iCan: { de: "Ich kann Lieder und Stücke aus verschiedenen Bereichen der Musikpraxis vortragen." }
        gradeBand: "5-6"
        requires: [lieder-auswendig-singen, gebrauchspraxen-nennen]
      - id: auffuehrung-mitgestalten
        iCan: { de: "Ich kann bei einer Aufführung in der Schule gestaltend mitmachen." }
        gradeBand: "5-6"
        requires: [repertoire-aufbauen]
      - id: auffuehrung-auswerten
        iCan: { de: "Ich kann eine Aufführung auswerten und sagen, was gelungen ist und was ich anders machen würde." }
        gradeBand: "5-6"
        requires: [auffuehrung-mitgestalten]
      - id: gebrauchspraxen-unterscheiden
        iCan: { de: "Ich kann verschiedene musikalische Gebrauchspraxen unterscheiden und ihre Merkmale erklären." }
        gradeBand: "9-10"
        requires: [zweck-umfeld-einordnen]
      - id: identitaet-peergroup
        iCan: { de: "Ich kann erklären, wie Musik zu einer Gruppe, einer Mode oder einer Zeit gehört und Zugehörigkeit zeigt." }
        gradeBand: "9-10"
        requires: [gebrauchspraxen-unterscheiden, soziale-bedingungen]
      - id: gebrauchspraxis-positionieren
        iCan: { de: "Ich kann die Eigenarten einer Gebrauchspraxis kritisch bewerten und begründet Stellung nehmen." }
        gradeBand: "9-10"
        requires: [gebrauchspraxen-unterscheiden]
      - id: auffuehrung-planen
        iCan: { de: "Ich kann eine musikalische Aufführung planen, gestaltend an ihr teilnehmen und sie auswerten." }
        gradeBand: "9-10"
        requires: [auffuehrung-auswerten, musizieren-organisieren]
