# yaml-language-server: $schema=https://lernapps.net/apps/schemas/subject.v1.schema.json
# PROPOSAL (research, not yet in the catalog). Source base: Hessen (KD-17), compared with Bayern, NRW and Rheinland-Pfalz.
# Source codes in the comments:
#   KC = Kerncurriculum Hessen Sekundarstufe I Gymnasium, Musik (Kap. 6 = Ende 9/10, 7.1 = Ende 6, 8 = Synopsen)
#   G9 = Lehrplan Musik, Gymnasialer Bildungsgang, Hessen (Themenblaetter und Arbeitsbereiche; Jahrgaenge 5, 6, 8, 10;
#        5,6 -> "5-6", 8 -> "7-8", 10 -> "9-10"; fuer 7 und 9 gibt es keine eigenen Themen)
#   BY = LehrplanPLUS Bayern Gymnasium (G9) Musik, Mu5 bis Mu10, Lernbereiche LB1 Sprechen-Singen-Musizieren,
#        LB2 Musik-Mensch-Zeit, LB3 Bewegung-Tanz-Szene, LB4 Musik und ihre Grundlagen; "nur MuG" = Musisches Gymnasium
#   NW = Kernlehrplan Musik Gymnasium Sek I, Nordrhein-Westfalen (2019), Ordnungssysteme musikalischer Strukturen
#   RP = Lehrplan Musik Sek I, Rheinland-Pfalz (2018), Kap. 4.2 und 5.1
name: { de: Musik, en: Music }
source:
  title: Kerncurriculum Hessen, Sekundarstufe I - Gymnasium, Musik (Hessisches Kultusministerium), mit Lehrplan Musik G9 Hessen
  url: https://kultus.hessen.de/sites/kultus.hessen.de/files/2021-07/kerncurriculum_musik_gymnasium.pdf
strands:
  - id: hoerkultur
    name: { de: "Musik hören und beschreiben", en: "Listening to music and describing it" }
    competencies:
      # KC 7.1 Musik hören (Konzentration auf den Hörsinn); G9 Hören ohne Noten 5 (konzentriertes Zuhören); RP 4.2.4
      - id: konzentriert-hoeren
        iCan: { de: "Ich kann meine Aufmerksamkeit gezielt auf das Hören richten." }
        gradeBand: "5-6"
      # KC Inhaltsfeld Hörkultur (Hörweisen); G9 Übergangsprofil (emotional-assoziativ, analysierend-erfassend)
      - id: hoerweisen-unterscheiden
        iCan: { de: "Ich kann verschiedene Arten des Hörens unterscheiden, zum Beispiel nebenbei hören und genau hinhören." }
        gradeBand: "5-6"
        requires: [konzentriert-hoeren]
      # KC 7.1 Musik hören (Hörgewohnheiten beschreiben und vergleichen); G9 5/02 Lebenswelt Musik
      - id: hoergewohnheiten-beschreiben
        iCan: { de: "Ich kann beschreiben, wann und wie ich selbst Musik höre, und das mit anderen vergleichen." }
        gradeBand: "5-6"
        requires: [hoerweisen-unterscheiden]
      # KC 7.1 Inhaltsfeld Parameter (sechs Grundeigenschaften); G9 Hören ohne Noten 5 (differenzierendes Hören); RP 4.2.4
      - id: parameter-nennen
        iCan: { de: "Ich kann die Grundeigenschaften Tempo, Tonhöhe, Tondauer, Lautstärke, Klangfarbe und Klangdichte nennen und unterscheiden." }
        gradeBand: "5-6"
        requires: [konzentriert-hoeren]
      # G9 Hören ohne Noten 8 (rhythmische, melodische, harmonische, formale, klangliche Verläufe unterscheiden); BY Mu7 LB4
      - id: verlaeufe-hoeren
        iCan: { de: "Ich kann in einem Stück rhythmische, melodische, klangliche und formale Verläufe heraushören und mit Fachwörtern beschreiben." }
        gradeBand: "7-8"
        requires: [parameter-nennen]
      # KC Kap. 6 Musik hören (differenziert hören, fachgerecht benennen); G9 Hören ohne Noten 10
      - id: parameter-differenziert-hoeren
        iCan: { de: "Ich kann die Parameter in einem Musikstück genau heraushören und mit den Fachwörtern benennen." }
        gradeBand: "9-10"
        requires: [verlaeufe-hoeren]
      # KC Kap. 6 Inhaltsfeld Hörkultur (Stille erfahren, Hörlandschaften); RP 4.2.4 (Klangereignisse der Umwelt)
      - id: hoerlandschaft-entdecken
        iCan: { de: "Ich kann Stille und die Geräusche meiner Umgebung bewusst wahrnehmen und beschreiben." }
        gradeBand: "9-10"
        requires: [konzentriert-hoeren]
      # KC Kap. 6 Musik hören (Hörgewohnheiten kritisch reflektieren); G9 10/17; BY Mu7/Mu8 (eigene Nutzung und Vorlieben); NW Verwendungen
      - id: hoergewohnheiten-reflektieren
        iCan: { de: "Ich kann meine eigenen Hörgewohnheiten kritisch prüfen und begründen, was ich an ihnen ändern möchte." }
        gradeBand: "9-10"
        requires: [hoergewohnheiten-beschreiben, sach-werturteil]
      # KC 7.1 Musik hören (Emotionen und Assoziationen in Worte fassen); NW Rezeption (subjektive Höreindrücke beschreiben); G9 Hören ohne Noten 5
      - id: gefuehle-in-worte-fassen
        iCan: { de: "Ich kann in Worte fassen, welche Gefühle und Bilder Musik bei mir auslöst." }
        gradeBand: "5-6"
        requires: [konzentriert-hoeren]
      # KC Inhaltsfeld Ausdruck und Wirkung (Repertoire charakterisierender Begriffe); BY Mu5 LB2 (Funktion und Wirkung)
      - id: wirkung-beschreiben
        iCan: { de: "Ich kann die Wirkung von Musik mit passenden Wörtern beschreiben, zum Beispiel feierlich, ruhig oder bedrohlich." }
        gradeBand: "5-6"
        requires: [gefuehle-in-worte-fassen]
      # G9 6/08 Geschichten - Bilder - Musik; NW Bedeutungen 5/6 (musikalische Darstellung außermusikalischer Inhalte); BY Mu5 LB1
      - id: programmmusik-hoeren
        iCan: { de: "Ich kann erkennen, wie eine Musik eine Geschichte oder ein Bild darstellt, und das mit Merkmalen der Musik begründen." }
        gradeBand: "5-6"
        requires: [wirkung-beschreiben]
      # KC Inhaltsfeld Ausdruck und Wirkung (kompositorische Mittel); BY Mu6 LB1 (Wirkungen anhand der Mittel begründen)
      - id: mittel-der-wirkung
        iCan: { de: "Ich kann zeigen, welche musikalischen Mittel eine Wirkung erzeugen, zum Beispiel Tempo, Lautstärke oder Dur und Moll." }
        gradeBand: "5-6"
        requires: [wirkung-beschreiben, parameter-nennen]
      # BY Mu7 LB1 (Sach- und Werturteil unterscheiden); G9 Musikalische Urteilsfähigkeit (Werturteile begründen, 5/8/10); KC Kap. 8.1 (Meinung über Musik begründen, Ende 4)
      - id: sach-werturteil
        iCan: { de: "Ich kann ein Urteil über Musik begründen und eine Sachaussage von einer Geschmacksaussage unterscheiden." }
        gradeBand: "7-8"
        requires: [wirkung-beschreiben]
      # G9 8/12 Musik in Film und Werbung; BY Mu8 LB2 (Filmmusik, Werbung); KC Inhaltsfeld Ausdruck und Wirkung (mediale Inszenierung)
      - id: medien-inszenierung
        iCan: { de: "Ich kann erkennen, wie Film, Werbung oder Computerspiele Musik einsetzen, um zu wirken." }
        gradeBand: "7-8"
        requires: [mittel-der-wirkung]
      # KC Kap. 6 Musik hören (Emotionen begründet beschreiben und einordnen)
      - id: wirkung-begruenden
        iCan: { de: "Ich kann begründen, warum eine Musik so wirkt, und meine Gefühle dazu einordnen." }
        gradeBand: "9-10"
        requires: [mittel-der-wirkung, sach-werturteil]
      # KC Inhaltsfeld Ausdruck und Wirkung (manipulativ wirken); G9 10/17 (Manipulation); BY Mu8 (Techniken der Beeinflussung in der Werbung); NW Verwendungen
      - id: beeinflussung-erkennen
        iCan: { de: "Ich kann erkennen, wann Musik mich beeinflussen soll, und mich dazu begründet verhalten." }
        gradeBand: "9-10"
        requires: [medien-inszenierung, wirkung-begruenden]
  - id: klang
    name: { de: "Klang, Instrumente und Vortrag", en: "Sound, instruments and performance" }
    competencies:
      # KC 7.1 Inhaltsfeld Klang (Stimme, Körper, Instrumente als Klangquellen); G9 5/04; RP Ton, Geräusch, Stille
      - id: klangquellen-unterscheiden
        iCan: { de: "Ich kann Stimme, Körper, Gegenstände und Instrumente als Klangquellen unterscheiden." }
        gradeBand: "5-6"
      # KC 7.1 Inhaltsfeld Klang (Schwingung); RP Schall, Schwingung
      - id: schwingung
        iCan: { de: "Ich kann erklären, dass jeder Klang durch eine Schwingung entsteht." }
        gradeBand: "5-6"
        requires: [klangquellen-unterscheiden]
      # KC 7.1 Inhaltsfeld Klang (Verstärkung); G9 5/04 (Klangeigenschaften, Bau)
      - id: verstaerkung-resonanz
        iCan: { de: "Ich kann erklären, wie ein Resonanzkörper einen Klang lauter macht." }
        gradeBand: "5-6"
        requires: [schwingung]
      # KC 7.1 Inhaltsfeld Klang (Klangformung); G9 5/04 (Bau, Tonerzeugung); NW Klangerzeugung
      - id: klangformung
        iCan: { de: "Ich kann beschreiben, wie Material und Form eines Instruments den Klang verändern." }
        gradeBand: "5-6"
        requires: [schwingung]
      # KC 7.1 Inhaltsfeld Klang (Übertragung); BY Mu8 LB4 (Ausbreitung von Schallereignissen, nur MuG)
      - id: klangweg-uebertragung
        iCan: { de: "Ich kann erklären, wie ein Klang als Schall durch die Luft zu meinem Ohr kommt." }
        gradeBand: "5-6"
        requires: [schwingung]
      # KC 7.1 Inhaltsfeld Klang (Stimme als Klangquelle); BY Mu7 LB1 (physiologische Grundlagen der Stimme)
      - id: stimme-klangquelle
        iCan: { de: "Ich kann erklären, wie meine Stimme entsteht und was dabei mitschwingt." }
        gradeBand: "5-6"
        requires: [klangquellen-unterscheiden]
      # G9 5/04 und Elemente der Musik (Instrumentenfamilien); BY Mu5 LB4; NW 5/6 Klangfarbe (Instrumente); RP Orientierungsstufe
      - id: instrumentenfamilien
        iCan: { de: "Ich kann Instrumente nach der Art, wie sie klingen, in Familien einordnen." }
        gradeBand: "5-6"
        requires: [klangquellen-unterscheiden, schwingung]
      # G9 5/04 (Instrumentale Besetzungen, Ensembles); NW 5/6 (Ensembles); BY Mu6 LB4 (Besetzungen)
      - id: ensembles-besetzungen
        iCan: { de: "Ich kann Besetzungen wie Sinfonieorchester, Band oder Chor erkennen und ihre Instrumente oder Stimmen nennen." }
        gradeBand: "5-6"
        requires: [instrumentenfamilien]
      # G9 Elemente der Musik 6 (Stimmlagen); NW 5/6 (Stimmlagen); RP Klassenstufe 7-9/10 (Sopran, Alt, Tenor, Bass)
      - id: stimmlagen
        iCan: { de: "Ich kann die Stimmlagen Sopran, Alt, Tenor und Bass unterscheiden und beim Hören erkennen." }
        gradeBand: "5-6"
        requires: [stimme-klangquelle]
      # KC Inhaltsfeld Parameter (Klangfarbe); G9 Hören ohne Noten 5; NW Klangfarbe/Sound
      - id: klangfarbe-hoeren
        iCan: { de: "Ich kann hören, warum zwei Instrumente beim gleichen Ton verschieden klingen, und die Klangfarbe beschreiben." }
        gradeBand: "5-6"
        requires: [parameter-nennen]
      # KC Inhaltsfeld Parameter (Klangdichte; nur das KC nennt sie ausdrücklich); G9 Zusammenklang 5 (Punktklänge, Liegeklänge)
      - id: klangdichte-hoeren
        iCan: { de: "Ich kann hören, ob wenige oder viele Stimmen und Instrumente gleichzeitig klingen, und die Dichte beschreiben." }
        gradeBand: "5-6"
        requires: [parameter-nennen]
      # KC Inhaltsfeld Parameter (Lautstärke); G9 Weitere Parameter 5 (Dynamik); NW Dynamik
      - id: lautstaerke-hoeren
        iCan: { de: "Ich kann Lautstärken hören und der Stärke nach ordnen." }
        gradeBand: "5-6"
        requires: [parameter-nennen]
      # G9 Weitere Parameter 5 (Bezeichnungen pp-ff, crescendo, diminuendo); BY Mu5 LB4; NW 5/6 (pp bis ff, crescendo)
      - id: dynamik-zeichen
        iCan: { de: "Ich kann die Lautstärkezeichen von pianissimo bis fortissimo sowie crescendo und decrescendo lesen und beim Musizieren umsetzen." }
        gradeBand: "5-6"
        requires: [lautstaerke-hoeren]
      # G9 Weitere Parameter 5 (legato, portato, staccato); BY Mu6 LB4 (legato, staccato, Akzent); NW 5/6 (Vortragsarten)
      - id: artikulation-vortrag
        iCan: { de: "Ich kann legato und staccato hören und beim Musizieren umsetzen." }
        gradeBand: "5-6"
        requires: [dynamik-zeichen]
      # G9 Instrumentation 6 (Klangverfremdung, Stimmverfremdung), 6/07 Neue Musik und Experimente; BY Mu6 LB2 (Verfremdung)
      - id: klang-verfremden
        iCan: { de: "Ich kann einen Klang oder eine Stimme verfremden und beschreiben, was sich am Klang ändert." }
        gradeBand: "5-6"
        requires: [klangformung]
      # G9 Instrumentation 8 (elektrische Instrumente, Computer); BY Mu8 LB4 (digitale Schallereignisse, Klangerzeugung und -verfremdung, nur MuG); NW Klangerzeugung
      - id: elektronische-klangerzeugung
        iCan: { de: "Ich kann erklären, wie ein elektrisches oder digitales Instrument Klänge erzeugt und verändert." }
        gradeBand: "7-8"
        requires: [schwingung, klangformung]
      # KC Kap. 6 Inhaltsfeld Klang (Klanggestaltung); NW Sek I Ende (Klangerzeugung, Klangveränderung)
      - id: klang-gestalten
        iCan: { de: "Ich kann einen Klang gezielt gestalten, zum Beispiel durch die Art des Anschlagens, durch Dämpfen oder durch Klangbearbeitung." }
        gradeBand: "9-10"
        requires: [klangformung, verstaerkung-resonanz, klang-verfremden]
  - id: rhythmus-takt
    name: { de: "Rhythmus, Takt und Tempo", en: "Rhythm, metre and tempo" }
    competencies:
      # KC Inhaltsfeld Parameter (Tondauer); G9 Tondauer/Rhythmus 5 (lang/kurz)
      - id: tondauer-hoeren
        iCan: { de: "Ich kann kurze und lange Töne hören und der Dauer nach ordnen." }
        gradeBand: "5-6"
        requires: [parameter-nennen]
      # G9 Takt/Metrum 5 (Grundschlag, Puls, Beat); NW 5/6 (Metrum); RP Grundschlag, Puls, Metrum
      - id: grundschlag-finden
        iCan: { de: "Ich kann in Musik den gleichmäßigen Grundschlag finden und mitklopfen." }
        gradeBand: "5-6"
        requires: [tempo-hoeren]
      # G9 Takt/Metrum 5 (betont/unbetont); RP Taktschwerpunkt
      - id: betonung-hoeren
        iCan: { de: "Ich kann betonte und unbetonte Schläge hören." }
        gradeBand: "5-6"
        requires: [grundschlag-finden]
      # G9 Takt/Metrum 5 (gerade/ungerade, 2/4, 3/4, 4/4); NW 5/6 (Taktordnungen); RP Orientierungsstufe
      - id: taktarten-unterscheiden
        iCan: { de: "Ich kann den 2/4-, 3/4- und 4/4-Takt am Klang unterscheiden." }
        gradeBand: "5-6"
        requires: [betonung-hoeren]
      # G9 Takt/Metrum 5 (Volltakt/Auftakt); NW 5/6 (Auftakt)
      - id: auftakt-volltakt
        iCan: { de: "Ich kann einen Auftakt von einem Volltakt unterscheiden." }
        gradeBand: "5-6"
        requires: [taktarten-unterscheiden]
      # KC 7.1 Inhaltsfeld Parameter (Metrum/Rhythmus als Kombination aus Tempo und Tondauer)
      - id: rhythmus-erklaeren
        iCan: { de: "Ich kann erklären, dass der Rhythmus aus Tempo und Tondauer entsteht, und ihn vom Grundschlag unterscheiden." }
        gradeBand: "5-6"
        requires: [grundschlag-finden, tondauer-hoeren]
      # KC Inhaltsfeld Parameter (Tempo); G9 Weitere Parameter 5 (langsam - schnell)
      - id: tempo-hoeren
        iCan: { de: "Ich kann schnelles und langsames Tempo hören und beschreiben." }
        gradeBand: "5-6"
        requires: [parameter-nennen]
      # G9 Weitere Parameter 5 (Adagio - Presto); BY Mu5 LB4 (Presto, Allegro, Moderato, Andante, Adagio); NW Tempobezeichnungen
      - id: tempo-woerter
        iCan: { de: "Ich kann Tempowörter wie Allegro und Adagio dem passenden Tempo zuordnen." }
        gradeBand: "5-6"
        requires: [tempo-hoeren]
      # G9 Weitere Parameter 5 (accelerando, ritardando, Fermate); NW 5/6 (Tempoveränderungen)
      - id: tempo-veraendern
        iCan: { de: "Ich kann hören und lesen, wenn ein Stück schneller oder langsamer wird, und die Fachwörter dafür nennen." }
        gradeBand: "5-6"
        requires: [tempo-hoeren]
      # G9 Tondauer/Rhythmus 6 (Triole); BY Mu6 LB4 (Triole)
      - id: triole
        iCan: { de: "Ich kann eine Triole hören, lesen und klatschen." }
        gradeBand: "5-6"
        requires: [rhythmus-erklaeren, notenwerte-erkennen]
      # G9 Takt/Metrum 6 (6/8, Alla breve, Taktwechsel); BY Mu6 LB4 (zusammengesetzte Taktarten, Taktwechsel); RP Klassenstufe 7-9/10
      - id: weitere-taktarten
        iCan: { de: "Ich kann zusammengesetzte Taktarten wie 6/8 erkennen und einen Taktwechsel hören." }
        gradeBand: "5-6"
        requires: [taktarten-unterscheiden]
      # BY Mu7 LB4 (Synkope, Off-Beat); RP Klassenstufe 7-9/10; G9 Takt/Metrum 6 (Synkope; Hessen legt sie früher)
      - id: synkope
        iCan: { de: "Ich kann eine Synkope hören und klatschen." }
        gradeBand: "7-8"
        requires: [weitere-taktarten]
      # G9 Tondauer/Rhythmus 8 (Triolenfeeling, binär/ternär); BY Mu7 LB4; RP Klassenstufe 7-9/10
      - id: binaer-ternaer
        iCan: { de: "Ich kann hören und spielen, ob ein Rhythmus binär oder ternär (swingend) ausgeführt wird." }
        gradeBand: "7-8"
        requires: [triole]
      # G9 Takt/Metrum 8 (Beat - Off Beat); BY Mu7 LB4; NW Sek I Ende (Beat/Off-Beat, Groove); RP Back-Beat
      - id: beat-offbeat
        iCan: { de: "Ich kann in einem Song Beat und Off-Beat unterscheiden und den Groove mitklatschen." }
        gradeBand: "7-8"
        requires: [synkope, betonung-hoeren]
      # G9 Takt/Metrum 8 (5/4, 7/4, Polymetrik); BY Mu6 LB4 (7/8, 5/4)
      - id: besondere-taktarten
        iCan: { de: "Ich kann ungewöhnliche Taktarten wie 5/4 oder 7/8 erkennen und mitzählen." }
        gradeBand: "7-8"
        requires: [weitere-taktarten]
      # G9 Tondauer/Rhythmus 10 (Komplementärrhythmik, Polyrhythmik); NW Sek I Ende (Polyrhythmik)
      - id: polyrhythmik
        iCan: { de: "Ich kann erklären, wie mehrere Rhythmen gleichzeitig eine gemeinsame Wirkung ergeben, und sie zusammen spielen." }
        gradeBand: "9-10"
        requires: [beat-offbeat, besondere-taktarten]
      # G9 Takt/Metrum 10 (freie/gebundene Metrik); NW Sek I Ende (ametrische Musik)
      - id: freie-metrik
        iCan: { de: "Ich kann Musik mit festem Metrum von Musik ohne durchgehendes Metrum unterscheiden." }
        gradeBand: "9-10"
        requires: [besondere-taktarten]
  - id: tonhoehe-harmonik
    name: { de: "Tonhöhe, Tonleitern und Harmonik", en: "Pitch, scales and harmony" }
    competencies:
      # KC Inhaltsfeld Parameter (Tonhöhe); G9 Tonhöhe/Melodik 5 (hoch/tief, aufwärts/abwärts); RP Hoch, Tief
      - id: tonhoehe-hoch-tief
        iCan: { de: "Ich kann hohe und tiefe Töne unterscheiden und ordnen." }
        gradeBand: "5-6"
        requires: [parameter-nennen]
      # G9 Tonhöhe/Melodik 5 (Klaviertastatur, Stammtöne und abgeleitete Töne); NW 5/6 (Stammtöne)
      - id: klaviatur-tasten
        iCan: { de: "Ich kann die Tasten der Klaviatur benennen und das C finden." }
        gradeBand: "5-6"
        requires: [tonhoehe-hoch-tief]
      # G9 Tonhöhe/Melodik 5 (Oktav-Einteilung); BY Mu6 LB4 (Intervalle bis zur Oktave)
      - id: oktave
        iCan: { de: "Ich kann Oktaven auf der Klaviatur finden und Töne mit gleichem Namen in verschiedenen Oktaven benennen." }
        gradeBand: "5-6"
        requires: [klaviatur-tasten]
      # G9 Tonhöhe/Melodik 5 (Ganz- und Halbtonschritt); BY Mu5 LB4
      - id: halbtonschritte
        iCan: { de: "Ich kann Halbtonschritte auf der Klaviatur abzählen." }
        gradeBand: "5-6"
        requires: [klaviatur-tasten]
      # G9 Tonhöhe/Melodik 5 (Ganz- und Halbtonschritt, Tonskala); BY Mu5 LB4
      - id: tonleiter-ganzton-halbton
        iCan: { de: "Ich kann Ganztonschritte und Halbtonschritte unterscheiden." }
        gradeBand: "5-6"
        requires: [halbtonschritte]
      # G9 Tonhöhe/Melodik 5 (Tonwiederholung, Tonschritt, Tonsprung); NW 5/6 Melodik (Bewegungen im Tonraum)
      - id: intervall-hoeren
        iCan: { de: "Ich kann hören und beschreiben, ob eine Melodie einen Ton wiederholt, in Schritten geht oder springt." }
        gradeBand: "5-6"
        requires: [tonhoehe-hoch-tief]
      # G9 Zusammenklang/Harmonik 5 (Grund-Intervalle); BY Mu6 LB4 (Intervalle bis zur Quinte); NW 5/6 (Intervalle der Stammtöne)
      - id: intervall-benennen
        iCan: { de: "Ich kann den Abstand zwischen zwei Tönen abzählen und mit dem Namen des Intervalls benennen." }
        gradeBand: "5-6"
        requires: [intervall-hoeren, klaviatur-tasten]
      # G9 Zusammenklang/Harmonik 6 (genauere Intervallbestimmung); BY Mu6 LB4 (rein, groß, klein bis zur Oktave)
      - id: intervall-qualitaet
        iCan: { de: "Ich kann Intervalle bis zur Oktave genau bestimmen: rein, groß oder klein." }
        gradeBand: "5-6"
        requires: [intervall-benennen, halbtonschritte]
      # BY Mu5 LB4 (Dur-Tonleitern mit unterschiedlichen Grundtönen); G9 Tonhöhe/Melodik 6 (Struktur der Dur- und Molltonleitern)
      - id: dur-tonleiter-bauen
        iCan: { de: "Ich kann die Dur-Tonleiter aus Ganzton- und Halbtonschritten aufbauen." }
        gradeBand: "5-6"
        requires: [tonleiter-ganzton-halbton]
      # BY Mu6 LB4 (Tonleitern und Dreiklänge in Dur und Moll hören); RP Dur, Moll (Orientierungsstufe); NW 5/6 (Skalen)
      - id: dur-moll-hoeren
        iCan: { de: "Ich kann Dur und Moll am Klang unterscheiden." }
        gradeBand: "5-6"
        requires: [konzentriert-hoeren]
      # G9 Tonhöhe/Melodik 6 (Struktur der Molltonleitern); BY Mu6 LB4 (Aufbau mit Fachbegriffen erläutern)
      - id: moll-aufbau
        iCan: { de: "Ich kann erklären, worin sich der Aufbau von Moll von Dur unterscheidet." }
        gradeBand: "5-6"
        requires: [dur-tonleiter-bauen, dur-moll-hoeren]
      # G9 Tonhöhe/Melodik 6 (Leitton); BY Mu6 LB4 (Tonvorräte im Moll-Bereich)
      - id: moll-varianten
        iCan: { de: "Ich kann natürliches, harmonisches und melodisches Moll unterscheiden und erklären, was ein Leitton ist." }
        gradeBand: "5-6"
