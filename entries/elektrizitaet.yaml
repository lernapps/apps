title: { de: Elektrizität, en: Electricity }
subject: physik
grades: [5, 6, 7, 8]
summary:
  de: >-
    Lernende erklären sich Schritt für Schritt, wie ein Stromkreis funktioniert, welche Stoffe den Strom leiten und wie
    sich Reihen- und Parallelschaltung unterscheiden. In Klasse 7 und 8 kommen Stromstärke, Spannung, Widerstand und das
    ohmsche Gesetz dazu. Auf jeder Seite üben sie an einem Stromkreis, in dem man den Strom laufen sieht, bauen
    Schaltungen und messen. Die App gibt es auf Deutsch und Englisch.
  en: >-
    Learners work out step by step how a circuit works, which materials conduct electricity and how series and
    parallel circuits differ. In grades 7 and 8, current, voltage, resistance and Ohm's law follow. On every page they
    practise with a circuit in which you can see the current flow, build circuits and measure. The app is available in
    German and English.
