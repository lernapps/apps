title: Brüche und Dezimalzahlen
subject: mathematik
grades: [5, 6]
summary: >-
  Du erkundest Brüche mit Kreis, Streifen, Plättchen und Zahlenstrahl und verschiebst die Modelle selbst. Du kürzt und
  erweiterst, rechnest mit Brüchen und Dezimalzahlen und löst Aufgaben zu Prozent, Teilern, Primfaktoren, ggT und kgV.
  Zu jedem Kapitel gibt es eine kurze Wiederholung der Voraussetzungen und Übungen mit Rückmeldung, die erklärt, warum
  eine Antwort stimmt oder nicht.
