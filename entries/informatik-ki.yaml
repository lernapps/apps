title:
  de: Wie Maschinen aus Daten lernen
  en: How machines learn from data
subject: informatik
strand: informatik/daten
grades: [5, 6, 9, 10]
summary:
  de: >-
    Du findest künstliche Intelligenz in deinem Alltag und trainierst selbst eine Maschine: Erst suchst du mit
    Tierkarten eine Regel für Hund oder Katze, dann füllst du den Trainingsbeutel einer Maschine mit Beispielen. So
    siehst du: Was in den Beutel kommt, bestimmt, was herauskommt.
    In der 9. Klasse findest du heraus, wie einseitig ausgewählte Beispiele eine Maschine Fehler machen lassen.
  en: >-
    You find artificial intelligence in your everyday life and train a machine yourself: first you look for a rule
    for dog or cat with animal cards, then you fill a machine's training bag with examples. You see: what goes into
    the bag decides what comes out.
    In Year 10 you find out how examples chosen one-sidedly make a machine go wrong.
