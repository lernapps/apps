  de: >-
    In Herr Brauns Unterricht in Lindenberg baust du mit Peter eine Laut-Schrift-Tafel auf. Du lernst Buchstaben,
    Umlaute, ß, Vokallänge und Großschreibung (A1) sowie Auslautverhärtung, Präfixakzent, ss/ß, Fremdwörter und
