title: { de: Programmierwerkstatt, en: Coding workshop }
subject: informatik
grades: [7, 8, 9, 10]
summary:
  de: >-
    Du programmierst mit Blöcken und Kiko, ein Roboter, führt dein Programm aus. Er läuft durch Labyrinthe und
    zeichnet Bilder; dabei lernst du Reihenfolge, Schleifen und Verzweigungen. Dein Programm muss jedes Rätsel einer
    Aufgabe lösen, und die Rückmeldung sagt dir, wo es hakt.
  en: >-
    You program with blocks, and Kiko, a robot, runs your program. It walks through mazes and draws pictures; on the
    way you learn about order, loops and choices. Your program has to solve every puzzle of a task, and the feedback
    tells you where it goes wrong.
