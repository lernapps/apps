summary:
  de: >-
    Du begleitest die Klasse 6b auf ihrer Klassenfahrt und stellst dieselbe Information immer wieder neu dar: als
    Tabelle, Diagramm und Baum, als Zahl aus Bits, als Pixelbild und als Geheimschrift. Mit Bit-Karten, einem
    Pixel-Editor und einer Caesar-Scheibe probierst du selbst aus, wie ein Computer alles mit 0 und 1 speichert.
  en: >-
    You join class 6b on their school trip and show the same information in new ways again and again: as a table,
    a chart and a tree, as a number made of bits, as a pixel picture and in secret writing. With bit cards, a pixel
    editor and a Caesar disc you try out for yourself how a computer stores everything with 0 and 1.
