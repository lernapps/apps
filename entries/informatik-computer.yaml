summary:
  de: >-
    Du gehst mit Jona und Selin durch die Ausstellung „Der gläserne Computer“. Du findest Informatiksysteme in
    deinem Alltag, unterscheidest Hardware und Software, bedienst ein Malprogramm und schaust in einen Computer
    hinein. Mit dem EVA-Prinzip ordnest du Geräte ein und wählst begründet ein Gerät für eine Aufgabe.
  en: >-
    You walk through the exhibition “The glass computer” with Jona and Selin. You find computer systems in your
    everyday life, tell hardware from software, use a drawing program and look inside a computer. With the IPO
    model you sort devices and choose a device for a task with good reasons.
