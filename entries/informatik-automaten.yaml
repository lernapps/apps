title:
  de: Automaten und Zustände
  en: Automata and states
subject: informatik
strand: informatik/sprachen-automaten
grades: [5, 6]
summary:
  de: >-
    Du spielst mit der Klasse 6b einen Saftautomaten aus einem Karton und findest heraus, warum derselbe Knopf einmal
    einen Saft bringt und einmal nicht: Der Automat merkt sich etwas, seinen Zustand. Im Automaten-Simulator liest du
    Zustandsdiagramme mit Kreisen und Pfeilen, sagst voraus, wohin ein Automat springt, und ergänzt fehlende Pfeile.
  en: >-
    You play a cardboard juice machine with class 6b and find out why the same button brings a juice one time and
    nothing another time: the machine remembers something, its state. In the automaton simulator you read state
    diagrams with circles and arrows, predict where a machine jumps and add missing arrows.
