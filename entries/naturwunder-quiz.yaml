summary:
  de: >-
    Im Quiz beantworten Schülerinnen und Schüler Fragen zu Naturwundern der Erde: Gebirge und Vulkane, Wasserfälle,
    Wüsten, Höhlen, Küsten und Riffe auf allen Kontinenten. Nach jeder Antwort lesen sie kurz zu jeder Möglichkeit
    und können im Wikipedia-Artikel weiterlesen.
  en: >-
    In the quiz, students answer questions about natural wonders of the Earth: mountains and volcanoes, waterfalls,
    deserts, caves, coasts and reefs on all continents. After each answer, they read a short note on every option
    and can read on in the Wikipedia article.
