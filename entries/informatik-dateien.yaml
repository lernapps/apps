title:
  de: "Meine Dateien: ordnen, speichern, schützen"
  en: "My files: organise, store, protect"
subject: informatik
strand: informatik/informatiksysteme
grades: [5, 6, 7, 8]
summary:
  de: >-
    Du hilfst Mia, ihr Tablet aufzuräumen: Du legst Dateien in Ordner, baust den Ordnerbaum in einem Dateimanager
    nach und findest Dateien über ihren Pfad wieder. Dann vergleichst du Tablet, USB-Stick und Cloud nach Platz,
    Erreichbarkeit und Sicherheit und rechnest mit MB und GB.
    In der 7. Klasse sicherst du Mias Dateien, bildest sichere Passwörter, erkennst, wie Schadsoftware ins Gerät
    kommt, und schützt es.
  en: >-
    You help Mia tidy up her tablet: you put files into folders, rebuild the folder tree in a file manager and find
    files again by their path. Then you compare the tablet, a USB stick and the cloud by space, access and safety,
    and work with MB and GB.
    In Year 8 you back up Mia's files, make secure passwords, spot how malware gets onto a device and protect it.
