title:
  de: Netze und Reihen von Daten
  en: Networks and rows of data
subject: informatik
strand: informatik/daten
grades: [7, 8]
summary:
  de: >-
    Die Klasse 7b plant im Klassenchat den Weg zum Schwimmbad und einen Stadtführer zum Klicken. Dabei lernst du Netze
    aus Knoten und Kanten kennen: den Graphen und den Hypertext. Du legst sie erst mit Fäden und Karten und baust sie
    dann am Rechner, mit Pfeilen für Wege, die nur in eine Richtung gehen.
  en: >-
    Class 7b uses the class chat to plan the way to the swimming pool and a town guide to click through. On the way
    you get to know networks made of nodes and edges: the graph and the hypertext. First you lay them out with string
    and cards, then you build them on the computer, with arrows for ways that go in one direction only.
