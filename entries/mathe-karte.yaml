title: Mathe-Karte
subject: Mathematik
grades: [8]
summary: >-
  Mathe selbst ausprobieren und üben: Prozentrechnung, binomische Formeln und
  Wahrscheinlichkeit. Zu jedem Thema gibt es eine Erklärung, ein Bild, beliebig
  viele Aufgaben mit sofortiger Rückmeldung und einen kurzen Test. Eine Karte
  zeigt, welche Themen schon dabei sind.
url: https://lernapps.net/mathe-karte/
