title:
  de: "Leben in der digitalen Welt: Fälle und Urteile"
  en: "Life in the digital world: cases and judgements"
subject: informatik
strand: informatik/gesellschaft
grades: [5, 6]
summary:
  de: >-
    Du erlebst mit der Klasse 6b drei Fälle aus der digitalen Welt: ein Foto aus dem Netz für ein Plakat, einen
    Berufsbesuch und eine KI bei den Hausaufgaben. Du lernst, was du mit fremden Bildern tun darfst, wie Computer die
    Arbeit verändern und welche Chancen und Risiken KI hat. Am Ende jedes Falls prüfst du die Gründe und fällst dein
    eigenes Urteil auf der Urteilsskala.
  en: >-
    You follow class 6b through three cases from the digital world: a photo from the internet for a poster, visitors
    from the world of work and an AI for homework. You learn what you may do with other people's pictures, how
    computers change work and what the opportunities and risks of AI are. At the end of each case you weigh the
    reasons and make your own judgement on the judgement scale.
