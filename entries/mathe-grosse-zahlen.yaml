summary: >-
  Du legst Zahlen in die Stellenwerttafel, bündelst Plättchen und liest große Zahlen bis zu den Milliarden.
  Am Zahlenstrahl mit Lupe ordnest und rundest du Zahlen. Dann rechnest du schriftlich, nutzt Rechengesetze
  und prüfst jedes Ergebnis mit einem Überschlag. Aufgaben geben sofort eine Rückmeldung mit Grund.
