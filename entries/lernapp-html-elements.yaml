title:
  de: "HTML-Elemente: was, wann und warum"
  en: "HTML Elements: what, when and why"
subject: { de: Informatik, en: Computer Science }
grades: [9, 10, 11, 12, 13]
summary:
  de: >-
    In diesem Quiz beantworten Lernende Fragen zu HTML-Elementen aus dem ganzen Spektrum: was ein Element tut, wann
    man es benutzt und wann nicht, wie es die Barrierefreiheit beeinflusst (implizite ARIA-Rollen) und welchen
    Baseline-Status es hat. Nach jeder Antwort lesen sie kurz zu jeder Möglichkeit und finden einen Link zu den
    MDN-Dokumenten. Mit Positiv- und Negativbeispielen, für HTML-Lernende vom Anfang bis fortgeschritten.
  en: >-
    In this quiz, learners answer questions about HTML elements across the whole spectrum: what an element does,
    when to use it and when not, its effect on accessibility (implicit ARIA roles), and its Baseline status. After
    each answer they read a short note on every option and find a link to the MDN docs. With positive and negative
    examples, for HTML learners from beginner to advanced.
url: https://d-koppenhagen.github.io/lernapp-html-elements/
