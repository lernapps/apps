summary: >-
  Du vergrößerst und verkleinerst Figuren mit der zentrischen Streckung und berechnest mit den Strahlensätzen
  Strecken, die du nicht messen kannst, zum Beispiel die Höhe eines Turms. Du legst Quadrate um und entdeckst den Satz
  des Pythagoras, bestimmst mit Sinus, Kosinus und Tangens Seiten und Winkel im rechtwinkligen Dreieck und nutzt Sinus-
  und Kosinussatz in beliebigen Dreiecken.
